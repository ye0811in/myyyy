 제26조의2에 따른 국세부과의 제척기간이 지 난 후에 그 제척기간 이전 과세기간의 이월결손금이 확인된 경우 그 이월결손금은 공제한다.","a":"X","e":"「국세기본법」 제26조의2에 따른 국세부과의 제척기간이 지난 후에 그 제척기간 이전 과세기간의 이월결손금이 확 인된 경우 그 이월결손금은 공제하지 아니한다.","pg":388},{"id":2050,"ch":45,"n":15,"q":"공장재단 또는 광업재단을 대여하는 사업에서 발생하는 결 손금은 그 과세기간의 종합소득과세표준을 계산할 때 사업 성이 있는 부동산임대업 사업소득에서 공제한 후 다른 종합 소득에서 공제한다.","a":"X","e":"공장재단 또는 광업재단을 대여하는 소득은 부동산임대 업에 해당하는 것으로 보아 사업소득으로 과세한다. 따라 서 공장재단 또는 광업재단을 대여하는 사업에서 발생하 는 결손금은 다른 종합소득에서 공제하지 아니한다.","pg":388},{"id":2051,"ch":45,"n":16,"q":"결손금 및 이월결손금을 공제할 때 해당 과세기간에 결손금 이 발생하고 이월결손금이 있는 경우에는 이월결손금을 먼 저소득금액에서 공제한다.","a":"X","e":"결손금 및 이월결손금을 공제할 때 해당 과세기간에 결손 금이 발생하고 이월결손금이 있는 경우에는 그 과세기간 의 결손금을 먼저 소득금액에서 공제한다.","pg":388},{"id":2052,"ch":45,"n":17,"q":"해당 과세기간의 소득금액에 대하여 추계신고를 하거나 추 계조사결정하는 경우에는 이월결손금 공제 규정을 적용하는 것이 원칙이다.","a":"X","e":"해당 과세기간의 소득금액에 대하여 추계신고를 하거나 추계조사결정하는 경우에는 이월결손금 공제 규정을 적 용하지 아니하는 것이 원칙이다.","pg":388},{"id":2053,"ch":45,"n":18,"q":"소득금액을 추계신고하는 경우에는 이월결손금 공제규정을 적용하지 않는다. 다만, 천재지변으로 장부가 멸실되어 추계 신고를 하는 경우라면 이월결손금 공제규정을 적용한다.","a":"O","e":"","pg":389},{"id":2054,"ch":45,"n":19,"q":"결손금 및 이월결손금을 공제할 때 종합과세되는 배당소득 또는 이자소득이 있으면 그 배당소득 또는 이자소득 중 기 본세율을 적용받는 부분에 대해서는 공제가 되지 않는다.","a":"X","e":"결손금 및 이월결손금을 공제할 때 종합과세되는 배당소 득 또는 이자소득이 있으면 그 배당소득 또는 이자소득 중 기본세율을 적용받는 부분에 대해서는 사업자가 그 소 득금액의 범위에서 약정된 손익분배비율에 따라 해당 공 제 여부 및 공제금액을 결정할 수 있다. 비교 결손금 및 이월결손금을 공제할 때 배당소득 또는 이자소득 중 원천징수세율을 적용받는 부분은 결손금 또는 이월결손금의 공 제대상에서 제외함","pg":389},{"id":2055,"ch":45,"n":20,"q":"중소기업을 경영하는 거주자가 그 중소기업의 사업소득금액 을 계산할 때 해당 과세기간의 이월결손금이 발생한 경우(부 등산임대업에서 발생한 이월결손금 제외) 이를 해당 과세기 간의 다른 종합소득에서 공제하는 대신 직전 과세기간으로 소급공제하여, 직전 과세기간의 그 중소기업의 사업소득에 부과된 종합소득 결정세액을 한도로 하여 결손금 소급공제 세액을 환급신청할 수 있다.","a":"X","e":"중소기업을 경영하는 거주자가 그 중소기업의 사업소득 금액을 계산할 때 해당 과세기간의 이월결손금이 발생한 경우(부동산임대업에서 발생한 이월결손금 제외)에는 직 전 과세기간의 그 중소기업의 사업소득에 부과된 종합소 득 결정세액을 한도로 하여 결손금 소급공제세액을 환급 신청할 수 있으나 사업소득의 결손금을 해당 과세기간의 다른 종합소득에서 먼저 공제하고 남은 결손금에 한해 직 전 과세기간에서 소급공제할 수 있다.","pg":389},{"id":2056,"ch":45,"n":21,"q":"결손금소급공제 환급요건을 갖춘 자가 환급을 받으려면 과 세표준확정신고기한까지 납세지 관할세무서장에게 환급을 신청하여야 하며, 환급 신청을 받은 납세지 관할세무서장은 환급신청일로부터 30일 이내 환급세액을 결정하여 「국세기 본법」에 따라 환급하여야 한다. 410 제6편 소득세법","a":"X","e":"결손금소급공제 환급요건을 갖춘 자가 환급을 받으려면 과세표준확정신고기한까지 납세지 관할세무서장에게 환 급을 신청하여야 하며, 환급 신청을 받은 납세지 관할세 무서장은 지체없이 환급세액을 결정하여 「국세기본법」에 따라 환급하여야 한다.","pg":389},{"id":2057,"ch":45,"n":22,"q":"결손금 소급공제에 대한 환급규정은 해당 거주자가 과세표 준확정신고기한까지 결손금이 발생한 과세기간과 그 직전 과세기간의 소득에 대한 소득세의 과세표준 및 세액을 각각 신고한 경우에만 적용한다.","a":"O","e":"","pg":390},{"id":2058,"ch":45,"n":23,"q":"납세지 관할 세무서장은 소득세를 환급한 후 결손금이 발생 한 과세기간에 대한 소득세의 과세표준과 세액을 경정함으 로써 이월결손금이 감소된 경우에는 환급세액 중 그 감소된 이월결손금에 상당하는 세액을 법령으로 정하는 바에 따라 경정일이 속하는 과세기간의 소득세로서 징수한다.","a":"X","e":"납세지 관할 세무서장은 소득세를 환급한 후 결손금이 발 생한 과세기간에 대한 소득세의 과세표준과 세액을 경정 함으로써 이월결손금이 감소된 경우에는 환급세액 중 그 감소된 이월결손금에 상당하는 세액을 법령으로 정하는 바에 따라 그 이월결손금이 발생한 과세기간의 소득세로 서 징수한다.","pg":390},{"id":2059,"ch":45,"n":24,"q":"중소기업을 경영하는 거주자가 그 중소기업의 사업소득금액 을 계산할 때 해당 과세기간의 이월결손금(부동산 임대업에 서 발생한 이월결손금 포함)이 발생한 경우에는 이를 소급공 제하여 직전 과세기간의 그 중소기업의 사업소득에 대한 종 합소득세액을 환급신청할 수 있다.","a":"X","e":"중소기업을 경영하는 거주자가 그 중소기업의 사업소득 금액을 계산할 때 해당 과세기간의 이월결손금(부동산 임 대업에서 발생한 이월결손금 제외)이 발생한 경우에는 이 를 소급공제하여 직전 과세기간의 그 중소기업의 사업소 득에 대한 종합소득세액을 환급신청할 수 있다.","pg":390},{"id":2060,"ch":45,"n":25,"q":"소급공제한 이월결손금에 대해서 이월결손금의 이월공제 규 정을 적용할 때에는 그 이월결손금을 공제받은 금액으로 본 다.","a":"O","e":"","pg":390},{"id":2061,"ch":45,"n":26,"q":"사업소득이 발생하는 사업을 공동으로 경영하고 그 손익을 분배하는 공동사업의 경우에는 공동사업장을 1거주자로 보 아 해당 공동사업자별로 소득금액을 계산한다.","a":"X","e":"사업소득이 발생하는 사업을 공동으로 경영하고 그 손익 을 분배하는 공동사업의 경우에는 공동사업장을 1거주자 로 보아 공동사업장별로 그 소득금액을 계산하고 약정된 손익분배비율에 따라 해당 공동사업자별로 납세의무를 진다.","pg":390},{"id":2062,"ch":45,"n":27,"q":"공동사업에서 발생한 소득금액은 해당 공동사업을 경영하는 각 사업자 간에 약정된 손익분배비율이 있더라도 지분비율 에 의하여 분배되었거나 분배될 소득금액에 따라 각 공동사 업자별로 분배한다.","a":"X","e":"공동사업에서 발생한 소득금액은 해당 공동사업을 경영 하는 각 사업자 간에 약정된 손익분배비율(약정된 손익분 매비율이 없는 경우에는 지분비율)에 의하여 분배되었거 나 분배될 소득금액에 의하여 각 공동사업자별로 분배한 다.","pg":391},{"id":2063,"ch":45,"n":28,"q":"「소득세법」상 공동사업자는 해당 공동사업자별로 납세의무 를 지나 주된 공동사업자에게 합산과세되는 경우에는 주된 공동사업자의 특수관계인은 손익분배비율에 해당하는 그의 소득금액을 한도로 주된 공동사업자와 연대하여 납세의무를 진다.","a":"O","e":"","pg":391},{"id":2064,"ch":45,"n":29,"q":"주된 공동사업자에게 합산과세되는 경우 그 합산과세 되는 소득금액에 대해서는 주된 공동사업자의 특수관계인은 공동 사업소득금액 전액에 대하여 주된 공동사업자와 연대하여 납세의무를 진다.","a":"X","e":"특수관계인의 소득금액이 주된 공동사업자에게 합산과세 되는 경우에는 그 합산과세 되는 소득금액에 대해서는 주 된 공동사업자의 특수관계인은 손익분배비율에 해당하는 그의 소득금액을 한도로 주된 공동사업자와 연대하여 납 세의무를 진다.","pg":391},{"id":2065,"ch":45,"n":30,"q":"조세를 회피할 목적 등 공동사업 합산과세 사유에 해당하여 특수관계인의 소득금액이 주된 공동사업자에게 합산과세되 는 경우의 주된 공동사업자는 종합소득금액이 큰 공동사업 자를 말한다.","a":"X","e":"조세를 회피할 목적 등 공동사업 합산과세 사유에 해당하 여 특수관계인의 소득금액이 주된 공동사업자에게 합산 과세되는 경우의 주된 공동사업자는 그 손익분배비율이 큰 공동사업자를 말한다.","pg":391},{"id":2066,"ch":45,"n":31,"q":"거주자 1인과 특수관계인이 공동 사업자에 포함되어 있는 경우로서 손익분배비율을 거짓으로 정하는 등의 사유가 있 는 경우에는 손익분배비율에 따른 소득분배규정에 따라 소 득금액을 산정한다. OX 412 제6편 소득세법","a":"X","e":"거주자 1인과 특수관계인이 공동 사업자에 포함되어 있는 경우로서 손익분배비율을 거짓으로 정하는 등의 사유가 있는 경우에는 손익분배비율에 따른 소득분배규정에 따 라 소득금액을 산정하는 것이 아니라, 특수관계자의 소득 금액을 주된 공동사업자의 소득으로 합산하여 산정한다.","pg":391},{"id":2067,"ch":45,"n":32,"q":"거주자 1인과 그의 특수관계인이 공동사업자에 포함되어 있 는 경우 그 특수관계인의 소득금액은 손익분배비율이 큰 공 동사업자의 소득금액으로 본다.","a":"X","e":"거주자 1인과 그의 특수관계인이 공동사업자에 포함되어 있기 때문에 무조건 합산과세 되는 것이 아니라, 조세를 회피할 목적으로 공동사업을 영위하는 등 공동사업합산 과세 사유에 해당하는 경우에만 특수관계인의 소득금액 을 주된 공동사업자의 소득으로 합산하여 과세한다.","pg":392},{"id":2068,"ch":45,"n":33,"q":"「소득세법」상 공동사업장에서 발생한 결손금은 그 이후 15 년(2020.1.1. 전에 발생한 결손금은 10년)간 공동사업장에서 발생하는 소득과 통산한다.","a":"X","e":"「소득세법」상 공동사업장에서 발생한 결손금은 각 공동사 업자별로 분배된 금액 범위에서 결손금 공제방법에 의하 여 각 공동사업자의 다른 사업장의 동일 소득 또는 다른 종합소득과 통산한다.","pg":392},{"id":2069,"ch":45,"n":34,"q":"공동사업장에서 발생한 소득금액에 대하여 원천징수된 세액 은 각 공동사업자의 손익분배비율에 따라 배분하고 공동사 업장에 관련되는 가산세는 배분하지 아니한다. O:X","a":"X","e":"공동사업장에서 발생한 소득금액에 대하여 원천징수된 세액과 공동사업장에 관련되는 가산세는 각 공동사업자 의 손익분배비율에 따라 배분한다.","pg":392},{"id":2070,"ch":45,"n":35,"q":"공동사업장의 해당 공동사업을 경영하는 각 거주자는 자신 의 주소지 관할 세무서장에게 사업자등록을 해야 한다.","a":"X","e":"공동사업장에 대해서는 그 공동사업장을 1사업자로 보아 사업자등록에 관한 규정을 적용한다.","pg":392},{"id":2071,"ch":45,"n":36,"q":"공동사업장에 대해서는 당해 공동사업장을 1사업자로 보아 장부기장 및 사업자등록에 관한 규정을 적용한다.","a":"O","e":"","pg":392},{"id":2072,"ch":45,"n":37,"q":"공동사업장의 소득금액을 계산하는 경우 기업업무추진비 한 도액, 지정기부금 한도액 계산은 공동사업에 출자한 공동사 업자별로 각각 계산한다.","a":"X","e":"공동사업장의 소득금액책을을 계산하 는• 경경우 기업업무추진비 한도액, 지정기부금 한도액 계산은 공동사업장별로 계산 해야 한다.","pg":392},{"id":2073,"ch":45,"n":38,"q":"공동사업자가 과세표준확정신고를 하는 때에는 과세표준 확 정신고서와 함께 당해 공동사업장에서 발생한 소득과 그 외 각 소득을 구분한 계산서를 제출하여야 한다. COX","a":"O","e":"","pg":392},{"id":2074,"ch":45,"n":39,"q":"공동사업에서 발생하는 소득금액의 결정 또는 경정은 공동 사업장 소재지의 관할 세무서장이 하는 것이 원칙이다.","a":"X","e":"공동사업에서 발생하는 소득금액의 결정 또는 경정은 대 공동사업자의 주소지 관할 세무서장이 하는 것이 원칙 이다.","pg":393},{"id":2075,"ch":45,"n":40,"q":"피상속인의 소득금액에 대한 소득세를 상속인에게 과세할 것은 이를 상속인의 소득금액으로 보고 상속인의 소득금액 에 대한 소득세와 합산하여 계산하여야 한다.","a":"X","e":"피상속인의 소득금액에 대한 소득세를 상속인에게 과세 할 것은 이를 상속인의 소득금액에 대한 소득세와 구분하 여 계산하여야 한다.","pg":393},{"id":2076,"ch":45,"n":41,"q":"연금계좌의 가입자가 사망하였으나 그 배우자가 연금수령 없이 해당 연금계좌를 상속으로 승계하는 경우 해당 연금계 좌에 있는 피상속인의 소득금액과 상속인의 소득금액을 구 분하여 소득세를 계산한다.","a":"X","e":"연금계좌의 가입자가 사망하였으나 그 배우자가 연금외 수령 없이 해당 연금계좌를 상속으로 승계하는 경우에는 해당 연금계좌에 있는 피상속인의 소득금액은 상속인의 소득금액으로 보아 소득세를 계산한다.","pg":393},{"id":2077,"ch":45,"n":42,"q":"내국법인이 발행한 채권에서 발생하는 이자와 할인액은 당 해 채권의 상환기간 중에 보유한 거주자 또는 비거주자에게 그 보유기간별 이자상당액이 각각 귀속되는 것으로 보아 소 득금액을 계산한다.","a":"O","e":"","pg":393},{"id":2078,"ch":45,"n":43,"q":"거주자가 채권을 발행법인에게 매도하는 경우에는 원천징수 기간의 이자 등 상당액을 이자소득으로 보고, 거주자를 원천 징수의무자로 한다.","a":"X","e":"거주자가 채권을 발행법인에게 매도하는 경우에는 원천 징수기간의 이자 등 상당액을 이자소득으로 보고, 해당 채권의 발행법인을 원천징수의무자로 한다.","pg":393},{"id":2079,"ch":45,"n":44,"q":"거주자가 채권을 내국법인에게 매도하는 경우에는 당해 거 주자가 자신의 보유기간 이자 등 상당액을 이자소득으로 보 아 소득세를 원천징수하여야 한다. OX 414 제6편 소득세법","a":"X","e":"거주자가 채권을 내국법인에게 매도하는 경우에는 당해 거주자가 자신의 보유기간 이자 등 상당액을 이자소득으 로 보아 소득세를 원천징수하지 않는다. \"매도자가 거주자이고, 매수자가 거주자인 경우에는 원천징수의 무가 없음을 주의한다.","pg":393},{"id":2080,"ch":45,"n":45,"q":"종합소득과세표준확정신고 후 예금 또는 신탁계약의 중도 해지로 이미 지난 과세기간에 속하는 이자소득금액이 감액 된 경우 경정청구를 통해서만 환급받아야 한다.","a":"X","e":"종합소득과세표준확정신고 후 예금 또는 신탁계약의 중 도해지로 이미 지난 과세기간에 속하는 이자소득금액이 감액된 경우 그 이자소득금액의 계산에 있어서는 그 중도 해지일이 속하는 과세기간의 종합소득금액에 포함된 이 자소득금액에서 그 감액된 이자소득금액을 뺄 수 있다.","pg":394},{"id":2081,"ch":46,"n":1,"q":"종합소득금액에서 공제하지 못한 금액을 퇴직소득금액· 양 도소득금액에서 공제할 수 없다.","a":"O","e":"","pg":395},{"id":2082,"ch":46,"n":2,"q":"종합소득이 있는 거주자(법인이 아닌 단체 포함)의 종합소득 금액에서 공제되는 기본공제액은 기본공제대상자 1명당 150 만원이다.","a":"X","e":"종합소득이 있는 거주자(자연인만 해당)의 종합소득금액 에서 공제되는 기본공제액은 기본공제대상자 1명당 150 만원이다. 법인이 아닌 단체의 경우에는 자연인이 아니므 로 기본공제를 적용할 수 없다.","pg":395},{"id":2083,"ch":46,"n":3,"q":"「소득세법」상 장애인과 기초생활수급자의 경우 나이 및 소 득금액의 제한을 받지 아니하고 기본공제대상에 해당한다.","a":"X","e":"「소득세법」상 장애인과 기초생활수급자의 경우 나이의 제 한을 받지 아니하고 기본공제대상에 해당하지만, 소득금 액의 제한은 받는다.","pg":395},{"id":2084,"ch":46,"n":4,"q":"「소득세법」상 20세 이상 또는 60세 이하인 직계존비속에 대 하여는 근로능력이 있는 것으로 보아 기본공제대상에서 제 외하고 있다. 다만, 장애인과 기초생활수급자의 경우 나이 요건은 고려하지 않는다.","a":"X","e":"「소득세법」상 20세 초과 또는 60세 미만인 직계존비속에 대하여는 근로능력이 있는 것으로 보아 기본공제대상에 서 제외하고 있다. 다만, 장애인과 기초생활수급자의 경 우 나이 요건은 고려하지 않는다.","pg":395},{"id":2085,"ch":46,"n":5,"q":"부양가족이 근로소득만 있는 경우로서 생계 및 나이 등 다 른 요건을 모두 충족한다면 해당 과세기간의 총급여액이 500만원(근로소득금액 150만원) 이하인 경우에는 기본공제 대상에 해당한다.","a":"O","e":"","pg":395},{"id":2086,"ch":46,"n":6,"q":"배우자와 직계비속 ·입양자는 동거가족이 아니더라도 생계 를 같이 하는 부양가족으로 본다. OIX 416 제6편 소득세법","a":"O","e":"","pg":395},{"id":2087,"ch":46,"n":7,"q":"거주자의 부양가족 중 거주자(그 배우자 포함)의 직계존속이 주거의 형편에 따라 별거하고 있는 경우에도 이를 생계를 같이하는 자로 본다.","a":"O","e":"","pg":396},{"id":2088,"ch":46,"n":8,"q":"직계비속의 배우자는 기본공제대상이 아니나 거주자의 직계 비속과 그 배우자가 모두 장애인이면 직계비속의 배우자도 기본공제대상에 해당한다.","a":"O","e":"","pg":396},{"id":2089,"ch":46,"n":9,"q":"기본공제대상자가 아닌 자도 추가공제 대상자가 될 수 있다.","a":"X","e":"추가공제를 적용받기 위해서는 먼저 기본공제대상자에 해당해야 하므로 기본공제를 적용받지 못한 자는 추가공 제도 적용받을 수 없다.","pg":396},{"id":2090,"ch":46,"n":10,"q":"기본공제대상자가 60세 이상인 경우 1명당 연 200만원을 추가로 공제한다.","a":"X","e":"기본공제대상자가 70세 이상인 경우 1명당 연 100만원을 추가로 공제한다.","pg":396},{"id":2091,"ch":46,"n":11,"q":"기본공제대상자가 대통령령으로 정하는 장애인에 해당하는 경우에는 거주자의 해당 과세기간 종합소득금액에서 기본공 제 외에 1명당 연 100만원의 금액을 추가로 공제한다. oix","a":"X","e":"기본공제대상자가 대통령령으로 정하는 장애인에 해당하 는 경우에는 거주자의 해당 과세기간 종합소득금액에서 기본공제 외에 1명당 연 200만원의 금액을 추가로 공제 한다.","pg":396},{"id":2092,"ch":46,"n":12,"q":"거주자의 배우자로서 해당 과세기간의 소득금액 합계액이 500만원인 경우 연 150만원의 금액을 그 거주자의 해당 과 세기간의 종합소득금액에서 공제한다.","a":"X","e":"배우자는 나이요건은 적용하지 않지만, 연간 종합소득금 액과 퇴직소득 및 양도소득의 합계액이 100만원 이하의 소득요건은 적용된다. 따라서 소득금액의 합계액이 500 만원인 경우에는 기본공제 대상자에 포함되지 않는다. 1","pg":396},{"id":2093,"ch":46,"n":13,"q":"「소득세법」상 기본공제와 추가공제를 합한 인적공제 합계액 이 종합소득금액을 초과하는 경우 그 초과하는 공제액은 없 는 것으로 본다.","a":"O","e":"주","pg":396},{"id":2094,"ch":46,"n":14,"q":"기본공제대상자가 추가공제 사유에 해당되어 거주자의 종합 소득금액에서 공제받는 추가공제는 모두 중복적용이 가능하 다.","a":"X","e":"추가공제는 원칙적으로 중복적용이 가능하지만, 부녀자 공제와 한부모공제에 모두 해당되면 한부모공제를 적용 한다.","pg":397},{"id":2095,"ch":46,"n":15,"q":"「소득세법」에서는 해당 과세기간 중에 출생한 자는 기본공 제대상이나, 해당 과세기간 중에 사망한 자는 기본공제대상 이 아니다.","a":"X","e":"해당 과세기간 중에 사망한 자는 사망일 전날의 상황에 따르므로 해당 과세기간까지는 기본공제대상에 해당한 다.","pg":397},{"id":2096,"ch":46,"n":16,"q":"「소득세법」은 해당 과세기간 중 장애가 치유되어 해당 과세 기간에는 장애인이 아닌 경우 장애인 공제(추가공제)를 적용 받을 수 없다.","a":"X","e":"「소득세법」은 해당 과세기간의 종료일 전에 장애가 치유 된 사람에 대해서 치유일 전날의 상황에 따르므로 해당 과세기간에 장애인 공제를 적용한다.","pg":397},{"id":2097,"ch":46,"n":17,"q":"해당 과세기간의 중도에 사망하였거나 외국에서 영주하기 위하여 출국한 거주자의 공제대상가족으로서 상속인 등 다 른 거주자의 공제대상가족에 해당하는 사람에 대해서는 피 상속인 또는 출국한 거주자의 공제대상가족으로 하지 않는 다.","a":"X","e":"해당 과세기간의 중도에 사망하였거나 외국에서 영주하 기 위하여 출국한 거주자의 공제대상가족으로서 상속인 등 다른 거주자의 공제대상가족에 해당하는 사람에 대해 서는 피상속인 또는 출국한 거주자의 공제대상가족으로 한다.","pg":397},{"id":2098,"ch":46,"n":18,"q":"직계비속이 해당 과세기간 중 20세가 된 경우에는 기본공제 대상이 될 수 없다.","a":"X","e":"해당 과세기간 중에 해당 나이에 해당하는 날이 하루라도 있는 경우에는 공제대상자로 본다. 직계비속의 나이요건 은 20세 이하(20세가 되는 날과 그 이전 기간)이므로, 직 계비속이 해당 과세기간 중 20세가 된 경우에는 기본공 제대상이 될 수 있다.","pg":397},{"id":2099,"ch":46,"n":19,"q":"신고서 기재가 명확하지 않은 경우로서 거주자의 공제대상 배우자가 다른 거주자의 공제대상 부양가족에 해당하는 때 에는 직전 과세기간에 부양가족으로 인적공제를 받은 거주 자의 공제대상 부양가족으로 한다. OX 418 제6편 소득세법","a":"X","e":"신고서 기재가 명확하지 않은 경우로서 거주자의 공제대 상 배우자가 다른 거주자의 공제대상 부양가족에 해당하 는 때에는 공제대상배우자로 한다.","pg":397},{"id":2100,"ch":46,"n":20,"q":"둘 이상의 거주자가 공제대상 가족을 서로 자기의 공제대상 가족으로 하여 신고서에 적은 경우에는 먼저 신고한 거주자 의 공제대상 가족으로 한다.","a":"X","e":"둘 이상의 거주자가 공제대상 가족을 서로 자기의 공제대 상가족으로 하여 신고서에 적은 경우 다음에 따른다. ① 거주자의 공제대상 배우자가 다른 거주자의 공제대 상 부양가족에 해당하는 때에는 공제 대상 배우자 로 한다. ② 거주자의 공제대상 부양가족이 다른 거주자의 공제 대상 부양가족에 해당하는 때에는 직전 과세기간에 부양가족으로 인적공제를 받은 거주자의 공제대상 부양가족으로 한다. 다만, 직전 과세기간에 부양가 족으로 인적공제를 받은 사실이 없는 때에는 해당 과세기간의 종합소득금액이 가장 많은 거주자의 공 제대상 부양가족으로 한다.","pg":398},{"id":2101,"ch":46,"n":21,"q":"과세기간 중도에 사망한 거주자의 공제대상 가족으로서 그 상속인의 공제대상 가족에도 해당하는 사람에 대해서는 과 세표준확정신고서에 기재된 바에 따라 피상속인 또는 그 상속인 중 1명의 공제대상 가족으로 한다.","a":"X","e":"과세기간 중도에 사망한 거주자의 공제대상 가족으로서 그 상속인의 공제대상 가족에도 해당하는 사람에 대해서 는 피상속인의 공제대상 가족으로 한다.","pg":398},{"id":2102,"ch":46,"n":22,"q":"종합소득이 있는 거주자가 공적연금 관련법에 따른 기여금 또는 개인부담금을 납입한 경우에는 해당 과세기간의 산출 세액에서 그 과세기간에 납입한 연금보험료를 공제한다.","a":"X","e":"종합소득이 있는 거주자가 공적연금 관련법에 따른 기여 금 또는 개인부담금을 납입한 경우에는 해당 과세기간의 종합소득금액에서 그 과세기간에 납입한 연금보험료를 공제한다.","pg":398},{"id":2103,"ch":46,"n":23,"q":"주택담보노후연금에 대해서 발생한 이자비용 상당액은 연금 소득금액을 초과하지 않는 범위에서 300만원을 연금소득금 OIX 액에서 공제한다.","a":"X","e":"주택담보노후연금에 대해서 발생한 이자비용 상당액은 연금소득금액을 초과하지 않는 범위에서 200만원을 연금 소득금액에서 공제한다.","pg":398},{"id":2104,"ch":46,"n":24,"q":"24 이 소 득· 분 리 과 세 배 당 소 득· 분 리 과 세 연 금 소 득 • 분 리 과 세 자 기 소 만 이 있 는 자에 대하여는 종 합 소 득 공 제 • 과 중에 분 리서 과 세 기본공 타 제 득 만을 적 용 한다.","a":"X","e":"분리과세이자소득· 분리과세배당소득· 분리과세연금소 득과 분리과세기타소득만이 있는 자에 대하여는 종합소 득공제를 적용하지 아니한다.","pg":398},{"id":2105,"ch":46,"n":25,"q":"「소득세법」에 따른 수시부과 결정의 경우에는 종합소득공제 중 인적공제를 인정하지 않는다.","a":"X","e":"「소득세법」에 따른 수시부과 결정의 경우에는 기본공제 중 거주자 본인에 대한 분만을 공제한다.","pg":399},{"id":2106,"ch":46,"n":26,"q":"비거주자에 대하여 종합과세하는 경우 종합소득공제는 본인 및 배우자에 대한 인적공제만 적용되고 특별소득공제는 적 용되지 않는다. OX 420 제6편 소득세법","a":"X","e":"비거주자에 대하여 종합과세하는 경우 종합소득공제는 본인에 대한 인적공제만 적용되고, 본인외의 자에 대한 공제와 특별소득공제, 자녀세액공제 및 특별세액공제는 적용되지 않는다. 보","pg":399},{"id":2107,"ch":47,"n":1,"q":"「소득세법」상 조세에 관한 법률을 적용할 때 소득세의 감 면에 관한 규정과 세액공제에 관한 규정이 동시에 적용되는 경우 그 적용순위는 해당 과세기간의 소득에 대한 소득세의 감면, 이월공제가 인정되지 아니하는 세액공제, 해당 과세기 간 중에 발생한 세액공제액, 이전 과세기간에서 이월된 미공 제 세액공제액 순서에 따른다.","a":"X","e":"「소득세법」상 조세에 관한 법률을 적용할 때 소득세의 감면에 관한 규정과 세액공제에 관한 규정이 동시에 적 용되는 경우 그 적용순위는, 해당 과세기간의 소득에 대 한 소득세의 감면 - 이월공제가 인정되지 아니하는 세액 공제→아전 과세기간에서 이월된 미공제 세액공제액. 해당 과세기간 중에 발생한 세액공제액 순서에 따른다.","pg":400},{"id":2108,"ch":47,"n":2,"q":"이월공제가 인정되는 세액공제로서 해당 과세기간 중에 발 생한 세액공제액과 이전 과세기간에서 이월된 미공제액이 함께 있을 때에는 해당 과세기간 중에 발생한 세액공제액을 먼저 공제한다.","a":"X","e":"이월공제가 인정되는 세액공제로서 해당 과세기간 중에 발생한 세액공제액과 이전 과세기간에서 이월된 미공제 액이 함께 있을 때에는 이월된 미공제액을 먼저 공제한 다.","pg":400},{"id":2109,"ch":47,"n":3,"q":"종합소득이 있는 거주자의 기본공제대상자에 해당하는 8세 이상의 손자녀(입양자 및 위탁아등을 포함)가 2명인 경우에 는 1명당 연 35만원을 종합소득 산출세액에서 공제한다.","a":"X","e":"종합소득이 있는 거주자의 기본공제대상자에 해당하는 9 세 이상의 손자녀(입양자 및 위탁아동을 포함)가 2명인 경우에는 연 55만원을 종합소득 산출세액에서 공제한다. 11 1명인 경우에는 연 25만원, 3명 이상인 경우에는 연 55만원과","pg":400},{"id":2110,"ch":47,"n":4,"q":"","a":"X","e":"에서 공제함 . 8세 이상의 자녀세액공제는 2026년 기준 9세 이상으로 상향 조정 되었음을 주의한다. 자녀세액공제 대상의 자녀 및 손자녀의 연령기준은 다음 구분에 따른다. NEW 2026.11-12.31 9세 이상 2027.11-12.31 10세 이상 2028 11-12.31. 11세 이상 2029.11-12.31. 12세 이상","pg":400},{"id":2111,"ch":47,"n":5,"q":"해당 과세기간에 출산하거나 입양 신고한 공제대상자녀가 있는 경우로서 자녀가 첫째인 경우에는 연 50만원을 종합소 득 산출세액에서 공제한다.","a":"X","e":"해당 과세기간에 출산하거나 입양 신고한 공제대상자녀 가 있는 경우로서 자녀가 첫째인 경우에는 인 30만원을 종합소득 산출세액에서 공제한다. 비교 자녀가 둘째인 경우에는 연 50만원, 셋째 이상인 경우 연 70만","pg":401},{"id":2112,"ch":47,"n":6,"q":"해당 과세기간에 총급여액 5,000만원의 근로소득만 있는 거 주자가 같은 과세기간에 연금저축계좌에 400만원을 납입한 경우, 연금저축계좌 납입액의 100분의 12에 해당하는 금액 을 해당 과세기간의 종합소득 산출세액에서 공제한다.","a":"X","e":"해당 과세기간에 총급여액 5,000만원의 근로소득만 있 는 거주자가 같은 과세기간에 연금저축계좌에 400만원을 납입한 경우, 연금저축계좌 납입액의 100분의 1.5에 해당 하는 금액을 해당 과세기간의 종합소득 산출세액에서 공 제한다. 그 외의 경우에는 100분의 12에 해당하는 금액을 공제한다.","pg":401},{"id":2113,"ch":47,"n":7,"q":"일용근로자의 근로소득에 대해서 원천징수를 하는 경우에는 해당 근로소득에 대한 산출세액의 100분의 55에 해당하는 금액을 그 산출세액에서 공제한다.","a":"O","e":"","pg":401},{"id":2114,"ch":47,"n":8,"q":"근로소득이 있는 거주자에 대해서는 그 근로소득에 대한 종 합소득산출세액에서 근로소득세액공제하되 한도가 있다. 0 %","a":"O","e":"","pg":401},{"id":2115,"ch":47,"n":9,"q":"거주자의 종합소득금액에 Gross-up 대상 배당소득금액이 합산되어 있는 경우에는 귀속법인세액만큼을 종합소득 산출 세액에서 공제하고 미공제분은 10년간 이월공제한다.","a":"X","e":"거주자의 종합소득금액에 Gross-up 대상 배당소득금액 이 합산되어 있는 경우에는 귀속법인세액만큼을 종합소 득 산출세액에서 공제하고 미공제분은 이월하지 아니한 다.","pg":401},{"id":2116,"ch":47,"n":10,"q":"사업자가 해당 과세기간에 천재지변이나 그 밖의 재해로 자 산총액의 20% 이상에 해당하는 자산을 상실하여 납세가 곤 란하다고 인정되는 경우에는 상실된 자산의 가액을 한도로 재해손실세액공제가 적용된다.","a":"O","e":"","pg":401},{"id":2117,"ch":47,"n":11,"q":"재해손실세액공제를 적용할 때 장부가 소실 또는 분실되어 장부가액을 알 수 없는 경우 재해발생의 비율은 직전 과세 기간의 신고된 장부상 금액에 의하여 계산한다.","a":"X","e":"재해손실세액공제를 적용할 때 장부가 소실 또는 분실되 어 장부가액을 알 수 없는 경우 재해발생의 비율은 날씨 지 관할세트 서장이 조사확인한 재해발생일 현재의 가액 더드디여 계산한다.","pg":402},{"id":2118,"ch":47,"n":12,"q":"외국납부세액공제의 대상이 되는 외국소득세액에는 외국정 부에 의하여 과세된 개인소득세 및 이와 유사한 세목으로 수입금액을 과세표준으로 하여 과세된 세액이 포함된다.","a":"O","e":"","pg":402},{"id":2119,"ch":47,"n":13,"q":"「법인세법」상 외국납부세액공제 규정과 달리 「소득세법」상 의 외국납부세액공제 규정은 직접외국납부세액(가산세 프 함)의 규정만을 적용받을 수 있다.","a":"X","e":"「법인세법」상 외국납부세액공제 규정과 달리 「소득세법」 상의 익극납부세액공제 규정은 직접외국납부세액(가산세 제외)과 의제의 극납부세액의 규정만을 적용받을 수 있다.","pg":402},{"id":2120,"ch":47,"n":14,"q":"국외원천소득이 있는 거주자가 조세조약의 상대국에서 그 국외원천소득에 대하여 소득세를 감면받은 세액의 상당액은 그 조세조약에서 정하는 범위에서 세액공제의 대상이 되는 외국소득세액으로 본다.","a":"O","e":"","pg":402},{"id":2121,"ch":47,"n":15,"q":"외국정부에 납부하였거나 납부할 외국소득세액이 해당 과세 기간의 공제한도금액을 초과하는 경우 그 초과하는 금액은 없는 것으로 한다.","a":"X","e":"의국정부에 납부하였거나 납부할 외국소득세액이 해당 과세기간의 공제한도금액을 초과하는 경우 그 초과하는 금액은 해당 과세기간의 다음 과세기간부터 10년 이내에 끝나는 과세기간으로 이월하여 그 이월된 과세기간의 공 제한도금액 내에서 공제받을 수 있다. 경고 이월공제기간 내에 공제받지 못한 금액은 이월공제기간(10 년)의 종료일 다음 날이 속하는 과세기간에 필요경비 산입함","pg":402},{"id":2122,"ch":47,"n":16,"q":"복식부기의무자가 과세표준확정신고를 할 때 복식부기에 따 라 기장하여 소득금액을 계산하고 「소득세법」에 따른 서류 를 제출하는 경우에는 해당 장부에 의하여 계산한 사업소득 금액이 종합소득금액에서 차지하는 비율을 종합소득 산출세 액에 곱하여 계산한 금액의 100분의 20에 해당하는 금액(다 만, 공제세액이 100만원을 초과하는 경우에는 100만원으로 한다)을 종합소득 산출세액에서 공제한다.","a":"X","e":"간편장부대상자가 과세표준확정신고를 할 때 복식부기에 따라 기장하여 소득금액을 계산하고 「소득세법」에 따른 서류를 제출하는 경우에는 해당 장부에 의하여 계산한 사 업소득금액이 종합소득금액에서 차지하는 비율을 종합소 득 산출세액에 곱하여 계산한 금액의 100분의 20에 해당 하는 금액(다만, 공제세액이 100만원을 초과하는 경우에 는 100만원으로 한다)을 종합소득 산출세액에서 공제한 다.","pg":403},{"id":2123,"ch":47,"n":17,"q":"기장세액공제와 관련된 장부 및 증명서류를 해당 납세의무 성립일로부터 5년간 보관하는 경우 기장세액공제를 적용받 을 수 있다.","a":"X","e":"기장세액공제와 관련된 장부 및 증명서류를 해당 과세표 준확정신고기간 종료일부터 5년간 보관하는 경우 기장 세액공제를 적용받을 수 있다.","pg":403},{"id":2124,"ch":47,"n":18,"q":"비치 · . 기록한 장부에 의하여 신고하여야 할 소득금액의 10% 이상을 누락하여 신고한 경우에는 기장세액공제를 적 용하지 않는다.","a":"X","e":"비치 · 기록한 장부에 의하여 신고하여야 할 소득금액의 20% 이상을 누락하여 신고한 경우에는 기장세액공제를 적용하지 않는다.","pg":403},{"id":2125,"ch":47,"n":19,"q":"근로소득이 있는 거주자(일용근로자 제외)가 해당 과세기간 에 「국민건강보험법」 또는 「고용보험법」에 따라 근로자가 부 담하는 보험료를 지급하는 경우에는 그 금액의 12%를 보험 료세액공제로 해당 과세기간의 종합소득 산출세액에서 공제 한다.","a":"X","e":"근로소득이 있는 거주자(일용근로자 제외)가 해당 과세기 간에 「국민건강보험법」, 「고용보험법」 또는 「노인장기요양 보험법」에 따라 근로자가 부담하는 보험료를 지급한 경우 그 지급한 보험료 전액을 해당 과세기간의 근로소득금액 에서 공제한다. 비교 근로소득이 있는 거주자(일용근로자는 제외)가 해당 과세기 간에 인기에 환급되는 금액이 납입보험료를 초과하지 아니하는 보험 의 보험계약에 따라 지급하는 장애인전용 보장성보험료(또는 일반 보 장성보험료)를 지급한 경우 그 금액의 15%(일반 보장성보험료의 경우","pg":403},{"id":2126,"ch":47,"n":20,"q":"","a":"X","e":"제항","pg":403},{"id":2127,"ch":47,"n":21,"q":"장애인을 피보험자 · 수익자로 하는 장애인전용 보장성보험 로와 기본공제대상자를 피보험자로 하는 일반 보장성보험료 로 구분하여 각각 연 100만원을 한도로 하여 15%의 세액공 제율을 적용한다. OX 424 제6편 소득세법","a":"X","e":"각각 연 100만원을 한도로 하여, 장애인을 피보험자 · 수 익자로 하는 장애인전용 보장성보험료는 15%의 세액공 제율을, 기본공제대상자를 피보험자로 하는 일반 보장성 보험료는 12%의 세액공제율을 적용한다.","pg":403},{"id":2128,"ch":47,"n":22,"q":"보청기를 구입하기 위하여 지출한 비용은 전액 세액공제 대 상에 포함되나 시력보정용 콘택트렌즈 구입을 위해 지출한 비용은 세액공제 대상에서 제외된다.","a":"X","e":"시력보정용 안경 또는 콘택트렌즈 구입을 위해 지출한 비 용으로 기본공제대상자(연령 및 소득금액의 제한을 받지 아니함) 1명당 연 50만원 이내의 금액은 세액공제대상에 포함된다.","pg":404},{"id":2129,"ch":47,"n":23,"q":"교육비 세액공제는 근로소득 있는 그 거주자와 기본공제대 상자(소득요건은 적용하되, 나이요건은 제한을 받지 아니함) 를 위하여 해당 과세기간에 법령으로 정하는 교육비를 지급 한 경우 교육비 세액공제를 적용한다.","a":"X","e":"교육비 세액공제는 근로소득 있는 그 거주자와 기본공제 대상자(소득요건과 나이요건 모두 적용하지 않음)를 위하 여 해당 과세기간에 법령으로 정하는 교육비를 지급한 경 우 교육비 세액공제를 적용한다.","pg":404},{"id":2130,"ch":47,"n":24,"q":"기본공제대상인 장애인(소득의 제한을 받지 아니함)을 위한 법령으로 정하는 사회복지시설 및 비영리법인에 지급하는 법령으로 정하는 특수교육비는 그 나이에 관계없이 해당 과 세기간의 종합소득 산출세액에서 공제한다.","a":"O","e":"고 발달재활서비스 제공기관 등에 지급한 장애인재활교육비는 과 세기간 종료일 현재 18세 미만인 사람만 해당","pg":404},{"id":2131,"ch":47,"n":25,"q":"재학 중인 학교로부터 해당 과세기간에 받은 소득세 또는 증여세가 비과세되는 장학금 등은 종합소득 산출세액에서 공제하지 아니한다.","a":"O","e":"","pg":404},{"id":2132,"ch":47,"n":26,"q":"초등학생 중학생 그리고 고등학생의 교복구입비는 1명당 연 50만원을 한도로 교육비세액공제를 적용받을 수 있다.","a":"X","e":"중학생과 고등학생의 교복구입비는 1명당 연 50만원을 한도로 교육비세액공제를 적용받을 수 있다. 즉, 초등학 생의 교복구입비는 교육비세액공제 대상이 아니다.","pg":404},{"id":2133,"ch":47,"n":27,"q":"근로소득이 있는 거주자에 한하여 특별세액공제를 적용하므 로 근로소득이 없는 거주자로서 종합소득이 있는 사람은 특 별세액공제를 적용받을 수 없다.","a":"X","e":"특별세액공제 중 보험료 세액공제, 의료비 세액공제, 교 육비 세액공제는 근로소득자에 한하여 적용하지만 기부 금 세액공제는 근로소득자와 근로소득자 외의 모든 거주 자(사업소득만 있는 자는 제외)에게 적용될 수 있다.","pg":404},{"id":2134,"ch":47,"n":28,"q":"사업소득(제조업)만 있는 거주자는 기부금세액공제를 받을 수 있다.","a":"X","e":"사업소득(제조업)만 있는 거주자는 기부금세액공제를 받 을 수 없다.","pg":405},{"id":2135,"ch":47,"n":29,"q":"근로소득이 있는 거주자로서 「소득세법」상 특별소득공제, 특 별세액공제, 「조세특례제한법」에 따른 소득공제나 세액공제 를 신청하지 않은 사람은 항목별 공제 대신 연 15만원의 표 즌세액공제를 적용받는다. ○","a":"X","e":"근로소득이 있는 거주자로서 「소득세법」상 특별소득공제, 특별세액공제, 「조세특례제한법」에 따른 소득공제나 세액 공제를 신청하지 않은 사람은 항목별 공제 대신 연 13만 원의 표준세액공제를 적용받는다.","pg":405},{"id":2136,"ch":47,"n":30,"q":"근로소득이 없는 거주자로서 종합소득이 있는 사람(성실사 업자는 제외)에 대해서는 연 13만원을 종합소득 산출세액에 서 공제한다.","a":"X","e":"근로소득이 없는 거주자로서 종합소득이 있는 사람(성실 사업자는 제외)에 대해서는 연 7만원을 종합소득 산출세 액에서 공제한다.","pg":405},{"id":2137,"ch":47,"n":31,"q":"종합소득 과세표준확정신고를 하여야 할 자가 공제대상임을 증명하는 서류 미제출 시 기본공제 중 거주자 본인에 대 한 공제만을 공제한다.","a":"X","e":"종합소득 과세표준확정신고를 하여야 할 자가 공제대상 임을 증명하는 서류를 미제출 시 기본공제 중 거주자 본 인에 대한 공제와 특별세액공제 중 표준세액공제만을 공 제한다.","pg":405},{"id":2138,"ch":47,"n":32,"q":"내국인 직업운동가가 직업상 독립된 사업으로 제공하는 부 가가치세가 면세되는 인적용역의 공급에서 발생하는 소득의 원천징수세율은 100분의 6이다.","a":"X","e":"내국인 직업운동가가 직업상 독립된 사업으로 제공하는 부가가치세가 면세되는 인적용역의 공급에서 발생하는 소득의 원천징수세율은 100분의 3이다. 비교 일용근로자의 근로소득의 원천징수세율은 100분의 6일","pg":405},{"id":2139,"ch":47,"n":33,"q":"직장공제회 초과반환금에 대한 원천징수세율은 100분의 14 이다.","a":"X","e":"직장공제회 초과반환금에 대한 원천징수세율은 기본세율 이다. 직장공제회 초과반환금은 기본세율로 원천징수하 고 무조건 분리과세하는 이자소득이다.","pg":405},{"id":2140,"ch":47,"n":34,"q":"매월분의 공적연금소득에 대한 원천징수세율을 적용할 때에 는 100분의 3을 적용한다. 0%","a":"X","e":"매월분 공적연금소득은 기본세율(연금소득 간이세액표) 로 원천징수한다.","pg":405},{"id":2141,"ch":47,"n":35,"q":"서화·골동품의 양도로 발생하는 소득에 대하여 양수자인 원천징수의무자가 국내사업장이 없는 비거주자 또는 외국법 인인 경우로서 원천징수를 하기 곤란하여 원천징수를 하지 못하는 경우에는 서화 · 골동품의 양도로 발생하는 소득을 지급받는 자를 원천징수의무자로 본다.","a":"O","e":"","pg":406},{"id":2142,"ch":47,"n":36,"q":"직전연도의 상시고용인원이 20명 이하인 원천징수의무자 (금융 및 보험업을 영위하는 자는 제외)는 「국제조세조정에 관한 법률」에 따라 처분된 배당소득에 대한 원천징수세액을 그 징수일이 속하는 반기의 마지막 달의 다음 달 10일까지 납부할 수 있다.","a":"X","e":"직전연도의 상시고용인원이 20명 이하인 원천징수의무 자(금융 및 보험업을 영위하는 자는 제외) 및 종교단체는 그 징수일이 속하는 반기의 마지막 달의 다음 달 10일까 지 원천징수세액을 납부할 수 있다. 다만 다음의 원천징 수세액에 대해서는 반기별 납부를 적용하지 않는다. ㉠ 「법인세법」에 따라 배당. 상여 및 기타소득으로 소 득처분된 금액에 대한 원천징수세액 ④ 「국제조세조정에 관한 법률」에 따라 처분된 배당소 득에 대한 원천징수세액 ㉢ 비과세 연예인 등의 용역제공과 관련된 원천징수절 차 특례규정에 따른 원천징수세액","pg":406},{"id":2143,"ch":47,"n":37,"q":"원천징수세액(이자소득 포함) 또는 납세조합의 징수세액이 1,000원 미만인 경우에는 해당 소득세를 징수하지 아니한 다. OTX","a":"X","e":"원천징수세액(이자소득 제외) 또는 납세조합의 징수세액 이 1,000원 미만인 경우에는 해당 소득세를 징수하지 아 니한다.","pg":406},{"id":2144,"ch":47,"n":38,"q":"원천징수의무자는 국내에서 지급하는 이자소득으로서 소득 세가 과세되지 않거나 면제되는 소득에 대해서도 원천징수 를 해야 한다.","a":"X","e":"원천징수의무자가 국내에서 지급하는 이자소득으로서 소 득세가 과세되지 아니하는 소득을 지급할 때에는 소득세 를 원천징수하지 아니한다.","pg":406},{"id":2145,"ch":47,"n":39,"q":"소득 발생 후 지급되지 아니함으로써 소득세가 원천징수되 지 아니한 소득이 이미 종합소득에 합산되어 소득세가 과세 된 경우에는 그 후 그 소득을 실제로 지급할 때는 소득세를 원천징수하여야 한다.","a":"X","e":"소득 발생 후 지급되지 아니함으로써 소득세가 원천징수 되지 아니한 소득이 이미 종합소득에 합산되어 소득세가 과세된 경우에는 그 후 그 소득을 실제로 지급할 때는 원 천징수를 하지 아니한다.","pg":406},{"id":2146,"ch":47,"n":40,"q":"법인세 과세표준을 신고할 때 익금에 산입한 금액을 배당으 로 처분한 경우에는 법인세 과세표준신고일 또는 수정신고 일에 그 배당소득을 지급한 것으로 보아 소득세를 원천징수 한다.","a":"O","e":"","pg":407},{"id":2147,"ch":47,"n":41,"q":"법인세 과세표준을 결정 또는 경정하는 경우 「법인세법」에 따라 소득처분되는 결산확정일에 그 배당소득을 지급한 것 으로 보아 소득세를 원천징수한다.","a":"X","e":"법인세 과세표준을 결정 또는 경정하는 경우 「법인세법」 에 따라 소득처분되는 배당에 대하여는 소득금액변동통 지서를 받은 날에 그 배당소득을 지급한 것으로 보아 소 득세를 원천징수한다.","pg":407},{"id":2148,"ch":47,"n":42,"q":"출자공동사업자의 배당소득으로서 과세기간 종료일까지 지 급하지 아니한 소득은 과세기간 종료일에 그 소득을 지급한 것으로 보아 소득세를 원천징수한다.","a":"X","e":"출자공동사업자의 배당소득으로서 과세기간 종료 후 3개 월이 되는 날까지 지급하지 아니한 소득은 과세기간 종료 후 3개월이 되는 날에 그 소득을 지급한 것으로 보아 소 득세를 원천징수한다.","pg":407},{"id":2149,"ch":47,"n":43,"q":"법인세 과세표준을 신고하면서 「법인세법」에 따라 처분되는 기타소득에 대하여는 결산확정일에 그 기타소득을 지급한 것으로 보아 소득세를 원천징수한다.","a":"X","e":"법인세 과세표준을 신고하면서 「법인세법」에 따라 처분되 는 기타소득에 대하여는 신고일 또는 수정신고일에 그 기 타소득을 지급한 것으로 보아 소득세를 원천징수한다.","pg":407},{"id":2150,"ch":47,"n":44,"q":"주식의 소각으로 인한 의제배당에 대해서는 주식의 소각을 결정한 날에 그 소득을 지급한 것으로 보아 소득세를 원천 징수한다.","a":"O","e":"","pg":407},{"id":2151,"ch":47,"n":45,"q":"근로소득을 지급하여야 할 원천징수의무자가 1월부터 11월 까지의 근로소득을 해당 과세기간의 12월 31일까지 지급하 지 아니한 경우에는 그 근로소득을 다음 연도 2월 말일에 지 급한 것으로 보아 소득세를 원천징수한다. 428 제5편 소득세법","a":"X","e":"근로소득을 지급하여야 할 원천징수의무자가 1월부터 11 월까지의 근로소득을 해당 과세기간의 12월 31일까지 지 급하지 아니한 경우에는 그 근로소득을 12월 31일에 지급 한 것으로 보아 소득세를 원천징수한다. 비교 12월분을 다음 연도 2월 말일까지 지급하지 아니한 경우 다음 연도 2월 말일에 지급한 것으로 보아 소득세를 원천징수함","pg":407},{"id":2152,"ch":47,"n":46,"q":"원천징수의무자가 12월분의 근로소득을 다음 연도 2월 말일 까지 지급하지 아니한 경우에는 그 근로소득을 다음 연도 3 월 말일에 지급한 것으로 보아 소득세를 원천징수한다.","a":"X","e":"원천징수의무자가 12월분의 근로소득을 다음 연도 2월 말일까지 지급하지 아니한 경우에는 그 근로소득을 다음 연도 2월 말일에 지급한 것으로 보아 소득세를 원천징수 한다.","pg":408},{"id":2153,"ch":47,"n":47,"q":"퇴직소득을 지급하여야 할 원천징수의무자가 1월부터 11월 까지의 사이에 퇴직한 사람의 퇴직소득을 해당 과세기간의 12월 31일까지 지급하지 아니한 경우에는 그 퇴직소득을 12 월 31일에 지급한 것으로 보아 소득세를 원천징수한다. (공 •적연금 관련법에 따라 받는 일시금 아님) OX 46 비거주 연예인 등이 국내에서 제공한 용역과 관련하여 조세 조약상 국내사업장이 없다는 이유로 과세되지 않는 '비과세 외국연예 등 법인'에 국내에서 제공한 용역과 관련하여 대가 를 지급하는 자는 그 지급하는 금액의 100분의 3을 원천징 수하여야 한다.","a":"X","e":"LINK 250 p.8562 p. 549 비거주 연예인 등이 국내에서 제공한 용역과 관련하여 조 세조약상 국내사업장이 없다는 이유로 과세되지 않는 비 과세 외국연예 등 법인'에 국내에서 제공한 용역과 관련 하여 대가를 지급하는 자는 그 지급하는 금액의 100분의 20을 원천징수하여야 한다.","pg":408},{"id":2154,"ch":47,"n":48,"q":"법인이 해산한 경우에 원천징수를 하여야 할 소득세를 징수 하지 아니하였거나 징수한 소득세를 납부하지 아니하고 잔 여재산을 분배하였을 때에는 청산인은 그 분배액을 한도로 하여 분배를 받은 자와 연대하여 납세의무를 진다.","a":"O","e":"","pg":408},{"id":2155,"ch":47,"n":49,"q":"법인이 합병한 경우에 합병 후 존속하는 법인이나 합병으로 신설된 법인은, 합병으로 소멸된 법인이 원천징수를 하여야 할 소득세를 납부하지 아니하면 그 소득세에 대한 납세의무 를 진다.","a":"O","e":"36 207 2","pg":408},{"id":2156,"ch":47,"n":50,"q":"토지 등 매매차익 예정신고·납부를 한 부동산매매업자는 중간예납의무가 없다.","a":"X","e":"사업소득이 있는 거주자만 중간예납의무를 부담하고, 사 업소득이 없는 자와 퇴직소득· 양도소득만 있는 자는 중 간예납의무가 없다. 따라서 토지 등 매매차익을 예정신고·납부한 부동산 매 매업자는 사업소득자이므로 중간예납의무를 부담한다.","pg":409},{"id":2157,"ch":47,"n":51,"q":"소득세 중간예납기간은 1월 1일부터 6월 30일까지 6개월간 이며, 11월 30일이 납부기한이다.","a":"O","e":"","pg":409},{"id":2158,"ch":47,"n":52,"q":"중간예납 의무가 있는 거주자가 중간예납기간의 종료일 현 재 그 중간예납기간 종료일까지의 종합소득금액에 대한 소 득세액이 중간예납기준액의 100분의 20에 미달하는 경우에 는 중간예납추계액을 증간예납세액으로 하여 납세지 관할 세무서장에게 신고할 수 있다.","a":"X","e":"중간예납 의무가 있는 거주자가 중간예납기간의 종료일 현재 그 중간예납기간 종료일까지의 종합소득금액에 대 한 소득세액이 중간예납기준액의 100분의 30에 미달하는 경우에는 중간예납추계액을 중간예납세액으로 하여 납세 지 관할 세무서장에게 신고할 수 있다.","pg":409},{"id":2159,"ch":47,"n":53,"q":"「소득세법」상 중간예납세액이 100만원 미만인 때에는 징수 하지 아니한다.","a":"X","e":"「소득세법」상 중간예납세액이 50만원 미만인 때에는 징 수하지 아니한다.","pg":409},{"id":2160,"ch":47,"n":54,"q":"중간예납세액이 1천만원을 초과하는 자는 그 납부할 세액의 일부를 납부기한이 지난 후 1개월 이내에 분할납부할 수 있 다.","a":"X","e":"중간예납세액이 1천만원을 초과하는 자는 그 납부할 세액 의 일부를 납부기한이 지난 후 2개월 이내에 분할납부할 수 있다.","pg":409},{"id":2161,"ch":47,"n":55,"q":"납세지 관할세무서장 또는 지방국세청장은 거주자가 조세를 포탈할 우려가 있다고 인정되는 상당한 이유가 있는 경우에 는 수시로 그 거주자에 대한 소득세를 부과할 수 있다. Ox 430 제5원소득세법","a":"O","e":"","pg":409},{"id":2162,"ch":47,"n":56,"q":"수시부과 후 추가발생소득이 없는 거주자는 그 종합소득과 세표준을 다음 연도 5월 1일부터 5월 31일까지 확정신고하 고 종합소득 산출세액을 자진납부하여야 한다.","a":"X","e":"수시부과 후 추가발생소득이 없는 거주자는 과세표준 확 정신고를 하지 않고 수시부과로만 과세를 종결할 수 있 다.","pg":410},{"id":2163,"ch":47,"n":57,"q":"부동산매매업자는 토지 등의 매매차익(매매차익이 없거나 매매차손이 발생한 경우 제외)과 그 세액을 매매일이 속하는 달의 말일부터 2개월이 되는 날까지 납세지 관할세무서장에 게 신고하여야 한다. OIX ・소득금액에 대해 금속인수금 연수가 1년 미만의 기간이 있는","a":"X","e":"부동산매매업자는 토지 등의 매매차익(매매차익이 없거 나 매매차손이 발생한 경우 포함)과 그 세액을 매매일이 속하는 달의 말일부터 2개월이 되는 날까지 납세지 관할 세무서장에게 신고하여야 한다. TO","pg":410},{"id":2164,"ch":48,"n":1,"q":"퇴직소득은 종합소득에 속하나 종합소득 과세표준에 합산하 지 않고 분리과세된다.","a":"X","e":"퇴직소득은 종합소득에 속하나 종합소득 과세표준에 합 산하지 않고 분류과세된다.","pg":411},{"id":2165,"ch":48,"n":2,"q":"종업원이 임원이 되었으나 퇴직급여를 실제로 받지 않은 경 우 퇴직으로 보지 아니할 수 있다.","a":"O","e":"","pg":411},{"id":2166,"ch":48,"n":3,"q":"법인의 상근임원이 비상근임원이 된 경우 퇴직급여를 받지 아니하였더라도 퇴직으로 보아 과세해야 한다.","a":"X","e":"법인의 상근임원이 비상근임원이 되었지만 퇴직급여를 받지 아니한 경우 퇴직으로 보지 아니할 수 있다.","pg":411},{"id":2167,"ch":48,"n":4,"q":"거주자가 출자관계에 있는 법인으로의 진출이 이루어졌으나 퇴직급여를 실제로 받지 않은 경우는 퇴직으로 보지 않을 수 있다.","a":"O","e":"","pg":411},{"id":2168,"ch":48,"n":5,"q":"임원인 근로소득자가 계속근로기간 중에 「근로자퇴직급여 보장법」의 퇴직금 중간정산 사유에 해당하여 퇴직급여를 미 리 지급받은 경우에는 그 지급받은 날에 퇴직한 것으로 본 다.","a":"O","e":"","pg":411},{"id":2169,"ch":48,"n":6,"q":"공적연금 관련법에 따라 받는 일시금은 퇴직소득에 포함된 다.","a":"O","e":"","pg":411},{"id":2170,"ch":48,"n":7,"q":"「국민연금법」에 따라 받는 일시금으로써 2001년 12월 31일 이전에 납입된 연금 기여금 및 사용자부담금을 기초로 하여 받은 일시금은 퇴직소득에 해당한다. OX 432 제6편 소득세법","a":"X","e":"「국민연금법」에 따라 받는 일시금으로써 2001년 12월 31 일 후에 납입된 연금 기여금 및 사용자부담금을 기초로 하여 받은 일시금은 퇴직소득에 해당한다. 2001년 12월 31일 이전분은 소득공제가 적용되지 않았으므로 해당 연 금 수령분은 과세소득이 아니다.","pg":411},{"id":2171,"ch":48,"n":8,"q":"「소득세법」에서는 사용자 부담금을 기초로 하여 현실적인 퇴직을 원인으로 지급받는 소득을 퇴직소득의 하나로 규정 하고 있다.","a":"O","e":"","pg":412},{"id":2172,"ch":48,"n":9,"q":"과학기술인공제회법」에 따라 지급받는 과학기술발전장려금 은 기타소득에 해당한다.","a":"X","e":"과학기술인공제회법」에 따라 지급받는 과학기술발전장 려금은 퇴직소득에 해당한다.","pg":412},{"id":2173,"ch":48,"n":10,"q":"종교관련종사자가 현실적인 퇴직을 원인으로 종교단체로부 터 지급받는 소득은 기타소득에 해당한다.","a":"X","e":"종교관련종사자가 현실적인 퇴직을 원인으로 종교단체로 부터 지급받는 소득은 퇴직소득에 해당한다.","pg":412},{"id":2174,"ch":48,"n":11,"q":"퇴직소득과세표준을 계산하는 경우, 퇴직소득금액에서 근속 연수에 따라 계산한 금액을 공제한다.","a":"O","e":"","pg":412},{"id":2175,"ch":48,"n":12,"q":"퇴직소득금액에 대해 근속연수공제를 적용하는 경우, 근속 연수가 1년 미만의 기간이 있는 경우에는 이를 월 이하로 절 사하여 계산한다.","a":"X","e":"퇴직소득금액에 대해 근속연수공제를 적용하는 경우. 근 속연수가 1년 미만의 기간이 있는 경우에는 1년 미만의 기간은 1년으로 본다.","pg":412},{"id":2176,"ch":48,"n":13,"q":"거주자의 퇴직소득에 대한 소득세는 해당 과세기간의 퇴직 소득 과세표준에 기본세율을 적용하여 계산한 금액을 12로 나눈 금액에 근속연수를 곱하여 계산한 금액으로 한다.","a":"O","e":"","pg":412},{"id":2177,"ch":48,"n":14,"q":"퇴직소득에 대한 총수입금액의 수입시기는 원칙적으로 퇴직 급여를 실제로 지급받는 날이다.","a":"X","e":"퇴직소득에 대한 총수입금액의 수입시기는 원칙적으로 퇴직한 날로 한다.","pg":412},{"id":2178,"ch":48,"n":15,"q":"「국민연금법」에 따라 연금을 수급하던 자가 연금계약의 중 도해지 등으로 지급받는 일시금의 수입시기는 퇴직을 한 날 로 한다.","a":"X","e":"「국민연금법」에 따라 연금을 수급하던 자가 연금계약의 중도해지 등으로 지급받는 일시금의 수입시기는 소득을 지금믿는 말(분할하여 지급받는 경우에는 최초로 지급받 님)로 한다.","pg":413},{"id":2179,"ch":48,"n":16,"q":"임직원의 2012년 1월 1일 이후 근무기간에 대한 퇴직소득금 액(공적연금 관련법에 따라 받는 일시금 제외)이 퇴직소득 한도액을 초과하는 금액은 근로소득으로 본다.","a":"X","e":"입원의 2012년 1월 1일 이후 근무기간에 대한 퇴직소득금 액(공적연금 관련법에 따라 받는 일시금 제외)이 퇴직소 득 한도액을 초과하는 금액은 근로소득으로 본다.","pg":413},{"id":2180,"ch":48,"n":17,"q":"거주자의 퇴직소득금액에 국외원천소득이 합산되어 있는 경 우로서 그 국외원천소득에 대하여 외국에서 외국소득세액을 납부하였을 때에는 공제한도금액 내에서 외국소득세액을 해 당 과세기간의 퇴직소득 산출세액에서 공제할 수 있다.","a":"O","e":"","pg":413},{"id":2181,"ch":48,"n":18,"q":"퇴직소득에 대하여 외국정부에 납부하였던 외국소득세액에 의한 외국납부세액공제의 한도초과액은 10년간 이월공제를 적용받을 수 있다.","a":"X","e":"퇴직소득세에서는 외국납부세액공제에 대한 이월공제 규 정이 없다.","pg":413},{"id":2182,"ch":48,"n":19,"q":"이연퇴직소득을 연금수령한 경우에는 기타소득으로 보나, 연금수령한 경우에는 퇴직소득으로 본다.","a":"X","e":"이연퇴직소득을 연금외수령한 경우에는 퇴직소득으로 보 나, 연금수령한 경우에는 연금소득으로 본다.","pg":413},{"id":2183,"ch":48,"n":20,"q":"국내에서 거주자에게 퇴직소득을 지급하는 내국법인은 그 거주자에 대한 소득세를 원천징수하여 그 징수일이 속하는 달의 다음 달 10일까지 납부하여야 한다.","a":"O","e":"","pg":413},{"id":2184,"ch":48,"n":21,"q":"외국기관 또는 우리나라에 주둔하는 국제연합군(미군은 제 외함)으로부터 받은 근로소득이 있는 사람이 퇴직함으로써 받는 퇴직소득은 원천징수한다. Ox 434 제6편 소득세법","a":"X","e":"외국기관 또는 우리나라에 주둔하는 국제연합군(미군은 제외함)으로부터 받은 근로소득이 있는 사람이 퇴직함으 로써 받는 퇴직소득은 원천징수하지 않는다.","pg":413},{"id":2185,"ch":48,"n":22,"q":"거주자의 퇴직소득이 퇴직일 현재 연금계좌에 있는 경우 해 당 퇴직소득에 대한 소득세를 연금외수령하기 전까지 원천 징수하지 아니한다.","a":"O","e":"","pg":414},{"id":2186,"ch":48,"n":23,"q":"거주자가 퇴직소득을 지급받은 날부터 90일이 되는 날에 연 금계좌에 입금하는 경우, 해당 거주자는 퇴직소득의 원천징 수세액에 대한 환급을 신청할 수 있다.","a":"X","e":"거주자가 퇴직소득을 지급받은 날부터 60일 이내에 연금 계좌에 입금하는 경우, 해당 거주자는 퇴직소득의 원천징 수세액에 대한 환급을 신청할 수 있다.","pg":414},{"id":2187,"ch":49,"n":1,"q":"양도란 자산에 대한 등기 또는 등록과 관계없이 매도 · 교 환·법인에 대한 현물출자 등으로 인하여 그 자산이 유상 또는 무상으로 사실상 이전되는 것을 말한다.","a":"X","e":"양도란 자산에 대한 등기 또는 등록과 관계없이 매도·교 환·법인에 대한 현물출자 등으로 인하여 그 자산이 유상 으로 사실상 이전되는 것을 말한다.","pg":415},{"id":2188,"ch":49,"n":2,"q":"손해배상에 있어서 당사자 간의 합의에 의하거나 법원의 확 정판결에 의하여 일정액의 위자료를 지급하기로 하고, 동 위 자료의 지급에 갈음하여 당사자 일방이 소유하고 있던 부동 산으로 대물변제한 때에는 그 자산을 양도한 것으로 본다.","a":"O","e":"","pg":415},{"id":2189,"ch":49,"n":3,"q":"채무변제 담보를 위하여 채무자가 자산을 양도하는 계약을 체결한 후 해당 자산을 변제에 충당할 경우 사실상 양도로 보지 않아 양도소득세를 과세하지 않는다.","a":"X","e":"양도담보는 양도로 보지 아니한다. 다만, 채무변제 담보 를 위하여 채무자가 자산을 양도하는 계약을 체결한 후 해당 자산을 변제에 충당할 경우 실질적인 소유권 이전에 해당하므로 양도로 본다.","pg":415},{"id":2190,"ch":49,"n":4,"q":"법원의 확정판결에 의한 신탁해지를 원인으로 하는 소유권 이전등기를 하는 경우 양도소득세를 과세한다.","a":"X","e":"법원의 확정판결에 의한 신탁해지를 원인으로 하는 소유 권이전등기를 하는 경우 사실상 양도로 보지 않아 양도소 득세를 과세하지 않는다.","pg":415},{"id":2191,"ch":49,"n":5,"q":"「도시개발법」이나 그 밖의 법률에 따른 환지처분으로 지 목·지번이 변경되거나 보류지로 충당되는 경우에는 양도로 본다.","a":"X","e":"「도시개발법」이나 그 밖의 법률에 따른 환지처분으로 지 목· 지번이 변경되거나 보류지로 충당되는 경우에는 사 실상 양도로 보지 않아 양도소득세를 과세하지 않는다.","pg":415},{"id":2192,"ch":49,"n":6,"q":"공유물의 소유지분별 분할(공유지 분 변동 없음)이 있는 경 우「소득세법」상 양도소득세의 과세대상이 되는 부동산 양 도에 해당하지 않는다. OX 436 제6편 소득세법","a":"O","e":"","pg":415},{"id":2193,"ch":49,"n":7,"q":"등기되지 않은 부동산임차권(법령으로 정하는 점포임차권 제외)을 양도할 경우, 미등기양도자산으로 보아 양도소득세 를 과세한다.","a":"X","e":"등기되지 않은 부동산임차권(법령으로 정하는 점포임차 권 제외)은 과세대상 소득으로 열거되지 않은 항목이기 때문에. 해당 자산을 양도하더라도 양도소득은 과세되지 않는다.","pg":416},{"id":2194,"ch":49,"n":8,"q":"지상권을 양도함으로써 얻은 소득은 양도소득에 해당하나 공익사업 관련 지상권을 설정하거나 대여함으로써 얻은 소 득은 사업소득이다.","a":"X","e":"지상권을 양도함으로써 얻은 소득은 양도소득에 해당하 나 공익사업 관련 지상권을 설정하거나 대여함으로써 얻 은 소득은 기타소득이다.","pg":416},{"id":2195,"ch":49,"n":9,"q":"지역권을 양도함으로써 얻은 소득은 양도소득이나, 공익사 업 관련 지역권을 설정하거나 대여함으로써 얻은 소득은 기 타소득이다.","a":"X","e":"공익사업과 관련된 지역권의 설정과 대여로 인한 소득은 기타소득이지만 지역권은 양도할 수 있는 권리가 아니므 로 지역권의 양도는 과세대상 소득이 아니다.","pg":416},{"id":2196,"ch":49,"n":10,"q":"이혼 시 재산분할에 따른 소유권이전은 「소득세법」상 양도 소득세의 과세대상이 되는 부동산 양도에 해당한다.","a":"X","e":"이혼시 재산분할에 따른 소유권이전은 「소득세법」상 양 도로 보지 않아 양도소득세를 과세하지 않는다.","pg":416},{"id":2197,"ch":49,"n":11,"q":"사업용 고정자산인 부동산과 함께 영업권을 양도하여 받는 영업권 양도이익은 기타소득으로 과세한다.","a":"X","e":"사업용 고정자산인 부동산과 함께 영업권을 양도하여 받 는 영업권 양도이익은 양도소득으로 과세한다. 고 이 외의 영업권 양도이익은 기타소득으로 과세함","pg":416},{"id":2198,"ch":49,"n":12,"q":"파산선고에 의한 처분으로 발생하는 소득은 양도소득세의 과세대상이다.","a":"X","e":"파산선고에 의한 처분으로 발생하는 소득은 양도소득세 의 비과세대상이다.","pg":416},{"id":2199,"ch":49,"n":13,"q":"1세대를 구성하는 배우자에는 법률상 이혼을 하였으나 생계 를 같이 하는 등 사실상 이혼한 것으로 보기 어려운 관계에 있는 사람을 포함한다.","a":"O","e":"","pg":416},{"id":2200,"ch":49,"n":14,"q":"거주자가 그 배우자(법률상 이혼을 하였으나 생계를 같이 하 는 등 사실상 이혼한 것으로 보기 어려운 관계에 있는 사람 을 포함)와 생계를 같이 하고 있다면 1세대로 보되, 별거하고 있으면 각각 별개의 세대로 본다.","a":"X","e":"'1세대'라 함은 거주자 및 그 배우자(법률상 이혼을 하였 으나 생계를 같이 하는 등 사실상 이혼한 것으로 보기 어 려운 관계에 있는 사람을 포함)가 그들과 같은 주소 또는 거소에서 생계를 같이 하는 가족과 함께 구성하는 가족단 위를 말한다. 이때, 부부가 각각 단독세대를 구성하였을 경우에도 동일한 세대로 본다. 즉, 배우자는 별거하고 있 는 경우에도 동일한 세대로 본다.","pg":417},{"id":2201,"ch":49,"n":15,"q":"1세대에서 생계를 같이 하는 자란 거주자 및 그 배우자의 직 계존비속(그 배우자를 포함) 및 형제자매를 말하며, 취학, 질 병의 요양, 근무상 또는 사업상의 형편으로 본래의 주소 또 는 거소에서 일시 퇴거한 사람은 포함하지 않는다.","a":"X","e":"1세대에서 생계를 같이 하는 자란 거주자 및 그 배우자의 직계존비속(그 배우자를 포함) 및 형제자매를 말하며, 취 학, 질병의 요양, 근무상 또는 사업상의 형편으로 본래의 주소 또는 거소에서 일시 퇴거한 사람을 포함한다.","pg":417},{"id":2202,"ch":49,"n":16,"q":"1세대와 관련하여 해당 거주자의 나이가 30세 이상인 경우 에는 배우자가 없어도 1세대로 본다. ○","a":"O","e":"","pg":417},{"id":2203,"ch":49,"n":17,"q":"양도소득과 관련하여 \"주택\"이란 공부상의 용도에 주택으로 구분된 것을 말한다.","a":"X","e":"양도소득과 관련하여 \"주택\"이란 허가 여부나 공부상의 용도구분과 관계없이 세대의 구성원이 독립된 주거생활 을 할 수 있는 구조로서 법령으로 정하는 구조를 갖추어 사실상 주거용으로 사용하는 건물을 말한다. 이 경우 그 용도가 분명하지 아니하면 공부상의 용도에 따른다.","pg":417},{"id":2204,"ch":49,"n":18,"q":"상속받은 주택과 일반주택을 국내에 각각 1개씩 소유하고 있는 1세대가 상속주택을 양도할 때 1주택으로 보아 비과세 규정을 적용한다.","a":"X","e":"상속받은 주택과 일반주택을 국내에 각각 1개씩 소유하고 있는 1세대가 일반주택을 양도할 때 1주택으로 보아 비과 세 규정을 적용한다.","pg":417},{"id":2205,"ch":49,"n":19,"q":"1주택을 보유하는 자가 1주택을 보유하는 60세 이상의 직계 존속을 동거봉양하기 위해 1세대 2주택이 된 경우 합친 날부 터 5년 이내에 직계존속의 주택을 양도할 때 1세대 1주택으 로 보아 비과세 규정을 적용한다.","a":"X","e":"1주택을 보유하는 자가 1주택을 보유하는 60세 이상의 직 계존속을 동거봉양하기 위해 1세대 2주택이 된 경우 합친 날부터 10년 이내에 먼저 양도하는 주택을 양도할 때 1세 대 1주택으로 보아 비과세 규정을 적용한다.","pg":417},{"id":2206,"ch":49,"n":20,"q":"1주택을 보유하는 자가 1주택을 보유하는 자와 혼인함으로 써 1세대가 2주택을 보유하게 되는 경우 혼인한 날부터 5년 이내에 2주택 중 어느 하나의 주택을 양도할 때 1세대 1주택 으로 보아 비과세 규정을 적용한다.","a":"X","e":"1주택을 보유하는 자가 1주택을 보유하는 자와 혼인함으 로써 1세대가 2주택을 보유하게 되는 경우 혼인한 날부터 10년 이내에 2주택 중 어느 하나의 주택을 양도할 때 1세 대 1주택으로 보아 비과세 규정을 적용한다. 참고 2025 개정사항이니 꼭 챙겨가자","pg":418},{"id":2207,"ch":49,"n":21,"q":"「지적재조사에 관한 특별법」에 따른 경계의 확정으로 지적 공부상의 면적이 감소되어 지급받는 조정금에 대해서는 양 도소득세를 과세한다.","a":"X","e":"「지적재조사에 관한 특별법」에 따른 경계의 확정으로 지 적공부상의 면적이 감소되어 지급받는 조정금에 대해서 는 양도소득세를 과세하지 아니한다.","pg":418},{"id":2208,"ch":49,"n":22,"q":"「소득세법」 제104조제3항에서 규정하는 미등기양도자산에 대하여는 「소득세법」 또는 「소득세법」 외의 법률 중 양도소 득에 대한 소득세의 비과세에 관한 규정을 적용한다.","a":"X","e":"「소득세법」 제104조제3항에서 규정하는 미등기양도자산 에 대하여는 「소득세법」 또는 「소득세법」 외의 법률 중 양 도소득에 대한 소득세의 비과세에 관한 규정을 적용하지 아니한다.","pg":418},{"id":2209,"ch":49,"n":23,"q":"대금을 청산하기 전에 소유권이전등기를 한 경우에는 해당 자산의 대금을 청산한 날을 「소득세법」상 양도소득금액 계 산 시 자산의 취득시기 및 양도시기로 한다.","a":"X","e":"대금을 청산하기 전에 소유권이전등기를 한 경우에는 등 기부에 기재된 등기접수일을 「소득세법」상 양도소득금액 계산 시 자산의 취득시기 및 양도시기로 한다.","pg":418},{"id":2210,"ch":49,"n":24,"q":"법령으로 정하는 장기할부조건부 양도의 경우 해당 자산의 취득시기 또는 양도시기는 장기할부조건에 따라 대가의 각 부분을 받기로 한 날로 한다.","a":"X","e":"법령으로 정하는 장기할부조건부 양도의 경우 해당 자산 의 취득시기 또는 양도시기는 소유권이전등기(등록명 의개서 포함) 접수일. 인도일. 사용수익일 중 빠른 날로 한다.","pg":418},{"id":2211,"ch":49,"n":25,"q":"건축허가를 받지 아니하고 자기가 건축물을 건설한 경우에 는 그 건축물의 사실상 사용일을 「소득세법」상 양도소득금 액 계산 시 자산의 취득시기 및 양도시기로 한다.","a":"O","e":"","pg":418},{"id":2212,"ch":49,"n":26,"q":"「민법」상 점유로 인한 부동산소유권의 취득시효에 의하여 부동산의 소유권을 취득하는 경우에는 해당 부동산의 등기 부에 기재된 등기접수일을 「소득세법」상 양도소득금액 계산 시 자산의 취득시기 및 양도시기로 한다.","a":"X","e":"「민법」상 점유로 인한 부동산소유권의 취득시효에 의하여 부동산의 소유권을 취득하는 경우에는 그 부동산의 집유 개시인을 「소득세법」상 양도소득금액 계산 시 자산의 취 득시기 및 양도시기로 한다.","pg":419},{"id":2213,"ch":49,"n":27,"q":"완성 또는 확정되지 아니한 자산을 양도 또는 취득한 경우 로서 해당 자산의 대금을 청산한 날까지 그 목적물이 완성 또는 확정되지 아니한 경우에는 그 목적물이 완성 또는 확 정된 날을 「소득세법」상 양도소득금액 계산 시 자산의 취득 시기 및 양도시기로 한다.","a":"O","e":"","pg":419},{"id":2214,"ch":49,"n":28,"q":"「법인세법」에 따른 특수관계법인(외국법인을 포함)에 고가로 양도한 경우로서 「법인세법」상 부당행위계산의 부인 규정에 따라 해당 거주자의 상여. 배당 등으로 처분된 금액이 있는 경우에는 실제 양도가액을 해당 자산의 양도 당시의 실지거 래가액으로 본다.","a":"X","e":"「법인세법」에 따른 특수관계법인(외국법인을 포함)에 고 가로 양도한 경우로서 「법인세법」상 부당행위계산의 부인 규정에 따라 해당 거주자의 상여. 배당 등으로 처분된 금 액이 있는 경우에는 「법인세법」상 부당행위계산의 부인에 따른 시기를 해당 자산의 양도 당시의 실지거래가액으로 본다.","pg":419},{"id":2215,"ch":49,"n":29,"q":"「법인세법」에 따른 특수관계법인 외의 자에게 양도소득세 과 세 대상 자산을 시가보다 높은 가격으로 양도한 경우로서 「상속세 및 증여세법」에 따라 해당 거주자의 증여재산가액으 로 하는 금액이 있는 경우에는 그 양도가액에 증여재산가액 을 더한 금액을 양도 당시의 실지거래가액으로 본다.","a":"X","e":"「법인세법」에 따른 특수관계법인 외의 자에게 양도소득세 과세 대상 자산을 시가보다 높은 가격으로 양도한 경우로 서 「상속세 및 증여세법」에 따라 해당 거주자의 증여재산 가액으로 하는 금액이 있는 경우에는 그 양도가액에서 증 여재산가액을 뺀 금액을 양도 당시의 실지거래가액으로 본다.","pg":419},{"id":2216,"ch":49,"n":30,"q":"양도소득세 과세대상자산을 「법인세법」에 따른 특수관계인 (외국법인포함)으로부터 취득한 경우로서 「법인세법」에 따라 거주자의 상여. 배당 등으로 처분된 금액이 있으면 그 상 여·배당 등으로 처분된 금액을 취득가액에 더한다.","a":"O","e":"","pg":419},{"id":2217,"ch":49,"n":31,"q":"주식매수선택권을 행사하여 취득한 주식을 양도하는 때에는 주식매수선택권을 행사하는 당시의 행사가격을 취득가액으 로 한다.","a":"X","e":"주식매수선택권을 행사하여 취득한 주식을 양도하는 때 에는 주식매수선택권을 행사하는 당시의 시기를 취득가 액으로 한다.","pg":420},{"id":2218,"ch":49,"n":32,"q":"실지거래가액에 따른 양도차익 산정과 관련하여, 토지와 건 물 등을 함께 취득하거나 양도한 경우로서 그 토지와 건물 등을 구분기장한 가액이 법령으로 정하는 바에 따라 안분계 산한 가액과 100분의 5 이상 차이가 있는 경우에는 토지와 건물 등의 가액 구분이 불분명한 때로 본다.","a":"X","e":"실지거래가액에 따른 양도차익 산정과 관련하여, 토지와 건물 등을 함께 취득하거나 양도한 경우로서 그 토지와 건물 등을 구분기장한 가액이 법령으로 정하는 바에 따라 안분계산한 가액과 100분의 30 이상 차이가 있는 경우에 는 토지와 건물 등의 가액 구분이 불분명한 때로 본다.","pg":420},{"id":2219,"ch":49,"n":33,"q":"현행 「소득세법」상 양도가액 및 취득가액 추계 시 감정가액, 매매사례가액, 환산가액, 기준시가 순으로 적용한다.","a":"X","e":"현행 「소득세법」상 양도가액 및 취득가액 추계 시 매매사 례가액, 감정가액, 환산가액 기준시가 순으로 적용한다.","pg":420},{"id":2220,"ch":49,"n":34,"q":"양도차익을 계산할 때 양도가액을 기준시가에 따를 때에는 취득가액도 기준시가에 따른다.","a":"O","e":"","pg":420},{"id":2221,"ch":49,"n":35,"q":"양도차익 계산 시 자산의 가치를 증가시키거나 내용연수를 연장시키는 지출액은 계산서, 세금계산서, 신용카드매출전 표 등 현금영수증과 같은 적격증빙서류를 수취 · 보관하거나 실제 지출사실이 금융거래 증명서류에 의하여 확인되는 경 우에 한하여 인정한다.","a":"O","e":"","pg":420},{"id":2222,"ch":49,"n":36,"q":"장기보유특별공제의 적용 대상 자산은 토지·건물 및 부동 산에 관한 권리에 한한다.","a":"X","e":"장기보유특별공제의 적용 대상 자산은 토지·건물로서 보유기간이 3년 이상인 것과 조합원입주권에 대해서만 적용한다. 444 장기보유특별공제 대상 자산에 해당한다 하더라도 해당 자산이 법령에 따른 이듬기양도자산 또는 조합원으로부터 취득 한 조합원입주권이나 조정대상지역 특례에 해당하는 주택인 경우에 는 공제를 적용하지 아니함 주의","pg":420},{"id":2223,"ch":49,"n":37,"q":"양도소득 기본공제는 미등기양도자산에 대해서는 적용할 수 없다.","a":"O","e":"","pg":421},{"id":2224,"ch":49,"n":38,"q":"납세지 관할 세무서장 또는 지방국세청장은 양도소득이 있 는 거주자의 행위 또는 계산이 그 거주자의 특수관계인과의 거래로 인하여 그 소득에 대한 조세 부담을 부당하게 감소 시킨 것으로 인정되는 경우에는 그 거주자의 행위 또는 계 산과 관계없이 해당 과세기간의 소득금액을 계산할 수 있다.","a":"O","e":"","pg":421},{"id":2225,"ch":49,"n":39,"q":"양도일로부터 소급하여 10년 이내 배우자(양도 당시 혼인관 계가 소멸된 경우 및 사망으로 혼인관계가 소멸한 경우 포 함. 증여자가 직계존비속인 경우 양도 당시 증여한 직계존비 속이 사망한 경우 포함) 또는 직계존비속으로부터 증여받은 토지·건물·부동산을 취득할 수 있는 권리·시설물 이용권 을 양도한 경우 그 양도차익을 계산함에 있어서 취득가액은 해당 자산을 증여한 배우자의 취득 당시에 따른 금액으로 한다.","a":"X","e":"양도일로부터 소급하여 10년 이내 배우자(양도 당시 혼인 관계가 소멸된 경우를 포함, 사망으로 혼인관계가 소멸한 경우 제외. 증여자가 직계존비속인 경우 양도 당시 증어 한 직계존비속이 사망한 경우 제외NEW) 또는 직계존비속 으로부터 증여받은 토지·건물· 부동산을 취득할 수 있 는 권리·시설물 이용권을 양도한 경우 그 양도차익을 계 산함에 있어서 취득가액은 해당 자산을 증여한 배우자의 취득 당시에 따른 금액으로 한다.","pg":421},{"id":2226,"ch":49,"n":40,"q":"이월과세가 적용되면 양도소득세가 비과세되는 1세대1주택 양도에 해당하게 되는 경우 이월과세를 적용하지 않는다.","a":"O","e":"","pg":421},{"id":2227,"ch":49,"n":41,"q":"배우자 또는 직계존비속으로부터 증여받은 토지 등을 양도 한 경우로서 이월과세를 적용하는 경우 증여받은 재산의 양 도소득에 대하여는 증여자와 수증자가 연대하여 납세의무를 진다.","a":"X","e":"이월과세 규정을 적용하는 경우에 당초 증여자는 연대납 세의무를 지지 않는다. 비교 증여를 통한 우회양도 시 양도소득세는 증여자와 수증자가 연 대하여 납세의무를 징","pg":421},{"id":2228,"ch":49,"n":42,"q":"특수관계인에게 자산을 증여(이월과세 규정이 적용되는 배 우자 및 직계존비속은 제외)한 후 그 자산을 증여받은 자가 그 증여일부터 10년 이내에 다시 타인에게 양도한 경우 증 여받은 자의 증여세와 양도소득세를 합한 세액이 증여자가 직접 양도하는 경우로 보아 계산한 양도소득세보다 적은 경 우에는 증여자가 그 자산을 직접 타인에게 양도한 것으로 본다.","a":"O","e":"","pg":422},{"id":2229,"ch":49,"n":43,"q":"부담부증여 시 수증자가 부담하는 채무액에 해당하는 부분 은 양도로 본다.","a":"O","e":"","pg":422},{"id":2230,"ch":49,"n":44,"q":"미등기 양도자산의 경우에는 장기보유특별공제, 양도소득기 본공제가 적용되지 아니하나 양도소득 비과세 규정은 적용 된다.","a":"X","e":"미등기 양도자산의 경우에는 장기보유특별공제. 양도소 득기본공제가 적용되지 아니하고 양도소득에 대한 소득 세의 비과세 및 감면에 관한 규정도 적용하지 아니한다.","pg":422},{"id":2231,"ch":49,"n":45,"q":"「소득세법」상 거주자가 국내에 소재하는 주택을 취득에 관 한 등기를 하지 아니하고 양도하는 경우로서 취득가액을 실 지거래가액에 의하지 않는 경우 주택 취득 당시 법령이 정 하는 가격에 일정비율을 곱한 금액을 필요경비로 공제할 수 있다.","a":"O","e":"","pg":422},{"id":2232,"ch":49,"n":46,"q":"해당 과세기간의 과세표준이 없거나 결손금액이 있는 경우 에는 양도소득과세표준의 확정신고를 하지 아니한다. 1x","a":"X","e":"해당 과세기간의 과세표준이 없거나 결손금액이 있는 경 우에도 예정신고를 하여야 하며, 예정신고를 한 자는 다 음의 경우를 제외하고는 확정신고하지 아니할 수 있다. ① 해당 과세기간에 기본세율 적용대상 자산에 대한 예정신고를 2회 이상 한 자가 이미 신고한 양도소 득금액과 합산하여 신고하지 아니한 경우 ② 그룹별 자산을 2회 이상 양도한 경우로서 양도소득 기본공제의 공제순서 규정을 적용하면 당초 신고한 양도소득산출세액이 달라지는 경우 따라서 해당 과세기간의 과세표준이 없거나 결손금액이 있는 경우에도 원칙적으로 양도소득과세표준의 확정신고 를 해야 한다.","pg":423},{"id":2233,"ch":49,"n":47,"q":"건물(건물에 부속된 시설물과 구축물 포함)을 양도한 거주자 는 양도소득과세표준을 그 양도일로부터 2개월 이내에 대통 령령으로 정하는 바에 따라 납세지 관할 세무서장에게 신고 하여야 한다.","a":"X","e":"건물(건물에 부속된 시설물과 구축물 포함)을 양도한 거 주자는 양도소득과세표준을 양도일이 속하는 달의 말일 로부터 2개월 이내에 대통령령으로 정하는 바에 따라 납 세지 관할 세무서장에게 신고하여야 한다.","pg":423},{"id":2234,"ch":49,"n":48,"q":"부담부증여의 채무액에 해당하는 부분으로서 양도로 보는 경우 그 양도일이 속하는 달의 말일부터 2개월 내에 양도소 득과세표준을 납세지 관할 세무서장에게 신고해야 한다.","a":"X","e":"부담부증여의 채무액에 해당하는 부분으로서 양도로 보 는 경우 그 양도일이 속하는 달의 말일부터 3개월 내에 양도소득과세표준을 납세지 관할 세무서장에게 신고해야 한다. 비교 토지건물, 부동산에 관한 권리, 기타자산, 신탁수익권의 양도의 경우 그 양도일이 속하는 달의 말일부터 2개월 이내임","pg":423},{"id":2235,"ch":49,"n":49,"q":"토지를 2회 이상 양도한 경우로서 양도소득 기본공제를 적 용할 경우 당초 신고한 양도소득 산출세액에 달라지는 경우 에는 양도소득 예정신고를 한 경우에는 확정신고를 하지 않 을 수 있다.","a":"X","e":"토지를 2회 이상 양도한 경우로서 양도소득 기본공제를 적용할 경우 당초 신고한 양도소득 산출세액에 달라지는 경우에는 양도소득 예정신고를 한 거주자이더라도 확정 신고를 하여야 한다.","pg":423},{"id":2236,"ch":49,"n":50,"q":"지 세 납 할 관 서 무 세 장 는 또 방 지 장 청 세 국 은 도 양 득 소 세 과 표탈 준 과 액 세 을 정 결 는 또 정 경 한 후 그 정 결 는 또 정 경 에 루 는 또 류 오 가 는 있 이 것 견 발 된 우 경 는 에 견 발 된 날 터 부 로 2 개 이 내 다 시 정 경 다 한 . 월","a":"X","e":"지 세 납 할 관 서 무 세 장 는 또 방 지 장 청 세 국 은 도 양 득 소 과 세 준 표 과 액 세 을 정 결 는 또 정 경 한 후 그 정 결 는 또 정 경 에 루 탈 는 또 류 오 가 는 있 이 것 견 발 된 우 경 는 에 시 즉 다 시 정 경 다 한 .","pg":424},{"id":2237,"ch":49,"n":51,"q":"해당 산 자 의 일 도 양 지 까 계 속 0 1 년 상 이 내 국 에 소 주 또 는 소 거 를 둔 자 주 거 는 외 국 산 자 에 한 대 도 양 세 득 소 세 납 무 의 를 담 부 다 한 . OIX 52 외 국 산 자 의 도 양 액 가 은 도 양 시 당 의 지 실 래 거 액 가 을 할 인 확 수 는 없 우 경 에 도 양 산 자 이 재 소 는 하 가 국 의 양도 시 당 현 황 을 반 영한 가 시 에 되 르 따 , 가 시 를 정 산 기 하 어 려 울 때 에 는 그 산 자 의 류 종 , 모 규 , 래 거 황 상 등 을 려 고 여 하 령 법 로 으 정 는 하 법 방 에 다 른 따 .","a":"X","e":"당 해 산 자 의 일 도 양 지 까 속 계 5 년 상 이 내 국 에 소 주 는 또 소 거 를 둔 자 주 거 는 외 국 산 자 에 한 대 도 양 세 득 소 세 납 의 를 무 담 부 다 한 . 5 2 O 출 제 ■ 콤 콤 콤 C I K N I L 오 다 진 p . 70 0 법 세 2 p . 6 0 7","pg":424},{"id":2238,"ch":49,"n":52,"q":"외 국 산 자 을 도 양 한 경 우 기 장 유 보 별 특 제 공 를 용 적 지 하 않 는 다 .","a":"O","e":"","pg":424},{"id":2239,"ch":49,"n":53,"q":"외 국 산 자 의 도 양 에 대 한 도 양 익 차 을 계 산 할 때 도 양 액 가 에거 서 제 공 는 하 요 필 비 경 는 해 당 산 자 의 득 취 에 든 지 실 가 래 액 을 확 인할 수 는 있 우 경 는 에 그 액 가 과 령 법 로 으 정 하 는 본 자 적 액 출 지 및 도 양 비 를 합 한 액 금 로 으 한 다 .","a":"O","e":"4","pg":424},{"id":2240,"ch":49,"n":54,"q":"외 국 산 자 을 도 양 한 경 우 도 양 익 차 의 외 화 환 산 , 득 취 에 드 는 지 실 래 거 액 가 , 가 시 의 산 정 등 요 필 비 경 의 산 계 은 신 고 당 시 의 「 환 국 외 법 래 거 」 에 의 한 준 기 율 환 또 는 정 재 율 환 에 의 하 여 산 계 다 한 .","a":"X","e":"외 국 산 자 을 도 양 한 경 도 양 익 차 의 외 화 환 산 , 득 취 에 드는 지 실 래 거 액 가 , 우 가 시 의 산 정 등 요 필 비 경 의 산 계 은외계 도 양 액 가 및 요 필 비 경 를 령 수 나 거 하 출 지 한 날 현 재 환 국 법 래 거 」 에 의 한 준 기 율 환 또 는 정 재 율 환 에 의 하 여 산 다 한 . C HA PTER 1 0 도 양 세 득 소 5 4 4 .","pg":424},{"id":2241,"ch":49,"n":56,"q":"국외자산의 양도소득에 대하여 해당 외국에서 과세를 하는 경우에 그 양도소득에 대하여 법령으로 정하는 국외자산 양 도소득에 대한 세액을 납부하였거나 납부할 것이 있을 때에 는 그 세액을 해당 과세기간의 양도소득금액 계산상 필요경 비에 산입하는 방법만 적용받을 수 있다.","a":"X","e":"국외자산의 양도소득에 대하여 해당 외국에서 과세를 하 는 경우에 그 양도소득에 대하여 법령으로 정하는 국외자 산 양도소득에 대한 세액을 납부하였거나 납부할 것이 있 을 때에는 그 세액을 해당 과세기간의 양도소득금액 계 산상 필요경비에 산입하는 방법과 외국납부세액공제액을 개원하여 산출세액에서 공제하는 방법 중 선택하여 적용 받을 수 있다.","pg":425},{"id":2242,"ch":50,"n":1,"q":"「부가가치세법」상 과세사업자가 예정신고 또는 확정신고를 한 경우에도 해당 과세기간의 다음 연도 2월 10일까지 사업 장 소재지 관할 세무서장에게 「소득세법」에 따른 사업장 현 황신고를 해야 한다.","a":"X","e":"「부가가치세법」상 과세사업자가 예정신고 또는 확정신고 를 한 경우에는 「소득세법」에 따른 사업장 현황신고를 한 것으로 본다. 따라서 「소득세법」상 사업장 현황신고 대상 에서 제외된다.","pg":426},{"id":2243,"ch":50,"n":2,"q":"「부가가치세법」상 면세사업만을 영위하는 사업자는 사업장 현황신고를 하여야 한다.","a":"O","e":"","pg":426},{"id":2244,"ch":50,"n":3,"q":"해당 과세기간의 종합소득금액이 있는 거주자가 종합소득과 세표준이 없는 경우에는 종합소득과세표준확정신고 의무가 없다.","a":"X","e":"해당 과세기간의 종합소득금액이 있는 거주자가 종합소 득 과세표준이 없거나 결손금이 있는 경우에도 과세표준 확정신고는 하여야 한다.","pg":426},{"id":2245,"ch":50,"n":4,"q":"소득금액이 있는 거주자는 과세표준을 해당 과세기간의 다 음 연도 5월 1일부터 5월 31일까지 납세지 관할 세무서장에 게 신고해야 하지만 과세표준이 없거나 결손금이 있는 경우 에는 그러하지 아니하다.","a":"X","e":"소득금액이 있는 거주자는 과세표준을 해당 과세기간의 다음연도 5월 1일부터 5월 31일까지 납세지 관할 세무서 장에게 신고해야 하며 과세표준이 없거나 결손금이 있는 경우에도 과세표준확정신고는 하여야 한다.","pg":426},{"id":2246,"ch":50,"n":5,"q":"과세표준확정신고를 하여야 할 거주자가 주소 또는 거소의 국외이전을 위하여 출국하는 경우에는 출국일이 속하는 과 세기간의 과세표준을 해당 과세기간 종료일까지 신고하여야 한다.","a":"X","e":"과세표준확정신고를 하여야 할 거주자가 주소 또는 거소 의 국외이전을 위하여 출국하는 경우에는 출국일이 속하 는 과세기간의 과세표준을 출국일 전날까지 신고하여야 한다.","pg":426},{"id":2247,"ch":50,"n":6,"q":"거주자가 사망한 경우 그 상속인은 그 상속개시일이 속하는 달의 말일부터 3개월이 되는 날(이 기간 중 상속인이 출국하 는 경우에는 출국일 전날)까지 사망일이 속하는 과세기간에 대한 그 거주자의 과세표준을 납세지 관할 세무서장에게 신 고하여야 한다.","a":"X","e":"거주자가 사망한 경우 그 상속인은 그 상속개시일이 속하 는 달의 말일부터 6개월이 되는 날(이 기간 중 상속인이 출국하는 경우에는 출국일 전날)까지 사망일이 속하는 과 세기간에 대한 그 거주자의 과세표준을 납세지 관할 세무 서장에게 신고하여야 한다.","pg":426},{"id":2248,"ch":50,"n":7,"q":"공적연금소득만 있는 거주자는 해당 소득에 대해 과세표준 확정신고를 해야 한다.","a":"X","e":"공적연금소득만 있는 거주자는 해당 소득에 대해 과세표 준확정신고를 하지 아니할 수 있다.","pg":427},{"id":2249,"ch":50,"n":8,"q":"근로소득 및 공적연금소득만이 있는 자는 과세표준 확정신 고를 하지 아니하여도 된다.","a":"X","e":"근로소득만 있거나 공적연금소득만 있는 경우에는 과세 표준확정신고를 하지 않을 수 있으나, 근로소득과 공적 연금소득이 있는 자는 과세표준확정신고를 하여야 한다.","pg":427},{"id":2250,"ch":50,"n":9,"q":"근로소득 및 퇴직소득만 있는 거주자도 해당 소득에 대하여 과세표준확정신고를 하여야 한다. ○","a":"X","e":"근로소득 및 퇴직소득만 있는 거주자는 해당 소득에 대하 여 과세표준확정신고를 하지 아니할 수 있다.","pg":427},{"id":2251,"ch":50,"n":10,"q":"원천징수대상이 아닌 사업소득만 있는 자는 해당 소득에 대 한 과세표준확정신고를 하지 아니할 수 있다.","a":"X","e":"원천징수되는 사업소득으로서 연말정산 대상이 되는 사 일소만 있는 지는 해당 소득에 대한 과세표준확정신고 를 하지 아니할 수 있다.","pg":427},{"id":2252,"ch":50,"n":11,"q":"분리과세 이자소득· 분리과세 배당소득. 분리과세 연금소 득 및 분리과세 기타소득만 있는 자는 해당 소득에 대한 과 세표준확정신고를 하지 아니할 수 있다. ○","a":"O","e":"","pg":427},{"id":2253,"ch":50,"n":12,"q":"소득세를 수시부과한 후 추가로 발생한 소득이 없을 경우에 도 과세표준확정신고는 해야 한다.","a":"X","e":"소득세를 수시부과한 후 추가로 발생한 소득이 없을 경우 에는 과세표준확정신고를 하지 아니할 수 있다.","pg":427},{"id":2254,"ch":50,"n":13,"q":"복식부기의무자는 종합소득과세표준 확정신고 시 재무상태 표, 손익계산서, 이익잉여금처분계산서 및 조정계산서를 제 출하여야 하며, 이를 제출하지 않은 경우에는 무신고로 본 다.","a":"X","e":"복식부기의무자는 종합소득과세표준확정신고 시 재무상 태표, 손익계산서와 그 부속서류, 합계잔액시산표 및 조 정계산서를 제출하지 아니한 경우에는 종합소득과세표준 확정신고를 아니한 것으로 본다. 이때, 「법인세법」과 달리 이익잉여금처분계산서는 필수첨부서류에 포함되지 않음 을 주의한다.","pg":427},{"id":2255,"ch":50,"n":14,"q":"거주자는 해당 과세기간의 과세표준에 대한 종합소득 산출 세액에서 감면세액과 세액공제액을 공제한 금액을 과세표준 확정신고기한까지 대통령령으로 정하는 바에 따라 납세지 관할 세무서, 한국은행 또는 체신관서에 납부하여야 한다.","a":"O","e":"","pg":428},{"id":2256,"ch":50,"n":15,"q":"거주자로서 종합소득세 확정신고에 따라 납부할 세액이 1천 만원을 초과하는 자는 납부기한이 지난 후 1개월 이내에 분 납할 수 있다.","a":"X","e":"거주자로서 종합소득세 확정신고에 따라 납부할 세액이 1 천만원을 초과하는 자는 납부기한이 지난 후 2개월 이내 에 분납할 수 있다.","pg":428},{"id":2257,"ch":50,"n":16,"q":"거주자로서 과세표준의 확정신고에 따라 납부할 세액이 1천 8백만원인 자는 9백만원을 납부기한이 지난 후 90일 이내 에 분납할 수 있다.","a":"X","e":"납부세액이 2천만원 이하이므로 1천만원을 초과하는 9백 만원을 납부기한이 지난 후 2개월 이내에 분납할 수 있 다.","pg":428},{"id":2258,"ch":50,"n":17,"q":"「소득세법」상 확정신고납부할 세액이 2천만원을 초과하는 거주자는 그 세액의 100분의 50 이하의 금액을 납부기한이 지난 후 2개월 이내에 분할납부할 수 있다.","a":"O","e":"","pg":428},{"id":2259,"ch":50,"n":18,"q":"세무사가 성실신고확인대상사업자에 해당하는 경우에는 자 신의 사업소득금액의 적정성에 대하여 해당 세무사가 성실 신고확인서를 작성·제출할 수 있다.","a":"X","e":"세무사가 성실신고확인대상사업자에 해당하는 경우에는 자신의 사업소득금액의 적정성에 대하여 해당 세무사가 성실신고확인서를 작성·제출해서는 아니 된다.","pg":428},{"id":2260,"ch":50,"n":19,"q":"성실신고확인대상 사업자가 성실신고확인서를 제출하는 경 우에는 종합소득과세표준 확정신고를 그 과세기간의 다음 연도 6월 1일부터 6월 30일까지 해야 한다.","a":"X","e":"성실신고확인대상 사업자가 성실신고확인서를 제출하는 경우에는 종합소득과세표준 확정신고를 그 과세기간의 다음 연도 5월 1일부터 6월 30일까지 해야 한다.","pg":428},{"id":2261,"ch":50,"n":20,"q":"납세지 관할 세무서장은 성실신고확인서에 미비한 사항이 있을 때에는 그 보정을 요구할 수 있다.","a":"O","e":"","pg":428},{"id":2262,"ch":50,"n":21,"q":"성실신고확인대상 사업자가 성실신고확인서를 납세지 관할 세무서장에게 제출하지 아니한 경우에는 사업소득금액이 종 합소득금액에서 차지하는 비율을 종합소득산출세액에 곱하 여 계산한 금액의 100분의 20에 해당하는 금액을 결정세액 에 더한다.","a":"X","e":"성실신고확인대상 사업자가 성실신고확인서를 납세지 관할 세무서장에게 제출하지 아니한 경우에는 사업소득 금액이 종합소득금액에서 차지하는 비율을 종합소득산출 세액에 곱하여 계산한 금액의 100분의 5에 해당하는 금 액과 사업소득수입금액의 0.02% 중 큰 금액을 가산세 로 부과한다.","pg":429},{"id":2263,"ch":50,"n":22,"q":"납세지 관할 세무서장 또는 지방국세청장은 과세표준확정신 고를 하여야 할 자가 신고를 하지 않은 경우에는 과세표준 확정신고기일로부터 5년 이내에 해당 과세기간의 과세표준 과세액을 결정하는 것이 원칙이다.","a":"X","e":"납세지 관할 세무서장 또는 지방국세청장은 과세표준확 정신고를 하여야 할 자가 신고를 하지 않은 경우에는 과 세표준확정신고기일로부터 1년 이내에 해당 과세기간의 과세표준과 세액을 결정하여야 하는 것이 원칙이다.","pg":429},{"id":2264,"ch":50,"n":23,"q":"국내에 있는 부동산 및 그 밖의 자산 또는 국내에서 경영하 는 사업과 관련하여 받은 보험금, 보상금 또는 손해배상금은 비거주자의 국내원천소득에 해당한다.","a":"O","e":"","pg":429},{"id":2265,"ch":50,"n":24,"q":"광산·채석장 또는 해저천연자원이나 그 외 천연자원의 탐 사 및 채취장소는 국내사업장에 해당하지 아니한다.","a":"X","e":"광산·채석장 또는 해저천연자원이나 그 외 천연자원의 탐사 및 채취장소는 국내사업장에 해당한다.","pg":429},{"id":2266,"ch":50,"n":25,"q":"비거주자가 자산의 단순한 구입만을 위하여 사용하는 일정 한 장소는 국내사업장에 해당하지 아니한다.","a":"O","e":"","pg":429},{"id":2267,"ch":50,"n":26,"q":"비거주자가 자기의 자산을 타인으로 하여금 가공하게 하기 위하여만 사용하는 일정한 장소는 국내사업장에 해당하지 아니한다. 0%","a":"O","e":"수요 중","pg":429},{"id":2268,"ch":50,"n":27,"q":"비거주자에 대해서는 인적공제 중 비거주자 본인 및 배우자 에 대한 기본공제만 적용하고, 그 외의 자에 대한 공제와 특 별소득공제·자녀세액공제·특별세액공제를 적용하지 않는 다.","a":"X","e":"비거주자에 대해서는 인적공제 중 비거주자 본인에 대한 인적공제만 적용하고, 본인 외의 자에 대한 공제와 특별 소득공제 · 자녀세액공제 · 특별세액공제를 적용하지 않 는다.","pg":430},{"id":2269,"ch":50,"n":28,"q":"비거주자의 중간예납에 관하여는 거주자의 신고와 납부에 관한 규정을 준용하지 아니한다.","a":"X","e":"비거주자의 중간예납에 관하여는 거주자의 신고와 납부 에 관한 규정을 준용한다.","pg":430},{"id":2270,"ch":50,"n":29,"q":"비거주자에 대하여 과세하는 소득세는 해당 국내원천소득을 종합하여 과세하는 경우와 분류하여 과세하는 2가지 과세방 법이 있으며, 국내원천소득을 분리하여 과세하는 방법은 채 택하지 않고 있다.","a":"X","e":"비거주자에 대하여 과세하는 소득세는 국내원천소득의 종합과세. 분류과세, 분리과세의 총 3가지 과세방법을 두 고 있다.","pg":430},{"id":2271,"ch":50,"n":30,"q":"국내에서 제공하는 근로의 대가로 받는 퇴직소득이 있는 비 거주자에 대해서는 국내사업장 유무와 관계없이 거주자와 같은 방법으로 분류하여 과세한다.","a":"X","e":"국내원천 퇴직소득 및 국내원천 부동산 등 양도소득이 있 는 비거주자에 대해서는 국내사업장 유무와 관계없이 거 주자와 같은 방법으로 분류하여 과세한다.","pg":430},{"id":2272,"ch":50,"n":31,"q":"국내원천 부동산 등 양도소득이 있는 비거주자에게 과세할 경우에 거주자의 공제 규정을 준용하여 양도소득 1세대1주 택 비과세·조합원입주권 비과세, 1세대1주택에 대한 장기보 유특별공제를 적용한다. 01X","a":"X","e":"국내원천 부동산 등 양도소득이 있는 비거주자에게 과세 할 경우에 양도소득 1세대1주택 비과세· 조합원입주권 비과세, 1세대1주택에 대한 장기보유특별공제는 적용하 지 않는다.","pg":430},{"id":2273,"ch":51,"n":1,"q":"영리법인은 유증 또는 사인증여로 취득한 재산에 대해 상속 세를 납부할 의무가 있다.","a":"X","e":"비영리법인은 유증 또는 사인증여로 취득한 재산에 대해 상속세를 납부할 의무가 있다. 비교 영리법인의 경우 자산수증이익이므로 법인세를 과세함","pg":431},{"id":2274,"ch":51,"n":2,"q":"상속세는 취득과세형 방법을 취하고 있다.","a":"X","e":"상속세는 유산과세형 방법을 취하고 있다. 비교 증여세는 취득과세형 방법을 취하고 있다.","pg":431},{"id":2275,"ch":51,"n":3,"q":"비거주자가 사망한 경우에는 상속개시일 현재 국내에 있는 비거주자의 모든 상속재산에 대하여 상속세를 부과한다. O:X","a":"O","e":"","pg":431},{"id":2276,"ch":51,"n":4,"q":"상속인 또는 수유자는 각자가 받았거나 받을 재산을 한도로 연대하여 상속세를 납부할 의무를 진다.","a":"O","e":"","pg":431},{"id":2277,"ch":51,"n":5,"q":"상속세는 상속재산의 소재지를 관할하는 세무서장이 과세하 는 것이 원칙이다.","a":"X","e":"상속개시지가 국내인 경우 상속세는 피상속인의 주소지 (주소지가 없거나 분명하지 아니한 경우에는 거소지)를 관할하는 세무서장(국세청장이 특히 중요하다고 인정하 는 것에 대해서는 관할 지방국세청장)이 과세하는 것을 원칙으로 한다. 비교 상속개시지가 국외인 경우 상속재산 소재지를 관할하는 세무 서장 등이 과세함","pg":431},{"id":2278,"ch":51,"n":6,"q":"상속세 과세표준이 10만원 미만인 때에는 상속세를 부과하 지 아니한다. OX 45 제7편 상속세 및 증여세법","a":"X","e":"상속세 과세표준이 50만원 미만인 때에는 상속세를 부과 하지 아니한다.","pg":431},{"id":2279,"ch":51,"n":7,"q":"상속재산에는 피상속인의 일신에 전속하는 것으로서 피상속 인의 사망으로 인하여 소멸되는 것도 포함된다.","a":"X","e":"상속재산 중 피상속인의 일신에 신수하는 것으로서 이상 속인의 사망으로 인하여 소멸되는 것은 제외한다.","pg":432},{"id":2280,"ch":51,"n":8,"q":"피상속인의 사망으로 인하여 받는 생명보험의 보험금으로서 피상속인이 보험계약자인 보험계약에 의하여 받는 것은 상 속재산으로 보지 아니한다. 09 손해보험계약자가 피상속인이 아닌 경우 피상속인이 실질적 으로 보험료를 납부하였더라도 피상속인의 사망으로 인하여 받는 보험금은 상속재산으로 보지 아니한다. OX 10 피상속인이 신탁한 재산은 상속재산으로 보며, 수익자의 증 여재산가액으로 하는 신탁의 이익을 받을 권리의 가액도 상 속재산으로 본다.","a":"X","e":"피상속인의 사망으로 인하여 받는 생내보험의 보 로서 피상속인이 보험계약자인 보험계약에 의하여 만든 것은 상속재산으로 본다. 09 × 손해보험계약자가 피상속인이 아닌 경우에도 피상추씨 실질적으로 보험료를 납부하였을 때에는 피상속인의 서 망으로 인하여 받는 보험금은 상속재산으로 70, 10x 피상속인이 신탁한 재산은 상속재산으로 본다. 다만, 수 익자의 증여재산가액으로 하는 신탁의 이익을 받을 권리 의 가액은 상속재산으로 보지 아니한다.","pg":432},{"id":2281,"ch":51,"n":11,"q":"피상속인이 신탁으로 인하여 타인으로부터 신탁의 이익을 받을 권리를 소유하고 있는 경우에는 그 이익에 상당하는 가액은 상속재산으로 보지 아니한다.","a":"X","e":"피상속인이 신탁으로 인하여 타인으로부터 신탁의 이익 을 받을 권리를 소유하고 있는 경우에는 그 이익에 상당 하는 가액을 상속재산에 포함한다.","pg":432},{"id":2282,"ch":51,"n":12,"q":"수익자연속신탁의 수익자가 사망함으로써 타인이 새로 신탁 의 수익권을 취득하는 경우 그 타인이 취득한 신탁의 이익 을 받을 권리의 가액은 사망한 수익자의 상속재산에 포함한 다. OIX 13 피상속인에게 지급될 퇴직금이 피상속인의 사망으로 인하여 시급되는 경우 그 금액은 상속재산으로 보지 아니한다.","a":"O","e":"13 × 피상속인에게 지급된 퇴직금, 퇴직수당·공로금 · 연금· 또는 이에 유사한 것이 피상속인의 사망으로 인하여 지급 되는 경우 그 금액은 의제 상속재산가액에 포함하여 상속 세가 부과된다.","pg":432},{"id":2283,"ch":51,"n":14,"q":"「국민연금법」에 따라 지급되는 유족연금은 상속재산으로 본 다.","a":"X","e":"「국민연금법」· 「공무원연금법」· 「사립학교교원연금법」. 「군인연금법」·「전직대통령 예우에 관한 법률」・「별정우 체국법」 등에 따라 지급되는 유족연금 등은 상속재산으로 보지 아니한다.","pg":433},{"id":2284,"ch":51,"n":15,"q":"피상속인이 재산을 처분하여 받은 금액이나 피상속인의 재 산에서 인출한 금액이 상속개시일 전 1년 이내에 재산종류 별로 계산하여 2억원 이상인 경우로서 용도가 객관적으로 명백하지 아니한 경우에는 이를 상속받은 것으로 추정하여 상속세 과세가액에 산입한다.","a":"O","e":"","pg":433},{"id":2285,"ch":51,"n":16,"q":"피상속인이 상속개시일 1년 6개월 전에 부담한 금융회사에 대한 채무 2억원의 용도가 객관적으로 명백하지 아니한 경 우 그 금액은 상속받은 것으로 추정하여 상속세 과세가액에 산입한다.","a":"X","e":"피상속인이 부담한 채무를 합친 금액이 상속개시일 전 2 1년 이내에 5억원 이상(또는 1년 이내에 2억원 이상)인 경 우로서 용도가 객관적으로 명백하지 아니한 경우에는 이 를 상속받은 것으로 추정하여 상속세 과세가액에 산입한 다. 따라서 피상속인이 상속개시일 1년 6개월 전에 부담 한 금융회사에 대한 채무 2억원의 용도가 객관적으로 명 백하지 아니한 경우는 이에 해당하지 아니한다.","pg":433},{"id":2286,"ch":51,"n":17,"q":"상속재산 중 상속인이 상속세 과세표준신고기한 이내에 국 가. 지방자치단체 또는 공공단체에 증여한 재산에 대해서는 상속세를 부과하지 아니한다.","a":"O","e":"","pg":433},{"id":2287,"ch":51,"n":18,"q":"제사를 주재하는 상속인이 상속받은 족보와 제구에 대하여 는 재산가액 합계액 2억원을 한도로 상속세를 부과하지 아 니한다.","a":"X","e":"제사를 주재하는 상속인이 상속받은 족보와 제구에 대하 여는 재산가액 합계액 1천만원을 한도로 상속세를 부과하 지 아니한다.","pg":433},{"id":2288,"ch":51,"n":19,"q":"비거주자의 사망으로 상속이 개시되는 경우 상속재산가액에 서 장례비용은 공제하지 않는다.","a":"O","e":"","pg":433},{"id":2289,"ch":51,"n":20,"q":"일 시 개 전 0 1 년 이 내에 인 속 상 피 이 인 속 상 이 닌 아 자 에 속 상 거진 여 증 무 채 는 속 상 산 재 의 액 가 서 에 지 빼 다 한 니 아 .","a":"X","e":"속 상 일 시 개 전 5 년 에 내 이 인 속 상 피 이 인 속 상 이 닌 아 자 게 에 진 여 증 무 채 는 속 상 산 재 의 액 가 서 에 지 폐 다 한 니 아 . 교 비 속 상 일 시 개 전 0 1 년 에 내 이 인 속 상 게 에 진 여 증 는 우 채 속 상 재 산 의 액 가 서 에 지 빼 함 니 아","pg":434},{"id":2290,"ch":52,"n":1,"q":"속 상 일 시 개 전 8 년 이 내 인 속 상 피 이 인 속 상하 게 에 여 증 한 산 재 액 가 은 속 상 시 개 에 시 당 의 가 시 로 가 평 여 속 상 산 재 에 산 가 다 한 . ○","a":"X","e":"속 상 일 시 개 전 8 년 에 내 이 인 속 상 피 이 인 속 상 게 에 여 증 한 산 재 액 가 은 여 증 일 재 현 의 가 시 로 가 평 여 하 속 상 산 재 에 산 가 다 한 .","pg":434},{"id":2291,"ch":52,"n":2,"q":"속 상 산 재 에 산 가 한 여 증 산 재 에 대한 증 여 시 당 의 증 여세 산 출 액 세 을 상 속세 출 산 액 세 서 에 제 공 는 하 것 은 중 이 세 과 를 지 방 기 하 함 위 다 이 .","a":"O","e":"","pg":434},{"id":2292,"ch":52,"n":3,"q":"자 주 거 의 망 사 ( 자 주 거 비 의 망 사 을 함 포 ) 로 으 속 상 이 시 개 되 는 우 경 에 1 원 억 을 초 기 제 공 다 한 . ○ ☑","a":"X","e":"자 주 거 의 망 사 ( 자 주 거 비 의 망 사 을 함 포 ) 로 으 속 상 이 개 시 되 우 경 에 2 원 억 을 초 기 제 공 다 한 . 는","pg":434},{"id":2293,"ch":52,"n":4,"q":"자 주 거 의 망 사 로 으 속 상 이 개 시된 경우 인 속 상 피 의 거 동 자 녀 가 자 년 성 미 서 면 이 인 애 장 인 경우 녀 자 제 공 , 자 년 성 미 공 제 및 인 애 장 제 공 를 두 모 용 적 을 받 수 다 있 . 25 자 주 거 의 망 사 로 으 속 상 이 시 개 는 되 우 경 서 로 녀 자 ( 아 태 를 • 함 포 ) 1 명 에 는 서 해 대 3 원 만 천 을 상속세 세 과 액 가 서 에 공 제 다 한 .","a":"X","e":"5 2 X 오른다 p . 7 1 8 4 2 2 p . 6 4 2 자 주 거 의 망 사 로 으 속 상 이5 시 개 는 되 우 경 서 로 녀 자 ( 아 태 를 함 포 ) 1 명 에 대해서는 원 만 천 을 상 속세 세 과 액 가 서 에 제 공 다 한 .","pg":434},{"id":2294,"ch":52,"n":5,"q":"적 인 제 공 자 상 대 가 인 속 상 서 로 으 속 상 을 포 기한 우 경 면 라 그 속 상 기 포 인 에 는 여 하 대 적 인 제 공 를 용 적 지 하 않는다.","a":"X","e":"6 제 공 자 상 대 가 속 상 의 기 포 등 로 으 속 상 을 받 지 아 니 적 인 하는 우 경 도 에 적 인 제 공 를 용 적 다 한 .","pg":434},{"id":2295,"ch":52,"n":6,"q":"상속인 및 동거가족 중 장애인에 대해서는 장애인 1명당 1,000만원에 19세가 될 때까지의 연수를 곱하여 계산한 금 액을 공제한다.","a":"X","e":"상속인 및 동거가족 중 장애인에 대해서는 장애인 1명당 1,000만원에 기대여명(「통계법」에 따라 통계청장이 승인 하여 고시하는 통계표상의 기대여명)의 인수를 곱하여 계 산한 금액을 공제한다. 비교 상속인(배우자 제외) 및 동거가족 중 미성년자(태아를 포함)에 대해서는 미성년자 1명당 1,000만원에 19세가 될 때까지의 연수를 곱항","pg":435},{"id":2296,"ch":52,"n":7,"q":"거주자의 사망으로 인하여 배우자 단독으로 상속받는 경우 로서 기초공제와 그 밖의 인적공제에 따른 공제액을 합친 금액이 5억원 미만이면 일괄공제 5억원을 공제받을 수 있다.","a":"X","e":"피상속인의 배우자가 단독으로 상속받는 경우에는 기초 공제와 그 밖의 인적공제액을 합친 금액으로만 공제하며, 일괄공제는 선택할 수 없다.","pg":435},{"id":2297,"ch":52,"n":8,"q":"배우자가 실제 상속받은 금액이 없거나 상속받은 금액이 5 억원 미만이면 5억원을 상속세 과세가액에서 공제한다.","a":"O","e":"","pg":435},{"id":2298,"ch":52,"n":9,"q":"거주자의 사망으로 상속이 개시되어 배우자가 상속인에 포 함되는 경우 배우자상속공제액은 최소 5억원과 최대 50억 원의 범위 내에서 결정된다.","a":"X","e":"거주자의 사망으로 상속이 개시되어 배우자가 상속인에 포함되는 경우 배우자상속공제액은 최소 5억원과 최대 30억원의 범위 내에서 결정된다.","pg":435},{"id":2299,"ch":52,"n":10,"q":"부와 모가 동시에 사망하였을 경우 상속세의 과세는 부와 모의 상속재산에 대하여 각각 개별로 계산하여 과세하며, 이 경우 배우자상속공제는 적용되지 아니한다.","a":"O","e":"","pg":435},{"id":2300,"ch":52,"n":11,"q":"상속개시일 현재 상속재산가액 중 순금융재산의 가액이 2천 만원인 경우에는 2천만원을 상속세 과세가액에서 공제한다.","a":"O","e":"","pg":435},{"id":2301,"ch":52,"n":12,"q":"법령의 요건을 모두 갖춘 경우에는 상속주택가액의 100분의 100에 상당하는 금액을 상속세 과세가액에서 공제하되, 그 공제할 금액은 5억원을 한도로 한다.","a":"X","e":"법령의 요건을 모두 갖춘 경우에는 상속주택가액의 100 분의 100에 상당하는 금액을 상속세 과세가액에서 공제 하되, 그 공제할 금액은 6억원을 한도로 한다.","pg":436},{"id":2302,"ch":52,"n":13,"q":"상속세 신고납부를 위하여 상속재산을 「감정평가 및 감정평 가사에 관한 법률」에 따른 감정평가업자에게 평가를 받아 그 평가수수료를 상속세 과세가액에서 공제받을 수 있는 경 우에는 1,000만원을 한도로 한다.","a":"X","e":"상속세 신고납부를 위하여 상속재산을 「감정평가 및 감정 평가사에 관한 법률」에 따른 감정평가업자에게 평가를 받 아 그 평가수수료를 상속세 과세가액에서 공제받을 수 있 는 경우에는 500만원을 한도로 한다. 비교 비상장주식의 평가심의위원회 의뢰 신용평가 전문기관의 평가 수수료는 평가대상법인의 수 및 평가를 의뢰한 신용평가전문기관의 수별로 각각 1천만원을 한도로 함","pg":436},{"id":2303,"ch":52,"n":14,"q":"상속인(대습상속인이 아님)이 피상속인의 자녀를 제외한 직 계비속이며 성년인 경우는 상속세 산출세액에 상속재산(상 속재산에 가산한 증여재산 중 상속인이 받은 증여재산을 포 함) 중 그 상속인이 받았거나 받을 재산이 차지하는 비율을 곱하여 계산한 금액의 100분의 40에 상당하는 금액을 가산 한다.","a":"X","e":"상속인(대습상속인이 아님)이 피상속인의 자녀를 제외한 직계비속이며 성년인 경우는 상속세 산출세액에 상속재 산상속재산에 가산한 증여재산 중 상속인이 받은 증여재 산을 포함) 중 그 상속인이 받았거나 받을 재산이 차지하 는 비율을 곱하여 계산한 금액의 100분의 30에 상당하는 금액을 가산한다. 베크 피상속인의 자녀를 제외한 직계비속이 미성년자에 해당하 는 상속인 또는 수유자가 받았거나 받을 상속재산가액이 20억원을 초과하는 경우에는 40%를 적용","pg":436},{"id":2304,"ch":52,"n":15,"q":"거주자의 사망으로 외국에 있는 상속재산에 대하여 부과된 외국납부세액에 상당하는 금액은 상속세 산출세액에서 공제 된다.","a":"O","e":"","pg":436},{"id":2305,"ch":53,"n":1,"q":"「상속세 및 증여세법」은 기본적으로 수증자에게 증여세가 과세되는 경우에는 소득세 또는 법인세를 부과하지 않도록 규정하고 있다.","a":"X","e":"「상속세 및 증여세법」은 기본적으로 수증자에게 소득세 또는 법인세가 과세되는 경우에는 증여세를 부과하지 않 도록 규정하고 있다.","pg":437},{"id":2306,"ch":53,"n":2,"q":"증여자의 사망으로 인하여 효력이 발생하는 증여에는 상속 세가 과세된다.","a":"O","e":"","pg":437},{"id":2307,"ch":53,"n":3,"q":"「상속세 및 증여세법」상 수증자가 거주자인 경우에는 증여 세 과세대상이 되는 국내에 있는 모든 증여재산에 대해서만 증여세를 납부할 의무를 진다.","a":"X","e":"「상속세 및 증여세법상 수증자가 비거주자인 경우에는 증여세 과세대상이 되는 국내에 있는 모든 증여재산에 대 해서만 증여세를 납부할 의무를 진다. 비교 거주자의 경우에는 증여세 과세대상이 되는 모든 증여재산에 대해서 증여세를 납부할 의무를 짐","pg":437},{"id":2308,"ch":53,"n":4,"q":"영리법인도 증여세를 납부할 의무가 있는 것을 원칙으로 한 다.","a":"X","e":"영리법인은 증여세에 대한 납세의무가 없는 것을 원칙으 로 한다. 참고 수증자가 영리법인이더라도 불구하고 명의신탁재산의 증여의 제규정에 따라 재산을 증여한 것으로 보는 경우에는 실제소유자 가 해당 재산에 대하여 증여세를 납부할 의무가 있음","pg":437},{"id":2309,"ch":53,"n":5,"q":"저가양수·고가양도에 따른 이익의 증여의 경우로서 수증자 가 증여세를 납부할 능력이 없다고 인정되는 경우로서 강제 징수를 하여도 증여세에 대한 조세채권을 확보하기 곤란한 경우 그에 상당하는 증여세의 전부 또는 일부를 면제한다.","a":"O","e":"","pg":437},{"id":2310,"ch":53,"n":6,"q":"수증자가 수증자의 주소나 거소가 분명하지 아니한 경우로 서 증여세에 대한 조세채권을 확보하기 곤란한 경우 증여자 는 수증자가 납부할 증여세를 연대하여 납부할 의무가 있다.","a":"O","e":"","pg":438},{"id":2311,"ch":53,"n":7,"q":"수증자가 비거주자인 경우에는 증여자가 수증자와 연대하여 해당 증여세를 납부할 의무를 진다.","a":"O","e":"","pg":438},{"id":2312,"ch":53,"n":8,"q":"증여세는 증여자의 주소지(주소지가 없거나 분명하지 아니 한 경우에는 거소지를 관할하는 세무서장(국세청장이 특히 중요하다고 인정하는 것에 대하여는 관할 지방국세청장)이 과세하는 것이 원칙이다.","a":"X","e":"증여세는 수증자의 주소지(주소지가 없거나 분명하지 아 니한 경우에는 거소지)를 관할하는 세무서장(국세청장이 특히 중요하다고 인정하는 것에 대하여는 관할 지방국세 청장)이 과세하는 것이 원칙이다.","pg":438},{"id":2313,"ch":53,"n":9,"q":"명의신탁재산의 증여의제 규정에 따라 재산을 증여한 것으 로 보는 경우에는 수증자의 주소지를 관할하는 세무서장(국 세청장이 특히 중요하다고 인정하는 것에 대하여는 관할 지 방국세청장)이 과세한다.","a":"X","e":"명의신탁재산의 증여의제 규정에 따라 재산을 증여한 것 으로 보는 경우에는 증여자의 주소지를 관할하는 세무서 장(국세청장이 특히 중요하다고 인정하는 것에 대하여는 관할 지방국세청장)이 과세한다.","pg":438},{"id":2314,"ch":53,"n":10,"q":"상속재산에 대한 공동상속인 사이의 최초 등기에 의하여 법 정상속재산을 초과하여 재산을 취득하는 경우 그 초과분을 증여로 본다.","a":"X","e":"협의분할에 대한 설명이다. 상속재산에 대한 공동상속인 사이의 최초 등기에 의하여 법정상속재산을 초과하여 재 산을 취득하는 경우 그 초과분에 대해서는 증여세를 과세 하지 아니한다.","pg":438},{"id":2315,"ch":53,"n":11,"q":"증여세 신고기한이 지난 후 3개월 이내에 증여자에게 반환 하는 경우에는 처음부터 증여가 없었던 것으로 본다. 다만, 반환하기 전에 과세표준과 세액을 결정받은 경우에는 그러 하지 아니하다.","a":"X","e":"증여세 신고기한이 지난 후 3개월 이내에 증여자에게 반 환하는 경우에는 그 반환하는 것에 대해서는 증여세를 부 과하지 아니한다. 비교 수증자가 증여재산(금전은 제외)을 당사자 간의 합의에 따라 증여세 과세표준 신고기한 이내에 증여자에게 반환하는 경우에는 처음부터 증여가 없었던 것으로 봄- >금전 함정 주의","pg":438},{"id":2316,"ch":53,"n":12,"q":"이혼 등에 의하여 정신적 또는 재산상 손해배상의 대가로 받는 위자료는 조세포탈의 목적이 있다고 인정되는 경우를 제외하고는 이를 증여로 보지 않는다.","a":"O","e":"","pg":439},{"id":2317,"ch":53,"n":13,"q":"해당 증여일 전 5년 이내에 동일인(증여자가 직계존속인 경 우에는 그 직계존속의 배우자를 포함)으로부터 받은 증여재 산가액을 합친 금액이 1천만원 이상인 경우에는 그 가액을 증여세과세가액에 가산한다. 다만, 합산배제증여재산의 경 우에는 그러하지 아니하다.","a":"X","e":"해당 증여일 전 10년 이내에 동일인(증여자가 직계존속인 경우에는 그 직계존속의 배우자를 포함)으로부터 받은 증 여재산가액을 합친 금액이 1천만원 이상인 경우에는 그 가액을 증여세과세가액에 가산한다. 다만, 합산배제증여 재산의 경우에는 그러하지 아니하다.","pg":439},{"id":2318,"ch":53,"n":14,"q":"부담부증여 시 수증자의 증여세 과세가액은 증여일 현재 「상속세 및 증여세법」에 따른 증여재산가액(합산배제 증여 재산의 가액은 제외)을 합친 금액에서 그 증여재산에 담보된 채무로서 수증자가 인수한 금액을 뺀 금액으로 한다.","a":"O","e":"","pg":439},{"id":2319,"ch":53,"n":15,"q":"직계존비속 간의 부담부증여의 경우 인수되는 채무가 국가 및 지방자치단체에 대한 채무라 하더라도 그 채무액은 수증 자에게 인수되지 않는 것으로 추정한다.","a":"X","e":"배우자 간 또는 직계존비속 간의 부담부증여 (배우자 등에 게 양도한 재산이 증여로 추정되는 경우를 포함)에 대해 서는 수증자가 증여자의 채무를 인수한 경우에도 그 채무 액은 수증자에게 인수되지 아니한 것으로 추정한다. 다 만, 그 채무액이 국가 및 지방자치단체에 대한 채무 등 법 에 정하는 바에 따라 객관적으로 인정되는 것인 경우에는 그러하지 아니하다.","pg":439},{"id":2320,"ch":53,"n":16,"q":"미성년자가 직계존속으로부터 생애 처음 증여를 받는 경우 증여세 과세가액에서 공제하는 증여재산공제액은 최대 5천 만원이다.","a":"X","e":"미성년자가 직계존속으로부터 생애 처음 증여를 받는 경 우 증여세 과세가액에서 공제하는 증여재산공제액은 최 대 2천만원이다. 비교 미성년자 외의 자가 직계존속으로부터 증여를 받은 경우 5,000만원잉","pg":439},{"id":2321,"ch":53,"n":17,"q":"특수관계인에게 양도한 재산을 그 특수관계인(양수자)이 양 수일부터 5년 이내에 당초 양도자의 배우자 등에게 다시 양 도한 경우에는 양수자가 그 재산을 양수한 당시의 재산가액 을 그 배우자 등이 증여받은 것으로 추정하여 이를 배우자 등의 증여재산가액으로 한다.","a":"X","e":"특수관계인에게 양도한 재산을 그 특수관계인(양수자)이 양수일부터 3년 이내에 당초 양도자의 배우자 등에게 다 시 양도한 경우에는 양수자가 그 재산을 양도한 당시의 재산가액을 그 배우자 등이 증여받은 것으로 추정하여 이 를 배우자 등의 증여재산가액으로 한다.","pg":440},{"id":2322,"ch":53,"n":18,"q":"파산선고로 인해 재산이 처분된 경우에는 배우자 또는 직계 존비속에 대한 증여추정 규정을 적용하지 아니한다.","a":"O","e":"","pg":440},{"id":2323,"ch":53,"n":19,"q":"갑 소유의 빌딩을 「국세징수법」에 따른 공매를 통하여 갑의 자녀가 취득하는 경우 증여로 추정한다.","a":"X","e":"갑 소유의 빌딩을 「국세징수법」에 따른 공매를 통하여 갑 의 자녀가 취득하는 경우 증여로 추정하지 않는다.","pg":440},{"id":2324,"ch":53,"n":20,"q":"미성년자인 거주자 갑이 20억원인 상가를 취득한 경우에 자 금출처로 입증된 금액이 16억원인 경우 증여추정대상 금액 은 2억원이다.","a":"X","e":"미성년자인 거주자 갑이 20억원인 상가를 취득한 경우에 자금출처로 입증된 금액이 16억원인 경우 증여추정대상 금액은 4억원이다.","pg":440},{"id":2325,"ch":53,"n":21,"q":"권리의 이전이나 그 행사에 등기 등이 필요한 토지·건물의 실제소유자와 명의자가 다른 경우에는 그 명의자로 등기 등 을 한 날(그 재산이 명의개서를 하여야 하는 재산인 경우에 는 소유권취득일이 속하는 해의 다음 해 말일의 다음 날)에 그 토지·건물의 가액을 실제소유자가 명의자에게 증여한 것으로 본다.","a":"X","e":"권리의 이전이나 그 행사에 등기 등이 필요한 재산(토지 와 건물은 제외)에 있어서 실제소유자와 명의자가 다른 경우에는 그 명의자로 등기 등을 한 날(그 재산이 명의개 서를 하여야 하는 재산인 경우에는 소유권취득일이 속하 는 해의 다음 해 말일의 다음 날)에 그 재산의 가액을 실 제소유자가 명의자에게 증여한 것으로 본다.","pg":440},{"id":2326,"ch":53,"n":22,"q":"'조세회피'의 목적 없이 타인의 명의로 재산의 등기 등을 한 경우에는 증여의제 과세를 하지 않는데, 이때 회피하려는 '조세'는 상속세와 증여세에 한한다.","a":"X","e":"'조세회피'의 목적 없이 타인의 명의로 재산의 등기 등을 한 경우에는 증여의제과세를 하지 않는데, 이때 회피하려 는 '조세 상속세와 증여세를 포함한 「국세기본법」에 따 른 모든 국세 및 지방세와 「관세법」에 규정된 관세가 해당 된다.","pg":440},{"id":2327,"ch":53,"n":23,"q":"비거주자가 법정대리인 또는 재산관리인의 명의로 등기 등 을 한 경우에는 증여의제 과세를 하지 않는다.","a":"O","e":"","pg":441},{"id":2328,"ch":53,"n":24,"q":"주식명의신탁에 대해 증여의제과세를 할 때 주주명부 등이 작성되지 아니하였다면 「법인세법」에 따라 납세지 관할 세 무서장에게 제출한 주주 등에 관한 서류 및 주식 등 변동상 황명세서에 의하여 명의개서 여부를 판정한다. OX 484 제7권 상속세및증세","a":"O","e":"୮","pg":441},{"id":2329,"ch":54,"n":1,"q":"상속세의 경우 부과과세방식의 조세이므로 법령에서 상속인 에게 상속세 과세표준 등을 신고·납부할 협력의무를 요구 하지 않는다.","a":"X","e":"상속세 납부의무가 있는 상속인 또는 수유자는 상속개시 일이 속하는 달의 말일부터 6개월(피상속인이나 상속인 이 외국에 주소를 둔 경우에는 9개월 이내에 상속세의 과세가액 및 과세표준을 상속세과세표준신고 및 자진납 부계산서에 의하여 납세지 관할 세무서장에게 신고해야 한다.","pg":442},{"id":2330,"ch":54,"n":2,"q":"「상속세 및 증여세법」상 상속세 납부의무가 있는 상속인은 상속개시일이 속하는 달의 말일부터 3개월(피상속인이나 상속인이 외국에 주소를 둔 경우에는 6개월) 이내에 상속 세의 과세가액 및 과세표준을 대통령령으로 정하는 바에 따라 납세지 관할 세무서장에게 신고하여야 한다.","a":"X","e":"「상속세 및 증여세법상 상속세 납부의무가 있는 상속인 은 상속개시일이 속하는 달의 말일부터 6개월(피상속인 이나 상속인이 외국에 주소를 둔 경우에는 9개월) 이내 에 상속세의 과세가액 및 과세표준을 대통령령으로 정 하는 바에 따라 납세지 관할 세무서장에게 신고하여야 한 다.","pg":442},{"id":2331,"ch":54,"n":3,"q":"관할 세무서장 등은 상속세 과세표준 신고기한으로부터 6개 월 이내에 납세자가 신고한 과세표준과 세액을 결정해야 한 다.","a":"X","e":"관할 세무서장 등은 상속세 과세표준 신고기한으로부터 9개월 이내에 납세자가 신고한 과세표준과 세액을 결정 해야 한다. 비교 관할 세무서장 등은 증여세 과세표준 신고기한으로부터 6개 월 이내에 납세자가 신고한 과세표준과 세액을 결정해야 함","pg":442},{"id":2332,"ch":54,"n":4,"q":"증여세 납부의무가 있는 자는 증여받은 날부터 3개월 이내 에 증여세의 과세가액 및 과세표준을 증여세과세표준신고 및 자진납부계산서에 의하여 납세지 관할 세무서장에게 신 고해야 한다.","a":"X","e":"증여세 납부의무가 있는 자는 증여받은 날이 속하는 달의 말일부터 3개월 이내에 증여세의 과세가액 및 과세표준 을 증여세과세표준신고 및 자진납부계산서에 의하여 납 세지 관할 세무서장에게 신고해야 한다.","pg":442},{"id":2333,"ch":54,"n":5,"q":"상속세 또는 증여세의 납부할 금액이 1천만원을 초과하는 경우에는 납부기한이 지난 후 1개월 이내에 분할납부할 수 있다.","a":"X","e":"상속세 또는 증여세의 납부할 금액이 1천만원을 초과하는 경우에는 납부기한이 지난 후 2개 이내에 분할납부할 수 있다. 비교 「법인세법」의 경우 납부할 법인세액이 1천만원을 초과하는 경우 납부기한이 지난 날부터 1개월(중소기업은 2개월) 이내 분납할 수 있음","pg":443},{"id":2334,"ch":54,"n":6,"q":"상속세와 증여세의 납부와 관련해 분납과 연부연납의 중복 적용이 가능하다.","a":"X","e":"인부인을 허가받은 경우에는 분납할 수 없다.","pg":443},{"id":2335,"ch":54,"n":7,"q":"상속세의 연부연납은 관할 세무서장의 허가 없이 신청 요건 을 갖추기만 하면 허용한다.","a":"X","e":"납세지 관할 세무서장은 상속세 납부세액이나 증여세 납 부세액이 2천만원을 초과하는 경우에는 납세의무자의 신 청을 받아 연부연납을 허가할 수 있다.","pg":443},{"id":2336,"ch":54,"n":8,"q":"납세지 관할 세무서장이 상속세의 연부연납을 허가하는 경 우 납세의무자는 담보를 제공해야 한다.","a":"O","e":"","pg":443},{"id":2337,"ch":54,"n":9,"q":"증여세의 연부연납기간은 연부연납 허가일부터 10년 또는 연부연납 허가 후 5년이 되는 날부터 5년이다.","a":"X","e":"증여세의 연부연납기간은 연부연납 허가일부터 5년이며, 「조세특례제한법」에 따른 과세특례를 적용받은 증여재산 의 경우에는 연부연납 허가일부터 15년이다.","pg":443},{"id":2338,"ch":54,"n":10,"q":"국외에 소재하는 부동산도 상속세의 물납에 충당할 수 있다.","a":"X","e":"부동산의 경우 국내에 소재하는 부동산에 한하여 상속세 의 물납에 충당할 수 있다.","pg":443},{"id":2339,"ch":54,"n":11,"q":"상속세도 물납할 수 있는 경우가 있는데, 이때 물납할 수 있 는 재산의 종류는 부동산에 한한다. ○","a":"X","e":"상속세의 물납에 충당하는 재산은 부동산뿐만 아니라 국 재·공채· 주권 및 내국법인이 발행하는 채권 또는 증권 과 그 밖의 법으로 정하는 유가증권으로도 가능하다. 또 한 상속재산에 대통령령으로 정하는 문화재 및 미술품이 포함되 경우 해당 문화재 등에 대한 물납을 신청할 수 있 다.","pg":443},{"id":2340,"ch":54,"n":12,"q":"법령에 따라 물납에 충당하는 재산은 세무서장이 인정하는 정당한 사유가 없는 한 국내에 소재하는 부동산을 국채 및 공채보다 먼저 신청 및 허가하여야 한다.","a":"X","e":"법령에 따라 물납에 충당하는 재산은 세무서장이 인정하 는 정당한 사유가 없는 한 국채 및 공채를 국내에 소재하 는 부동산보다 먼저 신청 및 허가하여야 한다.","pg":444},{"id":2341,"ch":54,"n":13,"q":"세무서장은 법령에 의하여 물납신청을 받은 재산이 지상 권·지역권. 전세권, 저당권 등 재산권이 설정되어 관리 처 분상 부적당하다고 인정하는 경우에는 물납허가를 하지 아 니할 수 있다.","a":"O","e":"","pg":444},{"id":2342,"ch":54,"n":14,"q":"재산을 분할하거나 재산의 분할을 전제로 하여 물납신청을 하는 경우에는 물납을 신청한 재산의 가액이 분할 전보다 감소되더라도 물납을 허가할 수 있다.","a":"X","e":"재산을 분할하거나 재산의 분할을 전제로 하여 물납신청 을 하는 경우에는 물납을 신청한 재산의 가액이 분할 전 보다 감소되지 않는 경우에만 물납을 허가할 수 있다.","pg":444},{"id":2343,"ch":55,"n":1,"q":"상속세나 증여세가 부과되는 재산의 가액은 평가기준일(상 속개시일 또는 증여일) 현재의 시가로 평가하되, 주권상장주 식과 코스닥상장주식의 가액은 유가증권 평가방법에 따라 다르게 평가한 가액을 시가로 본다.","a":"O","e":"","pg":445},{"id":2344,"ch":55,"n":2,"q":"「상속세 및 증여세법」상 토지는 개별공시지가를 원칙으로 하며, 지가가 급등하는 지역으로서 세법이 정하는 지역의 토 지에 대하여는 납세지 관할 세무서장이 인근 유사 토지의 개별공시지가를 고려하여 법령으로 정하는 방법으로 평가한 금액으로 한다.","a":"X","e":"「상속세 및 증여세법」상 토지는 개별공시지가를 원칙으로 하며, 지가가 급등하는 지역으로서 세법이 정하는 지역의 토지에 대하여는 개별공시지가에 법정 배율을 곱하여 계 산한 금액에 의하여 평가한다. 비교 상속받을 지가가 급등하지 않은 지역으로서 개별공시지가가 없는 토지의 가액은 납세지 관할 세무서장이 인근 유사 토지의 개별 공시지가를 고려하여 법령으로 정하는 방법으로 평가한 금액으로 함","pg":445},{"id":2345,"ch":55,"n":3,"q":"「상속세 및 증여세법」상 일반건물은 재취득가액으로 평가한 다.","a":"X","e":"「상속세 및 증여세법상 일반건물은 국세청장이 산정·고 시하는 가액으로 평가하는 것을 원칙으로 한다.","pg":445},{"id":2346,"ch":55,"n":4,"q":"선박· 차량의 경우 해당 유형자산을 처분할 경우 다시 취득 할 수 있다고 예상되는 가액과 장부가액 중 큰 가액으로 평 가한다.","a":"X","e":"선박· 차량의 경우 해당 유형자산을 처분할 경우 다시 취 득할 수 있다고 예상되는 가액(그 가액이 확인되지 않는 경우 장부가액 및 법령상 시가표준액에 따른 가액을 순차 로 적용한 가액)으로 평가한다.","pg":445},{"id":2347,"ch":55,"n":5,"q":"상품은 처분할 때에 취득할 수 있다고 예상되는 가액으로 평가하며, 그 가액이 확인되지 아니하는 경우에는 장부가액 으로 평가한다. 468 제7편 상속세및증여세법","a":"O","e":"","pg":445},{"id":2348,"ch":55,"n":6,"q":"「상속세 및 증여세법」상 판매용이 아닌 서화 및 골동품에 대 해서는 국세청장이 위촉한 3인 이상의 전문가로 구성된 감 정평가심의회에서 감정한 감정가액으로 평가한다.","a":"X","e":"「상속세 및 증여세법상 상속받을 서화에 대해서는 해당 재산의 종류. 규모. 거래상황 등을 고려하여 법령으로 정 하는 방법으로 평가한다. 판매용이 아닌 서화 · 골동품 등 예술적 가치가 있는 유형재산의 가액은 전문분야별로 2 인 이상의 전문가가 감정한 가액의 평균액으로 한다. 다 만, 그 가액이 국세청장이 위촉한 3인 이상의 전문가로 구성된 감정평가심의회에서 감정한 감정가액에 미달하는 경우에는 그 감정가액에 의한다.","pg":446},{"id":2349,"ch":55,"n":7,"q":"상장주식(유가증권시장과 코스닥시장에 상장된 주식)의 가 액은 평가기준일(평가기준일이 공휴일 등 매매가 없는 날인 경우에는 그 다음 날) 이전 2개월 동안 공표된 매일의 거래 소 최종 시세가액(거래실적 유무를 따지지 아니한다)의 평균 액으로 평가하는 것이 원칙이다.","a":"X","e":"상장주식(유가증권시장과 코스닥시장에 상장된 주식)의 가액은 평가기준일(평가기준일이 공휴일 등 매매가 없는 날인 경우에는 그 전일) 이전. 이후 각 2개월 동안 공표 된 매일의 거래소 최종 시세가액(거래실적 유무를 따지지 아니한다)의 평균액으로 평가하는 것이 원칙이다.","pg":446},{"id":2350,"ch":55,"n":8,"q":"비상장된 부동산과다보유법인의 주식은 1주당 순자산가치와 순손익가치를 각각 2와 3의 비율로 가중평균한 가액으로 한 다. 다만, 해당 가중평균 평가액이 1주당 순자산가치의 80% 에 미달하는 경우에는 1주당 순자산가치의 80%를 비상장주 식의 평가액으로 한다.","a":"X","e":"비상장된 부동산과다보유법인의 주식은 1주당 순자산가 치와 순손익가치를 각각 3과 2의 비율로 가중평균한 가 액으로 한다. 다만, 해당 가중평균 평가액이 1주당 순자 산가치의 80%에 미달하는 경우에는 1주당 순자산가치의 80%를 비상장주식의 평가액으로 한다. 비교 일반법인의 비상장주식 등은 순자산가치와 순손익가치를 각각 2와 3의 비율로 가중평균한 가액으로 하는 것이 원칙임","pg":446},{"id":2351,"ch":55,"n":9,"q":"사업개시 전의 법인, 사업개시 후 3년 미만의 법인 또는 휴 업·폐업 중인 법인의 주식 또는 출자지분은 순손익가치만 으로 평가한다.","a":"X","e":"사업개시 전의 법인, 사업개시 후 3년 미만의 법인 또는 휴업·폐업 중인 법인의 주식 또는 출자지분은 순자산가 치만으로 평가한다.","pg":446},{"id":2352,"ch":55,"n":10,"q":"최대주주의 주식에 대하여 할증평가를 하는 경우 할증비율 은 최대주주의 지분율에 관계없이 30%가 적용된다.","a":"X","e":"최대주주의 주식에 대하여 할증평가를 하는 경우 할증비 율은 최대주주의 지분율에 관계없이 20%가 적용된다.","pg":446},{"id":2353,"ch":55,"n":11,"q":"한국거래소에서 거래되는 국채· 공채 및 사채의 가액은 평 가기준일 이전 최근일의 최종시세가액으로 한다.","a":"X","e":"한국거래소에서 거래되는 국채·공채 및 사체의 가액은 평가기준일 이전 2개월간의 최종시세가액의 평균액과 평 가기준일 이진 최근일의 최종시세가액 중 큰 금액으로 한 다.","pg":447},{"id":2354,"ch":55,"n":12,"q":"「상속세 및 증여세법」상 상속받을 신탁의 이익을 받을 권리 에 대해서는 해당 권리의 성질, 내용, 남은 기간 등을 기준으 로 법령으로 정하는 방법으로 그 가액을 평가한다.","a":"O","e":"","pg":447},{"id":2355,"ch":55,"n":13,"q":"「상속세 및 증여세법」상 상속받을 양도담보재산은 그 재산 이 담보하는 채권액을 그 재산의 가액으로 평가한다. 01x","a":"X","e":"저당권 등이 설정된 자산, 양도담보재산, 전세권이 등기 된 재산 등 담보제공자산은 「상속세 및 증이세법」상 평가 액과 그 재산이 담보하는 채권액 등을 기준으로 한 평가 액 중 큰 금액으로 평가한다.","pg":447}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const C=D.chapters,I=D.items;
let S={view:'home',list:[],i:0,ans:null,right:0,wrong:0,wrongIds:[]};
let store={wrong:{},done:{}};
try{store=Object.assign(store,JSON.parse(localStorage.getItem('sebub_ox')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sebub_ox',JSON.stringify(store))}catch(e){}};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cnt=k=>I.filter(x=>x.ch===k).length;
function home(){
  S.view='home';
  const parts=[...new Set(C.map(c=>c.part))];
  const sel=new Set(store.sel||C.map((_,k)=>k));
  let opts='';
  parts.forEach(p=>{const pn=C.find(c=>c.part===p).pname;
    opts+='<details style="margin-bottom:6px"><summary style="cursor:pointer;padding:6px 0"><label><input type="checkbox" class="pchk" data-p="'+p+'" onclick="event.stopPropagation()" onchange="togglePart('+p+',this.checked)"> <b>제'+p+'편 '+pn+'</b></label></summary>';
    C.forEach((c,k)=>{if(c.part===p)opts+='<label class="opt" style="margin-left:18px"><input type="checkbox" class="chk" value="'+k+'" data-p="'+p+'"'+(sel.has(k)?' checked':'')+' onchange="updCnt()"> '+c.c+'. '+c.title+' ('+cnt(k)+')</label>'});
    opts+='</details>'});
  const nw=Object.keys(store.wrong).length,nd=Object.keys(store.done).length;
  app.innerHTML='<h1>세법 OX 학습</h1><div class="card"><div class="sm" style="margin-bottom:6px">범위 선택 (여러 개 선택 가능 · 편을 눌러 펼치기)</div><div class="row" style="margin-bottom:8px"><button class="btn sec" onclick="selAll(true)">전체 선택</button><button class="btn sec" onclick="selAll(false)">선택 해제</button></div>'+opts+'<div class="sm" id="selcnt" style="margin:8px 0"></div>'+
  '<label class="opt"><input type="checkbox" id="shuf" checked> 랜덤 순서</label><label class="opt">출제 개수 <select id="lim" style="width:auto;margin:0 0 0 8px"><option value="0">전체</option><option>10</option><option>20</option><option>50</option><option>100</option></select></label>'+
  '<label class="opt"><input type="checkbox" id="onlyw"> 오답노트 문제만 ('+nw+')</label>'+
  '<label class="opt"><input type="checkbox" id="skip"> 이미 푼 문제 제외</label><br>'+
  '<div class="sm" id="msg" style="color:var(--no);margin-bottom:8px"></div><button class="btn" onclick="start()">학습 시작</button></div>'+
  '<div class="card"><div class="stat"><div><b>'+nd+'</b>푼 문제</div><div><b>'+nw+'</b>오답노트</div><div><b>'+I.length+'</b>전체</div></div>'+
  '<button class="btn sec" id="rst" onclick="resetAll()">기록 초기화</button></div>'+
  '<p class="sm">※ 스캔본의 OCR로 만든 데이터라 일부 글자·번호가 틀릴 수 있어요. 이상하면 원문 페이지(p.)를 확인하세요.</p>';updCnt();
}
function selAll(v){document.querySelectorAll('.chk').forEach(e=>e.checked=v);updCnt()}
function togglePart(p,v){document.querySelectorAll('.chk[data-p="'+p+'"]').forEach(e=>e.checked=v);updCnt()}
function updCnt(){
  const ks=[...document.querySelectorAll('.chk:checked')].map(e=>+e.value);
  const n=I.filter(x=>ks.includes(x.ch)).length;
  const el=$('#selcnt');if(el)el.textContent='선택: '+ks.length+'개 챕터 · '+n+'문제';
  document.querySelectorAll('.pchk').forEach(pc=>{const all=[...document.querySelectorAll('.chk[data-p="'+pc.dataset.p+'"]')];pc.checked=all.length>0&&all.every(e=>e.checked)});
}
function start(){
  const ks=[...document.querySelectorAll('.chk:checked')].map(e=>+e.value);store.sel=ks;save();
  if(!ks.length){msg('범위를 하나 이상 선택해 주세요.');return}
  let l=I.filter(x=>ks.includes(x.ch));
  if($('#onlyw').checked)l=l.filter(x=>store.wrong[x.id]);
  if($('#skip').checked)l=l.filter(x=>!store.done[x.id]);
  if(!l.length){msg('해당 조건의 문제가 없어요.');return}
  if($('#shuf').checked)for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}
  const lim=+$('#lim').value;if(lim>0)l=l.slice(0,lim);
  S={view:'quiz',list:l,i:0,ans:null,right:0,wrong:0};quiz();
}
function quiz(){
  if(S.i>=S.list.length)return done();
  const x=S.list[S.i],c=C[x.ch],p=S.list.length;
  let h='<div class="top"><button class="link" onclick="home()">← 처음으로</button><span>'+(S.i+1)+' / '+p+' · 맞음 '+S.right+' · 틀림 '+S.wrong+'</span></div>'+
  '<div class="bar"><i style="width:'+(S.i/p*100)+'%"></i></div><div class="card">'+
  '<div class="tag">제'+c.part+'편 '+c.pname+' › '+c.title+' · '+x.n+'번 · 스캔 p.'+x.pg+'</div><div class="q">'+esc(x.q)+'</div>';
  if(S.ans===null){h+='<div class="row"><button class="ox o" onclick="pick(\'O\')">O</button><button class="ox x" onclick="pick(\'X\')">X</button></div>'}
  else{const ok=S.ans===x.a;
    h+='<div class="row"><button class="ox o" disabled style="opacity:.5">O</button><button class="ox x" disabled style="opacity:.5">X</button></div>'+
    '<div class="res '+(ok?'ok':'no')+'"><b class="h">'+(ok?'정답입니다 ✔':'오답입니다 ✘')+' · 정답: '+x.a+'</b>'+
    (x.e?'<div class="ex"><small>'+(x.a==='X'?'해설 (올바른 내용)':'해설')+'</small>'+esc(x.e)+'</div>':'<div class="ex sm">등록된 해설이 없어요.</div>')+'</div>'+
    '<div style="margin-top:14px"><button class="btn" onclick="next()">'+(S.i+1<p?'다음 문제':'결과 보기')+'</button></div>';}
  app.innerHTML=h+'</div>';window.scrollTo(0,0);
}
function pick(a){const x=S.list[S.i];S.ans=a;store.done[x.id]=1;
  if(a===x.a){S.right++;delete store.wrong[x.id]}else{S.wrong++;store.wrong[x.id]=1}save();quiz()}
function next(){S.i++;S.ans=null;quiz()}
function done(){const p=S.list.length;
  app.innerHTML='<h1>학습 완료</h1><div class="card"><div class="stat"><div><b>'+S.right+'</b>맞음</div><div><b>'+S.wrong+'</b>틀림</div><div><b>'+Math.round(S.right/p*100)+'%</b>정답률</div></div>'+
  '<div class="row"><button class="btn sec" onclick="home()">처음으로</button><button class="btn" onclick="again()">같은 범위 다시</button></div></div>';}
function again(){S={view:'quiz',list:S.list,i:0,ans:null,right:0,wrong:0};quiz()}
function msg(t){const e=$('#msg');if(e)e.textContent=t}
let rc=0;function resetAll(){const b=$('#rst');if(!rc){rc=1;b.textContent='정말 지울까요? 한 번 더 누르면 삭제돼요';b.style.color='var(--no)';setTimeout(()=>{rc=0;const r=$('#rst');if(r){r.textContent='기록 초기화';r.style.color=''}},4000);return}rc=0;store.wrong={};store.done={};save();home()}
home();
</script></body></html>
