발급한다.","a":"X","e":"필요적 기재사항 등이 착오 외의 사유로 잘못 적힌 경우 (과세표준 또는 세액을 경정할 것을 미리 알고 있는 경우 는 제외) 재화나 용역의 공급일이 속하는 과세기간에 대 한 확정신고기한 다음 날부터 1년 이내에 세금계산서를 작성하되, 처음에 발급한 세금계산서의 내용대로 세금계 산서를 붉은색 글씨로 쓰거나 음의 표시를 하여 발급하 고, 수정하여 발급하는 세금계산서는 검은색 글씨로 작성 하여 발급한다.","pg":188},{"id":1006,"ch":17,"n":26,"q":"전자세금계산서 발급 의무가 없는 사업자도 전자세금계산서 를 발급할 수 있으며 필요적 기재사항을 착오로 잘못 적은 경우에는 수정전자세금계산서를 발급할 수 있다. 이때, 해당 사업자가 과세표준 또는 세액이 경정될 것을 미리 알고 있 는 경우를 포함한다.","a":"X","e":"전자세금계산서 발급 의무가 없는 사업자도 전자세금계 산서를 발급할 수 있으며 필요적 기재사항을 착오로 잘못 적은 경우에는 수정전자세금계산서를 발급할 수 있다. 이 때, 해당 사업자가 과세표준 또는 세액이 경정될 것을 미 리 알고 있는 경우를 제외한다.","pg":189},{"id":1007,"ch":17,"n":27,"q":"일반과세자에서 간이과세자로 과세유형이 전환된 후 과세유 형 전환 전에 공급한 재화가 환입된 경우 재화가 환입된 날 을 작성일자로 적고 비고란에 처음 세금계산서 작성일자를 덧붙여 적은 수정세금계산서를 발급한다.","a":"X","e":"일반과세자에서 간이과세자로 과세유형이 전환된 후 과 세유형 전환 전에 공급한 재화가 환입된 경우 처음 세금 계산서의 작성일자를 작성일자로 적고 비고란에 재화가 환입된 날을 덧붙여 적은 수정세금계산서를 발급한다.","pg":189},{"id":1008,"ch":17,"n":28,"q":"납세지 관할세무서장은 수입되는 재화에 대하여 부가가치세 를 징수할 때에는 수입된 재화에 대한 수입세금계산서를 수 입하는 자에게 발급해야 한다.","a":"X","e":"세관장은 수입되는 재화에 대하여 부가가치세를 징수할 때에는 수입된 재화에 대한 수입세금계산서를 수입하는 자에게 발급해야 한다.","pg":189},{"id":1009,"ch":17,"n":29,"q":"세관장은 수입되는 재화에 대하여 부가가치세의 납부가 유 예되는 때에는 수입세금계산서를 발급하지 아니한다.","a":"X","e":"세관장은 수입되는 재화에 대하여 부가가치세의 납부가 유예되는 때에도 수입세금계산서를 발급하여야 한다.","pg":189},{"id":1010,"ch":17,"n":30,"q":"소매업의 경우에는 공급을 받는 사업자가 사업자등록증을 제시하고 세금계산서의 발급을 요구하는 때에는 영수증 대 신세금계산서를 발급할 수 있다.","a":"X","e":"소매업의 경우에는 공급을 받는 사업자가 사업자등록증 을 제시하고 세금계산서의 발급을 요구하는 때에는 영수 증 대신 세금계산서를 발급하여야 한다.","pg":189},{"id":1011,"ch":17,"n":31,"q":"숙박업은 공급을 받는 사업자가 요구한 경우에도 세금계산 서를 발급할 수 없다.","a":"X","e":"숙박업은 공급을 받는 사업자가 사업자등록증을 제시하 고 세금계산서의 발급을 요구하는 때에는 영수증 대신 세 금계산서를 발급하여야 한다.","pg":189},{"id":1012,"ch":17,"n":32,"q":"전세버스운송사업을 하는 자는 상대방이 요구한 경우에도 세금계산서를 발급할 수 없다.","a":"X","e":"전세버스운송사업을 하는 자는 공급을 받는 사업자가 사 업자등록증을 제시하고 세금계산서의 발급을 요구하는 때에는 영수증 대신 세금계산서를 발급하여야 한다. 비교 전세버스운송사업 외의 여객운송업을 하는 자는 상대방이 요 구한 경우에도 세금계산서를 발급할 수 없음","pg":190},{"id":1013,"ch":17,"n":33,"q":"입장권을 발행하여 영위하는 사업의 경우 영수증을 발급하 여야 하나 공급을 받는 사업자가 사업자등록증을 제시하고 세금계산서의 발급을 요구하는 때에는 영수증 대신 세금계 산서를 발급하여야 한다.","a":"X","e":"입장권을 발행하여 영위하는 사업의 경우 영수증을 발급 하여야 하며 상대방이 요구한 경우에도 세금계산서를 발 급할 수 없다.","pg":190},{"id":1014,"ch":17,"n":34,"q":"미용. 욕탕 및 유사서비스업을 공급하는 사업자는 영수증을 발급하여야 하며 상대방이 요구한 경우에도 세금계산서를 발급할 수 없다.","a":"O","e":"","pg":190},{"id":1015,"ch":17,"n":35,"q":"간이과세자 중 직전 연도의 공급대가의 합계액이 8천만원 미만인 자신규로 사업을 시작한 개인사업자의 경우 환산한 금액)는 영수증을 발급하여야 한다.","a":"X","e":"간이과세자 중 직전 연도의 공급대가의 합계액이 4천 8 백만원 미만인 자(신규로 사업을 시작한 개인사업자의 경 우 환산한 금액)는 영수증을 발급하여야 한다.","pg":190},{"id":1016,"ch":17,"n":36,"q":"신규로 사업을 시작하는 개인사업자로서 간이과세자로 하는 최초의 과세기간 중에 있는 자는 영수증을 발급할 수 있다. Ox 37 택시운송사업자, 노점. 행상을 하는 사람, 무인자동판매기 를 이용하여 재화·용역을 공급하는 자의 경우 세금계산서 를 발급하지 않더라도 세금계산서불성실가산세를 부과받지 않는다.","a":"X","e":"신규로 사업을 시작하는 개인사업자로서 간이과세자로 하는 최초의 과세기간 중에 있는 자는 영수증을 발급하여 야 한다. 37 O (1) LINK 오진다 p.241 세법1p.398","pg":190},{"id":1017,"ch":17,"n":38,"q":"전자서명인증사업자가 인증서를 발급하는 용역의 경우 공급 받은 자가 세금계산서의 발급을 요구하지 않은 경우에 한하 여 세금계산서 또는 영수증의 발급의무가 면제된다.","a":"O","e":"","pg":191},{"id":1018,"ch":17,"n":39,"q":"간편사업자등록을 한 국외사업자가 국내에 전자적 용역을 공급하는 경우 세금계산서를 발급하지 않으면 세금계산서불 성실가산세를 부과받는다.","a":"X","e":"간편사업자등록을 한 국외사업자가 국내에 전자적 용역 을 공급하는 경우 세금계산서를 발급하지 않더라도 세금 계산서불성실가산세를 부과받지 않는다.","pg":191},{"id":1019,"ch":17,"n":40,"q":"판매목적 타사업장 반출재화의 간주공급 등 재화의 공급의 제에 해당하는 재화는 세금계산서 및 영수증 발급의무가 면 제된다.","a":"X","e":"재화의 공급의제에 해당하는 재화는 세금계산서 및 영수 증 발급의무가 면제된다. 다만, 판매목적으로 다른 사업 장에 반출하는 경우에는 세금계산서를 발급하여야 한다.","pg":191},{"id":1020,"ch":17,"n":41,"q":"부동산임대보증금에 대한 간주임대료는 세금계산서 및 영수 증 발급의무가 면제된다.","a":"O","e":"","pg":191},{"id":1021,"ch":17,"n":42,"q":"영세율이 적용되는 재화의 공급이 법령에서 정하는 내국신 용장에 의한 수출인 경우 세금계산서 발급의무가 면제된다.","a":"X","e":"영세율이 적용되는 재화의 공급이 법령에서 정하는 내국 신용장에 의한 수출인 경우 세금계산서 발급의무가 있다.","pg":191},{"id":1022,"ch":17,"n":43,"q":"예정신고를 하는 사업자가 각 예정신고와 함께 매출 · 매입 처별 세금계산서합계표를 제출하지 못하는 경우에는 해당 예정신고기간이 속하는 과세기간까지 제출해야 한다.","a":"X","e":"예정신고를 하는 사업자가 각 예정신고와 함께 매출 · . 매 입처별 세금계산서합계표를 제출하지 못하는 경우에는 해당 예정신고기간이 속하는 과세기간의 확정신고와 함 께 제출할 수 있다.","pg":191},{"id":1023,"ch":17,"n":44,"q":"전자세금계산서를 발급하거나 발급받고 전자세금계산서 발 급명세를 해당 재화 또는 용역의 공급시기가 속하는 과세기 간(예정신고의 경우에는 예정신고기간)까지 국세청장에게 전송한 경우에는 해당 예정신고 또는 확정신고를 할 때 매 출· 매입처별세금계산서합계표를 제출하지 않을 수 있다.","a":"X","e":"전자세금계산서를 발급하거나 발급받고 전자세금계산서 발급명세를 해당 재화 또는 용역의 공급시기가 속하는 과 세기간(예정신고의 경우에는 예정신고기간) 마지막 날의 다음 달 11일까지 국세청장에게 전송한 경우에는 해당 예 정신고 또는 확정신고를 할 때 매출· 매입처별세금계산 서합계표를 제출하지 않을 수 있다.","pg":192},{"id":1024,"ch":17,"n":45,"q":"세금계산서를 발급받은 국가 또는 지방자치단체는 매입처별 세금계산서합계표를 해당 과세기간 종료일까지 납세지 관할 세무서장에게 제출하여야 한다.","a":"X","e":"세금계산서를 발급받은 국가 또는 지방자치단체는 매입 처별세금계산서합계표를 해당 과세기간이 끝난 후 25일 이내에 납세지 관할 세무서장에게 제출하여야 한다.","pg":192},{"id":1025,"ch":18,"n":1,"q":"간이과세가 적용되지 않는 과세사업자의 차가감납부세액은 매출세액에서 매입세액을 차감한 납부세액에서 경감. 공제 세액, 예정신고미환급세액, 예정고지세액, 가산세를 차감한 세액을 말한다.","a":"X","e":"간이과세가 적용되지 않는 과세사업자의 차가감납부세 액은 매출세액에서 매입세액을 차감한 납부세액에서 경 감·공제세액, 예정신고미환급세액, 예정고지세액을 차 감하고 가산세를 가산한 세액을 말한다.","pg":193},{"id":1026,"ch":18,"n":2,"q":"재화 또는 용역의 공급에 대한 부가가치세의 과세표준은 해 당 과세기간에 공급한 재화 또는 용역의 공급대가를 합한 금액으로 한다.","a":"X","e":"재화 또는 용역의 공급에 대한 부가가치세의 과세표준은 해당 과세기간에 공급한 재화 또는 용역의 공급가액을 합 한 금액으로 한다.","pg":193},{"id":1027,"ch":18,"n":3,"q":"공급가액은 금전으로 대가를 받는 경우 그 대가, 금전 외의 대가를 받는 경우에는 자기가 공급받은 재화·용역의 시가 이다.","a":"X","e":"공급가액은 금전으로 대가를 받는 경우 그 대가. 금전 외 의 대가를 받는 경우에는 자기가 공급한 재화·용역의 시 가이다.","pg":193},{"id":1028,"ch":18,"n":4,"q":"사업자가 취득 후 40개월 사용한 차량 A(취득원가 20,000,000원, 장부가액 14,000,000원, 시가 10,000,000 원)를 유사 차량 B(시가 12,000,000원)와 교환한 경우에 는 부가가치세 과세표준에 포함되는 차량 A의 공급가액은 12,000,000원이다.","a":"X","e":"사업자가 취득 후 40개월 사용한 차량 A(취득원가 20,000,000원, 장부가액 14,000,000원, 시가 10,000,000 원)를 유사 차량 B(시가 12,000,000원)와 교환한 경우에 는 부가가치세 과세표준에 포함되는 차량 A의 공급가액은 10,000,000원이다.","pg":193},{"id":1029,"ch":18,"n":5,"q":"사업자는 공급대가에 10%의 세율을 곱하여 매출세액을 공급 받는 자로부터 거래징수하여야 한다.","a":"X","e":"사업자는 공급가액에 10%의 세율을 곱하여 매출세액을 공급받는 자로부터 거래징수하여야 한다.","pg":193},{"id":1030,"ch":18,"n":6,"q":"사업자가 재화 또는 용역을 공급하고 그 대가로 받은 금액 이 부가가치세가 포함되어 있는지가 불분명한 경우나 공급 가액과 부가가치세가 별도 표시되어 있지 아니한 경우에는 그 대가로 받은 금액에 '110/100'을 곱한 금액을 공급가액으 로 한다.","a":"X","e":"사업자가 재화 또는 용역을 공급하고 그 대가로 받은 금 액이 부가가치세가 포함되어 있는지가 불분명한 경우나 공급가액과 부가가치세가 별도 표시되어 있지 아니한 경 우에는 그 대가로 받은 금액에 '100/110'을 곱한 금액을 공급가액으로 한다.","pg":193},{"id":1031,"ch":18,"n":7,"q":"할부판매의 경우 공급가액은 계약에 따라 받기로 한 대가의 각 부분이다.","a":"X","e":"할부판매의 경우 공급가액은 공급한 제화의 종가액이다. 비교 장기할부판매의 경우 공급가액은 계약에 따라 받기로 한 대가 의 각 부분임","pg":194},{"id":1032,"ch":18,"n":8,"q":"완성도기준지급조건부 · 중간지급조건부로 재화·용역을 공 급하는 경우의 공급가액은 계약에 따라 받기로 한 대가의 각 부분이다.","a":"O","e":"","pg":194},{"id":1033,"ch":18,"n":9,"q":"과세표준이 되는 재화 또는 용역의 공급가액은 대금, 요금, 수수료, 그 밖에 어떤 명목이든 상관없이 재화 또는 용역을 공급받는 자로부터 받는 금전적 가치 있는 모든 것을 포함 하므로 부가가치세도 포함한다.","a":"X","e":"과세표준이 되는 재화 또는 용역의 공급가액은 대금, 요 금, 수수료, 그 밖에 어떤 명목이든 상관없이 재화 또는 용역을 공급받는 자로부터 받는 금전적 가치 있는 모든 것을 포함하되, 부가가치세는 포함하지 아니한다.","pg":194},{"id":1034,"ch":18,"n":10,"q":"재화나 용역을 공급할 때 그 품질이나 수량, 인도조건 또는 공급대가의 결제방법이나 그 밖의 공급조건에 따라 통상의 대가에서 일정액을 직접 깎아 주는 금액은 공급가액에 포함 하지 아니한다.","a":"X","e":"재화나 용역을 공급할 때 그 품질이나 수량, 인도조건 또 는 공급대가의 결제방법이나 그 밖의 공급조건에 따라 통 상의 대가에서 일정액을 직접 깎아 주는 금액은 매출에누 리로 공급가액에 포함하지 아니한다.","pg":194},{"id":1035,"ch":18,"n":11,"q":"매출환입된 금액은 공급가액에 포함한다.","a":"X","e":"매출환입된 금액은 공급가액에 포함하지 아니한다. 접고 매출환입은 환입일이 속하는 과세기간의 과세표준에서 차감 함","pg":194},{"id":1036,"ch":18,"n":12,"q":"공급에 대한 대가를 약정기일 전에 받았다는 이유로 사업자 가 당초의 공급가액에서 할인해 주는 금액은 공급가액에 포 함하지 아니한다.","a":"O","e":"참고 매출할인은 감액사유가 발생한 날이 속하는 과세기간의 과세 표준에서 차감함","pg":194},{"id":1037,"ch":18,"n":13,"q":"장기할부판매 또는 할부판매의 이자상당액은 공급가액에 포 함하지 아니한다.","a":"X","e":"장기할부판매 또는 할부판매의 이자상당액은 공급가액에 포함한다.","pg":194},{"id":1038,"ch":18,"n":14,"q":"대가의 일부로 받는 운송비, 포장비, 하역비, 운송보험료, 산 재보험료 등은 공급가액에 포함하지 아니한다.","a":"X","e":"대가의 일부로 받는 운송비, 포장비, 하역비, 운송보험 료. 산재보험료 등은 공급가액에 포함한다.","pg":195},{"id":1039,"ch":18,"n":15,"q":"개별소비세, 주세 또는 교통. 에너지·환경세가 과세되는 경우 개별소비세, 주세, 교육세 • 농어촌특별세 및 교통. 에너지·환경세 상당액은 공급가액에 포함하지 아니한다. ○","a":"X","e":"개별소비세 주세 또는 교통. 에너지·환경세가 과세되 는 경우 개별소비세, 주세, 교육세 · 농어촌특별세 및 교 통·에너지·환경세 상당액은 공급가액에 포함한다.","pg":195},{"id":1040,"ch":18,"n":16,"q":"공급에 대한 대가의 지급이 지체되었음을 이유로 받는 연체 이자는 공급가액에 포함하지 아니한다.","a":"O","e":"","pg":195},{"id":1041,"ch":18,"n":17,"q":"반환조건으로 공급한 용기 및 포장을 회수할 수 없어 변제 받는 경우의 반환조건부 용기대금과 포장비용은 공급가액에 포함하지 아니한다.","a":"X","e":"반환조건부 용기대금과 포장비용은 공급가액에 포함하지 아니한다. 다만, 반환조건으로 공급한 용기 및 포장을 회 수할 수 없어 변제받는 경우 공급가액에 포함한다.","pg":195},{"id":1042,"ch":18,"n":18,"q":"재화 또는 용역의 공급과 직접 관련되지 아니하는 국고보조 금과 공공보조금은 공급가액에 포함한다.","a":"X","e":"재화 또는 용역의 공급과 직접 관련되지 아니하는 국고보 조금과 공공보조금은 공급가액에 포함하지 아니한다.","pg":195},{"id":1043,"ch":18,"n":19,"q":"「부가가치세법」상 대손금액은 과세표준에서 공제한다.","a":"X","e":"「부가가치세법」상 대손금액은 과세표준에서 공제하지 않 는다. ・「부가가치세법」상 대손금액은 대손세액공제를 통해 매출세액에 서 차감함 주의","pg":195},{"id":1044,"ch":18,"n":20,"q":"사업자가 재화를 공급받는 자에게 지급하는 장려금은 과세 표준에서 공제한다.","a":"X","e":"사업자가 재화를 공급받는 자에게 지급하는 장려금은 과 세표준에서 공제하지 않는다.","pg":195},{"id":1045,"ch":18,"n":21,"q":"판매장려금의 경우에는 판매장려금을 현금으로 지급하는 경 우에는 과세표준에서 공제하지 않지만, 판매장려금을 기업 의 자사제품 등 현물로 지급하는 경우에는 과세표준에서 공 제한다.","a":"X","e":"판매장려금의 경우에는 판매장려금을 현금으로 지급하는 경우에는 과세표준에서 공제하지 않지만, 판매장려금을 기업의 자사제품 등 현물로 지급하는 경우에는 간주공급 중 사업상 증여 규정에 해당하기 때문에 과세표준에 포함 하여 계산한다.","pg":196},{"id":1046,"ch":18,"n":22,"q":"매입자가 판매장려금을 지급받은 경우 과세표준에 포함하지 않는다.","a":"O","e":"","pg":196},{"id":1047,"ch":18,"n":23,"q":"특수관계인에 대한 재화 또는 용역(수탁자가 위탁자의 특수 관계인에게 공급하는 신탁재산과 관련된 재화 또는 용역을 포함)의 공급이 부당하게 낮은 대가를 받은 경우 공급한 재 화 또는 용역의 시가를 공급가액으로 본다.","a":"X","e":"(수탁자가 위탁자의 특수관계인에게 공급하는 신탁재산과 관련된 재화 또는 용역을 포함)","pg":196},{"id":1048,"ch":18,"n":24,"q":"특수관계인 외의 자에게 용역을 공급하고 부당하게 낮은 대 가를 받거나 대가를 받지 않은 경우로서 과세되는 사업용 부동산임대용역을 공급한 경우 공급가액은 공급한 용역의 시가이다.","a":"X","e":"특수관계인에게 용역을 공급하고 부당하게 낮은 대가를 받거나 대가를 받지 않은 경우로서 과세되는 사업용 부동 산임대용역을 공급한 경우 공급가액은 공급한 용역의 시 가이다.","pg":196},{"id":1049,"ch":18,"n":25,"q":"거래상대방인 특수관계인에게 무상으로 재화를 공급할 때 공급가액은 시가이나 특수관계인에 대한 무상공급이라고 하 더라도 조세부담 부당 감소 목적이 아닌 것이 입증된 경우, 간주공급 규정을 적용하여 매입세액 공제를 받지 않은 것에 대해서는 부가가치세를 과세하지 않는다.","a":"O","e":"","pg":196},{"id":1050,"ch":18,"n":26,"q":"거래상대방이 특수관계자 외의 자일 때 재화를 공급하고 부 당하게 시가보다 낮은 대가를 받은 경우 공급가액은 해당 거래가액이며, 용역을 공급하고 부당하게 시가보다 낮은 대 가를 받은 경우는 공급이 아니다.","a":"X","e":"거래상대방이 특수관계자 외의 자일 때 재화를 공급하고 부당하게 시가보다 낮은 대가를 받은 경우 공급가액은 헤 당 거래가액이며, 용역을 공급하고 부당하게 시가보다 낮 은 대가를 받은 경우에도 해당 거래가액이다.","pg":196},{"id":1051,"ch":18,"n":27,"q":"사업자가 재화나 용역을 공급하면서 마일리지를 적립하는 경우, 해당 마일리지를 과세표준에서 공제한다.","a":"X","e":"사업자가 재화나 용역을 공급하면서 마일리지를 적립하 는 경우, 수입금액에서 차감하는 기업회계기준과 달리 해 당 마일리지를 과세표준에서 공제하지 않는다.","pg":197},{"id":1052,"ch":18,"n":28,"q":"자기적립 마일리지 등 외의 마일리지 등으로 대금의 전부 또는 일부를 결제받은 경우로서 재화 또는 용역을 공급받는 자 외의 자로부터 보전받아야 할 금액을 보전받지 아니하고 자기생산·취득재화를 공급한 경우 공급가액은 공급한 재화 또는 용역의 시가에서 보전받지 아니한 금액을 차감한 금액 으로 한다.","a":"X","e":"자기적립 마일리지 등 외의 마일리지 등으로 대금의 전 부 또는 일부를 결제받은 경우로서 재화 또는 용역을 공 급받는 자 외의 자로부터 보전받아야 할 금액을 보전받지 아니하고 자기생산 · 취득재화를 공급한 경우 공급가액은 공급한 재화 또는 용역의 시가를 공급가액으로 한다.","pg":197},{"id":1053,"ch":18,"n":29,"q":"대가를 외국통화나 그 밖의 외국환으로 받아 공급시기가 되 기 전에 원화로 환가한 경우 공급가액은 공급시기의 「외국 환거래법」에 따른 기준환율 또는 재정환율에 따라 계산한 금액이다.","a":"X","e":"대가를 외국통화나 그 밖의 외국환으로 받아 공급시기가 되기 전에 원화로 환가한 경우 공급가액은 환가한 금액이 다.","pg":197},{"id":1054,"ch":18,"n":30,"q":"대가를 외국통화나 그 밖의 외국환으로 받아 공급시기 이후 에 외국통화나 그 밖의 외국환 상태로 지급받은 경우 공급 가액은 지급받은 때의 「외국환거래법」에 따른 기준환율 또 는 재정환율에 따라 계산한 금액이다.","a":"X","e":"대가를 외국통화나 그 밖의 외국환으로 받아 공급시기 이 후에 외국통화나 그 밖의 외국환 상태로 보유하거나 지급 받은 경우 공급가액은 공급시기의 「외국환거래법」에 따른 기준환율 또는 재정환율에 따라 계산한 금액이다.","pg":197},{"id":1055,"ch":18,"n":31,"q":"기부채납의 과세표준은 해당 기부채납의 근거가 되는 법률 에 따라 기부채납된 가액(기부채납된 가액에 부가가치세가 포함된 경우 그 부가가치세는 포함)으로 한다.","a":"X","e":"기부채납의 과세표준은 해당 기부채납의 근거가 되는 법 룰에 따라 기부채납된 가액(기부채납된 가액에 부가가치 세가 포함된 경우 그 부가가치세는 제외)으로 한다.","pg":197},{"id":1056,"ch":18,"n":32,"q":"위탁가공무역방식의 수출의 경우 과세표준은 완성된 제품의 인도가액으로 한다.","a":"O","e":"","pg":197},{"id":1057,"ch":18,"n":33,"q":"재화의 수입에 대한 부가가치세의 과세표준은 관세의 가격 에서 관세를 제외하고 개별소비세, 주세 및 교통• 에너지. 환경세, 교육세 및 농어촌특별세를 합한 금액으로 한다. ○","a":"X","e":"재화의 수입에 대한 부가가치세의 과세표준은 관세의 가 극, 관세, 개별소비세 주세 및 교통·에너지·환경세 교육세 및 농어촌특별세를 합한 금액으로 한다.","pg":198},{"id":1058,"ch":18,"n":34,"q":"사업자가 보세구역 내에 보관된 재화를 다른 사업자에게 공 급하고 그 재화를 공급받은 자가 그 재화를 보세구역으로부 터 반입하는 경우 그 재화의 공급가액에서 세관장이 관세 법」에 따라 부가가치세를 징수하고 발급한 수입세금계산서 에 적힌 공급가액을 가산한 금액을 과세표준으로 한다.","a":"X","e":"사업자가 보세구역 내에 보관된 재화를 다른 사업자에게 공급하고, 그 재화를 공급받은 자가 그 재화를 보세구역 으로부터 반입하는 경우 그 재화의 공급가액에서 세관장 이 「관세법」에 따라 부가가치세를 징수하고 발급한 수입 세금계산서에 적힌 공급가액을 뺀 금액을 과세표준으로 한다.","pg":198},{"id":1059,"ch":18,"n":35,"q":"재화의 공급에 해당되는 폐업 시 남아있는 재화(감가상각자 산은 아님)의 과세표준은 그 재화의 원가다.","a":"X","e":"재화의 공급에 해당되는 폐업 시 남아있는 재화(감가상각 자산은 아님)의 과세표준은 그 재화의 시가다.","pg":198},{"id":1060,"ch":18,"n":36,"q":"과세사업에 공급한 건물을 면세사업에 일부 사용하는 경우 면세사업에 일부 사용한 날이 속한 과세기간의 면세공급가 액이 총공급가액의 5% 이하인 경우 공급가액이 없는 것으 로 본다.","a":"X","e":"과세사업에 공급한 건물을 면세사업에 일부 사용하는 경 우 면세사업에 일부 사용한 날이 속한 과세기간의 면세공 급가액이 총공급가액의 5% 미만인 경우 공급가액이 없는 것으로 본다.","pg":198},{"id":1061,"ch":18,"n":37,"q":"사업자가 자기의 사업과 관련하여 재화를 타사업장으로 판 매 목적으로 반출하는 경우 「법인세법」 또는 「소득세법」 규 정에 따른 취득가액을 공급가액으로 하는 것을 원칙으로 한 다.","a":"O","e":"","pg":198},{"id":1062,"ch":18,"n":38,"q":"사업자가 2과세기간 이상에 걸쳐 부동산임대용역을 공급하 고 그 대가를 선불 또는 후불로 받는 경우에는 그 선불 또는 후불로 받은 금액을 공급가액으로 한다.","a":"X","e":"사업자가 2과세기간 이상에 걸쳐 부동산임대용역을 공급 하고 그 대가를 선불 또는 후불로 받는 경우에는 공급시 기규정에 따라 예정신고기간 또는 과세기간의 종료일에 \"신분 또는 후불로 수령한 임대료 ㅅ 해당 과세기간 중 입 대원수 종임대계약 기간월수\"로 안분한 금액을 과세표 준으로 한다.","pg":198},{"id":1063,"ch":18,"n":39,"q":"부동산 임대용역을 제공하는 경우, 임대료뿐만 아니라 임대 보증금에 대한 간주임대료에 대하여도 임대사업자의 과세표 준에 포함하는데 부동산임대에 따른 간주임대료에 대하여는 세금계산서를 발급하거나 발급받을 수 없다.","a":"O","e":"","pg":199},{"id":1064,"ch":18,"n":40,"q":"사업자는 부가가치세가 과세되는 재화를 공급하고 외상매 출금(부가가치세를 포함한 것을 말함)의 일부가 공급을 받 은 자의 파산으로 대손되어 회수할 수 없는 경우에는 대손 금액에 100분의 10을 곱한 금액을 매출세액에서 뺄 수 있다.","a":"X","e":"사업자는 부가가치세가 과세되는 재화를 공급하고 외상 매출금(부가가치세를 포함한 것을 말함)의 일부가 공급을 받은 자의 파산으로 대손되어 회수할 수 없는 경우에는 대손금액에 110분의 10을 곱한 금액을 매출세액에서 팰 수 있다.","pg":199},{"id":1065,"ch":18,"n":41,"q":"대손세액공제는 일반 과세사업자에게만 적용이 가능하며 외 상매출금, 매출채권, 대여금에 대해서 대손세액공제를 적용 한다.","a":"X","e":"대여금은 「부가가치세법」상 대손세액공제를 적용하지 않 는다.","pg":199},{"id":1066,"ch":18,"n":42,"q":"「부가가치세법」상 간이과세자가 공급한 재화에 대해 대손이 확정된 경우 이미 납부한 부가가치세를 대손이 확정된 날이 속하는 과세기간의 매출세액에서 뺄 수 있다.","a":"X","e":"대손세액공제는 일반 과세사업자에게만 적용이 가능하므 로 간이과세자나 면세사업자에게는 적용이 불가능하다.","pg":199},{"id":1067,"ch":18,"n":43,"q":"「소득세법」 및 「법인세법」에 따라 대손사유로 인정되는 경 우 대손확정으로 인하여 회수할 수 없는 금액을 「부가가치 세법」상 대손금으로 인정하여 대손세액공제를 받을 수 있다.","a":"O","e":"","pg":199},{"id":1068,"ch":18,"n":44,"q":"대손세액공제를 받기 위해서는 부가가치세가 과세되는 재화 또는 용역을 공급한 후 그 공급일로부터 10년이 되는 날이 속하는 과세기간까지 대손세액공제요건이 확정되어야 한다.","a":"X","e":"대손세액공제를 받기 위해서는 부가가치세가 과세되는 재화 또는 용역을 공급한 후 그 공급일로부터 10년이 되 는 날이 속하는 과세기간에 대한 확정신고기한까지 대손 세액공제요건이 확정되어야 한다.","pg":199},{"id":1069,"ch":18,"n":45,"q":"대손세액공제를 받으려는 사업자는 부가가치세 예정신고서 또는 확정신고서에 대손세액 공제신고서와 대손사실을 증 명하는 서류를 첨부하여 관할 세무서장에게 제출해야 한다.","a":"X","e":"대손세액공제를 받으려는 사업자는 부가가치세 확정신고 서에 대손세액 공제신고서와 대손사실을 증명하는 서류 를 첨부하여 관할 세무서장에게 제출해야 한다. 즉, 예정 신고 시에는 대손세액공제를 적용할 수 없다.","pg":200},{"id":1070,"ch":18,"n":46,"q":"대손세액은 공급한 날이 속하는 과세기간의 매출세액에서 뺄 수 있고, 이때의 대손세액은 부가가치세를 포함한 대손금 액의 110분의 10으로 한다.","a":"X","e":"대손세액은 그 대손이 확정된 날이 속하는 과세기간의 매 출세액에서 뺄 수 있고, 이때의 대손세액은 부가가치세를 포함한 대손금액의 110분의 10으로 한다.","pg":200},{"id":1071,"ch":18,"n":47,"q":"사업자는 부가가치세가 과세되는 재화를 공급하고 매출채권 (부가가치세 포함)의 전부가 공급을 받은 자의 파산 · 강제집 행의 사유로 대손되어 회수할 수 없는 경우에는 대손세액을 그 대손이 확정된 날이 속하는 과세기간의 매출세액에서 뺄 수 있다.","a":"O","e":"","pg":200},{"id":1072,"ch":18,"n":48,"q":"매입세액에서 대손세액에 해당하는 금액을 뺀(관할 세무서 장이 결정 또는 경정한 경우 포함) 사업자가 대손금액을 변 제한 경우에는 대통령령으로 정하는 바에 따라 변제한 대손 금액에 관련된 대손세액에 해당하는 금액을 변제한 날이 속 하는 과세기간의 매입세액에서 뺀다. ○","a":"X","e":"매입세액에서 대손세액에 해당하는 금액을 뺀(관할 세무 서장이 결정 또는 경정한 경우 포함) 사업자가 대손금액 을 변제한 경우에는 대통령령으로 정하는 바에 따라 변제 한 대손금액에 관련된 대손세액에 해당하는 금액을 변제 한 날이 속하는 과세기간의 매입세액에 더한다.","pg":200},{"id":1073,"ch":18,"n":49,"q":"공급자가 대손세액공제를 적용한 이후에 대손금을 회수한 경우 대손세액을 회수한 날이 속하는 과세기간의 매출세액 에서 차감한다.","a":"X","e":"공급자가 대손세액공제를 적용한 이후에 대손금을 회수 한 경우 대손세액을 회수한 날이 속하는 과세기간의 매출 세액에 더한다.","pg":200},{"id":1074,"ch":18,"n":50,"q":"재화 또는 용역의 공급자가 대손세액을 매출세액에서 차감 한 경우 공급자의 관할 세무서장은 대손세액공제 사실을 공 급받는 자의 관할 세무서장에게 통지하여야 한다.","a":"O","e":"","pg":200},{"id":1075,"ch":19,"n":1,"q":"공제대상 매입세액은 자기의 사업을 위하여 사용된 재화 또는 용역의 공급 및 재화의 수입에 대한 세액에 한한다.","a":"X","e":"공제대상 매입세액은 사업자가 자기의 사업을 위하여 사 용하였거나 사용할 목적으로 공급받은 재화.용역 및 수 입하는 재화에 대한 세액을 말한다. 이미 사용한 것은 물 론이고, 앞으로 사용할 예정인 재화나 공급의 매입 · 수입 에 대한 부가가치세액도 매입세액 공제를 적용받을 수 있 다.","pg":201},{"id":1076,"ch":19,"n":2,"q":"사업자가 자기의 사업을 위하여 사용하였거나 사용할 목적 으로 공급받은 재화.용역에 대한 부가가치세액은 재화·용 역을 사용하는 시기가 속하는 과세기간의 매출세액에서 공 제한다.","a":"X","e":"사업자가 자기의 사업을 위하여 사용하였거나 사용할 목 적으로 공급받은 재화.용역에 대한 부가가치세액은 재 화·용역을 공급받는 시기가 속하는 과세기간의 매출세 액에서 공제한다.","pg":201},{"id":1077,"ch":19,"n":3,"q":"예정신고 시 누락한 매입세액은 매입세액공제를 받을 수 없 다.","a":"X","e":"예정신고 시 누락한 매입세액은 확정신고 때에 매입세액 에 포함하여 신고한 경우 매입세액공제를 받을 수 있다.","pg":201},{"id":1078,"ch":19,"n":4,"q":"의제매입세액공제는 면세원재료를 사용하여 과세재화·용 역을 공급하는 경우에 발생하는 누적효과를 제거하거나 완 화시키기 위한 취지에서 마련된 제도이다.","a":"O","e":"의제매입세액공제는 환수효과와 누적효과를 완화하여 최 종소비자의 세부담을 완화하고 농어민을 지원하기 위한 제도이다.","pg":201},{"id":1079,"ch":19,"n":5,"q":"사업자등록을 한 과세사업 영위 사업자에 한정하여 의제매 입세액공제를 적용받을 수 있으므로 겸영사업자나 간이과세 자는 적용을 받을 수 없다.","a":"X","e":"사업자등록을 한 과세사업 영위 사업자에 한정하여 의제 매입세액공제를 적용받을 수 있다. 겸영사업자의 경우에 도 의제매입세액공제를 적용받을 수 있다. 단, 간이과세 자는 적용을 받을 수 없다.","pg":201},{"id":1080,"ch":19,"n":6,"q":"사업자가 면세농산물 등을 원재료로 하여 제조 가공한 재 화 또는 창출한 용역의 공급에 대하여 부가가치세가 과세되 는 경우(법에 따라 면세를 포기하고 영세율을 적용받는 경우 포함) 면세농산물 등을 공급받거나 수입할 때 매입세액이 있 는 것으로 보아 공제할 수 있다.","a":"X","e":"사업자가 면세농산물 등을 원재료로 하여 제조.가공한 재화 또는 창출한 용역의 공급에 대하여 부가가치세가 과 세되는 경우(법에 따라 면세를 포기하고 영세율을 적용받 는 경우에는 제외한다) 면세농산물 등을 공급받거나 수입 할 때 매입세액이 있는 것으로 보아 공제할 수 있다.","pg":202},{"id":1081,"ch":19,"n":7,"q":"제조업을 경영하는 사업자가 농어민으로부터 면세농산물 등 을 직접 공급받아 이를 사용하여 과세재화·용역을 공급하 는 경우 의제매입세액공제를 받으려면 공급받은 사실을 증 명하는 의제매입세액 공제신고서와 매입처별 계산서합계표, 신용카드매출전표 등 수령명세서, 매입자발행계산서합계표 를 납세지 관할 세무서장에게 제출해야 한다.","a":"X","e":"의제매입세액을 공제받으려는 사업자는 면세농산물 등을 공급받은 사실을 증명하는 의제매입세액 공제신고서와 매입처별 계산서합계표, 신용카드매출전표 등 수령명세 서, 매입자발행계산서합계표를 납세지 관할 세무서장에 게 제출해야 한다. 다만, 제조업을 경영하는 사업자가 농 어민으로부터 면세농산물 등을 직접 공급받는 경우에는 의제매입세액공제 신고서만 제출한다.","pg":202},{"id":1082,"ch":19,"n":8,"q":"국내에서 구입하는 면세농산물 등에 대하여 의제매입세액을 계산함에 있어서의 그 매입가액은 운임 등의 부대비용을 포 함한 매입원가로 한다.","a":"X","e":"국내에서 구입하는 면세농산물 등에 대하여 의제매입세 액을 계산함에 있어서의 그 매입가액은 운임 등의 부대비 용을 제외한 매입원가로 한다. 단, 면세사업자가 면세농 산물 등을 운반하고 함께 받는 운임은 별도로 구분하지 않고 부수되는 용역으로 면세되기에 매입가액에 포함한 다.","pg":202},{"id":1083,"ch":19,"n":9,"q":"수입되는 면세농산물 등에 대하여 의제매입세액을 계산함에 있어서의 그 수입가액은 관세의 과세가격에 관세와 개별소 비세 및 주세 등을 포함한 가액으로 한다.","a":"X","e":"수입되는 면세농산물 등에 대하여 의제매입세액을 계산 함에 있어서의 그 수입가액은 관세의 과세가격으로 한다.","pg":202},{"id":1084,"ch":19,"n":10,"q":"의제매입세액은 확정신고기간에만 공제받을 수 있다.","a":"X","e":"의제매입세액은 구입일이 속하는 예정신고기간 및 확정 신고기간에 공제하는 것을 원칙으로 한다. 참고 예정신고 시 공제받지 못한 의제매입세액은 그 예정신고기간 이 속하는 과세기간의 확정신고 시 공제받을 수 있음","pg":202},{"id":1085,"ch":19,"n":11,"q":"예정신고 때 공제받지 못한 의제매입세액은 확정신고시 공 제받을 수 없다.","a":"X","e":"예정신고 시 공제받지 못한 의제매입세액은 그 예정신고 기간이 속하는 과세기간의 확정신고 시 공제받을 수 있 고 예정신고나 확정신고 시 공제받지 못한 의제매입세액 은 관련서류를 다음의 경우에 제출함으로써 의제매입세 액을 공제받을 수 있다. ① 「국세기본법」에 따른 수정신고 · 경정청구 · 기한후 신고를 하는 경우 ② 세무서장 등이 경쟁을 하는 경우 사업자가 경정기 관의 확인을 거쳐 경정기관에 제출하는 경우","pg":203},{"id":1086,"ch":19,"n":12,"q":"사업자가 의제매입세액공제를 받은 면세농산물 등에 대하여 면세농산물 등을 그대로 양도 또는 인도하는 경우 공제했던 의제매입세액을 납부세액에 가산하거나 환급세액에서 공제 하여야 한다.","a":"O","e":"","pg":203},{"id":1087,"ch":19,"n":13,"q":"면세사업 등에 사용하던 감가상각자산 일부 또는 전부를 과 세사업에 사용하거나 소비하는 경우, 과세사업에 사용하거 나 소비하는 날이 속하는 과세기간에 대한 예정신고 또는 확정신고와 함께 과세사업전환 감가상각자산 신고서를 작 성하여 각 납세지 관할 세무서장에게 신고함으로써 구입 시 공제받지 못한 매입세액을 과세사업전환 시 공제받을 수 있 다.","a":"X","e":"면세사업 등에 사용하던 감가상각자산 일부 또는 전부를 과세사업에 사용하거나 소비하는 경우, 과세사업에 사용 하거나 소비하는 날이 속하는 과세기간에 대한 확정신고 와 함께 과세사업전환 감가상각자산 신고서를 작성하여 각 납세지 관할 세무서장에게 신고함으로써 구입 시 공제 받지 못한 매입세액을 과세사업전환 시 공제받을 수 있 다. 즉, 과세전환매입세액공제는 예정신고시에는 공제받 을 수 없고, 확정신고시에만 공제받을 수 있다.","pg":203},{"id":1088,"ch":19,"n":14,"q":"면세사업에 사용한 건물을 과세사업과 면세사업에 공통으로 사용하는 때에 그 과세사업에 사용한 날이 속하는 과세기간 의 직전 과세기간의 과세공급가액이 총공급가액의 5% 미만 인 경우 공제세액이 없는 것으로 본다.","a":"X","e":"면세사업에 사용한 건물을 과세사업과 면세사업에 공통 으로 사용하는 때에 그 과세사업에 사용한 날이 속하는 과세기간의 과세공급가액이 총공급가액의 5% 미만인 경 우 공제세액이 없는 것으로 본다.","pg":203},{"id":1089,"ch":19,"n":15,"q":"사업자등록을 한 사업자가 해당 사업자의 사업자등록번호 대신에 주민등록번호를 기재하고 발급받은 세금계산서상의 매입세액은 공제받을 수 있다.","a":"X","e":"사업자등록을 신청한 사업자가 사업자등록증 발급일까지 의 거래에 대하여 해당 사업자 또는 대표자의 주민등록번 호를 적어 발급받은 경우 세금계산서상의 매입세액은 공 제받을 수 있다. 4즉44 , 신청은 하였으나 아직 사업자등록이 되지 아니한 경우에만 가능함 주의","pg":204},{"id":1090,"ch":19,"n":16,"q":"세금계산서에 적힌 나머지 필요적 기재사항 또는 임의적 기 재사항으로 보아 거래사실이 확인되는 경우라 하더라도 발 급받은 세금계산서의 필요적 기재사항 중 일부가 착오로 사 실과 다르게 적혀 있는 경우의 매입세액은 매출세액에서 공 제하지 아니한다.","a":"X","e":"발급받은 세금계산서의 필요적 기재사항 중 일부가 착오 로 사실과 다르게 적혔으나 그 세금계산서에 적힌 나머지 필요적 기재사항 또는 임의적 기재사항으로 보아 거래사 실이 확인되는 경우의 매입세액은 매출세액에서 공제한 다.","pg":204},{"id":1091,"ch":19,"n":17,"q":"재화의 공급시기 이후 해당 공급시기가 속하는 과세기간에 대한 확정신고기한 내에 세금계산서를 발급받았다 하더라도 세금계산서는 공급시기에 발급받아야 하므로 매입세액공제 를 받을 수 없다.","a":"X","e":"재화 또는 용역의 공급시기 이후에 발급받은 세금계산서 로서 해당 공급시기가 속하는 과세기간에 대한 확정신고 기한까지 발급받은 경우의 매입세액은 매출세액에서 공 제한다.","pg":204},{"id":1092,"ch":19,"n":18,"q":"재화 또는 용역의 공급시기가 속하는 과세기간에 대한 확정 신고기한이 지난 후 세금계산서를 발급받았더라도 그 세금 계산서 발급일이 확정신고기한 다음 날부터 6개월 이내이 고 해당 거래사실이 확인되어 납세지 관할 세무서장, 납세지 관할 지방국세청장 또는 국세청장이 결정 또는 경정하는 경 우 세금계산서상의 매입세액은 공제받을 수 있다.","a":"X","e":"재화 또는 용역의 공급시기가 속하는 과세기간에 대한 확 정신고기한이 지난 후 세금계산서를 발급받았더라도 그 세금계산서의 발급일이 확정신고기한 다음 날부터 1년 이 내이고 해당 거래사실이 확인되어 납세지 관할 세무서장, 납세지 관할 지방국세청장 또는 국세청장이 결정 또는 경 정하는 경우 세금계산서상의 매입세액은 공제받을 수 있 다.","pg":204},{"id":1093,"ch":19,"n":19,"q":"재화 또는 용역의 공급시기 전에 세금계산서를 발급받았더 라도 재화 또는 용역의 공급시기가 그 세금계산서의 발급일 부터 1년 이내에 도래하고 해당 거래사실이 확인되어 납세 지 관할 세무서장 등이 결정 또는 경정하는 경우 세금계산 서상의 매입세액은 공제받을 수 있다.","a":"X","e":"재화 또는 용역의 공급시기 전에 세금계산서를 발급받았 더라도 재화 또는 용역의 공급시기가 그 세금계산서의 발 급일부터 6개월 이내에 도래하고 해당 거래사실이 확인 되어 납세지 관할 세무서장 등이 결정 또는 경정하는 경 우 세금계산서상의 매입세액은 공제받을 수 있다.","pg":204},{"id":1094,"ch":19,"n":20,"q":"재화를 공급받고 실제로 그 재화를 공급한 사업장이 아닌 사업장을 적은 세금계산서를 발급받은 경우 그 사업장이 사 업자단위과세사업자에 해당하는 사업장인 경우로서 그 재 화를 실제로 공급한 사업자가 부가가치세 확정신고를 통하 여 해당 과세기간에 대한 납부세액을 납부하지 않았다고 하 더라도 신고하였다면 그 매입세액은 매출세액에서 공제한 다. OX 21 거래의 실질이 용역의 공급에 대한 주선·중개에 해당하지 않음에도 불구하고 거래 당사자 간 계약에 따라 용역의 공 급에 대한 주선·중개로 하여 세금계산서를 발급받은 경우 매입세액은 매출세액에서 공제하지 아니한다.","a":"X","e":"재화를 공급받고 실제로 그 재화를 공급한 사업장이 아닌 사업장을 적은 세금계산서를 발급받은 경우 그 사업장이 사업자단위과세사업자에 해당하는 사업장인 경우로서 그 재화를 실제로 공급한 사업자가 부가가치세 확정신고 를 통하여 해당 과세기간에 대한 납부세액을 신고하고 납 부하였다면 그 매입세액은 매출세액에서 공제한다. • 21 x SANKENNI LINK 2 p.26841 p.443 거래의 실질이 용역의 공급에 대한 주선·중개에 해당하 지 않음에도 불구하고 거래 당사자 간 계약에 따라 용역 의 공급에 대한 주선·중개로 하여 세금계산서를 발급받 은 경우로서 그 거래사실이 확인되고 거래 당사자가 법령 에 따라 납세지 관할 세무서장에게 해당 납부세액을 신고 하고 납부한 경우 매입세액공제를 적용할 수 있다.","pg":205},{"id":1095,"ch":19,"n":22,"q":"용역을 공급하는 사업을 다른 사업자로부터 위탁받아 수행 하는 사업자가 위탁 받은 사업의 수행에 필요한 비용을 사 업을 위탁한 사업자로부터 지급받아 지출한 경우로서 해당 비용을 공급가액에 포함해야 함에도 불구하고 거래 당사자 간 계약에 따라 이를 공급가액에서 제외하여 세금계산서를 발급받은 경우 그 거래사실이 확인되고 거래 당사자가 법령 에 따라 납세지 관할 세무서장에게 해당 납부세액을 신고하 고 납부한 경우 매입세액공제를 적용할 수 있다.","a":"O","e":"","pg":205},{"id":1096,"ch":19,"n":23,"q":"「법인세법」・「소득세법」에 따른 업무무관비용 등 사업과 직 접 관련이 없는 지출에 대한 매입세액은 공제되지 않는다.","a":"O","e":"","pg":205},{"id":1097,"ch":19,"n":24,"q":"취득 당시 사업과 관련하여 취득한 재화를 국가·지방자치 단체에 무상으로 공급하는 경우 해당 재화는 면세하며, 해당 재화의 매입세액은 공제하지 않는다.","a":"X","e":"취득한 재화를 국가·지방자치단체에 무상으로 공급하는 경우 면세하는데, 취득 당시 사업과 관련하여 취득한 재 화는 매입세액 공제한다. 비교 취득 당시 사업과 무관하게 취득한 재화는 매입세액 공제하지 않음 주의","pg":206},{"id":1098,"ch":19,"n":25,"q":"운수업, 자동차판매업, 자동차임대업, 운전학원업, 무인경비 업(기계경비업무를 하는 경비업) 및 이와 유사한 업종에 직 접 영업으로 사용되는 자동차에 대한 매입세액은 공제한다.","a":"O","e":"","pg":206},{"id":1099,"ch":19,"n":26,"q":"기업업무추진비와 관련된 매입세액은 공제한다.","a":"X","e":"기업업무추진비와 이와 유사한 비용의 지출과 관련된 매 입세액은 공제하지 아니한다.","pg":206},{"id":1100,"ch":19,"n":27,"q":"부가가치세 면세사업 등에 관련된 매입세액(면세사업 등을 위한 투자에 관련된 매입세액 포함)은 매출세액에서 공제하 지 않는다.","a":"O","e":"","pg":206},{"id":1101,"ch":19,"n":28,"q":"토지의 조성 등을 위한 자본적 지출에 관련된 매입세액으로 서 토지의 취득 및 형질변경, 공장부지 및 택지의 조성 등에 관련된 매입세액은 공제한다.","a":"X","e":"토지의 조성 등을 위한 자본적 지출에 관련된 매입세액으 로서 토지의 취득 및 형질변경, 공장부지 및 택지의 조성 등에 관련된 매입세액은 공제하지 않는다.","pg":206},{"id":1102,"ch":19,"n":29,"q":"건축물이 있는 토지를 취득하여 그 건축물을 철거하고 토지 만을 사용하는 경우에는 철거한 건축물의 취득 및 철거 비 용과 관련된 매입세액은 공제한다. ○","a":"X","e":"건축물이 있는 토지를 취득하여 그 건축물을 철거하고 토 지만을 사용하는 경우에는 철거한 건축물의 취득 및 철거 비용과 관련된 매입세액은 공제하지 않는다.","pg":206},{"id":1103,"ch":19,"n":30,"q":"토지의 가치를 현실적으로 증가시켜 토지의 취득원가를 구 성하는 비용에 관련된 매입세액은 공제한다.","a":"X","e":"토지의 가치를 현실적으로 증가시켜 토지의 취득원가를 구성하는 비용에 관련된 매입세액은 공제하지 않는다.","pg":206},{"id":1104,"ch":19,"n":31,"q":"사업자등록을 신청하기 전의 매입세액은 매출세액에서 공 제하지 않지만 공급시기가 속하는 과세기간이 끝난 후 20일 이내에 등록을 신청한 경우 등록신청일부터 공급시기가 속 하는 과세기간 기산일까지 역산한 기간 내의 매입세액은 매 출세액에서 공제한다.","a":"O","e":"","pg":207},{"id":1105,"ch":19,"n":32,"q":"주로 사업자가 아닌 자에게 재화·용역을 공급하는 사업자 로 영수증발급사업자(법인사업자와 직전 연도의 재화·용 역의 공급가액 합계액이 사업장을 기준으로 2억원을 초과하 는 개인사업자는 제외)가 과세 재화.용역을 공급하고 신용 카드매출전표 등 법정증빙을 발급하거나, 전자적 결제수단 에 의하여 대금을 결제받는 경우 발급금액 또는 결제금액의 1.3%를 연간 1,000만원 한도 내에서 납부세액에서 공제받는 다. 이때 발급금액 또는 결제금액은 부가가치세를 제외한 공 급가액을 말한다.","a":"X","e":"주로 사업자가 아닌 자에게 재화.용역을 공급하는 사 업자로 영수증발급사업자(법인사업자와 직전 연도의 재 화·용역의 공급가액 합계액이 사업장을 기준으로 10억 원을 초과하는 개인사업자는 제외)가 과세 재화·용역을 공급하고 신용카드매출전표 등 법정증빙을 발급하거나, 전자적 결제수단에 의하여 대금을 결제받는 경우 발급금 액 또는 결제금액의 1.3%를 연간 1,000만원 한도 내에서 납부세액에서 공제받는다. 이때 발급금액 또는 결제금액 은 부가가치세를 포함한 공급대가를 말한다.","pg":207},{"id":1106,"ch":19,"n":33,"q":"신용카드매출전표 등 발급세액 공제액이 그 공제액을 차감 하기 전의 납부할 세액을 초과하면 그 초과하는 부분은 이 월공제된다.","a":"X","e":"신용카드매출전표 등 발급세액 공제액이 그 공제액을 차 감하기 전의 납부할 세액을 초과하면 그 초과하는 부분은 없는 것으로 보아 환급하지 않는다.","pg":207},{"id":1107,"ch":19,"n":34,"q":"직전 사업연도의 사업장별 재화·용역의 공급가액(면세공 급가액 제외)의 합계액이 3억원 미만인 개인사업자가 전자 세금계산서 발급명세를 발급일의 다음 달 10일까지 전송하 는 경우 발급 건수당 200원에 해당하는 세액공제액을 연간 100만원 한도 내에서 납부세액에서 공제할 수 있다.","a":"X","e":"직전 사업연도의 사업장별 재화·용역의 공급가액(면세 공급가액 포함)의 합계액이 3억원 미만인 개인사업자가 전자세금계산서 발급명세를 발급일의 다음 날까지 전송 하는 경우 발급 건수당 200원에 해당하는 세액공제액을 연간 100만원 한도 내에서 납부세액에서 공제할 수 있다.","pg":207},{"id":1108,"ch":19,"n":35,"q":"매출가액과 매입가액이 있는 일반과세자가 직접 전자신고방 법으로 부가가치세 확정신고를 하는 경우에는 해당 납부세 액에서 1만원을 공제하거나 환급세액에서 가산한다.","a":"X","e":"매출가액과 매입가액이 있는 일반과세자가 직접 전자신 고방법으로 부가가치세 확정신고를 하는 경우에는 해당 납부세액에서 5,000원 NEW을 공제하거나 환급세액에서 가산한다.","pg":207},{"id":1109,"ch":19,"n":36,"q":"화 재 · 역 용 을 급 공 지 하 ( 지 받 고 않 금 세 서 산 계 등 을 급 발 한 ( 급 발 은 받 우 경 당 해 금 세 서 산 계 상 급 공 액 가 의 3 % 의 세금 계산서 실 성 불 세 산 가 를 과 부 다 한 . OX 38 금 세 서 산 계 의 급 발 기 시 가 난 지 후 해 당 화 재 는 또 역 용 의 급 공 기 시 가 속 하는 세 과 간 기 에 한 대 정 확 고 신 한 기 지 까 금 세 서 산 계 를 급 발 지 하 은 않 우 경 급 공 액 가 의 1 % 의 금 세 서 산 계 실 성 불 세 산 가 를 과 부 다 한 .","a":"X","e":"화 재 · 역 용 을 급 공 지 하 ( 지 받 고 않 금 세 서 산 계 등 을 급 발 한 ( 급 발 은 받 우 경 당 해 금 세 서 산 계 상 급 공 액 가 의 4 % W E N 의 금 세 서 산 계 실 성 불 세 산 가 를 과 부 다 한 . 3 8 × 제 출 매 배 통 K N I L 오 다 진 2 7 2 . p 법 세 1 2 5 4 . p 금 세 서 산 계 의 급 발 기 시 가 난 지 후 당 해 화 재 는 또 역 용 의 급 공 기 시 가 는 하 속 세 과 간 기 에 한 대 정 확 고 신 한 기 지 까 금 세 서 산 계 를 급 발 지 하 은 않 우 경 급 공 액 가 의 2 % 의 금 세 서 산 계 실 성 불 세 산 가 를 과 부 다 한 .","pg":208},{"id":1110,"ch":19,"n":37,"q":"금 세 서 산 계 의 급 발 기 시 가 지 난 후 당 해 화 재 는 또 역 용 의 급 공 기 시 가 속 하는 세 과 간 기 에 한 대 정 확 고 신 한 기 지 까 금 세 서 산 계 를 급 발 한 우 경 급 공 액 가 의 5 . 0 % 의 금 세 서 산 계 성 불 실 세 산 가 를 과 부 다 한 .","a":"X","e":"금 세 서 산 계 의 급 발 기 시 가 난 지 후 당 해 화 재 는 또 역 용 의 급 공 기 시 가 는 하 속 세 과 간 기 에 한 대 정 확 고 신 한 기 지 까 금 세 서 산 계 를 급 발 한 우 경 급 공 액 가 의 1 % 의 금 세 서 산 계 실 성 불 세 산 가 를 과 부 다 한 .","pg":208},{"id":1111,"ch":20,"n":1,"q":"외국법인(신규사업 개시자 아님)은 각 과세기간 중 예정신고 기간이 끝난 후 30일 이내에 법령으로 정하는 바에 따라 각 예정신고기간에 대한 과세표준과 납부세액 또는 환급세액을 사업장 관할 세무서장에게 신고하여야 한다.","a":"X","e":"외국법인(신규사업 개시자 아님)은 각 과세기간 중 예정 신고기간이 끝난 후 2.5일 이내에 법령으로 정하는 바에 따라 각 예정신고기간에 대한 과세표준과 납부세액 또는 환급세액을 사업장 관할 세무서장에게 신고하여야 한다.","pg":209},{"id":1112,"ch":20,"n":2,"q":"예정신고기간 중 매월 또는 매 2월에 조기환급신고를 한 때 에 이미 신고한 내용도 예정신고 시 포함한다.","a":"X","e":"예정신고기간 중 매월 또는 매 2월에 조기환급신고를 한 때에 이미 신고한 내용은 예정신고 대상에서 제외한다.","pg":209},{"id":1113,"ch":20,"n":3,"q":"납세지 관할 세무서장은 법인사업자와 직전 과세기간 공급 가액의 합계액이 1억 5천만원 미만인 개인사업자에 대하여 는 각 예정신고기간마다 직전 과세기간에 대한 납부세액의 30퍼센트로 결정하여 납부고지서를 발부하여 해당 예정신 고기간이 끝난 후 25일까지 징수한다. ○","a":"X","e":"납세지 관할 세무서장은 개인사업자와 직전 과세기간 공 급가액의 합계액이 1억 5천만원 미만인 법인사업자에 대 하여는 각 예정신고기간마다 직전 과세기간에 대한 납부 세액의 50퍼센트로 결정하여 납부고지서를 발부하여 해 당 예정신고기간이 끝난 후 25일까지 징수한다.","pg":209},{"id":1114,"ch":20,"n":4,"q":"납세지 관할 세무서장은 개인사업자에 대하여는 제2기분 예 정신고기간분 부가가치세액(예정고지세액)에 대하여 10월 1 일부터 10월 15일까지의 기간 이내에 납부고지서를 발부해 야 한다.","a":"X","e":"납세지 관할 세무서장은 개인사업자에 대하여는 제2기분 예정신고기간분 부가가치세액(예정고지세액)에 대하여 10월 1일부터 10월 10일까지의 기간 이내에 납부고지서 를 발부해야 한다.","pg":209},{"id":1115,"ch":20,"n":5,"q":"「부가가치세법」상 예정고지로 징수하여야 할 금액이 30만원 미만인 경우 징수하지 않는다.","a":"X","e":"「부가가치세법」상 예정고지로 징수하여야 할 금액이 50 만원 미만인 경우 징수하지 않는다.","pg":209},{"id":1116,"ch":20,"n":6,"q":"휴업 또는 사업 부진으로 인하여 각 예정신고기간의 공급가 액 또는 납부세액이 직전 과세기간의 공급가액 또는 납부세 액의 2분의 1에 미달하는 자는 예정고지 대상의 사업자라도 예정신고·납부할 수 있다.","a":"X","e":"휴업 또는 사업 부진으로 인하여 각 예정신고기간의 공급 가액 또는 납부세액이 직전 과세기간의 공급가액 또는 납 부세액의 3분의 1에 미달하는 자는 예정고지 대상의 사업 자라도 예정신고·납부할 수 있다.","pg":209},{"id":1117,"ch":20,"n":7,"q":"사업자는 각 과세기간에 대한 과세표준과 납부세액 또는 환 급세액을 그 과세기간이 끝난 후 25일(폐업하는 경우 폐업 일이 속한 달의 다음 달 25일) 이내에 납세지 관할 세무서장 에게 신고하여야 하며, 조기에 환급을 받기 위하여 신고한 사업자는 이미 신고한 과세표준과 환급받은 환급세액도 신 고하여야 한다.","a":"X","e":"사업자(간이과세자 포함)는 각 과세기간에 대한 과세표준 과 납부세액 또는 환급세액을 그 과세기간이 끝난 후 25 일(폐업하는 경우 폐업일이 속한 달의 다음 달 25일)이 내에 납세지 관할 세무서장에게 신고하여야 한다. 다만, 예정신고를 한 사업자 또는 조기에 환급을 받기 위하여 신고한 사업자는 이미 신고한 과세표준과 납부한 납부세 액 또는 환급받은 환급세액은 신고하지 아니한다.","pg":210},{"id":1118,"ch":20,"n":8,"q":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납부 유예를 받으려는 중소·중견사업자는 납부유예대상여부 확 인 요청일 현재 3년간 국세(관세 포함)를 체납한 사실과 납 부유예가 취소된 사실 및 「조세범처벌법」 또는 「관세법」 위 반으로 처벌받은 사실이 없어야 한다.","a":"X","e":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납 부유예를 받으려는 중소·중견사업자는 납부유예대상여 부 확인 요청일 현재 2년간 국세(관세 포함)를 체납한 사 실과 납부유예가 취소 된 사실 및 「조세범처벌법」 또는 「관세법」 위반으로 처벌받은 사실이 없어야 한다.","pg":210},{"id":1119,"ch":20,"n":9,"q":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납부 유예를 받으려는 중견사업자는 직전 사업연도에 영세율 재 화의 공급가액 합계액이 총공급가액의 50% 이상이어야 한 다.","a":"X","e":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납 부유예를 받으려는 중견사업자는 직전 사업연도에 영세 율 재화의 공급가액 합계액이 총공급가액의 30% 이상이 어야 한다.","pg":210},{"id":1120,"ch":20,"n":10,"q":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납부 유예를 받으려는 중소·중견사업자는 부가가치세 납부유예 적용 신청서를 관할 세무서장에게 제출해야 하고, 신청을 받 은 관할 세무서장은 신청일부터 1개월 이내에 납부유예의 승인 여부를 결정하여 해당 중소·중견사업자에게 통지해야 한다.","a":"X","e":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납 부유예를 받으려는 중소·중견사업자는 부가가치세 납부 유예 적용 신청서를 관할 세관장에게 제출해야 하고, 신 청을 받은 관할 세관장은 신청일부터 1개월 이내에 납부 유예의 승인 여부를 결정하여 해당 중소·중견사업자에 게 통지해야 한다.","pg":210},{"id":1121,"ch":20,"n":11,"q":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납부 유예를 승인하는 경우 그 유예기간은 2년으로 한다. 0x 226 제4편 부가가치세법","a":"X","e":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납 부유예를 승인하는 경우 그 유예기간은 1년으로 한다.","pg":210},{"id":1122,"ch":20,"n":12,"q":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납부 가 유예되는 때에는 수입계산서를 발급하지 아니한다.","a":"X","e":"법령으로 정하는 재화의 수입에 대하여 부가가치세의 납 부가 유예되는 때에도 수입계산서는 발급해야 하는데 이 때 수입세금계산서에 부가가치세 납부유예 표시를 하여 발급한다.","pg":211},{"id":1123,"ch":20,"n":13,"q":"「소득세법」・「법인세법」에 따른 국내사업장이 없는 비거주 자 또는 외국법인이 국내에서 용역 또는 권리를 공급(국내 에 반입하는 것으로서 관세와 함께 부가가치세를 신고·납 부하여야 하는 재화의 수입에 해당하지 아니한 경우를 포함) 한 경우 그 공급받은 자는 용역 또는 권리의 제공이 완료되 는 때에 부가가치세를 징수하고 대리납부하여야 한다.","a":"X","e":"「소득세법」· 「법인세법」에 따른 국내사업장이 없는 비거 주자 또는 외국법인이 국내에서 용역 또는 권리를 공급 (국내에 반입하는 것으로서 관세와 함께 부가가치세를 신 고·납부하여야 하는 재화의 수입에 해당하지 아니한 경 우를 포함)한 경우 그 공급받은 자는 그 대가를 지급하는 때에 부가가치세를 징수하고 대리납부하여야 한다. 참고 공급받는 자가 징수한 부가가치세는 해당 대가를 지급한 날 이 속하는 예정신고기한 및 확정신고기한까지 부가가치세 대리납부 신고서를 제출하여 부가가치세를 징수한 사업장 또는 주소지 관할 세무서장에게 납부하거나 「국세징수법」에 따른 납부서를 작성하여 한국은행 또는 체신관서에 납부해야 함","pg":211},{"id":1124,"ch":20,"n":14,"q":"국내사업장이 있는 비거주자 또는 외국법인로부터 부가가치 세 과세대상 용역을 공급받는 자는 부가가치세 대리납부 의 무가 없다.","a":"X","e":"국내사업장이 있다하더라도 그 국내사업장과 관련없이 용역 등을 공급하는 자(국내사업장과 실질적으로 관련되 지 않거나 해당 용역 또는 권리의 제공이 국내사업장에 귀속되지 아니하는 경우만 해당)로부터 부가가치세 과세 대상 용역을 공급받는 자는 부가가치세 대리납부 의무가 있다.","pg":211},{"id":1125,"ch":20,"n":15,"q":"국내사업장이 없는 비거주자로부터 국내에서 용역을 공급받 는 자가 공급받은 그 용역을 과세사업에 제공하는 경우에는 그 대가를 지급하는 때에 그 대가를 받은 자로부터 부가가 치세를 징수하여야 한다.","a":"X","e":"국내사업장이 없는 비거주자로부터 국내에서 용역을 공 급받는 자가 공급받은 그 용역을 과세사업에 제공하는 경 우에는 대리납부의무가 없다.","pg":211},{"id":1126,"ch":20,"n":16,"q":"매입세액이 공제되지 아니하는 용역 또는 권리를 공급받고 대가를 지급하는 자가 그 용역 또는 권리를 과세사업에 제 공하는 경우에는 대리납부의무가 없다.","a":"X","e":"매입세액이 공제되지 아니하는 용역 또는 권리를 공급받 고 대가를 지급하는 자가 그 용역 또는 권리를 과세사업 에 제공하는 경우에는 대리납부의무가 있다.","pg":211},{"id":1127,"ch":20,"n":17,"q":"국내사업장이 없는 외국법인으로부터 물건을 공급받는 면세 사업자는 그 대가를 지급하는 때에 그 대가를 받은 자로부 터 부가가치세를 징수하여야 한다.","a":"X","e":"국내사업장이 없는 외국법인으로부터 용역 또는 권리를 공급받는 면세사업자는 그 대가를 지급하는 때에 그 대가 를 받은 자로부터 부가가치세를 징수하여야 한다.","pg":212},{"id":1128,"ch":20,"n":18,"q":"과세사업자가 국내사업장이 있는 비거주자로부터 국내사 업장과 관련이 없고 그 사업장에 귀속되지 아니하는 용역 을 공급받는 경우에는 매입세액공제 여부와 관계없이 그 대 가를 지급하는 때에 그 대가를 받은 자로부터 부가가치세를 징수하여야 한다.","a":"X","e":"과세사업자가 국내사업장이 있는 비거주자로부터 국내사 업장과 관련이 없고 그 사업장에 귀속되지 아니하는 용역 을 공급받는 경우에는 매입세액공제여부에 따라 대리납 부의무의 유무가 달라진다. 매입세액공제를 받는 경우 대 리납부의무가 없고, 매입세액공제를 받지 않는 경우 대리 납부의무가 있다.","pg":212},{"id":1129,"ch":20,"n":19,"q":"국내사업장이 없는 비거주자로부터 부가가치세 면세대상 용역을 공급받는 자는 부가가치세 대리납부 의무가 없다.","a":"O","e":"","pg":212},{"id":1130,"ch":20,"n":20,"q":"부가가치세 대리납부신고서에 기재된 대리납부세액이 세법 에 따라 신고해야 할 세액에 미치지 못할 때에는 수정신고 를 할 수 있다.","a":"X","e":"부가가치세 대리납부신고서는 과세표준신고서가 아니므 로 수정신고 및 경정청구의 대상이 될 수 없다.","pg":212},{"id":1131,"ch":20,"n":21,"q":"사업의 포괄양도(이에 해당하는지 여부가 분명하지 아니한 경우를 포함)에 따라 그 사업을 양수받은 자는 그 대가를 지 급하는 때에 그 대가를 받은 자로부터 부가가치세를 징수하 여 그 대가를 지급하는 날이 속하는 과세기간의 확정신고를 통해 사업장 관할 세무서장에게 납부할 수 있다.","a":"X","e":"사업의 포괄양도(이에 해당하는지 여부가 분명하지 아니 한 경우를 포함)에 따라 그 사업을 양수받은 자는 그 대가 를 지급하는 때에 그 대가를 받은 자로부터 부가가치세를 징수하여 그 대가를 지급하는 날이 속하는 달의 다음 달 25일까지 확정신고를 통해 사업장 관할 세무서장에게 납 부할 수 있다.","pg":212},{"id":1132,"ch":20,"n":22,"q":"사업양수자가 대리납부하더라도 사업의 포괄양도는 「부가가 치세법상 재화의 공급으로 보지 아니한다.","a":"X","e":"사업의 포괄양도라도 사업양수자가 대리납부하면 재화의 공급으로 본다.","pg":212},{"id":1133,"ch":20,"n":23,"q":"조기환급은 조기환급기간 단위로 환급하는 것이고, 그 조기 환급신고기한이 지난 후 25일 이내에 환급해야 한다.","a":"X","e":"조기환급은 조기환급기간 단위로 환급하는 것이고, 그 조 기환급신고기한이 지난 후 15일 이내에 환급해야 한다.","pg":213},{"id":1134,"ch":20,"n":24,"q":"매입세액이 매출세액을 초과하는 경우 납세지 관할 세무서 장은 각 과세기간별로 그 과세기간에 대한 환급세액을 확정 신고한 사업자에게 그 확정신고기한이 지난 후 30일 이내 (조기환급 제외)에 환급하여야 한다.","a":"O","e":"","pg":213},{"id":1135,"ch":20,"n":25,"q":"사업자가 영세율을 적용받는 경우에는 영세율 과세표준이 없는 과세기간에도 조기환급을 받을 수 있다.","a":"X","e":"조기환급을 받을 수 있는 사업자는 해당 영세율 등 조기 환급신고기간 예정신고기간 또는 과세기간 중에 각 신 고기간 단위별로 영세율의 적용 대상이 되는 과세표준이 있는 경우에 한한다. 사업자가 영세율을 적용받는 경우 조기환급을 받을 수 있으나 영세율 과세표준이 없는 과세 기간에는 조기환급을 받을 수 없다.","pg":213},{"id":1136,"ch":20,"n":26,"q":"사업자가 감가상각 대상인 사업 설비를 신설·취득·확장 또는 증축하는 경우 조기환급을 받을 수 있다.","a":"O","e":"","pg":213},{"id":1137,"ch":20,"n":27,"q":"조기환급을 받으려는 사업자가 부가가치세 예정신고서 또는 확정신고서와 별도로 조기환급신고서를 제출하여야 한다.","a":"X","e":"조기환급을 받으려는 사업자가 부가가치세 예정신고서 또는 확정신고서를 제출한 경우에는 조기환급신고한 것 으로 본다.","pg":213},{"id":1138,"ch":20,"n":28,"q":"조기환급 신고를 받은 관할 세무서장은 각 예정신고기간별 로 또는 과세기간별로 그 예정신고기한 또는 확정신고기한 이 지난 후 30일 이내에 사업자에게 환급하여야 한다.","a":"X","e":"조기환급 신고를 받은 관할 세무서장은 각 예정신고기간 별로 또는 과세기간별로 그 예정신고기한 또는 확정신고 기한이 지난 후 15일 이내에 사업자에게 환급하여야 한 다.","pg":213},{"id":1139,"ch":20,"n":29,"q":"조기환급기간에 조기환급 신고를 받은 관할 세무서장은 각 조기환급기간별로 해당 조기환급신고기한이 지난 후 10일 이내에 사업자에게 환급하여야 한다.","a":"X","e":"조기환급기간에 조기환급 신고를 받은 관할 세무서장은 각 조기환급기간별로 해당 조기환급신고기한이 지난 후 15일 이내에 사업자에게 환급하여야 한다.","pg":214},{"id":1140,"ch":20,"n":30,"q":"조기환급신고를 할 때 매출· 매입처별 세금계산서합계표를 제출한 경우에는 예정신고 또는 확정신고와 함께 매출. 매 입처별 세금계산서합계표를 제출한 것으로 본다.","a":"O","e":"","pg":214},{"id":1141,"ch":20,"n":31,"q":"조기환급세액은 영의 세율이 적용되는 공급분에 관련된 매 입세액과 시설투자에 관련된 매입세액 또는 국내공급분에 대한 매입세액을 구분하여 사업장 별로 해당 매출세액에서 매입세액을 공제하여 계산한다.","a":"X","e":"조기환급세액은 영의 세율이 적용되는 공급분에 관련된 매입세액. 시설투자에 관련된 매입세액 또는 국내공급분 에 대한 매입세액을 구분하지 아니하고 사업장 별로 해당 매출세액에서 매입세액을 공제하여 계산한다.","pg":214},{"id":1142,"ch":20,"n":32,"q":"관할 세무서장은 결정경정에 의하여 추가로 발생한 환급 세액이 있는 경우에는 15일 이내에 사업자에게 환급하여야 한다.","a":"X","e":"관할 세무서장은 결정. 경정에 의하여 추가로 발생한 환 급세액이 있는 경우에는 지체 없이 사업자에게 환급하여 야 한다.","pg":214},{"id":1143,"ch":20,"n":33,"q":"납세지 관할 세무서장 등은 사업자가 사업장별로 사업자등 록을 하지 않은 경우 부가가치세의 과세표준과 납부세액 또 는 환급세액을 조사하여 결정 또는 경정하고 국세징수의 예 에 따라 징수할 수 있다.","a":"X","e":"납세지 관할 세무서장 등은 사업자가 법에 열거한 경우 에 해당하는 때에만 해당 예정신고기간 및 과세기간에 대 한 부가가치세의 과세표준과 납부세액 또는 환급세액을 조사하여 결정 또는 경정한다. 사업자가 사업장별로 사업 지등록을 하지 않은 경우는 빕에 열거한 경우에 해당하지 아니한다.","pg":214},{"id":1144,"ch":20,"n":34,"q":"추계하는 경우를 제외하고 납세지 관할 세무서장 등은 각 예정신고기간 및 과세기간에 대한 과세표준과 납부세액 또 는 환급세액을 조사하여 결정 또는 경정하는 경우에는 세금 계산서, 수입세금계산서, 장부 또는 그 밖의 증명 자료를 근 거로 하여야 한다.","a":"O","e":"","pg":214},{"id":1145,"ch":20,"n":35,"q":"납세지 관할 세무서장 등은 각 예정신고기간 및 과세기간에 대한 과세표준과 납부세액 또는 환급세액을 조사하여 결정 또는 경정하는 경우에는 세금계산서, 수입세금계산서, 장부 또는 그 밖의 증명 자료를 근거로 하여야 함에도 불구하고 과세표준을 계산할 때 필요한 세금계산서, 수입세금계산서. 장부 또는 그 밖의 증명 자료가 없거나 그 중요한 부분이 갖 추어지지 아니한 경우 추계할 수 있다.","a":"O","e":"","pg":215},{"id":1146,"ch":20,"n":36,"q":"사업장 관할 세무서장 등은 조사에 의하여 결정 또는 경정 한 과세표준과 납부세액 또는 환급세액에 오류 또는 탈루가 있는 것이 발견된 때에는 그 날로부터 30일 이내 이를 다시 경정한다.","a":"X","e":"납세지 관할 세무서장 등은 결정하거나 경정한 과세표준 과 납부세액 또는 환급세액에 오류가 있거나 누락된 내용 이 발견되면 즉시 다시 경정한다.","pg":215},{"id":1147,"ch":20,"n":37,"q":"국외사업자가 정보통신망을 통하여 이동통신단말장치 또는 컴퓨터 등으로 전자적 용역을 국내에 제공하는 경우(「소득세 법」·. 「법인세법」에 따라 사업자등록을 한 자의 과세·면세 사업에 대하여 용역을 공급하는 경우 포함)에는 사업의 개시 일부터 20일 이내에 간편한 방법으로 사업자등록을 하여야 한다.","a":"X","e":"국외사업자가 정보통신망을 통하여 이동통신단말장치 또 는 컴퓨터 등으로 전자적 용역을 국내에 제공하는 경우 「소득세법」·「법인세법」에 따라 사업자등록을 한 자의 과 세 면세사업에 대하여 용역을 공급하는 경우는 제외)에 는 사업의 개시일부터 20일 이내에 간편한 방법으로 사 업자등록을 하여야 한다.","pg":215},{"id":1148,"ch":20,"n":38,"q":"국외사업자가 정보통신망 등을 이용하여 전자적 용역의 거 래가 가능하도록 오픈마켓이나 그와 유사한 것을 운영하고 관련 서비스를 제공하는 제3자(비거주자 또는 외국법인 포 함)를 통하여 국내에 전자적 용역을 공급하는 경우(등록사업 자의 과세사업 또는 면세사업에 대하여 용역을 공급하는 경 우나 국외사업자의 용역 등 공급 특례에 관한 규정이 적용 되는 경우는 포함)에는 그 제3자가 해당 전자적 용역을 공급 한 것으로 보며, 그 제3자는 사업 개시일부터 20일 이내에 간편사업자등록을 하여야 한다.","a":"X","e":"국외사업자가 정보통신망 등을 이용하여 전자적 용역의 거래가 가능하도록 오픈마켓이나 그와 유사한 것을 운영 하고 관련 서비스를 제공하는 제3자(비거주자 또는 외국 법인 포함)를 통하여 국내에 전자적 용역을 공급하는 경 우(등록사업자의 과세사업 또는 면세사업에 대하여 용역 을 공급하는 경우나 국외사업자의 용역 등 공급 특례에 관한 규정이 적용되는 경우는 제외)에는 그 제3자가 해당 전자적 용역을 공급한 것으로 보며, 그 제3자는 사업 개 시일부터 20일 이내에 간편사업자등록을 하여야 한다.","pg":215},{"id":1149,"ch":20,"n":39,"q":"국내로 공급되는 전자적 용역의 공급시기는 구매자가 공급 하는 자로부터 전자적 용역을 제공받은 때로 한다.","a":"X","e":"국내로 공급되는 전자적 용역의 공급시기는 구매자가 공 급하는 자로부터 전자적 용역을 제공받은 때와 구매자가 진시적 용익을 구매하기 위하여 대금의 결제를 완료한 때 중 빠른 때로 한다.","pg":216},{"id":1150,"ch":20,"n":40,"q":"간편사업자등록을 한 사업자가 국내에 전자적 용역을 공급 하는 경우에는 국내사업자와 동일하게 세금계산서 및 영수 증을 발급하여야 한다.","a":"X","e":"간편사업자등록을 한 사업자가 국내에 공급하는 전자적 용역에 대해서는 세금계산서를 발급하지 아니할 수 있다.","pg":216},{"id":1151,"ch":20,"n":41,"q":"간편사업자등록을 한 자는 전자적 용역의 공급에 대한 거래 명세(등록사업자의 과세사업 또는 면세사업에 대하여 용역 을 공급하는 경우의 거래명세를 포함)를 그 거래사실이 속하 는 과세기간에 대한 확정신고 기한이 지난 후 5년간 보관하 여야 한다.","a":"O","e":"","pg":216},{"id":1152,"ch":20,"n":42,"q":"국세청장은 부가가치세 신고의 적정성을 확인하기 위하여 간편사업자등록을 한 자에게 전자적 용역 거래명세서를 제 출할 것을 요구할 수 있으며 간편사업자등록을 한 자는 해 당 요구를 받은 날부터 1개월 이내에 전자적 용역 거래명세 서를 국세청장에게 제출하여야 한다.","a":"X","e":"국세청장은 부가가치세 신고의 적정성을 확인하기 위하 여 간편사업자등록을 한 자에게 전자적 용역 거래명세서 를 제출할 것을 요구할 수 있으며 간편사업자등록을 한 자는 해당 요구를 받은 날부터 60일 이내에 전자적 용역 거래명세서를 국세청장에게 제출하여야 한다.","pg":216},{"id":1153,"ch":20,"n":43,"q":"국외사업자가 「부가가치세법」에 따른 사업자등록의 대상으 로서 위탁매매인을 통하여 국내에서 용역을 공급하는 경우 에는 국외사업자가 해당 용역을 공급한 것으로 본다. ox 44 사업자는 자기의 납부세액 또는 환급세액과 관계되는 모든 거래사실을 대통령령으로 정하는 바에 따라 장부에 기록하 여 사업장에 갖추어 두어야 한다.","a":"X","e":"국외사업자가 「부가가치세법」에 따른 사업자등록의 대상 으로서 위탁매매인을 통하여 국내에서 용역을 공급하는 경우에는 위탁매매인이 해당 용역을 공급한 것으로 본다. 출제 ■글을 | C) LINK 오진다 p.179 세법1 p.478","pg":216},{"id":1154,"ch":20,"n":45,"q":"사업자가 부가가치세가 과세되는 재화 또는 용역의 공급과 함께 부가가치세가 면제되는 재화 또는 용역을 공급하는 경 우에는 과세되는 공급과 면세되는 공급을 각각 구분하지 않 고 장부에 기록할 수 있다.","a":"X","e":"사업자가 부가가치세가 과세되는 재화 또는 용역의 공급 과 함께 부가가치세가 면제되는 재화 또는 용역을 공급하 는 경우에는 과세되는 공급과 면세되는 공급을 각각 구분 하여 장부에 기록하여야 한다.","pg":217},{"id":1155,"ch":20,"n":46,"q":"사업자는 「부가가치세법」에 따라 기록한 장부와 세금계산서. 수입세금계산서, 전자세금계산서 또는 영수증을 그 거래사 실이 속하는 과세기간에 대한 확정신고 기한 후 3년간 보존 하여야 한다.","a":"X","e":"사업자는 「부가가치세법」에 따라 기록한 장부와 세금계산 서, 수입세금계산서, 전자세금계산서 또는 영수증을 그 거래사실이 속하는 과세기간에 대한 확정신고 기한 후 5년간 보존하여야 한다.","pg":217},{"id":1156,"ch":20,"n":47,"q":"사업자가 「법인세법」 및 「소득세법」에 따라 장부기록의무를 이행한 경우에도 「부가가치세법」에 따른 장부기록 의무를 별도로 이행하여야 한다.","a":"X","e":"사업자가 「법인세법」 및 「소득세법」에 따라 장부기록의무 를 이행한 경우에는 「부가가치세법」에 따른 장부기록 의 무를 이행한 것으로 본다.","pg":217},{"id":1157,"ch":21,"n":1,"q":"과세사업과 면세사업에 공통으로 사용하는 재화를 공급하는 경우 과세표준은 해당 과세기간의 과세공급가액 비율을 적 용하여 계산한다.","a":"X","e":"과세사업과 면세사업에 공통으로 사용하는 재화를 공급 하는 경우 과세표준은 직선 과세기간의 과세공급가액 비 율을 적용하여 계산한다.","pg":218},{"id":1158,"ch":21,"n":2,"q":"재화를 공급하는 날이 속하는 과세기간에 신규로 사업을 시 작하여 직전 과세기간이 없는 경우에는 해당 재화를 공급한 날이 속하는 과세기간의 공급가액에 의하여 안분계산한다.","a":"X","e":"재화를 공급하는 날이 속하는 과세기간에 신규로 사업을 시작하여 직전 과세기간이 없는 경우 안분계산을 생략하 고 해당 재화의 공급가액 전부를 과세표준으로 간주한다.","pg":218},{"id":1159,"ch":21,"n":3,"q":"재화를 공급하는 날이 속하는 과세기간의 직전 과세기간의 총 공급가액 중 면세공급가액이 5% 미만인 경우로서 해당 재화의 공급가액이 500만원 미만인 경우 안분계산을 생략 하고 해당 재화의 공급가액 전부를 과세표준으로 간주한다. ○","a":"X","e":"재화를 공급하는 날이 속하는 과세기간의 직전 과세기간 의 총공급가액 중 면세공급가액이 5% 미만인 경우로서 해당 재화의 공급가액이 5,000만원 미만인 경우 안분계 산을 생략하고 해당 재화의 공급가액 전부를 과세표준으 로 간주한다.","pg":218},{"id":1160,"ch":21,"n":4,"q":"재화의 공급가액 합계액이 50만원 미만인 경우 안분계산을 생략하고 해당 재화의 공급가액 전부를 과세표준으로 간주 한다.","a":"X","e":"재화의 공급단위별 공급가액이 50만원 미만인 경우 안분 계산을 생략하고 해당 재화의 공급가액 전부를 과세표준 으로 간주한다. 비교 해당 과세기간 중 공통매입세액 '합계액이 5만원 미만인 경우 안분계산을 생략하고 해당 재화의 공통매입세액 전부를 공제할 수 있 는 매입세액으로 간주함","pg":218},{"id":1161,"ch":21,"n":5,"q":"과세사업과 면세사업에 공통으로 사용되는 재화를 공급받 은 과세기간 중에 그 재화를 공급하는 경우 공통매입세액에 대한 안분기준은 해당 과세기간의 공급가액 비율을 적용해 야 한다. 234 제4편 부가가치세법","a":"X","e":"과세사업과 면세사업에 공통으로 사용되는 재화를 공급 받은 과세기간 중에 그 재화를 공급하는 경우 공통매입세 액에 대한 안분기준은 직진 과세기간의 공급가액 비율을 적용해야 한다.","pg":218},{"id":1162,"ch":21,"n":6,"q":"해당 과세기간의 총공급가액 중 면세공급가액이 5% 미만인 경우로서 공통매입세액이 500만원 미만인 경우에는 안분계 산을 생략하고 해당 재화의 공통매입세액 전부를 공제할 수 있는 매입세액으로 간주한다.","a":"O","e":"","pg":219},{"id":1163,"ch":22,"n":1,"q":"직전 연도의 공급대가의 합계액이 1억4백만원에 미달하는 법인 또는 개인사업자는 간이과세자가 될 수 있다.","a":"X","e":"법인사업자는 간이과세자가 될 수 없다.","pg":220},{"id":1164,"ch":22,"n":2,"q":"부동산매매업을 경영하는 개인사업자로서 직전연도의 공급 대가의 합계액이 4,800만원에 미달하는 자는 간이과세자에 관한 규정을 적용받을 수 있다.","a":"X","e":"부동산임대업(부동산임대인으로서 재정경제부령으로 정 하는 것 제외)을 경영하는 개인사업자로서 직전 연도의 공급대가의 합계액이 4,800만원에 미달하는 자는 간이과 세자에 관한 규정을 적용받을 수 있다. 비교 부동산매매업을 경영하는 개인사업자는 직전 연도 공급대가와 관계없이 간이과세자에 관한 규정을 적용받을 수 없다.","pg":220},{"id":1165,"ch":22,"n":3,"q":"전년도 기준 복식부기의무자가 경영하는 사업의 경우 간이 과세자에 관한 규정을 적용받을 수 없다.","a":"X","e":"전전년도 기준 복식부기의무자가 경영하는 사업의 경우 간이과세자에 관한 규정을 적용받을 수 없다.","pg":220},{"id":1166,"ch":22,"n":4,"q":"간이과세자도 「부가가치세법」상 사업개시일부터 20일 이내 에 사업자등록의무가 있다.","a":"O","e":"","pg":220},{"id":1167,"ch":22,"n":5,"q":"간이과세자가 발급받은 세금계산서상의 매입세액은 납부세 액에서 전액 공제되지만 납부세액을 초과하는 경우에는 해 당 금액을 환급하지 않는다.","a":"X","e":"간이과세자는 납부세액을 구할 때 매입세액을 전액 공제 하는 것이 아니라, 매입세액에 일정한 부가가치율을 곱한 금액을 세액공제로 적용할 뿐이다.","pg":220},{"id":1168,"ch":22,"n":6,"q":"간이과세자도 의제매입세액공제를 적용받을 수 있다.","a":"X","e":"간이과세자는 의제매입세액공제를 적용받을 수 없다.","pg":220},{"id":1169,"ch":22,"n":7,"q":"신규로 사업을 개시한 사업자의 경우 간이과세자에 관한 규 정이 적용되거나 적용되지 아니하게 되는 기간은 최초로 사 업을 개시한 해의 7월 1일부터 그 다음 해의 6월 30일까지 로 한다. 236 제4편 부가가치세법","a":"X","e":"신규로 사업을 개시한 사업자의 경우 간이과세자에 관한 규정이 적용되거나 적용되지 아니하게 되는 기간은 최초 로 사업을 개시한 해의 다음 해의 7월 1일부터 그 다음 해 의 6월 30일까지로 한다.","pg":220},{"id":1170,"ch":22,"n":8,"q":"일반과세자가 간이과세자로 변경되는 경우 그 변경되는 해 에 간이과세자에 관한 규정이 적용되는 기간의 부가가치세 의 과세기간은 그 변경 이후 1월 1일부터 12월 31일까지이다.","a":"X","e":"일반과세자가 간이과세자로 변경되는 경우 그 변경되는 해에 간이과세자에 관한 규정이 적용되는 기간의 부가가 치세의 과세기간은 그 변경 이후 7월 1일부터 12월 31일 까지이다.","pg":221},{"id":1171,"ch":22,"n":9,"q":"간이과세자가 일반과세자로 변경되는 경우 그 변경되는 해 에 간이과세자에 관한 규정이 적용되는 기간의 부가가치세 의 과세기간은 그 변경 이전 1월 1일부터 6월 30일까지이다.","a":"O","e":"","pg":221},{"id":1172,"ch":22,"n":10,"q":"간이과세자가 부가가치세법 시행령 제109조 제2항에 따른 사업(간이과세자로 보지 아니하는 사업)을 신규로 겸영하는 경우에는 해당 사업의 개시일이 속하는 과세기간부터 간이 과세자에 관한 규정을 적용하지 않는다.","a":"X","e":"간이과세자가 부가가치세법 시행령 제109조 제2항에 따 른 사업(간이과세자로 보지 아니하는 사업)을 신규로 겸 영하는 경우에는 해당 사업의 개시일이 속하는 과세기간 의 다음 과세기간부터 간이과세자에 관한 규정을 적용하 지 않는다.","pg":221},{"id":1173,"ch":22,"n":11,"q":"부가가치세법 시행령 제109조 제2항에 따른 사업(간이과세 자로 보지 아니하는 사업)을 신규로 겸영하여 일반과세자로 전환된 사업자로서 해당 연도 공급대가의 합계액이 8천만 원 미만인 사업자가 해당 간이과세자로 보지 아니하는 사업 을 폐지하는 경우에는 해당 사업의 폐지일이 속하는 연도의 다음 연도 1월 1일부터 간이과세자에 관한 규정을 적용한다.","a":"X","e":"부가가치세법 시행령 제109조 제2항에 따른 사업(간이과 세자로 보지 아니하는 사업)을 신규로 겸영하여 일반과세 자로 전환된 사업자로서 해당 연도 공급대가의 합계액이 1억4백만원 미만인 사업자가 해당 간이과세자로 보지 아 니하는 사업을 폐지하는 경우에는 해당 사업의 폐지일이 속하는 연도의 다음 연도 7월 1일부터 간이과세자에 관한. 규정을 적용한다.","pg":221},{"id":1174,"ch":22,"n":12,"q":"과세유형이 변경되는 경우에 해당 사업자의 관할 세무서장 은 그 변경되는 과세기간 개시 25일 전까지 그 사실을 통지 하여야 하며, 사업자등록증을 정정하여 과세기간 개시 당일 까지 발급하여야 한다.","a":"X","e":"과세유형이 변경되는 경우에 해당 사업자의 관할 세무서 장은 그 변경되는 과세기간 개시 20일 전까지 그 사실을 통지하여야 하며, 사업자등록증을 정정하여 과세기간 개 시 당일까지 발급하여야 한다.","pg":221},{"id":1175,"ch":22,"n":13,"q":"일반과세자에서 간이과세자로 과세유형이 변경되는 경우 변 경통지를 받은 날이 속하는 과세기간까지는 간이과세자에 관한 규정을 적용한다.","a":"X","e":"긴이괴세계에서 일반과세자로 과세유형이 변경되는 경우 변경통지를 받은 날이 속하는 과세기간까지는 간이과세 자에 관한 규정을 적용한다. 일반과세자에서 간이과세자로 과세유형이 변경되는 경우 에는 변경통지와 관계없이 간이과세자에 대한 규정을 적 용한다.","pg":222},{"id":1176,"ch":22,"n":14,"q":"간이과세자가 간이과세자에 관한 규정의 적용을 포기하고 일반과세자에 관한 규정을 적용 받으려는 경우에는 적용 받으려는 달의 마지막 날까지 대통령령으로 정하는 바에 따 라 납세지 관할세무서장에게 신고하여야 한다.","a":"X","e":"간이과세자가 간이과세자에 관한 규정의 적용을 포기하 고 일반과세자에 관한 규정을 적용 받으려는 경우에는 적용 받으려는 단의 진달 마지막 날까시 대통령령으로 정 하는 바에 따라 납세지 관할세무서장에게 신고하여야 한 다.","pg":222},{"id":1177,"ch":22,"n":15,"q":"일반과세자에서 간이과세자르 과세유형의 전환은 과세유형 전환에 관한 통지를 요건으로 한다.","a":"X","e":"변경통지와 관계없이 간이과세자에 대한 규정을 적용한 다. 비교 간이과세자에서 일반과세자로 과세유형의 전환은 과세유형 전환에 관한 통지를 요건으로 하며 변경통지를 받은 날이 속하는 과 세기간까지는 간이과세자에 관한 규정을 적용함","pg":222},{"id":1178,"ch":22,"n":16,"q":"간이과세를 포기하여 일반과세자에 관한 규정을 적용받게 된 경우, 그 적용받으려는 달의 1일부터 3년이 되는 날이 속 하는 과세기간까지는 간이과세자에 관한 규정을 적용받지 못하며, 포기 신고를 한 개인사업자가 법령으로 정하는 요건 을 만족하는 경우에 한하여 간이과세자에 관한 규정의 적용 이 제한되는 과세기간 중이라도 간이과세자에 관한 규정을 적용받을 수 있다.","a":"O","e":"","pg":222},{"id":1179,"ch":22,"n":17,"q":"간이과세자의 납부세액은 공급대가에 해당 업종별 부가가 치율을 곱하여 계산하며, 둘 이상의 업종을 겸영하면 각각의 업종별로 계산한 금액의 합계액으로 한다.","a":"X","e":"간이과세자의 납부세액은 공급대가에 해당 업종별 부가 가치율과 10퍼센트를 곱하여 계 ㅏㅣ 둘 이상의 업종을 겸영하면 각각의 업종별로 st 다.","pg":222},{"id":1180,"ch":22,"n":18,"q":"간이과세자의 해당 과세기간에 대한 공급대가의 합계액이 4,800만원 미만이면 그 과세기간의 납부세액의 납부의무를 면제한다. 다만, 일반과세자가 간이과세자로 변경되는 경우 납부세액에 더하여야 할 재고매입세액은 납부하여야 한다.","a":"X","e":"간이과세자의 해당 과세기간에 대한 공급대가의 합계액 이 4,800만원 미만이면 그 과세기간의 납부세액의 납부 의무를 면제한다. 다만, 일반과세자가 간이과세자로 변경 되는 경우 납부세액에 더하여야 할 재고납부세액은 납부 하여야 한다.","pg":223},{"id":1181,"ch":22,"n":19,"q":"휴업자·폐업자 및 과세기간 중 과세유형을 전환한 간이과 세자에 대하여는 그 과세기간 개시일부터 휴업일·폐업일 및 과세유형 전환일까지의 공급대가의 합계액을 12개월로 환산한 금액을 기준으로 납세의무의 면제 여부를 판정하며, 이 경우 1개월 미만의 끝수가 있을 때에는 이를 1개월로 한 다.","a":"O","e":"","pg":223},{"id":1182,"ch":22,"n":20,"q":"일반과세자가 간이과세자로 변경되는 경우 재고매입세액을 납부세액에 가산하여 납부해야 하며, 가산대상은 매입세액 을 공제받은 것으로서 과세유형이 변경되는 날 현재에 있는 재고품 및 감가상각자산에 한한다.","a":"X","e":"일반과세자가 간이과세자로 변경되는 경우 재고납부세액 을 납부세액에 가산하여 납부해야 하며, 가산대상은 매 입세액을 공제받은 것으로서 과세유형이 변경되는 날 현 재에 있는 재고품, 건설중인자산 및 감가상각자산에 한한 다.","pg":223},{"id":1183,"ch":22,"n":21,"q":"재고납부세액은 간이과세자로 변경된 날이 속하는 과세기간 에 대한 예정신고 또는 확정신고를 할 때 납부세액에 더하 여 납부하며 이때 납부세액이 없는 경우에는 재고납부세액 도 납부하지 아니한다.","a":"X","e":"재고납부세액은 간이과세자로 변경된 날이 속하는 과세 기간에 대한 확정신고를 할 때 납부세액에 더하여 납부하 며 이때 납부세액이 없는 경우에도 재고납부세액은 납부 하여야 한다.","pg":223},{"id":1184,"ch":22,"n":22,"q":"일반과세자가 간이과세자로 변경된 후에 다시 일반과세자로 변경되는 경우에는 간이과세자로 변경된 때에 재고납부세액 을 납부하지 않은 재고품 등에 대해서도 재고품 등의 신고 와 재고매입세액 공제에 관한 규정을 적용한다.","a":"X","e":"일반과세자가 간이과세자로 변경된 후에 다시 일반과세 자로 변경되는 경우에는 간이과세자로 변경된 때에 재고 납부세액을 납부하지 않은 재고품 등에 대해서는 재고품 등의 신고와 재고매입세액 공제에 관한 규정을 적용하지 않는다 .","pg":223},{"id":1185,"ch":22,"n":23,"q":"간이과세자가 부가가치세가 과세되는 재화·용역을 공급하 고 세금계산서 발급시기에 신용카드매출전표 등 적격증빙을 발급하는(또는 전자화폐로 대금을 결제받는) 경우에는 그 발 급금액(또는 결제금액)의 1.3%를 연간 1,000만원의 한도 내 에서 납부세액에서 공제하거나 환급세액에 가산한다.","a":"X","e":"간이과세자가 부가가치세가 과세되는 재화.용역을 공급 하고 세금계산서 발급시기에 신용카드매출전표 등 적격 증빙을 발급하는(또는 전자화폐로 대금을 결제받는) 경우 에는 그 발급금액(또는 결제금액)의 1.3%를 연간 1,000 만원의 한도 내에서 납부세액에서 공제한다. ・・・ 간이과세자의 경우 신용카드 매출전표 발행 세액공제는 환급되지 아니함 주의","pg":224},{"id":1186,"ch":22,"n":24,"q":"간이과세자가 세금계산서를 수취하였으나 매입세금계산서 등 수취세액공제를 받지 않은 경우로서 결정 또는 경정기관 의 확인을 거쳐 매입세액공제를 받게 되는 경우에는 가산세 적용 대상에 해당하지 아니한다.","a":"X","e":"간이과세자가 세금계산서를 수취하였으나 매입세금계산 서 등 수취세액공제를 받지 않은 경우, 결정 또는 경정기 관의 확인을 거쳐 매입세액공제를 받게 되면 공급가액의 0.5%에 해당하는 세금계산서 관련 가산세를 적용받는다.","pg":224},{"id":1187,"ch":22,"n":25,"q":"간이과세자의 예정부과기간에 대한 부가가치세는 원칙적으 로 예정신고에 의하여 부가가치세를 징수한다.","a":"X","e":"간이과세자의 예정부과기간에 대한 부가가치세는 원칙적 으로 예정고지에 의하여 부가가치세를 징수한다.","pg":224},{"id":1188,"ch":22,"n":26,"q":"예정부과납부세액을 징수하지 않는 경우로서 징수하여야 할 금액이 30만원 미만인 경우 예정부과기간에 세액을 징수하 지 아니한다.","a":"X","e":"예정부과납부세액을 징수하지 않는 경우로서 징수하여야 할 금액이 50만원 미만인 경우 예정부과기간에 세액을 징수하지 아니한다.","pg":224},{"id":1189,"ch":22,"n":27,"q":"일반과세자가 간이과세자로 변경되어 그 변경 이전 1월 1일 부터 6월 30일까지의 과세기간이 적용되는 간이과세자의 경우 예정부과기간의 세액을 징수하지 아니한다.","a":"X","e":"간이과세자가 일반과세자로 변경되어 그 변경 이전 1월 1 일부터 6월 30일까지의 과세기간이 적용되는 간이과세자 의 경우 예정부과기간의 세액을 징수하지 아니한다.","pg":224},{"id":1190,"ch":22,"n":28,"q":"예정부과납부세액을 징수하지 않는 경우로서 「국세징수법」 상 납부기한 등의 연장사유 중 어느 하나에 해당하는 사유 로 관할 세무서장이 징수하여야 할 금액을 간이과세자가 납 부할 수 없다고 인정되는 경우 예정부과기간에 세액을 징수 하지 아니한다.","a":"O","e":"","pg":224},{"id":1191,"ch":22,"n":29,"q":"휴업 또는 사업부진 등으로 인하여 예정부과기간의 공급가 액의 합계액(또는 납부세액)이 직전 과세기간의 공급가액의 합계액(또는 납부세액)의 50%에 미달하는 간이과세자는 예 정부과기간의 과세표준과 납부세액을 예정부과기한까지 사 업장 관할 세무서장에게 신고 및 납부할 수 있다.","a":"X","e":"휴업 또는 사업부진 등으로 인하여 예정부과기간의 공급 대가의 합계액(또는 납부세액)이 직전 과세기간의 공급대 가의 합계액(또는 납부세액)의 1/3에 미달하는 간이과세 자는 예정부과기간의 과세표준과 납부세액을 예정부과기 한까지 사업장 관할 세무서장에게 신고 및 납부할 수 있 다.","pg":225},{"id":1192,"ch":22,"n":30,"q":"간이과세자는 간이과세를 포기하지 않으면 수출에 대하여 영세율을 적용받을 수 없다.","a":"X","e":"간이과세자도 과세사업자에 포함되므로 법정요건이 충족 되는 경우 영세율이 적용될 수 있다.","pg":225},{"id":1193,"ch":22,"n":31,"q":"재화 또는 용역의 공급에 대한 일반과세자의 부가가치세 과 세표준은 해당 과세기간에 공급한 재화 또는 용역의 공급대 가를 합한 금액으로 하는데 반하여, 간이과세자의 과세표준 은 해당 과세기간의 공급가액의 합계액으로 한다.","a":"X","e":"재화 또는 용역의 공급에 대한 일반과세자의 부가가치세 과세표준은 해당 과세기간에 공급한 재화 또는 용역의 공 급가액을 합한 금액으로 하는데 반하여, 간이과세자의 과 세표준은 해당 과세기간의 공급대가의 합계액으로 한다.","pg":225},{"id":1194,"ch":22,"n":32,"q":"법정요건을 충족하는 경우 일반과세자에 대해서는 업종제한 없이 면세농산물 등에 대한 의제매입세액공제특례가 적용될 수 있으나, 간이과세자는 적용될 수 없다.","a":"O","e":"","pg":225},{"id":1195,"ch":23,"n":1,"q":"내국법인은 그 설립등기일(사업의 실질적 관리장소를 두게 되는 경우에는 그 실질적 관리장소를 두게 된 날을 말하며, 법인과세 신탁재산의 경우에는 설립일을 말한다)부터 2개월 이내에 법인 설립신고서에 정관과 주주 등의 명세서와 사업 자등록 서류 등을 첨부하여 납세지 관할 세무서장에게 신고 하여야 한다.","a":"O","e":"","pg":226},{"id":1196,"ch":23,"n":2,"q":"외국에서 주된 영업을 하는 영리법인은 국내에 본점. 주사 무소(또는 사업의 실질적 관리장소)가 있다 하더라도 내국법 인으로 분류될 수 없다.","a":"X","e":"내국법인이란 본점. 주사무소(또는 사업의 실질적 관리 장소)가 국내에 있는 법인을 말하므로 외국에서 주된 영 업을 하는 영리법인이 국내에 본점. 주사무소(또는 사업 의 실질적 관리장소)가 있다면 내국법인으로 분류된다.","pg":226},{"id":1197,"ch":23,"n":3,"q":"외국법인은 외국법령에 따라 설립된 법인을 말한다.","a":"X","e":"외국법인은 본점. 주사무소. 그리고 사업의 실질적 관리 장소가 국내에 없는 법인을 말한다.","pg":226},{"id":1198,"ch":23,"n":4,"q":"내국법인은 국내원천소득뿐 아니라 국외원천소득에 대해서 도 각 사업연도의 소득에 대한 법인세 납세의무를 지는 반 면 외국법인은 국외원천소득에 대한 법인세 납세의무를 지 지 아니한다.","a":"O","e":"","pg":226},{"id":1199,"ch":23,"n":5,"q":"「민법」 제32조에 따라 설립된 법인은 해당 법인에 귀속되는 모든 소득에 대하여 각 사업연도의 소득에 대한 법인세를 납부할 의무가 있다. Ox 244 제5편 법인세법","a":"X","e":"「민법」 제32조에 따라 설립된 법인은 비영리내국법인을 말하며, 해당 법인은 수익사업(사업 또는 수입에서 생기 는 소득)에 대해서만 각 사업연도의 소득에 대한 법인세 를 납부할 의무가 있다.","pg":226},{"id":1200,"ch":23,"n":6,"q":"「국세기본법」상 법인으로 보는 법인 아닌 단체는 수익사업 에서 생긴 소득에 대한 법인세는 납부할 의무가 있으나 토 지등 양도소득에 대한 법인세와 청산소득에 대한 법인세는 납부할 의무가 없다.","a":"X","e":"「국세기본법」상 법인으로 보는 법인 아닌 단체는 수익사 업에서 생긴 소득과 토지 등 양도소득에 대한 법인세를 납부할 의무가 있다. ... 청산소득에 대한 납세의무를 지는 것은 영리내국법인에 국한됨 주의","pg":227},{"id":1201,"ch":23,"n":7,"q":"내국법인 중 국가와 지방자치단체(지방자치단체조합을 포 함)는 수익사업에서 생긴 소득에 대한 법인세를 납부할 의무 가 있다.","a":"X","e":"내국법인 중 국가와 지방자치단체(지방자치단체조합을 포함)는 그 소득에 대한 법인세를 납부할 의무가 없다.","pg":227},{"id":1202,"ch":23,"n":8,"q":"외국법인 중 외국의 정부·지방자치단체 및 영리를 목적으 로 하지 아니하는 법인(법인으로 보는 단체를 포함)은 그 소 득에 대한 법인세를 납부할 의무가 없다.","a":"X","e":"외국법인 중 외국의 정부·지방자치단체 및 영리를 목적 으로 하지 아니하는 법인(법인으로 보는 단체를 포함)은 비영리외국법인으로서 각 사업연도의 국내원천소득 중 수익사업에서 생기는 소득에 대한 법인세가 과세된다.","pg":227},{"id":1203,"ch":23,"n":9,"q":"토지등 양도소득에 대한 법인세는 내국영리법인과 내국비 영리법인에 한정하여 과세한다.","a":"X","e":"토지 등 양도소득에 대한 법인세는 내국법인과 외국법인. 영리법인과 비영리법인 등 모든 형태의 법인에 대해 과세 한다.","pg":227},{"id":1204,"ch":23,"n":10,"q":"비영리외국법인은 청산소득에 대한 법인세 납세의무가 없으 나 비영리내국법인은 청산소득에 대한 법인세 납세의무가 있다.","a":"X","e":"청산소득에 대한 납세의무를 지는 것은 영리내국법인에 국한되며, 비영리내국법인과 외국법인은 청산소득에 대 한 납세의무를 지지 않는다.","pg":227},{"id":1205,"ch":23,"n":11,"q":"외국법인과 「소득세법」에 따른 비거주자를 제외하고 내국법 인 및 「소득세법」에 따른 거주자는 「법인세법」에 따라 원천 징수하는 법인세를 납부할 의무가 있다.","a":"X","e":"내국법인 및 외국법인과 「소득세법」에 따른 거주자 및 비 거주자 중 「법인세법」에 따라 법인세를 원천징수하는 자 는 해당 법인세를 납부할 의무가 있다.","pg":227},{"id":1206,"ch":23,"n":12,"q":"연결법인은 각 연결사업연도의 소득에 대한 법인세(각 연 결법인의 토지 등 양도소득에 대한 법인세와 조세특례제한 법에 따른 투자• 상생협력 촉진을 위한 과세특례를 적용하 여 계산한 법인세를 포함)를 연대하여 납부할 의무가 있다.","a":"O","e":"","pg":228},{"id":1207,"ch":23,"n":13,"q":"내국법인은 각 사업연도의 소득, 청산소득, 법령에 따른 토 지등 양도소득, 미환류 소득(투자• 상생협력촉진세제)에 대 한 법인세 납세의무가 있다.","a":"X","e":"영리내국법인은 각 사업연도의 소득, 청산소득, 법령에 따른 토지 등 양도소득, 미환류 소득(투자. 상생협력촉진 세제)에 대한 법인세 납세의무가 있다. 비교 비영리내국법인은 국내외 원천소득 중 일정한 수익사업에서 생 기는 소득, 법령에 따른 토지 등 양도소득에 대한 법인세 납세의무가 있음","pg":228},{"id":1208,"ch":23,"n":14,"q":"신탁재산에 귀속되는 소득에 대해서는 그 신탁의 수탁자가 그 신탁재산을 가진 것으로 보아 수탁자에게 과세하는 것을 원칙으로 한다.","a":"X","e":"신탁재산에 귀속되는 소득에 대해서는 그 신탁의 이익을 받을 수익자가 그 신탁재산을 가진 것으로 보아 수익자에 게 과세하는 것을 원칙으로 한다. 444 ・다만 수익자가 특별히 정 해지지 않거나 존재하지 않는 신탁 또는 위탁자가 신탁재산을 실질적 으로 통제하는 신탁의 경우 신탁재산에 귀속되는 소득은 위탁자에 게 귀속되는 것으로 보고 위탁자를 소득세 납세의무자로 함 주의","pg":228},{"id":1209,"ch":23,"n":15,"q":"「신탁법」에 따른 수익증권발행신탁으로서 법령으로 정하는 요건을 충족하는 신탁(「자본시장과 금융투자업에 관한 법 률」에 따른 투자신탁 및 「소득세법」에 따른 비금전신탁 수 익증권이 발행된 신탁은 제외)의 경우에는 신탁재산에 귀속 되는 소득에 대하여 그 신탁의 수탁자(내국법인 또는 거주자 인 경우에 한정)가 법인세를 납부할 수 있다.","a":"X","e":"「신탁법」에 따른 수익증권발행신탁으로서 법령으로 정하 는 요건을 충족하는 신탁(「자본시장과 금융투자업에 관한 법률」에 따른 투자신탁 및 「소득세법」에 따른 비금전 신탁 수익증권이 발행된 신탁은 제외)의 경우에는 신탁재산에 귀속되는 소득에 대하여 그 신탁의 수탁자(내국법인 또는 거주자인 경우에 한정)가 법인세를 납부할 의무가 있다. 444·납부할 수 있다' -> '납부할 의무가 있다'로 개정되었으니 꼭 챙겨 가자","pg":228},{"id":1210,"ch":23,"n":16,"q":"위탁자가 신탁재산을 실질적으로 통제하는 등 법령으로 정 하는 요건을 충족하는 신탁의 경우에는 신탁재산에 귀속되 는 소득에 대하여 그 신탁의 위탁자가 법인세를 납부할 의 무가 있다.","a":"O","e":"","pg":228},{"id":1211,"ch":23,"n":17,"q":"「법인세법」상 「자본시장과 금융투자업에 관한 법률」의 적용 을 받는 법인의 신탁재산(같은 법 제251조 제1항에 따른 보 험회사의 특별계정은 제외)에 귀속되는 수입과 지출은 그 법 인에 귀속되는 수입과 지출로 보지 아니한다.","a":"O","e":"","pg":229},{"id":1212,"ch":23,"n":18,"q":"위탁자가 신탁을 해지할 수 있는 권리를 보유하는 신탁의 경우에는 신탁재산에 귀속되는 소득에 대하여 그 신탁의 수 익자가 법인세를 납부할 의무가 있다.","a":"X","e":"위탁자가 신탁을 해지할 수 있는 권리를 보유하는 신탁의 경우에는 신탁재산에 귀속되는 소득에 대하여 그 신탁의 위탁자가 법인세를 납부할 의무가 있다.","pg":229},{"id":1213,"ch":23,"n":19,"q":"법인과세 신탁재산이 수익자에게 배당한 경우(수익자에 대 하여 배당에 대한 소득세 또는 법인세가 비과세되는 경우임) 에는 그 금액을 해당 배당을 결의한 잉여금 처분의 대상이 되는 사업연도의 소득금액에서 공제한다.","a":"X","e":"신탁재산이 수익자에게 배당한 경우에 그 금액을 배당을 결의한 잉여금 처분의 대상이 되는 사업연도의 소득금액 에서 공제한다. 그러나 배당을 받은 법인과세 신탁재산의 수익자에 대하여 법에 따라 배당에 대한 소득세 또는 법 인세가 비과세되는 경우에는 그 금액을 해당 배당을 결의 한 잉여금 처분의 대상이 되는 사업연도의 소득금액에서 공제하지 아니한다.","pg":229},{"id":1214,"ch":23,"n":20,"q":"법인의 사업연도는 법령 또는 법인의 정관 등에서 정하는 1 회계기간으로 하되, 그 기간은 1년을 초과하지 못한다.","a":"O","e":"","pg":229},{"id":1215,"ch":23,"n":21,"q":"법령이나 법인의 정관 등에 사업연도에 관한 규정이 없는 내국법인은 예외 없이 매년 1월 1일부터 12월 31일까지를 그 법인의 사업연도로 한다.","a":"X","e":"법령이나 법인의 정관 등에 사업연도에 관한 규정이 없는 내국법인은 따로 사업연도를 정하여 법인 설립신고(설립 등기일 사업의 실질적 관리장소를 두게 된 날 또는 법인 과세 신탁재산의 경우에는 설립일부터 2개월 이내) 또는 사업자등록(사업개시일부터 20일 이내)과 함께 납세지 관할 세무서장에게 사업연도를 신고해야 한다. 사업연도 를 신고해야 할 법인이 그 신고를 하지 않는 경우에 매년 1월 1일부터 12월 31일까지를 그 법인의 사업연도로 한 다.","pg":229},{"id":1216,"ch":23,"n":22,"q":"사업연도 신고를 하여야 할 법인이 그 신고를 하지 아니하 는 경우에는 매년 1월 1일부터 12월 31일까지를 그 법인의 사업연도로 한다.","a":"O","e":"","pg":230},{"id":1217,"ch":23,"n":23,"q":"국내 사업장이 있는 외국법인으로서 법령이나 정관 등에 사 업연도에 관한 규정이 없는 법인은 소득이 최초로 발생하게 된 날부터 1개월 이내에 납세지 관할 세무서장에게 사업연 도를 신고해야 한다.","a":"X","e":"국내 사업장이 있는 외국법인으로서 법령이나 정관 등에 사업연도에 관한 규정이 없는 법인은 따로 사업연도를 징 하여 국내사업장 설치신고(국내사업장을 가지게 된 날부 더 2월 이내) 또는 사업자등록과 함께 납세지 관할 세무 서장에게 사업연도를 신고해야 한다. 비교 국내사업장이 없는 외국법인으로서 국내원천부동산 소득 또는 자산·권리양도소득이 있는 법인은 따로 사업연도를 정하여 그 소득이 최초로 발생하게 된 날부터 1개월 이내에 납세지 관할 세무서장에게 사업연도를 신고해야 함","pg":230},{"id":1218,"ch":23,"n":24,"q":"내국법인(법인으로 보는 법인 아닌 단체를 제외함)의 최초 사업연도개시일은 설립등기일로 한다.","a":"O","e":"","pg":230},{"id":1219,"ch":23,"n":25,"q":"신설법인 설립일 이전에 손익이 발생한 경우에는 최초 사업 연도의 기간이 1년을 초과하는 경우에도 손익이 최초로 발 생한 날부터 사업연도 종료일까지를 신설법인의 최초사업연 도로 한다.","a":"X","e":"최초 사업연도의 개시일 전에 생긴 손익을 사실상 그 법 인에 귀속시킨 것이 있는 경우, 조세포탈의 우려가 없을 때에는 최초 사업연도의 기간이 1년을 초과하지 않는 범 위 내에서 이를 해당 법인의 최초 사업연도의 손익에 산 입할 수 있다. 이 경우 최초 사업연도의 개시일은 해당 법 인에 귀속시킨 손익이 최초로 발생한 날로 한다.","pg":230},{"id":1220,"ch":23,"n":26,"q":"사업연도를 변경하려는 법인은 그 법인의 직전 사업연도 종 료일 3개월 이전까지 법으로 정하는 바에 따라 납세지 관할 세무서장에게 신고해야 한다.","a":"X","e":"사업연도를 변경하려는 법인은 그 법인의 직전 사업연도 종료일부터 3개월 이내에 법으로 정하는 바에 따라 납세 지 관할 세무서장에게 신고해 안나","pg":230},{"id":1221,"ch":23,"n":27,"q":"법령에 따라 사업연도가 정하여지는 법인의 경우 관련 법령 의 개정에 따라 사업연도가 변경된 경우에는 사업연도 변경 신고를 하지 아니한 경우에도 그 법령의 개정 내용과 같이 사업연도가 변경된 것으로 본다.","a":"O","e":"","pg":231},{"id":1222,"ch":23,"n":28,"q":"종전의 사업연도 개시일부터 변경된 사업연도 개시일 전 날까지의 기간을 1사업연도로 한다. 다만, 그 기간이 1개월 미만인 경우에는 변경 전 사업연도에 그 기간을 포함한다.","a":"X","e":"종전의 사업연도 개시일부터 변경된 사업연도 개시일 전 날까지의 기간을 1사업연도로 한다. 다만, 그 기간이 1개 월 미만인 경우에는 변경된 사업연도에 그 기간을 포함한 다.","pg":231},{"id":1223,"ch":23,"n":29,"q":"신설법인의 경우 최초 사업연도가 경과하기 전까지 사업연 도 변경신고를 하면 사업연도를 변경할 수 있다.","a":"X","e":"신설법인의 경우에는 최초 사업연도가 경과하기 전에는 사업연도를 변경할 수 없다.","pg":231},{"id":1224,"ch":23,"n":30,"q":"사업연도를 변경하고자 하는 법인이 신고기한이 경과한 후 에 변경 신고를 한 경우에는 변경신고가 없는 것으로 본다.","a":"X","e":"사업연도를 변경하고자 하는 법인이 신고기한이 경과한 후에 변경 신고를 한 경우에는 변경신고한 해당 사업연도 는 변경되지 아니하나 그 다음 사업연도부터는 사업연도 가 변경된다.","pg":231},{"id":1225,"ch":23,"n":31,"q":"내국법인이 사업연도 중에 파산으로 인하여 해산한 경우에 는 그 사업연도 개시일부터 파산등기일까지의 기간과 파산 등기일의 다음 날부터 그 사업연도 종료일까지의 기간을 각 각 1사업연도로 본다.","a":"O","e":"","pg":231},{"id":1226,"ch":23,"n":32,"q":"청산 중에 있는 내국법인의 잔여재산의 가액이 사업연도 중 에 확정된 경우에는 그 사업연도 개시일부터 잔여재산의 가 액이 확정된 날의 전날까지의 기간을 1사업연도로 본다.","a":"X","e":"청산 중에 있는 내국법인의 잔여재산의 가액이 사업연도 중에 확정된 경우에는 그 사업연도 개시일부터 잔여재산 의 가액이 확정된 날까지의 기간을 1사업연도로 본다.","pg":231},{"id":1227,"ch":23,"n":33,"q":"사업연도기간 중에 합병·분할에 의하여 해산한 법인의 사 업연도는 그 사업연도 개시일부터 합병등기일 또는 분할등 기일 전날까지의 기간을 1사업연도로 본다.","a":"X","e":"사업연도기간 중에 합병·분할에 의하여 해산한 법인의 사업연도는 그 사업연도 개시일부터 합병등기일 또는 분 한동기일까지의 기간을 1사업연도로 본다.","pg":232},{"id":1228,"ch":23,"n":34,"q":"내국법인이 사업연도 중에 「상법」 및 기타 법령에 따른 조직 변경을 한 경우에는 조직변경 전의 사업연도가 계속되는 것 으로 본다.","a":"O","e":"","pg":232},{"id":1229,"ch":23,"n":35,"q":"내국법인이 사업연도 중에 연결납세방식을 적용받는 경우에 는 그 사업연도 개시일부터 연결사업연도 개시일까지의 기 간을 1사업연도로 본다.","a":"X","e":"내국법인이 사업연도 중에 연결납세방식을 적용받는 경 우에는 그 사업연도 개시일부터 연결사업연도 개시일 전 날까지의 기간을 1사업연도로 본다.","pg":232},{"id":1230,"ch":23,"n":36,"q":"국내사업장이 있는 외국법인이 사업연도 중에 그 국내사업 장을 가지지 아니하게 된 경우에는 그 사업연도 개시일부터 그 사업장을 가지지 아니하게 된 날의 전날까지의 기간을 1 사업연도로 본다.","a":"X","e":"국내사업장이 있는 외국법인이 사업연도 중에 그 국내사 업장을 가지지 아니하게 된 경우에는 그 사업연도 개시일 부터 그 사업장을 가지지 아니하게 된 날까지의 기간을 1 사업연도로 본다.","pg":232},{"id":1231,"ch":23,"n":37,"q":"내국법인의 법인세 납세지는 등기부상 본점 또는 주사무 소 소재지로 하고 국내에 본점. 주사무소가 있지 않는 경 우에는 사업을 실질적으로 관리하는 장소의 소재지로 한다.","a":"O","e":"","pg":232},{"id":1232,"ch":23,"n":38,"q":"외국법인의 법인세 납세지는 국내사업장의 소재지로 하고 국내사업장이 없는 외국법인으로서 부동산소득 또는 자산· 권리양도소득이 있는 외국법인의 경우에는 그 대표의 거류 지 또는 체류지로 한다.","a":"X","e":"외국법인의 법인세 납세지는 국내사업장의 소재지로 하 고 국내사업장이 없는 외국법인으로서 부동산소득 또는 자산·권리양도 소득이 있는 외국법인의 경우에는 각각 그 자산의 소재지로 한다.","pg":232},{"id":1233,"ch":23,"n":39,"q":"둘 이상의 국내사업장이 있는 외국법인의 납세지는 납세자 가 신고한 장소를 납세지로 한다.","a":"X","e":"둘 이상의 국내사업장이 있는 외국법인의 납세지는 주된 사업장(직전 사업연도의 사업수입금액이 가장 많은 국내 사업장의 소재지)로 한다.","pg":233},{"id":1234,"ch":23,"n":40,"q":"법인으로 보는 단체의 납세지는 해당 단체가 신고하는 장소 로 하고 신고가 없는 경우에는 관할 세무서장이 정하는 장 소로 한다.","a":"X","e":"법인으로 보는 단체의 납세지는 해당 단체의 사업장 소재 지로 하되 주된 소득이 부동산임대소득인 단체의 경우에 는 그 부동산의 소재지로 한다.","pg":233},{"id":1235,"ch":23,"n":41,"q":"법인세에 대한 원천징수의무자가 거주자인 경우 원천징수한 법인세의 납세지는 사업장의 유무에 상관없이 당해 거주자 의 주소지 또는 거소지로 한다.","a":"X","e":"법인세에 대한 원천징수의무자가 거주자인 경우 원천징 수한 법인세의 납세지는 그 거주자의 주된 사업장 소재지 로 한다. 다만, 주된 사업장 외의 사업장에서 원천징수를 하는 경우에는 그 사업장의 소재지, 사업장이 없는 경우 에는 그 거주자의 주소지 또는 거소지로 한다.","pg":233},{"id":1236,"ch":23,"n":42,"q":"법인과세 신탁재산의 법인세 납세지는 신탁재산의 소재지를 납세지로 한다.","a":"X","e":"법인과세 신탁재산의 법인세 납세지는 그 법인과세 수탁 자의 납세지로 한다.","pg":233},{"id":1237,"ch":23,"n":43,"q":"내국법인의 본점 등의 소재지가 등기된 주소와 동일하지 아 니한 경우에는 관할 세무서장은 그 납세지를 지정할 수 있 다.","a":"X","e":"내국법인의 본점 등의 소재지가 등기된 주소와 동일하지 아니한 경우에는 관할 지방국세청장(새로이 지정될 납세 지가 그 관할을 달리하는 경우에는 국세청장)은 그 납세 지를 지정할 수 있다.","pg":233},{"id":1238,"ch":23,"n":44,"q":"납세지를 지정했을 때에는 그 법인의 해당 사업연도 종료일 부터 60일 이내에 해당 법인에게 이를 알려야 하며, 기한 내 에 알리지 않은 경우에는 종전의 납세지를 그 법인의 납세 지로 한다.","a":"X","e":"납세지를 지정했을 때에는 그 법인의 해당 사업연도 종료 일부터 45일 이내에 해당 법인에게 이를 알려야 하며, 기 한 내에 알리지 않은 경우에는 종전의 납세지를 그 법인 의 납세지로 한다.","pg":233},{"id":1239,"ch":23,"n":45,"q":"법인은 납세지가 변경된 경우 변경된 날부터 3개월 이내에 변경 전의 납세지 관할 세무서장에게 이를 신고해야 한다. ○","a":"X","e":"법인은 납세지가 변경된 경우 변경된 날부터 15일 이내에 변경 후의 납세지 관할 세무서장에게 이를 신고해야 한 다.","pg":234},{"id":1240,"ch":23,"n":46,"q":"납세지가 변경된 법인이 「부가가치세법」의 규정에 의하여 그 변경된 사실을 신고한 경우에도 「법인세법」의 규정에 의 한 변경신고를 하여야 한다. OX 252 제5편 법인세법","a":"X","e":"납세지가 변경된 법인이 「부가가치세법」의 규정에 의하여 그 변경된 사실을 신고한 경우에는 납세지 변경신고를 한 것으로 본다.","pg":234},{"id":1241,"ch":24,"n":1,"q":"대손충당금은 결산조정사항이지만 일시상각충당금은 신고 조정사항이다.","a":"X","e":"대손충당금 및 일시상각충당금은 결산조정사항이지만 일 시상각충당금은 결산서에 계상하지 않더라도 신고조정으 로 손금산입할 수 있다.","pg":235},{"id":1242,"ch":24,"n":2,"q":"퇴직연금충당금은 결산조정사항이지만 퇴직급여충당금은 신고조정사항이다.","a":"X","e":"퇴직급여충당금은 결산조정사항이지만 퇴직연금충당금 은 신고조정사항이다.","pg":235},{"id":1243,"ch":24,"n":3,"q":"천재지변 등으로 인하여 파손 또는 멸실된 유형자산의 감액 손실과 파손·부패된 재고자산의 감액손실은 신고조정사항 이다.","a":"X","e":"천재지변 등으로 인하여 파손 또는 멸실된 유형자산의 감 액손실과 파손·부패된 재고자산의 감액손실은 결산조정 사항이다.","pg":235},{"id":1244,"ch":24,"n":4,"q":"익금항목은 모두 신고조정사항이다.","a":"O","e":"","pg":235},{"id":1245,"ch":24,"n":5,"q":"감가상각비의 손금산입은 모두 결산조정사항이다. 0:X","a":"X","e":"감가상각비를 신고조정하는 경우도 있다.","pg":235},{"id":1246,"ch":24,"n":6,"q":"「조세특례제한법」상 준비금은 결산조정사항이며 신고조정이 허용되지 않는다.","a":"X","e":"「조세특례제한법」상 준비금은 결산조정사항이나 잉여금 처분에 의한 신고조정도 허용된다.","pg":235},{"id":1247,"ch":24,"n":7,"q":"고유목적사업준비금은 결산조정사항이며 신고조정이 허용 되지 않는다.","a":"X","e":"고유목적사업준비금은 결산조정사항이나 회계감사 대상 비영리법인의 경우 잉여금처분에 의한 신고조정도 허용 된다.","pg":235},{"id":1248,"ch":24,"n":8,"q":"결산조정사항은 법인이 임의로 귀속시기를 조정할 수 없고, 신고조정사항은 법인의 선택에 따라 귀속시기를 조정할 수 있다.","a":"X","e":"결산조정사항은 법인의 선택에 따라 귀속시기를 조정할 수 있고, 신고조정사항은 법인이 임의로 귀속시기를 조절 할 수 없다.","pg":236},{"id":1249,"ch":24,"n":9,"q":"소득처분은 영리내국법인에 대해서만 적용되며, 비영리법인 이나 외국법인에게는 적용되지 아니한다.","a":"X","e":"소득처분은 영리법인뿐만 아니라 법인세를 납부할 의무 가 있는 비영리내국법인과 비영리외국법인에 대해서도 소득처분에 대한 규정을 적용한다.","pg":236},{"id":1250,"ch":24,"n":10,"q":"사외유출이란 손금산입 익금불산입한 금액에 대한 소득처 분으로 그 금액이 법인 외부로 유출된 것이 명백한 경우 유 출된 소득의 귀속자에 대하여 관련되는 소득세를 징수하기 위하여 행한다.","a":"X","e":"사외유출이란 익금산입 · . 손금불산입한 금액에 대한 소득 처분으로 그 금액이 법인 외부로 유출된 것이 명백한 경 우 유출된 소득의 귀속자에 대하여 관련되는 소득세를 징 수하기 위하여 행한다.","pg":236},{"id":1251,"ch":24,"n":11,"q":"익금에 산입한 금액의 귀속자가 임원인 경우에는 그 귀속자 에 대한 배당으로 처분한다.","a":"X","e":"익금에 산입한 금액의 귀속자가 임원인 경우에는 그 귀속 자에 대한 상여로 처분한다.","pg":236},{"id":1252,"ch":24,"n":12,"q":"세무조정으로 증가된 소득의 귀속자가 국가·지방자치단체 인 경우 기타사외유출로 소득처분하고 그 귀속자에 대하여 「소득세법」에 따른 기타소득으로 과세한다.","a":"X","e":"세무조정으로 증가된 소득의 귀속자가 국가·지방자치단 체인 경우 기타사외유출로 소득처분하고 그 귀속자에 대 하여 소득세를 과세하지 않는다.","pg":236},{"id":1253,"ch":24,"n":13,"q":"익금에 산입한 금액이 사외에 유출된 것이 분명한 경우에 그 귀속자가 법인이거나 사업을 영위하는 개인인 경우(다만, 각 사업연도소득이나 사업소득을 구성하는 경우에 한함)에 는 기타소득으로 처분한다.","a":"X","e":"익금에 산입한 금액이 사외에 유출된 것이 분명한 경우에 그 귀속자가 법인이거나 사업을 영위하는 개인인 경우(다 만, 각 사업연도소득이나 사업소득을 구성하는 경우에 한 함)에는 기타사외유출로 처분한다.","pg":236},{"id":1254,"ch":24,"n":14,"q":"익금산입한 금액의 귀속자가 법인의 출자임원인 경우에는 그 귀속자에 대한 배당으로 소득처분한다. 254 제5편 법인세법","a":"X","e":"익금산입한 금액의 귀속자가 법인의 출자임원인 경우에 는 그 귀속자에 대한 상여로 소득처분한다.","pg":236},{"id":1255,"ch":24,"n":15,"q":"익금산입한 금액의 귀속자가 법인주주인 경우에는 그 귀속 자에 대한 배당으로 소득처분하고 그 귀속자가 주주이면서 직원인 경우에는 그 귀속자에 대한 상여로 소득처분한다.","a":"X","e":"익금산입한 금액의 귀속자가 법인주주인 경우에는 기타 사외유출로 소득처분하고 그 귀속자가 주주이면서 직원 인 경우에는 그 귀속자에 대한 상여로 소득처분한다.","pg":237},{"id":1256,"ch":24,"n":16,"q":"익금에 산입한 금액 중 사외로 유출된 것이 분명하나 그 처 분이 배당, 상여, 기타사외유출에 해당하지 않는 경우 기타 소득으로 처분한다.","a":"O","e":"","pg":237},{"id":1257,"ch":24,"n":17,"q":"익금에 산입한 금액이 사외유출되었으나 그 귀속자를 확인 할 수 없는 경우 기타사외유출로 처분한다.","a":"X","e":"익금에 산입한 금액이 사외유출되었으나 그 귀속자를 확 인할 수 없는 경우 해당 법인의 대표자에게 귀속된 것으 로 보아 대표자에 대한 상여로 처분한다.","pg":237},{"id":1258,"ch":24,"n":18,"q":"대표자가 2명 이상인 법인에서 익금에 산입한 금액이 사외 에 유출되고 귀속이 불분명한 경우에는 사실상의 대표자에 게 귀속된 것으로 본다.","a":"O","e":"","pg":237},{"id":1259,"ch":24,"n":19,"q":"세무조사가 착수된 것을 알게 된 경우로서 경정이 있을 것 을 미리 알고 내국법인이 「국세기본법」 제45조의 수정신고 기한 내에 매출누락, 가공경비 등 부당하게 사외유출된 금액 을 회수하고 세무조정으로 익금에 산입하여 신고하는 경우 의 소득처분은 사내유보로 한다.","a":"X","e":"내국법인이 수정신고기한 내에 매출누락, 가공경비 등 부 당하게 사외유출된 금액을 회수하고 세무조정으로 익금 에 산입하여 신고하는 경우의 소득처분은 사내유보로 한 다. 다만, 세무조사가 착수된 것을 알게 된 경우로서 경정 이 있을 것을 미리 알고 사외유출된 금액을 익금산입하는 다음의 경우에는 그러하지 아니한다.","pg":237},{"id":1260,"ch":24,"n":20,"q":"납세지 관할세무서장으로부터 과세자료 해명통지를 받은 경우로서 경정이 있을 것을 미리 알고 내국법인이 「국세기 본법」 제45조의 수정신고기한 내에 매출누락, 가공경비 등 부당하게 사외유출된 금액을 회수하고 세무조정으로 익금 에 산입하여 신고하는 경우의 소득처분은 사내유보로 한다.","a":"X","e":"내국법인이 수정신고기한 내에 매출누락, 가공경비 등 부 당하게 사외유출된 금액을 회수하고 세무조정으로 익금을 에 산입하여 신고하는 경우의 소득처분은 사내유보로 한 다. 납세지 관할세무서장으로부터 과세자료 해명통지를 받은 경우로서 경정이 있을 것을 미리 알고 사외유출된 금액을 익금산입하는 다음의 경우에는 그러하지 아니한다.","pg":237},{"id":1261,"ch":24,"n":21,"q":"장부나 그 밖의 증빙서류가 없어 추계에 의해 과세표준을 결정하는 경우 결정된 과세표준과 결산서상 법인세비용차 감전순이익 차액은 무조건 대표자에 대한 상여로 처분한다.","a":"X","e":"추계에 의해 결정된 과세표준과 결산서상 법인세비용차 감전순이익 차액은 대표자에 대한 상여로 처분한다. 다 만, 천재시민이나 그 밖의 불가항력으로 장부나 그 밖의 증빙서류가 밀실되어 추계결정하는 경우에는 기타사외유 출로 분한다.","pg":238},{"id":1262,"ch":24,"n":22,"q":"특례기부금의 손금산입한도액을 초과하여 익금에 산입한 금 액은 기타로 처분한다.","a":"X","e":"특례기부금의 손금산입한도액을 초과하여 익금에 산입한 금액은 기타사외유출로 처분한다.","pg":238},{"id":1263,"ch":24,"n":23,"q":"채권자 불분명 사채이자는 전액 대표자에 대한 상여로 처분 한다.","a":"X","e":"채권자 불분명 사채이자는 대표자에 대한 상여로 처분하 되 채권자 불분명 사채이자 중 원천징수세액에 상당하는 금액은 기타사외유출로 소득처분한다.","pg":238},{"id":1264,"ch":24,"n":24,"q":"사외유출된 금액의 귀속이 불분명하여 대표자에 대한 상여 로 처분을 한 경우 해당 법인이 그 처분금액에 대한 소득세 등을 대납하고 이를 손비로 계상한 경우에는 이를 상여로 처분한다.","a":"X","e":"사외유출된 금액의 귀속이 불분명하여 대표자에 대한 상 여로 처분을 한 경우 해당 법인이 그 처분금액에 대한 소 득세 등을 대납하고 이를 손비로 계상한 경우에는 이를 기타사외유출로 처분한다.","pg":238},{"id":1265,"ch":24,"n":25,"q":"외국법인의 국내사업장의 각사업연도의 소득에 대한 법인세 의 과세표준을 신고하거나 결정 또는 경정함에 있어서 익금 에 산입한 금액이 그 외국법인 등에 귀속되는 소득은 유보 로 처분한다.","a":"X","e":"외국법인의 국내사업장의 각사업연도의 소득에 대한 법 인세의 과세표준을 신고하거나 결정 또는 경정함에 있어 서 익금에 산입한 금액이 그 외국법인 등에 귀속되는 소 득은 기타사외유출로 처분한다.","pg":238},{"id":1266,"ch":24,"n":26,"q":"추계로 과세표준을 결정. 경정할 때 대표자에 대한 상여로 처분을 한 경우 해당 법인이 그 처분금액에 대한 소득세 등 을 대납하고 그 대표자와의 특수관계가 소멸될 때까지 회수 하지 않음에 따라 익금산입한 금액은 기타사외유출로 처분 한다.","a":"O","e":"","pg":238},{"id":1267,"ch":24,"n":27,"q":"불공정자본거래로 인한 부당행위계산의 부인규정에 따라 익 금에 산입한 금액으로서 귀속자에게 「상속세 및 증여세법」 에 따라 증여세가 과세되는 금액은 그 귀속자의 배당소득으 로 처분한다.","a":"X","e":"불공정자본거래로 인한 부당행위계산의 부인규정에 따라 익금에 산입한 금액으로서 귀속자에게 「상속세 및 증여세 법」에 따라 증여세가 과세되는 금액은 기타사외유출로 소 득처분한다.","pg":239},{"id":1268,"ch":24,"n":28,"q":"사외유출 중 배당, 상여, 기타소득, 기타사외유출로 소득처 분을 한 경우에는 해당 법인은 각 소득의 귀속자에 대한 원 천징수를 하여야 한다.","a":"X","e":"사외유출 중 배당. 상여, 기타소득으로 소득처분을 한 경 우에는 해당 법인은 각 소득의 귀속자에 대한 원천징수를 하여야 한다.","pg":239},{"id":1269,"ch":24,"n":29,"q":"익금에 산입한 금액이 사외에 유출되지 아니한 경우에는 사 내유보 또는 기타소득으로 처분한다.","a":"X","e":"익금에 산입한 금액이 사외에 유출되지 아니한 경우에는 사내유보 또는 기타로 처분한다.","pg":239},{"id":1270,"ch":24,"n":30,"q":"당기에 유보로 소득처분된 세무조정사항이 발생하게 되면 당기 이후 추인될 때까지 이를 자본금과적립금조정명세서 (을)에 사후관리하여야 한다.","a":"O","e":"","pg":239},{"id":1271,"ch":24,"n":31,"q":"손금산입 .익금불산입으로 세무조정한 금액 중 △유보가 아 닌 것은 기타로 소득처분하며 이는 소멸시점까지 사후관리 를 해야 한다.","a":"X","e":"손금산입 · 익금불산입으로 세무조정한 금액 중 유보가 아닌 것은 기타로 소득처분하며 별도로 사후관리하지 아 니한다.","pg":239},{"id":1272,"ch":24,"n":32,"q":"특례기부금. 우리사주조합기부금 · . 일반기부금 한도 초과액 은 사내유보로 처분한다.","a":"X","e":"특례기부금. 우리사주조합기부금 · 일반기부금 한도 초 과액은 기타사외유출로 소득처분한다.","pg":239},{"id":1273,"ch":24,"n":33,"q":"업무용승용차 임차료 중 감가상각비 상당액 한도초과액과 기업업무추진비 한도초과액의 세무조정 사항은 자본금과적 립금조정명세서(을)에 사후관리하여야 한다.","a":"X","e":"자본금과적립금조정명세서(을)은 유보(△유보)를 소멸시 점까지 사후관리하기 위한 명세서이다. 업무용 승용차 임 차료 중 감가상각비 상당액 한도초과액과 기업업무추진 비 한도초과액의 세무조정 사항은 기타사외유출이므로 자본금과적립금조정명세서(을)에 반영하지 아니한다.","pg":239},{"id":1274,"ch":25,"n":1,"q":"익금은 자본 또는 출자의 납입을 제외하고 해당 법인의 순 자산을 증가시키는 모든 거래로 인하여 발생하는 이익 또는 수입의 금액으로 한다.","a":"X","e":"익금은 자본 또는 출자의 납입 및 「법인세법」상 익금불신 위 항목으로 규정한 것은 제외하고 해당 법인의 순자산을 증가시키는 거래로 인하여 발생하는 이익 또는 수입의 금 액으로 한다.","pg":240},{"id":1275,"ch":25,"n":2,"q":"법인의 사업수입금액은 익금에 산입하되 기업회계기준에 따 른 매출에누리 매출환입 매출할인은 산입하지 아니한다.","a":"O","e":"","pg":240},{"id":1276,"ch":25,"n":3,"q":"자산의 양도금액은 익금에 해당하며 그 양도한 자산의 양도 당시의 장부가액은 손금으로 인정된다.","a":"O","e":"","pg":240},{"id":1277,"ch":25,"n":4,"q":"자기주식(합병법인이 합병에 따라 피합병법인이 보유하던 합병법인의 주식을 취득하게 된 경우를 제외)의 양도금액은 익금에 포함한다.","a":"X","e":"자기주식(합병법인이 합병에 따라 피합병법인이 보유하 던 합병법인의 주식을 취득하게 된 경우를 포함)의 양도 금액은 익금에 포함한다.","pg":240},{"id":1278,"ch":25,"n":5,"q":"자기주식처분이익은 익금에 해당하지 아니하지만, 자기주식 소각이익은 익금에 해당한다. ○","a":"X","e":"자기주식처분이익은 익금에 해당하지만, 자기주식소각이 익은 익금에 해당하지 아니한다.","pg":240},{"id":1279,"ch":25,"n":6,"q":"「보험업법」이나 그 밖의 법률에 따른 유형자산 및 무형자산 등의 평가로 인한 평가이익은 익금으로 평가손실은 손금으 로 인정된다.","a":"X","e":"「보험업법」이나 그 밖의 법률에 따른 유형자산 및 무형자 산 등의 평가로 인한 평가이익은 익금으로 인정된다. \"법률에 따른 평가증안 인정되고 평가손실은 인정되지 않음 주의","pg":240},{"id":1280,"ch":25,"n":7,"q":"산 자 을 증 수 나 거 받 무 채 를 제 면 음 받 써 로 으 인 법 의 산 자 순 이 가 증 는 하 산 자 증 수 익 이 과 무 채 제 면 익 이 을 월 이 금 손 결 보 전 에 당 충 할 경 이 를 금 익 로 으 정 인 다 한 . OX 우","a":"X","e":"산 자 을 증 수 나 거 받 무 채 를 제 면 음 받 써 로 으 인 법 의 자 순 이 산 가 증 는 하 산 자 증 수 익 이 과 무 채 제 면 익 이 은 적 칙 원 으 로 금 익 에 당 해 다 한 . 나 러 그 를 이 월 이 금 손 결 전 보 에 충 할 당 적 목 로 으 증 수 . 제 면 은 받 우 경 면 라 금 익 불 입 산 한 다 .","pg":241},{"id":1281,"ch":25,"n":8,"q":"정 공 불 본 자 래 거 로 인하여 여 분 은 받 익 이 은 수 특 인 계 관 여 부 와 계 관 이 없 금 익 로 으 다 본 .","a":"O","e":"정 공 불 본 자 래 거 로 여 하 인 수 특 인 계 관 터 부 로 으 여 분 은 받 익 이 은 금 익 로 으 다 본 . 즉 , 정 공 불 본 자 래 거 로 여 하 인 특 수 인 계 관 의 외 자 터 부 로 여 분 은 받 익 이 은 금 익 로 으 지 보 다 한 니 아 .","pg":241},{"id":1282,"ch":25,"n":9,"q":"기 전 에 용 비 상 계 ( 는 또 출 지 ) 시 금 손 로 으 정 인 된 액 금 이 환 입 어 되 잡 익 이 로 으 리 처 된 경 우 금 익 불 입 산 로 으 무 세 정 조 한 다 . OX 10 인 법 이 「 인 법 법 세 」 상 수 특 인 계 관 인 인 법 터 부 로 으 가 유 권 증 을 가 시 다 보 낮 액 가 로 으 입 매 는 하 경우 가 시 와 입 매 액 가 의 액 차 을 금 은 익 에 입 산 ( 보 유 ) 며 하 , 금 익 에 입 산 한 액 금 을 취 득 가 원 에 입 산 다 한 .","a":"X","e":"기 전 에 용 비 상 계 ( 는 또 출 지 시 금 손 로 으 정 인 된 액 금 이 입 환 는 되 우 경 에 그 액 금 은 금 익 에 당 해 데 는 하 를 이 이 익 으로 리 처 면 다 했 무 세 정 조 은 다 없 . 0 1 × 출 제 - - - - | LL I NN K I K 오 다 진 p . 3 6 1 범 세 2 6 0 . p 2 - 인 법 이 「 인 법 법 세 」상 수 특 인 계 관 인 인 개 터 부 로 으 가 유 증 권 을 가 시 다 보 낮 은 액 가 로 으 입 매 는 하 경 우 가 시 와 매 입 액 가 의 액 차 을 금 익 에 입 산 ( 보 유 ) 며 하 , 금 익 에 입 산 한 금 액 을 득 취 가 원 에 입 산 다 한 . 수' 특 인 계 관 인 인 법 ' & ' 수 특 인 계 관 이 아 닌 인 개 터 부 로 으 ' 는 정 함 . 이므로 의 주 !","pg":241},{"id":1283,"ch":25,"n":11,"q":"법 국 내 인 의 각 업 사 도 연 의 득 소 액 금 에 국 외 사 회 자 터 부 로 받 은 입 수 당 배 액 금 이 함 포 어 되 있 는 경 우 그 국 외 사 회 자 의 소 득 에 대하여 과 부 된 국 외 인 법 액 세 중 해당 입 수 당 배 액 금 에 응 대 는 하 것 으로서 「 인 법 법 세 」 에 따 라 액 세 제 공 의 상 대 이 되 는 액 금 은 금 익 로 으 다 본 .","a":"O","e":"입 산 2","pg":241},{"id":1284,"ch":25,"n":12,"q":"「법인세법」에서는 추계결정 여부와 관계없이 부동산임대업 을 주업으로 하는 내국영리법인 중 차입금이 자기자본의 2 배를 초과하는 법인만 간주임대료 규정이 적용된다.","a":"X","e":"추계결정 외의 경우, 부동산임대업을 주업으로 하는 내국 영리법인 중 차입금이 자기자본의 2배를 초과하는 법인 만 간주임대료 규정이 적용되나 추계결정의 경우 모든 법 인이 간주임대료 적용 대상이다.","pg":242},{"id":1285,"ch":25,"n":13,"q":"「법인세법」상 법인은 추계결정 여부와 관계없이 주택과 그 부수토지에 대한 보증금에 대해서는 간주임대료를 계산하지 아니한다.","a":"X","e":"추계결정 외의 경우 주택임대사업의 지원목적으로 주택 과 그 부수토지를 임대하고 받은 보증금에 대해서는 간주 임대료를 계산하지 아니하지만, 추계결정의 경우에는 주 택과 그 부수토지에 대한 보증금에 대해서도 간주임대료 를 계산한다.","pg":242},{"id":1286,"ch":25,"n":14,"q":"자사의 명예훼손으로 인한 타사로부터 지급받은 손해배상금 은 「법인세법」상 익금으로 보지 않는다.","a":"X","e":"자사의 명예훼손으로 인한 타사로부터 지급받은 손해배 상금은 「법인세법」상 익금에 산입된다.","pg":242},{"id":1287,"ch":25,"n":15,"q":"액면금액 이상으로 주식을 발행한 경우 그 액면금액을 초과 한 금액은 익금으로 본다.","a":"X","e":"액면금액 이상으로 주식을 발행한 경우 그 액면금액을 초 과한 금액을 '주식발행액면초과액'이라 하는데 이는 자본 의 납입이기 때문에 익금항목이 아니다.","pg":242},{"id":1288,"ch":25,"n":16,"q":"기존 주주에게 무액면주식을 발행한 경우로서 발행가액 중 자본금으로 계상한 금액을 초과하는 금액은 익금에 산입한 다.","a":"X","e":"기존 주주에게 무액면주식을 발행한 경우로서 발행가액 중 자본금으로 계상한 금액을 초과하는 금액은 '주식발행 액면초과액'에 해당되며 이는 익금에 산입하지 아니한다.","pg":242},{"id":1289,"ch":25,"n":17,"q":"채무의 출자전환으로 주식을 발행한 경우(이월결손금 보전 에 충당하지 아니함)로서 그 주식의 발행가액이 ₩100. 시가 ₩80, 액면가액이 ₩50일 경우 익금에 산입되는 채무면제 이익은 ₩30이다. ○","a":"X","e":"채무의 출자전환으로 주식을 발행한 경우로서 그 주식 의 발행가액이 시가(시가가 액면가액에 미달하는 경우에 는 액면가액)를 초과하는 금액을 '채무면제이익'이라 하 는데 이 중 이월결손금 보전에 충당하지 아니한 금액은 익금에 산입한다. 즉, 채무면제이익은 발행가액 ₩100- MAX[₩80, W50]=₩20이다.","pg":242},{"id":1290,"ch":25,"n":18,"q":"자본감소의 경우로서 그 감소액이 주식의 소각, 주금의 반환 에 든 금액과 결손의 보전에 충당한 금액을 초과한 경우의 그 초과금액은 내국법인의 각 사업연도 소득금액을 계산할 때 익금에 산입한다.","a":"X","e":"자본감소의 경우로서 그 감소액이 주식의 소각. 주금의 반환에 든 금액과 결손의 보전에 충당한 금액을 초과한 경우의 그 초과금액은 내국법인의 각 사업연도 소득금액 을 계산할 때 익금에 산입하지 아니한다.","pg":243},{"id":1291,"ch":25,"n":19,"q":"「상법」에 따른 합병의 경우로서 소멸된 회사로부터 승계한 재산의 가액이 그 회사로부터 승계한 채무액, 그 회사의 주 주에게 지급한 금액과 합병 후 존속하는 회사의 자본금증가 액 또는 합병에 따라 설립된 회사의 자본금을 초과한 경우 의 그 초과금액은 익금에 산입한다.","a":"X","e":"「상법」에 따른 합병의 경우로서 소멸된 회사로부터 승계 한 재산의 가액이 그 회사로부터 승계한 채무액. 그 회사 의 주주에게 지급한 금액과 합병 후 존속하는 회사의 자 본금증가액 또는 합병에 따라 설립된 회사의 자본금을 초 과한 경우의 그 초과금액을 '합병차익'이라 하는데 이는 익금에 산입하지 아니한다.","pg":243},{"id":1292,"ch":25,"n":20,"q":"주식의 포괄적 교환차익은 내국법인의 각 사업연도의 소득 금액 계산에 있어서 익금에 산입한다.","a":"X","e":"주식의 포괄적 교환차익은 내국법인의 각 사업연도의 소 득금액 계산에 있어서 익금에 산입하지 아니한다. 참고 주식의 포괄적 이전차익 또한 익금불산입","pg":243},{"id":1293,"ch":25,"n":21,"q":"무상으로 받은 자산의 가액과 채무의 면제 또는 소멸로 인 한 부채의 감소액 중 법령이 정하는 이월결손금의 보전에 충당한 금액은 익금에 산입한다.","a":"X","e":"무상으로 받은 자산의 가액과 채무의 면제 또는 소멸로 인한 부채의 감소액 중 법령이 정하는 이월결손금의 보전 에 충당한 금액은 익금에 산입하지 아니한다.","pg":243},{"id":1294,"ch":25,"n":22,"q":"자산수증이익과 채무면제이익은 원칙적으로 익금에 해당하 나 발생연도의 제한이 없는 세법상의 결손금(적격합병 및 적 격분할 시 승계 받은 결손금 포함)으로서 결손금 발생 후의 각 사업연도 과세표준 계산 시 공제되지 않고 당기로 이월 된 결손금의 보전에 충당한 경우에는 익금으로 보지 않는다.","a":"X","e":"자산수증이익과 채무면제이익은 원칙적으로 익금에 해당 하나 발생연도의 제한이 없는 세법상의 결손금(적격합병 및 적격분할 시 승계 받은 결손금 제외)으로서 결손금 발 생 후의 각 사업연도 과세표준 계산 시 공제되지 않고 당 기로 이월된 결손금의 보전에 충당한 경우에는 익금으로 보지 않는다.","pg":243},{"id":1295,"ch":25,"n":23,"q":"대통령령으로 정하는 이월결손금을 보전하는 데에 충당한 무상으로 받은 자산의 가액(「법인세법」 제36조에 따른 국고 보조금 등이 아님)을 손익계산서상 수익계상한 경우, 「법인 세법」상 세무조정이 필요하지 아니하다.","a":"X","e":"대통령령으로 정하는 이월결손금을 보전하는 데에 충당 한 무상으로 받은 자산의 가액 「법인세법」 제36조에 따른 국고보조금 등이 아님)을 손익계산서상 수익계상한 경우, 익금불산입(기타)로 세무조정하여야 한다.","pg":243},{"id":1296,"ch":25,"n":24,"q":"「상법」에 따라 자본준비금을 감액하여 받는 배당(내국법인이 보유한 주식의 장부가액을 한도로 함)은 익금에 해당하지 아 니하나 자본금 전입 시 의제배당에 해당하는 자본준비금의 배당은 익금에 해당한다.","a":"O","e":"","pg":244},{"id":1297,"ch":25,"n":25,"q":"각 사업연도의 소득으로 이미 과세된 소득(「법인세법」과 다 른 법률에 따라 비과세되거나 면제되는 소득은 제외)은 내국 법인의 각 사업연도의 소득금액을 계산할 때 익금에 산입한 다.","a":"X","e":"각 사업연도의 소득으로 이미 과세된 소득(「법인세법」과 다른 법률에 따라 비과세되거나 면제되는 소득은 제외)은 내국법인의 각 사업연도의 소득금액을 계산할 때 익금에 신임 의미한다.","pg":244},{"id":1298,"ch":25,"n":26,"q":"내국영리법인의 피출자법인으로부터 받은 수입배당금액에 대하여 「법인세법」에 따른 수입배당금액의 익금불산입 규정 을 적용하는 때에는 배당금을 지급하는 법인별로 계산하는 것이며, 익금불산입액이 0보다 작은 경우에는 없는 것으로 본다.","a":"O","e":"","pg":244},{"id":1299,"ch":25,"n":27,"q":"수입배당금 익금불산입 대상 수입배당금에서 차감하는 지급 이자에는 현재가치할인차금상각비 및 연지급수입이자는 포 함하되 이미 손금불산입된 지급이자는 제외한다.","a":"X","e":"수입배당금 익금불산입 대상 수입배당금에서 차감하는 지급이자에는 현재가치할인차금상각비, 연지급수입이자 및 이미 손금불산입된 지급이자는 제외한다.","pg":244},{"id":1300,"ch":25,"n":28,"q":"배당기준일 전 3개월 이내에 취득한 주식 등을 보유함으로 써 발생하는 수입배당금액에 대해서는 수입배당금의 익금불 산입 규정을 적용하지 아니한다. ○","a":"O","e":"","pg":244},{"id":1301,"ch":25,"n":29,"q":"「자본시장과 금융투자업에 관한 법률」에 따른 투자회사가 해당 법인의 배당가능이익 중 90% 이상을 배당하고 지급한 배당에 대하여 「법인세법」에 따른 소득공제를 받은 경우, 해 당 투자회사로부터 받은 수입배당금도 수입배당금 익금불산 입 규정을 적용할 수 있다.","a":"X","e":"「법인세법」과 「조세특례제한법」에 따라 지급배당에 대한 소득공제를 적용받는 유동화전문회사·투자회사 · 투자 목적회사 등의 명목회사로부터 받은 수입배당금액에 대 해서는 수입배당금 익금불산입 규정을 적용하지 아니한 다. 해당 법인의 배당가능이익 중 90% 이상을 배당한 경우의 「자본시장과 금융투자업에 관한 법률」에 따른 투자회사는 「법인세법」에 따라 소득공제를 적용받는 투자회사에 해당 되므로 그로부터 지급받은 수입배당금액에 대해서는 수 입배당금 익금불산입 규정을 적용하지 아니한다.","pg":245},{"id":1302,"ch":25,"n":30,"q":"「법인세법」에 따라 지급한 배당에 대하여 소득공제를 적용 받는 법인과세 신탁재산으로부터 받은 수입배당금에 대해 서는 수입배당금 익금불산입 규정을 적용하지 아니한다.","a":"O","e":"","pg":245},{"id":1303,"ch":25,"n":31,"q":"「법인세법」에 따라 고유목적사업준비금을 손금에 산입하는 비영리내국법인이 받은 수입배당금에 대해서는 일반법인에 대한 수입배당금 익금불산입액의 50%를 익금불산입한다.","a":"X","e":"법에 따라 고유목적사업준비금을 손금에 산입하는 비영 리내국법인이 받은 수입배당금은 익금불산입 규정을 적 용하지 않는다.","pg":245},{"id":1304,"ch":25,"n":32,"q":"내국법인(법령에 따른 간접투자회사 등을 포함)이 해당 법 인이 출자한 외국자회사로부터 받은 수입배당금액은 각 사 업연도의 소득금액을 계산할 때 익금에 산입하지 아니한다.","a":"X","e":"내국법인(법령에 따른 간접투자회사 등은 제외)이 해당 법인이 출자한 외국자회사로부터 받은 수입배당금액은 각 사업연도의 소득금액을 계산할 때 익금에 산입하지 아 니한다.","pg":245},{"id":1305,"ch":25,"n":33,"q":"외국자회사에 대한 수입배당금액의 익금불산입 규정은 내국 법인이 직접 외국법인의 의결권 있는 발행주식총수 또는 출 자총액의 10%(「조세특례제한법」에 따른 해외자원개발사업 을 하는 외국법인의 경우에는 5%) 이상을 그 외국법인의 배 당기준일 현재 3개월 이상 계속하여 보유하고 있는 법인에 대해 적용한다.","a":"X","e":"외국자회사에 대한 수입배당금액의 익금불산입 규정은 내국법인이 직접 외국법인의 의결권 있는 발행주식총수 또는 출자총액의 10%(「조세특례제한법」에 따른 해외자원 개발사업을 하는 외국법인의 경우에는 5%) 이상을 그 외 국법인의 배당기준일 현재 6개월 이상 계속하여 보유하 고 있는 법인에 대해 적용한다.","pg":245},{"id":1306,"ch":25,"n":34,"q":"「국제조세조정에 관한 법률」에 따라 특정외국법인의 유보소 득에 대하여 내국법인이 배당받은 것으로 보는 금액에 대해 서는 각 사업연도의 소득금액을 계산할 때 익금에 산입하지 아니한다.","a":"X","e":"「국제조세조정에 관한 법률」에 따라 특정외국법인의 유보 소득에 대하여 내국법인이 배당받은 것으로 보는 금액에 대해서는 각 사업연도의 소득금액을 계산할 때 익금에 산 입힌다. 즉, 외국자회사 수입배당금액의 익금불산입 규정 을 식용하지 않는다.","pg":246},{"id":1307,"ch":25,"n":35,"q":"혼성금융상품의 거래에 따라 내국법인이 지급받는 수입배당 금액은 각 사업연도의 소득금액을 계산할 때 익금에 산입하 지 않는다.","a":"X","e":"혼성금융상품의 거래에 따라 내국법인이 지급받는 수입 배당금액은 각 사업연도의 소득금액을 계산할 때 익금에 신임한다. 즉, 외국자회사 수입배당금액의 익금불산입 규 정을 적용하지 않는다.","pg":246},{"id":1308,"ch":25,"n":36,"q":"손금에 산입하지 아니한 법인세 또는 법인지방소득세를 환 급받았거나 환급받을 금액을 다른 세액에 충당한 금액은 내 국법인의 각 사업연도의 소득금액을 계산할 때 익금에 산입 하지 아니한다.","a":"O","e":"","pg":246},{"id":1309,"ch":25,"n":37,"q":"지방세의 과오납금의 환급금에 대한 이자는 각 사업연도의 소득금액을 계산할 때 익금에 산입한다.","a":"X","e":"지방세의 과오납금의 환급금에 대한 이자는 각사업연도 의 소득금액을 계산할 때 익금에 산입하지 아니한다.","pg":246},{"id":1310,"ch":25,"n":38,"q":"전기에 과오납부한 업무에 직접 사용하는 부동산에 대한 종 합부동산세와 이에 따른 환급가산금을 당기에 환급받아 수 익계상한 경우 모두 익금불산입으로 세무조정하여야 한다.","a":"X","e":"전기에 비용계상(또는 지출) 시 손금으로 인정된 금액이 환입(환급)되는 경우에 그 금액은 익금에 해당한다. 따라 서 전기에 과오납부한 업무에 직접 사용하는 부동산에 대 한 종합부동산세를 손금에 산입하고 당기에 환급받아 수 익계상한 경우에는 별다른 세무조정이 없다. 그러나 국세 및 지방세를 과오납부하여 환급받는 경우 그 환급금에 대 한 이자는 어떤 세목이든지 익금으로 인정하지 않으므로 해당 환급가산금을 받아 수익계상한 경우에는 익금불산 입으로 세무조정하여야 한다.","pg":246},{"id":1311,"ch":25,"n":39,"q":"부가가치세의 매출세액은 내국법인의 각 사업연도의 소득금 액을 계산할 때 익금에 산입한다.","a":"X","e":"부가가치세의 매출세액은 내국법인의 각 사업연도의 소 득금액을 계산할 때 익금에 산입하지 아니한다.","pg":246},{"id":1312,"ch":26,"n":1,"q":"영리내국법인이 이미 보유하고 있던 주식에 대하여 주식배 당을 받은 경우 익금에 산입하지 아니한다.","a":"X","e":"영리내국법인이 이미 보유하고 있던 주식에 대하여 주식 배당을 받은 경우 익금에 해당한다.","pg":247},{"id":1313,"ch":26,"n":2,"q":"의제배당에 대하여는 수입배당금의 익금불산입 특례 규정이 적용되지 아니한다.","a":"X","e":"의제배당에 대하여는 수입배당금의 익금불산입 특례 규 정 적용 요건이 충족될 경우, 수입배당금의 익금불산입 세무조정을 이행해야 한다.","pg":247},{"id":1314,"ch":26,"n":3,"q":"자기주식처분이익을 자본금에 전입하는 경우 주주가 받은 무상주는 자기주식 취득시기에 따라 의제배당 여부가 결정 된다.","a":"X","e":"자기주식처분이익을 자본금에 전입하는 경우 이익잉여금 의 자본전입으로 인한 의제배당에 해당한다. 따라서 자기 주식 취득시기에 관계없이 과세한다.","pg":247},{"id":1315,"ch":26,"n":4,"q":"채무의 출자전환으로 주식 등을 발행하는 경우로서 시가로 발행된 금액 중 액면금액을 초과한 금액을 자본에 전입하여 주주가 받은 주식가액은 의제배당에 해당한다.","a":"X","e":"채무의 출자전환으로 주식 등을 발행하는 경우로서 시 로 발행된 금액 중 액면금액을 초과한 금액은 주식발행초 과금에 해당하므로 자본에 전입하여 주주가 받은 주식가 액은 의제배당에 해당하지 않는다. 시가와 발행가액의 차이가 채무면제이익이고, 채무면제 이익을 자본에 전입하여 주주가 받은 주식가액은 의제배 당에 해당한다.","pg":247},{"id":1316,"ch":26,"n":5,"q":"자기출자지분을 소각하여 생긴 이익으로서 소각 당시 시가 가 취득가액을 초과하지 않고 소각일부터 2년이 지난 후 자 본에 전입하는 금액은 배당으로 의제한다.","a":"X","e":"자기출자지분을 소각하여 생긴 이익으로서 소각 당시 시 가가 취득가액을 초과하지 않고 소각일부터 2년이 지난 후 자본에 전입하는 금액은 의제배당에 해당되지 않는다.","pg":247},{"id":1317,"ch":26,"n":6,"q":"자기주식 소각 당시의 시가가 취득가액을 초과한 경우로서 자기주식을 소각하여 생긴 이익을 소각일부터 4년이 지난 후 자본에 전입하여 주주가 받은 주식가액은 의제배당에 해 당한다.","a":"O","e":"","pg":247},{"id":1318,"ch":26,"n":7,"q":"영리내국법인 (주)한국이 자기주식을 소각하여 생긴 이익을 소각일로부터 2년 이내에 자본에 전입함에 따라 (주)한국의 주주인 영리내국법인 (주)민국이 수령하는 무상주는 의제배당 으로 익금에 산입한다.","a":"O","e":"","pg":248},{"id":1319,"ch":26,"n":8,"q":"피출자법인이 「법인세법」 제17조 제1항 제2호에 따른 주식의 포괄적 교환차익을 자본에 전입함으로써 출자법인이 취득하 게 되는 주식의 가액은 이익을 배당 받았거나 잉여금을 분 배 받은 금액으로 본다.","a":"X","e":"피출자법인이 「법인세법」 제17조 제1항 제2호에 따른 주 식의 포괄적 교환차익은 주식발행초과금과 유사한 항목 이다. 따라서 해당 잉여금을 자본에 전입함으로써 출자법 인이 취득하게 되는 주식의 가액은 이익을 배당 받았거나 잉여금을 분배 받은 금액으로 보지 않는다.","pg":248},{"id":1320,"ch":26,"n":9,"q":"법인이 자기주식 또는 자기출자지분을 보유한 상태에서 자 본전입을 함에 따라 그 법인 외의 법인주주의 지분 비율이 증가한 경우 증가한 지분 비율에 상당하는 주식 등의 가액 은 법인주주의 익금에 산입하지 아니한다.","a":"X","e":"법인이 자기주식 또는 자기출자지분을 보유한 상태에서 자본전입을 함에 따라 그 법인 외의 법인주주의 지분 비 율이 증가한 경우 증가한 지분 비율에 상당하는 주식 등 의 가액은 법인주주의 익금에 산입한다.","pg":248},{"id":1321,"ch":26,"n":10,"q":"주식의 소각으로 인하여 주주 등인 내국법인이 취득하는 금 전과 그 밖의 재산가액의 합계액이 해당 주식 등을 취득하 기 위하여 사용한 금액을 초과하는 금액은 배당으로 의제된 다.","a":"O","e":"","pg":248},{"id":1322,"ch":26,"n":11,"q":"해산한 법인의 주주 등(법인으로 보는 단체의 구성원을 제 외)이 그 법인의 해산으로 인한 잔여재산의 분배로서 취득 하는 금전과 그 밖의 재산의 가액이 그 주식을 취득하기 위 하여 사용한 금액을 초과하는 금액은 배당으로 의제된다.","a":"X","e":"해산한 법인의 주주 등(법인으로 보는 단체의 구성원을 포함)이 그 법인의 해산으로 인한 잔여재산의 분배로서 취득하는 금전과 그 밖의 재산의 가액이 그 주식을 취득 하기 위하여 사용한 금액을 초과하는 금액은 배당으로 의 제된다.","pg":248},{"id":1323,"ch":26,"n":12,"q":"합병법인의 주주 등이 피합병법인으로부터 그 합병으로 인 하여 취득하는 합병대가가 그 합병법인의 주식 등을 취득하 기 위하여 사용한 금액을 초과하는 금액은 의제배당에 해당 한다.","a":"X","e":"피합병법인의 주주 등이 합병법인으로부터 그 합병으로 인하여 취득하는 합병대가가 그 피합병법인의 주식 등을 취득하기 위하여 사용한 금액을 초과하는 금액은 의제배 당에 해당한다.","pg":249},{"id":1324,"ch":26,"n":13,"q":"법인의 합병과 해산으로 인한 의제배당의 경우 각각 합병등 기일과 해산등기일을 의제배당의 귀속시기로 한다.","a":"X","e":"법인의 합병으로 인한 의제배당의 경우 합병등기일을 귀 속시기로 하고, 해산으로 인한 의제배당의 경우 잔여재산 의 가액이 확정된 날을 귀속시기로 한다.","pg":249},{"id":1325,"ch":27,"n":1,"q":"법인이 사업과 관련하여 지출한 비용이 「법인세법」상 손금 으로 인정되기 위해서는, 「법인세법」과 다른 법률에서 달리 정하고 있지 않는 한, 그 지출이 사업과 관련된 것만으로는 부족하고 그 외에 비용지출이 일반적으로 인정되는 통상적 인 것이거나 수익과 직접 관련된 것이어야 한다.","a":"O","e":"","pg":250},{"id":1326,"ch":27,"n":2,"q":"법인이 영리내국법인으로부터 건당 3만원(부가가치세 포함) 을 초과하는 용역을 공급받고 그 대가를 지급하는 경우 법 정증명서류 이외의 증명서류를 수취하면 손금에 산입하지 아니한다.","a":"X","e":"법인이 영리내국법인으로부터 건당 3만원(부가가치세 포 함)을 초과하는 용역을 공급받고 그 대가를 지급하는 경 우 법정증명서류 이외의 증명서류를 수취하면 손금에 산 입하되 적격증빙을 수취하지 아니린 금액의 2% 가산세가 부과된다 .","pg":250},{"id":1327,"ch":27,"n":3,"q":"내국법인이 한 차례의 접대에 지출한 기업업무추진비 중 3만원(경조사금은 20만원)을 초과하는 기업업무추진비로서 증명서류를 수취하지 않은 것은 전액 손금불산입하고 기타 사외유출로 처분한다.","a":"X","e":"내국법인이 한 차례의 접대에 지출한 기업업무추진비 중 3만원(경조사금은 20만원)을 초과하는 기업업무추진비로 서 증명서류를 수취하지 않은 것은 전액 손금불산입하고 대표자에 대한 상여로 처분한다.","pg":250},{"id":1328,"ch":27,"n":4,"q":"임원의 출산·양육지원을 위해 임원에게 공통적으로 적용되 는 지급기준에 따라 지급하는 금액은 손금에 산입한다.","a":"O","e":"","pg":250},{"id":1329,"ch":27,"n":5,"q":"우리사주조합에 출연하는 자사주의 장부가액은 손금에 해당 하지 않는다. ○","a":"X","e":"우리사주조합에 출연하는 자사주의 장부가액은 손금에 해당한다.","pg":250},{"id":1330,"ch":27,"n":6,"q":"광업의 탐광을 위한 개발비는 손금에 해당한다. 268 제5편 법인세법","a":"O","e":"","pg":250},{"id":1331,"ch":27,"n":7,"q":"이사회의 결의에 의하여 직원의 사망 이후 유족에게 지속적 으로 지급하는 학자금 등의 금액은 손금에 해당한다.","a":"X","e":"이사회의 결의에 의하여 직원의 사망 이후 유족에게 일시 적으로 지급하는 학자금 등의 금액은 손금에 해당한다. 이때, 임원 또는 직원의 사망 전에 정관이나 주주총회. 사원총회 또는 이사회의 결의에 의하여 결정되어 임원 또 는 직원에게 공통적으로 적용되는 지급기준에 따라 지급 되는 것으로 한다.","pg":251},{"id":1332,"ch":27,"n":8,"q":"판매한 제품에 대한 원료의 매입가액(기업회계기준에 따른 매입에누리금액 및 매입할인금액을 제외)과 그 부대비용은 손비의 범위에 포함된다.","a":"O","e":"","pg":251},{"id":1333,"ch":27,"n":9,"q":"판매한 상품 또는 제품의 판매장려금 및 판매수당의 경우 사전약정하에 지급되어야 손금으로 인정된다.","a":"X","e":"판매한 상품 또는 제품의 보관료, 포장비, 운반비, 판매 장려금 및 판매수당 등 판매와 관련된 부대비용은 손금으 로 인정되는데 이때 판매장려금 및 판매수당의 경우 사전 약정 없이 지급하는 경우를 포함한다.","pg":251},{"id":1334,"ch":27,"n":10,"q":"비영업용 소형승용차의 유지에 관한 부가가치세 매입세액 (자본적 지출은 제외)은 지불한 사업연도의 손금에 산입한 경우 세무조정을 해야 한다.","a":"X","e":"비영업용 소형승용차의 유지에 관한 부가가치세 매입세 액(자본적 지출은 제외)은 지불한 사업연도의 손금에 산 입하므로 세무조정을 할 필요가 없다.","pg":251},{"id":1335,"ch":27,"n":11,"q":"부동산의 임차보증금에 대한 부가가치세 매입세액을 임차법 인이 납부하고 손익계산서상 비용으로 계상하였다면 「법인 세법」상 세무조정을 해야 한다.","a":"X","e":"부동산의 임차보증금에 대한 부가가치세 매입세액을 임 차법인이 납부하고 손익계산서상 비용으로 계상하였다 면, 부담한 자의 손금으로 인정되므로 「법인세법」상 세무 조정을 할 필요가 없다.","pg":251},{"id":1336,"ch":27,"n":12,"q":"제조업을 영위하는 법인이 보유한 개별소비세 과세대상인 승용자동차의 수선비에 대한 부가가치세 매입세액은 손금에 산입하지 아니한다.","a":"X","e":"재화 또는 용역을 공급받거나 재화를 수입할 때 부담한 부가가치세 매입세액은 원칙적으로 손금으로 인정되지 아니하나 부가가치세 매입세액 중 매입세액을 공제할 수 없는 것 중 비영업용 승용자동차의 구입, 임차, 유지 관련 매입세액은 손금에 산입한다.","pg":251},{"id":1337,"ch":27,"n":13,"q":"간이과세자로부터 부가가치세가 과세되는 재화를 공급받은 경우로서 「부가가치세법」 제36조 제1항의 규정에 의한 영수 증을 교부받은 거래분에 포함된 매입세액 중 매입세액공제 대상이 아닌 금액은 손금으로 인정된다.","a":"O","e":"","pg":252},{"id":1338,"ch":27,"n"
