:14,"q":"법인의 회수할 수 없는 부가가치세 매출세액 미수금(대손세 액공제를 받지 아니한 것에 한정)은 각사업연도 소득금액을 계산할 때 손금에 산입하지 않는다.","a":"X","e":"법인의 회수할 수 없는 부가가치세 매출세액 미수금(대 세액공제를 받지 아니한 것에 한정)은 각사업연도 소득 액을 계산할 때 손금에 산입한다.","pg":252},{"id":1339,"ch":27,"n":15,"q":"내국법인이 근로자(임원 포함)에게 이익처분에 의해 지급되 는 상여는 인건비로서 손금으로 인정된다.","a":"X","e":"내국법인이 근로제공의 대가로 지급되는 각종 비용으 서, 급여·임금. 제수당·상여금·퇴직급여 및 복리후 비 등은 원칙적으로 모두 손금으로 인정되나 이익처는 의해 지급되는 상여를 제외한다.","pg":252},{"id":1340,"ch":27,"n":16,"q":"합자회사의 노무출자사원에 지급하는 보수는 적합한 보수가 아닌 것으로 보고 손금불산입한다.","a":"O","e":"","pg":252},{"id":1341,"ch":27,"n":17,"q":"법인이 지배주주 등(특수관계인 포함)인 임원에게 지급하 는 보수는 적합한 보수가 아닌 것으로 보고 손금불산입한다.","a":"X","e":"법인이 지배주주 등(특수관계인 포함)인 임원에게 정 사유 없이 동일 직위에 있는 지배주주 등 외의 임원 직원에게 지급하는 금액을 초과하여 보수를 지급하는 우에 한하여 그 초과금액만 손금불산입한다.","pg":252},{"id":1342,"ch":27,"n":18,"q":"법인이 비상근임원에게 지급하는 보수는 손금에 산입하지 않는다.","a":"X","e":"법인이 비상근임원에게 지급하는 보수 중 부당행위 부인에 해당하는 보수는 손금에 산입하지 않는다. 이","pg":252},{"id":1343,"ch":27,"n":19,"q":"법인이 임원 또는 직원에게 지급한 상여금 중 주주총회의 결의에 따라 결정된 급여지급기준에 의한 금액을 초과하여 지급하는 금액은 손금에 산입하지 않는다.","a":"X","e":"법인이 임원에게 지급한 상여금 중 주주총회의 결의에 따 라 결정된 급여지급기준에 의한 금액을 초과하여 지급하 는 금액은 손금에 산입하지 않는다. 법인이 임원이 아닌 직원에게 지급한 상여금 중 주주총회의 결의에 의해 결정 된 급여지급기준에 따른 금액을 초과하여 지급한 경우 그 초과금액은 이를 손금에 산입한다.","pg":253},{"id":1344,"ch":27,"n":20,"q":"법인이 지배주주 등(특수관계인 포함)인 임원 또는 직원에게 정당한 사유없이 동일 직위에 있는 지배주주 등 외의 임원 또는 직원에게 지급하는 금액을 초과하여 보수를 지급하는 경우 그 초과금액 손금에 산입한다.","a":"X","e":"법인이 지배주주 등(특수관계인 포함)인 임원 또는 직원 에게 정당한 사유없이 동일 직위에 있는 지배주주 등 외 의 임원 또는 직원에게 지급하는 금액을 초과하여 보수를 지급하는 경우 그 초과금액 손금에 산입하지 않는다.","pg":253},{"id":1345,"ch":27,"n":21,"q":"이익처분에 의하여 지급하는 상여금은 임원의 경우 손금에 산입하지 않지만, 직원의 경우 손금에 산입한다.","a":"X","e":"'이익처분에 의한 상여금'이란 법인의 이익잉여금을 주주총 회에서 처분하여 임직원에게 지급하는 상여금을 말한다. 이익처분에 의하여 지급하는 상여금은 임직원을 구분하 지 않고 손금에 산입하지 않는다.","pg":253},{"id":1346,"ch":27,"n":22,"q":"현실적으로 퇴직하지 않은 임원 또는 직원에게 지급한 퇴직 급여는 현실적으로 퇴직할 때까지 이를 업무와 관련이 없는 가지급금으로 보며, 현실적인 퇴직이 있을 때 비로소 손금에 산입된다.","a":"O","e":"","pg":253},{"id":1347,"ch":27,"n":23,"q":"법인의 해산에 의하여 퇴직하는 임원 또는 사용인에게 지급 하는 해산수당은 지급하는 시점의 손금으로 한다.","a":"X","e":"법인의 해산에 의하여 퇴직하는 임원 또는 사용인에게 지 급하는 해산수당은 최종사업연도의 손금으로 한다.","pg":253},{"id":1348,"ch":27,"n":24,"q":"파견근로자를 위하여 지출한 직장문화비와 직장회식비는 기 업업무추진비로 본다.","a":"X","e":"법인이 그 임원 또는 직원을 위하여 지출한 복리후생비 중 일정 비용은 손금에 산입한다. 이때 직원에는 법에 따 른 파견근로자를 포함한다. 따라서 파견근로자를 위하여 지출한 직장문화비와 직장회식비는 복리후생비로 본다.","pg":253},{"id":1349,"ch":27,"n":25,"q":"업무와 관련이 있는 경우라 하더라도 해외시찰비나 해외훈 련비는 손금항목에 해당하지 않는다.","a":"X","e":"업무수행상 통상 필요하다고 인정되는 부분에 해당하는 해외시찰비와 훈련비는 손금으로 한다.","pg":254},{"id":1350,"ch":27,"n":26,"q":"법인의 임직원이 아닌 지배주주에게 지급한 여비 또는 교육 훈련비는 해당 사업연도의 소득금액 계산에 있어 이를 손금 에 산입하지 아니한다.","a":"O","e":"","pg":254},{"id":1351,"ch":27,"n":27,"q":"법인이 출자임원(지배주주와 특수관계에 있는 자)에게 지급 한 여비 또는 교육훈련비는 업무와 관련된 지출이라 하더라 도 전액 손금불산입한다.","a":"X","e":"법인이 출자임원(지배주주와 특수관계에 있는 자)에게 지 급한 여비 또는 교육훈련비는 업무와 관련된 지출이라면 전액 손금으로 한다.","pg":254},{"id":1352,"ch":27,"n":28,"q":"법인이 부담한 간주임대료에 대한 부가가치세는 손금에 산 입하지 않는다.","a":"X","e":"법인이 부담한 간주임대료에 대한 부가가치세는 손금에 산입한다.","pg":254},{"id":1353,"ch":27,"n":29,"q":"파손·부패 등의 사유로 정상가격으로 판매할 수 없는 재고 자산의 경우 사업연도 종료일 현재의 처분 가능한 시가로 평가한다.","a":"O","e":"","pg":254},{"id":1354,"ch":27,"n":30,"q":"유형자산으로서 화재로 파손되거나 멸실된 것은 법령으로 정하는 방법에 따라 그 장부가액을 감액할 수 있다. ○","a":"O","e":"","pg":254},{"id":1355,"ch":27,"n":31,"q":"주식 등을 발행한 법인이 파산한 경우의 해당 주식 등의 경 우 사업연도 종료일 현재의 시가로 전액 감액하고, 그 감 액한 금액을 해당 사업연도의 손금으로 계상할 수 있다. ○","a":"X","e":"주식 등을 발행한 법인이 파산한 경우의 해당 주식 등의 경우 사업연도 종료일 현재의 시가(1,000원 이하인 경우. 1,1000원으로 함)로 감액하고, 그 감액한 금액을 해당 사 업연도의 손금으로 계상할 수 있다.","pg":254},{"id":1356,"ch":27,"n":32,"q":"부도가 발생한 주권상장법인이 발행한 주식, 「기업구조조정 촉진법」에 따른 부실징후기업이 된 주권상장법인이 발행한 주식은 감액하여 손금으로 산입할 수 없다.","a":"X","e":"부도가 발생한 주권상장법인이 발행한 주식, 「기업구조조 정 촉진법」에 따른 부실징후기업이 된 주권상장법인이 발 행한 주식은 감액하여 손금으로 산입할 수 있다.","pg":255},{"id":1357,"ch":27,"n":33,"q":"영업자가 조직한 단체로서 법인이거나 주무관청에 등록된 조합 또는 협회에 지급한 일반회비를 손익계산서상 비용 계 상하였다면 「법인세법」상 세무조정을 해야 한다.","a":"X","e":"영업자가 조직한 단체로서 법인이거나 주무관청에 등록 된 조합 또는 협회에 지급한 일반회비는 「법인세법」상 손 금이다. 따라서 이를 손익계산서상 비용 계상하였다면 「법인세법」상 세무조정을 할 필요가 없다.","pg":255},{"id":1358,"ch":27,"n":34,"q":"영업자가 임의로 조직한 조합 또는 협회에 지급한 회비는 전액 손금으로 인정된다.","a":"X","e":"영업자가 임의로 조직한 조합 또는 협회에 지급한 회비는 손금에 산입하지 아니한다. 비교 영업자가 조직한 단체로서 법인이거나 주무관청에 등록된 조합 또는 협회에 지급한 일반화비는 손금에 산입함","pg":255},{"id":1359,"ch":27,"n":35,"q":"장식의 목적으로 사무실 등 여러 사람이 볼 수 있는 공간에 항상 전시하는 미술품의 취득가액을 그 취득한 날이 속하는 사업연도의 손비로 계상한 경우, 그 취득가액이 거래단위별 로 2천만원이라면 전액 손비의 범위에 포함된다.","a":"X","e":"장식의 목적으로 사무실 등 여러 사람이 볼 수 있는 공간 에 항상 전시하는 미술품의 취득가액을 그 취득한 날이 속하는 사업연도의 손비로 계상한 경우, 그 취득가액이 거래단위별로 1천만원 이하라면 전액 손비의 범위에 포함 된다.","pg":255},{"id":1360,"ch":27,"n":36,"q":"특정인에게 광고선전 목적으로 기증한 물품의 구입비용은 전액 손금에 산입한다.","a":"X","e":"특정인에게 광고선전 목적으로 기증한 물품(개당 3만원 이하의 물품은 제외)의 구입비용으로 연간 5만원 이내의 금액은 손금에 산입한다.","pg":255},{"id":1361,"ch":27,"n":37,"q":"결산을 확정할 때 잉여금의 처분을 손비로 계상한 금액은 손금에 산입한다.","a":"X","e":"결산을 확정할 때 잉여금의 처분을 손비로 계상한 금액은 손금에 산입하지 아니한다.","pg":255},{"id":1362,"ch":27,"n":38,"q":"「상법」에 따라 신주를 발행한 경우로서 액면가액에 미달한 금액으로 발행하는 경우 그 미달하는 금액과 신주발행비의 합계액은 손금에 산입한다.","a":"X","e":"액면가액에 미달한 금액으로 신주를 발행하는 경우 그 미 달하는 금액을 '주식할인발행차금'이라 한다. 주식할인발 행차금과 신주발행비의 합계액은 자본거래에 해당하므로 손금에 산입하지 아니한다.","pg":256},{"id":1363,"ch":27,"n":39,"q":"감자차손은 손금에 산입하지 아니한다.","a":"O","e":"","pg":256},{"id":1364,"ch":27,"n":40,"q":"전기요금의 납부지연으로 인한 연체가산금과 「국민건강보험 법」에 따라 징수하는 연체료를 납부하고 손익계산서상 비용 계상한 경우 「법인세법」상 세무조정이 필요하지 아니하다.","a":"X","e":"전기요금의 납부지연으로 인한 연체가산금은 손금이고, 「국민건강보험법」에 따라 징수하는 연체료는 손금불산입 항목이다. 따라서 전기요금의 납부지연으로 인한 연체가산금과 「국 민건강보험법」에 따라 징수하는 연체료를 납부하고 손익 계산서상 비용 계상한 경우 전기요금의 납부지연으로 인 한 연체가산금은 별도의 세무조정이 필요하지 않지만, 「국민건강보험법」에 따라 징수하는 연체료는 손금불산입 (기타사외유출)로 세무조정하여야 한다.","pg":256},{"id":1365,"ch":27,"n":41,"q":"업무와 관련하여 발생한 교통사고 벌과금은 손금으로 인정 된다.","a":"X","e":"교통사고벌과금은 업무관련성 여부와 관계없이 손금불산 입한다.","pg":256},{"id":1366,"ch":27,"n":42,"q":"판매하지 아니한 제품에 대한 반출필의 개별소비세 주세 또 는 교통·에너지·환경세 미납액 상당액은 손금에 산입한 다.","a":"X","e":"판매하지 아니한 제품에 대한 반출필의 개별소비세, 주세 또는 교통·에너지·환경세 미납액 상당액은 손금에 산 임하지 아니한다. . 444 단, 제품가격에 그 세액상당액을 가산한 경 우는 예외","pg":256},{"id":1367,"ch":27,"n":43,"q":"법령에 따라 의무적으로 납부하는 공과금은 손금에 산입한 다.","a":"O","e":"","pg":256},{"id":1368,"ch":27,"n":44,"q":"법령에 따른 의무의 불이행 또는 금지 · . 제한 등의 위반을 이유로 부과되는 공과금은 손금에 산입한다.","a":"X","e":"폐수배출부담금, 장애인고용부담금 등 법령에 따른 의무 의 불이행 또는 금지 · 제한 등의 위반을 이유로 부과되는 공과금은 손금불산입한다.","pg":257},{"id":1369,"ch":27,"n":45,"q":"법인이 업무와 관련하여 지급하는 손해배상금은 손금에 산 입하지만, 지급한 손해배상금 중 실제 발생한 손해를 초과하 여 지급하는 금액은 손금산입하지 않는다. 이때 실제 발생한 손해액을 모르는 경우에는 지급한 손해배상금에 2/3를 곱한 금액을 손금불산입한다.","a":"X","e":"법인이 업무와 관련하여 지급하는 손해배상금은 손금에 산입하지만, 지급한 손해배상금 중 실제 발생한 손해를 초과하여 지급하는 금액은 손금산입하지 않는다. 이때 실 제 발생한 손해액을 모르는 경우에는 법령에 따른 계산식 을 적용하여 계산한 금액을 손금불산입한다. 2-1 손금불산입 대상 손해배상금=㉠ x ㉠: 법률에 따라 지급한 손해배상금 ㉡: 법률상 손해액 대비 손해배상액의 배수상한","pg":257},{"id":1370,"ch":27,"n":46,"q":"법인이 다른 법인과 출자에 의해 공동으로 사업을 운영하는 경우 발생하는 공동경비 중 출자비율에 따른 분담금액을 초 과하는 금액은 손금에 산입하지 아니한다.","a":"O","e":"","pg":257},{"id":1371,"ch":27,"n":47,"q":"비출자공동사업자가 지출한 공동광고선전비는 비출자공동 사업자 사이의 약정에 따른 분담비율과 매출액비율 중. 해당 법인이 선택한 기준에 따라 분담하며, 이를 초과하는 분담금 액은 손금에 산입하지 아니한다.","a":"X","e":"비출자공동사업자가 지출한 공동광고선전비는 약정한 분 담비율로 하되, 해당 비율이 없는 경우 '특수관계인인 경 우의 비율 사용한다.","pg":257},{"id":1372,"ch":27,"n":48,"q":"법인이 직접 사용하지 않고 다른 사람(주주 등이 아닌 임원 과 소액주주 등인 임원 및 직원 포함)이 주로 사용하고 있는 장소·건축물 · . 물건 등의 유지비 · 관리비 사용료와 이와 관련되는 지출금은 손금에 산입하지 아니한다.","a":"X","e":"법인이 직접 사용하지 않고 다른 사람(주주 등이 아닌 임 원과 소액주주 등인 임원 및 직원은 제외)이 주로 사용하 고 있는 장소. 건축물. 물건 등의 유지비·관리비 사용 료와 이와 관련되는 지출금은 손금에 산입하지 아니한다.","pg":257},{"id":1373,"ch":27,"n":49,"q":"해당 법인의 주주 등(소액 주주 등을 포함)이 사용하고 있는 사택의 유지비·관리비 사용료는 손금에 산입하지 아니하 나 직원이 사용하고 있는 사택의 유지비·관리비 사용료는 손금에 산입한다.","a":"X","e":"해당 법인의 주주 등(소액 주주 등은 제외)이 사용하고 있는 사택의 유지비 · 관리비 · . 사용료는 손금에 산입하 지 아니하나 직원이 사용하고 있는 사택의 유지비 · . 관리 비·사용료는 손금에 산입한다.","pg":258},{"id":1374,"ch":27,"n":50,"q":"지분율 1%인 출자임원이 사용하는 사택의 유지관리비용은 「법인세법」상 손금에 해당한다.","a":"X","e":"지분율 1%인 출자임원이 사용하는 사택의 유지관리비용 은「법인세법」상 손금에 해당하지 않는다.","pg":258},{"id":1375,"ch":27,"n":51,"q":"업무무관자산을 취득하기 위하여 지출한 자금의 차입과 관 련되는 비용은 손금에 산입하지 아니한다.","a":"O","e":"","pg":258},{"id":1376,"ch":27,"n":52,"q":"법인이 공여한 「형법」 등에 따른 뇌물에 해당하는 금전 및 금전 외의 자산과 경제적 이익의 합계액은 업무와 직접 관 련이 없다고 인정되는 지출금액으로서 손금에 산입하지 아 니한다.","a":"O","e":"","pg":258},{"id":1377,"ch":27,"n":53,"q":"법인이 「노동조합 및 노동관계조정법」을 위반하여 지급한 노동조합의 전임자 급여는 손금에 산입하지 아니한다.","a":" 금계산서 등의 적격증빙을 갖추지 못한 것은 손금에 산입하지 아니한다.","pg":262},{"id":1392,"ch":28,"n":8,"q":"대통령령으로 정하는 금액을 초과하는 경우로서 신용카드 등을 사용하여 지출하는 기업업무추진비를 적용할 때 재화 또는 용역을 공급하는 신용카드 등의 가맹점이 아닌 다른 가맹점의 명의로 작성된 매출전표 등을 발급받은 경우 해당 지출금액은 기업업무추진비로 본다.","a":"X","e":"대통령령으로 정하는 금액을 초과하는 경우로서 신용카 드 등을 사용하여 지출하는 기업업무추진비를 적용할 때 재화 또는 용역을 공급하는 신용카드 등의 가맹점이 아닌 다른 가맹점의 명의로 작성된 매출전표 등을 발급받은 경 우 해당 지출금액은 기업업무추진비로 보지 아니한다.","pg":262},{"id":1393,"ch":28,"n":9,"q":"법인이 지출한 기업업무추진비 증 임직원 명의로 발급받은 신용카드로 지출한 금액은 기업업무추진비에 포함하지 않으 며 해당 금액을 귀속자에 대한 상여로 처분한다.","a":"X","e":"법인이 지출한 기업업무추진비 중 임직원 명의로 발급받 은 신용카드로 지출한 금액은 적격증빙서류 사용액으로 보지 않아 기업업무추진비에 포함하지 않으며 전액 기타 사외유출로 소득처분한다.","pg":262},{"id":1394,"ch":28,"n":10,"q":"지출 사실이 객관적으로 명백한 경우로서 기업업무추진비가 지출된 국내외 지역의 장소(그 장소가 소재한 인근 지역 안 의 유사한 장소를 포함)에서 현금 외에 다른 지출수단이 없 어 적격증명서류를 구비하기 어려운 경우의 해당 국내외 지 역에서 지출한 기업업무추진비는 그 성격상 적격증빙서류를 구비할 수 없으므로 기업업무추진비에 포함하여 한도 내에 서 계산하고 손금산입한다.","a":"X","e":"지출 사실이 객관적으로 명백한 경우로서 기업업무추진 비가 지출된 국외 지역의 장소(그 장소가 소재한 인근 지 역 안의 유사한 장소를 포함)에서 현금 외에 다른 지출수 단이 없어 적격증명서류를 구비하기 어려운 경우의 해당 국외 지역에서 지출한 기업업무추진비는 그 성격상 적격증 빙서류를 구비할 수 없으므로 기업업무추진비에 포함하여 한도 내에서 계산하고 손금산입한다.","pg":262},{"id":1395,"ch":28,"n":11,"q":"수입금액별 기업업무추진비 한도 계산 시 특수관계인과의 거래에서 발생한 수입금액에 대해서는 그 수입금액에 법 정 비율을 적용하여 산출한 금액의 100분의 20에 상당하는 금액을 한도로 한다.","a":"X","e":"수입금액별 기업업무추진비 한도 계산 시 특수관계인과 의 거래에서 발생한 수입금액에 대해서는 그 수입금액에 법 소정 비율을 적용하여 산출한 금액의 100분의 10에 상 당하는 금액을 한도로 한다.","pg":263},{"id":1396,"ch":28,"n":12,"q":"부동산임대업을 주된 사업으로 하는 등 대통령령으로 정하 는 요건에 해당하는 내국법인의 경우에는 기본한도와 수입 금액별 한도 합계액의 100분의 30을 초과하는 금액은 해당 사업연도의 소득금액을 계산할 때 손금에 산입하지 아니한 다.","a":"X","e":"부동산임대업을 주된 사업으로 하는 등 대통령령으로 정 하는 요건에 해당하는 내국법인의 경우에는 기본한도와 수입금액별 한도 합계액의 100분의 50을 초과하는 금액 은 해당 사업연도의 소득금액을 계산할 때 손금에 산입하 지 아니한다.","pg":263},{"id":1397,"ch":28,"n":13,"q":"법인이 특수관계인 외의 자에게 정당한 사유 없이 자산을 시가보다 낮은 가액으로 양도하거나 시가보다 높은 가액으 로 매입하는 거래를 통하여 실질적으로 증여한 것으로 인정 되는 금액은 기부금으로 본다.","a":"X","e":"법인이 특수관계인 외의 자에게 정당한 사유 없이 자산을 정상가액보다 낮은 가액으로 양도하거나 정상가액보다 높은 가액으로 매입하는 거래를 통하여 실질적으로 증여 한 것으로 인정되는 금액은 기부금으로 본다.","pg":263},{"id":1398,"ch":28,"n":14,"q":"국가·지방자치단체에 무상으로 기증하는 금품의 가액은 전 액 손금산입한다.","a":"X","e":"국가·지방자치단체에 무상으로 기증하는 금품의 가액은 50% 한도 내에서 손금산입한다.","pg":263},{"id":1399,"ch":28,"n":15,"q":"「사회복지사업법」에 따른 사회복지법인의 고유목적사업비로 지출하는 기부금은 특례기부금이다.","a":"X","e":"「사회복지사업법」에 따른 사회복지법인의 고유목적사업 비로 지출하는 기부금은 일반기부금이다.","pg":263},{"id":1400,"ch":28,"n":16,"q":"법인이 특수관계인에 있는 「사회복지사업법」에 의한 사회복 지법인에 대한 고유목적사업비를 지출한 금액이 있을 경우 부당행위계산부인 규정을 적용한다.","a":"X","e":"특수관계인에게 업무와 무관하게 증여한 경우에는 부당 행위계산의 부인에 해당하지만 그 특수관계인이 세법에 열거된 기부금 대상 단체 등인 경우에는 기부금으로 본 다. 따라서 법인이 특수관계인에 있는 「사회복지사업법」 에 의한 사회복지법인에 대한 고유목적사업비를 지출한 금액이 있을 경우 부당행위계산부인 규정을 적용하지 않 고 기부금으로 보아 세무조정한다.","pg":263},{"id":1401,"ch":28,"n":17,"q":"「상속세 및 증여세법 시행령」의 요건을 갖춘 공익신탁으로 신탁하는 기부금은 특례기부금에 해당된다.","a":"X","e":"「상속세 및 증여세법 시행령」의 요건을 갖춘 공익신탁으 로 신탁하는 기부금은 일반기부금에 해당된다.","pg":264},{"id":1402,"ch":28,"n":18,"q":"법인이 새마을금고(특수관계인이 아님)에 정당한 사유 없이 자산을 정상가액보다 낮은 가액으로 양도한 경우 그 차액이 실질적으로 증여한 것으로 인정되는 금액은 비지정기부금으 로 의제하여 손금산입하지 않는다.","a":"O","e":"","pg":264},{"id":1403,"ch":28,"n":19,"q":"법인이 사립학교법」에 따른 사립학교에 시설비·교육비. 장학금·연구비를 지급하지 아니하고 미지급금으로 계상한 경우에는 이를 계상한 사업연도의 기부금으로 하고, 그 후의 사업연도에 있어서 이를 기부금으로 보지 아니한다.","a":"X","e":"기부금은 그 지출한 날이 속하는 사업연도에 귀속한다. 따라서 법인이 「사립학교법」에 따른 사립학교에 시설비· 교육비·장학금 · 연구비를 지급하지 아니하고 미지급금 으로 계상한 경우에는 실제로 이를 지출할 때까지 기부금 으로 보지 않는다.","pg":264},{"id":1404,"ch":28,"n":20,"q":"법인이 기부금의 지출을 위하여 어음을 발행(배서를 포함)한 경우에는 그 어음이 실제로 발행된 날에 지출한 것으로 보 고, 기부금의 지출을 위하여 수표를 발행한 경우에는 해당 수표를 교부한 날에 지출한 것으로 본다.","a":"X","e":"법인이 기부금의 지출을 위하여 어음을 발행(배서를 포 함)한 경우에는 그 어음이 실제로 결제된 날에 지출한 것 으로 보고, 기부금의 지출을 위하여 수표를 발행한 경우 에는 해당 수표를 교부한 날에 지출한 것으로 본다.","pg":264},{"id":1405,"ch":28,"n":21,"q":"법인이 기부금을 가지급금 등으로 이연계상한 경우에는 이 를 그 지출한 사업연도의 기부금으로 보지 않고 그 후의 사 업연도의 기부금으로 본다.","a":"X","e":"법인이 기부금을 가지급금 등으로 이연계상한 경우에는 이를 그 지출한 사업연도의 기부금으로 하고 그 후의 사 업연도에는 이를 기부금으로 보지 않는다.","pg":264},{"id":1406,"ch":28,"n":22,"q":"법인이 기부금을 금전 외의 자산으로 제공한 경우 특수관계 인이 아닌 자에게 기부한 일반기부금은 기부했을 때의 장부 가액과 시가 중 큰 금액으로 해당 자산가액을 산정한다.","a":"X","e":"법인이 기부금을 금전 외의 자산으로 제공한 경우 특수관 계인이 아닌 자에게 기부한 일반기부금은 기부한 때의 장 부가액을 해당 자산가액으로 산정한다.","pg":264},{"id":1407,"ch":28,"n":23,"q":"법인이 천재지변으로 생기는 이재민을 위해 기부한 구호품 이 금전 외의 자산인 경우 해당 구호품의 가액은 기부한 때 의 시가와 장부가액 중 큰 금액으로 평가한다.","a":"X","e":"법인이 천재지변으로 생기는 이재민을 위해 기부한 구호 품이 금전 외의 자산인 경우 해당 구호품의 가액은 기부 한 때의 장부가액으로 평가한다.","pg":265},{"id":1408,"ch":28,"n":24,"q":"법인이 국군장병 위문품(장부가액 3억원, 시가 5억원)을 기 부하는 경우 해당 현물기부금의 가액은 3억원이다.","a":"O","e":"","pg":265},{"id":1409,"ch":28,"n":25,"q":"법인이 특수관계인이 아닌 사회복지시설 또는 기관 중무 료 · 실비로 이용할 수 있는 아동복지시설, 노인복지시설, 장 애인복지시설, 다문화가족지원센터 등에 금전 외의 자산으 로 기부금을 제공한 경우 해당 자산의 가액은 이를 제공한 때의 장부가액과 시가 중 큰 금액으로 한다.","a":"X","e":"법인이 특수관계인이 아닌 사회복지시설 또는 기관 중 무 료. 실비로 이용할 수 있는 아동복지시설, 노인복지시설. 장애인복지시설, 다문화가족지원센터 등에 금전 외의 자 산으로 기부금을 제공한 경우 해당 자산의 가액은 이를 제공한 때의 장부가액으로 한다.","pg":265},{"id":1410,"ch":28,"n":26,"q":"법인이 정치자금으로서 기부한 자산이 금전 외의 자산인 경 우 해당 자산의 가액은 이를 제공한 때의 장부가액으로 한 다.","a":"X","e":"법인이 정치자금으로 기부한 자산은 비지정기부금에 해 당한다. 법인이 비지정기부금으로 기부한 자산이 금전 외 의 자산인 경우 해당 자산의 가액은 이를 제공한 때의 장 부가액과 시가 중 큰 금액으로 한다.","pg":265},{"id":1411,"ch":28,"n":27,"q":"내국법인이 각 사업연도에 지출하는 일반기부금 중 손금산 입한도액을 초과하여 손금에 산입하지 아니한 금액은 해당 사업연도의 다음 사업연도 개시일부터 15년 이내에 끝나는 각 사업연도로 이월하여 그 이월된 사업연도의 소득금액을 계산할 때 손금산입한도액의 범위에서 손금에 산입한다.","a":"X","e":"내국법인이 각 사업연도에 지출하는 일반기부금 중 손금 산입한도액을 초과하여 손금에 산입하지 아니한 금액은 해당 사업연도의 다음 사업연도 개시일부터 10년 이내에 끝나는 각 사업연도로 이월하여 그 이월된 사업연도의 소 득금액을 계산할 때 손금산입한도액의 범위에서 손금에 산입한다.","pg":265},{"id":1412,"ch":28,"n":28,"q":"특례기부금 및 일반기부금의 한도초과액은 해당 사업연도의 다음 사업연도 개시일부터 10년 이내에 끝나는 각 사업연도 로 이월되지만 기업업무추진비 한도초과액은 이월공제가 되 지 아니한다.","a":"O","e":"","pg":265},{"id":1413,"ch":29,"n":1,"q":"지급이자 손금불산입 규정이 동시에 적용되는 경우 부인 순서는 채권자가 불분명한 사채의 이자, 지급받은 자가 불분 명한 채권·증권의 이자. 할인액 또는 차익, 건설자금에 충 당한 차입금의 이자, 업무무관자산 등에 대한 지급이자의 순 으로 부인한다.","a":"O","e":"","pg":266},{"id":1414,"ch":29,"n":2,"q":"업무무관자산 등에 대한 지급이자와 채권자가 불분명한 사 채이자를 손금불산입하는 경우에는 업무무관자산 등에 대한 지급이자를 먼저 손금불산입한다.","a":"X","e":"업무무관자산 등에 대한 지급이자와 채권자가 불분명한 사채이자를 손금불산입하는 경우에는 채권자가 불분명한 사채이자를 먼저 손금불산입한다.","pg":266},{"id":1415,"ch":29,"n":3,"q":"지급이자 손금부인되는 채권자가 블분명한 사채의 이자에 는 거래일 현재 주민등록표에 의하여 그 거주사실 등이 확 인된 채권자가 차입금을 변제받은 후 소재불명이 된 경우의 차입금에 대한 이자도 포함된다.","a":"X","e":"거래일 현재 주민등록표에 의하여 그 거주사실 등이 확인 된 채권자가 차입금을 변제받은 후 소재불명이 된 경우의 차입금에 대한 이자는 채권자 불분명 사채이자로 보지 않 는다.","pg":266},{"id":1416,"ch":29,"n":4,"q":"채권자의 능력 및 자산상태로 보아 금전을 대여한 것으로 인정할 수 없는 차입금에 대한 이자는 손금에 산입하지 아 니한다.","a":"O","e":"","pg":266},{"id":1417,"ch":29,"n":5,"q":"채권자가 불분명한 사채이자에는 알선수수료 ·. 사례금 등 명 목여하에 불구하고 사채를 차입하고 지급하는 금품을 포함 한다.","a":"O","e":"","pg":266},{"id":1418,"ch":29,"n":6,"q":"채권자가 불분명한 사채이자는 손금불산입하며 그 손금불산 입액과 이에 따른 원천징수세액 상당액은 기타사외유출로 소득처분한다. 284 제5편 법인세법","a":"X","e":"채권자가 불분명한 사채이자는 손금불산입하며 그 손금 불산입액은 대표자에 대한 상이로 소득처분하지만 이에 따른 원천징수세액 상당액은 기타사외유출로 소득처분한 다.","pg":266},{"id":1419,"ch":29,"n":7,"q":"채권·증권의 발행법인이 그 이자와 할인액을 직접 지급하 는 경우에 그 지급사실이 객관적으로 인정되지 아니한 때에 는 지급이자와 할인액을 손금불산입하며 그 원천징수세액은 기타사외유출로 소득처분한다.","a":"O","e":"","pg":267},{"id":1420,"ch":29,"n":8,"q":"건설자금에 충당한 차입금이자의 자본화 대상 자산은 유· 무형자산 및 투자자산이 포함된다.","a":"X","e":"건설자금에 충당한 차입금이자의 자본화 대상 자산은 사 업용 유·무형자산만 해당된다.","pg":267},{"id":1421,"ch":29,"n":9,"q":"재고자산 등의 매입을 위하여 조달한 차입금에 대한 이자비 용은 취득가액에 포함되지 않는다.","a":"O","e":"","pg":267},{"id":1422,"ch":29,"n":10,"q":"특정차입금에 대한 지급이자 등은 건설 등이 준공된 날이 속하는 사업연도 종료일까지 이를 자본적 지출로 하여 그 원본에 가산한다.","a":"X","e":"특정차입금에 대한 지급이자 등은 건설 등이 준공된 날까 지 이를 자본적 지출로 하여 그 원본에 가산한다.","pg":267},{"id":1423,"ch":29,"n":11,"q":"사업용 고정자산의 건설에 소요된지의 여부가 분명한 차입 금 중 해당 건설이 준공된 후에 남은 차입금에 대한 이자는 각 사업연도의 손금으로 산입할 수 없다.","a":"X","e":"사업용 고정자산의 건설에 소요된지의 여부가 분명한 차 입금 중 해당 건설이 준공된 후에 남은 차입금에 대한 이 자는 각 사업연도의 손금으로 한다.","pg":267},{"id":1424,"ch":29,"n":12,"q":"특정차입금의 연체로 인하여 생긴 이자를 원본에 가산한 경 우 그 가산한 금액과 그 원본에 가산한 금액에 대한 지급이 자는 해당 사업연도의 자본적 지출로 한다.","a":"X","e":"연체로 인하여 생긴 이자를 원본에 가산한 경우 그 가산 한 금액은 이를 해당 사업연도의 자본적 지출로 하고, 그 원본에 가산한 금액에 대한 지급이자는 이를 손금으로 한 다.","pg":267},{"id":1425,"ch":29,"n":13,"q":"사업용 고정자산의 건설에 소요된지의 여부가 분명한 차입 금의 일부를 운영자금에 전용한 경우 그 부분에 대한 지급 이자는 손금으로 산입하지 아니한다.","a":"X","e":"사업용 고정자산의 건설에 소요된지의 여부가 분명한 차 입금의 일부를 운영자금에 전용한 경우 그 부분에 대한 지급이자는 이를 운영자금 전용분 이자로 보아 손금으로 한다.","pg":267},{"id":1426,"ch":29,"n":14,"q":"특정차입금의 일시예금에서 생기는 수입이자는 일시예금분 수입이자로 원본에 가산하는 자본적 지출금액에 가산한다.","a":"X","e":"특정차입금의 일시에금에서 생기는 수입이자는 일시예금 분 수입이자로 원본에 가산하는 자본적 지출금액에서 차 김한다.","pg":268},{"id":1427,"ch":29,"n":15,"q":"법인이 특수관계인 여부와 관계없이 업무와 무관한 가지급 금 및 그 이자를 지급하고 있는 경우 업무무관자산 등에 대 한 지급이자로 보아 손금불산입하고 기타사외유출로 처분한 다.","a":"X","e":"법인이 특수관계인에게 업무와 관련없는 가지급금 및 그 이자를 지급하고 있는 경우 업무무관자산 등에 대한 지급 이자로 보아 손금불산입하고 기타사외유출로 처분한다. 따라서 특수관계가 없는 자에 대한 가지급금의 지급이자 는 손금불산입 대상이 아니다.","pg":268},{"id":1428,"ch":29,"n":16,"q":"업무무관자산 등에 대한 지급이자에 현재가치할인차금상각 액은 포함하나 사채할인발행차금 상각액은 포함하지 아니한 다.","a":"X","e":"업무무관자산 등에 대한 지급이자에 현재가치할인차금상 각액은 포함하지 아니하나 사채할인발행차금 상각액은 포함한다.","pg":268},{"id":1429,"ch":29,"n":17,"q":"자산을 장기할부조건으로 취득함에 따라 발생한 채무를 기 업회계기준이 정하는 바에 따라 현재가치로 평가하여 계상 한 현재가치할인차금의 상각액에 대하여도 지급이자 손금불 산입 규정을 적용한다.","a":"X","e":"자산을 장기할부조건으로 취득함에 따라 발생한 채무를 기업회계기준이 정하는 바에 따라 현재가치로 평가하여 계상한 현재가치할인차금의 상각액에 대하여는 지급이자 손금불산입 규정을 적용하지 않는다.","pg":268},{"id":1430,"ch":29,"n":18,"q":"업무무관자산 등에 대한 지급이자 손금불산입액을 계산할 때 업무무관자산의 취득가액에는 특수관계인으로부터 시가 를 초과하여 취득한 금액을 포함하지 않는다.","a":"X","e":"업무무관자산 등에 대한 지급이자 손금불산입액을 계산 할 때 업무무관자산의 취득가액에는 특수관계인으로부터 시가를 초과하여 취득한 금액을 포함한다.","pg":268},{"id":1431,"ch":29,"n":19,"q":"특수관계인으로부터 시가를 초과하는 가액으로 업무무관자 산을 매입한 경우 자산가액은 시가로 평가하여 지급이자를 계산한다.","a":"X","e":"특수관계인으로부터 시가를 초과하는 가액으로 업무무관 자산을 매입한 경우 부당행위계산의 부인 규정에 의한 시 가초과액을 포함한 가액으로 업무무관자산을 평가하여 지급이자를 계산한다.","pg":268},{"id":1432,"ch":29,"n":20,"q":"익금산입액의 귀속자가 불분명하거나 추계로 과세표준을 결 정·경정할 때에 대표자 상여로 처분한 금액에 대한 소득세 를 법인이 대납한 금액(특수관계가 소멸될 때까지의 기간에 상당하는 금액에 한정)은 업무무관가지급금으로 보지 않는 다.","a":"O","e":"","pg":269},{"id":1433,"ch":29,"n":21,"q":"「국민연금법」에 의하여 근로자가 지급받은 것으로 보는 퇴 직금전환금(당해 근로자가 퇴직할 때까지의 기간에 상당하 는 금액에 한함)은 특수관계인에게 해당 법인의 업무와 관련 없이 지급한 가지급금 등에서 제외한다.","a":"O","e":"","pg":269},{"id":1434,"ch":29,"n":22,"q":"직원에 대한 경조사비 대여액은 업무무관가지급금으로 보지 아니하나 직원의 자녀의 학자금 대여액은 업무무관가지급금 으로 본다.","a":"X","e":"직원에 대한 경조사비 또는 학자금(자녀의 학자금 포함) 의 대여액은 업무무관가지급금으로 보지 아니한다.","pg":269},{"id":1435,"ch":29,"n":23,"q":"업무무관자산 등에 대한 지급이자 손금불산입액을 계산할 때 중소기업에 근무하는 지배주주가 아닌 직원에 대한 주택 구입 또는 전세자금의 대여액은 특수관계인에 대한 가지급 금에 포함한다.","a":"X","e":"업무무관자산 등에 대한 지급이자 손금불산입액을 계산 할 때 중소기업에 근무하는 지배주주가 아닌 직원에 대한 주택구입 또는 전세자금의 대여액은 특수관계인에 대한 가지급금에 포함하지 아니한다.","pg":269},{"id":1436,"ch":29,"n":24,"q":"직원에 대한 월정급여액의 범위에서의 일시적인 급료의 가 불금은 업무무관가지급금으로 보지 아니한다.","a":"O","e":"","pg":269},{"id":1437,"ch":29,"n":25,"q":"가지급금 적수를 계산함에 있어서 동일인에 대한 가지급금 과 가수금이 함께 있는 경우 상계한다는 약정이 있는 경우 에 한하여 이를 상계한다","a":"X","e":"가지급금 적수를 계산함에 있어서 동일인에 대한 가지급 금과 가수금이 함께 있는 경우에는 이를 상계한 금액으로 한다. 다만, 동일인에 대한 가지급금과 가수금의 발생 시 에 각각 상환기간 및 이자율 등에 관한 약정이 있어 상계 할 수 없는 경우에는 상계하지 않는다.","pg":269},{"id":1438,"ch":29,"n":26,"q":"수탁가공계약에 따라 검사를 거쳐 인수 및 인도가 확정되는 물품의 판매로 인한 익금 및 손금은 계약상 인도해야 할 장 소에 보관한 날이 속하는 사업연도에 귀속된다.","a":"X","e":"수탁가공계약에 따라 검사를 거쳐 인수 및 인도가 확정되 는 물품의 판매로 인한 익금 및 손금은 해당 검사가 완료 된 날이 속하는 사업연도에 귀속된다. 비물품을 수출하는 경우 수출물품을 계약상 인도해야 할 장소에 보관한 날이 손익귀속시기이며 납품계약수탁가공계약(계약에 따라 검사를 거쳐 인수 및 인도가 확정되는 물품 제외)에 의하여 물품을 납 풍하거나 가공하는 경우 해당 물품을 계약상 인도해야 할 장소에 보 관한 날이 귀속시기임","pg":271},{"id":1439,"ch":29,"n":27,"q":"물품을 수출하는 경우에는 수출물품의 선. 기적일에 확정된 다.","a":"X","e":"물품을 수출하는 경우에는 수출물품을 계약상 인도하여 야 할 장소에 보관한 날에 익금으로 확정된다.","pg":271},{"id":1440,"ch":29,"n":28,"q":"상품 등의 시용판매의 경우 상대방이 그 상품 등에 대한 구 입 의사를 표시한 날(구입의 의사표시 기간에 대한 특약은 없음)을 익금 및 손금의 귀속사업연도로 한다.","a":"O","e":"","pg":271},{"id":1441,"ch":29,"n":29,"q":"상품 등의 시용판매에 있어 일정기간 내에 반송하거나 거절 의 의사를 표시하지 아니하면 특약 등에 의하여 그 판매가 확정되는 경우라고 하더라도 구매고객이 의사표시를 하는 날이 속하는 사업연도를 손익의 귀속사업연도로 한다.","a":"X","e":"상품 등의 시용판매에 있어 일정기간 내에 반송하거나 거 절의 의사를 표시하지 아니하면 특약 등에 의하여 그 관 매가 확정되는 경우에는 그 기간의 만료일이 속하는 사업 연도를 손익의 귀속사업연도로 한다.","pg":271},{"id":1442,"ch":29,"n":30,"q":"자산의 위탁매매의 경우 위탁자가 그 위탁자산을 수탁자에 게 인도한 날이 속하는 사업연도의 익금 및 손금으로 한다.","a":"X","e":"자산의 위탁매매의 경우 수탁자가 그 위탁자산을 매매한 날이 속하는 사업연도의 익금 및 손금으로 한다.","pg":271},{"id":1443,"ch":29,"n":31,"q":"법인이 매출할인을 하는 경우 그 매출할인금액은 목적물 을 인도하는 날이 속하는 사업연도의 매출액에서 차감한다.","a":"X","e":"법인이 매출할인을 하는 경우 그 매출할인금액은 상대방 과의 약정에 따른 지급기일(그 지급기일이 정해져 있지 않은 경우에는 지급한 날)이 속하는 사업연도의 매출액에 서 차감한다.","pg":271},{"id":1444,"ch":29,"n":32,"q":"「자본시장과 금융투자업에 관한 법률」에 따른 증권시장에서 증권시장업무 규정에 따라 보통거래방식으로 한 유가증권의 매매는 매매대금의 수수일을 손익귀속시기로 한다.","a":"X","e":"「자본시장과 금융투자업에 관한 법률」에 따른 증권시장에 서 증권시장업무 규정에 따라 보통거래방식으로 한 유가 증권의 매매는 매매계약을 체결한 날을 손익귀속시기로 한다.","pg":272},{"id":1445,"ch":29,"n":33,"q":"장기할부조건이라 함은 자산의 판매로서 판매금액을 월 부· 연부 기타의 지불방법에 따라 3회 이상으로 분할하여 수입하는 것 중 당해 목적물의 인도일부터 최종의 할부금의 지급기일까지의 기간이 1년 이상인 것을 말한다.","a":"X","e":"장기할부조건이라 함은 자산의 판매로서 판매금액을 월 부. 연부 기타의 지불방법에 따라 2회 이상으로 분할하 여 수입하는 것 중 당해 목적물의 인도일의 다음날부터 최종의 할부금의 지급기일까지의 기간이 1년 이상인 것을 말한다.","pg":272},{"id":1446,"ch":29,"n":34,"q":"상품 등 재고자산(부동산 제외) 장기할부조건부 판매의 경우 판매금액·수입금액을 2회 이상으로 분할하여 수입하고 인 도일의 다음 날부터 최종의 할부금의 지급기일까지의 기간 이 1년 이상인 판매방식을 말하는데 이 경우 손익귀속시기 는 회수기일도래기준에 따라 계상하는 것을 원칙으로 한다.","a":"X","e":"상품 등 재고자산(부동산 제외) 장기할부조건부 판매의 경우 판매금액 · . 수입금액을 2회 이상으로 분할하여 수입 하고 인도일의 다음 날부터 최종의 할부금의 지급기일까 지의 기간이 1년 이상인 판매방식을 말하는데 이 경우 손 익귀속시기는 인도한 날에 인식하는 것을 원칙으로 한다.","pg":272},{"id":1447,"ch":29,"n":35,"q":"중소기업이 아닌 법인이 장기할부조건으로 자산을 판매하고 인도기준으로 회계처리한 경우, 그 장기할부조건에 따라 각 사업연도에 회수하였거나 회수할 금액과 이에 대응하는 비 용을 신고조정에 의하여 해당 사업연도의 익금과 손금에 산 입할 수 있다.","a":"X","e":"중소기업인 법인이 장기할부조건으로 자산을 판매하고 인도기준으로 회계처리한 경우, 그 장기할부조건에 따라 각사업연도에 회수하였거나 회수할 금액과 이에 대응하 는 비용을 신고조정에 의하여 해당 사업연도의 익금과 손 금에 산입할 수 있다.","pg":272},{"id":1448,"ch":29,"n":36,"q":"중소기업의 경우 장기할부매출에 대하여 결산상 회계처리에 관계없이 장기할부조건에 따라 각 사업연도에 회수하였거나 회수할 금액과 이에 대응하는 비용을 각각 해당 사업연도의 익금과 손금에 산입할 수 있다.","a":"O","e":"","pg":272},{"id":1449,"ch":29,"n":37,"q":"수 회 일 기 래 도 준 기 에 따 라 해 당 업 사 도 연 에 수 회 나 거 였 하 회 할 수 액 금 과 에 이 응 대 는 하 용 비 을 각 각 당 해 업 사 도업 연폐 의일 금 익 과 금 손 에 입 산 는 하 인 법 이 업 폐 는 하 우 경 서 로 이 수 회 일 기 이 래 도 는 하 우 경 업 폐 일 이 속 하는 업 사 도 연 후 의 금 익 로 으 다 본 . OIX 19 설 건 · 조 제 타 기 역 용 ( 급 도 사 공 및 약 예 출 매 을 외 제 다 한 ) 의 공 제 에 대 하여 업 기 계 회 준 기 에 따 라 그 물 적 목 의 일 도 인 이 는 하 속 업 사 도 연 의 익 수 과 용 비 로 으 상 계 한 경 우 그 목적물 의 일 도 인 이 속 하는 업 사 도 연 의 금 익 과 금 손 에 입 산 할 수 있다. OIX 20 설 건 · 조 제 기 역 용 ( 급 도 사 공 및 약 예 출 매 을 함 포 다 한 ) 의 타 공 제 로 으 인 금 익 과 금 손 은 일 도 인 이 속 하는 업 사 도 연 의 한 금 익 과 금 손 에 입 산 는 하 것을 칙 원 로 으 다 한 .","a":"X","e":"9 1 × ② K N I L 오 다 진 9 1 4 . p 법 세 0 6 1 . p 2 설 건 · 조 제 타 기 역 용 ( 급 도 사 공 및 약 예 출 매 을 함 포 다 한 ) 의 공 제 에 여 하 대 업 기 계 회 준 기 에 라 따 그 물 적 목 의 도 인 일 이 는 하 속 업 사 도 연 의 익 수 과 용 비 로 으 상 계 한 우 경 그 물 적 목 의 일 도 인 이 는 하 속 업 사 도 연 의 금 익 과 금 손 에 산 할 입 수 다 있 . 0 2 X | K N I L 오 다 진 9 1 4 . p 범 세 2 0 6 1 . p 설 건 · 조 제 타 기 역 용 ( 급 도 사 공 및 약 예 출 매 을 함 포 다 한 ) 의 공 제 로 으 한 인 금 익 과 금 손 은 그 물 적 목 의 설 건 등 의 수 착 일 이 는 하 속 업 사 도 연 터 부 그 물 적 목 의 일 도 인 ( 역 용 공 제 의 우 경 는 에 그 공 제 을 료 완 한 날 ) 이 속 하는 업 사 연 도 지 까 그 물 적 목 의 건 설 등 을 료 완 한 도 정 ( 업 작 률 행 진 ) 를 준 기 로 으 여 하 산 계 한 익 수 과 용 비 을 각 각 당 해 업 사 도 연 의 금 익 과 금 손 에 입 산 는 하 것 을 칙 원 로 으 다 한 .","pg":273},{"id":1450,"ch":29,"n":38,"q":"업 기 소 중 이 약 계 간 기 이 1 년 이 하인 기 단 설 건 의 공 제 로 으 인 한 금 익 과 금 손 을 업 기 계 회 준 기 에 라 따 그 물 적 목 의 인도일 이 는 하 속 업 사 도 연 의 익 수 과 용 비 로 으 상 계 한 우 경 는 에 그 • 물 적 목 의 일 도 인 이 는 하 속 업 사 도 연 의 금 익 과 금 손 에 산입 야 여 하 다 한 .","a":"X","e":"업 기 소 중 이 약 계 간 기 이 1 년 미 만인 기 단 설 건 의 공 제 로 으 인한 금 익 과 금 손 을 업 기 계 회 준 기 에 따 라 그 물 적 목 의 인 일 도 이 속 하는 업 사 도 연 의 익 수 과 용 비 로 으 상 계 한 우 경 에는 그 물 적 목 의 일 도 인 이 속 하 업 사 도 연 의 금 익 과 손 는 금 에 입 산 할 수 있 다.","pg":273},{"id":1451,"ch":29,"n":39,"q":"법인이 비치. 기장한 장부가 없어 해당 사업연도 종료일까 지 실제로 소요된 총공사비 누적액 또는 작업시간 등을 확 인할 수 없는 경우에는 추계조사 방법에 의하여 계산한 수 익과 비용을 각각 해당 사업연도의 익금과 손금에 산입한다.","a":"X","e":"법인이 비치·기장한 장부가 없어 해당 사업연도 종료일까 지 실제로 소요된 총공사비 누적액 또는 작업시간 등을 확 인할 수 없는 경우에는 그 목적물의 인도일(용역제공의 경우 그 제공을 완료한 날이 속하는 사업연도의 익금과 손금에 각각 산입한다.","pg":274},{"id":1452,"ch":29,"n":40,"q":"금융보험업을 영위하는 법인이 수입하는 보험료 등(보험 료·부금·보증료 또는 수수료)의 귀속사업연도는 그 보험 료 등이 실제로 수입된 날이 속하는 사업연도로 하는 것을 원칙으로 하되, 선수입보험료 등을 제외한다.","a":"O","e":"","pg":274},{"id":1453,"ch":29,"n":41,"q":"제조업을 경영하는 법인이 결산을 확정할 때 이미 경과한 기간에 대응하는 이자「법인세법」에 따라 원천징수되는 이자 포함)를 해당 사업연도의 수익으로 계상한 경우 그 계상한 사업연도의 익금으로 한다.","a":"X","e":"제조업을 경영하는 법인이 결산을 확정할 때 이미 경과한 기간에 대응하는 이자「법인세법」에 따라 원천징수되는 이자 제외)를 해당 사업연도의 수익으로 계상한 경우 그 계상한 사업연도의 익금으로 한다.","pg":274},{"id":1454,"ch":29,"n":42,"q":"법인이 결산을 확정함에 있어서 이미 경과한 기간에 대응 하는 이자를 해당 사업연도의 손금으로 계상하였다 하더라 도 실제로 지급한 날이 속하는 사업연도의 손금에 산입된다.","a":"X","e":"법인이 결산을 확정할 때 이미 경과한 기간에 대응하는 이자 및 할인액(차입일부터 이자지급일이 1년을 초과하는 특수관계인과의 거래에 따른 이자 및 할인액은 제외)을 해당 사업연도의 손비로 계상한 경우 원천징수 여부와 상 관없이 그 계상한 사업연도의 손금으로 한다.","pg":274},{"id":1455,"ch":29,"n":43,"q":"이미 경과한 기간에 대한 미지급이자 10만원을 이자비용으 로 계상한 경우에는 세무조정이 필요 없다.","a":"O","e":"","pg":274},{"id":1456,"ch":29,"n":44,"q":"법인이 결산을 확정함에 있어서 차입일부터 이자지급일이 1 년을 초과하는 특수관계인과의 거래에 따른 기간 경과분 미 지급이자를 해당 사업연도의 손비로 계상한 경우에는 그 계 상한 사업연도의 손금으로 한다.","a":"X","e":"법인이 결산을 확정함에 있어서 차입일부터 이자지급일 이 1년을 초과하는 특수관계인과의 거래에 따른 기간 경 과분 미지급이자를 해당 사업연도의 손비로 계상한 경우 에는 그 계상한 사업연도의 손금으로 계상할 수 없다. 지 급이자에 대하여 기간 경과분 미지급이자를 인식하는 것 (발생주의)가 허용되지만, 이자지급일이 1년을 초과하는 특수관계인과의 거래에 따른 지급이자는 제외되기 때문 이다.","pg":275},{"id":1457,"ch":29,"n":45,"q":"잉여금 처분에 따른 배당소득의 귀속사업연도는 잉여금을 처분한 법인의 결산확정일이 속하는 사업연도로 한다.","a":"X","e":"잉여금 처분에 따른 배당소득의 귀속사업연도는 잉여금 을 처분한 법인의 잉여금처분결의일이 속하는 사업연도 로 한다.","pg":275},{"id":1458,"ch":29,"n":46,"q":"투자회사 등이 결산을 확정할 때 증권 등의 투자와 관련된 수익 중 이미 경과한 기간에 대응하는 이자 및 할인액과 배 당소득을 해당 사업연도의 수익으로 계상한 경우에는 결산 확정일이 속하는 사업연도의 익금으로 한다.","a":"X","e":"투자회사 등이 결산을 확정할 때 증권 등의 투자와 관련 된 수익 중 이미 경과한 기간에 대응하는 이자 및 할인액 과 배당소득을 해당 사업연도의 수익으로 계상한 경우에 는 그 계상한 사업연도의 익금으로 한다.","pg":275},{"id":1459,"ch":29,"n":47,"q":"금융회사 등이 금융채무 등 불이행자의 신용회복 지원과 채 권의 공동추심을 위하여 공동으로 출자하여 설립한 「자산유 동화에 관한 법률」에 따른 유동화전문회사로부터 수입하는 배당금은 실제로 지급받은 날이 속하는 사업연도의 익금에 산입한다.","a":"O","e":"","pg":275},{"id":1460,"ch":29,"n":48,"q":"법인이 자산을 임대하고 그 임대의 임대료 지급기간이 1년 이하인 경우 이미 경과한 기간에 대응하는 임대료 상당액과 비용은 이를 각각 해당 사업연도의 익금과 손금으로 하는 것이 원칙이다.","a":"X","e":"법인이 자산을 임대하고 그 임대의 임대료 지급기간이 1 년 이하인 경우 그 지급일(지급일이 정해지지 않은 경우 그 지급을 받은 날)을 귀속시기로 하는 것이 원칙이다.","pg":275},{"id":1461,"ch":29,"n":49,"q":"임대료 지급기간이 1년을 초과하는 장기임대료의 경우 그 지급일(지급일이 정해지지 않은 경우 그 지급을 받은 날)을 귀속시기로 한다.","a":"X","e":"장기임대료(임대료 지급기간이 1년을 초과하는 경우)의 경우 이미 경과한 기간에 대응하는 임대료 상당액과 비용 은 이를 각각 해당 사업연도의 익금과 손금으로 한다.","pg":276},{"id":1462,"ch":29,"n":50,"q":"법인이 2년 간 임대계약을 체결하고 1년마다 임대료를 지급 받기로 하였으나 사업연도 종료일 현재 이미 경과한 기간에 대응하는 임대료 상당액(지급약정기일이 도래하지 않아 미 수령)과 이에 대응하는 비용을 결산서에 계상하지 아니하였 을 경우 세무조정을 통해 해당 사업연도의 익금과 손금으로 각각 산입하여야 한다.","a":"X","e":"법인이 1년마다 임대료를 지급받기로 한 경우에는 단기임 대에 해당한다. 따라서 약정에 따라 손익을 인식하고, 결 산상 발생주의로 처리한 경우 발생주의 방식을 수용한다. 발생주의 방식은 장부에 계상한 경우에만 인정하는 방식 이므로 강제로 발생주의를 적용해야 하는 장기임대와 구 분하여야 한다. 따라서 이미 경과한 기간에 대응하는 임대료 상당액(지급 약정기일이 도래하지 않아 미수령)과 이에 대응하는 비용 을 결산서에 계상하지 아니하였을 경우 약정일이 도래하 지 않았으므로 세무조정해야 하는 것은 아니다.","pg":276},{"id":1463,"ch":29,"n":51,"q":"「부가가치세법」에 따라 영수증을 발급하는 법인이 금전등록 기를 설치·사용하는 경우 그 수입하는 물품대금과 용역대 가의 귀속사업연도는 그 금액이 실제로 수입된 사업연도로 해야 한다.","a":"X","e":"「부가가치세법」에 따라 영수증을 발급하는 법인이 금전등 록기를 설치 · 사용하는 경우 그 수입하는 물품대금과 용 역대가의 귀속사업연도는 그 금액이 실제로 수입된 사업 연도로 할 수 있다.","pg":276},{"id":1464,"ch":29,"n":52,"q":"법인이 사채를 발행하는 경우에 상환할 사채금액의 합계액 에서 사채발행가액(사채발행수수료와 사채발행비를 차감한 후의 가액) 합계액을 공제한 금액은 기업회계기준에 의한 사 채할인발행차금의 상각방법(유효이자율법)에 따라 손금에 산입할 수 없다.","a":"X","e":"법인이 사채를 발행하는 경우에 상환할 사채금액의 합계 액에서 사채발행가액(사채발행수수료와 사채발행비를 차 감한 후의 가액) 합계액을 공제한 금액은 기업회계기준에 의한 사채할인발행차금의 상각방법 (유효이자율)에 따 라 손금에 산입하여야 한다.","pg":276},{"id":1465,"ch":29,"n":53,"q":"받을어음을 배서양도하는 경우에는 기업회계기준에 의한 손 익인식 방법에 따라 관련 손익의 귀속사업연도를 정한다.","a":"O","e":"","pg":276},{"id":1466,"ch":29,"n":54,"q":"계약의 목적물을 인도하지 않고 목적물의 가액변동에 따른 차액을 금전으로 정산하는 파생상품의 거래로 인한 손익은 실제 대금지급일이 속하는 사업연도의 익금과 손금으로 한 다.","a":"X","e":"계약의 목적물을 인도하지 않고 목적물의 가액변동에 따 른 차액을 금전으로 정산하는 파생상품의 거래로 인한 손 익은 그 거래에서 정하는 대금결제일이 속하는 사업연도 의 익금과 손금으로 한다.","pg":277},{"id":1467,"ch":29,"n":55,"q":"개발비로 계상하였으나 해당 제품의 판매 또는 사용이 가능 한 시점이 도래하기 전에 개발을 취소하고 해당 개발비를 전액 손비로 계상한 경우 그 계상한 날이 속하는 사업연도 의 손금에 산입한다.","a":"X","e":"개발비로 계상하였으나 해당 제품의 판매 또는 사용이 가 능한 시점이 도래하기 전에 개발을 취소하고 해당 개발비 를 전액 손비로 계상한 경우와 해당 개발로부터 상업적인 생산 또는 사용을 위한 해당 재료 등 또는 용역을 개선한 결과를 식별할 수 없는 경우의 모든 요건을 충족하는 날 이 속하는 사업연도의 손금에 산입한다.","pg":277},{"id":1468,"ch":30,"n":1,"q":"법인이 매입한 자산 중 단기매매항목으로 분류된 금융자산 및 파생상품의 취득가액은 매입가액으로 하고 부대비용은 발생 당시의 손금에 산입한다.","a":"O","e":"","pg":278},{"id":1469,"ch":30,"n":2,"q":"출자법인이 현물출자로 인하여 피출자법인을 새로 설립하면 서 그 대가로 주식만 취득하는 경우 출자법인이 취득한 주 식의 취득가액은 취득한 주식의 시가로 한다.","a":"X","e":"출자법인이 현물출자로 인하여 피출자법인을 새로 설립 하면서 그 대가로 주식만 취득하는 경우 출자법인이 취득 한 주식의 취득가액은 현물출자한 순자산의 시가로 한다.","pg":278},{"id":1470,"ch":30,"n":3,"q":"합병·분할에 따라 취득한 자산이 적격합병· 적격분할에 해 당하는 경우에는 피합병법인·분할법인의 자산의 시가를 자 산의 취득가액으로 한다.","a":"X","e":"합병·분할에 따라 취득한 자산이 적격합병· 적격분할에 해당하는 경우에는 피합병법인 · 분할법인의 자산의 장부 가액을 자산의 취득가액으로 한다.","pg":278},{"id":1471,"ch":30,"n":4,"q":"적격물적분할에 따라 분할법인이 취득하는 주식 등의 취득 가액은 물적분할한 순자산의 장부가액이다.","a":"X","e":"적격물적분할에 따라 분할법인이 취득하는 주식 등의 취 득가액은 물적분할한 순자산의 시가로 한다.","pg":278},{"id":1472,"ch":30,"n":5,"q":"재고자산의 취득과 함께 매입한 국공채를 현재가치로 평가 하고 기업회계기준에 따라 그 국·공채의 매입가액과 현재 가치의 차액을 해당 재고자산의 취득가액으로 계상하면 세 법은 이를 인정한다.","a":"X","e":"유형자산의 취득과 함께 매입한 국공채를 현재가치로 평 가하고 기업회계기준에 따라 그 국·공채의 매입가액과 현재가치의 차액을 해당 유형자산의 취득가액으로 계상 하면 세법은 이를 인정한다.","pg":278},{"id":1473,"ch":30,"n":6,"q":"법인이 유형자산의 취득과 함께 매입한 국공채의 매입가액 과 현재가치의 차이를 해당 유형자산의 취득가액으로 계상 을 하든 취득가액으로 계상하지 않든 이에 대한 세무조정은 필요 없다.","a":"O","e":"","pg":278},{"id":1474,"ch":30,"n":7,"q":"유형자산의 취득과 함께 공채를 매입하는 경우 기업회계기 준에 따라 그 공채의 매입가액과 현재가치의 차액을 해당 유형자산의 취득가액으로 계상하더라도 그 차액은 취득가액 에 포함하지 아니한다.","a":"X","e":"유형자산의 취득과 함께 공채를 매입하는 경우 기업회계 기준에 따라 그 공채의 매입가액과 현재가치의 차액을 해 당 유형자산의 취득가액으로 계상하였다면 그 차액은 취 득가액에 포함한다.","pg":279},{"id":1475,"ch":30,"n":8,"q":"「대기관리권역의 대기환경개선에 관한 특별법」에 따라 정부 로부터 무상으로 할당받은 배출허용총량의 취득가액은 영 (0)원으로 한다.","a":"O","e":"","pg":279},{"id":1476,"ch":30,"n":9,"q":"법인이 특수관계인인 개인으로부터 유가증권을 시가보다 낮 은 가액으로 매입하는 경우 시가와 그 매입가액의 차액을 손금에 산입한다.","a":"X","e":"법인이 특수관계인인 개인으로부터 유가증권을 시가보다 낮은 가액으로 매입하는 경우 시가와 그 매입가액의 차액 을 익금에 산입한다.","pg":279},{"id":1477,"ch":30,"n":10,"q":"법인이 특수관계인 법인으로부터 시가 3천만원의 유가증권 을 2천만원에 매입한 경우 해당 유가증권의 취득가액은 3천 만원으로 한다.","a":"X","e":"법인이 특수관계인 법인으로부터 시가 3천만원의 유가증 권을 2천만원에 매입한 경우 해당 유가증권의 취득가액 은 2천만원으로 한다.","pg":279},{"id":1478,"ch":30,"n":11,"q":"특수관계인 외의 자로부터 정당한 사유 없이 유형자산을 취 득하면서 정상가액보다 높은 가격으로 매입하고 실제 지급 한 매입가액을 장부상 취득원가로 계상한 경우, 그 실제 매 입가액을 세무상 취득가액으로 인정한다.","a":"X","e":"특수관계인 외의 자로부터 정당한 사유 없이 유형자산 을 취득하면서 정상가액보다 높은 가격으로 매입하고 실 제 지급한 매입가액을 장부상 취득원가로 계상한 경우. 그 실제 매입가액을 세무상 취득가액으로 인정하지 않는 다. 따라서 정상가액을 초과하는 매입가액은 <손금산입> (△유보) 조정을 통해 자산의 장부가액을 감액하여야 한 다.","pg":279},{"id":1479,"ch":30,"n":12,"q":"시가 10억원인 토지를 정당한 사유 없이 특수관계가 없는 자로부터 14억원에 매입한 경우의 세법상 토지 취득가액은 시가인 10억원이다.","a":"X","e":"특수관계인이 아닌 자로부터 고가매입한 경우로서 그 매 입가액이 시가의 130%를 초과하여 취득한 경우 시간의 130%만큼을 취득가액으로 계상하고, 이을 초과하는 금 액은 의제기부금으로 본다. 따라서 시가 10억원인 토지를 정당한 사유 없이 특수관계가 없는 자로부터 14억원에 매 입한 경우의 세법상 토지 취득가액은 시가인 13억원이다. 비교 특수관계인이 아닌 자로부터 고가매입한 경우로서 그 매입가 액이 시가의 130% 이내인 경우에는 그 매입가액을 취득가액으로 함","pg":280},{"id":1480,"ch":30,"n":13,"q":"유형자산 간의 교환으로 취득한 자산의 취득원가는 교환으 로 제공한 자산의 교환 당시의 시가로 한다.","a":"X","e":"유형자산 간의 교환으로 취득한 자산의 취득원가는 교환 으로 인하여 취득한 자산의 취득 당시의 시가로 한다. 참고 세법상으로는 상업적 실질 유무를 따질 필요 없이 해당 자산 의 취득 당시 시가를 취득가액으로 함","pg":280},{"id":1481,"ch":30,"n":14,"q":"동종자산과 교환으로 취득하는 유형자산의 취득가액은 교환 으로 제공한 자산의 장부가액을 자산의 취득가액으로 한다.","a":"X","e":"동종자산과 교환으로 취득하는 유형자산의 취득가액은 교환으로 인하여 취득한 자산의 취득 당시의 시가로 한 다.","pg":280},{"id":1482,"ch":30,"n":15,"q":"자산을 「법인세법」에 따른 장기할부조건 등으로 취득하여 발생한 채무를 기업회계기준에 따라 현재가치로 평가하여 현재가치할인차금을 계상한 경우의 당해 현재가치할인차금 은 자산의 취득가액에 포함한다.","a":"X","e":"자산을 「법인세법」에 따른 장기할부조건 등으로 취득하여 발생한 채무를 기업회계기준에 따라 현재가치로 평가하 여 현재가치할인차금을 계상한 경우의 당해 현재가치할 인차금은 자산의 취득가액에 포함하지 않는다.","pg":280},{"id":1483,"ch":30,"n":16,"q":"법인이 장기금전대차거래에서 발생한 채권에 대하여 기업회 계기준에 따라 현재가치로 평가하여 현재가치할인차금을 계 상한 경우 「법인세법」은 이를 인정하므로 세무조정이 없다.","a":"X","e":"법인이 장기금전대차거래에서 발생한 채권에 대하여 기 업회계기준에 따라 현재가치로 평가하여 현재가치할인차 금을 계상한 경우 「법인세법」은 이를 인정하지 않고 명목 가액만을 인정하므로 세무조정을 해야 한다.","pg":280},{"id":1484,"ch":30,"n":17,"q":"법인이 본사건물을 신축하기 위하여 토지를 10억원에 매입 하고 해당 토지의 취득을 위한 특정차입금 이자 1천만원을 장부상 이자비용으로 계상한 경우 해당 토지의 세법상 취득 가액은 10억 1천만원이다.","a":"O","e":"","pg":281},{"id":1485,"ch":30,"n":18,"q":"원재료 등의 수입으로 인해 부담하는 연지급수입이자를 취 득가액에 산입하지 않고 기업회계기준에 따라 결산서에 지 급이자로 계상하면 세무조정을 하여 수입 원재료의 취득가 액에 산입한다.","a":"X","e":"세법에서는 원재료 등의 수입으로 인해 부담하는 연지급 수입이자를 취득부대비용으로 보아 원재료 등의 취득가 액에 산입하는 것을 원칙으로 한다. 하지만 연지급수입이 자를 취득가액에 산입하지 않고 기업회계기준에 따라 결 산서에 지급이자로 계상하면 이를 인정한다.","pg":281},{"id":1486,"ch":30,"n":19,"q":"금융기관이 매매목적으로 보유하고 있는 유가증권은 재고자 산에 해당하므로 세법상 재고자산의 평가방법을 적용한다.","a":"X","e":"금융기관이 매매목적으로 보유하고 있는 유가증권은 세 법상 유가증권 평가방법을 적용한다.","pg":281},{"id":1487,"ch":30,"n":20,"q":"법인의 재고자산 평가는 해당 재고자산 종류가 같은 경우 동일한 평가방법에 의해 평가해야 한다.","a":"X","e":"법인의 재고자산 평가는 자산과목별로 구분하여 종류 별· 영업장별로 각각 다른 방법으로 평가할 수 있다.","pg":281},{"id":1488,"ch":30,"n":21,"q":"재고자산 평가방법을 원가법으로 신고한 법인이 재고자산의 시가하락(파손·부패 등의 사유로 인한 것이 아님)으로 재고 자산평가손실을 계상한 경우 「법인세법」상 세무조정을 필 요로 하지 않는다.","a":"X","e":"파손 및 부패 등의 사유로 재고자산을 정상가격으로 판매 할 수 없는 것이 있는 경우에만 원가법으로 신고한 경우 에도 해당 재고자산을 사업연도종료일 현재 처분가능한 시가로 평가한 가액으로 그 장부가액을 감액할 수 있다. 즉, 파손·부패 등 외관상 명백한 경우에 한하므로 재고 자산 평가방법을 원가법으로 신고한 법인이 그 외의 사유 로 재고자산 평가손실을 계상한 경우 「법인세법」상 이를 손금으로 인정하지 않기 때문에 세무조정을 해야 한다.","pg":281},{"id":1489,"ch":30,"n":22,"q":"유가증권 중 주식의 평가는 개별법. 총평균법. 이동평균법 중 법인이 납세지 관할 세무서장에게 신고한 방법에 의한다.","a":"X","e":"유가증권 중 채권의 평가는 개별법. 총평균법. 이동평균 법 중 법인이 납세지 관할 세무서장에게 신고한 방법에 의한다. 비교 유가증권 중 주식의 평가는 총평균법이동평균법 중 법인이 납 세지 관할 세무서장에게 신고한 방법에 의함","pg":282},{"id":1490,"ch":30,"n":23,"q":"「자본시장과 금융투자업에 관한 법률」에 따른 투자회사 등 (같은 법에 따른 환매금지형집합투자기구는 제외)이 보유하 는 집합투자재산은 원가법에 따라 평가한다.","a":"X","e":"「자본시장과 금융투자업에 관한 법률」에 따른 투자회사 등(같은 법에 따른 환매금지형집합투자기구는 제외)이 보 유하는 집합투자재산은 시가법에 따라 평가한다.","pg":282},{"id":1491,"ch":30,"n":24,"q":"주식을 발행한 법인이 파산한 경우 유가증권의 장부가액을 사업연도종료일 현재의 시가(발행법인별 보유주식총액을 시 가로 평가한 가액이 1,000원 이하인 경우에는 1,000원)로 평 가한 가액으로 감액사유가 발생한 사업연도에 손비로 계상 한 경우에만 감액할 수 있다. ○","a":"O","e":"","pg":282},{"id":1492,"ch":30,"n":25,"q":"주권상장법인이 발행한 주식으로 그 발행법인이 부도가 발 생한 경우 사업연도 종료일 현재 시가로 평가한 가액으로 장부가액을 감액할 수 있다. 이 경우 주식 발행법인별로 보유주식 총액을 시가로 평가한 가액이 1천원 이하인 경우에는 전액 감액할 수 있다.","a":"X","e":"주권상장법인이 발행한 주식으로 그 발행법인이 부도가 발생한 경우 사업연도 종료일 현재 시가로 평가한 가액으 로 장부가액을 감액할 수 있다. 이 경우 주식 발행법인별로 보유주식 총액을 시가로 평가 한 가액이 1천원 이하인 경우에는 1천원을 시가로 한다.","pg":282},{"id":1493,"ch":30,"n":26,"q":"주권상장법인이 발행한 주식으로서 그 주식의 발행법인이 기업구조조정촉진법」에 따른 부실징후기업이 된 경우 「법 인세법」상 영리내국법인이 보유하는 자산에 대한 평가손실 을 허용하지 않는다.","a":"X","e":"주권상장법인이 발행한 주식으로서 그 주식의 발행법인 이 기업구조조정촉진법」에 따른 부실징후기업이 된 경우 해당 주식은 감액사유가 인정되고, 사유발생일이 속하는 사업연도에 감액손실을 계상한 경우 평가손실을 허용한 다. 다만, 보유주식 총액을 시가로 평가한 가액이 1천원 이하인 경우에는 1천원을 시가로 한다.","pg":282},{"id":1494,"ch":30,"n":27,"q":"신설 법인이 재고자산 또는 유가증권의 평가방법을 신고할 때에는 설립일이 속하는 사업연도종료일 이전 3개월이 되 는 날까지 재고자산과 유가증권 평가방법을 신고해야 한다.","a":"X","e":"신설 법인이 재고자산 또는 유가증권의 평가방법을 신고 할 때에는 설립일이 속하는 사업연도의 법인세과세표준 신고기한까지 재고자산과 유가증권평가방법을 신고해야 한다.","pg":283},{"id":1495,"ch":30,"n":28,"q":"법인이 재고자산 평가방법을 법에 정한 신고기한이 경과된 후에 신고한 경우에는 그 신고일이 속하는 사업연도의 직전 사업연도까지는 무신고로 보아 「법인세법 시행령」에 따른 평가방법(무신고 시 평가방법)을 적용하고, 신고한 사업연도 부터 법인이 신고한 평가방법을 적용한다.","a":"X","e":"법인이 재고자산 평가방법을 법에 정한 신고기한이 경과 된 후에 신고한 경우에는 신고일이 속하는 사업연도까지 는 무신고로 보아 「법인세법 시행령」에 따른 평가방법(무 신고 시 평가방법)을 적용하고, 그 후 사업연도부터 법인 이 신고한 평가방법을 적용한다.","pg":283},{"id":1496,"ch":30,"n":29,"q":"유가증권의 평가방법을 신고한 법인이 그 평가방법을 변경 하고자 하는 경우, 변경할 평가방법을 적용하고자 하는 사업 연도의 종료일 이전 3개월이 되는 날까지 관할 세무서장에 게 변경신고를 하고 승인을 받아야 한다.","a":"X","e":"유가증권의 평가방법을 신고한 법인이 그 평가방법을 변 경하고자 하는 경우, 변경할 평가방법을 적용하고자 하는 사업연도의 종료일 이전 3개월 되는 날까지 변경신고서 를 관할 세무서장에게 제출하여야 하는데 승인을 요하지 는 않는다.","pg":283},{"id":1497,"ch":30,"n":30,"q":"제23기(2023.1.1. ~ 202.12.31.)부터 「법인세법」상 재고자산 의 평가방법을 선입선출법(적법하게 신고)에서 총평균법으 로 변경할 경우, 법인은 재고자산 등 평가방법변경신고서를 2023년 3월 31일까지 납세지 관할 세무서장에게 제출해야 한다.","a":"X","e":"제23기(2023.1.1. ~ 2023.12.31.)부터 「법인세법」상 재 고자산의 평가방법을 선입선출법(적법하게 신고)에서 총 평균법으로 변경할 경우, 법인은 재고자산등평가방법변 경신고서를 2023년 9월 30일까지 납세지 관할 세무서장 에게 제출해야 한다.","pg":283},{"id":1498,"ch":30,"n":31,"q":"재고자산(부동산 포함) 평가방법을 법정신고기한 내에 신고 하지 않은 경우 선입선출법에 의하여 평가한다.","a":"X","e":"재고자산(부동산 제외) 평가방법을 법정신고기한 내에 신 고하지 않은 경우 선입선출법에 의하여 평가한다.","pg":283},{"id":1499,"ch":30,"n":32,"q":"내국법인이 「법인세법 시행령」에 따른 기한 내에 관할 세무 서장에게 유가증권의 평가방법을 신고하지 아니한 경우에는 개별법(채권의 경우에 한한다). 총평균법 및 이동평균법 중 가장 큰 금액을 해당 유가증권의 평가액으로 한다.","a":"X","e":"내국법인이 「법인세법 시행령」에 따른 기한 내에 관할 세 무서장에게 유가증권의 평가방법을 신고하지 아니한 경 우에는 총평균법에 의하여 평가한다.","pg":283},{"id":1500,"ch":30,"n":33,"q":"법인이 매매를 목적으로 소유하고 있는 부동산의 평가방법 을 「법인세법 시행령」에 따른 기한 내에 신고하지 아니한 경 우 납세지 관할 세무서장이 선입선출법에 의하여 평가한다.","a":"X","e":"법인이 매매를 목적으로 소유하고 있는 부동산의 평가방 법을 「법인세법 시행령」에 따른 기한 내에 신고하지 아니 한 경우 납세지 관할 세무서장이 개별법에 의하여 평가한 다.","pg":284},{"id":1501,"ch":30,"n":34,"q":"법인이 재고자산 평가와 관련하여 신고한 평가방법 이외의 방법으로 평가한 경우에는 무신고 시의 평가방법과 당초에 적법하게 신고한 방법 중 평가가액이 작은 평가방법에 의한 다.","a":"X","e":"법인이 재고자산 평가와 관련하여 신고한 평가방법 이외 의 방법으로 평가한 경우에는 무신고 시의 평가방법과 당 초에 적법하게 신고한 방법 중 평가가액이 큰 평가방법에 의한다.","pg":284},{"id":1502,"ch":30,"n":35,"q":"법인이 평가방법의 변경신고기한 내에 변경신고를 하지 않 고 유가증권평가방법을 임의로 변경한 경우 당초에 적법하 게 신고한 방법과 선입선출법에 의해 평가한 가액 중 큰 금 액으로 한다.","a":"X","e":"법인이 평가방법의 변경신고기한 내에 변경신고를 하지 않고 유가증권평가방법을 임의로 변경한 경우 당초에 적 법하게 신고한 방법과 총평균법에 의해 평가한 가액 중 큰 금액으로 한다.","pg":284},{"id":1503,"ch":30,"n":36,"q":"내국법인이 보유하는 「보험업법」또는 그 밖의 법률에 따른 유형자산 및 무형자산 등의 장부가액을 증액 또는 감액 평 가한 경우에는 그 평가일이 속하는 사업연도 및 그 후의 사 업연도의 소득금액을 계산할 때 그 장부가액은 평가한 후의 금액으로 한다.","a":"X","e":"내국법인이 보유하는 「보험업법」 또는 그 밖의 법률에 따 른 유형자산 및 무형자산 등의 장부가액을 증액하는 것은 허용된다. 따라서 증액 평가한 경우 그 평가일이 속하는 사업연도 및 그 후의 사업연도의 소득금액을 계산할 때 그 장부가액은 평가한 후의 금액으로 한다. 그러나 감액평가는 인정되지 않는다.","pg":284},{"id":1504,"ch":30,"n":37,"q":"「보험업법」이나 그 밖의 법률에 따른 유형자산의 평가손실 은 평가일이 속하는 사업연도의 소득금액을 계산할 때 손금 에 산입한다.","a":"X","e":"「보험업법」이나 그 밖의 법률에 따른 유형자산의 평가이 익은 평가일이 속하는 사업연도의 소득금액을 계산할 때 익금에 산입한다. 그러나 평가손실은 허용되지 않는다.","pg":284},{"id":1505,"ch":30,"n":38,"q":"「법인세법 시행령」 제61조제2항 제1호부터 제7호까지의 금 융회사 등이 보유하는 화폐성 외화자산은 취득일이나 사업 연도 종료일 현재의 매매기준율 중 회사가 선택한 환율을 적용하여 평가한다.","a":"X","e":"화폐성 외화자산과 부채는 법인이 평가하는 방법을 선택 하여 신고한 경우에만 사업연도 종료일의 매매기준율로 평가하고, 평가하는 방법을 선택하지 않았거나 평가방법 을 신고하지 않은 경우에는 취득일 또는 발생일의 환율을 적용한다.","pg":284},{"id":1506,"ch":30,"n":39,"q":"제조업을 영위하는 법인이 보유하는 화폐성 외화자산 • 부채 의 평가방법을 관할세무서장에게 신고하여 적용하기 이전 사업연도의 경우 사업연도 종료일 현재의 매매기준율로 평 가하여야 한다.","a":"X","e":"제조업을 영위하는 법인이 보유하는 화폐성 외화자산. 부채의 평가방법을 관할세무서장에게 신고하여 적용하기 이전 사업연도의 경우 평가하지 않은 방법을 적용한다. 따라서 취득일 또는 발생일의 환율을 적용한다.","pg":285},{"id":1507,"ch":30,"n":40,"q":"「은행법」에 의한 인가를 받아 설립된 내국법인인 은행이 보 유하는 화폐성외화부채는 「법인세법령」상 취득일 또는 발생 일의 외국환거래규정에 따른 매매기준율 또는 재정된 매매 기준율로 평가하는 방법을 선택하여 적용할 수 있다.","a":"X","e":"「은행법」에 의한 인가를 받아 설립된 내국법인인 은행이 보유하는 화폐성외화부채는 「법인세법령상 사업연도 종 료일 현재의 매매기준율 또는 재정된 매매기준율로 평가 하는 방법을 적용하여야 한다(강제평가).","pg":285},{"id":1508,"ch":30,"n":41,"q":"내국법인이 상환받거나 상환하는 외화채권·채무의 원화금 액과 원화기장액의 차익 또는 차손은 당해 사업연도의 익금 또는 손금에 이를 산입할 수 없다.","a":"X","e":"내국법인이 상환받거나 상환하는 외화채권·채무의 원 화금액과 원화기장액의 차익 또는 차손은 해당 사업연도 의 익금 또는 손금에 이를 산입한다. 다만, 한국은행법」 에 따른 한국은행의 외화채권·채무 중 외화로 상환받거 나 상환하는 금액의 환율변동분은 한국은행이 정하는 방 식에 따라 해당 외화금액을 매각하여 원화로 전환한 사업 연도의 익금 또는 손금에 산입한다.","pg":285},{"id":1509,"ch":30,"n":42,"q":"상품매매업을 영위하는 법인이 보유하는 화폐성 외화자산. 부채에 대한 평가방법을 사업연도 종료일 현재의 매매기준 율로 신고하면 이후에는 변경할 수 없으며 신고된 평가방법 을 계속하여 적용하여야 한다.","a":"X","e":"신고한 평가방법은 그 후 사업연도에도 계속하여 적용하 되, 신고한 평가방법을 적용한 사업연도를 포함하여 5개 사업연도가 지난 후에는 다른 방법으로 신고를 하여 변경 된 평가방법을 적용할 수 있다.","pg":285},{"id":1510,"ch":30,"n":43,"q":"법인이 신고한 화폐성 외화자산부채의 평가방법은 그 후 의 사업 연도에도 계속하여 적용하여야 한다. 다만, 신고한 평가방법을 적용한 사업연도를 포함하여 3개 사업연도가 지 난후에는 다른 방법으로 신고하여 변경된 평가방법을 적용 할 수 있다.","a":"X","e":"법인(특정금융회사 및 은행제외)이 신고한 화폐성 외화자 산·부채의 평가방법은 그 후의 사업연도에도 계속하여 적용하여야 한다. 다만, 신고한 평가방법을 적용한 사업 연도를 포함하여 5개 사업연도가 지난후에는 다른 방법 으로 신고하여 변경된 평가방법을 적용할 수 있다.","pg":285},{"id":1511,"ch":30,"n":44,"q":"「법인세법」상 「은행법」 및 기타 법령에 의한 인가를 받아 설 립한 금융기관이 보유한 통화선도·통화스왑·환변동보험 에 대해 법인이 납세지 관할 세무서장에게 신고한 평가방법 은 신고한 평가방법을 적용한 사업연도를 포함하여 5개 사 업연도가 지난 후에는 다른 방법으로 신고를 하여 변경된 평가방법을 적용할 수 있다.","a":"X","e":"「법인세법」상 「은행법」 및 기타 법령에 의한 인가를 받아 설립한 금융기관이 보유한 통화선도 · 통화스왑·환변동 보험에 대해 법인이 납세지 관할 세무서장에게 신고한 명 가방법은 그 후 사업인도에도 계속하여 적용해야 한다. 비교 일반법인의 경우 신고한 평가방법을 적용한 사업연도를 포함하 여 5개 사업연도가 지난 후에는 다른 방법으로 신고를 하여 변경된 평가방법을 적용할 수 있음. 그러나 금융기관 등 특정 법인의 경우 5 년 후 변경된 평가방법을 적용할 수 있다는 규정이 없음.","pg":286},{"id":1512,"ch":30,"n":45,"q":"「특정 금융거래정보의 보고 및 이용 등에 관한 법률」 제2조 제3호에 따른 가상자산은 개별법에 따라 평가해야 한다.","a":"X","e":"2027.1.1. 전 거래분에 대하여는 선입선출법으로 평가하 고, 2027.1.1. 이후 거래분에 대하여는 동평균법에 따라 평가한다.","pg":286},{"id":1513,"ch":31,"n":1,"q":"일반적인 유형자산의 감가상각은 결산조정사항이므로 감가 상각비를 결산서에 반영한 경우에 한하여 손금으로 인정되 지만, 무형자산의 감가상각비는 신고조정사항이므로 과소계 상액은 세무조정 시 손금산입하면 인정된다.","a":"X","e":"무형자산의 감가상각비도 유형자산과 마찬가지로 결산조 정사항에 해당한다.","pg":287},{"id":1514,"ch":31,"n":2,"q":"장기할부조건으로 매입한 자산 중 법인이 해당 자산의 가액 전액을 자산으로 계상하고, 사업에 사용하는 경우에는 대금 청산 또는 소유권 이전 여부에 관계없이 이를 감가상각자산 에 포함한다.","a":"O","e":"","pg":287},{"id":1515,"ch":31,"n":3,"q":"기업회계기준에 따른 금융리스자산은 리스회사의 감가상각 자산이다.","a":"X","e":"기업회계기준에 따른 금융리스자산은 리스이용자의 감가 상각자산이지만, 금융리스 외의 리스자산은 리스회사의 감가상각자산으로 한다.","pg":287},{"id":1516,"ch":31,"n":4,"q":"건설중인자산은 감가상각 대상이 아니나 일부가 완성되어 해당 부분이 사업에 사용되는 경우 그 부분은 감가상각자산 으로 본다.","a":"O","e":"","pg":287},{"id":1517,"ch":31,"n":5,"q":"취득 후 사용하지 않고 보관 중인 기계 및 장치와 일시적 조 업중단에 따른 유휴설비는 감가상각자산에 포함되지 않는 다.","a":"X","e":"취득 후 사업에 사용하지 않고 보관 중인 것은 감가상각 자산에 포함되지 않는다. 하지만 일시적 조업중단 등의 사유로 가동되지 않고 있는 유휴설비는 감가상각자산으 로 본다.","pg":287},{"id":1518,"ch":31,"n":6,"q":"시인부족액은 그 후 사업연도의 상각부인액에 이를 충당하 지 못한다.","a":"O","e":"","pg":287},{"id":1519,"ch":31,"n":7,"q":"감가상각시부인계산을 함에 있어서 한 자산의 상각부인액과 다른 자산의 시인부족액은 서로 상계가 가능하다.","a":"X","e":"시부인계산은 법인이 각 사업연도에 감가상각비를 손비 로 계상하거나 손금에 산입한 경우에는 개별 자산별로 한 다. 따라서 한 자산의 상각부인액과 다른 자산의 시인부 족액은 시로 상계가 할 수 없다.","pg":288},{"id":1520,"ch":31,"n":8,"q":"법인이 손비로 계상한 감가상각비가 2,000만원이고 상각범 위액이 2,400만원인 경우, 그 차액에 해당하는 400만원은 그 후 사업연도의 상각부인액에 충당한다.","a":"X","e":"당기 발생한 시인부족액은 전기 이전 상각부인액이 있는 경우 손금으로 추인이 가능하지만, 이후 사용연도의 상각 부인액에 충당한 수는 없다.","pg":288},{"id":1521,"ch":31,"n":9,"q":"법인이 감가상각비를 손비로 계상하거나 손금에 산입하는 경우에는 해당 감가상각자산의 장부가액을 직접 감액하는 직접상각법 또는 장부가액을 감액하지 않고 감가상각누계액 으로 계상하는 간접상각법 중 선택해야 한다.","a":"O","e":"","pg":288},{"id":1522,"ch":31,"n":10,"q":"감가상각부인액이 있는 법인이 그 후의 사업연도에 감가상 각비를 계상하지 않은 경우에는 손금산입 세무조정을 할 수 없다.","a":"X","e":"상각부인액은 그 후의 사업연도에 해당 법인이 손비로 계 상한 감가상각비가 상각범위액에 미달하는 경우에 그 미 달하는 금액을 한도로 손금에 산입하며, 이 경우 법인이 감가상각비를 손비로 계상하지 않은 경우에도 상각범위 액을 한도로 그 상각부인액을 손금에 산입한다.","pg":288},{"id":1523,"ch":31,"n":11,"q":"법인이 개발비를 무형자산으로 계상하지 아니하고 그 지급 이 확정된 사업연도의 손비로 계상한 경우에는 개발비를 즉 시상각한 것으로 보아 상각범위액을 계산하고 시부인계산한 다.","a":"O","e":"회사가 자산의 취득가액을 구성하는 항목(ex. 취득세, 자 본적 지출액)을 비용으로 처리한 경우, 해당 금액을 감가 상각비로서 손비로 계상한 것으로 보아 시부인계산한다.","pg":288},{"id":1524,"ch":31,"n":12,"q":"내국법인이 감가상각자산을 취득하기 위하여 지출한 금액을 손비로 계상한 경우에는 전액 손금불산입으로 조정하고 유 보로 처분한다.","a":"X","e":"내국법인이 감가상각자산을 취득하기 위하여 지출한 금 액을 손비로 계상한 경우에는 해당 사업연도의 소득금액 을 계산할 때 감가상각비로 계상한 것으로 보아 상각범위 액을 계산한다.","pg":288},{"id":1525,"ch":31,"n":13,"q":"취득가액이 거래단위별로 100만원 이하인 사업용 감가상각 자산으로 고유업무 성질상 대량으로 보유하는 자산에 대해 서는 감가상각시부인 계산 없이 손금으로 인정한다.","a":"X","e":"취득가액이 거래단위별로 100만원 이하인 감가상각자산 에 대해서는 해당 감가상각자산을 사업에 사용한 날이 속 하는 사업연도의 손비로 계상한 것에 한정하여 손금으로 전액 인정한다. 다만, 그 고유업무의 성질상 대량으로 보 유하는 자산과 그 사업의 개시. 확장을 위하여 취득한 자 산에 대해서는 그러하지 아니하다.","pg":289},{"id":1526,"ch":31,"n":14,"q":"시험기기 1,000,000원과 가스기기 1,500,000원을 한 거래 처에서 구입하면서 2,500,000원을 지급하고 비용으로 처리 하는 경우 세법상 모두 손금으로 인정된다.","a":"O","e":"","pg":289},{"id":1527,"ch":31,"n":15,"q":"개인용 컴퓨터 2,000,000원과 전기기구 2,500,000원을 한 거래처에서 구입하면서 4,500,000원을 지급하고 비용으로 처리하는 경우 세법상 모두 손금으로 인정되는 것은 아니다.","a":"X","e":"개인용 컴퓨터 2,000,000원과 전기기구 2,500,000원을 한 거래처에서 구입하면서 4,500,000원을 지급하고 비 용으로 처리하는 경우 세법상 모두 손금으로 인정된다. 개인용 컴퓨터와 전기기구는 금액과 무관하게 즉시상각 의제규정을 적용하지 않고 즉시비용처리가 인정되는 특 정자산에 해당한다.","pg":289},{"id":1528,"ch":31,"n":16,"q":"휴대용 전화기 및 개인용 컴퓨터를 그 고유업무의 성질상 대량으로 취득한 날이 속하는 사업연도의 손비로 계상한 것 에 한정하여 손금에 산입한다.","a":"X","e":"휴대용 전화기 및 개인용 컴퓨터를 그 고유업무의 성질상 대량으로 취득하여 그 사업에 사용한 날이 속하는 사업연 도의 손비로 계상한 것에 한정하여 손금에 산입한다.","pg":289},{"id":1529,"ch":31,"n":17,"q":"내국법인이 각 사업연도에 지출한 수선비로서 개별 자산별 로 600만원 미만인 자본적 지출에 해당하는 금액을 해당 사 업연도의 손비로 계상한 경우에는 상각계산의 기초가액을 계산할 때 해당 수선비를 자본적 지출액에 포함하여 상각범 위액을 계산한다.","a":"X","e":"내국법인이 각 사업연도에 지출한 수선비로서 개별 자산 별로 600만원 미만인 자본적 지출에 해당하는 금액을 해 당 사업연도의 손비로 계상한 경우 시부인계산 없이 그 즉시상각의제액을 손금으로 전액 인정한다.","pg":289},{"id":1530,"ch":31,"n":18,"q":"개별자산별로 수선비로 지출한 금액이 직전 사업연도 종료 일 현재 재무상태표상의 취득가액의 100분의 5에 미달하는 경우로서 그 수선비를 해당 사업연도의 손비로 계상한 경우 에는 손금에 산입한다.","a":"X","e":"개별자산별로 수선비로 지출한 금액이 직전 사업연도 료일 현재 재무상태표상의 취득가액의 100분의 5와 CO) 만원 중 큰 금액에 미달하는 경우로서 그 수선비를 해당 사업연도의 손비로 계상한 경우에는 손금에 산입한다.","pg":290},{"id":1531,"ch":31,"n":19,"q":"시설의 개체·기술의 낙후로 인하여 생산설비의 일부를 폐 기한 경우에는 해당 자산의 장부가액에서 1,000원을 공제한 금액을 폐기일이 속하는 사업연도의 손금에 산입해야 한다.","a":"X","e":"시설의 개체 · 기술의 낙후로 인하여 생산설비의 일부를 폐기한 경우에는 해당 자산의 장부가액에서 1,000원을 공제한 금액을 폐기일이 속하는 사업연도의 손금에 산입 할 수 있다.","pg":290},{"id":1532,"ch":31,"n":20,"q":"시설개체 또는 기술의 낙후로 인하여 생산설비의 일부를 폐 기한 경우 당해 자산의 장부가액을 폐기일이 속하는 사업연 도의 손금에 산입할 수 있다.","a":"X","e":"시설개체 또는 기술의 낙후로 인하여 생산설비의 일부를 폐기한 경우 당해 자산의 장부가액에서 1천원을 공제한 금액을 폐기일이 속하는 사업연도의 손금에 산입할 수 있 다.","pg":290},{"id":1533,"ch":31,"n":21,"q":"감가상각자산이 진부화, 물리적 손상 등에 따라 시장가치가 급격히 하락하여 법인이 기업회계기준에 따라 손상차손을 계상한 경우(천재지변 · 화재 등 법령으로 정하는 경우는 제 외)에는 해당 손상차손이 「법인세법」에 따른 상각범위액을 초과하더라도 이를 전액 손금에 산입한다.","a":"X","e":"감가상각자산이 진부화, 물리적 손상 등에 따라 시장가치 가 급격히 하락하여 법인이 기업회계기준에 따라 손상차 손을 계상한 경우(천재지변, 화재 등 법령으로 정하는 경 우는 제외)에는 해당 손상차손을 감가상각비로서 손비로 계상한 것으로 보아 시부인계산한다. 즉 상각범위액을 초 과한 금액은 손금에 산입하지 아니한다.","pg":290},{"id":1534,"ch":31,"n":22,"q":"수익적 지출이란 법인이 소유하는 감가상각자산의 내용연수 를 연장시키거나 해당 자산의 가치를 현실적으로 증가시키 기 위하여 지출한 수선비를 말한다.","a":"X","e":"자본적 지출이란 법인이 소유하는 감가상각자산의 내용 연수를 연장시키거나 해당 자산의 가치를 현실적으로 증 가시키기 위하여 지출한 수선비를 말한다.","pg":290},{"id":1535,"ch":31,"n":23,"q":"건물의 양도가액에서 공제할 취득가액에 포함되는 자본적 지출은 법인이 소유하는 유형자산의 원상을 회복하거나 능 유지를 위하여 지출한 비용이다.","a":"X","e":"유형자산의 원상을 회복하거나 능률유지를 위하여 지출 한 비용은 수익적지출이다. 자본적지출은 감가상각자산의 내용연수를 연장시키거나 그 자산의 가치를 현실적으로 증가시키는 수선비를 의미 한다.","pg":290},{"id":1536,"ch":31,"n":24,"q":"지반침하를 방지하기 위하여 기계장치에 직접적으로 연결된 기초공사를 수행함에 따른 비용은 자산가액에 포함하지 않 지만, 재해를 입은 자산에 대한 외장의 복구비용은 자산가액 에 포함되어 감가상각의 대상이 된다.","a":"X","e":"지반침하를 방지하기 위하여 기계장치에 직접적으로 연 결된 기초공사를 수행함에 따른 비용은 자산가액에 포함 되어 감가상각대상이 되지만, 재해를 입은 자산에 대한 외장의 복구비용은 자산가액에 포함되지 않는다.","pg":291},{"id":1537,"ch":31,"n":25,"q":"재해 등으로 인하여 멸실 또는 훼손되어 본래의 용도에 이 용할 가치가 없는 건축물. 기계·설비 등의 복구 및 유리의 삽입에 대한 지출은 자본적 지출에 포함한다.","a":"X","e":"재해 등으로 인하여 멸실 또는 훼손되어 본래의 용도에 이용할 가치가 없는 건축물. 기계·설비 등의 복구는 자 본적지출에 해당하지만, 유리의 삽입에 대한 지출은 수익 적지출에 해당한다.","pg":291},{"id":1538,"ch":31,"n":26,"q":"시험연구용 자산은 20년 이내에서 선택하여 신고한 내용연 수를 감가상각의 내용연수로 한다.","a":"X","e":"시험연구용 자산은 자산의 종류별로 내용연수가 법령으 로 규정되어 있어 기준내용연수만을 내용연수로 한다.","pg":291},{"id":1539,"ch":31,"n":27,"q":"건축물 등과 업종별 자산이라도 사업장의 특성으로 자산의 부식·마모 및 훼손의 정도가 현저한 경우 기준내용연수에 기준내용연수의 100분의 25를 가감하는 범위에서 사업장별 로 납세지 관할 세무서장의 승인을 받아 내용연수범위와 달 리 내용연수를 적용하거나, 적용하던 내용연수를 변경할 수 있다.","a":"X","e":"건축물 등과 업종별 자산이라도 사업장의 특성으로 자산 의 부식. 마모 및 훼손의 정도가 현저한 경우 기준내용연 수에 기준내용연수의 100분의 50을 가감하는 범위에서 사업장별로 납세지 관할 지방국세청장의 승인을 받아 내 용연수범위와 달리 내용연수를 적용하거나, 적용하던 내 용연수를 변경할 수 있다.","pg":291},{"id":1540,"ch":31,"n":28,"q":"내국법인은 법인세법 시행령에 해당하는 감가상각자산에 대 하여 한국채택국제회계기준을 최초로 적용하는 사업연도에 결산내용연수를 연장한 경우에는 기준내용연수에 기준내용 연수의 100분의 50를 가감하는 범위에서 사업장별로 납세 지 관할 세무서장 승인을 받아 적용하던 내용연수를 연장할 수 있다.","a":"X","e":"내국법인은 법인세법 시행령에 해당하는 감가상각자산에 대하여 한국채택국제회계기준을 최초로 적용하는 사업연 도에 결산내용연수를 연장한 경우에는 기준내용연수에 기준내용연수의 100분의 25를 가감하는 범위에서 사업장 별로 납세지 관할 지방국세청장 승인을 받아 적용하던 내 용연수를 연장할 수 있다.","pg":291},{"id":1541,"ch":31,"n":29,"q":"내용연수를 변경하고자 하는 경우에는 적용하고자 하는 최 초 사업연도의 종료일까지 관할세무서장을 거쳐 지방국세청 장에게 신청해야 한다.","a":"O","e":"","pg":291},{"id":1542,"ch":31,"n":30,"q":"내국법인이 기준내용연수(해당 내국법인에게 적용되는 기준 내용연수를 말한다)의 100분의 25 이상이 경과된 자산을 다 른 법인으로부터 취득한 경우에는 그 자산의 기준내용연수 의 100분의 25에 상당하는 연수와 기준내용연수의 범위에 서 선택하여 납세지 관할 세무서장에게 신고한 연수를 내용 연수로 할 수 있다.","a":"X","e":"내국법인이 기준내용연수(해당 내국법인에게 적용되는 기준내용연수를 말한다)의 100분의 50 이상이 경과된 자 산을 다른 법인으로부터 취득한 경우에는 그 자산의 기준 내용연수의 100분의 50에 상당하는 연수와 기준내용연수 의 범위에서 선택하여 납세지 관할 세무서장에게 신고한 연수를 내용연수로 할 수 있다.","pg":292},{"id":1543,"ch":31,"n":31,"q":"건축물과 일반 무형자산은 정률법 또는 정액법에 의하여 상 각범위액을 계산한다.","a":"X","e":"건축물과 일반 무형자산은 징액에 의하여 상각범위액 을 계산한다.","pg":292},{"id":1544,"ch":31,"n":32,"q":"광업용 유형자산의 감가상각방법을 신고하지 않은 경우 정 액법에 의한다.","a":"X","e":"광업용 유형자산의 감가상각방법을 신고하지 않은 경우 생산량비례법에 의한다.","pg":292},{"id":1545,"ch":31,"n":33,"q":"폐기물 매립시설의 감가상각방법을 신고하지 않으면 정액법 에 의한다.","a":"X","e":"폐기물 매립시설의 감가상각방법을 신고하지 않으면 생 산량비례법에 의한다.","pg":292},{"id":1546,"ch":31,"n":34,"q":"개발비는 20년의 범위에서 내용연수를 신고할 수 있으나 감 가상각에 적용할 내용연수를 신고하지 아니한 경우에는 관 련 제품의 판매 또는 사용하여 수익을 얻을 것으로 예상되 는 기간 동안 균등 상각한다.","a":"X","e":"개발비는 20년의 범위에서 내용연수를신고할 수 있으나 감가상각에 적용할 내용연수를 신고하지 아니한 경우에 는 관련 제품의 판매 또는 사용이 가능한 시점부터 5년 동안 매년 균등액을 상각한다.","pg":292},{"id":1547,"ch":31,"n":35,"q":"신설법인과 새로 수익사업을 개시한 비영리법인은 그 영업 을 개시한 날이 속하는 사업연도종료일 이전 3개월이 되는 날까지 납세지 관할 세무서장에게 감가상각 방법을 신고해 야 한다.","a":"X","e":"신설법인과 새로 수익사업을 개시한 비영리법인은 그 영 업을 개시한 날이 속하는 사업연도의 법인세 과세표준의 신고기한까지 납세지 관할 세무서장에게 감가상각 방법 을 신고해야 한다.","pg":292},{"id":1548,"ch":31,"n":36,"q":"법인이 사업연도 중에 신규로 자산을 취득하여 사업에 사 용한 감가상각자산에 대한 상각범위액은 사업에 사용한 날 부터 해당 사업연도 종료일까지의 월수에 따라 계산한다.","a":"O","e":"","pg":293},{"id":1549,"ch":31,"n":37,"q":"2026년 6월 30일 취득 즉시 사업에 사용한 기계장치에 대 한 상각범위액은 6월 30일부터 12월 31일까지 월수에 따라 계산한다. 이때 월수는 역에 따라 계산하되 1월 미만의 일수 는 없는 것으로 본다.","a":"X","e":"2026년 6월 30일 취득 즉시 사업에 사용한 기계장치에 대한 상각범위액은 6월 30일부터 12월 31일까지 월수에 따라 계산한다. 이때 월수는 역에 따라 계산하되, 1개월 미만의 일수는 1개월로 한다.","pg":293},{"id":1550,"ch":31,"n":38,"q":"신규로 취득한 자산이나 기중에 발생한 자본적 지출액은 취 득 또는 발생시점부터 월할계산하여 상각범위액을 계산한 다.","a":"X","e":"신규 취득자산은 월할상각하지만, 사업연도 중에 발생한 자본적 지출액은 발생시점부터 월할상각하지 않고 기초 에 발생한 것으로 보아 상각범위액을 계산한다.","pg":293},{"id":1551,"ch":31,"n":39,"q":"상각방법이 서로 다른 법인이 합병(분할합병 포함)한 경우 납세지 관할 세무서장의 승인을 얻어 적용하던 감가상각방 법을 변경할 수 있다.","a":"O","e":"","pg":293},{"id":1552,"ch":31,"n":40,"q":"감가상각방법의 변경승인을 얻고자 하는 법인은 그 변경할 상각방법을 적용하고자 하는 최초 사업연도의 종료일 이전 3개월이 되는 날까지 감가상각방법변경신청서를 납세지 관 할 세무서장에게 제출(국세정보통신망에 의한 제출을 포함) 해야 한다.","a":"X","e":"감가상각방법의 변경승인을 얻고자 하는 법인은 그 변경 할 상각방법을 적용하고자 하는 최초 사업연도의 종료일 까지 감가상각방법변경신청서를 납세지 관할 세무서장에 게 제출(국세정보통신망에 의한 제출을 포함)해야 한다.","pg":293},{"id":1553,"ch":31,"n":41,"q":"법인이 감가상각비를 세법상의 한도액보다 과소계상한 경우 전년도에 상각부인액이 있더라도 손금산입으로 세무조정할 수 없다.","a":"X","e":"법인이 감가상각비를 세법상의 한도액보다 과소계상한 경우의 전년도의 상각부인액은 당기 발생 시인부족액의 범위에서 그 상각부인액을 손금산입(유보)하여 추인한 다.","pg":293},{"id":1554,"ch":31,"n":42,"q":"시인부족액은 그 후 사업연도의 상각부인액에 이를 충당하 지 못한다.","a":"O","e":"","pg":294},{"id":1555,"ch":31,"n":43,"q":"법인이 감가상각자산에 대하여 감가상각과 평가증을 병행한 경우에는 먼저 평가증을 한 후 감가상각을 한 것으로 보아 상각범위액을 계산한다.","a":"X","e":"법인이 감가상각자산에 대하여 감가상각과 평가증을 병 행한 경우에는 먼저 감가상각을 한 후 평가증을 한 것으 로 보아 상각범위액을 계산한다.","pg":294},{"id":1556,"ch":31,"n":44,"q":"각 사업연도의 소득에 대하여 「법인세법」과 다른 법률에 따 라 법인세를 면제받거나 감면받은 경우에는 감면기간 동안 개별 자산에 대한 감가상각비가 상각범위액이 되도록 감가 상각비를 손금에 산입할 수 있다.","a":"X","e":"각 사업연도의 소득에 대하여 「법인세법」과 다른 법률에 따라 법인세를 면제받거나 감면받은 경우에는 감면기간 동안 개별 자산에 대한 감가상각비가 상각범위액이 되도 록 감가상각비를 손금에 산입해야 한다.","pg":294},{"id":1557,"ch":31,"n":45,"q":"감가상각자산을 양도한 경우 당해 자산의 상각부인액은 양 도일이 속하는 사업연도의 손금에 이를 산입한다.","a":"O","e":"","pg":294},{"id":1558,"ch":32,"n":1,"q":"확정기여형 퇴직연금에 가입한 경우에 발생한 운영수익은 법인의 익금으로 산입한다.","a":"X","e":"확정기여형 퇴직연금제도는 법인의 회사부담금 납입 이 후에 근로자가 받는 연금급여가 적립금의 운용결과에 따 라 달라지게 되는 형태의 연금제도이므로 확정기여형 퇴 직연금에 가입한 경우에 발생한 운영수익은 법인의 익금 에 해당하지 아니한다.","pg":295},{"id":1559,"ch":32,"n":2,"q":"확정기여형 퇴직연금제도를 선택한 법인이 적립한 확정기여 형 퇴직연금의 부담금은 임원과 사용인을 불문하고 부담금 전액을 손금에 산입한다.","a":"X","e":"법인이 지출하는 확정기여형 퇴직연금의 부담금 중 사용 인에 대한 부담금은 전액 손금에 산입한다. 임원에 대한 부담금은 법인이 해당 임원의 퇴직 시까지 부담한 부담금 의 합계액을 임원퇴직급여로 보아 한도초과 여부를 계산 해야 한다.","pg":295},{"id":1560,"ch":32,"n":3,"q":"퇴직연금충당금의 회사계상액이 「법인세법」상 한도액에 미 달하는 경우 손금산입 세무조정을 할 수 없다.","a":"X","e":"퇴직연금충당금의 설정은 강제신고조정사항이므로 퇴직 연금충당금의 회사계상액이 「법인세법상 한도액에 미달 하는 경우 손금산입 세무조정을 해야 한다.","pg":295},{"id":1561,"ch":32,"n":4,"q":"퇴직급여충당금을 손금에 산입한 내국법인이 임원이나 직원 에게 퇴직금을 지급하는 경우에는 그 퇴직급여충당금에서 먼저 지급한 것으로 본다.","a":"O","e":"","pg":295},{"id":1562,"ch":32,"n":5,"q":"확정급여형 퇴직연금에 가입한 법인에서 현실적 퇴직으로 퇴직급여를 지급하는 경우 먼저 퇴직급여로 비용처리한 후 부족한 경우에는 퇴직연금충당금과 상계한다.","a":"X","e":"확정급여형 퇴직연금에 가입한 법인에서 현실적 퇴직으 로 퇴직급여를 지급하는 경우 퇴직연금충당금과 우선 상 계하고 퇴직연금충당금을 초과하여 지급된 부분은 퇴직· 급여충당금과 먼저 상계하며 부족한 경우 퇴직급여(비용) 로 처리한다.","pg":295},{"id":1563,"ch":32,"n":6,"q":"대손충당금은 해당 사업연도의 결산서상에 손비로 계상하여 야만 손금으로 인정된다.","a":"O","e":"대손충당금은 손비로 계상한 경우에 한하여 법으로 정하 는 금액의 범위에서 그 계상한 대손충당금을 해당 사업연 도의 소득금액을 계산할 때 손금에 산입한다.","pg":296},{"id":1564,"ch":32,"n":7,"q":"「채무자 회생 및 파산에 관한 법률」에 따른 회생계획인가의 결정 또는 법원의 면책결정에 따라 회수불능으로 확정된 채 권은 해당 사유가 발생하여 손비로 계상한 날이 속하는 사 업연도의 소득금액을 계산할 때 손금에 산입한다.","a":"X","e":"「채무자 회생 및 파산에 관한 법률」에 따른 회생계획인가 의 결정 또는 법원의 면책결정에 따라 회수불능으로 확정 된 채권은 해당 사유가 발생한 날이 속하는 사업연도의 소득금액을 계산할 때 손금에 산입한다. 즉, 대손으로 회 계처리하였는지 여부에 관계없이 반드시 대상채권전액을 해당 사업연도의 손금에 산입해야 하는 신고조정사항에 해당한다.","pg":296},{"id":1565,"ch":32,"n":8,"q":"대손충당금을 손금으로 계상한 내국법인은 대손금이 발생한 경우 그 대손금을 대손충당금과 먼저 상계하여야 하고, 대손 금과 상계하고 남은 대손충당금의 금액은 다음 사업연도의 소득금액을 계산할 때 손금에 산입한다.","a":"X","e":"대손충당금을 손금으로 계상한 내국법인은 대손금이 발 생한 경우 그 대손금을 대손충당금과 먼저 상계하여야 하 고, 대손금과 상계하고 남은 대손충당금의 금액은 다음 사업연도의 소득금액을 계산할 때 익금에 산입한다.","pg":296},{"id":1566,"ch":32,"n":9,"q":"부도발생일부터 6개월 이상 지난 수표 또는 어음상의 채권 및 외상매출금(중소기업의 외상매출금으로서 부도발생일 이 후의 것에 한정)은 대손금으로 손금에 산입할 수 있으며, 해 당 법인이 채무자의 재산에 대하여 저당권을 설정하고 있는 경우를 포함한다.","a":"X","e":"부도발생일부터 6개월 이상 지난 수표 또는 어음상의 채 권 및 외상매출금(중소기업의 외상매출금으로서 부도발 생일 이전의 것에 한정)은 대손금으로 손금에 산입할 수 있으나, 해당 법인이 채무자의 재산에 대하여 저당권을 설정하고 있는 경우는 제외한다.","pg":296},{"id":1567,"ch":32,"n":10,"q":"부도발생일부터 6개월 이상 지난 어음상의 채권(해당 법인 이 채무자의 재산에 대하여 저당권을 설정하고 있는 경우는 제외한다)은 해당 사유가 발생한 날이 속하는 사업연도의 손 금으로 한다.","a":"X","e":"부도발생일부터 6개월 이상 지난 어음상의 채권(해당 법 인이 채무자의 재산에 대하여 저당권을 설정하고 있는 경 우는 제외한다)은 해당 사유가 발생하여 손비로 계상한 날이 속하는 사업연도의 손금으로 한다.","pg":296},{"id":1568,"ch":32,"n":11,"q":"「상법」에 따른 소멸시효가 완성된 외상매출금 및 미수금은 손비로 계상한 날이 속하는 사업연도의 손금으로 하며 법인 이 대손처리하지 않은 경우 신고조정으로 손금산입할 수 없 다.","a":"X","e":"「상법」에 따른 소멸시효가 완성된 외상매출금 및 미수금 은 해당 사유가 발생한 날이 속하는 사업연도의 손금으로 하며 법인이 대손처리하지 않은 경우 신고조정으로 손금 산입해야 한다.","pg":297},{"id":1569,"ch":32,"n":12,"q":"민법에 따른 소멸시효가 완성된 대여금은 해당 사유가 발생 하여 손비로 계상한 날이 속하는 사업연도의 손금으로 한다.","a":"X","e":"민법에 따른 소멸시효가 완성된 대여금은 해당 사유가 발 생한 날이 속하는 사업연도의 손금으로 한다.","pg":297},{"id":1570,"ch":32,"n":13,"q":"채무자 회생 및 파산에 관한 법률」에 따른 회생계획인가의 결정 또는 법원의 면책결정에 따라 회수불능으로 2026년도 에 확정된 채권을 2027년도에 손금에 계상한 경우 손금으로 인정되지 않는다.","a":"X","e":"회생계획인가의 결정 또는 법원의 면책결정에 따라 회수 불능으로 확정된 채권은 대손의 신고조정사항이다. 따라 서 사유가 발생한 날이 2026년도 손금으로 인식해야 하 므로 2027년에 손금에 산입한 경우 손금으로 인정되지 않는다.","pg":297},{"id":1571,"ch":32,"n":14,"q":"「민사집행법」에 따라 채무자의 재산에 대한 경매가 취소된 압 류채권은 해당 사유가 발생한 날이 속하는 사업연도의 손금으 로 하며 법인이 대손처리하지 않은 경우 신고조정으로 손금산 입해야 한다.","a":"O","e":"","pg":297},{"id":1572,"ch":32,"n":15,"q":"채무자의 파산으로 회수할 수 없는 채권은 해당 사유가 발 생한 날이 속하는 사업연도의 손금으로 한다.","a":"X","e":"채무자의 파산으로 회수할 수 없는 채권은 해당 사유가 발생하여 손비로 계상한 날이 속하는 사업연도의 손금으 로 한다.","pg":297},{"id":1573,"ch":32,"n":16,"q":"회수기일이 6개월 이상 지난 채권 중 채권가액이 30만원 이 하(채무자별 채권가액의 합계액 기준)인 채권은 해당 사유가 발생한 날이 속하는 사업연도의 손금으로 하며 법인이 대손 처리하지 않은 경우 신고조정으로 손금산입한다.","a":"X","e":"회수기일이 6개월 이상 지난 채권 중 채권가액이 30만원 이하(채무자별 채권가액의 합계액 기준)인 채권은 해당 사유가 발생하여 손비로 계상한 날이 속하는 사업연도의 손금으로 하며 결산조정사항이므로 법인이 대손처리하지 않은 경우 신고조정으로 손금산입할 수 없다.","pg":297},{"id":1574,"ch":32,"n":17,"q":"「민사소송법」에 따른 화해, 화해권고결정에 따라 회수불능으 로 확정된 채권은 해당 사유가 발생한 날이 속하는 사업연 도의 손금으로 하며 법인이 대손처리하지 않은 경우 신고조 정으로 손금산입해야 한다.","a":"X","e":"「민사소송법」에 따른 화해, 화해권고결정에 따라 회수불 능으로 확정된 채권은 해당 사유가 발생하여 손비로 계상 한 날이 속하는 사업연도의 손금으로 하며 결산조정사항 이므로 법인이 대손처리하지 않은 경우 신고조정으로 손 금산입할 수 없다.","pg":298},{"id":1575,"ch":32,"n":18,"q":"물품의 수출 또는 외국에서의 용역제공으로 발생한 채권으 로 법령에서 정하는 사유에 해당하여 무역에 관한 법령에 따라 회수불능으로 확인된 채권은 해당 사유가 발생하여 손 비로 계상한 날이 속하는 사업연도의 손금으로 한다.","a":"O","e":"","pg":298},{"id":1576,"ch":32,"n":19,"q":"법인이 다른 법인과 합병하거나 분할하는 경우로서 채무자 의 파산으로 회수할 수 없는 채권에 해당하는 대손금을 합 병등기일 또는 분할등기일이 속하는 사업연도까지 손비로 계상하지 아니한 경우 그 대손금은 해당 법인의 합병등기일 또는 분할등기일이 속하는 사업연도의 손금으로 보지 아니 한다.","a":"X","e":"법인이 다른 법인과 합병하거나 분할하는 경우로서 채무 자의 파산으로 회수할 수 없는 채권에 해당하는 대손금을 합병등기일 또는 분할등기일이 속하는 사업연도까지 손 비로 계상하지 아니한 경우 그 대손금은 해당 법인의 합 병등기일 또는 분할등기일이 속하는 사업연도의 손금으 로 한다.","pg":298},{"id":1577,"ch":32,"n":20,"q":"회수할 수 없는 부가가치세 매출세액 미수금(부가가치세 법」에 따른 대손세액공제를 받은 것은 제외)는 「법인세법」 상대손처리할 수 있는 채권의 범위에 해당하지 아니한다.","a":"X","e":"회수할 수 없는 부가가치세 매출세액 미수금(부가가치세 법」에 따른 대손세액공제를 받은 것은 제외)는 「법인세법」 상대손처리할 수 있는 채권의 범위에 해당한다.","pg":298},{"id":1578,"ch":32,"n":21,"q":"채무보증(법령으로 정하는 일정한 채무보증은 제외)으로 인 하여 발생한 구상채권은 해당 구상채권을 회수할 수 없는 사실이 확정된 날이 속하는 사업연도의 소득금액을 계산할 때 손금에 산입한다.","a":"X","e":"채무보증(법령으로 정하는 일정한 채무보증은 제외)으로 인하여 발생한 구상채권은 대손사유가 충족되더라도 손 금에 산입할 수 없다.","pg":298},{"id":1579,"ch":32,"n":22,"q":"손금산입한 대손금 중 회수한 금액은 그 회수한 날이 속하 는 사업연도의 소득금액을 계산할 때 익금에 산입한다.","a":"O","e":"","pg":299},{"id":1580,"ch":32,"n":23,"q":"전기 손금불산입한 대손금 중 당기에 회수한 금액은 그 회 수한 날이 속하는 사업연도의 소득금액을 계산할 때, 익금에 산입한다.","a":"X","e":"전기 손금불산입한 대손금 중 당기에 회수한 금액은 그 회수한 날이 속하는 사업연도의 소득금액을 계산할 때, 익금불산입항목이다. \" ・전기 대손으로 손금산입한 금액을 환입한 경우에만 이후 회수했을 때 익금에 산입함을 주의한다.","pg":299},{"id":1581,"ch":32,"n":24,"q":"내국법인이 기업회계기준에 따른 채권의 재조정에 따라 채 권의 장부가액과 현재가치의 차액을 대손금으로 계상한 경 우에는 손금에 산입하지 아니한다.","a":"X","e":"내국법인이 기업회계기준에 따른 채권의 재조정에 따라 채권의 장부가액과 현재가치의 차액을 대손금으로 계상 한 경우에는 이를 손금에 산입하며, 손금에 산입한 금액 은 기업회계기준의 환입방법에 따라 익금에 산입한다.","pg":299},{"id":1582,"ch":32,"n":25,"q":"금전소비대차 계약에 의하여 타인에게 대여한 금액에 대해 서는 대손충당금을 설정할 수 없다.","a":"X","e":"금전소비대차 계약에 의하여 타인에게 대여한 금액에 대 해서는 대손충당금을 설정할 수 있다.","pg":299},{"id":1583,"ch":32,"n":26,"q":"특수관계인에 대한 채권은 대손충당금 설정 대상이 아니다.","a":"X","e":"특수관계인에 대한 채권 중 대여 시점의 특수관계인에 대 한 업무무관가지급금만 대손충당금 설정 대상이 아니다.","pg":299},{"id":1584,"ch":32,"n":27,"q":"제조업을 영위하는 법인의 대손충당금 설정률은 1%와 대손 실적률 중 큰 비율을 적용한다. 이 경우 대손실적률이란 해 당 사업연도 종료일 현재의 채권잔액 대비 해당 사업연도 대 손금(요건을 충족한 것에 한정)의 비율을 의미한다.","a":"X","e":"제조업을 영위하는 법인의 대손충당금 설정률은 1%와 대 손실적률 중 큰 비율을 적용한다. 이 경우 대손실률이 란 직전 사업연도종료일 현재의 채권잔액 대비 해당 사업 연도 대손금(요건을 충족한 것에 한정)의 비율을 의미한 다.","pg":299},{"id":1585,"ch":32,"n":28,"q":"내국법인이 동일인에 대하여 매출채권과 매입채무를 가지고 있는 경우에는 해당 매출채권과 매입채무를 상계해야 한다.","a":"X","e":"내국법인이 동일인에 대하여 매출채권과 매입채무를 가 지고 있는 경우에는 해당 매입채무를 상계하지 아니하고 대손충당금으로 계상할 수 있다. 단, 당사자 간의 약정에 의하여 상계하기로 한 경우는 제외한다.","pg":300},{"id":1586,"ch":32,"n":29,"q":"대손충당금을 손금에 산입한 내국법인이 합병하는 경우 그 법인의 합병등기일 현재 해당 대손충당금 중 합병법인이 승 계 받은 금액은 그 합병법인이 합병등기일에 가지고 있는 대손충당금으로 보지 아니한다.","a":"X","e":"대손충당금을 손금에 산입한 내국법인이 합병하는 경우 그 법인의 합병등기일 현재 해당 대손충당금 중 합병법인 이 승계 받은 금액은 그 합병법인이 합병등기일에 가지고 있는 대손충당금으로 본다.","pg":300},{"id":1587,"ch":32,"n":30,"q":"「법인세법」에 따라 대손충당금을 손금에 산입한 내국법인이 합병하는 경우 그 법인의 합병등기일 현재의 해당 대손충당 금 중 합병법인이 승계(해당 대손충당금에 대응하는 채권이 함께 승계되지 아니한 경우 포함)받은 금액은 그 합병법인이 합병등기일에 가지고 있는 대손충당금으로 본다.","a":"X","e":"「법인세법」 따라 대손충당금을 손금에 산입한 내국법인이 합병하는 경우 그 법인의 합병등기일 현재의 해당 대손충 당금 중 합병법인이 승계(해당 대손충당금에 대응하는 채 권이 함께 승계되는 경우만 해당한다) 받은 금액은 그 합 병법인이 합병등기일에 가지고 있는 대손충당금으로 본 다.","pg":300},{"id":1588,"ch":32,"n":31,"q":"일시상각충당금 또는 압축기장충당금은 신고조정에 의한 손 금산입이 허용된다.","a":"O","e":"","pg":300},{"id":1589,"ch":32,"n":32,"q":"국고보조금 등 상당액을 손금에 산입한 내국법인이 손금에 산입한 금액을 기한 내에 사업용 자산의 취득에 사용하기 전에 합병하고, 손금에 산입한 금액을 합병법인이 승계하는 경우 그 금액은 해당 사유가 발생한 날이 속하는 사업연도 에 합병법인의 소득금액을 계산할 때 익금에 산입한다.","a":"X","e":"국고보조금 등 상당액을 손금에 산입한 내국법인이 손금 에 산입한 금액을 기한 내에 사업용 자산의 취득에 사용 하기 전에 합병하고, 손금에 산입한 금액을 합병법인이 승계하는 경우 그 금액은 합병법인이 「법인세법」에 따라 손금에 산입한 것으로 본다.","pg":300},{"id":1590,"ch":32,"n":33,"q":"「주식회사 등의 외부감사에 관한 법률」에 따른 감사인의 회 계감사를 받는 비영리내국법인이 고유목적사업준비금을 세 무조정계산서에 계상하고 그 금액 상당액을 해당 사업연도 의 이익처분을 할 때 고유목적사업준비금으로 적립한 경우 에는 그 금액을 결산을 확정할 때 손비로 계상한 것으로 본 다.","a":"O","e":"비영리법인을 대상으로 하는 고유목적사업준비금은 원칙 적으로 결산조정사항이나 「주식회사 등의 외부감사에 관 한 법률」에 따른 감사인의 회계감사를 받는 비영리내국법 인은 예외적으로 잉여금처분에 의한 신고조정을 허용한 다.","pg":302},{"id":1591,"ch":32,"n":34,"q":"고유목적사업준비금을 손금에 산입한 비영리내국법인이 사 업에 관한 모든 권리와 의무를 다른 비영리내국법인에게 포 괄적으로 양도하고 해산하는 경우에는 해산등기일 현재의 고유목적사업준비금 잔액은 그 다른 비영리법인이 승계할 수 없다.","a":"X","e":"고유목적사업준비금을 손금에 산입한 비영리내국법인이 사업에 관한 모든 권리와 의무를 다른 비영리내국법인에 게 포괄적으로 양도하고 해산하는 경우에는 해산등기일 현재의 고유목적사업준비금 잔액은 그 다른 비영리법인 이 승계할 수 있다.","pg":302},{"id":1592,"ch":32,"n":35,"q":"고유목적사업준비금은 「소득세법」상 이자소득금액 및 배당 소득금액에 100분의 50을 곱하여 산출한 금액을 한도로 손 금에 산입한다.","a":"X","e":"고유목적사업준비금은 「소득세법」상 이자소득금액 및 배 당 소득금액에 100분의 100을 곱하여 산출한 금액을 한 도로 손금에 산입한다. 즉, 전액 손금에 산입된다.","pg":302},{"id":1593,"ch":32,"n":36,"q":"비영리내국법인의 고유목적사업준비금을 손비로 계상한 경 우에는 그 계상한 고유목적사업준비금을 이후 연속하는 3개 사업연도의 산출세액에서 순차적으로 차감한다.","a":"X","e":"고유목적사업준비금을 손금에 산입한 비영리내국법인이 고유목적사업이나 일반기부금에 지출한 금액이 있는 경 우에는 그 금액을 먼저 계상한 사업연도의 고유목적사업 준비금부터 차례로 상계해야 한다.","pg":302},{"id":1594,"ch":32,"n":37,"q":"고유목적사업준비금을 손금에 산입한 비영리내국법인이 고 유목적사업 등에 지출한 금액이 있는 경우에는 그 금액을 먼저 계상한 사업연도의 고유목적사업준비금부터 차례로 상 계하여야 한다.","a":"O","e":"","pg":302},{"id":1595,"ch":32,"n":38,"q":"고유목적사업준비금을 손금에 산입한 비영리법인이 손비로 계상한 사업연도의 종료일 이후 10년이 되는 날까지 고유목 적사업 등에 사용하지 않은 경우 그 잔액은 해당 사유가 발 생하는 날이 속하는 사업연도의 익금에 산입한다.","a":"X","e":"고유목적사업준비금을 손금에 산입한 비영리법인이 손비 로 계상한 사업연도의 종료일 이후 5년이 되는 날까지 고 유목적사업 등에 사용하지 않은 경우 그 잔액은 해당 사유 가 발생하는 날이 속하는 사업연도의 익금에 산입한다.","pg":303},{"id":1596,"ch":32,"n":39,"q":"고유목적사업준비금을 손금에 산입한 비영리내국법인이 사 업에 관한 모든 권리와 의무를 다른 비영리내국법인에 포괄 적으로 양도하고 해산하는 경우 해산등기일 현재의 고유목 적사업준비금 잔액은 그 다른 비영리내국법인이 승계할 수 없다.","a":"X","e":"고유목적사업준비금을 손금에 산입한 비영리내국법인이 사업에 관한 모든 권리와 의무를 다른 비영리내국법인에 포괄적으로 양도하고 해산하는 경우 해산등기일 현재의 고유목적사업준비금 잔액은 그 다른 비영리내국법인이 승계할 수 있다.","pg":303},{"id":1597,"ch":32,"n":40,"q":"고유목적사업준비금을 손금에 산입한 비영리법인이 고유목 적사업을 일부라도 폐지하는 경우 그 잔액은 해당 사유가 발생하는 날이 속하는 사업연도의 익금에 산입한다.","a":"X","e":"고유목적사업준비금을 손금에 산입한 비영리법인이 고유 목적사업을 전부 폐지하는 경우 그 잔액은 해당 사유가 발생하는 날이 속하는 사업연도의 익금에 산입한다.","pg":303},{"id":1598,"ch":33,"n":1,"q":"납세지 관할 세무서장 또는 관할 지방국세청장은 내국법인 의 행위 또는 소득금액의 계산이 특수관계인과의 거래로 인 하여 그 법인의 소득에 대한 조세의 부담을 부당하게 감소 시킨 것으로 인정되는 경우에는 그 법인의 행위 또는 소득 금액의 계산에 관계없이 그 법인의 각 사업연도의 소득금액 을 계산한다.","a":"O","e":"","pg":304},{"id":1599,"ch":33,"n":2,"q":"비영리내국법인에 대하여도 부당행위계산 부인 규정을 적용 할 수 있다.","a":"O","e":"","pg":304},{"id":1600,"ch":33,"n":3,"q":"「법인세법」상 부당행위계산 부인을 적응할 때 허위의 거래 이든 실제의 거래이든 관계없이 부당성의 요건을 충족하면 부당행위계산 부인의 대상이 된다.","a":"X","e":"「법인세법」상 부당행위계산 부인을 적용할 때 법인과 특 수관계 있는 자와의 진실한 실제 거래행위가 있어야 부당 행위계산 부인의 대상이 된다. 따라서 허위의 거래는 부 당행위계산 부인의 대상이 되지 아니한다.","pg":304},{"id":1601,"ch":33,"n":4,"q":"부당행위계산부인 규정은 세법상 과세소득계산상의 범위 내 에서만 변동을 초래할 뿐만 아니라 당사자 간에 약정한 사 법상 법률행위의 효과도 무효가 된다.","a":"X","e":"부당행위계산부인 규정은 세법상 과세소득계산상의 범위 내에서만 변동을 초래할 뿐 당사자 간에 약정한 사법상 법률행위의 효과와는 무관하다.","pg":304},{"id":1602,"ch":33,"n":5,"q":"「법인세법」상 부당행위계산의 부인 규정이 적용될 경우 사 법상 거래는 그대로 유지되지만, 조세포탈범으로 처벌된다. 322 제5편 법인세법","a":"X","e":"세법상으로만 해당 거래에 대해 계산을 다시 하는 것일 뿐이므로 세법상 부당행위계산에 해당한다고 하더라도 당사자 간에 이루어진 해당 거래에 대한 법적 효과는 그 대로 유지되며, 조세포탈범으로 처벌되지 않는다.","pg":304},{"id":1603,"ch":33,"n":6,"q":"당 부 위 행 산 계 에 당 해 는 하 경 우 가 시 와 의 액 차 등 을 금 익 에 입 산 여 하 해 당 인 법 의 각 업 사 도 연 의 득 소 액 금 을 산 계 고 하 속 귀 자 게 에 세 여 증 를 세 과 는 하 것 을 칙 원 로 으 한다. OX 07 행위 에 시 당 는 수 특 인 계 관 나 으 었 이 업 사 도 연 일 료 종 재 현 는 수 특 인 계 관 이 아 니라면 당 부 위 행 산 계 인 부 상 대 는 에 해당되 지 다 는 않 . OX 08 인 법 과 수 특 인 계 관 간의 래 거 는 반 드시 직접적인 래 거 계 관 에 한 국 지 하 않 고 수 특 인 계 관 외 의 자 를 통하여 이루어진 래 거 도 함 포 다 한 .","a":"X","e":"당 부 위 행 산 계 에 당 해 는 하 우 경 가 시 와 의 액 차 등 을 금 익 에 입 산 여 하 해 당 인 법 의 각 업 사 도 연 의 득 소 액 금 을 계 산 다 한 . 만 다 , 속 귀 자 게 에 세 여 증 를 세 과 는 하 이 것 니 아 라 . 속 귀 의 자 분 구 에 라 따 당 배 · 여 상 · 타 기 외 사 출 유 또 는 타 기 득 소 로 으 분 처 며 되 , 그 속 귀 는 자 에 이 라 따 득 소 세 등 의 세 납 무 의 를 지 게 된 다 . 0 7 X 제 출 - - - - - | C S K N I L 오 다 진 0 7 4 . p 법 세 2 5 2 . p 2 당 부 위 행 산 계 의 인 부 은 세 조 담 부 을 당 부 게 하 소 감 는 키 시 그 위 행 시 당 를 준 기 로 으 여 하 당 해 인 법 과 수 특 인 계 관 간 의 래 거 에 여 하 대 를 이 용 적 는 하 이 것 칙 원 다 이 . 0 8 ○ 출 제 - - - - - | K K N N I I L 진 오 다오 진 p . 4 71 법 세 2 5 2 . p 2 당 부 위 행 산 계 의 인 부 은 세 조 담 부 을 당 부 게 하 소 감 키 시 는 그 위 행 시 당 를 준 기 로 으 여 하 당 해 인 법 과 수 특 계 관 간 인 의 래 거 ( 수 특 인 계 관 의 외 를 자 통 하여 진 어 루 이 거 래 함 포 ) 에 여 하 대 를 이 용 적 다 한 .","pg":305},{"id":1604,"ch":33,"n":9,"q":"수 특 인 계 관 인 법 간 병 합 에 있 어서 정 공 불 한 율 비 로 합병 하여 병 합 에 따 인 도 양 익 손 을 소 감 킨 시 래 거 에 대해 당 부 행 위 산 계 로 으 인 른 부 에 함 있어서 수 특 인 계 관 인 인 법 의 정 판 은 병 합 일 기 등 이 속 업 사 도 연 의 전 전 업 사 도 연 일 시 개 터 부 하는 병 합 일 기 등 날 전 지 까 의 간 기 에 한 의 다 . OX 10 당 부 위 행 산 계 의 인 부 서 에 수 특 계 관 의 존 재 부 여 는 해 당 법 인과 령 법 이 정 하는 일 정한 계 관 에 있 는 자를 말하며, 이 해당 인 법 도 그 수 특 인 계 관 의 수 특 인 계 관 로 으 본다. 경우","a":"O","e":"수 특 인 계 관 인 인 법 간 병 합 에 서 어 있 정 공 불 한 율 비 로 합 병 여 하 병 합 에 른 따 도 양 ":306},{"id":1611,"ch":33,"n":17,"q":"금 연 출 을 대 신 담 부 한 경 우 세 인 법 령 법 상 세 조 의 담 부 을 부 당 소 감 킨 시 것 으 정 인 는 되 우 경 ( 당 부 위 행 산 계 ) 에 해 하 게 로 다 한 당 .","a":"O","e":"","pg":307},{"id":1612,"ch":33,"n":18,"q":"선 물 , 스 왑 , 션 옵 등 생 파 품 상 에 근 거한 리 권 를 사 행 지 하 않 거 나 그 사 행 간 기 을 정 조 는 하 등 의 법 방 로 으 익 이 을 분 하 여 는 우 경 는 당 부 위 행 산 계 의 형 유 에 당 해 지 되 다 한 니 아 . 0 1x","a":"X","e":"물 선 , 왑 스 , 옵션 등 생 파 품 상 에 한 거 근 리 권 를 사 행 지 하 나 거 않 그 사 행 간 기 을 정 조 는 하 등 의 법 방 로 으 익 이 을 분 여 는 하 우 경 는 당 부 위 행 산 계 의 형 유 에 당 해 다 된 .","pg":307},{"id":1613,"ch":33,"n":19,"q":"식 주 수 매 권 택 선 의 사 행 에 따 라 식 주 을 도 양 는 하 우 경 서 로 식 주 을 가 시 다 보 낮 액 가 로 으 도 양 한 우 경 는 당 부 위 행 계 은 산 의 형 유 에 당 해 지 되 다 한 니 아 .","a":"O","e":"","pg":307},{"id":1614,"ch":33,"n":21,"q":"당 부 위 행 산 계 에 서 어 있 의 가 시 란 한 전 건 회 사 념 통 및 상 거 래 행 관 과 수 특 인 계 관 이 아 간 자 의 정 상 적 래 거 서 에 적 용 나 거 되 될 용 적 로 으 것 단 판 닌 는 되 격 가 을 다 한 말 . O IX 22 • 권 주 장 상 인 법 이 행 발 한 식 주 을 국 한 소 래 거 서 에 래 거 한 경 우 당 해 식 주 의 가 시 는 그 일 래 거 의 전 3 간 월 개 종 최 세 시 가 액 의 균 평 로 으 다 한 . 후","a":"O","e":"2 2 × 출 제 C D L I N K 오 다 진 p . 4 7 3 2 p . 2 5 6 권 주 장 상 인 법 이 행 발 한 식 주 을 국 한 소 래 거 서 에 래 거 한한 경 해 식 주 의 가 시 는 그 일 래 거 에 래 거 한 가 시 로 우 당 다 .","pg":307},{"id":1615,"ch":33,"n":23,"q":"주식 등을 제외한 일반적인 자산의 시가가 불분명한 경우에 는 「상속세 및 증여세법」에 따른 보충적 평가방법을 준용한 평가액을 그 시가로 한다.","a":"X","e":"주식 등을 제외한 일반적인 자산에 부당행위계산의 부인 규정을 적용할 때 시가가 불분명한 경우 다음의 순서로 적용하여 계산한 금액에 따른다. <1순위> 감정평가업자의 감정가액(감정가액이 둘 이상일 경우 그 평균액) <2순위> 「상속세 및 증여세법」에 따른 보충적 평가방법을 준용한 평가액 비교 주식 출자지분의 시가가 불분명한 경우에는 「상속세 및 증여세 법」에 따른 보충적 평가방법을 준용한 평가액을 그 시가로 한다.","pg":308},{"id":1616,"ch":33,"n":24,"q":"비상장주식에 대하여 특수관계인이 아닌 제3자 간에 일반적 으로 거래된 가격이 없으면 감정평가업자의 감정가액(감정 가액이 둘 이상일 경우 그 평균액)을 적용한다. ○","a":"X","e":"비상장주식에 대하여 특수관계인이 아닌 제3자 간에 일 반적으로 거래된 가격이 없으면 「상속세 및 증여세법」에 따른 보충적 평가방법을 준용하여 평가한 금액을 기준으 로 부당행위계산부인 규정을 적용한다.","pg":308},{"id":1617,"ch":33,"n":25,"q":"토지의 시가가 불분명한 경우로 「부동산가격공시 및 감정평 가에 관한 법률」에 의한 감정평가업자가 감정한 가액이 둘 이상인 경우에는 그 중 가장 큰 금액으로 평가한다.","a":"X","e":"토지의 시가가 불분명한 경우로 「부동산가격공시 및 감정 평가에 관한 법률」에 의한 감정평가업자가 감정한 가액이 둘 이상인 경우에는 그 평균액으로 평가한다.","pg":308},{"id":1618,"ch":33,"n":26,"q":"주식 및 가상자산을 제외한 자산의 시가가 불분명한 경우 감정평가법인 등의 감정가액이 있으면 그 가액을 적용하며, 감정한 가액이 2 이상인 경우에는 감정가액의 평균액을 적 용한다.","a":"O","e":"","pg":308},{"id":1619,"ch":33,"n":27,"q":"기계를 임대하고 임대료를 계산함에 있어 시가가 불분명한 경우에는 해당 자산 시가에서 그 자산의 제공과 관련하여 받은 보증금을 차감한 금액에 임대일수에 따른 정기예금이 자율을 곱하여 산출한 금액을 시가로 한다. ○","a":"X","e":"기계를 임대하고 임대료를 계산함에 있어 시가가 불분명 한 경우에는 해당 자산 시가의 100분의 50 에 상당하는 금액(그 자산의 제공과 관련하여 받은 전세금 또는 보증 금이 있는 경우 이를 차감)에 임대일수에 따른 정기예금 이자율을 곱하여 산출한 금액을 시가로 한다.","pg":308},{"id":1620,"ch":33,"n":28,"q":"법인이 특수관계인에게 자산을 무상 또는 시가보다 낮은 가 액으로 양도하는 경우에는 시가와 거래가액의 차액에 관계 없이 부당행위계산의 부인 규정을 적용한다.","a":"X","e":"법인이 특수관계인에게 자산을 무상 또는 시가보다 낮은 가액으로 양도하는 경우에는 이를 부당행위계산으로 보 아 부인하되 시가와 거래가액의 차액이 3억원 이상이거 나 시가의 100분의 5에 상당하는 금액 이상인 경우에 한 하여 부당행위계산의 부인 규정을 적용한다.","pg":309},{"id":1621,"ch":33,"n":29,"q":"특수관계인으로부터 금전을 시가보다 낮은 이율로 차용한 경우로서 시가와 거래가액의 차액이 시가의 100분의 5에 상 당하는 금액 이상인 경우에는 부당행위계산의 부인 대상이 된다.","a":"X","e":"특수관계인에게 금전을 시가보다 낮은 이율로 대부한 경 우로서 시가와 거래가액의 차액이 3억원 이상이거나 시 가의 100분의 5에 상당하는 금액 이상인 경우에는 부당 행위계산의 부인 대상이 된다. 낮은 이율로 차용한 경우 는 부당행위계산의 유형에 해당되지 아니한다.","pg":309},{"id":1622,"ch":33,"n":30,"q":"업무무관자산 등에 대한 지급이자 손금불산입은 적정한 이 자수령 시에는 적용하지 않는 반면 가지급금 인정이자의 익 금산입은 적정 이자 수령 여부와 관계없이 적용한다.","a":"X","e":"가지급금 인정이자의 익금산입은 적정한 이자수령 시에 는 적용하지 않는 반면 업무무관자산 등에 대한 지급이자 손금불산입은 적정 이자 수령 여부와 관계없이 적용한다.","pg":309},{"id":1623,"ch":33,"n":31,"q":"법인이 우리사주조합 또는 그 조합원에게 해당 법인의 주식 취득자금을 대여한 경우 그 금액에 대해 인정이자를 계산한 다.","a":"X","e":"법인이 우리사주조합 또는 그 조합원에게 당해 해당 법인 의 주식취득자금을 대여한 경우 그 금액은 가지급금 인정 이자의 계산 대상이 아니므로 인정이자를 계산하지 아니 한다.","pg":309},{"id":1624,"ch":33,"n":32,"q":"대여한 날(계약을 갱신한 경우에는 그 갱신일)부터 해당 사 업연도 종료일(해당 사업연도에 상환하는 경우 상환일)까지 의 기간이 5년을 초과하는 대여금이 있는 경우 해당 대여금 (또는 차입금)에 한정하여 가중평균차입이자율을 시가로 한 다.","a":"X","e":"대여한 날(계약을 갱신한 경우에는 그 갱신일)부터 해당 사업연도 종료일(해당 사업연도에 상환하는 경우 상환일) 까지의 기간이 5년을 초과하는 대여금이 있는 경우 해당 대여금(또는 차입금)에 한정하여 당좌대출이자율을 시가 로 한다.","pg":309},{"id":1625,"ch":33,"n":33,"q":"가중평균차입이자율의 적용이 불가능한 경우로서 차입금 전 액이 채권자가 불분명한 사채로 조달된 경우에는 해당 차입 금에 한정하여 당좌대출이자율을 시가로 한다.","a":"O","e":"","pg":309},{"id":1626,"ch":33,"n":34,"q":"가중평균차입이자율의 적용이 불가능한 경우로서 특수관계 인으로부터 차입한 차입금만 있는 경우에는 모든 차입금에 대하여 당좌대출이자율을 시가로 한다.","a":"X","e":"가중평균차입이자율의 적용이 불가능한 경우로서 특수관 계인으로부터 차입한 차입금만 있는 경우에는 해당 차입 금에 한심히 이 당좌대출이자율을 시가로 한다.","pg":310},{"id":1627,"ch":33,"n":35,"q":"내국법인이 「법인세법」 제60조(과세표준 등의 신고)에 따른 신고와 함께 당좌대출이자율을 시가로 선택하는 경우에는 당좌대출이자율을 시가로 하여 선택한 사업연도와 이후 3개 사업연도는 당좌대출이자율을 시가로 한다.","a":"X","e":"내국법인이 「법인세법」 제60조(과세표준 등의 신고)에 따 른 신고와 함께 당좌대출이자율을 시가로 선택하는 경우 에는 당좌대출이자율을 시가로 하여 선택한 사업연도와 이후 2개 사업인도는 당좌대출이자율을 시가로 한다.","pg":310},{"id":1628,"ch":34,"n":1,"q":"법인세의 과세표준은 각 사업연도 소득의 범위 안에서 비과 세소득, 소득공제액, 이월결손금 순으로 공제하여 계산하며 공제되지 못한 비과세소득은 15년간(2020.1.1. 전에 개시하 는 사업연도에 발생한 것은 10년) 이월하여 공제한다.","a":"X","e":"법인세의 과세표준은 각 사업연도 소득의 범위 안에서 이 월결손금, 비과세소득, 소득공제액 순으로 공제하여 계산 하며 공제되지 못한 비과세소득은 이월하여 공제할 수 없 다. 참고 소득공제액은 원칙적으로 이월공제 대상이 아니지만, 유동화 전문회사 및 투자회사 등의 이월공제배당금액은 5년간 이월하여 이 월된 사업연도의 소득금액에서 공제할 수 있음","pg":311},{"id":1629,"ch":34,"n":2,"q":"과세표준 계산 시 각 사업연도의 소득에서 공제하는 이월결 손금은 각 사업연도의 개시일 전 7년 이내에 개시한 사업연 도에서 발생한 결손금이어야 한다.","a":"X","e":"과세표준 계산 시 각 사업연도의 소득에서 공제하는 이월 결손금은 각 사업연도의 개시일 전 15년(2020.1.1. 전개 시하는 사업연도에 발생한 것은 10년) 이내에 개시한 사 업연도에서 발생한 결손금이어야 한다.","pg":311},{"id":1630,"ch":34,"n":3,"q":"내국법인의 이월결손금은 각 사업연도의 개시일 전 발생한 각 사업연도의 결손금으로서 그 후의 각 사업연도의 과세표 준을 계산할 때 공제되지 아니한 금액으로 한다.","a":"O","e":"","pg":311},{"id":1631,"ch":34,"n":4,"q":"각 사업연도 소득금액에서 이월결손금을 공제할 때에는 나 중에 발생한 사업연도의 결손금부터 차례대로 공제한다.","a":"X","e":"각 사업연도 소득금액에서 이월결손금을 공제할 때에는 먼저 발생한 사업연도의 결손금부터 차례대로 공제한다.","pg":311},{"id":1632,"ch":34,"n":5,"q":"무상으로 받은 자산의 가액으로 충당하여 보전할 수 있는 이월결손금은 발생연도에 제한이 없다.","a":"O","e":"","pg":311},{"id":1633,"ch":34,"n":6,"q":"채무면제이익으로 충당된 이월결손금은 각 사업연도의 과세 표준 계산에 있어서 공제된 것으로 본다.","a":"O","e":"","pg":311},{"id":1634,"ch":34,"n":7,"q":"결손금 공제 중 이월공제는 신청을 요건으로 한다.","a":"X","e":"결손금 공제 중 이월공제는 신청을 요건으로 하지 않는 다.","pg":312},{"id":1635,"ch":34,"n":8,"q":"「채무자 회생 및 파산에 관한 법률」에 따라 법원이 인가결정 한 회생계획을 이행 중인 법인 등 법에서 정하는 내국법인 의 경우 이월결손금 공제한도는 각 사업연도 소득의 100분 의 60으로 한다.","a":"X","e":"「채무자 회생 및 파산에 관한 법률」에 따라 법원이 인가결 정한 회생계획을 이행 중인 법인 등 법에서 정하는 내국 법인의 경우 이월결손금 공제한도는 각 사업연도 소득의 100분의 100으로 한다. 고 '중소기업 및 「채무자 회생 및 파산에 관한 법률」에 따라 법원이 인가결정한 회생계획을 이행 중인 법인 등 법에서 정하는 내국법인' 외 의 일반기업의 이월결손금 공제한도는 80%임","pg":312},{"id":1636,"ch":34,"n":9,"q":"「조세특례제한법」에 따른 중소기업의 경우 이월결손금 공제 는 각 사업연도 소득의 100%까지 할 수 있다.","a":"O","e":"","pg":312},{"id":1637,"ch":34,"n":10,"q":"추계결정 및 경정의 경우에는 추계결정. 경정의 사유에 관 계없이 이월결손금을 공제하지 아니한다.","a":"X","e":"법인세 과세표준을 추계결정. 경정하는 경우에는 이월결 손금 공제규정을 적용하지 않지만 천재지변 등으로 장부 나 그 밖의 증빙서류가 멸실되어 추계하는 경우에는 이월 결손금공제를 적용할 수 있다.","pg":312},{"id":1638,"ch":34,"n":11,"q":"직전 사업연도의 소득에 대하여 과세된 법인세액이 있는 중 소기업에 한하여 결손금 소급공제를 적용할 수 있다.","a":"O","e":"","pg":312},{"id":1639,"ch":34,"n":12,"q":"소급공제받은 결손금은 과세표준을 계산할 때 이미 공제받 은 금액으로 보기 때문에 해당 사업연도 이후 이월결손금으 로 다시 공제할 수 없다.","a":"O","e":"","pg":312},{"id":1640,"ch":34,"n":13,"q":"중소기업은 결손금이 발생한 사업연도와 직전 사업연도의 소득에 대한 법인세 과세표준 및 세액을 각각의 과세표준신 고기한 내에 적법하게 신고하고 환급신청을 한 경우에만 결 손금 소급공제를 적용할 수 있으나 발생한 결손금의 일부만 을 소급공제 신청할 수는 없다.","a":"X","e":"중소기업은 결손금이 발생한 사업연도와 직전 사업연도 의 소득에 대한 법인세 과세표준 및 세액을 각각의 과세 표준신고기한 내에 적법하게 신고하고 환급신청을 한 경 우에만 결손금 소급공제를 적용할 수 있다. 이때, 결손금 소급공제는 공제를 받을지 말지도 선택사항이고, 받는다 면 얼마를 적용하여 받을지도 선택사항이므로 발생한 결 손금의 일부만을 소급공제 신청할 수 있다.","pg":313},{"id":1641,"ch":34,"n":14,"q":"중소기업이 전기 사업연도에 대한 법인세 과세표준과 세액 을 신고기한 내에 신고하고, 당기 사업연도에 대한 법인세 과세표준과 세액은 기한후 신고한 경우 결손금소급공제를 받을 수 있다.","a":"X","e":"결손금 소급공제는 과세표준 신고기한 내 결손금이 발생 한 사업연도와 그 직전 사업연도의 소득에 대한 법인세 과세표준 및 세액을 각각 신고한 경우에만 적용한다.","pg":313},{"id":1642,"ch":34,"n":15,"q":"중소기업은 각 사업연도에 결손금이 발생한 경우, 직전 및 직전 전 사업연도의 소득에 대하여 과세된 법인세액을 한도 로 그 결손금의 환급을 신청할 수 있다.","a":"X","e":"중소기업은 각 사업연도에 결손금이 발생한 경우, 직전 사업연도의 소득에 대하여 과세된 법인세액을 한도로 그 결손금의 환급을 신청할 수 있다.","pg":313},{"id":1643,"ch":34,"n":16,"q":"중소기업은 결손금 소급공제시 직전 사업연도의 소득에 대 하여 과세된 법인세액을 한도로 한다. 여기에서 과세된 법 인세액이란 법령에 따른 토지 등 양도소득에 대한 법인세를 포함하고 직전 사업연도의 소득에 대한 법인세로서 공제 또 는 법인세액을 차감한 금액을 말한다.","a":"X","e":"중소기업은 결손금 소급공제시 직전 사업연도의 소득에 대하여 과세된 법인세액을 한도로 한다. 여기에서 과세된 법인세액이란 법령에 따른 토지 등 양도소득에 대한 법인 세를 제외하고 직전 사업연도의 소득에 대한 법인세로서 공제 또는 법인세액을 차감한 금액을 말한다.","pg":313},{"id":1644,"ch":34,"n":17,"q":"이월결손금으로 공제될 수 있는 결손금은 법인세 과세표준 신고에 포함되었거나 과세행정청의 법인세 결정. 경정에 포 함된 결손금이어야 하며, 그 외 납세자가 「국세기본법」에 따 라 수정신고하면서 과세표준에 포함된 경우에는 그 대상이 될 수 없다.","a":"X","e":"이월결손금으로 공제될 수 있는 결손금은 「법인세법」에 따라 신고, 결정, 경정되거나 「국세기본법」에 따라 수정신 고한 과세표준에 포함된 결손금이어야 한다.","pg":313},{"id":1645,"ch":34,"n":18,"q":"특례기부금의 손금산입 한도액을 계산함에 있어 기준소득금 액에서 차감하는 이월결손금은 그 발생시점에 제한이 없다.","a":"X","e":"특례기부금의 손금산입 한도액을 계산함에 있어 기준소 득금액에서 차감하는 이월결손금은 각 사업연도 개시일 전 15년(10년) 이내 발생분에 한하며, 해당 이월결손금은 소멸된 것이 아니므로 과세표준 계산 시 각 사업연도 소 득금액에서 공제할 수 있다.","pg":314},{"id":1646,"ch":34,"n":19,"q":"중소기업이 전기 사업연도에 대한 법인세 과세표준과 세액 을 신고기한 내에 신고하고, 당기 사업연도에 대한 법인세 과세표준과 세액은 기한 후 신고한 경우 결손금소급공제를 받을 수 있다.","a":"X","e":"결손금의 소급공제를 적용받기 위해서는 과세표준 신고 기한 내 결손금이 발생한 사업연도와 그 직전 사업연도의 소득에 대한 법인세 과세표준 및 세액을 각각 신고한 경 우에만 적용한다. 당기 사업연도 법인세 과세표준과 세액 에 대한 경정 또는 기한후신고로 결손금이 발생(또는 증 가)한 경우에는 당초에 소급공제받겠다고 신청한 금액이 아니므로 결손금소급공제를 받을 수 없다.","pg":314},{"id":1647,"ch":34,"n":20,"q":"결손금의 일부는 이월공제받고 일부는 소급공제받은 경우 결손금의 감소에 따른 과다환급세액을 계산할 때 이월공제 받지 않은 결손금이 먼저 감소된 것으로 본다.","a":"X","e":"결손금의 일부는 이월공제받고 일부는 소급공제받은 경 우 결손금의 감소에 따른 과다환급세액을 계산할 때 이월 공제 받은 결손금이 먼저 감소된 것으로 본다","pg":314},{"id":1648,"ch":34,"n":21,"q":"납세지 관할 세무서장은 중소기업에 해당하지 아니하는 내 국법인이 결손금 소급공제에 따른 법인세를 환급 받은 경우 에는 환급세액에 대통령령으로 정하는 바에 따라 계산한 이 자상당액을 더한 금액을 해당 결손금이 발생한 사업연도의 법인세로서 징수한다.","a":"O","e":"","pg":314},{"id":1649,"ch":34,"n":22,"q":"납세지 관할 세무서장은 법령에서 정하는 추징사유가 발생 한 경우에는 환급취소세액에 이자상당액을 더한 금액을 해 당 환급세액을 추징한 사업연도의 법인세로서 징수한다. 332 제5편 법인세법","a":"X","e":"납세지 관할 세무서장은 법령에서 정하는 추징사유가 발 생한 경우에는 환급취소세액에 이자상당액을 더한 금액 올 해당 결손금이 발생한 사업연도의 법인세로서 징수한 다.","pg":314},{"id":1650,"ch":34,"n":23,"q":"「공익신탁법」에 따른 공익신탁의 신탁재산에서 생기는 소득 은 각 사업연도 소득에 대한 법인세를 과세한다.","a":"X","e":"「공익신탁법」에 따른 공익신탁의 신탁재산에서 생기는 소 득은 각 사업연도 소득에 대한 법인세를 과세하지 아니한 다.","pg":315},{"id":1651,"ch":34,"n":24,"q":"「조세특례제한법」에 의한 비과세소득을 적용받고자 하는 법 인은 납세지 관할 세무서장에게 신청하여야 한다.","a":"X","e":"비과세소득은 신청을 요건으로 하지 않는다.","pg":315},{"id":1652,"ch":34,"n":25,"q":"해당 사업연도의 과세표준을 계산할 때 공제되지 아니한 비 과세소득은 해당 사업연도의 다음 사업연도 이후로 이월하 여 공제할 수 있다.","a":"X","e":"해당 사업연도의 과세표준을 계산할 때 공제되지 아니한 비과세 소득은 해당 사업연도의 다음 사업연도 이후로 이 월하여 공제할 수 없다.","pg":315},{"id":1653,"ch":34,"n":26,"q":"자산유동화에 관한 법률」에 따른 유동화전문회사가 배당 가능 이익의 90% 이상을 배당한 경우 그 금액은 해당 배당 을 결의한 날이 속하는 사업연도의 소득금액에서 공제한다.","a":"X","e":"「자산유동화에 관한 법률」에 따른 유동화전문회사가 배당 가능 이익의 90% 이상을 배당한 경우 그 금액은 해당 배 당을 결의한 잉여금 처분의 대상이 되는 사업연도의 소득 금액에서 공제한다.","pg":315},{"id":1654,"ch":34,"n":27,"q":"「기업구조조정투자회사법」에 따른 기업구조조정투자회사가 법령으로 정하는 배당가능이익의 100분의 50 이상을 배당 한 경우 그 금액은 해당 배당을 결의한 잉여금 처분의 대상 이 되는 사업연도의 소득금액에서 공제한다.","a":"X","e":"「기업구조조정투자회사법」에 따른 기업구조조정투자회사 가 법령으로 정하는 배당가능이익의 100분의 90 이상을 배당한 경우 그 금액은 해당 배당을 결의한 잉여금 처분 의 대상이 되는 사업연도의 소득금액에서 공제한다.","pg":315},{"id":1655,"ch":34,"n":28,"q":"유동화전문회사 등에 대한 소득공제를 받으려는 법인은 소 득공제신청서를 배당일로부터 2주 이내에 본점 소재지 관할 세무서장에게 제출해야 한다.","a":"X","e":"유동화전문회사 등에 대한 소득공제를 받으려는 법인은 소득공제신청서를 과세표준신고와 함께 납세지 관할 세 무서장에게 제출해야 한다.","pg":315},{"id":1656,"ch":34,"n":29,"q":"배당을 지급하는 내국법인이 사모방식으로 설립되었고, 개 인 2인이 발행주식총수의 100분의 95의 주식을 소유한 법 인(개인에게 배당 및 잔여재산의 분배에 관한 청구권이 없는 경우는 제외)인 경우에는 유동화전문회사 등에 대한 소득공 제 규정을 적용할 수 있다.","a":"X","e":"배당을 지급하는 내국법인이 사모방식으로 설립되었고, 개인 2인이 발행주식총수의 100분의 95의 주식을 소유한 법인(개인에게 배당 및 잔여재산의 분배에 관한 청구권이 없는 경우는 제외)인 경우에는 유동화전문회사 등에 대한 메당소득공제를 적용하지 아니한다.","pg":316},{"id":1657,"ch":35,"n":1,"q":"내국법인의 각 사업연도의 소득금액에 외국자회사로부터 받 는 수입배당금액(「법인세법」상 외국자회사 수입배당금 익금 불산입 규정 적용대상이 아님)이 포함되어 있는 경우에 외국 자회사가 납부한 법인세액 중 그 수입배당금액에 대응하는 것으로서 소정의 금액은 내국법인이 납부한 것으로 간주 하여 세액공제되는 외국법인세액으로 본다.","a":"O","e":"참고 외국자회사 수입배당금액 익금불산입 규정의 적용대상이 되 는 수입배당금액에 대해서는 외국납부세액공제 규정을 적용하지 아니함에 주의","pg":317},{"id":1658,"ch":35,"n":2,"q":"간접외국납부세액공제 대상이 되는 외국자회사란 내국법인 이 직접 외국자회사의 의결권 있는 발행주식총수의 100분의 10(「조세특례제한법」에 따른 해외자원개발사업을 하는 외국 법인의 경우에는 100분의 5) 이상을 해당 외국자회사의 배 당기준일 현재 3개월 이상 계속하여 보유하고 있는 법인을 말한다.","a":"X","e":"간접외국납부세액공제 대상이 되는 외국자회사란 내국 법인이 직접 외국자회사의 의결권 있는 발행주식총수의 100분의 10「조세특례제한법」에 따른 해외자원개발사업 을 하는 외국법인의 경우에는 100분의 5) 이상을 해당 외 국자회사의 배당기준일 현재 6개월 이상 계속하여 보유 하고 있는 법인을 말한다.","pg":317},{"id":1659,"ch":35,"n":3,"q":"간접외국납부세액 적용 대상 외국자회사란 배당확정일 현재 6개월 이상 계속하여 의결권 있는 발행주식총수 또는 출자 총액의 25%(해외자원개발사업을 하는 외국법인의 경우에는 5%) 이상을 출자하고 있는 외국법인으로서 법령으로 정하는 요건을 갖춘 법인을 말한다.","a":"X","e":"간접외국납부세액 적용 대상 외국자회사란 배당확정일 현재 6개월 이상 계속하여 의결권 있는 발행주식총수 또 는 출자총액의 10%(해외자원개발사업을 하는 외국법인 의 경우에는 5%) 이상을 출자하고 있는 외국법인으로서 법령으로 정하는 요건을 갖춘 법인을 말한다.","pg":317},{"id":1660,"ch":35,"n":4,"q":"내국법인이 적격합병에 따라 다른 내국법인이 보유하고 있 던 외국자회사의 주식등을 승계 받은 때에는 적격합병으로 인하여 외국자회사의 주식등을 취득한 때부터 해당 주식 등 을 보유한 것으로 본다.","a":"X","e":"내국법인이 적격합병에 따라 다른 내국법인이 보유하고 있던 외국자회사의 주식등을 승계 받은 때에는 그 승계 전 다른 내국법인이 외국자회사의 주식등을 취득한 때부 터 해당 주식 등을 보유한 것으로 본다.","pg":317},{"id":1661,"ch":35,"n":5,"q":"내국법인은 외국법인세액을 납부하였거나 납부할 것이 있는 경우 외국 법인세액 전액을 해당 사업연도의 산출세액에서 공제할 수 있다.","a":"X","e":"내국법인은 외국법인세액을 납부하였거나 납부할 것이 있는 경우 공제한도금액 내에서 외국 법인세액을 해당 사 업연도의 산출세액에서 공제할 수 있다.","pg":317},{"id":1662,"ch":35,"n":6,"q":"내국법인의 각 사업연도의 소득에 대한 과세표준에 국외원 천소득이 포함되어 있는 경우로서 그 국외원천소득에 대하 여 외국법인세액을 납부하였거나 납부할 것이 있는 경우에 는 해당 외국법인세액을 한도 없이 해당 사업연도의 산출세 액에서 공제할 수 있다.","a":"X","e":"내국법인의 각 사업연도의 소득에 대한 과세표준에 국외 원천소득이 포함되어 있는 경우로서 그 국외원천소득에 대하여 외국법인세액을 납부하였거나 납부할 것이 있는 경우에는 해당 외국법인세액을 공제 한도 내에서 해당 사 업연도의 산출세액에서 공제할 수 있다.","pg":318},{"id":1663,"ch":35,"n":7,"q":"국외사업장이 둘 이상의 국가에 있는 경우에도 외국납부세 액공제의 한도액은 국가별로 구분하지 아니하고 계산한다.","a":"X","e":"국외사업장이 둘 이상의 국가에 있는 경우에는 국가별로 구분하여 외국납부세액공제 한도액을 계산한다.","pg":318},{"id":1664,"ch":35,"n":8,"q":"외국납부세액공제는 해당 법인의 국내 법인세 산출세액에 국외원천소득이 과세표준에서 차지하는 비율을 곱한 금액을 한도로 하며, 이를 초과하는 금액은 해당 사업연도의 개시일 부터 5년 이내에 끝나는 각 사업연도로 이월하여, 그 이월된 사업연도의 공제한도금액 내에서 공제받을 수 있다.","a":"X","e":"외국납부세액공제는 해당 법인의 국내 법인세 산출세액 에 국외원천소득이 과세표준에서 차지하는 비율을 곱한 금액을 한도로 하며, 이를 초과하는 금액은 해당 사업연 도의 다음 사업연도 개시일부터 10년 이내에 끝나는 각 사업연도로 이월하여, 그 이월된 사업연도의 공제한도금 액 내에서 공제받을 수 있다. 다만, 외국정부에 납부하였 거나 납부할 외국법인세액을 이월공제기간 내에 공제받지 못한 경우 그 공제받지 못한 외국법인세액은 이월공제기간 의 종료일 다음 날이 속하는 사업연도의 소득금액을 계산 할 때 손금에 산입할 수 있다.","pg":318},{"id":1665,"ch":35,"n":9,"q":"국외원천소득이 있는 내국법인이 조세조약의 상대국에서 해 당 국외원천소득에 대하여 법인세를 감면받은 세액 상당액 은 그 조세조약으로 정하는 범위에서 외국납부세액 공제방 식에 따른 세액공제의 대상이 되는 외국법인세액으로 본다.","a":"X","e":"국외원천소득이 있는 내국법인이 조세조약의 상대국에서 해당 국외원천소득에 대하여 법인세를 감면받은 세액 상 당액은 그 조세조약으로 정하는 범위에서 외국납부세액 공제방식에 따른 세액공제의 대상이 되는 외국법인세액 으로 본다.","pg":318},{"id":1666,"ch":35,"n":10,"q":"천재지변 등으로 장부나 그 밖에 증명서류가 멸실되어 추계 하는 경우에는 외국납부세액공제를 받을 수 없다.","a":"X","e":"법인세의 과세표준과 세액을 추계결정 · 경정하는 경우에 는 외국납부세액공제를 적용하지 않는다. 다만, 천재지변 등으로 장부나 그 밖에 증명서류가 멸실 되어 추계하는 경우에는 외국납부세액공제를 받을 수 있 다.","pg":318},{"id":1667,"ch":35,"n":11,"q":"법인이 각 사업연도 중 천재지변, 그 밖의 재해로 인하여 자 산총액의 100분의 15 이상을 상실하여 납세가 곤란하다고 인정되는 경우에는 상실한 자산가액을 한도로 재해손실세액 공제를 적용받을 수 있다.","a":"X","e":"법인이 각 사업연도 중 천재 지변 및 그 밖의 재해로 인 하여 자산총액의 100분의 20 이상을 상실하여 납세가 곤 란하다고 인정되는 경우에 상실한 자산가액을 한도로 재 해손실세액공제를 적용받을 수 있다.","pg":319},{"id":1668,"ch":35,"n":12,"q":"재해손실세액공제 대상이 되는 법인세에는 재해발생일이 속 하는 사업연도의 소득에 대한 법인세와 재해발생일 현재 부 과된 법인세로서 미납된 법인세가 포함되며, 재해발생일 현 재 부과되지 아니한 법인세는 공제대상에 포함되지 아니한 다.","a":"X","e":"재해손실세액공제 대상이 되는 법인세에는 재해발생일이 속하는 사업연도의 소득에 대한 법인세와 재해발생일 현 재 부과된 법인세로서 미납된 법인세가 포함되며, 재해발 생일 현재 부과되지 아니한 법인세도 공제대상에 포함한 다.","pg":319},{"id":1669,"ch":35,"n":13,"q":"재해손실세액공제를 적용받고자 하는 법인은 재해손실세액 공제신청서를 납세지 관할 세무서장에게 제출하여야 한다.","a":"O","e":"","pg":319},{"id":1670,"ch":35,"n":14,"q":"과세표준 신고기한이 지나지 아니한 법인세에서 재해손실세 액공제를 받고자 하는 내국법인은 그 신고기한 내에 세액공 제신청을 하여야 한다. 다만, 재해발생일부터 신고기한까지 의 기간이 1개월 미만인 경우에는 재해발생일부터 1개월 내 에 신청하여야 한다.","a":"X","e":"과세표준 신고기한이 지나지 아니한 법인세에서 재해손 실세액공제를 받고자 하는 내국법인은 그 신고기한 내에 세액공제신청을 하여야 한다. 다만, 재해발생일부터 신고 기한까지의 기간이 3개월 미만인 경우에는 재해발생일부 터 3개월로 한다.","pg":319},{"id":1671,"ch":35,"n":15,"q":"사실과 다른 회계처리와 관련한 경우 해당 경정일이 속한 사업연도의 개시일에 공제하는 금액은 과다납부한 세액의 20%를 한도로 하며, 공제 후 남아있는 과다납부한 세액은 없는 것으로 한다.","a":"X","e":"사실과 다른 회계처리와 관련한 경우 해당 경정일이 속한 사업연도의 개시일부터 각 사업연도별로 공제하는 금액 은 과다납부한 세액의 20%를 한도로 하며, 공제 후 남아 있는 과다납부한 세액은 이후 사업연도에 이월하여 공제 한다.","pg":319},{"id":1672,"ch":35,"n":16,"q":"내국법인은 각 사업연도의 소득에 대한 법인세 산출세액에 해당 사업연도에 원천징수된 세액을 합산한 금액을 각 사업 연도의 소득에 대한 법인세로서 납부하여야 한다.","a":"X","e":"원천징수세액은 기납부세액으로서 산출세액에서 차감한 다. 힘고 차강납부세액을 계산할 때 사업연도 중 이미 납부징수한 원천 징수세액·중간예납세액・수시부과세액을 기납부세액으로 차감하여 정산함","pg":320},{"id":1673,"ch":35,"n":17,"q":"법인에게 이자소득, 배당소득을 지급하는 경우에는 원천징 수하여야 한다.","a":"X","e":"법인에게 지급되는 이자소득과 투자신탁이익에 대하여만 원천징수한다. 따라서 법인에게 지급되는 배당소득은 원 친징수 대상이 아니다.","pg":320},{"id":1674,"ch":35,"n":18,"q":"법인세가 비과세되거나 면제되는 소득도 원천징수대상소득 에 포함된다.","a":"X","e":"법인세가 비과세되거나 면제되는 소득은 원천징수대상소 득에 포함되지 않는다.","pg":320},{"id":1675,"ch":35,"n":19,"q":"제조업을 영위하는 내국법인 A가 해당 법인의 주주인 내국 법인 B(제조업)에게 배당금을 지급하는 경우에는 그 배당금 에 대한 법인세의 원천징수를 해야 한다.","a":"X","e":"제조업을 영위하는 내국법인 A가 해당 법인의 주주인 내 국법인 B(제조업)에게 이자를 지급하는 경우에는 그 이자 소득에 대한 법인세의 원천징수를 해야 한다. 내국법인에 게 지급하는 배당금(집합투자기구로부터의 이익 중 투자 신탁의 이익 제외)은 원천징수대상에 제외된다.","pg":320},{"id":1676,"ch":35,"n":20,"q":"신고한 과세표준에 이미 산입된 미지급소득에 대해서는 법 인세를 원천징수하지 아니한다.","a":"O","e":"","pg":320},{"id":1677,"ch":35,"n":21,"q":"각 사업연도의 기간이 6개월 이하인 법인은 중간예납세액의 납세의무를 지지 아니한다.","a":"O","e":"","pg":320},{"id":1678,"ch":35,"n":22,"q":"사업연도의 기간이 6개월을 초과하는 「고등교육법」에 따른 사립학교를 경영하는 학교법인은 각 사업연도(합병이나 분 할에 의하지 아니하고 새로 설립된 법인의 최초 사업연도는 제외) 중 중간예납세액을 납부할 의무가 있다.","a":"X","e":"사업연도의 기간이 6개월을 초과하는 「고등교육법」에 따 른 사립학교를 경영하는 학교법인은 중간예납세액을 납 부할 의무가 없다.","pg":320},{"id":1679,"ch":35,"n":23,"q":"합병이나 분할에 의한 신설 내국법인은 최초사업연도의 기 간이 6개월을 초과하더라도 최초사업연도에 대한 중간예납 의무가 없다.","a":"X","e":"합병이나 분할에 의한 신설 내국법인은 최초사업연도의 기간이 6개월을 초과하더라도 최초사업연도에 대한 중간 예납세액을 납부할 의무가 있다.","pg":321},{"id":1680,"ch":35,"n":24,"q":"새로 설립된 모든 내국법인의 경우 설립 후 최초 사업연도 에는 중간예납세액을 납부할 의무가 없다.","a":"X","e":"합병이나 분할에 의하지 아니하고 새로 설립된 내국법인 의 경우 설립 후 최초 사업연도에는 중간예납세액을 납부 할 의무가 없다. 즉, 합병이나 분할에 의하여 신설된 내국 법인은 설립 후 최초 사업연도의 기간이 6개월을 초과하 는 경우 중간예납의무가 있다.","pg":321},{"id":1681,"ch":35,"n":25,"q":"납세지 관할세무서장은 중간예납기간 중 휴업 등의 사유로 수입금액이 없는 법인에 대하여 그 사실이 확인된 경우에도 해당 중간예납기간에 대한 법인세를 징수하여야 한다.","a":"X","e":"납세지 관할세무서장은 중간예납기간 중 휴업 등의 사유 로 수입금액이 없는 법인에 대하여 그 사실이 확인된 경 우에는 해당 중간예납기간에 대한 법인세를 징수하지 아 니한다.","pg":321},{"id":1682,"ch":35,"n":26,"q":"「고등교육법」에 따른 사립학교를 경영하는 학교법인과 직전 사업연도의 중소기업으로서 직전 사업연도의 산출세액을 기 준으로 하는 방법에 따라 계산한 중간예납세액이 50만원 미 만인 내국법인은 중간예납세액을 납부할 의무가 없다.","a":"O","e":"","pg":321},{"id":1683,"ch":35,"n":27,"q":"직전 사업연도 종료일 현재 「독점규제 및 공정거래에 관한 법률」에 따른 공시대상기업집단에 속하는 기업 중 업종별로 「중소기업기본법 시행령」에 따른 중소기업기준 이내인 법인 은 해당 중간예납기간의 법인세액을 기준으로 하는 방법에 따라 중간예납세액을 계산하여야 한다.","a":"X","e"
