<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세법 OX 학습</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--bd:#e3e6ea;--pri:#2f5bea;--ok:#16a34a;--okb:#e7f7ee;--no:#dc2626;--nob:#fdecec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--card:#1b1e23;--tx:#eceff3;--mut:#9aa3af;--bd:#2c3037;--pri:#7c9cff;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#3a1a1a}}
:root[data-theme="dark"]{--bg:#111316;--card:#1b1e23;--tx:#eceff3;--mut:#9aa3af;--bd:#2c3037;--pri:#7c9cff;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#3a1a1a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
select,button{font:inherit;color:var(--tx)}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);margin-bottom:8px}
label.opt{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--mut);font-size:14px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--pri);color:#fff;width:100%;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri)}
.tag{font-size:12px;color:var(--mut);margin-bottom:6px}
.q{font-size:18px;line-height:1.7;margin:4px 0 16px}
.ox{height:76px;font-size:34px;font-weight:800;border-radius:14px;border:2px solid var(--bd);background:var(--card);cursor:pointer}
.ox.o{color:var(--pri)}.ox.x{color:var(--no)}
.res{border-radius:12px;padding:12px 14px;margin-top:14px}
.res.ok{background:var(--okb);border:1px solid var(--ok)}.res.no{background:var(--nob);border:1px solid var(--no)}
.res b.h{font-size:17px}
.ex{margin-top:8px;font-size:15px}.ex small{display:block;color:var(--mut)}
.stat{display:flex;gap:8px;margin:8px 0}.stat div{flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:10px}.stat b{display:block;font-size:20px}
.sm{font-size:13px;color:var(--mut)}
.link{background:none;border:0;color:var(--pri);padding:6px;cursor:pointer}
</style></head><body><div class="wrap" id="app"></div>

납부세액의 계산"},{"part":5,"pname":"법인세법","c":15,"title":"법인세 납세절차"},{"part":5,"pname":"법인세법","c":16,"title":"기타 법인세"},{"part":5,"pname":"법인세법","c":17,"title":"합병 및 분할"},{"part":5,"pname":"법인세법","c":18,"title":"연결납세제도"},{"part":6,"pname":"소득세법","c":1,"title":"총칙"},{"part":6,"pname":"소득세법","c":2,"title":"금융소득"},{"part":6,"pname":"소득세법","c":3,"title":"사업소득"},{"part":6,"pname":"소득세법","c":4,"title":"근로소득"},{"part":6,"pname":"소득세법","c":5,"title":"연금소득 및 기타소득"},{"part":6,"pname":"소득세법","c":6,"title":"소득금액계산의 특례"},{"part":6,"pname":"소득세법","c":7,"title":"종합소득과세표준의 계산"},{"part":6,"pname":"소득세법","c":8,"title":"차감납부세액의 계산"},{"part":6,"pname":"소득세법","c":9,"title":"퇴직소득세"},{"part":6,"pname":"소득세법","c":10,"title":"양도소득세"},{"part":6,"pname":"소득세법","c":11,"title":"소득세의 납세절차"},{"part":7,"pname":"상속세 및 증여세법","c":1,"title":"상속세"},{"part":7,"pname":"상속세 및 증여세법","c":2,"title":"증여세"},{"part":7,"pname":"상속세 및 증여세법","c":3,"title":"상속세 및 증여세의 납세절차"},{"part":7,"pname":"상속세 및 증여세법","c":4,"title":"재산의 평가"}],"items":[{"id":1,"ch":0,"n":1,"q":"01 '조세'란 국가 또는 지방자치단체가 그의 경비충당을 위한 재정수입을 조달할 목적으로 법률에 규정된 과세요건을 충 족한 모든 자에게 직접적 반대급부 없이 부과하는 금전급부 이다.","a":"O","e":"","pg":1},{"id":2,"ch":0,"n":2,"q":"조세를 부과하는 주체는 국가 또는 지방자치단체이다. 따라 서 공공단체가 공공사업에 필요한 경비에 충당하기 위하여 부과하는 공과금은 조세에 해당한다.","a":"X","e":"조세를 부과하는 주체는 국가 또는 지방자치단체이다. 따 라서 공공단체가 공공사업에 필요한 경비에 충당하기 위 하여 부과하는 공과금은 조세가 아니다.","pg":1},{"id":3,"ch":0,"n":3,"q":"조세는 국가 또는 지방자치단체의 경비충당을 위한 재정수 입을 조달할 목적으로 부과된다. 따라서 위법행위에 대한 제 재에 주된 목적을 두고 국가 또는 지방자치단체가 부과하는 벌금·과로 과태료 등은 조세에 해당한다.","a":"X","e":"조세는 국가 또는 지방자치단체의 경비충당을 위한 재정 수입을 조달할 목적으로 부과된다. 따라서 위법행위에 대 한 제재에 주된 목적을 두고 부과되는 벌금·과료. 과태 료 등은 조세가 아니다.","pg":1},{"id":4,"ch":0,"n":4,"q":"국가 또는 지방자치단체가 제공하는 특정한 용역에 대한 대 가인 수수료 · 사용료 · 특허료 등은 조세가 될 수 없다.","a":"O","e":"","pg":1},{"id":5,"ch":0,"n":5,"q":"납세의무자는 국가가 제공하는 국방·치안 · 기타 사회복지 의 혜택을 받고 이에 대한 대가로 조세를 납부하기 때문에 조세는 개별적인 보상의 성격을 갖는다.","a":"X","e":"납세의무자는 국가가 제공하는 국방. 치안 및 기타 사회 복지의 혜택을 받지만, 이것은 자기가 납부한 조세와 비 례하여 주어지는 직접적 반대급부(개별적 보상)는 아니 다.","pg":1},{"id":6,"ch":0,"n":6,"q":"조세는 금전급부이다. 다만, 세법에서는 국세 중 상속세와 증여세의 물납을 허용하고 있다.","a":"X","e":"조세는 금전급부이다. 다만, 세법에서는 국세 중 상속세 의 물납을 허용하고 있다. 증여세의 물납은 인정되지 않 는다.","pg":1},{"id":7,"ch":0,"n":7,"q":"국민은 법률에 의해서만 납세의무를 진다.","a":"O","e":"","pg":2},{"id":8,"ch":0,"n":8,"q":"P 08 조세의 과세요건 및 부과·징수 절차는 입법부가 제정하는 법률로 정해져야 한다.","a":"O","e":"","pg":2},{"id":9,"ch":0,"n":9,"q":"모든 과세요건과 부과·징수절차를 모두 법률로 규정하는 것은 현실적으로 불가능하므로 시행령 또는 시행규칙에 이 를 포괄위임할 수 있다.","a":"X","e":"조세법률주의의 가장 핵심적 원칙은 과세요건과 조세의 부과·징수절차를 모두 법률로써 규정해야 한다는 원칙 이다. 그러나 모든 과세요건과 부과·징수 절차를 법률로 규정하는 것은 현실적으로 불가능하므로 시행령 또는 시 행규칙에 이를 위임할 수 있다. 단, 이 경우 구체적·개별 적으로 위임범위를 정하는 개별위임은 허용되지만, 포괄 위임(또는 백지위임. 골격입법)은 허용되지 않는다.","pg":2},{"id":10,"ch":0,"n":10,"q":"엄격해석으로 세법상 의미를 확정할 수 없는 경우 세법규정 의 유추적용이 허용된다.","a":"X","e":"세법은 그 문언에 충실하게 해석해야 하며, 해석에 있어 서 보정이나 보충을 원칙적으로 허용하지 않는다. 세법의 해석은 원칙적으로 문리해석에 의해야 하며, 문리해석만 으로는 그 의미를 확정할 수 없는 경우에 한정하여 보충 적·제한적으로 논리해석이 허용된다. 다만, 논리해석이 허용되지만 확장해석이나 유추해석은 허용되지 않는다.","pg":2},{"id":11,"ch":0,"n":11,"q":"11 조세법률주의는 과세권의 자의적 발동으로부터 납세자를 보 호하기 위한 대원칙으로 「민법」에 그 근거를 두고 있다.","a":"X","e":"조세법률주의는 과세권의 자의적 발동으로부터 납세자를 보호하기 위한 대원칙으로 「헌법」 제38조 및 59조에 그 근거를 두고 있다.","pg":2},{"id":12,"ch":0,"n":12,"q":"12 새로운 세법의 효력발생 전에 완결된 사실에 대하여 해당 새로운 세법을 적용해서는 안 되는 것이 원칙이다.","a":"O","e":"","pg":2},{"id":13,"ch":0,"n":13,"q":"제3자를 통한 간접적인 방법으로 「소득세법」의 혜택을 부당 하게 받기 위한 것으로 인정되어 그 경제적 실질내용에 따 라 당사자가 직접 거래를 한 것으로 보아 「소득세법」을 적용 하는 것은 조세평등주의를 구현하기 위한 것이다.","a":"O","e":"현행 세법이 규정하고 있는 실질과세의 원칙, 부당행위계 산의 부인 규정 등은 조세평등주의를 구현하기 위한 하부 원칙에 속한다.","pg":3},{"id":14,"ch":0,"n":14,"q":"14 세법은 국가의 최고법규로서, 그에 위반하는 「헌법」과 「민 법은 무효이다.","a":"X","e":"「헌법」은 국가의 최고법규로서, 그에 위반하는 조세법규 와 과세관청의 행위는 무효이다.","pg":3},{"id":15,"ch":0,"n":15,"q":"15 '명령'은 헌법의 규정에 따라 국회에서 제정하는 것으로 조 세법의 핵심적인 법원이다.","a":"X","e":"'법률'은 헌법의 규정에 따라 국회에서 제정하는 것으로 조세법의 핵심적인 법원이다. '명령'이란 입법기관인 국회의 의결을 거치지 않고 행정부 가 제정하는 법규를 말한다.","pg":3},{"id":16,"ch":0,"n":16,"q":"'규칙'이란 지방의회가 제정하는 법규이며, '조례'란 지방자 치단체의 장이 제정하는 법규이다.","a":"X","e":"'조례'란 지방의회가 제정하는 법규이며, '규칙'이란 지방 자치단체의 장이 제정하는 법규이다.","pg":3},{"id":17,"ch":0,"n":17,"q":"상급행정기관이 하급행정기관의 권한행사를 지휘하기 위하 여 발하는 훈령·예규· 통첩 등의 '행정규칙'은 법원을 구속 하는 법규로서의 효력을 갖는다.","a":"X","e":"상급행정기관이 하급행정기관의 권한행사를 지휘하기 위 하여 발하는 훈령·예규· 통첩 등의 '행정규칙'은 과세관 청이 조세사무를 집행하는 기준이 되기 때문에 납세자에 게 막대한 영향을 미치고 있으나 어디까지나 행정기관 내 부의 지침에 불과할 뿐이므로 국민이나 법원을 구속하는 법규로서의 효력을 갖지는 못한다.","pg":3},{"id":18,"ch":0,"n":18,"q":"'조리'란 관습 가운데 국민들의 법적 확신을 얻은 것을 말한 다.","a":"X","e":"'관습법'이란 관습 가운데 국민들의 법적 확신을 얻은 것 을 말한다. '조리'란 사물의 당연한 이치를 말한다.","pg":3},{"id":19,"ch":1,"n":1,"q":"「국세기본법」은 납세자의 부담능력 등에 따라 적정하게 과 세함으로써 조세부담의 형평을 도모하고 재정수입의 원활한 조달에 이바지함을 목적으로 한다.","a":"X","e":"「국세기본법」은 국세에 관한 기본적이고 공통적인 사항 과 납세자의 권리·의무 및 권리구제에 관한 사항을 규정 함으로써 국세에 관한 법률관계를 명확하게 하고, 과세를 공정하게 하며, 국민의 납세의무의 원활한 이행에 이바지 함을 목적으로 한다. 참고 납세자의 부담능력 등에 따라 적정하게 과세함으로써 조세 부당의 형평을 도모하고 재정수입의 원활한 조달에 이바지함을 목적 으로 하는 것은 「소득세법」","pg":4},{"id":20,"ch":1,"n":2,"q":"「국세기본법」에 따른 '국세란 국가가 부과하는 조세 중 소득 세, 법인세, 상속세와 증여세, 종합부동산세, 부가가치세, 개 별소비세, 교통에너지환경세, 주세, 인지세, 증권거래세, 교육세 및 농어촌특별세, 관세를 말한다.","a":"X","e":"「국세기본법」에 따른 '국세'란 국가가 부과하는 조세 중소 득세, 법인세, 상속세와 증여세, 종합부동산세, 부가가치 세, 개별소비세, 교통·에너지·환경세, 주세, 인지세. 증권거래세, 교육세 및 농어촌특별세를 말한다. 「국세기본법」에 따른 '국세'라는 용어는 관세를 포함하지 않는 '내국세'만을 가리킨다.","pg":4},{"id":21,"ch":1,"n":3,"q":"「국세기본법」에 따른 '세법'이란 국세의 종목과 세율을 정하 고 있는 법률과 「국세기본법」 「국세징수법」 「조세특례제한 법」 「국제조세조정에 관한 법률」 「조세범 처벌법」 및 「조세 범 처벌절차법」을 말한다.","a":"X","e":"「국세기본법」에 따른 '세법'이란 국세의 종목과 세율을 정 하고 있는 법률과 국세징수법」, 「조세특례제한법」, 「국제 조세조정에 관한 법률」, 「조세범 처벌법」 및 「조세범 처벌 절차법을 말한다. 본래 「국세기본법」· 「지방세법」・「관세 법」 등도 세법에 속하지만, 「국세기본법」에 따른 '세법'이 라는 용어는 이들을 포함하지 않는다.","pg":4},{"id":22,"ch":1,"n":4,"q":"「국세기본법」에 따른 '원천징수'란 세법에 따라 원천징수의 무자가 국세(이와 관계되는 가산세는 포함한다)를 징수하는 것을 말한다.","a":"X","e":"「국세기본법」에 따른 '원천징수'란 세법에 따라 원천징수 의무자가 국세(이와 관계되는 가산세는 제외한다)를 징수 하는 것을 말한다.","pg":4},{"id":23,"ch":1,"n":5,"q":"「국세기본법」에 따른 '가산세'란 「국세기본법」 및 세법에서 규정하는 의무의 성실한 이행을 확보하기 위하여 세법에 따 라 산출한 세액에 가산하여 징수하는 금액을 말한다.","a":"O","e":"","pg":5},{"id":24,"ch":1,"n":6,"q":"「국세기본법」에 따른 '강제징수비'란 「국세징수법」 중 강제징 수에 관한 규정에 따른 재산의 압류, 보관, 운반과 매각에 든 비용(매각을 대행시키는 경우 수수료는 제외한다)을 말한다.","a":"X","e":"「국세기본법」에 따른 '강제징수비'란 「국세징수법」 중 강제 징수에 관한 규정에 따른 재산의 압류, 보관, 운반과 매각 에 든 비용(매각을 대행시키는 경우 그 수수료를 포함한 다)을 말한다.","pg":5},{"id":25,"ch":1,"n":7,"q":"「국세기본법」에 따른 '납세자'란 세법에 따라 국세를 납부할 의무(국세를 징수하여 납부할 의무는 제외한다)가 있는 자를 말한다.","a":"X","e":"「국세기본법」에 따른 '납세의무자'란 세법에 따라 국세를 납부할 의무(국세를 징수하여 납부할 의무는 제외한다)가 있는 자를 말한다.","pg":5},{"id":26,"ch":1,"n":8,"q":"「국세기본법」에 따른 '납세의무자'란 납세의무자(연대납세의 무자와 납세자를 갈음하여 납부할 의무가 생긴 경우의 제2 차 납세의무자 및 보증인을 포함한다)와 세법에 따라 국세를 징수하여 납부할 의무를 지는 자를 말한다. ○","a":"X","e":"「국세기본법」에 따른 '납세자'란 납세의무자(연대납세의무 자와 납세자를 갈음하여 납부할 의무가 생긴 경우의 제2 차 납세의무자 및 보증인을 포함한다)와 세법에 따라 국 세를 징수하여 납부할 의무를 지는 자를 말한다.","pg":5},{"id":27,"ch":1,"n":9,"q":"「국세기본법」에 따른 '제2차 납세의무자란 납세자의 국세 또는 강제징수비의 납부를 보증한 자를 말한다.","a":"X","e":"「국세기본법」에 따른 '제2차 납세의무자란 납세자가 납세 의무를 이행할 수 없는 경우에 납세자를 갈음하여 납세의 무를 지는 자를 말한다. 비교 「국세기본법」에 따른 '보증인'이란 납세자의 국세 또는 강제징 수비의 납부를 보증한 자를 말한다.","pg":5},{"id":28,"ch":1,"n":10,"q":"「국세기본법」에 따른 '과세표준'이란 세법에 따라 직접적 으로 세액산출의 기초가 되는 과세대상의 가액을 말한다.","a":"X","e":"「국세기본법」에 따른 '과세표준'이란 세법에 따라 직접적 으로 세액산출의 기초가 되는 과세대상의 수량 또는 가액 을 말한다.","pg":5},{"id":29,"ch":1,"n":11,"q":"「국세기본법」에서 규정하고 있는 실질과세의 원칙에 반하 는 규정을 다른 세법에서 규정하고 있는 경우 「국세기본법」 에서 규정하고 있는 실질과세의 원칙을 우선하여 적용한다.","a":"X","e":"「국세기본법」에서 규정하고 있는 실질과세의 원칙에 반하 는 규정을 다른 세법에서 규정하고 있는 경우 개별세법에 서 규정하고 있는 실질과세의 원칙을 우선하여 적용한다.","pg":6},{"id":30,"ch":1,"n":12,"q":"「관세법」과 「수출용 원재료에 대한 관세 등 환급에 관한 특 례법」에서 세관장이 부과·징수하는 국세에 관하여 「국세기 본법」에 대한 특례규정을 두고 있는 경우 「국세기본법」에서 정하는 바에 따른다.","a":"X","e":"「관세법」과 「수출용 원재료에 대한 관세 등 환급에 관한 특례법」에서 세관장이 부과·징수하는 국세에 관하여 「국 세기본법」에 대한 특례규정을 두고 있는 경우에는 그 법 에서 정하는 바에 따른다. 즉 관세법 등이 「국세기본법」에 우선한다.","pg":6},{"id":31,"ch":1,"n":13,"q":"「국세기본법」 또는 세법에서 규정하는 기간의 계산에 관하 여 「민법」에서 달리 규정하고 있는 것은 「민법」에서 정하는 바에 따른다.","a":"X","e":"'기간'이란 어느 시점에서 어느 시점까지의 계속된 시간을 말한다. 「국세기본법」 또는 세법에서 규정하는 기간의 계 산은 「국세기본법」 또는 그 세법에 특별한 규정이 있는 것 을 제외하고는 「민법」에 따른다.","pg":6},{"id":32,"ch":1,"n":14,"q":"기간을 일. 주. 월. 연으로 정한 때에는 기간의 말일은 산 입하지 않는다.","a":"X","e":"기간을 일·주·월·연으로 정한 때에는 기간의 초일은 산입하지 않는다.","pg":6},{"id":33,"ch":1,"n":15,"q":"「국세기본법」 또는 세법에서 규정하는 신고, 신청, 청구, 그 밖에 서류의 제출, 통지, 납부 또는 징수에 관한 기한이 토요 일 및 일요일, 공휴일 및 대체공휴일, 노동절일 때에는 토요 일 및 일요일, 공휴일 및 대체공휴일, 노동절의 다음 날을 기 한으로 한다.","a":"O","e":"","pg":6},{"id":34,"ch":1,"n":16,"q":"세법에서 규정하는 서류의 제출기한이 2027년 4월 29일(토 요일)인 경우 2027년 5월 1일(월요일)까지 제출하여야 한다.","a":"X","e":"세법에서 규정하는 서류의 제출기한이 2027년 4월 29일 (토요일)인 경우 2027년 5월 2일(화요일)까지 제출하여 야 한다. 고 5월 1일은 노동절이다.","pg":6},{"id":35,"ch":1,"n":17,"q":"「국세기본법」 또는 세법에서 규정하는 신고기한 만료일 또 는 납부기한 만료일에 국세정보통신망이 정전, 통신상의 장 애. 프로그램의 오류, 그 밖에 부득이한 사유로 국세정보통 신망의 가동이 정지되어 전자신고나 전자납부를 할 수 없는 경우에는 그 장애가 복구되어 신고 또는 납부할 수 있게 된 날을 기한으로 한다.","a":"X","e":"「국세기본법」 또는 세법에서 규정하는 신고기한 만료일 또는 납부기한 만료일에 국세정보통신망이 정전, 통신상 의 장애, 프로그램의 오류. 그 밖에 부득이한 사유로 국 세정보통신망의 가동이 정지되어 전자신고나 전자납부를 할 수 없는 경우에는 그 장애가 복구되어 신고 또는 납부 할 수 있게 된 날의 다음 날을 기한으로 한다.","pg":7},{"id":36,"ch":1,"n":18,"q":"우편으로 과세표준신고·과세표준수정신고. 경정청구와 관 련된 서류를 제출한 경우 해당 서류가 도달한 날에 제출된 것으로 본다.","a":"X","e":"우편으로 과세표준신고서, 과세표준수정신고서, 경정청 구서 또는 과세표준신고·과세표준수정신고. 경정청구 와 관련된 서류를 제출한 경우 「우편법」에 따른 우편날짜 도장이 찍힌 날에 신고되거나 청구된 것으로 본다.","pg":7},{"id":37,"ch":1,"n":19,"q":"우편으로 과세표준신고서를 제출한 경우로서 「우편법」에 따 른 우편날짜도장이 찍히지 않았거나 분명하지 않은 경우에 는 해당 신고서가 도달한 날에 신고된 것으로 본다.","a":"X","e":"우편으로 과세표준신고서를 제출한 경우로서 「우편법」에 따른 우편날짜도장이 찍히지 않았거나 분명하지 않은 경 우에는 통상 걸리는 배송일수를 기준으로 발송한 날로 인 정되는 날에 신고된 것으로 본다.","pg":7},{"id":38,"ch":1,"n":20,"q":"「국세기본법」에 따른 이의신청 심사청구 또는 심판청구를 할 때 불복청구기한까지 우편으로 제출한 불복청구서가 불 복청구기간을 지나서 도달한 경우에는 그 도달일에 청구를 한 것으로 본다.","a":"X","e":"「국세기본법」에 따른 이의신청 심사청구 또는 심판청구 를 할 때 불복청구기한까지 우편으로 제출한 불복청구서 가 불복청구기간을 지나서 도달한 경우에는 그 기간의 만 료일에 적법한 청구를 한 것으로 본다.","pg":7},{"id":39,"ch":1,"n":21,"q":"과세표준신고서·과세표준수정신고서·경정청구서 등을 국 세정보통신망을 이용하여 제출하는 경우에는 해당 신고서. 청구서 등이 국세청장에게 전송된 때에 신고되거나 청구된 것으로 본다.","a":"O","e":"비교 전자송달의 경우에는 송달받을 자가 지정한 전자우편주소 입력된 때(국세정보통신망에 저장하는 경우에는 저장된 때)에 그송 달을 받아야 할 자에게 도달한 것으로 봄","pg":7},{"id":40,"ch":1,"n":22,"q":"전자신고를 하는 경우 해당 전자신고 시 제출해야 하는 관 련 서류로서 국세청장이 지정하여 고시하는 서류에 대해서 는 20일의 범위에서 제출기한을 연장할 수 있다 .","a":"X","e":"전자신고를 하는 경우 해당 전자신고 시 제출해야 하는 관련 서류로서 국세청장이 지정하여 고시하는 서류에 대 해서는 10일의 범위에서 제출기한을 연장할 수 있다.","pg":7},{"id":41,"ch":1,"n":23,"q":"천재지변 등에 해당하는 사유로 「국세기본법」 또는 세법에 서 규정하는 신고 신청, 청구, 그 밖에 서류의 제출 또는 통 지를 정해진 기한까지 할 수 없다고 인정하는 경우에는 납 세자의 기한 연장 신청이 있는 경우에 한하여 관할 세무서 장은 그 기한을 연장할 수 있다.","a":"X","e":"천재지변 등에 해당하는 사유로 「국세기본법」 또는 세법 에서 규정하는 신고, 신청, 청구, 그 밖에 서류의 제출 또 는 통지를 정해진 기한까지 할 수 없다고 인정하는 경우 나 납세자가 기한 연장을 신청한 경우에 관할 세무서장은 그 기한을 연장할 수 있다. 즉, 관할 세무서장의 직권으로 도 연장할 수 있다.","pg":8},{"id":42,"ch":1,"n":24,"q":"한국은행 국고대리점의 휴무의 경우 기한 연장 사유에 해당 하지 않는다.","a":"X","e":"한국은행 국고대리점의 휴무의 경우 기한 연장 사유에 해 당한다. ... 금융회사 등(한국은행 국고대리점 및 국고수납대리점인 금융회사 등만 해당) 또는 체신관서의 휴무나 그 밖의 부득이한 사 유로 정상적인 세금납부가 곤란하다고 국세청장이 인정하는 경우 관 할 세무서장은 신고, 신청, 청구, 서류제출, 통지 등에 대하여 그 기간 을 연장할 수 있음","pg":8},{"id":43,"ch":1,"n":25,"q":"납세자가 화재 전화, 그 밖의 재해를 입거나 도난을 당한 경 우 납부기한의 연장만 가능하다.","a":"X","e":"납세자가 화재, 전화, 그 밖의 재해를 입거나 도난을 당한 경우 신고, 신청, 청구, 서류제출, 통지 등에 대하여 그 기간을 연장할 수 있다. 비교 납세자가 재난 또는 도난으로 재산에 심한 손실을 입은 경우로 서 국세를 납부기한 또는 독촉장에서 정하는 기한까지 납부할 수 없다. 고 인정되는 경우는 납부기한 등 연장도 가능하다.","pg":8},{"id":44,"ch":1,"n":26,"q":"납세자의 동거가족이 중상해로 6개월 이상의 치료가 필요한 경우 납부기한의 연장만 가능하다.","a":"X","e":"납세자 또는 그 동거가족이 질병이나 중상해로 6개월 이 상의 치료가 필요하거나 사망하여 상중인 경우 납부기한 의 연장뿐만 아니라 신고, 신청, 칭구, 서류제출, 통지 등 에 대하여 그 기간을 연장할 수 있다.","pg":8},{"id":45,"ch":1,"n":27,"q":"권한 있는 기관에 장부나 서류가 압수 또는 영치된 경우 신 고, 신청, 청구, 서류제출, 통지 등에 대하여 그 기간을 연장 할 수 있다.","a":"O","e":"","pg":8},{"id":46,"ch":1,"n":28,"q":"납세자가 경영하는 사업에 현저한 손실이 발생한 경우 신고, 신청, 청구, 서류제출, 통지 등에 대하여 그 기간을 연장할 수 있다.","a":"X","e":"납세자가 경영하는 사업에 현저한 손실이 발생한 경우 「국세징수법」상 납부고지를 유예하거나 납부기한 등을 연 장(세액을 분할하여 납부하도록 하는 것을 포함)할 수 있 다. 즉, 납부기한 등의 연장 등만 가능하다.","pg":9},{"id":47,"ch":1,"n":29,"q":"정전, 프로그램의 오류, 그 밖의 부득이한 사유로 한국은행 및 체신관서의 정보처리장치나 시스템을 정상적으로 가동시 킬 수 없어 세법에서 규정하는 신고·납부를 정하여진 기한 까지 할 수 없다고 인정되는 경우에는 관할 세무서장은 신 고·납부기한을 연장할 수 있다.","a":"O","e":"","pg":9},{"id":48,"ch":1,"n":30,"q":"기한의 연장을 받으려는 자는 기한 만료일 1일 전까지 문서 로 관할 세무서장에게 신청해야 하는 것이 원칙이다.","a":"X","e":"기한의 연장을 받으려는 자는 기한 만료일 3일 전까지 문 서로 관할 세무서장에게 신청해야 하는 것이 원칙이다.","pg":9},{"id":49,"ch":1,"n":31,"q":"기한 연장의 통지 대상자가 불특정다수인 경우 관할 세무서 장은 관보 또는 일간신문에 공고하는 방법으로 통지를 갈음 할 수 있다.","a":"O","e":"","pg":9},{"id":50,"ch":1,"n":32,"q":"서류제출 기한연장은 6개월 이내로 하되, 해당 기한연장의 사유가 소멸되지 않는 경우 관할 세무서장은 3개월의 범위 에서 그 기한을 다시 연장할 수 있다.","a":"X","e":"서류제출 기한연장은 3개월 이내로 하되, 해당 기한연장 의 사유가 소멸되지 않는 경우 관할 세무서장은 1개월의 범위에서 그 기한을 다시 연장할 수 있다.","pg":9},{"id":51,"ch":1,"n":33,"q":"신고와 관련된 기한연장은 6개월을 넘지 않는 범위에서 관 할 세무서장이 할 수 있다.","a":"X","e":"신고와 관련된 기한연장은 9개월을 넘지 않는 범위에서 관할 세무서장이 할 수 있다.","pg":9},{"id":52,"ch":1,"n":34,"q":"「국세기본법」또는 세법에 따른 서류는 그 명의인(그 서류에 수신인으로 지정된 자)에게 송달해야 하는 것이 원칙이다.","a":"O","e":"","pg":9},{"id":53,"ch":1,"n":35,"q":"교부송달의 경우 서류를 송달할 장소에서 송달 받아야 할 자를 만나지 못하였을 때에는 그 사용인이나 그 밖의 종업 원 또는 동거인으로서 사리를 판별할 수 있는 사람에게 서 류를 송달할 수 있다.","a":"O","e":"","pg":10},{"id":54,"ch":1,"n":36,"q":"송달할 장소에서 서류를 송달받아야 할 자가 부재중인 경우에 는 송달할 장소에 서류를 둘 수 있다.","a":"X","e":"교부송달 또는 등기우편송달의 경우에 송달장소에서 송 달받을 자를 만나지 못한 때에는 보충수령인(그 사용인이 나 그 밖의 종업원 또는 동거인으로서 사리를 판별할 수 있는 자)에게 서류를 송달할 수 있으나 그 보충수령인이 정당한 사유 없이 수령을 거부하는 경우에는 송달할 장소 에 서류를 둘 수 있다.","pg":10},{"id":55,"ch":1,"n":37,"q":"연대납세의무자에게 납부의 고지에 관한 서류를 송달할 때 에는 그 대표자를 명의인으로 하며, 대표자가 없을 때에는 연대납세의무자 중 국세를 징수하기에 유리한 자를 명의인 으로 한다.","a":"X","e":"연대납세의무자에게 납부의 고지와 독촉에 관한 서류를 송달할 때에는 연대납세의무자 모두에게 각각 송달해야 한다.","pg":10},{"id":56,"ch":1,"n":38,"q":"연대납세의무자에게 강제징수에 관한 서류를 송달할 때에는 연대납세의무자 모두에게 각각 송달하여야 한다.","a":"X","e":"납부의 고지와 독촉에 관한 서류는 연대납세의무자 모두 에게 각각 송달해야 한다. 그 외 서류를 연대납세의무자 에게 송달할 때에는 그 대표자(대표자가 없을 때에는 연 대납세의무자 중 국세를 징수하기에 유리한 자)를 명의인 으로 한다.","pg":10},{"id":57,"ch":1,"n":39,"q":"상속이 개시된 경우 상속재산관리인이 있을 때에는 상속재 산관리인의 주소 또는 영업소에 서류를 송달한다.","a":"O","e":"","pg":10},{"id":58,"ch":1,"n":40,"q":"상속이 개시된 경우 상속재산관리인이 있을 때에는 상속재 산관리인이 있는 경우에도 상속인과 상속재산 관리인 각각 에게 서류를 송달하여야 한다.","a":"X","e":"상속이 개시된 경우 상속재산관리인이 있을 때에는 상속 재산관리인의 주소 또는 영업소에 서류를 송단한다. 따라 시 상속재산 관리인이 있는 경우에는 상속세신 관리인에 게민 중단하면 된다.","pg":10},{"id":59,"ch":1,"n":41,"q":"납부의 고지와 독촉에 관한 서류를 송달할 때 납세관리인이 있을 때에는 그 납세관리인의 주소 또는 영업소에 송달한다.","a":"O","e":"","pg":11},{"id":60,"ch":1,"n":42,"q":"교부에 의한 송달은 해당 행정기관의 소속공무원이 서류를 송달할 장소에서 송달받아야 할 자에게 서류를 교부하는 방 법으로 해야 하지만 송달을 받아야 할 자가 송달받기를 거 부하지 아니하면 다른 장소에서 교부할 수 있다.","a":"O","e":"","pg":11},{"id":61,"ch":1,"n":43,"q":"납부의 고지·독촉. 강제징수 또는 세법에 따른 정부의 명 령과 관계되는 서류의 송달을 우편으로 할 때는 일반우편으 로 해야 한다.","a":"X","e":"납부의 고지·독촉. 강제징수 또는 세법에 따른 정부의 명령과 관계되는 서류의 송달을 우편으로 할 때는 등기우 편으로 해야 한다","pg":11},{"id":62,"ch":1,"n":44,"q":"100만원 미만에 해당하는 법인세 중간예납세액의 납부고지 서는 일반우편으로 송달할 수 있다.","a":"X","e":"법인세 중간예납세액의 납부고지서는 등기우편으로 송달 해야 한다. 비교 「소득세법」에 따른 중간예납세액의 납부고지서 및 「부가가치 세법」에 따른 부가가치세 예정고지세액의 납부고지서로서 100만원 NEW 이안에 해당하는 납부고지서는 일반우편으로 송달할 수 있다.","pg":11},{"id":63,"ch":1,"n":45,"q":"법인세액 100만원에 대한 법인세과세표준신고서를 법정신 고기한까지 제출하였으나 납부할 세액 중 30만원을 미납 하여 발급하는 납부고지서는 등기우편으로 송달해야 한다.","a":"X","e":"신고납부제도를 취하는 국세에 대한 과세표준신고서를 법정신고기한까지 제출하였으나 과세표준신고액에 상당 하는 세액의 전부 또는 일부를 납부하지 않아 발급하는 납부고지서로서 100만원NEW 미만인 납부고지서는 일반 우편으로 송달할 수 있다.","pg":11},{"id":64,"ch":1,"n":46,"q":"원천징수하는 소득세 또는 법인세에 대한 원천징수이행상황 신고서를 법정납부기한까지 제출하였으나 신고액에 상당하 는 세액의 전부 또는 일부를 납부하지 아니하여 발급하는 50만원 미만의 납부고지서는 일반우편으로 송달할 수 있다.","a":"X","e":"원천징수하는 소득세 또는 법인세에 대한 원천징수이행 상황신고서를 법정납부기한까지 제출하였으나 신고액에 상당하는 세액의 전부 또는 일부를 납부하지 아니하여 발 급하는 100만원 미만의 납부고지서는 일반우편으로 송달 할 수 있다. NNEEW","pg":11},{"id":65,"ch":1,"n":47,"q":"정보통신망을 이용한 송달의 경우 서류를 송달받아야 할 자 가 신청한 경우에만 가능한 것이 원칙이다.","a":"O","e":"•예외적으로 신청으로 간주하는 경우가 있다.","pg":12},{"id":66,"ch":1,"n":48,"q":"납부고지서가 송달되기 전에 납세자가 국세정보통신망을 통 해 소득세 중간예납세액, 법인세 중간예납세액과 부가가치 세 예정고지세액 예정부과세액을 계좌이체의 방법 또는 신 용카드 등으로 국세를 전액 자진납부한 경우 납부한 세액에 대해서는 자진납부한 시점에 전자송달을 신청한 것으로 본 다.","a":"X","e":"납부고지서가 송달되기 전에 납세자가 다음 중 어느 하나 를 국세정보통신망을 통해 국세를 전액 자진납부한 경우 납부한 세액에 대해서는 자진납부한 시점에 전자송달을 신청한 것으로 본다. ① 소득세 중간예납세액 ② 부가가치세 예정고지세액 및 간이과세자의 예정부 과세액 신고납부제도를 취하는 국세에 대한 과세표준신고 서를 법정신고기한까지 제출하였으나 과세표준신 고액에 상당하는 세액의 전부 또는 일부를 납부하 지 아니하여 발급하는 납부고지서 NEW ④ 원천징수하는 소득세 또는 법인세에 대한 원천징수 이행상황신고서를 법정납부기한까지 제출하였으나 신고액에 상당하는 세액의 전부 또는 일부를 납부 하지 아니하여 발급하는 납부고지서NEW","pg":12},{"id":67,"ch":1,"n":49,"q":"국세정보통신망에 접속하여 서류를 열람할 수 있게 하였음 에도 불구하고 해당 납세자가 2회 연속하여 전자송달된 해 당 서류의 납부기한까지 열람하지 않은 경우 납세자가 전자 송달된 납부고지서 또는 독촉장에 따른 세액을 그 납부기한 까지 전액 납부한 경우에도 두 번째로 열람하지 않은 서류 에 대한 납부기한의 다음 날에 전자송달 신청을 철회한 것 으로 본다. 0 %","a":"X","e":"국세정보통신망에 접속하여 서류를 열람할 수 있게 하였 음에도 불구하고 해당 납세자가 3회 연속하여 전자송달 된 해당 서류의 납부기한까지 열람하지 않은 경우(납세자 기 전자종달된 납부고지서 또는 독후장에 따른 세액을 그 남부 시절까지 전액 납부한 경우는 제외)에는 세 번째로 일랍하지 않은 서류에 대한 납부기한의 다음 날에 전자 단 신청을 철회한 것으로 본다.","pg":12},{"id":68,"ch":1,"n":50,"q":"전자승달의 철회는 신청서를 관할 세무서장에게 제출한 날 부터 적용한다.","a":"X","e":"전자상담의 집회는 신청시를 관할 세무서장에게 제출한 날의 다음날부터 적용한다.","pg":12},{"id":69,"ch":1,"n":51,"q":"전자송달의 신청을 철회한 자가 전자송달을 재신청하는 경 우에는 철회 신청일의 다음 날부터 3년이 지난 날 이후에 신 청할 수 있다.","a":"X","e":"전자송달의 신청을 철회한 자가 전자송달을 재신청하는 경우에는 철회 신청일부터 30일이 지난 날 이후에 신청 할 수 있다.","pg":13},{"id":70,"ch":1,"n":52,"q":"국세청장이 납부고지서 및 국세환급금통지서를 전자송달하 는 경우에는 해당 납세자가 지정한 전자우편주소로 송달하 여야 한다.","a":"X","e":"국세청장이 납부고지서 및 국세환급금통지서를 전자송달 하는 경우에는 해당 납세자로 하여금 국세정보통신망에 접속하여 해당 서류를 열람할 수 있게 해야 한다. 비 납부고지서 국세환급금통지서 외 그 밖에 국세청장이 정하는 서류나 신고안내문을 전자송달하는 경우에는 해당 납세자가 지정한 전자우편주소로 송달하여야 함","pg":13},{"id":71,"ch":1,"n":53,"q":"국세정보통신망의 장애로 인하여 전자송달이 불가능한 경우 나 정보통신망의 장애로 전자송달이 불가능한 경우에는 공 시송달할 수 있다.","a":"X","e":"국세정보통신망의 장애로 인하여 전자송달이 불가능한 경우나 정보통신망의 장애로 전자송달이 불가능한 경우 에는 교부 또는 우편의 방법으로 송단할 수 있다.","pg":13},{"id":72,"ch":1,"n":54,"q":"서류를 송달받을 자의 주소 또는 영업소가 국외에 있고 송 달하기 곤란한 경우 서류의 주요 내용을 공고한 날부터 10 일이 지나면 서류 송달이 된 것으로 본다.","a":"X","e":"서류를 송달받을 자의 주소 또는 영업소가 국외에 있고 송달하기 곤란한 경우 서류의 주요 내용을 공고한 날부터 11일이 지나면 서류 송달이 된 것으로 본다.","pg":13},{"id":73,"ch":1,"n":55,"q":"서류를 일반우편으로 송달하였으나 서류명의인, 그 동거인 등 법정된 자가 송달할 장소에 없는 경우 공시송달할 수 있 다.","a":"X","e":"서류명의인. 그 동거인 등 법정된 자가 송달할 장소에 없 는 경우로서 서류를 등기우편으로 송달하였으나 수취인 이 부재중인 것으로 확인되어 반송됨으로써 납부기한 내 에 송달이 곤란하다고 인정되는 경우에는 공시송달할 수 있다.","pg":13},{"id":74,"ch":1,"n":56,"q":"세무공무원이 3회 이상 납세자를 방문[처음 방문한 날과 마 지막 방문한 날의 사이의 기간이 5일(기간을 계산할 때 공휴 일, 대체공휴일, 토요일 및 일요일은 산입하지 않음) 이상이 어야 한다]해 서류를 교부하려고 하였으나 수취인이 부재중 인 것으로 확인되어 납부기한까지 송달이 곤란하다고 인정 되는 경우에 공시송달을 할 수 있다.","a":"X","e":"세무공무원이 2회 이상 납세자를 방문[처음 방문한 날과 마지막 방문한 날의 사이의 기간이 3일(기간을 계산할 때 공휴일, 대체공휴일, 토요일 및 일요일은 산입하지 않음) 이상이어야 한다]해 서류를 교부하려고 하였으나 수취인 이 부재중인 것으로 확인되어 납부기한까지 송달이 곤란 하다고 인정되는 경우에 공시송달을 할 수 있다.","pg":13},{"id":75,"ch":1,"n":57,"q":"송달할 서류의 송달장소를 관할하는 특별자치시의 게시판 이나 그 밖의 적절한 장소에 게시하는 방법으로 공시송달을 할 때에는 다른 공시송달 방법과 함께 해야 한다.","a":"X","e":"국세정보통신망을 이용하여 공시송달을 할 때에는 다른 공시송달 방법과 함께 해야 한다.","pg":14},{"id":76,"ch":1,"n":58,"q":"공시송달 사유가 있는 경우 관보에 게재하는 방법으로 서류 의 주요 내용을 공고할 경우 다른 공시송달 방법과 함께 할 필요가 없다.","a":"O","e":"","pg":14},{"id":77,"ch":1,"n":59,"q":"공시송달 사유가 있는 경우 일간신문에 게재하는 방법으로 서류의 주요 내용을 공고할 수 있고 게재하는 방법으로 공 시송달하는 경우 다른 공시송달 방법과 함께 해야 한다.","a":"X","e":"공시송달 사유가 있는 경우 일간신문에 게재하는 방법으 로 서류의 주요 내용을 공고할 수 있다. 게재는 게재방법으로만 공시하면 된다. 국세정보통신망 을 이용하여 공시송달을 할 때에는 다른 공시송달 방법과 함께 해야 한다.","pg":14},{"id":78,"ch":1,"n":60,"q":"교부송달의 방법에 따라 송달하는 서류는 송달받아야 할 자 에게 도달한 때부터 효력이 발생한다. 이때 '도달'이란 송달 받아야 할 자에게 직접 전해줄 것까지를 필요로 하는 것은 아니고, 상대방의 지배권 내에 들어가 사회통념상 일반적으 로 그 사실을 알 수 있는 상태에 있음으로 족하다.","a":"O","e":"","pg":14},{"id":79,"ch":1,"n":61,"q":"우편으로 송달하는 서류는 우편법」에 따른 우편날짜도장이 찍힌 날에 송달된 것으로 본다. 우편날짜도장이 찍히지 않았 거나 분명하지 않은 경우에는 통상 걸리는 배송일수를 기준 으로 발송한 날로 인정되는 날부터 효력이 발생한다.","a":"X","e":"우편으로 송달하는 서류는 송달받아야 한 자에게 도달한 때부터 효력이 발생한다. 비교 우편신고 또는 청구나 신고청구와 관련된 서류의 제출은 우 편법」에 따른 우편날짜도장이 찍힌 날에 신고되거나 청구된 것으로 보고 우편날짜도장이 찍히지 않았거나 분명하지 않은 경우에는 통상 걸리는 배송일수를 기준으로 발송한 날로 인정되는 날에 신고되거나 청구된 것으로 봄","pg":14},{"id":80,"ch":1,"n":62,"q":"전자송달의 경우에는 송달받을 자가 지정한 전자우편주소에 서 해당 서류를 열람한 것으로 확인되었을 때 그 효력이 발 생한다.","a":"X","e":"전자송달의 경우에는 송달받을 자가 지정한 전자우편주 소에 입력된 때(국세정보통신망에 저장하는 경우에는 저 장된 때)에 그 송달을 받아야 할 자에게 도달한 것으로 본 다. 비교 전자신고의 등의 경우에는 해당 신고서청구서 등이 국세청장 에게 전송된 때에 신고되거나 청구된 것으로 봄","pg":15},{"id":81,"ch":1,"n":63,"q":"내국법인 중 「국세기본법」에 의하여 법인으로 보는 법인 아 닌 단체는 「법인세법」에서 비영리내국법인으로 본다.","a":"O","e":"","pg":15},{"id":82,"ch":1,"n":64,"q":"주무관청의 허가 또는 인가를 받아 설립되거나 법령에 따라 주무관청에 등록한 사단, 재단, 그 밖의 단체로서 등기되지 않은 단체가 그 수익을 구성원에게 분배하지 않는 경우에는 그 대표자나 관리인이 관할 세무서장에게 신청하여 승인을 받아야 법인으로 본다.","a":"X","e":"주무관청의 허가 또는 인가를 받아 설립되거나 법령에 따 라 주무관청에 등록한 사단, 재단, 그 밖의 단체로서 등 기되지 않은 단체가 그 수익을 구성원에게 분배하지 않는 경우에는 당연법인으로 보아 「국세기본법」과 세법을 적용 한다. 즉, 대표자나 관리인의 신청을 요건으로 하지 않는 다.","pg":15},{"id":83,"ch":1,"n":65,"q":"당연법인으로 보는 단체 외의 법인 아닌 단체의 경우로서 단체의 조직과 운영에 관한 규정을 가지고 대표자나 관리 인을 선임하고 있으면서 단체의 수익을 구성원에게 분배하 고 단체 자신의 계산과 명의로 재산을 독립적으로 소유·관 리할 경우 그 단체의 대표자나 관리인이 관할 세무서장에게 신청하여 승인을 받은 것도 법인으로 보아 「국세기본법과 세법을 적용한다.","a":"X","e":"당연법인으로 보는 단체 외의 법인 아닌 단체의 경우로서 단체의 조직과 운영에 관한 규정을 가지고 대표자나 관리 인을 선임하고 있으면서 단체의 수익을 구성원에게 분배 하지 않고 단체 자신의 계산과 명의로 수익과 재산을 독 립적으로 소유·관리할 경우 그 단체의 대표자나 관리인 이 관할 세무서장에게 신청하여 승인을 받은 것도 법인으 로 보아 「국세기본법」과 세법을 적용한다.","pg":15},{"id":84,"ch":1,"n":66,"q":"신청에 따라 법인으로 보는 단체는 그 신청에 대하여 관할 세무서장의 승인을 받은 날부터 3년이 되는 날까지는 「소 득세법」에 따른 거주자(또는 비거주자)로 변경할 수 없다.","a":"X","e":"신청에 따라 법인으로 보는 단체는 그 신청에 대하여 관 할 세무서장의 승인을 받은 날이 속하는 과세기간과 그 과세기간이 끝난 날부터 3년이 되는 날이 속하는 과세기 간까지는 「소득세법」에 따른 거주자(또는 비거주자)로 변 경할 수 없다.","pg":15},{"id":85,"ch":1,"n":67,"q":"법인으로 보는 단체의 국세에 관한 의무는 그 대표자나 관 리인이 이행해야 한다.","a":"O","e":"","pg":16},{"id":86,"ch":1,"n":68,"q":"법인 아닌 단체가 「국세기본법」에 의하여 법인으로 의제되 지 않더라도 「소득세법」에 의하여 그 단체를 1거주자로 보아 과세할 수도 있다.","a":"O","e":"","pg":16},{"id":87,"ch":1,"n":69,"q":"「국세기본법」에 따른 법인 아닌 단체 중 법인으로 보는 단체 외의 법인 아닌 단체의 구성원 간 이익의 분배방법이나 분 배비율이 정해져 있고 사실상 이익이 분배되는 경우에는 그 단체를 1거주자(또는 1비거주자)로 보아 「소득세법」을 적용 한다.","a":"X","e":"「국세기본법」에 따른 법인 아닌 단체 중 법인으로 보는 단 체 외의 법인 아닌 단체의 구성원 간 이익의 분배방법이 나 분배비율이 정해져 있고 사실상 이익이 분배되는 경우 에는 그 단체의 구성원이 공동으로 사업을 영위하는 것으 로 보아 구성원들이 분배받은 소득에 대해서 각자 소득세 납세의무를 진다.","pg":16},{"id":88,"ch":1,"n":70,"q":"「국세기본법」에 따른 법인 아닌 단체 중 법인으로 보는 단 체외의 법인 아닌 단체의 구성원 간 이익의 분배방법이나 분배비율이 정해져 있지 않거나 확인되지 않은 경우에는 그 단체의 구성원이 공동으로 사업을 영위하는 것으로 본다.","a":"X","e":"「국세기본법」에 따른 법인 아닌 단체 중 법인으로 보는 단 체외의 법인 아닌 단체의 구성원 간 이익의 분배방법이 나 분배비율이 정해져 있지 않거나 확인되지 않은 경우에 는 그 단체를 1거주자(또는 1비거주자)로 본다.","pg":16},{"id":89,"ch":1,"n":71,"q":"법인으로 보는 단체 외의 법인 아닌 단체는 상속세 또는 증 여세 납세의무를 진다.","a":"O","e":"","pg":16},{"id":90,"ch":1,"n":72,"q":"전환 국립대학 법인에 대한 국세의 납세의무(국세를 징수하 여 납부할 의무는 제외)를 적용할 때는 별도의 법인으로 보 아 법인세를 과세한다.","a":"X","e":"세법에서 규정하는 납세의무에도 불구하고 전환 국립대 학 법인에 대한 국세의 납세의무(국세를 징수하여 납부할 의무는 제외)를 적용할 때는 전환 국립대학 법인을 별도 의 법인으로 보지 아니하고 국립대학 법인으로 전환되기 전의 국립학교 또는 공립학교로 본다.","pg":16},{"id":91,"ch":1,"n":73,"q":"전환 국립대학 법인이 해당 법인의 설립근거가 되는 법률에 따른 교육·연구 활동에 지장이 없는 범위 외의 수익사업을 하는 경우에는 별도의 법인으로 보지 아니하고 국립대학 법 인으로 전환되기 전의 국립학교 또는 공립학교로 보고 법인 세를 과세하지 아니한다.","a":"X","e":"전환 국립대학 법인이 해당 법인의 설립근거가 되는 법률 에 따른 교육·연구 활동에 지장이 없는 범위 외의 수익 사업을 하는 경우의 납세의무에 대해서는 국립대학 법인 으로 전환되기 전의 국립학교 또는 공립학교로 보지 않고 별도의 법인으로 본다. 따라서 별도의 법인으로 보아 법인세를 과세한다.","pg":17},{"id":92,"ch":2,"n":1,"q":"국세부과의 원칙에는 실질과세의 원칙, 신의성실의 원칙, 근 거과세의 원칙, 세법해석의 기준이 있으며 이러한 원칙은 조 세법에 당연히 내재된 원리이므로 창설적 규정이 아니라 선 언적인 것이다.","a":"X","e":"국세부과의 원칙에는 실질과세의 원칙, 신의성실의 원칙, 근거과세의 원칙, 조세감면의 사후관리가 있으며 이러한 원칙은 조세법에 당연히 내재된 원리이므로 창설적 규정 이 아니라 선언적인 것이다.","pg":18},{"id":93,"ch":2,"n":2,"q":"'실질과세의 원칙'이란 법적 형식이나 외관에 관계없이 실 질에 따라 세법을 해석하고 과세요건 사실을 인정해야 한다 는 원칙이며 이는 조세법률주의를 보다 구체화한 원칙이다.","a":"X","e":"'실질과세의 원칙'이란 법적 형식이나 외관에 관계없이 실 질에 따라 세법을 해석하고 과세요건 사실을 인정해야 한 다는 원칙이며 이는 조세평등주의를 보다 구체화한 원칙 이다.","pg":18},{"id":94,"ch":2,"n":3,"q":"과세의 대상이 되는 소득, 수익, 재산, 행위 또는 거래의 귀 속이 명의일 뿐이고 사실상 귀속되는 자가 따로 있을 때에 는 명의자를 납세의무자로 하여 세법을 적용한다.","a":"X","e":"과세의 대상이 되는 소득, 수익, 재산, 행위 또는 거래의 귀속이 명의일 뿐이고 사실상 귀속되는 자가 따로 있을 때에는 사실상 귀속되는 자를 납세의무자로 하여 세법을 적용한다.","pg":18},{"id":95,"ch":2,"n":4,"q":"제3자를 통한 간접적인 방법으로 거래한 경우 「국세기본법」 또는 세법의 혜택을 부당하게 받기 위한 것인지 여부와 관 계없이 그 경제적 실질 내용에 따라 당사자가 직접 거래를 한 것으로 본다.","a":"X","e":"제3자를 통한 간접적인 방법이나 둘 이상의 행위 또는 거 래를 거치는 방법으로 국세기본법 또는 세법의 혜택을 부 당하게 받기 위한 것으로 인정되는 경우에는, 그 경제적 실질내용에 따라 당사자가 직접 거래를 한 것으로 보거나 연속된 하나의 행위 또는 거래를 한 것으로 보아 국세기 본법 또는 세법을 적용한다.","pg":18},{"id":96,"ch":2,"n":5,"q":"회사의 주주로 명부상 등재되어 있더라도 회사의 대표자가 임의로 등재한 것일 뿐 회사의 주주로서 권리행사를 한 사 실이 없는 경우에는 그 명의자인 주주를 세법상 주주로 보 지 않는다.","a":"O","e":"","pg":18},{"id":97,"ch":2,"n":6,"q":"「법인세법」상 소득처분 중 사외유출 시 소득의 귀속이 불분 명한 경우 대표자 상여로 처분하는 규정은 실질과세원칙을 적용한 것이다.","a":"X","e":"「법인세법」상 소득처분 중 사외유출 시 소득의 귀속이 불 분명한 경우 대표자 상여로 처분하는 규정은 실질과세원 칙보다는 개별세법의 규정을 우선 적용한 것이다.","pg":19},{"id":98,"ch":2,"n":7,"q":"납세자와 세무공무원은 그 의무를 이행할 때에는 신의에 따 라 성실하게 해야 한다.","a":"O","e":"*","pg":19},{"id":99,"ch":2,"n":8,"q":"과세관청이 그 처분이 신의성실의 원칙을 위배했더라도 납 세자에게 행한 처분이 적법했다면 납세자는 그 처분의 취소 를 청구할 수 없다.","a":"X","e":"과세관청이 납세자에게 행한 처분이 적법하더라도 그 처 분이 신의성실의 원칙을 위배했다면 납세자는 그 처분의 취소를 청구할 수 있다.","pg":19},{"id":100,"ch":2,"n":9,"q":"조세법률주의 원칙은 그보다 상위개념인 신의성실의 원칙의 제약하에 개별적으로 납세자의 신뢰를 보호할 가치가 배제 될 수 있는 경우에 한해서만 적용되는 하위개념이다.","a":"X","e":"신의성실의 원칙은 그보다 상위개념인 조세법률주의의 제약하에 개별적으로 납세자의 신뢰를 보호할 가치가 큰 경우에 한해서만 적용되는 하위개념이다.","pg":19},{"id":101,"ch":2,"n":10,"q":"과세관청이 납세의무자에게 면세사업자등록증을 교부하고, 수년간 면세사업자로서 한 부가가치세 예정신고 및 확정신 고를 받은 행위만으로 과세관청이 납세의무자에게 그가 영 위하는 사업에 관하여 부가가치세를 과세하지 아니함을 시 사하는 언동이나 공적인 견해를 표명한 것이라고 할 수 있 다.","a":"X","e":"과세관청이 납세의무자에게 면세사업자등록증을 교부하 고, 수년간 면세사업자로서 한 부가가치세 예정신고 및 확정신고를 받은 행위만으로는 과세관청이 납세의무자에 게 그가 영위하는 사업에 관하여 부가가치세를 과세하지 아니함을 시사하는 언동이나 공적인 견해를 표명한 것이 라고 할 수 없다.","pg":19},{"id":102,"ch":2,"n":11,"q":"납세의무자가 자산을 과대계상하거나 부채를 과소계상하는 등의 방법으로 분식결산하고 이에 따라 과다하게 법인세를 신고, 납부하였다가 그 과다납부한 세액에 대하여 취소소송 을 제기하여 다툰 경우 신의성실의 원칙을 위반하였다고 볼 수 있다.","a":"X","e":"납세의무자가 자산을 과대계상하거나 부채를 과소계상하 는 등의 방법으로 분식결산하고 이에 따라 과다하게 법인 세를 신고, 납부하였다가 그 과다납부한 세액에 대하여 취소소송을 제기하여 다툰다는 사정만으로 신의성실의 원칙에 위반될 정도로 심한 배신행위를 하였다고 볼 수는 없다.","pg":19},{"id":103,"ch":2,"n":12,"q":"국세를 조사. 결정할 때 장부의 기록 내용이 사실과 다르거 나 장부의 기록에 누락된 것이 있을 때에는 당해 납세의무 자의 과세표준 전체에 대해서 정부가 조사한 사실에 따라 결정한다.","a":"X","e":"국세를 조사. 결정할 때 장부의 기록 내용이 사실과 다르 거나 장부의 기록에 누락된 것이 있을 때에는 그 부분에 대해서민 정부가 조사한 사실에 따라 결정할 수 있다.","pg":20},{"id":104,"ch":2,"n":13,"q":"장부의 기록 내용과 다른 사실 또는 장부 기록에 누락된 것 을 조사하여 결정하였을 때에는 정부가 조사한 사실과 결정 의 근거를 결정서에 적어야 한다.","a":"O","e":"","pg":20},{"id":105,"ch":2,"n":14,"q":"행정기관의 장은 해당 납세의무자 또는 그 대리인이 요구하 면 결정서를 열람 또는 복사하게 하거나 그 등본 또는 초본 이 원본과 일치함을 확인해야 한다. 이 경우 요구는 문서로 해야 한다.","a":"X","e":"행정기관의 장은 해당 납세의무자 또는 그 대리인이 요구 하면 결정서를 열람 또는 복사하게 하거나 그 등본 또는 초본이 원본과 일치함을 확인해야 한다. 이 경우 요구는 구술로 한다. 단, 해당 행정기관의 장이 필요하다고 인정할 때에 는 열람하거나 복사한 사람의 서명을 요구할 수 있음","pg":20},{"id":106,"ch":2,"n":15,"q":"거주자 甲이 A회사와 판매수익의 귀속주체를 甲으로 하는 판매약정을 체결한 후 A회사 영업이사 직함을 사용하여 A 회사가 생산한 정제유를 A회사 명의로 판매하였다. 甲이 독 자적으로 관리, 사용하던 A회사 명의의 계좌를 통한 거래 중 무자료거래에서 확인된 매출누락 등에 따른 세금을 과세관 청이 A회사가 아닌 甲에게 부담시키기 위한 국세부과의원 칙은 근거과세의 원칙이다.","a":"X","e":"거주자 甲이 A회사와 판매수익의 귀속주체를 甲으로 하는 판매약정을 체결한 후 A회사 영업이사 직함을 사용하여 A 회사가 생산한 정제유를 A회사 명의로 판매하였다. 甲이 독자적으로 관리. 사용하던 A회사 명의의 계좌를 통한 거 래 중 무자료거래에서 확인된 매출누락 등에 따른 세금을 과세관청이 A회사가 아닌 甲에게 부담시키기 위한 국세부 과의 원칙은 실질과세의 원칙이다.","pg":20},{"id":107,"ch":2,"n":16,"q":"정부는 국세를 감면한 경우에 그 감면의 취지를 성취하거나 국가정책을 수행하기 위하여 필요하다고 인정하면 세법에서 정하는 바에 따라 감면한 세액에 상당하는 자금 또는 자산 의 운용 범위를 정할 수 있다. 그러나 그 운용 범위를 벗어 난 자금 또는 자산에 상당하는 감면세액은 세법에서 정하는 바에 따라 감면을 취소하고 징수할 수 없다.","a":"X","e":"정부는 국세를 감면한 경우에 그 감면의 취지를 성취하거 나 국가정책을 수행하기 위하여 필요하다고 인정하면 세 법에서 정하는 바에 따라 감면한 세액에 상당하는 자금 또는 자산의 운용 범위를 정할 수 있다. 그리고 그 운용 범위를 벗어난 자금 또는 자산에 상당하는 감면세액은 세 법에서 정하는 바에 따라 감면을 취소하고 징수할 수 있 다.","pg":20},{"id":108,"ch":2,"n":17,"q":"세법을 해석·적용할 때에는 과세의 형평과 해당 조항의 합 목적성에 비추어 납세자의 재산권이 부당하게 침해되지 않 도록 해야 한다.","a":"O","e":"","pg":21},{"id":109,"ch":2,"n":18,"q":"납세자의 재산권이 부당하게 침해되지 않도록 하기 위한 세 법 해석을 위하여 국세청에 국세예규심사위원회를 둔다.","a":"X","e":"납세자의 재산권이 부당하게 침해되지 않도록 하기 위한 세법 해석을 위하여 재정경제부에 국세예규심사위원회를 둔다.","pg":21},{"id":110,"ch":2,"n":19,"q":"재정경제부장관 및 관할세무서장은 세법의 해석과 관련된 질의에 대하여 세법 해석의 기준에 따라 해석하고 회신하여 야 한다.","a":"X","e":"재정경제부장관 및 국세청장은 세법의 해석과 관련된 질 의에 대하여 세법 해석의 기준에 따라 해석하고 회신하여 야 한다.","pg":21},{"id":111,"ch":2,"n":20,"q":"세법이 새로 제정되거나 개정되어 이에 대한 재정경제부장 관의 해석이 필요한 경우 재정경제부장관이 직접 회신할 수 없으며, 국세청장을 통하여 해석을 요청한 당사자에게 회신 하여야 한다.","a":"X","e":"세법이 새로 제정되거나 개정되어 이에 대한 재정경제부 장관의 해석이 필요한 경우 재정경제부장관이 직접 회신 할 수 있으며, 이 경우 회신한 문서의 사본을 국세청장에 게 송부하여야 한다.","pg":21},{"id":112,"ch":2,"n":21,"q":"세법 이외의 법률 중 국세의 부과·징수·감면 또는 그 절 차에 관하여 규정하고 있는 조항에 대해서는 세법해석의 기 준에 대한 「국세기본법」 규정이 적용되지 아니한다.","a":"X","e":"세법 외의 법률 중 국세의 부과·징수·감면 또는 그 절 차에 관하여 규정하고 있는 조항은 세법해석의 기준을 적 용함에 있어 세법으로 본다.","pg":21},{"id":113,"ch":2,"n":22,"q":"국세를 납부할 의무(세법에 징수의무자가 따로 규정되어 있 는 국세의 경우에는 이를 징수하여 납부할 의무)가 확정된 소득, 수익, 재산, 행위 또는 거래에 대해서는 그 확정 후의 새로운 세법에 따라 소급하여 과세하지 않는다.","a":"X","e":"국세를 납부할 의무(세법에 징수의무자가 따로 규정되 어 있는 국세의 경우에는 이를 징수하여 납부할 의무)가 성립한 소득, 수익, 재산, 행위 또는 거래에 대해서는 그 성립 후의 새로운 세법에 따라 소급하여 과세하지 않는 다.","pg":21},{"id":114,"ch":2,"n":23,"q":"세법의 해석이나 국세행정의 관행이 일반적으로 납세자에 게 받아들여진 후에는 그 해석이나 관행에 의한 행위 또는 계산은 정당한 것으로 보며, 새로운 해석이나 관행에 의하여 소급하여 과세되지 않는다.","a":"O","e":"","pg":22},{"id":115,"ch":2,"n":24,"q":"과세기간 진행 중 법률의 개정이나 해석의 변경이 있는 경 우 이미 진행한 과세기간 분에 대하여 소급과세 하는 것은 허용되지 아니한다.","a":"X","e":"과세기간 진행 중 법률의 개정이나 해석의 변경이 있는 경우 이미 진행한 과세기간 분에 대하여 개정된 세법 등 을 과세기간 개시일로 소급하여 작용하는 부진정소급은 허용된다.","pg":22},{"id":116,"ch":2,"n":25,"q":"소급적용하는 것이 납세자에게 유리한 경우라 하더라도 그 소급효는 허용되지 아니한다.","a":"X","e":"소급적용하는 것이 납세자에게 유리한 경우에는 그 소급 효를 인정한다.","pg":22},{"id":117,"ch":2,"n":26,"q":"세무공무원이 재량으로 직무를 수행할 때에는 과세의 형평 과 해당 세법의 목적에 비추어 일반적으로 적당하다고 인정 되는 한계를 엄수해야 한다.","a":"O","e":"","pg":22},{"id":118,"ch":2,"n":27,"q":"세무공무원이 국세의 과세표준을 조사· 결정할 때에는 세법 에 특별한 규정이 있더라도 해당 납세의무자가 계속하여 적 용하고 있는 기업회계의 기준 또는 관행으로서 일반적으로 공정·타당하다고 인정되는 것은 존중해야 한다.","a":"X","e":"세무공무원이 국세의 과세표준을 조사 · 결정할 때에는 해당 납세의무자가 계속하여 적용하고 있는 기업회계의 기준 또는 관행으로서 일반적으로 공정. 타당하다고 인 정되는 것은 존중해야 한다. 다만, 세법에 특별한 규정이 있는 것은 그러하지 아니하다.","pg":22},{"id":119,"ch":2,"n":28,"q":"국세청장은 효율적인 조세정책의 수립과 조세부담의 형평성 제고를 위하여 매년 해당 연도부터 3개 연도 이상의 기간에 대한 중장기 조세정책운용계획을 수립해야 한다.","a":"X","e":"재정경제부장관은 효율적인 조세정책의 수립과 조세부 담의 형평성 제고를 위하여 매년 해당 연도부터 5개 연도 이상의 기간에 대한 중장기 조세정책운용계획을 수립해 야 한다.","pg":22},{"id":120,"ch":2,"n":29,"q":"재정경제부장관은 중장기 조세정책운용계획을 수립할 때에 는 국회 소관 상임위원회와 협의하여야 하며 수립한 중장기 조세정책운용계획을 관계 중앙관서의 장에게 보고하여야 한 다.","a":"X","e":"재정경제부장관은 중장기 조세정책운용계획을 수립할 때 에는 관계 중앙관서의 장과 협의하여야 하며 수립한 중장 기 조세정책운용계획을 국회 소관 상임위원회에 보고하 여야 한다. 語","pg":23},{"id":121,"ch":3,"n":1,"q":"국세를 납부할 의무는 「국세기본법」 및 세법에서 정하는 과 세요건이 충족되면 성립한다.","a":"O","e":"","pg":24},{"id":122,"ch":3,"n":2,"q":"납세의무는 각 세법이 정하는 과세요건의 충족, 즉 특정의 시기에 특정사실 또는 상태가 존재함으로써 과세대상(물건 또는 행위)이 납세의무자에게 귀속됨으로써 세법이 정하는 바에 따라 과세표준의 산정 및 세율의 적용이 가능하게 되 는 때에 성립한다.","a":"O","e":"","pg":24},{"id":123,"ch":3,"n":3,"q":"부가가치세는 기간단위로 과세하는 국세이므로 법정신고기 한이 경과하는 때에 납세의무가 성립한다.","a":"X","e":"부가가치세는 기간단위로 과세하는 국세이므로 과세기간 이 끝나는 때에 납세의무가 성립한다.","pg":24},{"id":124,"ch":3,"n":4,"q":"각 사업연도 소득에 대한 법인세는 과세표준과 세액을 정부 에 신고하는 때 납세의무가 성립한다.","a":"X","e":"각 사업연도 소득에 대한 법인세는 과세기간이 끝나는 때 납세의무가 성립한다.","pg":24},{"id":125,"ch":3,"n":5,"q":"소득세는 과세기간이 끝나는 때에 납세의무가 성립한다.","a":"O","e":"","pg":24},{"id":126,"ch":3,"n":6,"q":"「부가가치세법」상 수입재화의 부가가치세 납세의무는 과세 기간이 끝나는 때 성립한다.","a":"X","e":"「부가가치세법」상 수입재화의 부가가치세 납세의무는 세 관장에게 수입신고를 하는 때 성립한다.","pg":24},{"id":127,"ch":3,"n":7,"q":"청산소득에 대한 법인세의 납세의무 성립시기는 그 법인이 해산을 하는 때이다.","a":"O","e":"","pg":24},{"id":128,"ch":3,"n":8,"q":"상속세의 납세의무 성립시기는 상속신고를 완료하는 때이 다.","a":"X","e":"상속세의 납세의무 성립시기는 그 상속을 개시하는 때이 다.","pg":25},{"id":129,"ch":3,"n":9,"q":"증여세의 납세의무 성립시기는 증여신고를 완료하는 때이 다.","a":"X","e":"증여세의 납세의무 성립시기는 증여에 의하여 재산을 취 득하는 때이다.","pg":25},{"id":130,"ch":3,"n":10,"q":"개별소비세, 주세 및 교통·에너지·환경세의 납세의무 성 립시기는 과세물품을 제조장으로부터 반출하거나 판매장에 서 판매하는 때, 과세장소에 입장하거나 과세유흥장소에서 유흥음식행위를 하는 때 또는 과세영업장소에서 영업행위를 하는 때이다.","a":"O","e":"","pg":25},{"id":131,"ch":3,"n":11,"q":"「개별소비세법」상 수입물품의 납세의무 성립시기는 판매장 에서 판매하는 때이다.","a":"X","e":"수입물품의 납세의무 성립시기는 세관장에게 수입신고를 하는 때를 말한다.","pg":25},{"id":132,"ch":3,"n":12,"q":"인지세의 납세의무 성립시기는 과세문서를 작성한 때이다.","a":"O","e":"","pg":25},{"id":133,"ch":3,"n":13,"q":"증권거래세의 납세의무 성립시기는 해당 매매거래가 발생한 달의 말일이다.","a":"X","e":"증권거래세의 납세의무 성립시기는 해당 매매거래가 확 정되는 때이다.","pg":25},{"id":134,"ch":3,"n":14,"q":"종합부동산세의 납세의무 성립시기는 해당 매매거래가 확정 되는 때이다.","a":"X","e":"종합부동산세의 납세의무 성립시기는 과세기준일(매년 6 월 1일)이다.","pg":25},{"id":135,"ch":3,"n":15,"q":"금융·보험업자의 수익금액에 부과되는 교육세의 납세의무 성립시기는 해당 국세의 납세의무가 성립하는 때이다.","a":"X","e":"금융·보험업자의 수익금액에 부과되는 교육세의 납세의 무 성립시기는 과세기간이 끝나는 때이다.","pg":25},{"id":136,"ch":3,"n":16,"q":"농어촌특별세의 납세의무 성립시기는 「농어촌특별세법」에 따른 본세의 납세의무가 성립하는 때이다.","a":"O","e":"","pg":26},{"id":137,"ch":3,"n":17,"q":"무신고 .과소신고 · 초과환급신고 가산세의 납세의무 성립 시기는 법정신고기한이 경과하는 때이다.","a":"O","e":"","pg":26},{"id":138,"ch":3,"n":18,"q":"납부지연가산세의 납세의무 성립시기는 납부고지서에 따른 납부기한이 경과하는 때이다.","a":"X","e":"납부지연가산세의 납세의무 성립시기는 다음과 같다. NEW ① 지연일수 1일마다 법정납부기한 경과 후 1일마다 0.022% 적용분 그 날이 경과하는 때 ② 지연월수 1개월마다 지정납부기한경과 후 매 1개월 0.67% 적용분 이 경과하는 때 ③ 체납 시 3% 적용분 지정납부기한이 경과하는 때 ④ 독촉장 송달비용 지정납부기한이 경과하는 때","pg":26},{"id":139,"ch":3,"n":19,"q":"원천징수 등 납부지연가산세의 납세의무 성립시기는 법정납 부기한이 경과하는 때이다.","a":"X","e":"원천징수 등 납부지연가산세의 납세의무 성립시기는 다 음과 같다. NEW ① 지연일수 1일마다 법정납부기한 경과 후 1일마다 0.022% 적용분 그 날이 경과하는 때 지연월수 1개월마다 지정납부기한 경과 후 매 1개 0.67% 적용분 월이 경과하는 때 ③ 미납 시 3% 적용분 법정납부기한이 경과하는 때 ④ 독촉장 송달비용 지정납부기한이 경과하는 때","pg":26},{"id":140,"ch":3,"n":20,"q":"원천징수하는 소득세·법인세를 납부할 의무는 과세기간이 끝나는 때에 성립한다.","a":"X","e":"원천징수하는 소득세· 법인세를 납부할 의무는 소득금액 또는 수입금액을 지급하는 때에 성립한다.","pg":26},{"id":141,"ch":3,"n":21,"q":"예정신고납부하는 소득세의 납세의무 성립시기는 예정신고 납부기한이 끝나는 때이다.","a":"X","e":"예정신고납부하는 소득세의 납세의무 성립시기는 과세표 준이 되는 금액이 발생한 달의 말일이다.","pg":26},{"id":142,"ch":3,"n":22,"q":"중간예납하는 소득세·법인세의 납세의무 성립시기는 중간 예납 신고납부기한이 끝나는 때이다.","a":"X","e":"중간예납하는 소득세·법인세의 납세의무 성립시기는 중 간예납기간이 끝나는 때이다.","pg":27},{"id":143,"ch":3,"n":23,"q":"예정신고기간 • 예정부과기간에 대한 부가가치세의 납세의 무 성립시기는 예정신고기간 • 예정부과기간이 끝나는 때이 다.","a":"O","e":"","pg":27},{"id":144,"ch":3,"n":24,"q":"수시부과하여 징수하는 국세를 납부할 의무는 수시부과하는 때에 성립한다.","a":"X","e":"수시부과하여 징수하는 국세를 납부할 의무는 수시부과 할 사유가 발생한 때에 성립한다.","pg":27},{"id":145,"ch":3,"n":25,"q":"소득세, 법인세, 부가가치세는 납세의무자가 과세표준과 세 액의 법정신고기한이 경과하는 때 납세의무가 확정된다.","a":"X","e":"소득세, 법인세, 부가가치세는 납세의무자가 과세표준과 세액을 정부에 신고하는 때에 납세의무가 확정된다.","pg":27},{"id":146,"ch":3,"n":26,"q":"개별소비세는 납세의무자가 과세표준과 세액을 정부에 신고 하는 때에 납세의무가 확정된다.","a":"O","e":"","pg":27},{"id":147,"ch":3,"n":27,"q":"소득세와 법인세는 납세의무자가 과세표준과 세액의 신고를 하지 아니한 경우에는 정부가 과세표준과 세액을 결정하는 때에 그 결정에 따라 확정된다.","a":"O","e":"","pg":27},{"id":148,"ch":3,"n":28,"q":"예정신고납부하는 소득세는 「국세기본법」상 납세의무가 성 립하는 때에 특별한 절차 없이 그 세액이 확정된다.","a":"X","e":"예정신고납부하는 소득세는 과세표준이 되는 금액이 발 생한 달의 말일에 성립하고 납세의무자가 과세표준과 세 액을 정부에 신고했을 때 확정된다.","pg":27},{"id":149,"ch":3,"n":29,"q":"법인세의 탈루세액이 있는 경우에는 세액을 추징하고 아울 러 조세범처벌의 대상이 되는데 이 경우 조세포탈범의 기수 시기는 사업연도의 경과시점이다.","a":"X","e":"법인세의 탈루세액이 있는 경우에는 세액을 추징하고 아 울러 조세범처벌의 대상이 되는데 이 경우 조세포탈범의 기수시기는 신고납부기한의 경과시점이다.","pg":27},{"id":150,"ch":3,"n":30,"q":"상속세와 증여세는 신고하는 때에 납세의무가 확정된다.","a":"X","e":"상속세와 증여세는 납세자에게 신고의무가 부여되나 정 부부과과세 세목이다. 따라서 상속세와 증여세의 신고는 협력의무의 이행에 불과할 뿐 납세의무를 확정시키는 효 력은 인정되지 않는다. 그러므로 상속세와 증여세는 과세 표준과 세액을 정부가 '결정(즉 부과처분)'하는 때에 확정 된다.","pg":28},{"id":151,"ch":3,"n":31,"q":"종합부동산세는 납세자가 신고하는 것을 선택할 수 있으나 정부부과과세 세목에 해당하므로 종합부동산세의 신고는 확 정시키는 효력은 인정되지 않고 과세표준과 세액을 정부가 '결정(즉 부과처분)'하는 때에 확정된다.","a":"X","e":"종합부동산세의 확정시기는 정부가 종합부동산세의 과세 표준과 세액을 결정하는 때(고지서의 도달일)로 하되, 납 세자가 종합부동산세의 과세표준과 세액을 정부에 신고 하는 경우에는 그 신고하는 때로 한다.","pg":28},{"id":152,"ch":3,"n":32,"q":"증여세 탈루세액이 있는 경우에는 세액을 추징하고 아울 러 조세범처벌의 대상이 되는데 이 경우 조세포탈범의 기수 시기는 신고기한의 경과시점이다.","a":"X","e":"증여세 탈루세액이 있는 경우에는 세액을 추징하고 아 울러 조세범처벌의 대상이 되는데 이 경우 조세포탈범의 기수시기는 정부의 결정에 의한 납부기한 경과시점이다.","pg":28},{"id":153,"ch":3,"n":33,"q":"인지세의 경우 납세의무가 성립하는 때 특별한 절차 없이 그 세액이 확정된다.","a":"O","e":"","pg":28},{"id":154,"ch":3,"n":34,"q":"납부지연가산세 중 체납시 3% 부과분과 독촉에 드는 비용 은 법정납부기한이 경과하는 때 납세의무가 확정된다.","a":"X","e":"납부지연가산세 중 체납시 3% 부과분과 독촉에 드는 비 용은 지정납부기한이 경과하는 때 납세의무의 성립과 동 시에 자동 확정된다.","pg":28},{"id":155,"ch":3,"n":35,"q":"원천징수하는 소득세·법인세의 확정시기는 과세표준이 되 는 금액이 발생한 달의 말일이다.","a":"X","e":"원천징수하는 소득세·법인세의 확정시기는 소득금액 또 는 수입금액을 지급하는 때이다.","pg":28},{"id":156,"ch":3,"n":36,"q":"납세조합이 징수하는 소득세의 성립시기는 소득금액을 지급 하는 때이며 납세의무가 성립하는 때 특별한 절차 없이 그 세액이 확정된다.","a":"X","e":"납세조합이 징수하는 소득세의 성립시기는 과세표준이 되는 금액이 발생한 달의 말일이며 납세의무가 성립하는 때 특별한 절차 없이 그 세액이 확정된다.","pg":28},{"id":157,"ch":3,"n":37,"q":"중간예납하는 소득세의 성립시기는 중간예납기간이 끝나는 때이며 납세의무가 성립하는 때 특별한 절차 없이 그 세액 이 확정된다.","a":"X","e":"중간예납하는 법인세의 성립시기는 중간예납기간이 끝나 는 때이며 납세의무가 성립하는 때 특별한 절차 없이 그 세액이 확정된다.","pg":29},{"id":158,"ch":3,"n":38,"q":"수시부과하여 징수하는 국세는 「국세기본법」상 납세의무가 성립하는 때에 특별한 절차 없이 그 세액이 확정된다.","a":"X","e":"납세의무가 성립하는 때 특별한 절차 없이 그 세액이 확 정되는 세목은 아래와 같다. ① 인지세 ② 원천징수하는 소득세·법인세 ③ 납세조합이 징수하는 소득세 ④ 중간예납하는 법인세(세법에 따라 정부가 조사결정 하는 경우는 제외) ⑤ 납부지연가산세 및 원천징수 등 납부지연가산세(지 정납부기한 후 NEW의 가산세로 한정) 즉, 수시부과하여 징수하는 국세는 이에 해당되지 않는 다.","pg":29},{"id":159,"ch":3,"n":39,"q":"과세표준신고서를 법정신고기한까지 제출한 자 또는 기한 후신고를 한 자가 신고납부제도 적용 세목인 국세의 수정신 고를 하는 경우 해당 수정신고에는 당초의 신고에 따라 확 정된 과세표준과 세액을 증액하여 확정하는 효력을 가진다.","a":"X","e":"과세표준신고서를 법정신고기한까지 제출한 자가 신고납 부제도 적용 세목인 국세의 수정신고를 하는 경우 해당 수정신고에는 당초의 신고에 따라 확정된 과세표준과 세 액을 증액하여 확정하는 효력을 가진다. 그러나 기한후신 고는 해당 국세의 납세의무를 확정시키는 효력이 없다.","pg":29},{"id":160,"ch":3,"n":40,"q":"국세의 수정신고는 당초 신고에 따라 확정된 세액에 관한 「국세기본법」또는 세법에서 규정하는 권리·의무관계에 영 향을 미친다.","a":"X","e":"국세의 수정신고는 당초 신고에 따라 확정된 세액에 관한 「국세기본법」 또는 세법에서 규정하는 권리·의무관계에 영향을 미치지 아니한다.","pg":29},{"id":161,"ch":3,"n":41,"q":"세법에 따라 당초 확정된 세액을 증가시키는 경정은 당초 확정된 세액에 관한 「국세기본법」또는 세법에서 규정하는 권리·의무관계에 영향을 미친다.","a":"X","e":"세법에 따라 당초 확정된 세액을 증가시키는 경정은 당초 확정된 세액에 관한 「국세기본법」 또는 세법에서 규정하 는 권리·의무관계에 영향을 미치지 아니한다.","pg":29},{"id":162,"ch":3,"n":42,"q":"세법의 규정에 의하여 당초 확정된 세액을 증가시키는 경정 은 당초 확정된 세액에 대하여 행한 독촉. 강제징수 등의 절차는 그 효력을 소멸시킨다.","a":"X","e":"세법의 규정에 의하여 당초 확정된 세액을 증가시키는 경 정이 있어도 당초 확정된 세액에 대하여 행한 독촉. 강제 징수 등의 절차는 그 효력을 유지한다.","pg":30},{"id":163,"ch":3,"n":43,"q":"세법에 따라 당초 확정된 세액을 감소시키는 경정은 그 경 정으로 감소되는 세액에 관한 국세기본법 또는 세법에서 규 정하는 권리·의무관계에 영향을 미치지 아니한다.","a":"X","e":"세법에 따라 당초 확정된 세액을 감소시키는 경정은 그 경정으로 감소되는 세액 외의 세액에 관한 국세기본법 또 는 세법에서 규정하는 권리·의무관계에 영향을 미치지 아니한다.","pg":30},{"id":164,"ch":3,"n":44,"q":"세법에 따라 당초 확정된 세액을 감소시키는 경정은 그 경 정으로 감소되는 세액 외의 세액에 대한 독촉· 강제징수 등 의 절차는 그 효력을 소멸시킨다.","a":"X","e":"세법에 따라 당초 확정된 세액을 감소시키는 경정이 있어 도 그 경정으로 감소되는 세액 외의 세액에 대한 독촉· 강제징수 등의 절차는 그 효력을 유지한다.","pg":30},{"id":165,"ch":3,"n":45,"q":"상속세는 상속이 개시되는 때, 증여세는 증여에 의하여 재산 을 취득하는 때에 각각 납세의무가 성립하고, 「상속세 및 증 여세법」에 따라 납부의무가 있는 자가 신고하는 때에 확정 된다.","a":"X","e":"상속세는 상속이 개시되는 때, 증여세는 증여에 의하여 재산을 취득하는 때에 각각 납세의무가 성립한다. 그러나 납세의무는 해당 국세의 과세표준과 세액을 정부가 결정 하는 때 확정된다.","pg":30},{"id":166,"ch":3,"n":46,"q":"세무서장이 국세환급금으로 결정한 금액으로 체납된 국세가 충당된 때 「국세기본법상 국세를 납부할 의무가 소멸된다.","a":"O","e":"","pg":30},{"id":167,"ch":3,"n":47,"q":"국세 및 강제징수비를 납부할 의무는 국세를 부과할 수 있 는 기간에 국세가 부과되지 아니하고 그 기간이 끝난다고 하더라도 납세의무가 소멸하는 것은 아니다.","a":"X","e":"국세 및 강제징수비를 납부할 의무는 국세를 부과할 수 있는 기간에 국세가 부과되지 아니하고 그 기간이 끝난 때에 소멸한다.","pg":30},{"id":168,"ch":3,"n":48,"q":"국세의 부과결정이 철회된 때 「국세기본법」상 국세를 납부 할 의무가 소멸된다.","a":"X","e":"국세의 부과결정이 취소된 때 「국세기본법상 국세를 납 부할 의무가 소멸된다. 부과결정의 철회는 납세의무의 소 멸사유에 해당하지 않는다.","pg":31},{"id":169,"ch":3,"n":49,"q":"국세징수권의 소멸시효가 완성된 때 「국세기본법」상 국세를 납부할 의무가 소멸된다.","a":"O","e":",","pg":31},{"id":170,"ch":3,"n":50,"q":"국세부과의 제척기간이 만료된 경우와 국세징수권이 소멸시 효의 완성에 의하여 소멸하는 경우에도 이후 납세자의 행방 또는 재산이 발견되면 즉시 부과·징수절차를 진행하여야 한다.","a":"X","e":"국세부과의 제척기간이 만료된 경우와 국세징수권이 소 멸시효의 완성에 의하여 소멸하는 경우에는 납세의무가 소멸하므로, 이후 납세자의 행방 또는 재산이 발견된다고 하더라도 국세를 부과·징수할 수 없다.","pg":31},{"id":171,"ch":3,"n":51,"q":"납세자가 법정신고기한까지 소득세· 부가가치세 과세표준 신고서를 제출하지 아니한 경우에는 소득세· 부가가치세를 부과할 수 있는 날부터 10년간을 부과의 제척기간으로 한다.","a":"X","e":"법정신고기한까지 소득세· 부가가치세 과세표준신고서 를 제출하지 아니한 경우에는 소득세· 부가가치세를 부 과할 수 있는 날부터 7년간을 부과의 제척기간으로 한다. 역외거래의 경우 10년이다.","pg":31},{"id":172,"ch":3,"n":52,"q":"납세자가 사기나 그 밖의 부정한 행위로 역외거래에 의한 국세를 포탈하는 경우 국세의 부과제척기간은 국세를 부과 할 수 있는 날부터 10년으로 한다.","a":"X","e":"납세자가 사기나 그 밖의 부정한 행위로 역외거래에 의 한국세를 포탈하거나 환급·공제를 받은 경우 국세의 부 과제척기간은 국세를 부과할 수 있는 날부터 15년으로 한 다.","pg":31},{"id":173,"ch":3,"n":53,"q":"납세자가 부정행위로 세금계산서 계산서 미발급 등에 대한 가산세 부과대상이 되는 경우 해당 가산세의 부과제척기간 은 가산세를 부과할 수 있는 날부터 15년으로 한다.","a":"X","e":"납세자가 부정행위로 세금계산서 · 계산서 미발급 등에 대한 가산세 부과대상이 되는 경우 해당 가산세의 부과제 척기간은 가산세를 부과할 수 있는 날부터 10년으로 한 다.","pg":31},{"id":174,"ch":3,"n":54,"q":"인 적 반 일 과 부 척 제 간 기 는 또 고 신 무 과 부 척 제 간 기 이 난 끝 날 이 는 하 속 세 과 간 기 후 이 의 세 과 간 기 에 「 세 득 소 법 」, 「 인 법 법 세 」 에 라 따 월 이 금 손 결 을 제 공 는 하 우 경 그 금 손 결 이 발 한 생 세 과 간 기 의 세 득 소 는 또 세 인 법 의 과 부 척 제 간 기 은 이 월 금 손 결 을 제 공 한 세 과 간 기 의 정 법 고 신 한 기 터 부 로 으 3 개 로 월 다 한 .","a":"X","e":"인 적 반 일 과 부 척 제 간 기 는 또 고 신 무 과 부 척 제 간 기 이 끝 난 날 이 는 하 속 세 과 간 기 후 이 의 세 과 간 기 에 「 세 득 소 법 」 , 「 인 법 법 세 」 에 라 따 월 이 금 손 결 을 제 공 는 하 우 경 그 손 결 금 이 한 생 발 세 과 간 기 의 세 득 소 는 또 세 인 법 의 과 부 척 제 간 기 은 월 이 금 손 결 을 제 공 한 세 과 간 기 의 정 법 고 신 한 기 으 터 부 로 1 년 로 으 다 한 .","pg":32},{"id":175,"ch":3,"n":55,"q":"담 부 부 여 증 에 라 따 세 여 증 와 께 함 「 세 득 소 법 」 에 른 따 도 양 세 득 소 가 세 과 는 되 우 경 에 그 세 여 증 의 과 부 척 제 간 기 은 양 도 세 득 소 의 과 부 척 제 간 기 에 다 른 따 . OX 57 세 속 상 · 세 여 증 의 과 부 척 제 간 기 은 세 국 를 과 부 할 수 는 있 날 터 부 0 1 년 로 으 다 한 .","a":"X","e":"담 부 부 여 증 에 라 따 세 여 증 와 께 함 「 세 득 소 법 」 에 른 따 양 \" 도 세 득 소 가 세 과 는 되 우 경 에 그 도 양 세 득 소 의 과 부 척 제 간 기 은 세 여 증 의 과 부 척 제 간 기 에 다 른 따 . 5 7 O 제 출 | K N I L 오 다 진 2 3 0 . p 법 세 6 6 0 . p 1","pg":32},{"id":176,"ch":3,"n":56,"q":"「 세 속 상 및 법 세 여 증 」 에 른 따 서 고 신 를 출 제 지 하 한 니 아 경 우 세 속 상 · 세 여 증 의 과 부 척 제 간 기 은 세 국 를 과 부 할 수 있 는 날 터 부 0 1 년 로 으 다 한 .","a":"X","e":"「 세 속 상 및 법 세 여 증 」 에 른 따 서 고 신 를 출 제 지 하 한 니 아 우 경 세 속 상 · 세 여 증 의 과 부 척 제 간 기 은 세 국 를 과 부 할 수 는 있 날 터 부 5 1 년 로 으 다 한 .","pg":32},{"id":177,"ch":3,"n":59,"q":"납세자가 부정행위로 상속세 · 증여세를 포탈하거나 환급. 공제받은 경우 상속세 · 증여세의 부과제척기간은 국세를 부 과할 수 있는 날부터 10년(국외소재 재산에 대한 상속세 · 증 여세를 부정행위로 포탈하거나 환급·공제받은 경우에는 15 년)으로 한다.","a":"X","e":"납세자가 부정행위로 상속세 · 증여세를 포탈하거나 환 급·공제받은 경우 상속세 · 증여세의 부과제척기간은 국 세를 부과할 수 있는 날부터 15년으로 한다. 납세자가 부 정행위로 상속세 · 증여세를 포탈하는 경우로서 국외에 있는 상속재산이나 증여재산을 상속인이나 수증자가 취 득한 경우 과세관청은 원칙적인 부과제척기간(10년・15 년)에도 불구하고 해당 재산의 상속 또는 증여가 있음을 안 날부터 1년 이내에 상속세 및 증여세를 부과할 수 있 다. 단, 상속인이나 증여자 및 수증자가 사망한 경우나 포탈세액 산출의 기준이 되는 재산가액이 50억원 이하인 경우에는 이러한 특례 부과제척기간은 적용하지 않음 주의","pg":33},{"id":178,"ch":3,"n":60,"q":"납세자가 부정행위로 상속세를 포탈하는 경우로서 계약에 따라 피상속인이 취득할 건물(재산가액 100억원)이 계약이 행기간에 상속이 개시됨으로써 등기·등록 또는 명의개서가 이루어지지 않고 상속인이 취득한 경우 상속세의 부과제척 기간은 국세를 부과할 수 있는 날부터 15년으로 한다.","a":"X","e":"납세자가 부정행위로 상속세를 포탈하는 경우로서 계약 에 따라 피상속인이 취득할 건물(재산가액 100억원)이 계 약이행기간에 상속이 개시됨으로써 등기 · 등록이 이루 어지지 않고 상속인이 취득한 경우 상속세의 부과제척기 간은 해당 재산의 상속이 있음을 안 날부터 1년 이내로서 상속인이 사망하기 전까지이다.","pg":33},{"id":179,"ch":3,"n":61,"q":"포탈세액 산출의 기준이 되는 재산가액이 50억원 이하인 등 기·등록 또는 명의개서가 필요하지 않은 유가증권, 서화, 골동품을 상속인이나 수증자가 취득한 경우 원칙적인 부과 제척기간(10년. 15년)에도 불구하고 해당 재산의 상속 또는 증여가 있음을 안 날부터 1년 이내에 상속세 및 증여세를 부 과할 수 있다.","a":"X","e":"납세자가 부정행위로 상속세 · 증여세를 포탈하는 경우 로서 등기 · 등록 또는 명의개서가 필요하지 않은 유가증 권, 서화, 골동품 등 상속재산 또는 증여재산을 상속인이 나 수증자가 취득한 경우 과세관청은 원칙적인 부과제척 기간(10년• 15년)에도 불구하고 해당 재산의 상속 또는 증여가 있음을 안 날부터 1년 이내에 상속세 및 증여세를 부과할 수 있지만 포탈세액 산출의 기준이 되는 재산가액 이 50억원 이하인 경우에는 이러한 특례부과제척기간은 적용하지 않는다.","pg":33},{"id":180,"ch":3,"n":62,"q":"납세자가 부정행위로 상속세를 포탈하는 경우로서 비거주자 인 피상속인의 국내재산을 상속인이 취득한 경우 상속세의 부과제척기간은 국세를 부과할 수 있는 날부터 15년으로 한 다.","a":"X","e":"납세자가 부정행위로 상속세를 포탈하는 경우로서 비거 주자인 피상속인의 국내재산을 상속인이 취득한 경우 상 속의 부과제척기간은 원칙적인 부과제척기간(10년. 15 1년)에도 불구하고 해당 재산의 상속이 있음을 안 날부터 1년 이내다. → 단, 상속인이 사망한 경우나 포탈세액 산출의 기준이 되는 재산가액 이 50억원 이하인 경우에는 이러한 특례부과제척기간은 적용하지 않 음 주의","pg":34},{"id":181,"ch":3,"n":63,"q":"「국세기본법」에 따른 이의신청, 심사청구, 심판청구, 「감사원 법」에 따른 심사청구 또는 「행정소송법」에 따른 소송에 대한 결정이나 판결이 확정된 경우 원칙적인 부과제척기간에도 불구하고 지방국세청장 또는 세무서장은 그 결정 또는 판 결이 확정된 날부터 3개월이 지나기 전까지 해당 결정 또는 판결에 따라 경정이나 그 밖에 필요한 처분을 할 수 있다.","a":"X","e":"「국세기본법」에 따른 이의신청, 심사청구, 심판청구, 「감 사원법」에 따른 심사청구 또는 「행정소송법」에 따른 소송 에 대한 결정이나 판결이 확정된 경우 원칙적인 부과제척 기간에도 불구하고 지방국세청장 또는 세무서장은 그 결 정 또는 판결이 확정된 날부터 1년이 지나기 전까지 해당 결정 또는 판결에 따라 경정이나 그 밖에 필요한 처분을 할 수 있다.","pg":34},{"id":182,"ch":3,"n":64,"q":"「감사원법」에 따른 심사청구의 결정이 확정됨에 따라 그 결 정의 대상이 된 과세표준 또는 세액과 연동된 같은 세목(같 은 과세기간으로 한정)이나 연동된 같은 과세기간(같은 세목 으로 한정)의 과세표준 또는 세액의 조정이 필요한 경우 해 당 결정 또는 판결이 확정된 날부터 2년 이내 해당 결정 또 는 판결에 따라 다른 세목이나 과세기간의 과세표준 또는 세액의 조정을 할 수 있다.","a":"X","e":"「감사원법」에 따른 심사청구의 결정이 확정됨에 따라 그 결정의 대상이 된 과세표준 또는 세액과 연동된 다른 세 목(같은 과세기간으로 한정)이나 연동된 다른 과세기간 (같은 세목으로 한정)의 과세표준 또는 세액의 조정이 필 요한 경우 해당 결정 또는 판결이 확정된 날부터 1년이 지나기 전까지 해당 결정 또는 판결에 따라 다른 세목이 나 과세기간의 과세표준 또는 세액의 조정을 할 수 있다.","pg":34},{"id":183,"ch":3,"n":65,"q":"「형사소송법」에 따른 소송에 대한 판결이 확정되어 「소득세 법상 뇌물 또는 알선수재·배임수재에 의하여 받는 금품 소득이 발생한 것으로 확인된 경우 해당 소득세의 부과제척 기간은 10년(외거래에서 발생한 부정행위로 인한 소득의 경우에는 15년)이다.","a":"X","e":"「형사소송법」에 따른 소송에 대한 판결이 확정되어 「소득 세법상 뇌물 또는 알선수재·배임수재에 의하여 받는 금 품 소득이 발생한 것으로 확인된 경우 판결이 확정된 날 부터 1년이 지나기 전까지 해당 판결에 따라 경정이나 그 밖에 필요한 처분을 할 수 있다.","pg":34},{"id":184,"ch":3,"n":66,"q":"최초의 신고 • 결정 또는 경정에서 과세표준 및 세액의 계산 근거가 된 거래 또는 행위 등이 그 거래 . 행위 등과 관련된 소송에 대한 판결(판결과 같은 효력을 가지는 화해나 그 밖 의 행위를 포함)에 의하여 다른 것으로 확정된 경우 해당 판 결이 확정된 날부터 1년 이내 해당 결정 또는 판결에 따라 다른 세목이나 과세기간의 과세표준 또는 세액의 조정을 할 수 있다.","a":"O","e":"","pg":35},{"id":185,"ch":3,"n":67,"q":"「민사소송법」에 따른 민사소송에서 명의대여 사실이 확인되 는 경우에는 그 판결이 확정된 날부터 1년 이내에 언제든지 명의대여자에 대한 부과처분을 취소하고 실제로 사업을 경 영한 자에게 경정결정이나 그 밖에 필요한 처분을 할 수 있 다.","a":"X","e":"「국세기본법」에 따른 이의신청, 심사청구, 심판청구, 「감 사원법」에 따른 심사청구 또는 「행정소송법」에 따른 소송 에 대한 결정이나 판결이 확정된 경우 해당되는 내용이 다. 따라서 민사소송의 결과로 확정된 판결은 국세부과제 척기간의 특례사유에 해당하지 않는다.","pg":35},{"id":186,"ch":3,"n":68,"q":"조세조약에 부합하지 아니하는 과세의 원인이 되는 조치가 있는 경우 그 조치가 있음을 안 날부터 3년 이내(조세조약에 서 따로 규정하는 경우에는 그에 따른다)에 그 조세조약의 규정에 따른 상호합의가 신청된 것으로서 그에 대하여 상호 합의가 이루어진 경우 상호합의 절차의 종료일부터 2년이 지나기 전까지 해당 상호합의에 따라 경정이나 그 밖에 필 요한 처분을 할 수 있다.","a":"X","e":"조세조약에 부합하지 아니하는 과세의 원인이 되는 조치 가 있는 경우 그 조치가 있음을 안 날부터 3년 이내(조세 조약에서 따로 규정하는 경우에는 그에 따른다)에 그 조 세조약의 규정에 따른 상호합의가 신청된 것으로서 그에 대하여 상호합의가 이루어진 경우 상호합의 절차의 종료 일부터 1년이 지나기 전까지 해당 상호합의에 따라 경정 이나 그 밖에 필요한 처분을 할 수 있다.","pg":35},{"id":187,"ch":3,"n":69,"q":"「국세기본법」 또는 「국제조세조정에 관한 법률」에 따른 경정 청구 또는 조정권고가 있는 경우 경정청구일 또는 조정권고 일부터 1년이 지나기 전까지 해당 경정청구·조정권고에 따 라 경정이나 그 밖에 필요한 처분을 할 수 있다.","a":"X","e":"「국세기본법」 또는 「국제조세조정에 관한 법률」에 따른 경 정청구 또는 조정권고가 있는 경우 경정청구일 또는 조정 권고일부터 2개월이 지나기 전까지 해당 경정청구 · 조정 권고에 따라 경정이나 그 밖에 필요한 처분을 할 수 있다.","pg":35},{"id":188,"ch":3,"n":70,"q":"역외거래와 관련하여 원칙적인 제척기간이 지나기 전에 「국 제조세조정에 관한 법률」에 따라 조세의 부과와 징수에 필 요한 조세정보를 외국의 권한 있는 당국에 요청하여 조세정 보를 요청한 날부터 2년이 지나기 전까지 조세정보를 받은 경우에는 조세정보를 받은 날부터 2년이 지나기 전까지 해 당 조세정보에 따라 경정이나 그 밖에 필요한 처분을 할 수 있다.","a":"X","e":"역외거래와 관련하여 원칙적인 제척기간이 지나기 전에 「국제조세조정에 관한 법률」에 따라 조세의 부과와 징수 에 필요한 조세정보를 외국의 권한 있는 당국에 요청하여 조세정보를 요청한 날부터 2년이 지나기 전까지 조세정 보를 받은 경우에는 조세정보를 받은 날부터 1년이 지나 기 전까지 해당 조세정보에 따라 경정이나 그 밖에 필요 한 처분을 할 수 있다.","pg":36},{"id":189,"ch":3,"n":71,"q":"「행정소송법」에 따른 소송에 대한 판결에 의하여 「소득세법」 및 「법인세법」에 따른 국내원천소득의 실질귀속자가 확인되 는 경우에는 그 판결이 확정된 날부터 5년 이내에 당초의 부 과 처분을 취소하고 국내원천소득의 실질귀속자 또는 원천 징수 의무자에게 경정이나 그 밖에 필요한 처분을 할 수 있 다.","a":"X","e":"「행정소송법」에 따른 소송에 대한 판결에 의하여 「소득 세법」 및 「법인세법」에 따른 국내원천소득의 실질귀속자 가 확인되는 경우에는 그 판결이 확정된 날부터 1년 이내 에 당초의 부과 처분을 취소하고 국내원천소득의 실질귀를 속자 또는 원천징수 의무자에게 경정이나 그 밖에 필요한 처분을 할 수 있다.","pg":36},{"id":190,"ch":3,"n":72,"q":"「국세기본법」에 따른 이의신청, 심사청구, 심판청구, 「행정소 송법」에 따른 소송에 대한 결정이나 판결에 의하여 과세의 대상이 되는 재산의 귀속이 명의일 뿐이고 사실상 귀속되는 자가 따로 있다는 사실이 확인된 경우에는 그 결정 또는 판 결이 확정된 날부터 1년 이내에 당초의 부과 처분을 취소하 고 재산의 사실상 귀속자에게 경정이나 그 밖에 필요한 처 분을 할 수 있다.","a":"O","e":"控聳","pg":36},{"id":191,"ch":3,"n":73,"q":"국세의 부과제척기간에 관하여 조세의 이중과세를 방지하기 위하여 체결한 조약에 따라 상호합의절차가 진행 중인 경우 에는 상호합의절차 종료일의 다음 날부터 1년이 지난 후에 는 국세를 부과할 수 없다.","a":"X","e":"국세의 부과제척기간에 관하여 조세의 이중과세를 방지 하기 위하여 체결한 조약에 따라 상호합의절차가 진행 중 인 경우에는 상호합의절차 종료일의 다음 날부터 1년의 기간과 「국세기본법」상 부과제척기간 중 나중에 도래하는 5 기간의 만료일 후에는 국세를 부과할 수 없다.","pg":36},{"id":192,"ch":3,"n":74,"q":"소득세의 경우 국세부과제척기간은 과세표준신고기한의 다 음 날부터 기산한다.","a":"O","e":"","pg":36},{"id":193,"ch":3,"n":75,"q":"신고하는 종합부동산세의 경우 국세부과제척기간은 과세표 준신고기한의 다음 날부터 기산한다.","a":"X","e":"신고하는 종합부동산세의 경우 국세부과 제척기간의 기 산일은 납세의무 성립일이다. 종합부동산세는 정부부과 제도를 원칙으로 하되, 예외적으로 신고납부를 인정하므 로 과세형평을 위하여 제척기간의 기산일은 신고 여부에 도 불구하고 납세의무 성립일로 한다.","pg":37},{"id":194,"ch":3,"n":76,"q":"과세표준과 세액을 신고하는 국세(「종합부동산세법」에 따라 신고하는 종합부동산세는 포함)의 경우 해당 국세의 과세표 준 신고기한의 다음날을 국세 부과제척기간의 기산일로 한 다. 이 경우 중간예납· 예정신고기한과 수정신고기한은 과 세표준신고기한에 포함된다.","a":"X","e":"과세표준과 세액을 신고하는 국세(「종합부동산세법」에 따 라 신고하는 종합부동산세는 제외)의 경우 해당 국세의 과세표준 신고기한의 다음날을 국세 부과제척기간의 기 산일로 한다. 이 경우 중간예납 예정신고기한과 수정신 고기한은 과세표준신고기한에 포함되지 않는다.","pg":37},{"id":195,"ch":3,"n":77,"q":"납세조합에 대하여 부과하는 국세의 경우 국세부과제척기 간은 과세표준이 되는 금액이 발생한 달의 말일의 다음 날 부터 기산한다.","a":"X","e":"납세조합에 대하여 부과하는 국세의 경우 국세부과제척 기간은 해당 납세조합징수액의 법정납부기한의 다음 날 부터 기산한다.","pg":37},{"id":196,"ch":3,"n":78,"q":"국세부과의 제척기간은 과세표준과 세액의 신고에 의하여 납세의무가 확정되는 국세의 법정신고납부기한이 연장되는 경우 그 연장된 기한의 다음 날부터 기산한다.","a":"O","e":"","pg":37},{"id":197,"ch":3,"n":79,"q":"공제·면제. 비과세 또는 낮은 세율의 적용 등에 따른 세액 을 의무불이행 등의 사유로 징수하는 경우 납부고지한 해당 국세의 부과제척기간은 그 고지에 따른 납부기한의 다음 날 부터 기산한다.","a":"X","e":"공제· 면제·비과세 또는 낮은 세율의 적용 등에 따른 세 액을 의무불이행 등의 사유로 징수하는 경우 국세부과의 제척기간은 공제세액 등을 징수할 수 있는 사유가 발생한 날부터 기산한다.","pg":37},{"id":198,"ch":3,"n":80,"q":"소득공제를 받은 금액에 상당하는 세액을 의무불이행으로 인하여 징수하는 경우 국세 부과제척기간의 기산일은 해당 국세를 소득공제 받은 날로 한다.","a":"X","e":"소득공제를 받은 금액에 상당하는 세액을 의무불이행으 로 인하여 징수하는 경우 국세 부과제척기간의 기산일은 해당 공제세액을 징수할 수 있는 사유가 발생한 날로 한 다.","pg":37},{"id":199,"ch":3,"n":81,"q":"국세 부과의 제척기간이 만료되면 부과권을 행사할 수 없고 징수권도 발생하지 아니한다.","a":"O","e":"","pg":38},{"id":200,"ch":3,"n":82,"q":"상속세 및 증여세의 납세의무자가 해당 세액에 대한 연부연 납을 신청한 경우 그 부과제척기간은 정지된다.","a":"X","e":"상속세 및 증여세의 납세의무자가 해당 세액에 대한 연부 연납을 신청하더라도 그 부과제척기간은 정지되지 않는다. 부과제척기간은 중단과 정지제도가 인정되지 않는다.","pg":38},{"id":201,"ch":3,"n":83,"q":"제척기간은 세법에 따른 납부고지의 유예기간에는 정지된 다.","a":"X","e":"제척기간은 권리관계를 조속히 확정시키려는 목적이므로 그 진행기간의 중단과 정지가 인정되지 않는다.","pg":38},{"id":202,"ch":3,"n":84,"q":"소멸시효에 관하여는 「국세기본법」 또는 세법에 특별한 규 정이 있는 것을 제외하고는 「민법」에 따른다.","a":"O","e":"","pg":38},{"id":203,"ch":3,"n":85,"q":"가산세를 포함한 금액이 5억원 이상의 소득세의 국세징수권 은 그 법정신고납부기한의 다음 날부터 10년 동안 행사하지 않으면 소멸시효가 완성된다.","a":"X","e":"가산세를 제외한 금액이 5억원 이상의 소득세의 국세징 수권은 그 법정신고납부기한의 다음 날부터 10년 동안 행 사하지 않으면 소멸시효가 완성된다.","pg":38},{"id":204,"ch":3,"n":86,"q":"법인세 10억원을 무신고하여 과세표준 및 세액을 정부가 결 정하는 경우 납부고지한 세액은 그 납부고지에 따른 납부기 한의 종료일부터 10년 동안 행사하지 않으면 소멸시효가 완 성된다.","a":"X","e":"법인세 10억원을 무신고하여 과세표준 및 세액을 정부가 결정하는 경우 납부고지한 세액은 그 납부고지에 따른 납 부기한의 다음 날부터 10년 동안 행사하지 않으면 소멸시 효가 완성된다.","pg":38},{"id":205,"ch":3,"n":87,"q":"과세표준과 세액의 신고에 의하여 납세의무가 확정되는 국 세의 경우로서 신고한 세액의 국세징수권 소멸시효는 그 법 정신고납부기한의 다음 날부터 기산한다.","a":"O","e":"","pg":38},{"id":206,"ch":3,"n":88,"q":"원천징수의무자 또는 납세조합으로부터 징수하는 국세로서 납부고지한 원천징수세액 또는 납세조합징수세액의 국세징 수권의 소멸시효는 해당 원천징수액 또는 납세조합징수액 법정납부기한의 다음 날부터 기산한다.","a":"X","e":"원천징수의무자 또는 납세조합으로부터 징수하는 국세로 서 납부고지한 원천징수세액 또는 납세조합징수세액의 국세징수권의 소멸시효는 그 납부고지에 따른 납부기한 의 다음 날부터 기산한다.","pg":39},{"id":207,"ch":3,"n":89,"q":"인지세의 경우 납세고지한 인지세의 국세징수권 소멸시효는 그 고지에 따른 납부기한의 다음 날부터 기산한다.","a":"O","e":"","pg":39},{"id":208,"ch":3,"n":90,"q":"국세징수권의 소멸시효는 납부고지, 독촉, 압류(압류금지재 산 또는 제3자의 재산을 압류하여 압류를 즉시 해제하는 경 우는 제외)의 사유로 중단된다.","a":"O","e":"","pg":39},{"id":209,"ch":3,"n":91,"q":"국세징수권의 소멸시효는 교부청구의 사유로 중단된다.","a":"O","e":"","pg":39},{"id":210,"ch":3,"n":92,"q":"국세징수권의 소멸시효는 납부고지의 유예의 사유로 중단된 다.","a":"X","e":"국세징수권의 소멸시효는 납부고지의 유예의 사유로 정 지된다.","pg":39},{"id":211,"ch":3,"n":93,"q":"국세징수권의 소멸시효는 분납기간, 세법에 따른 압류·매 각의 유예기간, 연부연납기간에는 진행되지 아니한다.","a":"O","e":"","pg":39},{"id":212,"ch":3,"n":94,"q":"세무공무원이 국세징수법」에 따른 사해행위 취소소송을 제 기하여 그 소송이 진행 중인 기간 동안 징수권 소멸시효는 정지하지 아니한다.","a":"X","e":"세무공무원이 국세징수법」에 따른 사해행위 취소소송을 제기하여 그 소송이 진행 중인 기간 동안 징수권 소멸시 효는 정지한다.","pg":39},{"id":213,"ch":3,"n":95,"q":"체납자가 국외에 3개월 이상 계속 체류하는 경우 해당 국외 체류 기간 동안 징수권 소멸시효는 정지한다.","a":"X","e":"체납자가 국외에 6개월 이상 계속 체류하는 경우 해당 국 외 체류 기간 동안 징수권 소멸시효는 정지한다.","pg":39},{"id":214,"ch":3,"n":96,"q":"「민법」에 따른 채권자대위 소송이 제기되어 그 소송이 각 하· 기각 또는 취하된 경우 징수권 소멸시효는 정지한다.","a":"X","e":"「민법」에 따른 채권자대위 소송이 제기되어 그 소송이 진 행 중인 기간 동안 징수권 소멸시효는 정지하되 해당 소 송이 각하 · 기각 또는 취하된 경우에는 그 시효정지의 효 력이 없다.","pg":40},{"id":215,"ch":3,"n":97,"q":"세무공무원이 제기한 「국세징수법」에 따른 사해행위 취소소 송이 진행중인 기간에는 국세징수권의 소멸시효가 진행되지 아니하나. 그 소송이 각하. 기각 또는 취하된 경우에는 시효 정지의 효력이 없다.","a":"O","e":"","pg":40},{"id":216,"ch":3,"n":98,"q":"국세징수권의 소멸시효가 완성되면 기산일에 소급하여 징 수권이 소멸하여 국세는 들른이고 시효기간 중에 발생한 그 국세의 강제징수비 및 이자상당세액도 함께 소멸한다.","a":"O","e":"","pg":40},{"id":217,"ch":3,"n":99,"q":"국세징수권의 소멸시효가 완성되면 제2차 납세의무자와 납 세보증인 및 물적납세의무자에게도 그 효력이 미친다.","a":"O","e":"","pg":40},{"id":218,"ch":4,"n":1,"q":"법인이 합병한 경우 합병 후 존속하는 법인 또는 합병으로 설립된 법인은 합병으로 소멸된 법인에 부과되거나 그 법인 이 납부할 국세 및 강제징수비를 합병으로 소멸된 법인과 연대하여 납부할 의무를 진다. ○","a":"X","e":"법인이 합병한 경우 합병 후 존속하는 법인 또는 합병으 로 설립된 법인은 합병으로 소멸된 법인에 부과되거나 그 법인이 납부할 국세 및 강제징수비를 납부할 의무를 진 다. 즉, 법인의 합병은 납세의무의 승계 대상이지 연대납 세의무 사유에 해당하지 않는다.","pg":41},{"id":219,"ch":4,"n":2,"q":"법인이 합병한 경우 합병법인은 피합병법인에 부과되거나 그 법인이 납부할 국세(강제징수비 제외)를 납부할 의무를 진다.","a":"X","e":"법인이 합병한 경우 합병법인은 피합병법인에 부과되거 나 그 법인이 납부할 국세 및 강제징수비를 납부할 의무 를 진다.","pg":41},{"id":220,"ch":4,"n":3,"q":"법인이 합병한 경우 합병 후 존속하는 법인 또는 합병으로 설립된 법인은 합병으로 소멸된 법인에 부과되거나 그 법인 이 납부할 국세 및 강제징수비를 합병으로 승계된 재산가액 을 한도로 납부할 의무를 진다.","a":"X","e":"법인이 합병한 경우 합병 후 존속하는 법인 또는 합병으 로 설립된 법인은 합병으로 소멸된 법인에 부과되거나 그 법인이 납부할 국세 및 강제징수비를 한도 없이 납부할 의무를 진다. 상속으로 인한 포괄적 납세의무의 승계와는 달리 한도가 없음을 주의해야 한다.","pg":41},{"id":221,"ch":4,"n":4,"q":"상속이 개시된 때에 피상속인에게 부과되거나 피상속인이 납부할 국세 등은 상속인 또는 상속재산관리인에게 납세의 무에 대한 별도의 지정조치 없이 「국세기본법」에 의하여 당 연히 승계되며, 피상속인의 생전에 피상속인에게 행한 처분 또는 절차는 상속인 또는 상속재산관리인에 대하여도 효력 이 있다.","a":"O","e":"","pg":41},{"id":222,"ch":4,"n":5,"q":"상속이 개시된 때에 그 상속인(수유자 제외) 또는 상속재산 관리인은 강제징수비를 제외한 피상속인의 국세를 전액 승 계한다.","a":"X","e":"상속이 개시된 때에 그 상속인(수유자 포함) 또는 상속재 산관리인은 피상속인에게 부과되거나 그 피상속인이 남 부할 국세 및 강제징수비를 납부할 의무를 진다. 이때 상 속받은 재산의 한도 내에서 승계받는다. 이때 상속으로 받은 재산은 다음 계산식에 따른 가액으로 한다. 상속으로 받은 재산 상속받은 자산총액- (상속받은 부채총액 + 상속으 == 로 인하여 부과되거나 납부할 상속세)","pg":42},{"id":223,"ch":4,"n":6,"q":"피상속인이 상속인을 수익자로 하는 보험계약을 체결하고 상속인은 「민법」에 따라 상속을 포기한 것으로 인정되는 경 우로서 상속포기자가 피상속인의 사망으로 인하여 보험금 (손해보험 보험금 또는 생명보험금)을 받는 경우 상속포기자 는 상속인으로 보지 아니한다.","a":"X","e":"납세의무 승계를 피하면서 재산을 상속받기 위하여 피상 속인이 상속인을 수익자로 하는 보험계약을 체결하고 상 속인은 「민법」에 따라 상속을 포기한 것으로 인정되는 경 우로서 상속포기자가 피상속인의 사망으로 인하여 보험 금(생명보험 또는 손해보험의 보험금)을 받는 때에는 상 속포기지를 상속인으로 보고, 보험금을 상속받은 재산으 로 본다.","pg":42},{"id":224,"ch":4,"n":7,"q":"상속인이 2명 이상일 때에는 각 상속인은 피상속인에게 부 과되거나 그 피상속인이 납부할 국세 및 강제징수비를 법」에 따른 상속분에 따라 나누어 계산한 국세 및 강제징수 비를 상속으로 받은 재산의 한도에서 분할하여 납부할 의무 를 진다.","a":"X","e":"상속인이 2명 이상일 때에는 각 상속인은 피상속인에게 부과되거나 그 피상속인이 납부할 국세 및 강제징수비를 「민법」에 따른 상속분에 따라 나누어 계산한 국세 및 강제 징수비를 상속으로 받은 재산의 한도에서 연대하여 납부 할 의무를 진다.","pg":42},{"id":225,"ch":4,"n":8,"q":"피상속인에게 한 처분 또는 절차는 상속으로 인한 납세의무 를 승계하는 상속인이나 상속재산관리인에 대해서도 효력이 있다.","a":"O","e":"","pg":42},{"id":226,"ch":4,"n":9,"q":"공유물, 공동사업 또는 그 공동사업에 속하는 재산과 관계되 는 국세 및 강제징수비는 공유자 또는 공동사업자가 연대하 여 납부할 의무를 진다.","a":"O","e":"","pg":42},{"id":227,"ch":4,"n":10,"q":"「국세기본법」상 공동사업 또는 그 공동사업에 속하는 재산 과 관계되는 국세 및 강제징수비는 공동사업자별로 납부할 의무를 진다.","a":"X","e":"「국세기본법」상 공동사업 또는 그 공동사업에 속하는 재 산과 관계되는 국세 및 강제징수비는 공동사업자가 연대 하여 납부할 의무를 진다.","pg":43},{"id":228,"ch":4,"n":11,"q":"법인이 분할되거나 분할합병된 후 분할법인이 존속하는 경 우 분할등기일 이전에 분할법인에 부과되거나 납세의무가 성립한 국세 및 강제징수비는 분할로 인하여 설립되는 법인. 분할합병의 상대방 법인이 분할로 승계된 재산가액을 한도 로 연대하여 납부할 의무가 있다.","a":"X","e":"법인이 분할되거나 분할합병된 후 분할법인이 존속하는 경우 분할등기일 이전에 분할법인에 부과되거나 납세의 무가 성립한 국세 및 강제징수비는 분할법인. 분할로 인 하여 설립되는 법인. 분할합병의 상대방 법인이 분할로 승계된 재산가액을 한도로 연대하여 납부할 의무가 있다.","pg":43},{"id":229,"ch":4,"n":12,"q":"법인이 분할한 후 소멸하는 경우 분할신설법인은 분할법인 에 부과되거나 분할법인이 납부해야 할 국세 및 강제징수비 에 대하여 분할로 승계된 재산가액을 한도로 제2차 납세의 무를 진다.","a":"X","e":"법인이 분할한 후 소멸하는 경우 분할신설법인은 분할법인 에 부과되거나 분할법인이 납부해야 할 국세 및 강제징수 비에 대하여 분할로 승계된 재산가액을 한도로 연대하여 납부할 의무가 있다.","pg":43},{"id":230,"ch":4,"n":13,"q":"법인이 채무자 회생 및 파산에 관한 법률」에 따라 신회사 를 설립하는 경우 그 설립 전의 법인에 확정된 국세 및 강제 징수비는 신회사 설립 전의 법인 설립된 신회사가 연대하여 납부할 의무를 진다.","a":"X","e":"법인이 「채무자 회생 및 파산에 관한 법률」에 따라 신회 사를 설립하는 경우 그 설립 전의 법인에 부과되거나 납 세의무가 성립한 국세 및 강제징수비는 신회사 설립 전의 법인 설립된 신회사가 연대하여 납부할 의무를 진다.","pg":43},{"id":231,"ch":4,"n":14,"q":"어느 연대납세의무자가 변제 기타 자기의 출재로 공동면책 이 된 때에는 다른 연대납세의무자의 부담부분에 대하여 구 상권을 행사할 수 있다.","a":"O","e":"","pg":43},{"id":232,"ch":4,"n":15,"q":"「소득세법」에 따른 공동사업(사업소득이 발생하는 사업)에서 발생하는 소득금액은 공동사업자 간 손익분배비율에 의하여 분배되었거나 분배될 소득금액을 한도로 공동사업자들이 연 대납세의무를 진다.","a":"X","e":"「소득세법」에 따른 공동사업(사업소득이 발생하는 사업) 에서 발생하는 소득금액은 공동사업자 간 손익분배비율 에 의하여 분배되었거나 분배될 소득금액에 따라 공동사 업자별로 소득세 납세의무를 진다. 즉, 연대납세의무에 관한 규정은 개별세법의 특례규정이 「국세기본법」에 우선한다.","pg":43},{"id":233,"ch":4,"n":16,"q":"법인이 해산하여 청산하는 경우에 그 법인에 부과되거나 그 법인이 납부할 국세 및 강제징수비를 납부하지 않고 해산 에 의한 잔여재산을 분배하거나 인도한 경우로서 그 법인에 대하여 강제징수를 집행하여도 징수할 금액에 미치지 못하 는 경우에 청산인 또는 잔여재산을 분배받거나 인도받은 자 는 그 부족한 금액에 대하여 연대하여 납부할 의무를 진다.","a":"X","e":"법인이 해산하여 청산하는 경우에 그 법인에 부과되거나 그 법인이 납부할 국세 및 강제징수비를 납부하지 않고 해산에 의한 잔여재산을 분배하거나 인도한 경우로서 그 법인에 대하여 강제징수를 집행하여도 징수할 금액에 미 치지 못하는 경우에 청산인 또는 잔여재산을 분배받거나 인도받은 자는 그 부족한 금액에 대하여 제2차 납세의무 를 진다.","pg":44},{"id":234,"ch":4,"n":17,"q":"청산인의 경우 분배하거나 인도한 재산의 가액을 한도로, 잔 여재산을 분배받거나 인도받은 자의 경우에는 각자가 받은 재산의 가액을 한도로 제2차 납세의무를 진다.","a":"O","e":"","pg":44},{"id":235,"ch":4,"n":18,"q":"상장법인의 재산으로 그 법인에 부과되거나 그 법인이 납부 할 국세 및 강제징수비에 충당하여도 부족한 경우에는 그 법인의 납부기한 만료일 현재 과점주주가 그 부족한 금액에 대하여 제2차 납세의무를 진다.","a":"X","e":"법인(단, 유가증권시장 및 코스닥 상장법인은 제외)의 재 산으로 그 법인에 부과되거나 그 법인이 납부할 국세 및 강제징수비에 충당하여도 부족한 경우에는 그 법인의 납 세의무 성립일 현재 과점주주가 그 부족한 금액에 대하여 제2차 납세의무를 진다.","pg":44},{"id":236,"ch":4,"n":19,"q":"국세의 납부기한 만료일 현재 법인의 무한책임사원 또는 과 점주주 및 과정조합원의 재산(그 법인의 발행주식 또는 출자 지분은 제외)으로 그 출자자가 납부할 국세 및 강제징수비에 충당하여도 부족한 경우로서 출자자의 소유주식 또는 출자 지분의 매각불능 등의 사유가 있는 경우 법인이 제2차 납세 의무를 진다.","a":"X","e":"국세의 납부기한 만료일 현재 법인의 무한책임사원 또는 과점주주의 재산(그 법인의 발행주식 또는 출자지분은 제 외)으로 그 출자자가 납부할 국세 및 강제징수비에 충당 하여도 부족한 경우로서 출자자의 소유주식 또는 출자지 분의 매각불능 등의 사유가 있는 경우 법인이 제2차 납세 의무를 진다.","pg":44},{"id":237,"ch":4,"n":20,"q":"국세의 납세의무 성립일 현재 법인의 무한책임사원 또는 과 점주주의 재산(그 법인의 발행주식 또는 출자지분 포함)으로 그 출자자가 납부할 국세 및 강제징수비에 충당하여도 부족 한 경우로서 정부가 출자자의 소유주식 또는 출자지분을 재 공매하거나 수의계약으로 매각하려 하여도 매수희망자가 없 는 경우 법인이 제2차 납세의무를 진다.","a":"X","e":"국세의 납부기한 만료일 현재 법인의 무한책임사원 또는 과점주주의 재산(그 법인의 발행주식 또는 출자지분은 제 •외)으로 그 출자자가 납부할 국세 및 강제징수비에 충당 하여도 부족한 경우로서 정부가 출자자의 소유주식 또는 • 출 자 지 분 을 제 공 매하 거 나 수 의 계 약으로 매 하 하 여 도 •매수희망자가 없는 경우 법인이 제2차 납세의무를 각 려 진다.","pg":44},{"id":238,"ch":4,"n":21,"q":"과점주주의 제2차 납세의무는 법인의 재산으로 그 법인이 납부할 국세에 충당하여도 부족한 경우, 그 부족한 금액을 법인의 발행주식 총수(의결권이 없는 주식도 포함) 또는 출 자총액으로 나눈 금액에 해당 과점주주가 실질적으로 권리 를 행사하는 주식 수(의결권이 없는 주식도 포함) 또는 출자 액을 곱하여 산출한 금액을 한도로 한다.","a":"X","e":"과점주주의 제2차 납세의무는 법인의 재산으로 그 법인 이 납부할 국세에 충당하여도 부족한 경우, 그 부족한 금 액을 법인의 발행주식 총수(의결권이 없는 주식은 제외) 또는 출자총액으로 나눈 금액에 해당 과점주주가 실질적 으로 권리를 행사하는 주식 수(의결권이 없는 주식은 제 외) 또는 출자액을 곱하여 산출한 금액을 한도로 한다.","pg":45},{"id":239,"ch":4,"n":22,"q":"A법인의 과점주주가 아닌 유한책임사원 甲의 재산으로 甲 이 납부할 국세에 충당하여도 부족한 경우에는 A법인은 법 률에 의하여 甲의 소유주식의 양도가 제한된 경우에만 그 부족한 금액에 대하여 제2차 납세의무를 진다.","a":"X","e":"국세의 납부기간 만료일 현재 법인의 무한책임사원 또는 과점주주의 재산(그 법인의 발행주식 또는 출자지분은 제 외)으로 그 무한책임사원 또는 과점주주가 납부할 국세 및 강제징수비에 충당하여도 부족한 경우로서 다음의 어 느 하나에 해당하는 경우에만 그 부족한 금액에 대하여 제2차 납세의무를 진다. ㉠ 정부가 출자자의 소유주식 또는 출자지분을 재공매 하거나 수의계약으로 매각하려 하여도 매수희망자 가 없는 경우 ㉡ 그 법인이 외국법인인 경우로서 출자자의 소유주식 또는 출자지분이 외국에 있는 재산에 해당하여 「국세 징수법」에 따른 압류 등 강제징수가 제한되는 경우 ㉢ 법률 또는 그 법인의 정관에 의하여 출자자의 소유 주식 또는 출자지분의 양도가 제한된 경우 국세징 수법」에 따라 공매할 수 없는 경우는 제외)","pg":45},{"id":240,"ch":4,"n":23,"q":"법인의 제2차 납세의무는 법인의 자산총액에서 부채총액 을 차감한 금액을 발행주식총액 또는 출자총액으로 나눈 금 액에 출자자의 소유주식 금액 또는 출자액을 곱하여 산출한 금액을 한도로 한다.","a":"O","e":"","pg":45},{"id":241,"ch":4,"n":24,"q":"'사업의 양수'란 계약의 명칭이나 형식에 관계없이 사업장별 로 그 사업에 관한 모든 권리(미수금에 관한 것은 포함)와 모 든 의무(미지급금에 관한 것은 포함)를 포괄적으로 승계하는 것을 말한다.","a":"X","e":"'사업의 양수'란 계약의 명칭이나 형식에 관계없이 사업장 별로 그 사업에 관한 모든 권리(미수금에 관한 것은 제외) 와 모든 의무(미지급금에 관한 것은 제외)를 포괄적으로 승계하는 것을 말한다.","pg":45},{"id":242,"ch":4,"n":25,"q":"사업을 포괄적으로 양도한 경우에 사업양도인은 양도한 대 가를 한도로 제2차 납세의무를 진다.","a":"X","e":"사업을 포괄적으로 양도한 경우 법정요건을 만족한 사업 양수인이 양도한 대가를 한도로 제2차 납세의무를 진다.","pg":46},{"id":243,"ch":4,"n":26,"q":"사업양도일 이전에 양도인의 납세의무가 성립된 그 사업에 관한 국세 및 강제징수비를 양도인의 재산으로 충당하여도 부족할 때에는 대통령령으로 정하는 사업의 양수인은 그 부 족한 금액에 대하여 양수한 재산의 가액을 한도로 양도인과 연대하여 납부할 의무를 진다.","a":"X","e":"사업양도일 이전에 양도인의 납세의무가 확정된 그 사업 에 관한 국세 및 강제징수비를 양도인의 재산으로 충당하 여도 부족할 때에는 대통령령으로 정하는 사업의 양수인 은 그 부족한 금액에 대하여 양수한 재산의 가액을 한도 로 제2차 납세의무를 진다.","pg":46},{"id":244,"ch":4,"n":27,"q":"사업양수인의 제2차 납세의무에 있어서 사업양수인이란 사 업장별로 그 사업에 관한 모든 권리(미수금에 관한 것은 제 외)와 모든 의무(미지급금에 관한 것은 제외)를 포괄적으로 승계한 자로서 양도인과 특수관계인인 자이거나 양도인의 조세회피를 목적으로 사업을 양수한 자를 말한다.","a":"O","e":"","pg":46},{"id":245,"ch":4,"n":28,"q":"사업을 포괄적으로 양도한 경우 사업의 양수인은 사업양도 일 이전에 양도인의 납세의무가 확정된 그 사업에 관한 국 세 및 강제징수비를 양도인의 재산으로 충당하여도 부족할 때 그 부족한 금액에 대하여 양수한 재산의 가액을 한도로 제2차 납세의무를 진다. OX 29 사업을 양도함에 따라 납부하여야 할 사업용 부동산(토지. 건물 등)에 대한 양도소득세에 대하여 양도인의 재산으로 충 당하여도 부족할 때에는 대통령령으로 정하는 사업의 양수 인은 그 부족한 금액에 대하여 양수한 재산의 가액을 한도 로 납세의무를 진다.","a":"X","e":"사업을 포괄적으로 양도한 경우 사업의 양수인이 사업양 도인의 국세 및 강제징수비에 대하여 제2차 납세의무를 지는 것은 양도인과 특수관계자이거나 양도인의 조세회 피를 목적으로 사업을 양수한 자의 경우에만 그러하다. 따라서 모든 사업의 양수인이 제2차 납세의무를 지는 것 이 아님을 주의한다. 29 X TO LI오오N진진다다KP. P.040 04세0 법1p.083 사업을 양도함에 따라 납부하여야 할 사업용 부동산(토 지. 건물 등)에 대한 양도소득세는 해당 사업에 관한 국 세가 아니므로 사업양수인은 납세의무를 지지 않는다.","pg":46},{"id":246,"ch":4,"n":30,"q":"사업의 양도인에게 둘 이상의 사업장이 있는 경우에 하나의 사업장을 양수한 자는 양수한 사업장 외의 다른 사업장과 관계되는 국세 및 강제징수비에 대해서도 제2차 납세의무를 진다.","a":"X","e":"사업의 양도인에게 둘 이상의 사업장이 있는 경우에 양수 한 사업장과 관계되는 국세 및 강제징수비에 대해서만 제 2차 납세의무를 진다.","pg":47},{"id":247,"ch":4,"n":31,"q":"납세자의 양도담보재산으로써 납세자의 국세 및 강제징수비 를 징수하려면 납세자가 국세 및 강제징수비를 미납하여야 한다.","a":"X","e":"납세자의 양도담보재산으로써 납세자의 국세 및 강제징 수비를 징수하려면 납세자가 국세 및 강제징수비를 체납 하여야 한다.","pg":47},{"id":248,"ch":4,"n":32,"q":"「국세기본법」에서 양도담보재산이란 당사자 간의 계약에 의 하여 납세자가 그 재산을 양도하였을 때에 실질적으로 양도 인에 대한 채권담보의 목적이 된 재산을 말한다.","a":"O","e":"","pg":47},{"id":249,"ch":4,"n":33,"q":"납세자의 양도담보재산으로써 납세자의 국세 및 강제징수비 를 징수하려면 납세자의 재산(양도담보재산 포함)에 대하여 강제징수를 집행하여도 징수할 금액에 미치지 못하는 경우 에 해당하여야 한다.","a":"X","e":"납세자의 양도담보재산으로써 납세자의 국세 및 강제징 수비를 징수하려면 납세자의 재산(양도담보재산 제외)에 대하여 강제징수를 집행하여도 징수할 금액에 미치지 못 하는 경우에 해당하여야 한다.","pg":47},{"id":250,"ch":4,"n":34,"q":"양도담보재산이 납세자가 체납한 국세의 법정기일 전에 담 보의 목적이 되어야 한다.","a":"X","e":"양도담보재산이 납세자가 체납한 국세의 법정기일 후에 담보의 목적이 되어야 한다.","pg":47},{"id":251,"ch":4,"n":35,"q":"납부고지가 있은 후 납세자가 양도에 의하여 실질적으로 담 보된 채무를 불이행하여 해당 재산이 양도담보권자에게 확 정적으로 귀속되고 양도담보권이 소멸하는 경우 물적납세의 무는 소멸한다.","a":"X","e":"납부고지가 있은 후 납세자가 양도에 의하여 실질적으로 담보된 채무를 불이행하여 해당 재산이 양도담보권자에 게 확정적으로 귀속되고 양도담보권이 소멸하는 경우에 는 납부고지 당시의 양도담보재산이 계속하여 양도담보 재산으로서 존속하는 것으로 본다.","pg":47},{"id":252,"ch":4,"n":37,"q":"납세자가 법정기일 전 1년 내에 양도담보설정계약을 한 경 우에는 이를 짜고 한 거짓계약으로 추정한다.","a":"X","e":"납세자가 법정기일 전 1년 내에 친족이나 그 밖의 특수관 계인과 양도담보설정계약을 한 경우에는 이를 짜고 한 거 짓계약으로 추정한다.","pg":48},{"id":253,"ch":4,"n":38,"q":"「부가가치세법」상 양도담보의 목적으로 부동산상의 권리 를 제공하는 것은 재화의 공급으로 본다.","a":"X","e":"사업자가 양도담보의 목적으로 동산·부동산 및 부동산 상의 권리를 제공한 경우에도 이는 채권담보목적에 불과 하므로 재화의 공급으로 보지 아니한다.","pg":48},{"id":254,"ch":5,"n":1,"q":"강제집행. 경매에 따라 재산을 매각할 때 그 매각금액 중에 서 국세 및 강제징수비를 징수하는 경우의 그 강제집행, 경 매에 든 비용은 국세 및 강제징수비보다 우선 변제되지 아 니한다.","a":"X","e":"강제집행. 경매에 따라 재산을 매각할 때 그 매각금액 중 에서 국세 및 강제징수비를 징수하는 경우의 그 강제집 행. 경매에 든 비용은 국세 및 강제징수비보다 우선 변제 된다.","pg":49},{"id":255,"ch":5,"n":2,"q":"지방세나 공과금의 강제징수를 할 때 그 체납처분 또는 강 제징수 금액 중에서 국세 및 강제징수비를 징수하는 경우의 그 지방세나 공과금의 체납처분비 또는 강제징수비는 국세 및 강제징수비보다 우선 징수된다.","a":"O","e":"","pg":49},{"id":256,"ch":5,"n":3,"q":"법정기일 후에 전세권, 질권 또는 저당권이 설정된 재산을 매각하여 그 매각금액에서 국세를 징수하는 경우 그 전세권, 질권 또는 저당권에 의하여 담보된 채권은 국세보다 우선 변제된다.","a":"X","e":"법정기일 전에 전세권, 질권 또는 저당권이 설정된 재산 을 매각하여 그 매각금액에서 국세를 징수하는 경우 그 전세권, 질권 또는 저당권에 의하여 담보된 채권은 국세 보다 우선 변제된다.","pg":49},{"id":257,"ch":5,"n":4,"q":"「국세기본법」상 과세표준과 세액의 신고에 따라 납세의무가 확정되는 국세(중간예납하는 법인세와 예정신고납부하는 부 가가치세 및 양도소득세 포함)의 경우 신고한 해당 세액에 대해서는 그 신고일이 국세의 법정기일이 된다.","a":"O","e":"","pg":49},{"id":258,"ch":5,"n":5,"q":"과세표준과 세액을 정부가 결정 • . 경정 또는 수시부과 결정 을 하는 경우 고지한 해당 세액의 법정기일은 그 납부고지 서의 도달일이다.","a":"X","e":"과세표준과 세액을 정부가 결정 • . 경정 또는 수시부과 결 정을 하는 경우 고지한 해당 세액의 법정기일은 그 납부 고지서 발송일이다.","pg":49},{"id":259,"ch":5,"n":6,"q":"제2차 납세의무자의 재산에서 징수하는 국세의 법정기일은 「국세징수법」 제7조에 따른 납부고지서의 발송일이다.","a":"O","e":"","pg":49},{"id":260,"ch":5,"n":7,"q":"납세조합으로부터 징수하는 국세의 법정기일은 과세표준이 되는 금액이 발생한 날이다.","a":"X","e":"납세조합으로부터 징수하는 국세의 법정기일은 그 납세 의무의 확정일(과세표준이 되는 금액이 발생한 달의 말 인)이다.","pg":50},{"id":261,"ch":5,"n":8,"q":"원천징수의무자로부터 징수하는 국세와 인지세의 법정기일 은 그 납세의무의 확정일이다.","a":"O","e":"","pg":50},{"id":262,"ch":5,"n":9,"q":"양도담보재산에서 징수하는 국세의 법정기일은 그 납세의무 의 확정일이다.","a":"X","e":"양도담보재산에서 징수하는 국세의 법정기일은 그 납부 고지서 발송일이다.","pg":50},{"id":263,"ch":5,"n":10,"q":"「종합부동산세법」에 따라 신탁재산에서 징수하는 종합부동 산세의 법정기일은 과세기준일(매년 6월 1일)이다.","a":"X","e":"「종합부동산세법」에 따라 신탁재산에서 징수하는 종합부 동산세의 법정기일은 그 납부고지서의 반송인이다.","pg":50},{"id":264,"ch":5,"n":11,"q":"「국세징수법」에 따라 납세자의 재산을 압류(확정 전 보전압 류)하는 경우 그 압류와 관련하여 확정된 국세의 법정기일은 그 압류등기일 또는 등록일이다.","a":"O","e":"","pg":50},{"id":265,"ch":5,"n":12,"q":"해당 재산에 대하여 부과된 상속세는 법정기일 전에 설정된 저당권에 의하여 담보된 채권보다 우선한다.","a":"O","e":"","pg":50},{"id":266,"ch":5,"n":13,"q":"세무서장 대한씨는 법인세를 체납하고 있는 (주)한국에 대하 여 회사 소유 A부동산을 압류하고 이를 매각한 금액으로 법 인세를 충당하려고 한다. 그런데 주㈜한국에게는 체불임금도 있고, A부동산을 담보로 한 민국은행 대출채권도 있다. A부 동산에 법인세의 법정기일 이전에 저당권이 설정된 경우 민 국은행 대출채권, 법인세, 최종 3월분 이외의 임금채권 순으 로 변제된다.","a":"X","e":"세무서장 대한씨는 법인세를 체납하고 있는 (주)한국에 대 하여 회사 소유 A부동산을 압류하고 이를 매각한 금액으 로 법인세를 충당하려고 한다. 그런데 (주)한국에게는 체불 임금도 있고, A부동산을 담보로 한 민국은행 대출채권도 있다. A부동산에 법인세의 법정기일 이전에 저당권이 설 정된 경우 민국은행 대출채권, 최종 3월분 이외의 임금체 권, 법인세 순으로 번제된다.","pg":50},{"id":267,"ch":5,"n":14,"q":"법정기일 후에 가등기를 마친 사실이 증명되는 재산을 매각 하여 그 매각금액에서 국세를 징수하는 경우 그 재산을 압 류한 날 이후에 그 가등기에 따른 본등기가 이루어지더라 도 그 국세는 그 가등기에 의해 담보된 채권보다 우선한다.","a":"O","e":"","pg":51},{"id":268,"ch":5,"n":15,"q":"「주택임대차보호법」에 따라 대항요건과 확정일자를 갖춘 임 차권에 의하여 담보된 임대차보증금반환채권 또는 주거용 건물에 설정된 전세권에 의하여 담보된 채권은 해당 임차 권 또는 전세권이 설정된 재산이 국세의 강제징수 또는 경 매 절차를 통하여 매각되어 그 매각금액에서 국세를 징수하 는 경우 그 확정일자 또는 설정일보다 법정기일이 빠른 해 당 재산에 대하여 부과된 상속세, 증여세 및 종합부동산세의 우선 징수 순서에 대신하여 변제될 수 있다.","a":"X","e":"「주택임대차보호법」에 따라 대항요건과 확정일자를 갖춘 임차권에 의하여 담보된 임대차보증금 반환채권 또는 주 거용 건물에 설정된 전세권에 의하여 담보된 채권은 해당 임차권 또는 전세권이 설정된 재산이 국세의 강제징수 또 는 경매 절차를 통하여 매각되어 그 매각금액에서 국세를 징수하는 경우 그 확정일자 또는 설정일보다 법정기일이 늦은 해당 재산에 대하여 부과된 상속세, 증여세 및 종합 부동산세의 우선 징수 순서에 대신하여 변제될 수 있다.","pg":51},{"id":269,"ch":5,"n":16,"q":"임대차관계에 있는 주택 또는 건물을 매각할 때 그 매각금 액 중에서 국세를 징수하는 경우 임대차에 관한 보증금 중 소액보증금으로서 「주택임대차보호법」 또는 「상가건물 임대 차보호법」에 따라 임차인이 우선하여 변제받을 수 있는 금 액은 국세보다 우선 변제된다.","a":"O","e":"","pg":51},{"id":270,"ch":5,"n":17,"q":"사용자의 재산을 매각하거나 추심할 때 그 매각금액 또는 추심금액 중에서 국세를 징수하는 경우에 「근로기준법」 또 는 「근로자퇴직급여 보장법」에 따라 국세에 우선하여 변제 되는 임금, 퇴직금, 재해보상금, 그 밖에 근로관계로 인한 채 권은 국세 및 강제징수비에 우선하여 변제된다.","a":"X","e":"사용자의 재산을 매각하거나 추심할 때 그 매각금액 또는 추심금액 중에서 국세를 징수하는 경우에 「근로기준법」 또는 「근로자퇴직급여 보장법」에 따라 국세에 우선하여 변제되는 임금, 퇴직금, 재해보상금, 그 밖에 근로관계로 인한 채권은 국세에 우선하여 변제된다. 그러나 강제징수 비보다는 우선 변제되지 아니한다.","pg":51},{"id":271,"ch":5,"n":18,"q":"국세 강제징수에 의하여 납세자의 재산을 압류한 경우에 다 른 국세 및 강제징수비 또는 지방세의 교부청구 (참가압류 포함)가 있으면 압류에 관계되는 국세 및 강제징수비는 교부 청구된 다른 국세 및 강제징수비 및 지방세에 우선하여 징 수하지 아니한다.","a":"X","e":"국세 강제징수에 의하여 납세자의 재산을 압류한 경우에 다른 국세 및 강제징수비 또는 지방세의 교부청구 (참가 압류 포함)가 있으면 압류에 관계되는 국세 및 강제징수 비는 교부청구된 다른 국세 및 강제징수비 및 지방세에 우신하여 징수한다.","pg":52},{"id":272,"ch":5,"n":19,"q":"지방세 체납처분에 의하여 납세자의 재산을 압류한 경우에 국세 및 체납처분비의 교부청구가 있으면 압류에 관계되는 지방세는 교부청구된 국세 및 강제징수비의 다음 순위로 징 수한다. ○","a":"X","e":"지방세 체납처분에 의하여 납세자의 재산을 압류한 경우 에 국세 및 체납처분비의 교부청구가 있으면 교부청구된 국제 및 강제징수비는 압류에 관계되는 지방세의 다음 순 위로 징수한다.","pg":52},{"id":273,"ch":5,"n":20,"q":"납세담보물을 매각하였을 때에는 담보에 관계된 국세 및 강 제징수비는 다른 국세 및 강제징수비와 지방세에 우선하여 징수한다.","a":"O","e":"","pg":52},{"id":274,"ch":6,"n":1,"q":"과세표준신고서가 관할 세무서장 외의 세무서장에게 제출된 경우에는 그 신고의 효력이 없다.","a":"X","e":"과세표준신고서가 관할 세무서장 외의 세무서장에게 제 출된 경우에도 그 신고의 효력에는 영향이 없다.","pg":53},{"id":275,"ch":6,"n":2,"q":"전자신고를 하는 경우에는 납세지관할 세무서장이 아닌 지 방국세청장이나 국세청장에게 과세표준신고서를 제출할 수 있다.","a":"O","e":"","pg":53},{"id":276,"ch":6,"n":3,"q":"국세의 과세표준과 세액의 결정 또는 경정결정은 그 처분 당시 그 국세의 납세지를 관할하는 세무서장이 한다.","a":"O","e":"","pg":53},{"id":277,"ch":6,"n":4,"q":"관할 세무서장 외의 세무서장이 한 결정 또는 경정결정처분 은 그 효력이 없으므로 세법 또는 다른 법령 등에 의하여 권 한 있는 세무서장이 결정 또는 경정결정하는 경우에도 결정 등의 처분은 효력이 없다.","a":"X","e":"관할 세무서장 외의 세무서장이 한 결정 또는 경정결정처 분은 그 효력이 없다. 다만, 세법 또는 다른 법령 등에 의 하여 권한 있는 세무서장이 결정 또는 경정결정하는 경우 에는 그러하지 아니한다.","pg":53},{"id":278,"ch":6,"n":5,"q":"과세표준신고서를 법정신고기한까지 제출한 자는 과세표준 신고서에 기재된 과세표준 및 세액이 세법에 따라 신고하여 야 할 과세표준 및 세액보다 큰 경우 과세표준수정신고서를 제출할 수 있다.","a":"X","e":"과세표준신고서를 법정신고기한까지 제출한 자는 과세표 준신고서에 기재된 과세표준 및 세액이 세법에 따라 신고 해야 할 과세표준 및 세액에 미치지 못할 때 과세표준수 정신고서를 제출할 수 있다.","pg":53},{"id":279,"ch":6,"n":6,"q":"과세표준신고서를 법정신고기한까지 제출한 자는 과세표준 신고서에 기재된 환급세액이 세법에 따라 신고하여야 할 환 급세액에 미치지 못할 때는 법에 정한 바에 따라 과세표준 수정신고서를 제출할 수 있다.","a":"X","e":"과세표준신고서를 법정신고기한까지 제출한 자는 과세표 준신고서에 기재된 환급세액이 세법에 따라 신고하여야 할 환급세액을 초과하는 때는 법에 정한 바에 따라 과세 표준수정신고서를 제출할 수 있다.","pg":53},{"id":280,"ch":6,"n":7,"q":"「소득세법」상 연말정산 또는 원천징수로 과세가 종결되어 과세표준확정신고의무가 면제된 자(근로소득만 있는 자)는 수정신고를 할 수 있는 자에 해당한다.","a":"O","e":"","pg":54},{"id":281,"ch":6,"n":8,"q":"납세자의 과소신고에 대해 관할 세무서장이 해당 세법에 따 라 과세표준과 세액을 경정하여 통지한 경우 그 경정통지한 부분에 대해서 수정신고를 할 수 있다.","a":"X","e":"납세자의 과소신고에 대해 관할 세무서장이 해당 세법에 따라 과세표준과 세액을 경정하여 통지한 경우 그 경정통 지한 부분에 대해서는 수정신고를 할 수 없다.","pg":54},{"id":282,"ch":6,"n":9,"q":"수정신고는 관할 세무서장이 각 세법에 따라 해당 국세의 과세표준과 세액을 결정 또는 경정하여 통지하기 전으로서 국세징수 소멸시효가 끝나기 전까지 할 수 있다.","a":"X","e":"수정신고는 관할 세무서장이 각 세법에 따라 해당 국세의 과세표준과 세액을 결정 또는 경정하여 통지하기 전으로 서 국세부과제척기간이 끝나기 전까지 할 수 있다.","pg":54},{"id":283,"ch":6,"n":10,"q":"법정신고기한까지 과세표준신고서를 제출한 납세의무자(소 득세법」상 연말정산 또는 원천징수로 과세가 종결되어 과세 표준확정신고의무가 면제된 자 포함)가 수정신고를 할 수 있으므로 기한후과세표준신고서를 제출한 자는 수정신고 할 수 없다.","a":"X","e":"법정신고기한까지 과세표준신고서를 제출한 납세의무자 「소득세법」상 연말정산 또는 원천징수로 과세가 종결되 어 과세표준확정신고의무가 면제된 자 포함)가 수정신고 를 할 수 있다. 또한 기한후과세표준신고서를 제출한 자 도 수정신고 할 수 있다.","pg":54},{"id":284,"ch":6,"n":11,"q":"기한후과세표준신고서를 제출한 자는 기한후과세표준신고 서에 기재된 결손금액이 세법에 따라 신고해야 할 결손금액 을 초과할 때 수정신고를 할 수 있다.","a":"O","e":"","pg":54},{"id":285,"ch":6,"n":12,"q":"모든 국세의 수정신고는 당초의 신고에 따라 확정된 과세표 준과 세액을 증액하여 확정하는 효력을 가진다.","a":"X","e":"신고납부제도를 취하는 국세의 경우 법정신고기한까지 신고한 경우에 당초 신고에 따라 확정된 과세표준과 세액 을 증액하여 확정하는 효력을 갖는다. 그러나 법정신고기 한 이후 신고한 경우에는 확정력이 없다. 따라서 모든 수 정신고가 확정력을 갖는 것은 아니다.","pg":54},{"id":286,"ch":6,"n":13,"q":"적법한 수정신고를 하였더라도 그 신고로 인하여 납세의무 확정효력이 발생하지 않는 경우도 있다.","a":"O","e":"•444기한 내 신고분에 대한 수정신고안 확정력이 인정되고, 기한 후 신고 분은 확정력이 인정되지 않는다. 또한 상속세와 증여세의 경우 적법하게 기한 내 신고하였다고 하더라 도 정부가 부과결정할 때 확정되므로 신고만으로는 납세의무가 확정 되지 않는다.","pg":55},{"id":287,"ch":6,"n":14,"q":"상속세 수정신고는 당초의 신고에 따라 확정된 과세표준 과 세액을 증액하여 확정하는 효력을 가진다.","a":"X","e":"상속세의 경우 당초 신고 시 그 신고에 의하여 납세의무 가 확정되지 않고 과세관청의 경정절차를 거쳐 확정되듯 이, 수정신고 시에도 과세관청의 경정을 거쳐 확정된다. 따라서 상속세의 수정신고는 당초의 신고에 따라 확정된 과세표준과 세액을 증액하여 확정하는 효력을 가지지 아 니한다.","pg":55},{"id":288,"ch":6,"n":15,"q":"수정신고는 당초 신고에 따라 확정된 세액에 관한 「국세기 본법」또는 세법에서 규정하는 권리·의무관계에 영향을 미 치지 않는다.","a":"O","e":"","pg":55},{"id":289,"ch":6,"n":16,"q":"과세표준신고서를 법정신고기한까지 제출한 자뿐만 아니라 기한후과세표준신고서를 제출한 자 및 「종합부동산세법」에 따른 납세의무자로서 과세기준일이 속한 연도에 종합부동 산세를 부과·고지받은 자도 과세표준 및 세액의 결정 또는 경정을 청구할 수 있다.","a":"O","e":"","pg":55},{"id":290,"ch":6,"n":17,"q":"납세자가 과세표준신고서를 법정신고기한까지 제출한 후 관 할 세무서장이 경정처분을 한 경우에는 경정청구를 할 수 없다.","a":"X","e":"납세자가 과세표준신고서를 법정신고기한까지 제출한 후 관할 세무서장이 경정처분을 한 경우에도 납세자는 경정 청구를 할 수 있다.","pg":55},{"id":291,"ch":6,"n":18,"q":"과세표준신고서를 법정신고기한까지 제출한 자는 최초 신고 및 수정신고한 국세의 과세표준 및 세액의 결정 또는 경정을 법정신고기한이 지난 후 3년 이내에 관할 세무서장에게 청구 할 수 있다.","a":"X","e":"과세표준신고서를 법정신고기한까지 제출한 자는 최초 신고 및 수정신고한 국세의 과세표준 및 세액의 결정 또 는 경정을 법정신고기한이 지난 후 5년 이내에 관할 세무 서장에게 청구할 수 있다.","pg":55},{"id":292,"ch":6,"n":19,"q":"소득세에 대한 결정 또는 경정으로 인하여 증가된 과세표준 및 세액에 대해서는 해당 처분이 있음을 안 날(처분의 통지 를 받은 때에는 그 받은 날)부터 1년 이내(법정신고기한이 지 난 후 5년 이내로 한정)에 경정을 청구할 수 있다.","a":"X","e":"소득세에 대한 결정 또는 경정으로 인하여 증가된 과세표 준 및 세액에 대해서는 해당 처분이 있음을 안 날(처분의 통지를 받은 때에는 그 받은 날)부터 3개월 이내(법정신 고기한이 지난 후 5년 이내로 한정)에 경정을 청구할 수 있다.","pg":56},{"id":293,"ch":6,"n":20,"q":"납세자가 과세표준신고서를 법정신고기한까지 제출하였으 나 해당 국세를 자진납부하지 않은 경우에는 경정청구를 할 수 없다.","a":"X","e":"납세자가 과세표준신고서를 법정신고기한까지 제출하였 으나 해당 국세를 자진납부하지 않은 경우에도 경정청구 를 할 수 있다.","pg":56},{"id":294,"ch":6,"n":21,"q":"과세표준신고서를 법정신고기한까지 제출한 자는 후발적 사 유가 발생하였을 때 그 사유가 발생한 것을 안 날부터 1년 이내에 결정 또는 경정을 청구할 수 있다.","a":"X","e":"과세표준신고서를 법정신고기한까지 제출한 자는 후발적 사유가 발생하였을 때 그 사유가 발생한 것을 안 날부터 3개월 이내에 결정 또는 경정을 청구할 수 있다.","pg":56},{"id":295,"ch":6,"n":22,"q":"과세표준신고서를 법정신고기한까지 제출한 자 또는 국세 의 과세표준 및 세액의 결정을 받은 자는 최초의 신고 · 결 정 또는 경정에서 과세표준 및 세액의 계산 근거가 된 거래 또는 행위 등이 그에 관한 심사청구, 심판청구, 「감사원법」에 따른 심사청구에 대한 결정이나 소송에 대한 판결(판결과 같 은 효력을 가지는 화해나 그 밖의 행위를 포함)에 의하여 다 른 것으로 확정되었을 경우 그 사유가 발생한 것을 안 날부 터 2개월 이내에 결정 또는 경정을 청구할 수 있다.","a":"X","e":"과세표준신고서를 법정신고기한까지 제출한 자 또는 국 세의 과세표준 및 세액의 결정을 받은 자는 최초의 신 고·결정 또는 경정에서 과세표준 및 세액의 계산 근거가 된 거래 또는 행위 등이 그에 관한 심사청구, 심판청구, 「감사원법」에 따른 심사청구에 대한 결정이나 소송에 대 한 판결(판결과 같은 효력을 가지는 화해나 그 밖의 행위 를 포함)에 의하여 다른 것으로 확정되었을 경우 그 사유 가 발생한 것을 안 날부터 3개월 이내에 결정 또는 경정 을 청구할 수 있다.","pg":56},{"id":296,"ch":6,"n":23,"q":"소득이나 그 밖의 과세물건의 귀속을 제3자에게로 변경시키 는 결정 또는 경정이 있을 때 과세표준신고서를 법정신고기 한까지 제출한 자는 후발적 사유에 의한 경정을 청구할 수 있다.","a":"O","e":"","pg":56},{"id":297,"ch":6,"n":24,"q":"국세의 과세표준 및 세액의 결정을 받은 자는 조세조약에 따른 상호합의가 최초의 신고 · . 결정 또는 경정의 내용과 다 르게 이루어졌을 때에는 사유가 발생한 날부터 3개월 이내 에 후발적 사유에 의한 경정을 청구할 수 있다.","a":"X","e":"국세의 과세표준 및 세액의 결정을 받은 자는 조세조약에 따른 상호합의가 최초의 신고 · 결정 또는 경정의 내용과 다르게 이루어졌을 때에는 사유가 발생한 것을 안날부터 3개월 이내에 후발적 사유에 의한 경정을 청구할 수 있 다.","pg":57},{"id":298,"ch":6,"n":25,"q":"최초의 신고 ·. 결정 또는 경정을 할 때 과세표준 및 세액의 계산 근거가 된 거래 또는 행위 등의 효력과 관계되는 계약 이 해제권의 행사에 의하여 해제되거나 해당 계약의 성립 후 발생한 부득이한 사유로 법정신고기한이 지난 후 해제되 거나 취소된 경우 후발적 사유에 의한 경정을 청구할 수 있 다.","a":"O","e":"","pg":57},{"id":299,"ch":6,"n":26,"q":"근로소득만 있어서 소득세 과세표준확정신고를 하지 않 은 납세자는 「국세기본법」에 따라 경정청구를 할 수 없다.","a":"X","e":"근로소득만 있어서 소득세 과세표준확정신고를 하지 않 은 납세자도 일정한 경우에는 「국세기본법」에 따라 경정 청구를 할 수 있다.","pg":57},{"id":300,"ch":6,"n":27,"q":"결정 또는 경정의 청구를 받은 세무서장은 그 청구를 받은 날로부터 3개월 이내에 과세표준 및 세액 등을 결정 · 경정 하거나 결정. 경정하여야 할 이유가 없다는 뜻을 그 청구를 한 자에게 통지해야 하며 아무런 통지를 받지 못한 경우에는 통지를 받기 전이라도 그 3개월이 되는 날부터 「국세기본법」 에 따라 이의신청, 심사청구, 심판청구 또는 「감사원법」에 따 른 심사청구를 할 수 있다.","a":"X","e":"결정 또는 경정의 청구를 받은 세무서장은 그 청구를 받 은 날로부터 2개월 이내에 과세표준 및 세액 등을 결정. 경정하거나 결정. 경정하여야 할 이유가 없다는 뜻을 그 청구를 한 자에게 통지해야 하며 아무런 통지를 받지 못 한 경우에는 통지를 받기 전이라도 그 2개월이 되는 날의 다음 날부터 국세기본법」에 따른 불복청구 또는 「감사원 법」에 따른 심사청구를 할 수 있다.","pg":57},{"id":301,"ch":6,"n":28,"q":"결정 또는 경정의 청구를 받은 세무서장은 과세표준 및 세 액의 결정 또는 경정이 곤란한 경우에는 청구를 한 자에게 관련 진행사항 및 불복청구를 할 수 있다는 사실을 지체 없 이 통지해야 한다.","a":"X","e":"결정 또는 경정의 청구를 받은 세무서장은 과세표준 및 세액의 결정 또는 경정이 곤란한 경우에는 청구를 한 자 에게 관련 진행사항 및 불복청구를 할 수 있다는 사실을 그 청구를 받은 날로부터 2개월 이내에 통지해야 한다.","pg":57},{"id":302,"ch":6,"n":29,"q":"법인세 납세의무자가 법정신고기한까지 과세표준확정신고 를 한 후 다시 적법한 경정청구를 한 경우에는 그 금액에 대 해 납세자의 경정청구만으로도 납세의무가 확정되는 효력이 있다.","a":"X","e":"법인세 납세의무자가 법정신고기한까지 과세표준확정신 고를 한 후 다시 적법한 경정청구를 한 경우에는 세무서 장이 경쟁하여 통지한 때에 확정의 효력이 발생한다.","pg":58},{"id":303,"ch":6,"n":30,"q":"기한후신고를 하더라도 해당 국세의 납세의무를 확정하는 효력은 없다.","a":"O","e":"","pg":58},{"id":304,"ch":6,"n":31,"q":"신고납부제도를 취하는 국세의 기한후신고에 대한 수정신고 는 세액이 확정되는 효력이 있다.","a":"X","e":"기한후신고에 대한 수정신고는 세액이 확정되는 효력이 없고 당초 법정신고기한까지 신고한 경우에만 당초의 신 고에 따라 확정된 과세표준과 세액을 증액하여 확정하는 효력을 가진다.","pg":58},{"id":305,"ch":6,"n":32,"q":"납세의무자가 기한후과세표준신고서를 제출하거나 기한후 과세표준신고서를 제출한 자가 과세표준수정신고서를 제출 한 경우, 관할 세무서장은 세법에 따라 신고일부터 2개월 이 내에 해당 국세의 과세표준과 세액을 결정 또는 경정하여 신고인에게 통지해야 한다.","a":"X","e":"납세의무자가 기한후과세표준신고서를 제출하거나 기한 후과세표준신고서를 제출한 자가 과세표준수정신고서를 제출한 경우, 관할 세무서장은 세법에 따라 신고일부터 3 개월 이내에 해당 국세의 과세표준과 세액을 결정 또는 경정하여 신고인에게 통지해야 한다.","pg":58},{"id":306,"ch":6,"n":33,"q":"기한후과세표준신고서를 제출한 자로서 세법에 따라 납부 하여야 할 세액이 있는 자는 기한후신고서를 제출하는 때에 그 세액을 납부하여야 한다.","a":"X","e":"기한후과세표준신고서를 제출한 자로서 세법에 따라 납 부하여야 할 세액이 있는 자는 그 세액을 납부하여야 한 다. 다만, 기한후신고서를 제출하는 때에 납부하여야 하 는 것은 아니다. 납부기한을 명시한 것이 아니라, 납부의 무를 명시하고 있음을 주의한다.","pg":58},{"id":307,"ch":6,"n":34,"q":"신용카드 등으로 국세를 납부하는 경우에는 국세납부대행기 관의 승인일을 납부일로 본다.","a":"O","e":"","pg":58},{"id":308,"ch":6,"n":35,"q":"가산세는 해당 의무가 규정된 세법의 해당 국세의 세목으로 하며, 해당 국세를 감면하는 경우에는 가산세는 그 감면대상 에 포함시킨다.","a":"X","e":"가산세는 해당 의무가 규정된 세법의 해당 국세의 세목으 로 하며, 해당 국세를 감면하는 경우에는 가산세는 그 감 면대상에 포함시키지 않는다.","pg":59},{"id":309,"ch":6,"n":36,"q":"정부는 세법에서 규정한 의무를 위반한 자에게 「국세기본 법」또는 세법에서 정하는 바에 따라 가산세를 부과할 수 있 으나 국가와 지방자치단체·지방자체단체 조합의 경우 가산 세를 적용하지 않는다.","a":"X","e":"가산세를 적용하지 않는다는 규정이 없으므로 정부는 세 법에서 규정한 의무를 위반한 자라면 국가 등에게도 「국 세기본법 또는 세법에서 정하는 바에 따라 가산세를 부 과할 수 있다.","pg":59},{"id":310,"ch":6,"n":37,"q":"가산세는 납부할 세액에서 공제하거나 환급받을 세액에서 가산한다.","a":"X","e":"가산세는 납부할 세액에 가산하거나 환급받을 세액에서 공제한다.","pg":59},{"id":311,"ch":6,"n":38,"q":"납세의무자가 국제거래에서 발생한 부정행위로 법정신고기 한까지 세법에 따른 국세의 과세표준신고를 하지 아니한 경 우에는 「국세기본법」에 따른 무신고납부세액에 100분의 40 을 곱한 금액을 가산세로 한다.","a":"X","e":"납세의무자가 국제거래에서 발생한 부정행위로 법정신고 기한까지 세법에 따른 국세의 과세표준신고를 하지 아니 한 경우에는 「국세기본법」에 따른 무신고납부세액에 100 분의 60을 곱한 금액을 가산세로 한다. 비교 납세의무자가 국내거래에서 발생한 부정행위로 법정신고기한 까지 세법에 따른 국세의 과세표준신고를 하지 아니한 경우에는 무 신고납부세액에 100분의 40을 곱한 금액을 가산세로 함","pg":59},{"id":312,"ch":6,"n":39,"q":"납세의무자가 법정신고기한까지 세법에 따른 국세의 과세표 준을 신고한 경우로서 국제거래에서 발생한 부정행위로 납 부할 세액을 과소신고한 경우에는 「국세기본법」에 따른 과 소신고납부세액 등에 100분의 40을 곱한 금액을 가산세로 한다.","a":"X","e":"납세의무자가 법정신고기한까지 세법에 따른 국세의 과 세표준을 신고한 경우로서 국제거래에서 발생한 부정행 위로 납부할 세액을 과소신고한 경우에는 「국세기본법」에 따른 과소신고납부세액 등에 100분의 60을 곱한 금액을 가산세로 한다. 비교 납세의무자가 법정신고기한까지 세법에 따른 국세의 과세표 준을 신고한 경우로서 국내거래에서 발생한 부정행위로 납부할 세액 을 과소신고한 경우에는 「국세기본법」에 따른 과소신고납부세액 등 에 100분의 40을 곱한 금액을 가산세로 함","pg":59},{"id":313,"ch":6,"n":40,"q":"납세의무자가 법정신고기한까지 「종합부동산세법」에 따라 종합부동산세의 과세표준신고를 하지 않은 경우 무신고가산 세를 부과한다.","a":"X","e":"종합부동산세는 납세자가 신고납부제도와 정부부과제도 중 선택하여 세액을 확정하므로 무신고가산세 규정을 적 용할 수 없다.","pg":60},{"id":314,"ch":6,"n":41,"q":"「교육세법」에 따라 금융·보험업자가 아닌 자가 법정신고기 한까지 교육세 과세표준신고를 한 경우로서 납부할 세액을 신고하여야 할 세액보다 적게 신고하거나 환급받을 세액을 신고해야 할 금액보다 많이 신고한 경우에는 과소신고·초 과환급신고가산세를 적용한다.","a":"X","e":"「교육세법」에 따라 금융·보험업자가 아닌 자가 법정신고 기한까지 교육세 과세표준신고를 한 경우로서 납부할 세 액을 신고하여야 할 세액보다 적게 신고하거나 환급받을 세액을 신고해야 할 금액보다 많이 신고한 경우에는 과소 신고·초과환급신고가산세를 적용하지 아니한다.","pg":60},{"id":315,"ch":6,"n":42,"q":"국세(소득세, 법인세 및 부가가치세만 해당)를 과세기간을 잘못 적용하여 신고납부한 경우에는 납부지연가산세를 적용 할 때 실제 신고납부한 날에 실제 신고납부한 금액의 범위 에서 당초 납부하였어야 할 과세기간에 대한 국세를 자진납 부한 것으로 본다.","a":"O","e":"","pg":60},{"id":316,"ch":6,"n":43,"q":"소득세를 과세기간을 잘못 적용하여 신고납부한 경우에는 납부지연가산세를 적용할 때 실제 신고납부한 날에 실제 신 고납부한 금액의 범위에서 당초 신고납부하였어야 할 과세 기간에 대한 소득세를 자진납부한 것으로 보며, 이는 부정행 위로 과소신고한 경우에도 적용된다.","a":"X","e":"소득세를 과세기간을 잘못 적용하여 신고납부한 경우에 는 납부지연가산세를 적용할 때 실제 신고납부한 날에 실 제 신고납부한 금액의 범위에서 당초 신고납부하였어야 할 과세기간에 대한 소득세를 자진납부한 것으로 본다. 다만, 해당 국세의 신고가 부정행위로 무신고한 경우 또 는 부정행위로 과소신고 · 초과환급신고한 경우에는 그러 하지 아니한다.","pg":60},{"id":317,"ch":6,"n":44,"q":"「소득세법」에 따라 소득세를 원천징수하여 납부할 의무를 지는 자에게 원천징수 등 납부지연가산세를 부과하는 경우 에는 납부하지 아니한 세액의 100분의 20에 상당하는 금액 을 가산세로 한다.","a":"X","e":"「소득세법」에 따라 소득세를 원천징수하여 납부할 의무를 지는 자에게 원천징수 등 납부지연가산세를 부과하는 경 우에는 다음의 금액을 가산세로 한다. 원천징수 등 납부지연가산세NEW = Min[① 미납분+ ② 미납일수분+ ③ 체납월수분+ 독촉비용, 한도액] ①미납분 미납세액과소납부세액 × 3% ② 미납일수분 미납. 과소납부세액 X 일수 X 2.2 10,000 ③ 체납월수분 미납. 과소납부세액 X 체납월수X 67 10.000 ④ 독촉비용 국징법에 따른 독촉에 드는 비용 한도 미납. 과소납부세액 × 50%\" *위 ①의 금액과 ② 중 법정납부기한의 다음 날부터 납부고 지일의 전날까지의 기간에 해당하는 금액을 합한 금액은 10%를 적용","pg":61},{"id":318,"ch":6,"n":45,"q":"납부지연가산세를 적용할 때 지정납부기한의 다음 날부터 납부일까지의 기간(「국세징수법」에 따라 지정납부기한과 독 촉장에서 정하는 기한을 연장한 경우에는 그 연장기간은 제 외)이 10년을 초과하는 경우에는 그 기간은 10년으로 한다.","a":"X","e":"납부지연가산세를 적용할 때 지정납부기한의 다음 날부 터 납부일까지의 기간「국세징수법」에 따라 지정납부기한 과 독촉장에서 정하는 기한을 연장한 경우에는 그 연장기 간은 제외)이 5년을 초과
