을 청구하는 것으로 한다.","a":"X","e":"사해행위취소 소송에서 국가가 승소하여 강제징수를 집 행한 사해행위 대상 재산이 분할 가능한 때에는 국세에 상당하는 사해행위의 일부의 취소와 재산의 일부의 반환 을 청구하는 것으로 한다. 비교 사해행위의 목적이 된 재산이 불가분인 때에는 사해행위의 전 부 취소와 재산의 반환을 청구하는 것으로 함. 다만, 그 재산의 처분 예정가액이 현저히 국세를 초과할 때는 그 재산의 반환 대신에 상당 액의 손해배상을 청구하여도 됨","pg":124},{"id":646,"ch":12,"n":7,"q":"사해행위의 취소에 의해 반환받은 재산에 대하여 강제징수 를 하고 국세에 충당한 후 잔여분이 있는 경우에는 그 재산 을 반환한 수익자 또는 전득자에게 반환한다.","a":"O","e":"","pg":124},{"id":647,"ch":12,"n":8,"q":"5천만원 이상의 국세를 정당한 사유 없이 체납한 자로서 관 할 세무서장이 압류·공매, 담보 제공, 보증인의 납세보증서 등으로 조세채권을 확보할 수 없고, 강제징수를 회피할 우려 가 있다고 인정되는 사람에 대하여 국세청장은 법무부장관 에게 출국금지를 요청해야 하지만 「국세징수법」에 따라 사 해행위 취소소송이 진행 중인 기간에는 그러하지 아니하다.","a":"X","e":"5천만원 이상의 국세를 정당한 사유 없이 체납한 자로서 관할 세무서장이 압류 · 공매, 담보 제공, 보증인의 납세 보증서 등으로 조세채권을 확보할 수 없고, 강제징수를 회피할 우려가 있다고 인정되는 사람 중 「국세징수법」에 따라 사해행위 취소소송 중인 사람에 대하여 국세청장은 법무부장관에게 출국금지를 요청해야 한다.","pg":124},{"id":648,"ch":12,"n":9,"q":"관할 세무서장은 재판상의 가압류 또는 가처분 재산이 강제 징수 대상인 경우에는 「국세징수법」에 따른 강제징수를 할 수 없다. ○","a":"X","e":"관할 세무서장은 재판상의 가압류 또는 가처분을 받은 재 산이 강제징수 대상인 경우에도 「국세징수법」에 따른 강 깅수를 한다.","pg":124},{"id":649,"ch":12,"n":10,"q":"체납자의 재산에 대하여 강제징수를 시작한 후 체납자가 사 망하였거나 체납자인 법인이 합병으로 소멸된 경우에도 그 재산에 대한 강제징수는 계속 진행하여야 한다.","a":"O","e":"","pg":124},{"id":650,"ch":12,"n":11,"q":"체납자가 사망한 후 체납자 명의의 재산에 대하여 한 압류 는 그 재산을 상속한 상속인에 대하여 새롭게 압류절차를 진행해야 한다.","a":"X","e":"체납자가 사망한 후 체납자 명의의 재산에 대하여 한 압 류는 그 재산을 상속한 상속인에 대하여 한 것으로 본다. 따라서 새롭게 진행할 필요가 없다.","pg":125},{"id":651,"ch":12,"n":12,"q":"관할 세무서장은 체납자가 파산선고를 받은 경우에는 체납 자의 압류를 해제하여야 한다.","a":"X","e":"관할 세무서장은 체납자가 파산선고를 받은 경우라도 이 미 압류한 재산이 있을 때에는 강제징수를 계속 진행해야 한다.","pg":125},{"id":652,"ch":12,"n":13,"q":"체납자의 압류재산에 대하여 제3자가 소유권을 주장하고 반 환을 청구한 경우에도 그 재산에 대한 강제징수는 계속 진 행하여야 한다.","a":"X","e":"체납자의 압류재산에 대하여 제3자가 소유권을 주장하고 반환을 청구한 경우에는 그 재산에 대한 강제징수를 정지 하여야 한다.","pg":125},{"id":653,"ch":12,"n":14,"q":"체납자의 압류재산에 대하여 소유권을 주장하고 반환을 청 구하려는 제3자는 그 재산의 매각 3일 전까지 증거서류를 관할 세무서장에게 제출해야 하며 관할 세무서장은 해당 소 유권 주장 및 반환 청구가 정당하다고 인정되는 경우 압류 를 해제할 수 있다.","a":"X","e":"체납자의 압류재산에 대하여 소유권을 주장하고 반환을 청구하려는 제3자는 그 재산의 매각 5일 전까지 증거서 류를 관할 세무서장에게 제출해야 하며 관할 세무서장은 해당 소유권 주장 및 반환 청구가 정당하다고 인정되는 경우 즉시 압류를 해제하여야 한다.","pg":125},{"id":654,"ch":12,"n":15,"q":"제3자가 체납자를 상대로 소유권에 관한 소송을 제기하여 승소 판결을 받고 그 사실을 증명한 경우 관할 세무서장은 압류를 해제할 수 있다.","a":"X","e":"제3자가 체납자를 상대로 소유권에 관한 소송을 제기하 여 승소 판결을 받고 그 사실을 증명한 경우 관할 세무서 장은 압류를 즉시 해제하여야 한다.","pg":125},{"id":655,"ch":12,"n":16,"q":"압류재산을 보관하는 과정에서 작성하는 문서에 관하여는 인지세를 면제한다.","a":"O","e":"","pg":125},{"id":656,"ch":12,"n":17,"q":"관할 세무서장은 체납 발생일부터 1년이 지난 국세의 합계 액이 1억원 이상인 경우에 체납자의 수입물품에 대한 강제 징수를 세관장에게 위탁할 수 있다.","a":"X","e":"관할 세무서장은 체납 발생일부터 1년이 지난 국세의 합 계액이 2억원 이상인 경우에 체납자의 수입물품에 대한 강제징수를 세관장에게 위탁할 수 있다.","pg":125},{"id":657,"ch":12,"n":18,"q":"관할 세무서장은 체납 발생일부터 1년이 지난 국세의 합계 액이 2억원 이상인 체납자에 대하여 1년 이내의 기간을 정하 여 그 기간에 체납된 국세를 납부하지 않을 경우 체납자의 수입물품에 대한 강제징수가 세관장에게 위탁될 수 있다는 사실을 알려야 한다.","a":"X","e":"관할 세무서장은 체납 발생일부터 1년이 지난 국세의 합 계액이 2억원 이상인 체납자에 대하여 1개월 이내의 기 간을 정하여 그 기간에 체납된 국세를 납부하지 않을 경 우 체납자의 수입물품에 대한 강제징수가 세관장에게 위 탁될 수 있다는 사실을 알려야 한다.","pg":126},{"id":658,"ch":12,"n":19,"q":"관할 세무서장은 압류할 재산이 관할구역 밖에 있는 경우 압류할 재산의 소재지를 관할하는 세무서장에게 강제징수를 인계할 수 있다. 다만, 압류할 재산이 채권인 경우 강제징수 를 인계할 수 없다.","a":"O","e":"압류할 재산이 채권이거나 체납자의 거주지 또는 압류할 재산의 소재지가 둘 이상의 세무서가 관할하는 구역에 걸 쳐 있는 경우에는 강제징수를 인계할 수 없다.","pg":126},{"id":659,"ch":12,"n":20,"q":"납세자에게 납부기한 전 징수의 사유가 있다 하더라도 국 세가 확정되기 전에는 납세자의 재산을 압류할 수 없다.","a":"X","e":"납세자에게 납부기한 전 징수의 사유가 있어 국세가 확정 된 후 해당 국세를 징수할 수 없다고 인정되는 경우에는 납세자의 재산을 압류한다(확정 전 보전압류). 참고 확정 전 보전압류를 할 때에는 미리 지방국세청장의 승인을 받아 국세로 확정되리라고 추정되는 금액의 한도에서 납세자의 재 산을 압류함","pg":126},{"id":660,"ch":12,"n":21,"q":"관할 세무서장은 납세자에게 국세를 포탈하려는 행위가 있 다고 인정되어 국세가 확정된 후 그 국세를 징수할 수 없다 고 인정할 때에는 국세로 확정되리라고 추정되는 금액의 한 도에서 납세자의 재산을 압류할 수 있으며, 지방국세청장의 승인을 요하지 않는다.","a":"X","e":"관할 세무서장은 납세자에게 국세를 포탈하려는 행위가 있다고 인정되어 국세가 확정된 후 그 국세를 징수할 수 없다고 인정할 때에는 국세로 확정되리라고 추정되는 금 액의 한도에서 납세자의 재산을 압류할 수 있다. 다만, 확정 전 보전압류를 할 때에는 미리 지방국세청장 의 승인을 받아야 한다.","pg":126},{"id":661,"ch":12,"n":22,"q":"양도담보권자가 고지된 납부기한까지 물적납세의무를 이행 하지 않을 경우 독촉장을 통하여 그 납부를 촉구해야 하며 독촉장에서 정한 기한까지 국세를 완납하지 않은 경우 관할 세무서장은 납세자의 재산을 압류한다.","a":"X","e":"양도담보권자가 고지된 납부기한까지 물적납세의무를 이 행하지 않은 경우 독촉 없이 바로 압류한다.","pg":126},{"id":662,"ch":12,"n":23,"q":"확정 전 보전압류의 경우 납세자가 납세담보를 제공하고 압 류 해제를 요구한 경우 관할 세무서장은 압류를 해제할 수 있다.","a":"X","e":"확정 전 보전압류의 경우 납세자가 납세담보를 제공하고 압류 해제를 요구한 경우 관할 세무서장은 즉시 압류를 해제해야 한다.","pg":127},{"id":663,"ch":12,"n":24,"q":"확정 전 보전압류의 경우 그 압류와 관계되는 국세의 납세 의무가 확정되기 전이라도 공매할 수 있다.","a":"X","e":"압류한 재산은 그 압류와 관계되는 국세의 납세의무가 확정되기 전에는 공매할 수 없다.","pg":127},{"id":664,"ch":12,"n":25,"q":"관할 세무서장은 어떠한 경우라도 국세를 징수하기 위하여 필요한 재산 외의 재산을 압류할 수 없다.","a":"X","e":"관할 세무서장은 국세를 징수하기 위하여 필요한 재산 외 의 재산을 압류할 수 없다. 다만, 불가분물 등 부득이한 경우에는 압류할 수 있다.","pg":127},{"id":665,"ch":12,"n":26,"q":"세무공무원은 체납자의 재산을 압류하는 경우 수색조서를 작성하여야 한다.","a":"X","e":"세무공무원은 체납자의 재산을 압류하는 경우 압류조서 를 작성하여야 한다.","pg":127},{"id":666,"ch":12,"n":27,"q":"세무공무원은 재산을 압류하기 위하여 필요한 경우에는 체 납자의 주거·창고·사무실·선박·항공기·자동차 또는 그 밖의 장소를 수색할 수 있으나 그 수색 대상의 폐쇄된 문. 금고 또는 기구를 직접 열 수는 없다.","a":"X","e":"세무공무원은 재산을 압류하기 위하여 필요한 경우에는 체납자의 주거·창고·사무실·선박·항공기·자동차 또는 그 밖의 장소를 수색할 수 있고, 그 수색 대상의 폐 쇄된 문 · 금고 또는 기구를 열게 하거나 직접 열 수 있다.","pg":127},{"id":667,"ch":12,"n":28,"q":"세무공무원은 체납자가 제3자의 주거 등에 체납자의 재산을 감춘 혐의가 있다고 인정되는 경우 제3자의 주거 등을 수색 할 수 있고, 폐쇄된 문 · 금고 또는 기구를 열게 하거나 직접 열 수 있으나 해당 제3자가 재산의 인도 또는 이전을 거부하 는 경우에는 그러하지 아니하다.","a":"X","e":"세무공무원은 체납자가 제3자의 주거 등에 체납자의 재 산을 감춘 혐의가 있다고 인정되는 경우 또는 해당 제3자 가 재산의 인도 또는 이전을 거부하는 경우에는 제3자의 주거 등을 수색할 수 있고, 폐쇄된 문 · 금고 또는 기구를 열게 하거나 직접 열 수 있다.","pg":127},{"id":668,"ch":12,"n":29,"q":"해가 지기 전에 시작한 수색은 해가 질 때까지만 할 수 있 다.","a":"X","e":"수색은 해가 뜰 때부터 해가 질 때까지만 할 수 있다. 다 만. 해가 지기 전에 시작한 수색은 해가 진 후에도 계속할 수 있다.","pg":127},{"id":669,"ch":12,"n":30,"q":"주로 야간에 영업을 하는 장소에 대해서는 해가 진 후에 도 수색을 시작할 수 있으나 영업 중에는 수색할 수 없다.","a":"X","e":"주로 야간에 영업을 하는 장소에 대해서는 해가 진 후에 도 영업 중에는 수색을 시작할 수 있다.","pg":128},{"id":670,"ch":12,"n":31,"q":"세무공무원은 강제징수를 하면서 압류할 재산의 소재 또는 수량을 알아내기 위하여 필요한 경우 체납자 또는 체납자와 관계가 있는 자에게 구두 또는 문서로 질문하거나 장부, 서 류 및 그 밖의 물건을 검사할 수 있다.","a":"O","e":"","pg":128},{"id":671,"ch":12,"n":32,"q":"세무공무원은 압류, 수색 또는 검사를 하는 경우 그 신분을 나타내는 증표 및 압류·수색 등 통지서를 지니고 이를 관 계자에게 보여주어야 한다.","a":"O","e":"","pg":128},{"id":672,"ch":12,"n":33,"q":"압류의 대상이 되는 재산은 체납자의 소유가 아니더라도 무 방하며, 금전적 가치를 가지고 양도성을 가져야 하고, 압류 금지 재산이 아니어야 한다.","a":"X","e":"압류의 대상이 되는 재산은 체납자의 소유이면서 금전적 가치를 가지고 양도성을 가져야 하고, 압류금지 재산이 아니어야 한다.","pg":128},{"id":673,"ch":12,"n":34,"q":"체납자 또는 그와 생계를 같이 하는 가족(사실상 혼인관계 에 있는 사람을 포함)의 생활에 없어서는 아니 될 의복, 침 구. 가구, 주방기구, 그 밖의 생활필수품은 압류하지 못한다.","a":"O","e":"","pg":128},{"id":674,"ch":12,"n":35,"q":"체납자의 생계 유지에 필요한 소액금융재산 개인별 잔액이 300만원 미만인 예금(적금, 부금, 예탁금과 우편대체 포함) 은 압류하지 못한다.","a":"X","e":"체납자의 생계 유지에 필요한 소액금융재산 개인별 잔액 이 250만원 미만인 예금(적금, 부금, 예탁금과 우편대체 포함)은 압류하지 못한다.","pg":128},{"id":675,"ch":12,"n":36,"q":"모든 보장성보험의 해약환급금 합산한 금액이 200만원인 경우에는 압류할 수 있다.","a":"X","e":"모든 보장성보험의 해약환급금 합산한 금액 중 250만원 이하는 압류하지 못한다.","pg":128},{"id":676,"ch":12,"n":37,"q":"직무 수행에 필요한 제복은 압류하지 못한다.","a":"O","e":"","pg":129},{"id":677,"ch":12,"n":38,"q":"체납자 또는 그 동거가족의 학업에 필요한 서적과 기구는 압류할 수 있다.","a":"X","e":"체납자 또는 그 동거가족의 학업에 필요한 서적과 기구는 압류할 수 없다.","pg":129},{"id":678,"ch":12,"n":39,"q":"발명 또는 저작에 관한 것으로서 공표된 것은 압류하지 못 한다.","a":"X","e":"발명 또는 저작에 관한 것으로서 공표되지 아니한 것은 압류하지 못한다.","pg":129},{"id":679,"ch":12,"n":40,"q":"법령에 따라 지급되는 사망급여금 또는 상이급여금은 압류 할 수 없다.","a":"O","e":"","pg":129},{"id":680,"ch":12,"n":41,"q":"주로 자기의 노동력으로 농업.어업을 하는 사람에게 없어 서는 아니 될 기구, 가축, 사료, 종자, 비료, 어망, 기구, 미끼, 새끼 물고기, 그 밖에 이에 준하는 물건 중 185만원 이하의 것은 압류할 수 없다.","a":"X","e":"주로 자기의 노동력으로 농업.어업을 하는 사람에게 없 어서는 아니 될 기구, 가축, 사료, 종자, 비료, 어망, 기 구. 미끼, 새끼 물고기, 그 밖에 이에 준하는 물건은 그 가액과 상관없이 압류할 수 없다.","pg":129},{"id":681,"ch":12,"n":42,"q":"기술자 등 주로 자기의 육체적 또는 정신적 노동으로 직업 또는 사업에 종사하는 사람에게 없어서는 아니 될 기구, 비 품, 그 밖에 이에 준하는 물건은 압류할 수 없다.","a":"O","e":"","pg":129},{"id":682,"ch":12,"n":43,"q":"급료, 연금, 임금, 봉급, 상여금, 세비, 퇴직연금, 그 밖에 이 와 비슷한 성질을 가진 급여채권에 대해서는 그 총액의 2분 의 1에 해당하는 금액이 250만원에 미달하는 경우 250만원 은 압류가 금지되는 금액이다.","a":"O","e":"","pg":129},{"id":683,"ch":12,"n":44,"q":"퇴직금이나 그 밖에 이와 비슷한 성질을 가진 급여채권에 대해서는 그 총액의 3분의 1에 해당하는 금액은 압류하지 못 한다.","a":"X","e":"퇴직금이나 그 밖에 이와 비슷한 성질을 가진 급여채권에 대해서는 그 총액의 2분의 1에 해당하는 금액은 압류하지 못한다.","pg":130},{"id":684,"ch":12,"n":45,"q":"급여채권의 총액은 근로소득의 금액의 합계액(비과세소득의 금액은 제외) 또는 퇴직소득의 금액의 합계액(비과세소득의 금액은 제외)에서 그 근로소득 또는 퇴직소득에 대한 소득세 및 소득세분 지방소득세를 포함한 금액으로 한다.","a":"X","e":"급여채권의 총액은 근로소득의 금액의 합계액(비과세소 득의 금액은 제외) 또는 퇴직소득의 금액의 합계액(비과 세소득의 금액은 제외)에서 그 근로소득 또는 퇴직소득에 대한 소득세 및 소득세분 지방소득세를 뺀 금액으로 한 다.","pg":130},{"id":685,"ch":12,"n":46,"q":"세무공무원이 재산을 압류한 경우 체납자는 압류한 재산에 관하여 양도 제한물권의 설정, 채권의 영수, 그 밖의 처분을 할 수 있다.","a":"X","e":"세무공무원이 재산을 압류한 경우 체납자는 압류한 재산 에 관하여 양도, 제한물권의 설정, 채권의 영수, 그 밖의 처분을 할 수 없다.","pg":130},{"id":686,"ch":12,"n":47,"q":"세무공무원이 채권 또는 그 밖의 재산권을 압류한 경우 해 당 채권의 채무자 및 그 밖의 재산권의 채무자 또는 이에 준 하는 자는 체납자에 대한 지급을 할 수 없다.","a":"O","e":"","pg":130},{"id":687,"ch":12,"n":48,"q":"압류의 효력은 압류재산으로부터 생기는 법정과실에는 영향 이 미치고, 천연과실에는 영향이 미치지 않는다.","a":"X","e":"압류의 효력은 압류재산으로부터 생기는 법정과실과 천 연과실 모두에 영향이 미친다.","pg":130},{"id":688,"ch":12,"n":49,"q":"체납자 또는 제3자가 압류재산의 사용 또는 수익을 하는 경 우 그 재산의 매각으로 인하여 권리를 이전하기 전까지 이 미 거두어들인 천연과실과 법정과실에 대해서는 압류의 효 력이 미치지 아니한다.","a":"X","e":"체납자 또는 제3자가 압류재산의 사용 또는 수익을 하는 경우 그 재산의 매각으로 인하여 권리를 이전하기 전까지 이미 거두어들인 천연과실에 대해서는 압류의 효력이 미 치지 아니한다.","pg":130},{"id":689,"ch":12,"n":50,"q":"부동산에 대한 압류의 효력은 그 압류대상을 점유한 때에 발생한다.","a":"X","e":"부동산 등에 대한 압류의 효력은 그 압류등기 또는 압류 의 등록이 완료된 때에 발생한다.","pg":130},{"id":690,"ch":12,"n":51,"q":"부동산 등에 대한 압류의 효력은 해당 압류재산의 소유권이 이전되기 전에 「국세기본법」에 따른 법정기일이 도래한 국 세의 체납액에 대해서는 미치지 아니한다.","a":"X","e":"부동산 등에 대한 압류의 효력은 해당 압류재산의 소유권 이 이전되기 전에 「국세기본법」에 따른 법정기일이 도래 한국세의 체납액에 대해서도 미친다. 참고 부동산 등에 대하여 한 번 압류등기를 하고 나면 동일한 체납 자에 대한 압류등기 이후에 발생한 체납세액에 대하여도 새로운 압 류등기를 거칠 필요없이 당연히 압류의 효력이 미침","pg":131},{"id":691,"ch":12,"n":52,"q":"관할 세무서장은 출항준비를 마친 선박 또는 항공기에 대하 여 강제징수를 위하여 필요한 기간 동안 정박 또는 정류를 하게 할 수 있다. 이 경우 그 감시와 보존에 필요한 처분을 하여야 한다.","a":"X","e":"관할 세무서장은 자동차, 선박, 항공기 또는 건설기계에 대하여 강제징수를 위하여 필요한 기간 동안 정박 또는 정류를 하게 할 수 있다. 다만, 출항준비를 마친 선박 또 는 항공기에 대해서는 정박 또는 정류를 하게 할 수 없다. 정박 또는 정류를 하게 하였을 경우 그 감시와 보존에 필 요한 처분을 하여야 한다.","pg":131},{"id":692,"ch":12,"n":53,"q":"동산의 압류는 세무공무원이 점유한 때에 그 효력이 발생하 고 유가증권의 압류는 압류의 등록이 완료된 때에 그 효력 이 발생한다.","a":"X","e":"동산 또는 유가증권의 압류는 세무공무원이 점유함으로 써 하고, 압류의 효력은 세무공무원이 점유한 때에 발생 한다.","pg":131},{"id":693,"ch":12,"n":54,"q":"관할 세무서장은 채권을 압류하려는 경우 그 뜻을 체납자와 제3채무자에게 통지하여야 하고 채권 압류의 효력은 채권압 류통지서가 체납자에게 송달된 때에 발생한다.","a":"X","e":"관할 세무서장은 채권을 압류하려는 경우 그 뜻을 제3채 무자에게 통지하여야 하고 채권을 압류한 경우 그 사실을 체납자에게 통지하여야 한다. 채권 압류의 효력은 채권압 류통지서가 제3채무자에게 송달된 때에 발생한다.","pg":131},{"id":694,"ch":12,"n":55,"q":"제3채무자는 채권압류통지서를 받은 때에 그 범위에 있어서 채권자에 대한 채무이행을 해야 한다.","a":"X","e":"제3채무자는 채권압류통지서를 받은 때에 그 범위에 있 어서 채권자에 대한 이행이 금지된다. 참고 채권압류통지서의 송달을 받은 후에 제3채무자가 체납자에 대하여 이행을 한 경우에 그 채무이행으로서 압류채권자인 국가에 대항할 수 없음","pg":131},{"id":695,"ch":12,"n":56,"q":"관할 세무서장은 체납자에게 통지를 한 경우 체납액을 한도 로 하여 체납자인 채권자를 대위한다.","a":"X","e":"관할 세무서장은 제3채무자에게 통지를 한 경우 체납액 을 한도로 하여 체납자인 채권자를 대위한다.","pg":131},{"id":696,"ch":12,"n":57,"q":"채권자를 대위하여 제3채무자에게 이행의 촉구를 한 관할 세무서장은 제3채무자가 채무이행의 자력이 없다고 인정 하는 경우에는 제3채무자를 상대로 소송을 제기해야 한다.","a":"X","e":"관할 세무서장은 채권 압류의 통지를 받은 제3채무자가 채무이행의 기한이 지나도 이행하지 않은 경우 체납자인 채권자를 대위하여 이행의 촉구를 해야 하며 제3채무자 가 촉구한 기한까지 채무를 이행하지 않는 경우 관할 세 무서장은 체납자인 채권자를 대위하여 제3채무자를 상대 로 소송을 제기해야 한다. 단, 채무이행의 자력이 없다고 인정하는 경우에는 소송을 제기하지 않고 채권의 압류를 해제할 수 있다.","pg":132},{"id":697,"ch":12,"n":58,"q":"관할 세무서장은 채권을 압류하는 경우 체납액을 한도로 하 여야 한다. 다만, 압류하려는 채권에 국세보다 우선하는 질 권이 설정되어 있어 압류에 관계된 체납액의 징수가 확실하 지 아니한 경우에는 채권을 압류할 수 없다. ○ ☑","a":"X","e":"관할 세무서장은 채권을 압류하는 경우 체납액을 한도로 하여야 한다. 다만, 압류하려는 채권에 국세보다 우선하 는 질권이 설정되어 있어 압류에 관계된 체납액 징수가 확실하지 아니한 경우 등 필요하다고 인정되는 경우 채권 전액을 압류할 수 있다.","pg":132},{"id":698,"ch":12,"n":59,"q":"관할 세무서장은 신원보증금, 계약보증금 등의 조건부채권 은 그 조건 성립 전에는 압류할 수 없다.","a":"X","e":"관할 세무서장은 신원보증금, 계약보증금 등의 조건부채 권을 그 조건 성립 전에도 압류할 수 있다. 참고 압류한 채권이 성립되지 않는 것이 확정된 때에는 그 압류를 지체 없이 해제해야 함","pg":132},{"id":699,"ch":12,"n":60,"q":"관할 세무서장은 가상자산을 압류하려는 경우 체납자(제3자 가 체납자의 가상자산을 보관하고 있을 때에는 그 제3자)에 게 해당 가상자산의 이전을 문서로 요구할 수 있고, 요구받 은 체납자 또는 그 제3자는 이에 따라야 한다.","a":"O","e":"","pg":132},{"id":700,"ch":12,"n":61,"q":"관할 세무서장은 체납자가 국가 또는 지방자치단체의 재산 을 매수한 경우 소유권 이전 전에는 그 재산에 관한 체납자 의 국가 또는 지방자치단체에 대한 권리를 압류할 수 없다. ○","a":"X","e":"관할 세무서장은 체납자가 국가 또는 지방자치단체의 재 산을 매수한 경우 소유권 이전 전이라도 그 재산에 관한 체납자의 국가 또는 지방자치단체에 대한 권리를 압류한 다.","pg":132},{"id":701,"ch":12,"n":62,"q":"압류와 관계되는 체납액의 전부가 납부 또는 충당된 경우 관할 세무서장은 압류를 즉시 해제하여야 한다.","a":"X","e":"비교 압류와 관계되는 체납액의 일부가 납부 또는 충당된 경우 관 할 세무서장은 압류재산의 전부 또는 일부에 대하여 압류를 해제할 수 있다.","pg":133},{"id":702,"ch":12,"n":63,"q":"압류 후 재산가격이 변동하여 체납액 전액을 현저히 초과한 경우 관할 세무서장은 압류를 즉시 해제하여야 한다.","a":"X","e":"압류 후 재산가격이 변동하여 체납액 전액을 현저히 초과 한 경우 관할 세무서장은 압류재산의 전부 또는 일부에 대하여 압류를 해제할 수 있다.","pg":133},{"id":703,"ch":12,"n":64,"q":"국세 부과의 일부를 취소한 경우 관할 세무서장은 압류를 즉시 해제하여야 한다.","a":"X","e":"국세 부과의 일부를 취소한 경우 관할 세무서장은 압류 재산의 전부 또는 일부에 대하여 압류를 해제할 수 있다. 비교 국세 부과의 전부를 취소한 경우 관할 세무서장은 압류를 즉 시 해제해야 함","pg":133},{"id":704,"ch":12,"n":65,"q":"여러 재산을 한꺼번에 공매하는 경우로서 일부 재산의 공매 대금으로 체납액 전부를 징수한 경우 관할 세무서장은 압류 를 즉시 해제하여야 한다.","a":"O","e":"","pg":133},{"id":705,"ch":12,"n":66,"q":"체납자가 압류할 수 있는 다른 재산을 제공하여 그 재산을 압류한 경우 관할 세무서장은 압류재산의 압류를 즉시 해제 하여야 한다.","a":"X","e":"체납자가 압류할 수 있는 다른 재산을 제공하여 그 재산 을 압류한 경우 관할 세무서장은 압류재산의 전부 또는 일부에 대하여 압류를 해제할 수 있다.","pg":133},{"id":706,"ch":12,"n":67,"q":"관할 세무서장은 압류재산이 법령으로 소지 또는 매매가 금 지 및 제한된 재산인 경우 압류를 즉시 해제하여야 한다.","a":"X","e":"관할 세무서장은 압류재산이 법령으로 소지 또는 매매가 금지 및 제한된 재산인 경우 수의계약으로 매각할 수 있 다.","pg":133},{"id":707,"ch":12,"n":68,"q":"관할 세무서장은 국세, 지방세 또는 공과금의 체납으로 체납 자에 대한 강제징수 또는 체납처분이 시작된 경우 해당 관 할 세무서장, 지방자치단체의 장, 공공기관의 장, 지방공사 또는 지방공단의 장, 집행법원, 집행공무원, 강제관리인, 파 산관재인 또는 청산인에 대하여 해당 강제집행 절차의 배 당·배분 요구의 종기 7일 전까지 체납액(지정납부기한이 연장된 국세는 제외)의 교부를 청구하여야 한다.","a":"X","e":"관할 세무서장은 국세, 지방세 또는 공과금의 체납으로 체납자에 대한 강제징수 또는 체납처분이 시작된 경우 해 당 관할 세무서장, 지방자치단체의 장, 공공기관의 장, 지방공사 또는 지방공단의 장, 집행법원, 집행공무원, 강 제관리인, 파산관재인 또는 청산인에 대하여 해당 강제 집행 절차의 배당. 배분 요구의 종기 전까지 체납액(지정 납부기한이 연장된 국세를 포함)의 교부를 청구하여야 한 다.","pg":134},{"id":708,"ch":12,"n":69,"q":"체납자에 대하여 「민사집행법」에 따른 강제집행 및 담보권 실행 등을 위한 경매가 시작되거나 체납자가 「채무자 회생 및 파산에 관한 법률」에 따른 파산선고를 받은 경우는 납부 기한 전 징수 사유에 해당되나 교부청구의 사유에 해당되지 아니한다.","a":"X","e":"체납자에 대하여 「민사집행법」에 따른 강제집행 및 담보 권 실행 등을 위한 경매가 시작되거나 체납자가 채무자 회생 및 파산에 관한 법률」에 따른 파산선고를 받은 경우 는 「국세징수법」상 납부기한 전 징수 사유와 교부청구 사 유에 공통으로 해당하는 사유다.","pg":134},{"id":709,"ch":12,"n":70,"q":"납세관리인을 정하지 아니하고 국내에 주소 또는 거소를 두 지 아니하게 된 때에는 「국세징수법」상 납부기한 전 징수 사 유와 교부청구 사유에 공통으로 해당한다. ○","a":"X","e":"납세관리인을 정하지 아니하고 국내에 주소 또는 거소를 두지 아니하게 된 때에는 「국세징수법」상 납부기한 전 징 수 사유이나 교부청구 사유에 해당되지 아니한다.","pg":134},{"id":710,"ch":12,"n":71,"q":"체납자인 법인이 해산한 경우는 「국세징수법」상 납부기한 전 징수 사유와 교부청구 사유에 공통으로 해당하는 사유다.","a":"O","e":"","pg":134},{"id":711,"ch":12,"n":72,"q":"「국제조세조정에 관한 법률」에 따른 상호합의절차가 진행 중인 경우는 교부청구 사유에 해당된다.","a":"X","e":"「국제조세조정에 관한 법률」에 따른 상호합의절차가 진행 중인 경우는 교부청구 사유에 해당되지 아니한다.","pg":134},{"id":712,"ch":12,"n":73,"q":"납세의무가 확정된 국세만이 교부청구의 대상이 될 수 있으 며, 교부청구는 사전에 독촉장을 발부하여 압류의 요건이 충 족될 것을 필요로 하지는 않되 징수 유예기간 중에는 교부 청구를 할 수 없다.","a":"X","e":"납세의무가 확정된 국세만이 교부청구의 대상이 될 수 있 다. 교부청구는 사전에 독촉장을 발부하여 압류의 요건이 충족될 것을 필요로 하지는 않으며, 징수 유예기간 중이 라 할지라도 가능하다.","pg":134},{"id":713,"ch":12,"n":74,"q":"관할 세무서장은 납부, 충당, 국세부과의 취소나 그 밖의 사 유로 교부를 청구한 체납액의 납부의무가 소멸된 경우라고 하더라도 그 교부청구를 해제하지 아니할 수 있다.","a":"X","e":"관할 세무서장은 납부, 충당, 국세부과의 취소나 그 밖의 사유로 교부를 청구한 체납액의 납부의무가 소멸된 경우 그 교부청구를 해제하여야 한다.","pg":135},{"id":714,"ch":12,"n":75,"q":"관할 세무서장은 압류하려는 재산이 이미 다른 기관에 압류 되어 있는 경우 참가압류 통지서를 체납자에게 송달함으로 써 교부청구를 갈음하고 그 압류에 참가할 수 있다.","a":"X","e":"관할 세무서장은 압류하려는 재산이 이미 다른 기관에 압 류되어 있는 경우 참가압류 통지서를 선행압류기관에 송 달함으로써 교부청구를 갈음하고 그 압류에 참가할 수 있 다.","pg":135},{"id":715,"ch":12,"n":76,"q":"관할 세무서장은 참가압류를 한 경우 그 사실을 체납자, 제3 채무자 및 저당권자 등에게 통지하여야 한다.","a":"O","e":"","pg":135},{"id":716,"ch":12,"n":77,"q":"관할 세무서장이 참가압류를 한 후에 선행압류기관이 권리 의 변동에 등기가 필요한 재산에 대한 압류를 해제한 경우 그 참가압류는 참가압류 통지서가 선행압류기관에 송달된 때로 소급하여 압류의 효력을 갖는다.","a":"X","e":"관할 세무서장이 참가압류를 한 후에 선행압류기관이 권 리의 변동에 등기가 필요한 재산에 대한 압류를 해제한 경우 그 참가압류는 참가압류의 등기가 완료된 때로 소급 하여 압류의 효력을 갖는다.","pg":135},{"id":717,"ch":12,"n":78,"q":"참가압류를 한 관할 세무서장은 선행압류기관이 그 압류재 산을 장기간이 지나도록 매각하지 아니한 경우 이에 대한 매각을 선행압류기관에 촉구할 수 있고, 참가압류를 한 관할 세무서장은 매각의 촉구를 받은 선행압류기관이 촉구를 받 은 날부터 2개월 이내에 법정 매각관련 사실행위를 하지 아 니한 경우 해당 압류재산을 매각할 수 있다.","a":"X","e":"참가압류를 한 관할 세무서장은 선행압류기관이 그 압류 재산을 장기간이 지나도록 매각하지 아니한 경우 이에 대 한 매각을 선행압류기관에 촉구할 수 있고, 참가압류를 한 관할 세무서장은 매각의 촉구를 받은 선행압류기관이 촉구를 받은 날부터 3개월 이내에 법정 매각관련 사실행 위를 하지 아니한 경우 해당 압류재산을 매각할 수 있다.","pg":135},{"id":718,"ch":12,"n":79,"q":"관할 세무서장은 압류한 재산이 상장된 유가증권과 비상장 된 유가증권 모두 증권시장에서 직접 매각할 수 있으며, 직 접 매각하려는 경우에는 매각 전에 그 사실을 체납자 등 법 령으로 정하는 자에게 통지하여야 한다.","a":"X","e":"관할 세무서장은 압류한 재산이 증권시장에 상장된 증권 인 경우에는 증권시장에서 직접 매각할 수 있으며, 직접 매각하려는 경우에는 매각 전에 그 사실을 체납자 등 법 령으로 정하는 자에게 통지하여야 한다.","pg":135},{"id":719,"ch":12,"n":80,"q":"관할 세무서장은 압류한 재산이 가상자산사업자를 통해 거 래되는 가상자산인 경우에는 가상자산사업자를 통해 직접 매각할 수 있다.","a":"O","e":"","pg":136},{"id":720,"ch":12,"n":81,"q":"심판청구 등이 계속 중인 국세의 체납으로 압류한 재산이 변질되기 쉬운 재산으로서 속히 매각하지 아니하면 그 재산 가액이 줄어들 우려가 있는 경우라고 하더라도 그 심판청구 에 대한 결정이 확정되기 전에도 공매할 수 없다.","a":"X","e":"심판청구 등이 계속 중인 국세의 체납으로 압류한 재산이 변질되기 쉬운 재산으로서 속히 매각하지 아니하면 그 재 산가액이 줄어들 우려가 있는 경우에는 그 심판청구에 대 한 명이 확정되기 전에도 공매할 수 있다.","pg":136},{"id":721,"ch":12,"n":82,"q":"관할 세무서장은 압류재산을 수의계약으로 매각하지 아니하 면 매각대금이 체납된 세액 이하가 될 것으로 예상되는 경 우 수의계약으로 매각할 수 있다.","a":"X","e":"관할 세무서장은 압류재산을 수의계약으로 매각하지 아 니하면 매각대금이 강제징수비 금액 이하가 될 것으로 예 상되는 경우 수의계약으로 매각할 수 있다.","pg":136},{"id":722,"ch":12,"n":83,"q":"관할 세무서장은 압류한 재산의 추산가격이 1천만원 이상인 경우 수의계약으로 매각할 수 있다. ○","a":"X","e":"관할 세무서장은 압류한 재산의 추산가격이 1천만원 미만 경우 수의계약으로 매각할 수 있다.","pg":136},{"id":723,"ch":12,"n":84,"q":"관할 세무서장은 압류재산이 제1회 공매 후 3년간 5회 이상 공매하여도 매각되지 아니한 경우 수의계약으로 매각할 수 있다. ○","a":"X","e":"관할 세무서장은 압류재산이 제1회 공매 후 1년간 5회 이 상 공매하여도 매각되지 아니한 경우 수의계약으로 매각 할 수 있다.","pg":136},{"id":724,"ch":12,"n":85,"q":"공매보증은 금전, 국공채 등 법으로 정한 유가증권, 「보험 업법」에 따른 보험회사가 발행한 보증보험증권, 「은행법」에 따른 은행 등 법으로 정하는 자의 납세보증서, 토지, 건물, 공장재단·광업재단·선박· 항공기 및 건설기계로 한다.","a":"X","e":"공매보증은 금전, 국공채, 증권시장에 상장된 증권, 보 험업법」에 따른 보험회사가 발행한 보증보험증권으로 한 다. 비교 납세담보는 금전, 국공채 등 법으로 정한 유가증권, 납세보증 보험증권, 「은행법」에 따른 은행 등 법으로 정하는 자의 납세보증서, 토지, 건물, 공장재단광업재단선박 항공기 및 건설기계로 함","pg":136},{"id":725,"ch":12,"n":86,"q":"관할 세무서장은 공매를 하려는 경우 매각결정기일은 개찰 일부터 3일(토요일, 일요일, 공휴일 및 대체공휴일은 제외) 이내로 정하여야 한다.","a":"X","e":"관할 세무서장은 공매를 하려는 경우 매각결정기일은 개 찰일부터 7일(토요일, 일요일, 공휴일 및 대체공휴일은 제외) 이내로 정하여야 한다.","pg":137},{"id":726,"ch":12,"n":87,"q":"관할 세무서장은 경매의 방법으로 재산을 공매하는 경우 법 으로 정하는 바에 따라 경매인을 선정하여 이를 취급하게 할 수 있다.","a":"O","e":"","pg":137},{"id":727,"ch":12,"n":88,"q":"관할 세무서장은 공매재산에 압류와 관계되는 국세보다 우 선하는 제한물권 등이 있는 경우 제한물권 등을 매수인에게 인수하게 하거나 매수대금으로 그 제한물권 등에 의하여 담 보된 채권을 변제하는 데 충분하다고 인정된 경우라고 하더 라도 그 재산을 공매하지 못한다.","a":"X","e":"관할 세무서장은 공매재산에 압류와 관계되는 국세보다 우선하는 제한물권 등이 있는 경우 제한물권 등을 매수인 에게 인수하게 하거나 매수대금으로 그 제한물권 등에 의 하여 담보된 채권을 변제하는 데 충분하다고 인정된 경우 가 아니면 그 재산을 공매하지 못한다. 따라서 제한물권 등에 의하여 담보된 채권을 변제하는데 충분하다고 인정되는 경우라면 공매할 수 있다.","pg":137},{"id":728,"ch":12,"n":89,"q":"공유자는 공매재산이 공유물의 지분인 경우 매각결정기일 전까지 공매보증을 제공하고 최고가 매수신청가격(최고가 매수신청인이 없는 경우 공매예정가격)으로 공매재산을 우 선매수하겠다는 신청을 할 수 있다.","a":"O","e":"","pg":137},{"id":729,"ch":12,"n":90,"q":"관할 세무서장은 여러 사람의 공유자가 우선매수 신청을 하 고 관할 세무서장이 그 공유자에게 매각결정을 한 경우 공 유자 간의 특별한 협의가 없으면 공유지분의 비율이 가장 큰 공유자에게 공매재산을 매수하게 한다.","a":"X","e":"관할 세무서장은 여러 사람의 공유자가 우선매수 신청을 하고 관할세무서장이 그 공유자에게 매각결정을 한 경우 공유자간의 특별한 협의가 없으면 공유지분의 비율에 따 라 공매재산을 매수하게 한다.","pg":137},{"id":730,"ch":12,"n":91,"q":"관할 세무서장은 매각결정 후 매수인이 매수대금을 납부하 아니한 경우 매각대금이 완납될 때까지 공매를 중지하여 야 한다.","a":"X","e":"관할 세무서장은 매각결정 후 매수인이 매수대금을 납부 하지 아니한 경우 최고가 매수신청인에게 다시 매각결정 을 할 수 있다.","pg":137},{"id":731,"ch":12,"n":92,"q":"체납자는 제3자의 계산으로 압류재산을 매수할 수 있다.","a":"X","e":"체납자, 세무공무원 또는 매각 부동산을 평가한 감정평가 법인 등은 자기 또는 제3자의 명의나 계산으로 압류재산 을 매수하지 못한다.","pg":138},{"id":732,"ch":12,"n":93,"q":"공매재산의 매수신청인이 매각결정기일(매각결정기일이 연 기된 경우 연기된 매각결정기일) 전까지 공매재산의 매수인 이 되기 위하여 다른 법령에 따라 갖추어야 하는 자격을 갖 추지 못한 경우에는 공매재산을 매수하지 못한다.","a":"O","e":"","pg":138},{"id":733,"ch":12,"n":94,"q":"관할 세무서장은 입찰을 하려는 자의 공매참가, 최고가 매 수신청인의 결정 또는 매수인의 매수대금 납부를 방해한 사 실이 있는 자에 대해서는 그 사실이 있은 후 1년간 공매장소 출입을 제한하거나 입찰에 참가시키지 아니할 수 있다.","a":"X","e":"관할 세무서장은 입찰을 하려는 자의 공매참가, 최고가 매수신청인의 결정 또는 매수인의 매수대금 납부를 방해 한 사실이 있는 자에 대해서는 그 사실이 있은 후 2년간 공매장소 출입을 제한하거나 입찰에 참가시키지 아니할 수 있다.","pg":138},{"id":734,"ch":12,"n":95,"q":"최고가 매수신청가격이 둘 이상이면 즉시 추첨으로 최고가 매수신청인을 정하고 해당 매수신청인 중 출석하지 아니한 자는 추첨에 참여할 수 없다. ○","a":"X","e":"최고가 매수신청가격이 둘 이상이면 즉시 추첨으로 최고 가 매수신청인을 정하고 해당 매수신청인 중 출석하지 아 니한 자 또는 추첨을 하지 아니한 자가 있는 경우 입찰 사 무와 관계없는 공무원으로 하여금 대신하여 추첨하게 할 수 있다.","pg":138},{"id":735,"ch":12,"n":96,"q":"공매를 집행하는 공무원은 공매예정가격 이상으로 매수신청 한 자가 없는 경우 즉시 그 장소에서 재입찰을 실시할 수 있 다.","a":"O","e":"","pg":138},{"id":736,"ch":12,"n":97,"q":"매수인이 공매보증으로 금전을 제공한 경우 그 금전은 매수 대금으로 납부된 것으로 본다.","a":"O","e":"","pg":138},{"id":737,"ch":12,"n":98,"q":"공매재산에 설정된 모든 질권ㆍ 저당권 및 가등기담보권이 매각으로 소멸되는 것은 아니다.","a":"X","e":"공매재산에 설정된 모든 질권ㆍ 저당권 및 가등기담보권 은 매각으로 소멸된다.","pg":139},{"id":738,"ch":12,"n":99,"q":"매수인은 유치권자에게 그 유치권으로 담보되는 채권을 변 제할 책임이 없다.","a":"X","e":"매수인은 유치권자에게 그 유치권으로 담보되는 채권을 변제할 책임이 있다.","pg":139},{"id":739,"ch":12,"n":100,"q":"관할 세무서장은 공매, 수의계약, 매각재산의 권리이전 또는 금전의 배분에 전문지식이 필요하거나 그 밖에 직접 해당 업무를 하기에 적당하지 아니하다고 인정되는 경우 한국자 산관리공사에 해당 업무를 대행하게 할 수 있으며 이 경우 그 업무는 관할 세무서장이 한 것으로 본다.","a":"O","e":"","pg":139},{"id":740,"ch":12,"n":101,"q":"압류한 재산이 예술품 등인 경우라 하더라도 납세자의 신청 이 없으면 세무서장은 전문매각기관을 선정하여 예술품 등 의 매각을 대행하게 할 수 없다.","a":"X","e":"관할 세무서장은 압류한 재산이 예술품 등인 경우 직권이 나 납세자의 신청에 따라 예술품 등의 매각에 전문성과 경험이 있는 기관 중에서 전문매각기관을 선정하여 매각 관련 사실행위를 대행하게 할 수 있다.","pg":139},{"id":741,"ch":12,"n":102,"q":"국세청장은 국세징수법」에 따른 전문매각기관으로 선정될 수 있는 대상 기관으로 관보 및 국세청 홈페이지에 공고된 전문매각기관 선정 대상 기관이 부도, 파산, 휴업·폐업 등 에 해당하는 경우에는 해당 기관을 제외하고 다시 공고해야 한다.","a":"O","e":"","pg":139},{"id":742,"ch":12,"n":103,"q":"관할 세무서장은 전문매각기관에 매각 관련 사실행위의 대 행을 의뢰하는 경우 예술품 등의 감정가액에 상응하는 담보 를 제공할 것을 요구해야 한다.","a":"X","e":"관할 세무서장은 전문매각기관에 매각 관련 사실행위의 대행을 의뢰하는 경우 예술품 등의 감정가액에 상응하는 담보를 제공할 것을 요구할 수 있다.","pg":139},{"id":743,"ch":12,"n":104,"q":"관할 세무서장이 선정한 전문매각기관의 임직원은 매각관련 사실행위 대행의 대상인 예술품 등을 직접 매수할 수 있다.","a":"X","e":"선정된 전문매각기관 및 전문매각기관의 임직원은 직접 적으로든 간접적으로든 매각 관련 사실행위 대행의 대상 인 예술품 등을 매수하지 못한다.","pg":140},{"id":744,"ch":12,"n":105,"q":"세무서장은 납세자가 법령상의 요건을 충족하는 경우에는 강제징수요건이 이미 충족되었더라도 납세자에게 기한의 이 익을 주기 위하여 그 체납액에 대하여 강제징수에 의한 재 산의 압류나 압류재산의 매각을 일정기간(1년 또는 2년 이 내) 유예할 수 있는 바, 이를 압류·매각의 유예라고 한다.","a":"O","e":"","pg":140},{"id":745,"ch":12,"n":106,"q":"국세청장이 성실납세자로 인정하는 기준에 해당하는 때에는 그 체납액에 대하여 납세자의 신청에 의하여만 강제징수에 따른 재산의 압류 또는 압류재산의 매각을 유예할 수 있다.","a":"X","e":"국세청장이 성실납세자로 인정하는 기준에 해당하는 때 에는 그 체납액에 대하여 납세자의 신청 또는 직권으로 강제징수에 따른 재산의 압류 또는 압류재산의 매각을 유 예할 수 있다.","pg":140},{"id":746,"ch":12,"n":107,"q":"압류 또는 매각의 유예의 기간은 그 유예한 날의 다음 날부 터 9개월 이내로 한다.","a":"X","e":"압류 또는 매각의 유예의 기간은 원칙적으로 그 유예한 날의 다음 날부터 1년 이내로 한다.","pg":140},{"id":747,"ch":12,"n":108,"q":"관할 세무서장은 압류 또는 매각이 유예된 체납세액을 압류 또는 매각의 유예기간 동안 분할하여 징수할 수 없다.","a":"X","e":"관할 세무서장은 압류 또는 매각이 유예된 체납세액을 압 류 또는 매각의 유예기간 동안 분할하여 징수할 수 있다.","pg":140},{"id":748,"ch":12,"n":109,"q":"관할 세무서장은 재산의 압류를 유예하거나 압류를 해제하 는 경우 성실납세자가 체납세액 납부계획서를 제출하고 국 세체납정리위원회가 체납세액 납부계획의 타당성을 인정하 는 경우라고 하더라도 그에 상당하는 납세담보의 제공을 요 구할 수 있다.","a":"X","e":"관할 세무서장은 재산의 압류를 유예하거나 압류를 해제 하는 경우 그에 상당하는 납세담보의 제공을 요구할 수 있다. 다만, 성실납세자가 체납세액 납부계획서를 제출하고 국 세체납정리위원회가 체납세액 납부계획의 타당성을 인정 하는 경우에는 납세담보의 제공을 요구할 수 없다.","pg":140},{"id":749,"ch":12,"n":110,"q":"관할 세무서장은 유예를 하는 경우 필요하다고 인정하면 이 미 압류한 재산의 압류를 해제할 수 있다.","a":"O","e":"","pg":141},{"id":750,"ch":13,"n":1,"q":"사업자란 사업 목적이 영리이면서 사업상 독립적으로 재화 또는 용역을 공급하는 자를 말한다.","a":"X","e":"사업자란 사업 목적이 잉리이든 비영리이든 관계없이 사 업상 독립적으로 재화 또는 용역을 공급하는 자를 말한 다.","pg":142},{"id":751,"ch":13,"n":2,"q":"간이과세자란 직전 연도의 재화와 용역의 공급에 대한 가 액(부가가치세가 제외된 대가를 말한다)의 합계액이 1억4백 만원에 미달하는 개인사업자로서, 간편한 절차로 부가가치세 를 신고·납부하는 개인사업자 또는 법인사업자를 말한다.","a":"X","e":"간이과세자란 직전 연도의 재화와 용역의 공급에 대한 대 (부가가치세가 포함된 대가를 말한다)의 합계액이 1억4 백만원에 미달하는 개인사업자로서, 간편한 절차로 부가 가치세를 신고·납부하는 개인사업자를 말한다. 참고 8,000만원→ 1억4백만원으로 개정되었으니 꼭 챙겨가자","pg":142},{"id":752,"ch":13,"n":3,"q":"사업자 또는 재화를 수입하는 자로서 개인 또는 법인(비영리 법인과 국가·지방자치단체·지방자치단체조합은 제외)은 부가가치세를 납부할 의무가 있다.","a":"X","e":"사업자 또는 재화를 수입하는 자로서 개인 또는 법인(국 가와 지방자치단체·지방자치단체조합을 포함), 법인격 이 없는 사단. 재단 또는 그 밖의 단체는 부가가치세를 납부할 의무가 있다. 즉, 비영리법인, 국가와 지방자치단 체·지방자치단체조합은 부가가치세의 납세의무자다.","pg":142},{"id":753,"ch":13,"n":4,"q":"사업형태를 갖추고 계속적·반복적인 의사로 재화 또는 용 역을 공급하는 자는 사업자 등록을 마쳐야 「부가가치세법」 상사업자로 보아 부가가치세 납세의무를 부담한다.","a":"X","e":"사업형태를 갖추고 계속적·반복적인 의사로 재화 또는 용역을 공급하는 경우에는 등록 여부나 거래징수 여부와 는 관계없이 사업자로 보아 부가가치세 납세의무를 부담 한다.","pg":142},{"id":754,"ch":13,"n":5,"q":"농민이 자가농지의 확장 또는 농지개량작업에서 생긴 토사 석을 일시적으로 판매하는 경우에도 부가가치세 납세의무가 있다. 158 제4편 부가가치세법","a":"X","e":"농민이 자가농지의 확장 또는 농지개량작업에서 생긴 토 사석을 일시적으로 판매하는 경우에는 납세의무가 없다.","pg":142},{"id":755,"ch":13,"n":6,"q":"청산 중에 있는 내국법인은 「상법」의 규정에 의한 계속등기 여부에 불구하고 사실상 사업을 계속하는 경우에는 납세의 무가 있다.","a":"O","e":"","pg":143},{"id":756,"ch":13,"n":7,"q":"「새마을금고법」에 따라 설립된 새마을금고가 사업상 독립적 으로 부가가치세가 과세되는 재화를 공급하는 경우 부가가 치세 납세의무가 없다.","a":"X","e":"「새마을금고법」에 따라 설립된 새마을금고가 사업상 독립 적으로 부가가치세가 과세되는 재화를 공급하는 경우 부 가가치세 납세의무가 있다.","pg":143},{"id":757,"ch":13,"n":8,"q":"재화 또는 용역을 수입하는 자는 그 재화 또는 용역의 수입 에 대한 부가가치세를 납부할 의무가 있다.","a":"X","e":"제화를 수입하는 자는 그 재화의 수입에 대한 부가가치세 를 납부할 의무가 있다.","pg":143},{"id":758,"ch":13,"n":9,"q":"사업자가 아닌 자가 개인적으로 사용하기 위해 부가가치세 가 과세되는 재화를 수입하는 경우 부가가치세 납세의무가 없다.","a":"X","e":"사업자가 아닌 자가 개인적으로 사용하기 위해 부가가치 세가 과세되는 재화를 수입하는 경우 부가가치세 납세의 무가 있다. 재화의 수입자는 사업자 여부를 불문하고 납 세의무가 있다.","pg":143},{"id":759,"ch":13,"n":10,"q":"고용관계에 따라 근로를 제공하는 자가 재화를 수입하는 경 우에는 부가가치세를 과세할 수 없다.","a":"X","e":"재화의 수입은 사업자 여부를 불문하고 수입하는 자가 세 관장에게 관세를 신고납부하는 때에 재화의 수입에 대한 부가가치세를 함께 신고납부해야 한다.","pg":143},{"id":760,"ch":13,"n":11,"q":"농어민이 부업으로 소득세가 과세되지 아니하는 민박, 음 식물판매, 특산물 제조, 전통차 제조 및 그 밖에 이와 유사 한 활동을 하는 경우 부가가치세 납세의무가 있다.","a":"O","e":"","pg":143},{"id":761,"ch":13,"n":12,"q":"신탁재산과 관련된 재화 또는 용역을 공급하는 때에는 신 탁법」에 따른 수익자가 신탁재산별로 각각 별도의 납세의무 자로서 부가가치세를 납부할 의무가 있다.","a":"X","e":"신탁재산과 관련된 재화 또는 용역을 공급하는 때에는 「신탁법」에 따른 수탁자가 신탁재산별로 각각 별도의 납 세의무자로서 부가가치세를 납부할 의무가 있다.","pg":143},{"id":762,"ch":13,"n":13,"q":"자 탁 수 가 부 납 야 해 는 하 세 치 가 가 부 가 납 체 된 우 경 는 에 「 국 세 법 수 징 」 도 에 구 불 고 하 당 해 탁 신 산 재 에 만 서 해 대 제 강 징 수 를 할 수 다 있 . OX 16 「 법 탁 신 」 에 라 따 세 치 가 가 부 를 부 납 야 여 하 는 하 자 탁 위 가 부 가가 치세 는 또 제 강 수 징 비 를 납 체 한 우 경 서 로 그 위 탁 자 의 른 다 산 재 에 여 하 대 제 강 수 징 를 여 하 도 수 징 할 액 금 에 지 치 미 할 못 는 에 때 당 해 탁 신 산 재 의 자 익 수 는 그 탁 신 산 재 써 로 으 「 세 치 가 가 부 법 」 에 라 따 자 탁 위 의 세 치 가 가 부 는 또 제 강 수 징 비 를 부 납 할 무 의 ( 적 물 세 납 무 의 ) 가 다 있 . OX 17 자 탁 위 가 탁 신 산 재 을 적 질 실 로 으 배 지 · 제 통 는 하 우 경 서 로 탁 신 산 재 의 자 익 수 가 「 시 도 및 거 주 경 환 법 비 정 」 에 른 따 재 발 개 업 사 의 업 사 자 행 대 인 우 경 「 법 탁 신 」 에 른 따 자 탁 위 가 세 치 가 가 부 를 부 납 할 무 의 가 다 있 . OX 0 6 1 제 4 편 세 치 가 가 부 법","a":"X","e":"1 6 × 제 출 - - - - | D C K N I L 오 다 진 5 6 1 . p 법 세 1 4 9 2 . p 「 법 탁 신 」 에 라 따 세 치 가 가 부 를 부 납 야 여 하 는 하 자 탁 위 가 세 치 가 가 부 는 또 제 강 수 징 비 를 납 체 한 우 경 서 로 그 탁 위 의 자 른 다 산 재 에 여 하 대 제 강 수 징 를 여 하 도 수 징 할 액 금 에 지 치 미 할 못 는 에 때 당 해 탁 신 산 재 의 자 탁 수 는 그 신 탁 산 재 써 로 으 「 세 치 가 가 부 법 」 에 라 따 자 탁 위 의 치 가 가 부 세 는 또 제 강 수 징 비 를 부 납 할 무 의 ( 적 물 세 납 무 의 ) 가 있 다 . 201910 1 7 × 제 출 - - - 출 불 | U C K N I L 오 다 진 5 6 1 . p 법 세 3 9 2 . p 1 자 탁 위 가 탁 신 산 재 을 적 질 실 로 으 배 지 · 제 통 는 하 우 경 로 서 탁 신 산 재 의 자 탁 수 가 「 시 도 및 거 주 경 환 법 비 정 」 에 따 른 발 개 재 업 사 의 업 사 자 행 대 인 우 경 「 법 탁 신 에 른 따 위 자 탁 가 세 치 가 가 부 를 부 납 할 무 의 가 다 있 」 .","pg":144},{"id":763,"ch":13,"n":14,"q":"'과세기간'이란 과세표준 계산에 기초가 되는 기간으로 일반 과세자는 1월 1일부터 12월 31일까지를 1과세기간으로 한다.","a":"X","e":"'과세기간'이란 과세표준 계산에 기초가 되는 기간으로 일 반과세자는 6개월을 1과세기간으로 한다(1기: 1월 1일~6 월 30일, 2기 : 7월 1일~12월 31일).","pg":145},{"id":764,"ch":13,"n":15,"q":"신규로 제조업을 시작한 경우 재화의 공급을 시작하는 날부 터 그 날이 속하는 과세기간의 종료일까지를 과세기간으로 한다.","a":"X","e":"신규로 제조업을 시작한 경우 제조장별로 재화의 제조를 시작하는 날부터 그 날이 속하는 과세기간의 종료일까지 를 과세기간으로 한다. 비교 제조업 광업을 제외한 그 밖의 사업의 경우 재화의 공급을 시 작하는 날부터 그 날이 속하는 과세기간의 종료일까지를 과세기간으 로함","pg":145},{"id":765,"ch":13,"n":16,"q":"사업자가 합병으로 인한 소멸 시 합병법인의 변경등기일 또 는 설립등기일이 속하는 과세기간의 개시일부터 합병법인의 변경등기일 또는 설립등기일의 전날까지를 과세기간으로 한 다.","a":"X","e":"사업자가 합병으로 인한 소멸 시 합병법인의 변경등기일 또는 설립등기일이 속하는 과세기간의 개시일부터 합병 법인의 변경등기일 또는 설립등기일까지를 과세기간으로 한다.","pg":145},{"id":766,"ch":13,"n":17,"q":"사업 개시일 전에 사업자등록을 한 자가 정당한 사유 없이 사업자등록을 한 날부터 6개월이 되는 날까지 재화와 용역 의 공급실적이 없는 경우에는 그 6개월이 되는 날의 다음 날 을 폐업일로 본다.","a":"X","e":"사업 개시일 전에 사업자등록을 한 자가 정당한 사유 없 이 사업자등록을 한 날부터 6개월이 되는 날까지 재화와 용역의 공급실적이 없는 경우에는 그 6개월이 되는 날을 폐업일로 본다.","pg":145},{"id":767,"ch":13,"n":18,"q":"과세유형이 일반과세자에서 간이과세자로 변경되는 경우 일 반과세자 규정을 적용하는 과세기간은 그 변경 이전 1월 1일 ~ 6월 30일이다.","a":"O","e":"","pg":145},{"id":768,"ch":13,"n":19,"q":"간이과세자가 간이과세자에 관한 규정의 적용을 포기함으로 써 일반과세자로 되는 경우 일반과세자 규정을 적용하는 과 세기간은 그 변경 이후 7월 1일 ~ 12월 31일이다.","a":"X","e":"간이과세자가 간이과세자에 관한 규정의 적용을 포기함 으로써 일반과세자로 되는 경우 일반과세자 규정을 적용 하는 과세기간은 간이과세의 적용 포기의 신고일이 속하 는 달의 다음 달 1일부터 해당 과세기간의 종료일까지로 한다.","pg":145},{"id":769,"ch":13,"n":20,"q":"재화를 수입하는 자의 부가가치세 납세지는 각 사업장 소재 지다.","a":"X","e":"재화를 수입하는 자의 부가가치세 납세지는 「관세법」 따라 수입을 신고하는 세관의 소재지다. 비교 사업자의 부가가치세 납세지는 각 사업장 소재지임","pg":146},{"id":770,"ch":13,"n":21,"q":"사업장이 둘 이상인 사업자가 주사업장 총괄납부를 신청한 경우 주된 사업장에서 총괄하여 신고·납부할 수 있으나 세 금계산서 발급은 각 사업장별로 행하여야 한다.","a":"X","e":"사업장이 둘 이상인 사업자가 주사업장 총괄납부를 신청 한 경우 주된 사업장에서 총괄하여 납부할 수 있으나 신 고와 세금계산서 발급 등은 각 사업장별로 행하여야 한 다.","pg":146},{"id":771,"ch":13,"n":22,"q":"광업에 있어서 광업사무소가 광구 밖에 있는 때에는 광업사 무소의 소재지를 사업장으로 한다.","a":"X","e":"광업에 있어서 광업사무소가 광구 안에 있는 때에는 광업 사무소의 소재지를 사업장으로 한다. 비교 광업사무소가 광구 밖에 있을 때에는 광업사무소에서 가장 가 까운 광구에 대하여 작성한 광업원부의 맨 처음에 등록된 광구 소재 지에 광업사무소가 있는 것으로 봄","pg":146},{"id":772,"ch":13,"n":23,"q":"제조업에 있어서 따로 제품의 포장만을 하거나 용기에 충전 만을 하는 장소도 사업장으로 본다. ○ ☑","a":"X","e":"제조업에 있어서 따로 제품의 포장만을 하거나 용기에 충 전만을 하는 장소는 사업장이 아니다. 참고 제조업의 경우 최종 제품을 완성하는 장소를 사업장으로 함","pg":146},{"id":773,"ch":13,"n":24,"q":"건설업과 운수업에 있어서는 사업자가 법인인 경우에는 사 업에 관한 업무를 총괄하는 장소를 사업장으로 한다.","a":"X","e":"건설업과 운수업에 있어서는 사업자가 법인인 경우에는 해당 법인의 등기부상 소재지(등기부상의 지점소재지 포 합)를 사업장으로 한다.","pg":146},{"id":774,"ch":13,"n":25,"q":"부동산매매업의 경우 부동산의 등기부상의 소재지를 사업장 으로 하는 것이 원칙이다.","a":"X","e":"부동산임대업의 경우 부동산의 등기부상의 소재지를 사 업장으로 하는 것이 원칙이다. 비교 부동산매매업에 있어서 사업자가 법인인 경우 해당 법인의 등기 부상 소재지(등기부상의 지점소재지 포함)를 사업장으로 함","pg":146},{"id":775,"ch":13,"n":26,"q":"무인자동판매기를 통하여 재화·용역을 공급하는 사업은 무 인자동판매기가 설치된 장소를 사업장으로 한다.","a":"X","e":"무인자동판매기를 통하여 재화.용역을 공급하는 사업은 사업에 관한 업무를 총괄하는 장소를 사업장으로 한다.","pg":146},{"id":776,"ch":13,"n":27,"q":"「부가가치세법」에 따라 수탁자가 납세의무자가 되는 경우 수탁자(공동수탁자가 있는 경우 대표수탁자)는 해당 신탁 재산을 사업장으로 보아 사업자등록을 신청하여야 한다.","a":"O","e":"","pg":147},{"id":777,"ch":13,"n":28,"q":"국가, 지방자치단체 또는 지방자치단체조합이 공급하는 부 동산 임대용역에 있어서 사업장은 그 부동산의 등기부상 소 재지이다.","a":"X","e":"국가·지방자치단체 또는 지방자치단체조합이 공급하는 부동산 임대용역에 있어서 사업장은 그 사업에 관한 업무 를 총괄하는 장소이다.","pg":147},{"id":778,"ch":13,"n":29,"q":"사업자가 사업장을 설치하지 아니하고 사업자 등록도 하지 아니한 경우에는 국세청장이 지정한 장소를 사업장으로 한 다.","a":"X","e":"사업자가 사업장을 설치하지 아니하고 사업자 등록도 하 지 아니한 경우에는 과세표준 및 세액을 결정하거나 경정 할 당시의 사업자의 주소 또는 거소를 사업장으로 한다.","pg":147},{"id":779,"ch":13,"n":30,"q":"무인자동판매기를 통하여 재화·용역을 공급하는 사업의 경 우에는 규정에 따른 사업장 외의 장소도 사업자의 신청에 따라 추가로 사업장으로 등록할 수 있다.","a":"X","e":"무인자동판매기를 통하여 재화·용역을 공급하는 사업의 경우에는 추가로 사업장을 등록할 수 없다.","pg":147},{"id":780,"ch":13,"n":31,"q":"하치장설치신고서를 하치장 관할 세무서장에게 제출한 경우 에는 하치장도 사업장으로 볼 수 있다.","a":"X","e":"재화를 보관하고 관리할 수 있는 시설만을 갖춘 장소로서 사업자가 하치장 관할 세무서장에게 하치장설치신고서를 통해 하치장으로 신고된 장소는 사업장으로 보지 아니한 다.","pg":147},{"id":781,"ch":13,"n":32,"q":"하치장과 직매장은 사업장으로 보지 아니한다.","a":"X","e":"직매장은 사업장으로 보지만, 하치장과 임시사업장은 사 업장으로 보지 아니한다.","pg":147},{"id":782,"ch":13,"n":33,"q":"사업자가 자기의 사업과 관련하여 생산하거나 취득한 재화 를 직접 판매하기 위하여 특별히 판매시설을 갖춘 장소를 신설할 경우 사업장별 과세원칙에 따라 사업자등록을 해야 한다.","a":"O","e":"","pg":147},{"id":783,"ch":13,"n":34,"q":"장 업 사 이 둘 이 상인 자 업 사 가 주 장 업 사 괄 총 부 납 를 청 신 한 우 경 는 에 각 장 업 사 의 부 납 액 세 는 또 급 환 액 세 을 산 통 여 하 된 주 장 업 사 서 에 괄 총 여 하 고 신 · 부 납 할 수 다 있 .","a":"X","e":"장 업 사 이 둘 이 상 인 자 업 사 가 주 장 업 사 괄 총 부 납 를 한 우 경 는 에 각 장 업 사 의 부 납 액 세 는 또 급 환 액 세 을 여 하 주 된 장 업 사 서 에 괄 총 여 하 부 납 할 수 다 있 다 고 각 장 업 사 로 별 야 해 행 다 한 . . 만 , 는","pg":148},{"id":784,"ch":13,"n":35,"q":"주 장 업 사 괄 총 부 납 자 업 사 에 한 대 세 과 준 표 및 액 세 의 결 경 정 과 정 그 부 납 지 고 는 주 장 업 사 할 관 서 무 세 이 장 한 행 다 .","a":"X","e":"고 신 와 금 세 서 산 계 급 발 등 은 각 장 업 사 로 별 며 하 행 정 결 과 정 경 도 각 장 업 사 할 관 서 무 세 이 장 다 한 행 .","pg":148},{"id":785,"ch":13,"n":36,"q":"인 법 이 주 장 업 사 괄 총 부 납 의 청 신 을 는 하 우 경 된 주 업 사 은 장 점 본 는 또 주 소 무 사 를 며 하 말 , 점 지 는 또 소 무 사 분 는 된 주 장 업 사 로 으 할 수 다 없 . OX 41","a":"X","e":"인 법 이 주 장 업 사 괄 총 부 납 의 청 신 을 는 하 우 경 된 주 사 장 업 은 점 본 ( 주 소 무 사 함 포 ) 는 또 점 지 ( 소 무 사 분 함 포 ) 중 할 택 선 수 다 있 .","pg":148},{"id":786,"ch":13,"n":37,"q":"인 개 이 주 장 업 사 괄 총 부 납 의 청 신 을 는 하 우 경 된 주 업 사 주 은 장 소 무 사 는 또 소 무 사 분 를 다 한 말 . OIX 42 된 주 장 업 사 서 에 괄 총 여 하 부 납 는 하 자 업 사 가 는 려 되 는 자 그 부 납 는 려 하 세 과 간 기 시 개 후 0 2 일 에 내 이 주 장 업 사 괄 총 부 납 서 청 신 를 된 주 장 업 사 의 할 관 서 무 세 장 게 에 출 제 여 하 야 다 한 . OX 43 규 신 로 업 사 을 작 시 는 하 가 자 된 주 장 업 사 서 에 괄 총 여 하 납 부 는 려 하 우 경 는 에 된 주 장 업 사 의 자 업 사 증 록 등 을 은 받 날 터 부 0 1 일 지 까 주 장 업 사 괄 총 부 납 서 청 신 ":44,"q":"주사업장 총괄 납부를 포기한 경우에 주된 사업장 관할 세 무서장은 포기한 날이 속하는 과세기간의 다음 과세기간 개 시일까지 그 내용을 해당 사업자와 주된 사업장 외의 사업 장 관할 세무서장에게 통지하여야 한다.","a":"X","e":"주사업장 총괄납부를 적용하지 아니하게 되거나 포기한 경우에 주된 사업장 관할 세무서장은 지체 없이 그 내용 을 해당 사업자와 주된 사업장 외의 사업장 관할 세무서 장에게 통지하여야 한다.","pg":150},{"id":794,"ch":13,"n":45,"q":"사업장이 둘 이상인 사업자(사업장이 하나이나 추가로 사업 장을 개설하려는 사업자를 포함)가 사업자 단위로 사업자등 록을 신청하여 승인을 받은 경우에는 사업자 단위로 부가가 치세를 신고·납부할 수 있다.","a":"X","e":"사업장이 둘 이상인 사업자(사업장이 하나이나 추가로 사 업장을 개설하려는 사업자를 포함)가 사업자 단위로 사업 자등록을 신청(승인을 요하지 않는다)한 경우에는, 사업 자 단위로 부가가치세를 신고·납부할 수 있다.","pg":150},{"id":795,"ch":13,"n":46,"q":"사업자단위과세사업자가 법인인 경우 지점소재지를 납세지 로 할 수 있다.","a":"X","e":"사업자단위과세사업자가 법인인 경우 본점소재지를 납 세지로 한다.","pg":150},{"id":796,"ch":13,"n":47,"q":"사업장 단위트 기존에 등록한 사업자가 사업자단위과세사업 자르 변경을 하기 위해서는 사업자 단위과세사업자로 적용 받으려는 과세기간 개시일부터 20일 이내에 사업자의 본점 또는 주사무소 관할 세무서장에게 변경등록을 신청하여야 한다.","a":"X","e":"사업장 단위로 기존에 등록한 사업자가 사업자단위과세 사업자로 변경을 하기 위해서는 사업자 단위과세사업자 로 적용 받으려는 과세기간 개시 20일 전까지 사업자의 본점 또는 주사무소 관할 세무서장에게 변경등록을 신청 하여야 한다.","pg":150},{"id":797,"ch":13,"n":48,"q":"사업자단위과세 사업자가 사업자단위과세를 적법하게 포기 한 경우 그 포기한 날이 속하는 과세기간의 다음 과세기간 부터 각 사업장별로 신고·납부하거나 주사업장총괄납부를 해야 한다.","a":"O","e":"","pg":150},{"id":798,"ch":13,"n":49,"q":"사업자는 사업자등록의 신청을 사업장 관할 세무서장에게만 할 수 있으며, 관할 세무서장이 아닌 다른 세무서장에게 한 사업자등록의 신청은 효력이 없다.","a":"X","e":"사업자는 사업자등록의 신청을 관할 세무서장이 아닌 다 른 세무서장에게도 할 수 있다.","pg":150},{"id":799,"ch":13,"n":50,"q":"둘 이상의 사업장이 있는 사업자는 사업장마다 사업개시일 부터 20일 이내에 주사업장의 관할 세무서장에게 등록하여 야 한다.","a":"X","e":"사업자는 사업장마다 사업 개시일부터 20일 이내에 사업 장 관할 세무서장에게 사업자등록을 신청해야 한다. 즉, 각 사업장의 관할 세무서장에게 신청하는 것이다.","pg":151},{"id":800,"ch":13,"n":51,"q":"신규로 사업을 시작하려는 자는 사업 개시일 이전에는 사업 자 등록을 신청할 수 없다.","a":"X","e":"신규로 사업을 시작하려는 자는 사업 개시일 이전이라도 사업자등록을 신청할 수 있다.","pg":151},{"id":801,"ch":13,"n":52,"q":"「소득세법」 및 「법인세법」에 따라 등록한 면세사업자가 추가 로 과세사업을 경영하려는 경우 사업자등록 정정신고서를 제출하였다고 하더라도 「부가가치세법」에 따른 사업자등록 신청을 하여야 한다.","a":"X","e":"「소득세법」 및 「법인세법」에 따라 등록한 면세사업자가 추 가로 과세사업을 경영하려는 경우 사업자등록정정신고 서를 제출하면 사업자등록 신청을 한 것으로 본다.","pg":151},{"id":802,"ch":13,"n":53,"q":"수탁자가 사업자등록을 신청한 경우로서 수탁자가 하나 또 는 둘 이상의 위탁자와 둘 이상의 담보신탁 계약을 체결하 였을 경우에는 둘 이상의 신탁재산을 하나의 사업장으로 보 아 신탁사업에 관한 업무를 총괄하는 장소를 관할하는 세무 서장에게 사업자등록을 신청할 수 있다.","a":"O","e":"","pg":151},{"id":803,"ch":13,"n":54,"q":"사업자등록 신청을 받은 관할 세무서장은 사업자등록증을 신청일부터 3일 이내(토요일 및 일요일, 공휴일 및 대체공휴 일, 노동절은 산정에서 제외)에 신청자에게 발급해야 하며 사업장시설이나 사업현황을 확인하기 위하여 국세청장이 필 요하다고 인정하는 경우에는 발급기한을 20일 이내에서 연 장하고 조사한 사실에 따라 사업자등록증을 발급할 수 있다.","a":"X","e":"사업자등록 신청을 받은 관할 세무서장은 사업자등록증 을 신청일부터 2일 이내(토요일 및 일요일, 공휴일 및 대 체공휴일, 노동절은 산정에서 제외)에 신청자에게 발급해 야 하며 사업장시설이나 사업현황을 확인하기 위하여 국 세청장이 필요하다고 인정하는 경우에는 발급기한을 5일 이내에서 연장하고 조사한 사실에 따라 사업자등록증을 발급할 수 있다.","pg":151},{"id":804,"ch":13,"n":55,"q":"사업장 관할 세무서장은 사업자등록의 신청 내용을 보정할 필요가 있다고 인정될 때에는 20일 이내의 기간을 정하여 보정을 요구할 수 있다. 이 경우 해당 보정기간은 사업자등 록증 발급기간에 산입하지 않는다.","a":"X","e":"사업장 관할 세무서장은 사업자등록의 신청 내용을 보정 할 필요가 있다고 인정될 때에는 10일 이내의 기간을 정 하여 보정을 요구할 수 있다. 이 경우 해당 보정기간은 사 업자등록증 발급기간에 산입하지 않는다.","pg":151},{"id":805,"ch":13,"n":56,"q":"사업자등록에 따른 등록번호는 관할 세무서장이 부여한다. 이때, 사업장단위로 등록신청을 한 경우에는 각각의 사업장 에 한 개의 등록번호를 부여한다.","a":"X","e":"사업자등록에 따른 등록번호는 사업장마다 관할 세무서 장이 부여한다. 다만, 사업자단위로 등록신청을 한 경우 에는 시업자단위과세 적용 사업장에 한 개의 등록번호를 부여한다.","pg":152},{"id":806,"ch":13,"n":57,"q":"사업자가 사업자등록을 하지 않은 경우 납세지 관할 세무서 장이 조사하여 등록할 수 있다. 그러나 국외사업자 등이 간 편사업자등록을 하지 않은 경우에는 납세지 관할 세무서장 이 조사하여 등록할 수 없다.","a":"X","e":"사업자가 사업자등록을 하지 않은 경우뿐만 아니라 국외 사업자 등이 간편사업자등록을 하지 않은 경우에도 납세 지 관할 세무서장이 조사하여 등록할 수 있다.","pg":152},{"id":807,"ch":13,"n":58,"q":"사업 개시일 이전에 사업자등록의 신청을 받은 사업장 관할 세무서장은 신청자가 사업을 사실상 시작하지 않을 것이라 고 인정된다고 하더라도 등록을 거부할 수 없다. ○","a":"X","e":"사업 개시일 이전에 사업자등록의 신청을 받은 사업장 관 할 세무서장은 신청자가 사업을 사실상 시작하지 않을 것 이라고 인정될 때에는 등록을 거부할 수 있다.","pg":152},{"id":808,"ch":13,"n":59,"q":"폐업을 하는 사업자가 부가가치세 확정신고서에 폐업 연월 일 및 그 사유를 적고 사업자등록증을 첨부하여 제출하는 경우에는 폐업신고서를 제출한 것으로 한다. ○","a":"O","e":"","pg":152},{"id":809,"ch":13,"n":60,"q":"사업장을 이전하는 경우는 사업자등록의 정정신고 사유이 다.","a":"O","e":"","pg":152},{"id":810,"ch":13,"n":61,"q":"상호 변경 신고를 받은 세무서장은 신고일부터 2일 내에 변 경 내용을 확인하고 사업자등록증의 기재사항을 정정하여 재발급해야 한다. ○","a":"X","e":"상호 변경 신고를 받은 세무서장은 신고일 당일 변경 내 용을 확인하고 사업자등록증의 기재사항을 정정하여 재 발급해야 한다.","pg":152},{"id":811,"ch":13,"n":62,"q":"사업의 종류 변경 신고를 받은 세무서장은 신고일부터 2일 내에 변경 내용을 확인하고 사업자등록증의 기재사항을 정 정하여 재발급해야 한다.","a":"O","e":"","pg":152},{"id":812,"ch":13,"n":63,"q":"사업장 관할 세무서장은 등록된 사업자가 폐업한 경우 폐업 일 2일 내에 사업자 등록을 말소하고 사업자등록증을 회수 해야 한다.","a":"X","e":"사업장 관할 세무서장은 등록된 사업자가 폐업한 경우 지 체 없이 사업자 등록을 말소하고 사업자등록증을 회수해 야 한다. 참고 등록증을 회수할 수 없는 경우에는 등록말소의 사실을 공시 해야 함","pg":153},{"id":813,"ch":13,"n":64,"q":"사업장 관할 세무서장이 사업자가 사업 개시일 이전에 사업 자등록신청을 하고 사실상 사업을 시작하지 아니하는 것을 알게 된 경우 해당 세무서장은 20일 이내에 사업자등록을 말소하여야 한다.","a":"X","e":"사업장 관할 세무서장이 사업자가 사업 개시일 이전에 사 업자등록신청을 하고 사실상 사업을 시작하지 아니하는 것을 알게 된 경우 해당 세무서장은 지체 없이 사업자등 록을 말소하여야 한다.","pg":153},{"id":814,"ch":13,"n":65,"q":"개별소비세 또는 교통에너지환경세의 납세의무가 있는 사업자가 「개별소비세법」 또는 「교통·에너지·환경세법」에 따른 사업자단위과세사업자 신고를 한 경우에도 「부가가치 세법」에 따른 사업자단위과세사업자 등록 신청 또는 사업자 단위과세사업자 변경등록 신청을 해야 한다.","a":"X","e":"개별소비세 또는 교통·에너지·환경세의 납세의무가 있 는 사업자가 「개별소비세법」 또는 「교통·에너지·환경 세법」에 따른 사업자단위과세사업자 신고를 한 경우에는 「부가가치세법」에 따른 사업자단위과세사업자 등록 신청 또는 사업자단위과세사업자 변경등록 신청을 한 것으로 본다.","pg":153},{"id":815,"ch":13,"n":66,"q":"사업자등록을 신청하기 전이라도 공급시기가 속하는 과세기 간이 끝난 후 1개월 이내에 등록을 신청한 경우 등록신청일 부터 공급시기가 속하는 과세기간 기산일까지 역산한 기간 내의 매입세액은 매출세액에서 공제한다.","a":"X","e":"사업자등록을 신청하기 전이라도 공급시기가 속하는 과 세기간이 끝난 후 20일 이내에 등록을 신청한 경우 등록 신청일부터 공급시기가 속하는 과세기간 기산일까지 역 산한 기간 내의 매입세액은 매출세액에서 공제한다.","pg":153},{"id":816,"ch":13,"n":67,"q":"2027년 1월 1일 사업을 시작한 사업자가 2027년 2월 15일 사업자등록을 신청한 경우 등록신청일부터 공급시기가 속하 는 과세기간 기산일까지 역산한 기간 내의 매입세액을 공제 받을 수 없으며, 미등록가산세도 납부하여야 한다.","a":"X","e":"2027년 1월 1일 사업을 시작한 사업자가 2027년 2월 15 일 사업자등록을 신청한 경우 등록신청일부터 공급시기 가 속하는 과세기간 기산일까지 역산한 기간 내의 매입세 액을 공제받을 수 있으며, 미등록가산세도 납부하여야 한 다.","pg":153},{"id":817,"ch":14,"n":1,"q":"중계무역방식의 수출 등 특정수출로서 국내의 사업장에서 계약과 대가수령 등 거래가 이루어지는 것은 국내에서 공 급한 것이 아닐지라도 국내에서 공급이 이루어진 것으로 간 주한다.","a":"O","e":"","pg":154},{"id":818,"ch":14,"n":2,"q":"재화란 재산가치의 유무와 관계없이 유체물과 무체물을 포 함한다.","a":"X","e":"재화란 재산 가치가 있는 물건과 권리를 말하므로 경제적 교환가치가 있는 것이어야 한다.","pg":154},{"id":819,"ch":14,"n":3,"q":"창고증권·선하증권·화물상환증은 원칙적으로 과세대상 재화로 보지 않는다.","a":"X","e":"창고증권·선하증권·화물상환증은 원칙적으로 재화로 보아 부가가치세를 과세한다.","pg":154},{"id":820,"ch":14,"n":4,"q":"재화의 공급은 계약상 또는 법률상의 모든 원인에 따라 재 화를 인도하거나 양도하는 것으로 한다.","a":"O","e":"","pg":154},{"id":821,"ch":14,"n":5,"q":"재화의 인도대가로서 다른 재화를 인도받거나 용역을 제공 받는 교환계약 또는 기한부판매계약에 의하여 재화를 인도 또는 양도하는 것은 재화의 공급으로 보지 않는다.","a":"X","e":"재화의 인도대가로서 다른 재화를 인도받거나 용역을 제 공받는 교환계약 또는 기한부판매계약에 의하여 재화를 인도 또는 양도하는 것은 재화의 공급으로 보아 부가가치 세를 과세한다.","pg":154},{"id":822,"ch":14,"n":6,"q":"자기가 주요자재의 일부를 부담하고 상대방으로부터 인도받 은 재화를 가공하여 새로운 재화를 만드는 가공계약에 따라 재화를 인도하는 것은 용역의 공급에 해당한다. ○ x 170 제4편 부가가치세법","a":"X","e":"자기가 주요자재의 전부 또는 일부를 부담하고 상대방으 로부터 인도받은 재화를 가공하여 새로운 재화를 만드는 가공계약에 따라 재화를 인도하는 것은 재화의 공급에 해 당한다. 비교 자기가 주요 자재를 전혀 부담하지 아니하고, 상대방으로부터 인도받는 재화를 단순히 가공만 해주는 것은 용역의 공급에 해당함","pg":154},{"id":823,"ch":14,"n":7,"q":"국내로부터 보세구역에 있는 창고(조달청장이 개설한 것 으로서 세관장의 특허를 받은 보세창고 및 보세구역에 있 는 런던금속거래소의 지정창고로 한정)에 임치된 임치물을 국내로 다시 반입하는 것은 재화의 공급으로 보지 않는다.","a":"X","e":"국내로부터 보세구역에 있는 창고(조달청장이 개설한 것 으로서 세관장의 특허를 받은 보세창고 및 보세구역에 있 는 런던금속거래소의 지정창고로 한정)에 임치된 임치물 을 국내로 다시 반입하는 것은 재화의 공급으로 본다.","pg":155},{"id":824,"ch":14,"n":8,"q":"사업자 간에 상품. 제품. 원재료 등의 재화를 차용하여 사 용. 소비하고 동종 또는 이종의 재화를 반환하는 소비대차 의 경우에 해당 재화를 차용하거나 반환하는 것은 재화의 공급으로 보지 않는다.","a":"X","e":"사업자 간에 상품 · 제품. 원재료 등의 재화를 차용하여 사용. 소비하고 동종 또는 이종의 재화를 반환하는 소비 대차의 경우에 해당 재화를 차용하거나 반환하는 것은 각 각 재화의 공급에 해당하는 것이 원칙이다. 비교 한국석유공사가 「석유 및 석유대체연료 사업법」에 따라 비축된 석유를 수입통관하지 아니하고 보세구역에 보관하면서 국내사업장이 없는 비거주자 또는 외국법인과 무위험차익거래방식으로 소비대차하 는 것은 재화의 공급으로 보지 않음","pg":155},{"id":825,"ch":14,"n":9,"q":"「상법」에 따른 경매로 인하여 재화를 인도 또는 양도하는 것 은 재화의 공급으로 간주한다.","a":"X","e":"「상법」에 따른 경매로 인하여 재화를 인도 또는 양도하는 것은 재화의 공급으로 보지 아니한다.","pg":155},{"id":826,"ch":14,"n":10,"q":"「민사집행법」에 따른 담보권 실행을 위한 경매로 인하여 재 화를 인도 또는 양도하는 것은 재화의 공급으로 간주한다.","a":"X","e":"「민사집행법」에 따른 담보권 실행을 위한 경매로 인하여 재화를 인도 또는 양도하는 것은 재화의 공급으로 보지 아니한다.","pg":155},{"id":827,"ch":14,"n":11,"q":"수용에 따라 재화를 인도하거나 양도하는 것은 재화의 공급 으로 보지 아니한다.","a":"X","e":"수용에 따라 재화를 인도하거나 양도하는 것도 재화의 공 급으로 간주한다. 비고 「도시 및 주거환경정비법」·「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」 등에 따른 법적 수용절차에 따라 재화의 소유자 가 수용된 재화에 대한 대가를 수취하는 경우 및 재건축 사업시행자 의 매도청구에 따라 재화를 인도하거나 양도하는 경우, 누가 재화를 철거했는지 여부를 불문하고 재화의 공급으로 보지 않음","pg":155},{"id":828,"ch":14,"n":12,"q":"차입한 금액이 있는 때 현물을 통해 변제하는 경우에는 재 화의 공급으로 보지 아니한다.","a":"X","e":"차입한 금액이 있는 때 현금 대신 현물을 통해 변제하는 경우에는 제외)의 공급으로 본다. 비교 조세를 물납하는 경우에는 재화의 공급으로 보지 않음","pg":156},{"id":829,"ch":14,"n":13,"q":"사업자가 재화를 법인에 현물출자하는 경우에는 재화의 공 급으로 보지 아니한다.","a":"X","e":"사업자가 재화를 법인에 현물출자하는 경우에는 재화의 음으로 보는 것이 원칙이다. 비교 개인사업자가 법인설립을 위하여 사업장별로 그 사업에 관한 모 든 권리와 의무를 포괄적으로 현물출자하는 경우 재화의 공급으로 보지 아니하고 \"사업의 양도로 봄","pg":156},{"id":830,"ch":14,"n":14,"q":"법인 또는 공동사업자가 출자지분을 현물로 반환하는 것은 재화의 공급에 해당하지 않는다.","a":"X","e":"법인 또는 공동사업자가 출자지분을 현물로 반환하는 것 은 재화의 공급에 해당한다. 비교 현금으로 반환하는 것은 재화의 공급에 해당하지 않음","pg":156},{"id":831,"ch":14,"n":15,"q":"사업자가 건물 등을 신축하여 국가 또는 지방자치단체에 기 부채납하고 그 대가로 일정 기간 동안 건물 등에 대한 무상 사용·수익권을 얻는 경우 해당 건물 등의 공급거래는 부가 가치세가 면제된다.","a":"X","e":"사업자가 건물 등을 신축하여 국가 또는 지방자치단체에 기부채납하고 그 대가로 일정 기간 동안 건물 등에 대한 무상사용·수익권을 얻는 경우 해당 건물 등의 공급거래 는 과세대상이다. 비교 사업자가 사업을 수행하기 위한 인허가 조건에 의하여 사회기반 시설 등을 국가나 지방자치단체에 기부채납하는 경우 해당 거래는 부가가치세가 면제된다.","pg":156},{"id":832,"ch":14,"n":16,"q":"사업자가 자기의 과세사업과 관련하여 생산하거나 취득한 재화로서 매입세액이 불공제된 재화를 자기의 면세사업을 위하여 직접 사용하거나 소비하는 것은 재화의 공급으로 본 다. 172","a":"X","e":"사업자가 자기의 과세사업과 관련하여 생산하거나 취득 한 재화로서 매입세액이 공제된 재회를 자기의 면세사업 을 위하여 직접 사용하거나 소비하는 것은 재화의 공급으 로 본다.","pg":156},{"id":833,"ch":14,"n":17,"q":"사업의 양도자가 매입 시 공제를 받은 재화를 사업의 포괄 양수자가 면세사업에 사용할 때에는 이를 재화의 공급으로 보지 아니한다.","a":"X","e":"사업의 포괄양도는 재화의 공급으로 보지 않으므로 부가 가치세를 과세하지 않되 사업의 양도자가 매입 시 공제를 받은 재화를 사업의 포괄양수자가 면세사업에 사용할 때 에는 이를 공급으로 간주하여 공제받은 매입세액을 양수 자로부터 추진한다.","pg":157},{"id":834,"ch":14,"n":18,"q":"운수업을 영위하는 사업자가 운수사업용으로 법령에서 정한 소형승용자동차를 구입하여 매입세액을 공제받은 후 이를 임직원의 업무용으로 사용하는 경우(단, 당초 구입 시 매입 세액이 공제되지 아니한 재화는 제외함)는 「부가가치세법」상 재화의 간주공급에 해당하지 아니한다.","a":"X","e":"운수업을 영위하는 사업자가 운수사업용으로 법령에서 정한 소형승용자동차를 구입하여 매입세액을 공제받은 후 이를 임직원의 업무용으로 사용하는 경우(단, 당초 구 입 시 매입세액이 공제되지 아니한 재화는 제외함)는 「부 가가치세법」상 재화의 간주공급에 해당한다.","pg":157},{"id":835,"ch":14,"n":19,"q":"사업장이 둘 있는 사업자(사업자단위 과세사업자와 주사업 장 총괄납부사업자에 모두 해당하지 아니함)가 자기의 사업 과 관련하여 생산한 재화를 판매할 목적으로 자기의 다른 사업장에 반출하는 경우 부가가치세가 과세되지 아니한다.","a":"X","e":"사업장이 둘 있는 사업자(사업자단위 과세사업자와 주사 업장 총괄납부사업자에 모두 해당하지 아니함)가 자기의 사업과 관련하여 생산한 재화를 판매할 목적으로 자기의 다른 사업장에 반출하는 경우 부가가치세가 과세된다.","pg":157},{"id":836,"ch":14,"n":20,"q":"주사업장 총괄납부를 적용 받는 사업자가 자기의 사업과 관 련하여 생산한 재화를 판매할 목적으로 자기의 다른 사업장 에 반출하는 경우로서 세금계산서를 발급하고 관할 세무서 장에게 예정신고 또는 확정신고한 경우에는 재화의 공급으 로 보지 않는다.","a":"X","e":"주사업장 총괄납부를 적용 받는 사업자가 자기의 사업과 관련하여 생산한 재화를 판매할 목적으로 자기의 다른 사 업장에 반출하는 경우로서 세금계산서를 발급하고 관할 세무서장에게 예정신고 또는 확정신고한 경우에는 재화 의 공급으로 본다.","pg":157},{"id":837,"ch":14,"n":21,"q":"사업자가 자기의 사업과 관련하여 생산하거나 취득한 재화 를 자기의 과세사업과 관련한 사후 무료서비스를 제공하기 위하여 사용. 소비하는 경우 부가가치세가 과세된다.","a":"X","e":"사업자가 자기의 사업과 관련하여 생산하거나 취득한 재 화를 자기의 과세사업을 위하여 다음과 같이 사용. 소비 하는 경우에는 재화의 공급으로 보지 아니한다. 따라서 부가가치세가 과세되지 않는다. ㉠ 자기의 다른 사업장에서 원료·자재 등으로 사용. 소비하기 위하여 반출하는 경우 · 자기 사업상의 기술개발을 위하여 시험용으로 사 용. 소비하는 경우 ㉢ 수선비 등에 대체하여 사용. 소비하는 경우 ② 사후무료서비스를 제공하기 위하여 사용. 소비하 는 경우 ⑥ 불량품 교환 또는 광고선전을 위한 상품 진열 등의 목적으로 자기의 다른 사업장으로 반출하는 경우","pg":158},{"id":838,"ch":14,"n":22,"q":"사업자가 자기의 사업과 관련하여 생산 또는 취득한 재화로 서 매입세액이 공제된 재화를 광고선전을 위한 상품 진열 등의 목적으로 자기의 다른 사업장으로 반출하는 경우 재화 의 공급으로 본다.","a":"X","e":"사업자가 자기의 사업과 관련하여 생산 또는 취득한 재화 로서 매입세액이 공제된 재화를 광고선전을 위한 상품 진 열 등의 목적으로 자기의 다른 사업장으로 반출하는 경우 재화의 공급으로 보지 아니한다.","pg":158},{"id":839,"ch":14,"n":23,"q":"사업자가 자기생산 · . 취득재화를 그 사용인 또는 그 밖의 자 가 사용. 소비하는 것으로서 사업자가 그 대가를 받지 않거 나 시가보다 낮은 대가를 받는 경우 재화의 공급으로 보지 아니한다.","a":"X","e":"사업자가 자기생산 · . 취득재화를 그 사용인 또는 그 밖의 자가 사용. 소비하는 것으로서 사업자가 그 대가를 받지 않거나 시가보다 낮은 대가를 받는 경우 재화의 공급으로 본다. 비교 사업자가 실비변상적이거나 복리후생적인 목적으로 사업을 위 해 착용하는 작업복 등을 그 사용인에게 대가를 받지 않거나 시가보 다 낮은 대가를 받고 제공하는 것은 재화의 공급으로 보지 않음(시 가보다 낮은 대가를 받고 제공하는 것은 시가와 받은 대가의 차액에 한정)","pg":158},{"id":840,"ch":14,"n":24,"q":"사업자가 자기생산 · 취득재화로서 매입세액이 공제된 재화 를 사업을 위하여 대가를 받지 않고 다른 사업자에게 견본 품으로 인도하거나 양도하는 경우에는 사업상 증여로 보 아 과세한다.","a":"X","e":"사업자가 자기생산• 취득재화로서 매입세액이 공제된 재 화를 사업을 위하여 대가를 받지 않고 다른 사업자에게 견본품으로서 인도하거나 양도하는 경우에는 사업상 증 여로 보지 않기 때문에 과세하지 않는다.","pg":158},{"id":841,"ch":14,"n":25,"q":"사업자가 자기의 고객 중 추첨을 통하여 당첨된 자에게 자 기생산·취득재화를 경품으로 제공하는 경우 부가가치세가 과세된다.","a":"O","e":"","pg":159},{"id":842,"ch":14,"n":26,"q":"사업자가 자기생산·취득재화를 재난 및 안전관리 기본법」 의 적용을 받아 특별재난지역에 공급하는 물품은 재화의 공 급으로 본다.","a":"X","e":"사업자가 자기생산·취득재화를 「재난 및 안전관리 기본 법」의 적용을 받아 특별재난지역에 공급하는 물품은 간주 공급으로 보지 않는다.","pg":159},{"id":843,"ch":14,"n":27,"q":"사업자가 자기생산 · 취득재화로서 매입세액이 공제된 재화 를 자기적립 마일리지 등으로만 전부를 결제받고 자기의 고 객에게 공급하는 경우에는 사업상 증여로 보아 과세한다.","a":"X","e":"사업자가 자기생산 · 취득재화로서 매입세액이 공제된 재 화를 자기적립 마일리지 등으로만 전부를 결제받고 자기 의 고객에게 공급하는 경우에는 사업상 증여로 보지 않기 때문에 과세하지 않는다.","pg":159},{"id":844,"ch":14,"n":28,"q":"사업자가 폐업할 때 자기생산 ·. 취득재화로서 매입세액이 불 공제된 재화 중 남아 있는 재화는 자기에게 공급하는 것으 로 보아 부가가치세를 과세한다.","a":"X","e":"사업자가 폐업할 때 자기생산 · 취득재화로서 매입세액이 공제된 재화 중 남아 있는 재화는 자기에게 공급하는 것 으로 보아 부가가치세를 과세한다.","pg":159},{"id":845,"ch":14,"n":29,"q":"동일 사업장 내에서 2 이상의 사업을 겸영하는 사업자가 그 중 일부 사업을 폐지하는 경우 해당 폐지한 사업과 관련된 재고재화로서 매입세액이 공제된 재화 중 남아 있는 재화 는 자기에게 공급하는 것으로 보아 부가가치세를 과세한다.","a":"X","e":"동일 사업장 내에서 2 이상의 사업을 겸영하는 사업자가 그 중 일부 사업을 폐지하는 경우 해당 폐지한 사업과 관 련된 재고재화로서 매입세액이 공제된 재화 중 남아 있는 재화는 폐업 시 남아 있는 재화로서 과세하지 않는다.","pg":159},{"id":846,"ch":14,"n":30,"q":"사업 개시일 이전에 사업자등록을 신청한 자가 사실상 사업 을 시작하지 아니하게 되는 경우 자기생산 · 취득재화 중 남 .아있는 재화는 재화의 공급으로 보지 아니한다.","a":"X","e":"사업 개시일 이전에 사업자등록을 신청한 자가 사실상 사 업을 시작하지 아니하게 되는 경우 폐업한 것으로 보며, 폐업시 자기생산·취득재화 중 남아있는 재화는 재화의 공급으로 본다.","pg":159},{"id":847,"ch":14,"n":31,"q":"해당 거래 또는 재화의 특성상 또는 보관·관리상 위탁자 또는 본인을 알 수 없는 경우에는 수탁자 또는 대리인에게 재화를 공급하거나 수탁자 또는 대리인으로부터 재화를 공 급받은 것으로 본다.","a":"O","e":"","pg":160},{"id":848,"ch":14,"n":32,"q":"「신탁법」에 따라 위탁자 지위가 이전되는 경우에는 신탁재 산의 공급으로 보지 아니한다.","a":"X","e":"「신탁법」에 따라 위탁자 지위가 이전되는 경우에는 기존 위탁자가 새로운 위탁사에게 신탁 재산을 공급한 것으로 본다. 비교 신탁재산의 실질적인 소유권이 위탁자가 아닌 제3자에게 있는 경우 등 위탁자의 지위 이전에도 불구하고 신탁재산에 대한 실질적인 소유권의 변동이 있다고 보기 어려운 경우에는 신탁재산의 공급으로 보지 아니함 참고 위탁자의 지위 이전을 신탁재산의 공급으로 보는 경우 「신탁 법」에 따른 위탁자가 부가가치세를 납부할 의무가 있음","pg":160},{"id":849,"ch":14,"n":33,"q":"「자본시장과 금융투자업에 관한 법률」에 따른 집합투자기구 의 집합투자업자가 다른 집합투자업자에게 위탁자의 지위를 이전하는 경우 재화의 공급으로 본다.","a":"X","e":"「신탁법」에 따라 위탁자 지위가 이전되는 경우에는 신탁 재산의 공급으로 본다. 그러나 「자본시장과 금융투자업에 관한 법률」에 따른 집합투자기구의 집합투자업자가 다른 집합투자업자에게 위탁자의 지위를 이전하는 경우와 같 이 신탁재산에 대한 실질적인 소유권의 변동이 있다고 보 기 어려운 경우에는 재화의 공급으로 보지 않는다.","pg":160},{"id":850,"ch":14,"n":34,"q":"사업을 포괄적으로 양도하는 경우로서 사업을 양수받은 자 가 대가를 지급한 때에 그 대가를 받은 자로부터 부가가치 세를 징수하여 납부한 경우 재화의 공급에 해당하지 아니한 다.","a":"X","e":"사업을 포괄적으로 양도하는 경우 양수자의 단기적인 자 금 부담을 완화하기 위하여 재화의 공급으로 보지 아니한 다. 그러나 사업을 양수 받은 자가 대가를 지급한 때에 그 대가를 받은 자로부터 부가가치세를 징수하여 납부한 경 우에는 재화의 공급으로 보고 사업의 양수자에게 매입세 액공제를 인정해주어야 한다.","pg":160},{"id":851,"ch":14,"n":35,"q":"질권, 저당권 또는 양도담보의 목적으로 동산, 부동산 및 부 동산상의 권리를 제공하는 것은 재화의 공급으로 본다.","a":"X","e":"질권, 저당권 또는 양도담보의 목적으로 동산, 부동산 및 부동산상의 권리를 제공하는 것은 재화의 공급으로 보지 않는다.","pg":160},{"id":852,"ch":14,"n":36,"q":"「상속세 및 증여세법」 및 「지방세법」에 따라 사업용 자산으 로써 상속세 · 재산세를 물납하는 것은 재화의 공급으로 보 지 않는다.","a":"O","e":"","pg":161},{"id":853,"ch":14,"n":37,"q":"신탁재산의 소유권 이전으로서 위탁자로부터 수탁자에게 신탁재산을 이전하는 경우 재화의 공급으로 보지 않는다.","a":"X","e":"보고 신탁의 종료로 인하여 수탁자로부터 위탁자에게 신탁재산을 이전하는 경우에도 재화의 공급으로 보지 않음","pg":161},{"id":854,"ch":14,"n":38,"q":"신탁재산의 소유권 이전으로서 수탁자가 변경되어 새로운 수탁자에게 신탁재산을 이전하는 경우 기존 수탁자가 새로 운수탁자에게 신탁 재산을 공급한 것으로 본다.","a":"X","e":"신탁재산의 소유권 이전으로서 수탁자가 변경되어 새로 운 수탁자에게 신탁재산을 이전하는 경우 재화의 공급으 로 보지 않는다. 비교 「신탁법」에 따라 위탁자 지위가 이전되는 경우에는 기존 위탁 자가 새로운 위탁자에게 신탁 재산을 공급한 것으로 봄","pg":161},{"id":855,"ch":14,"n":39,"q":"사업자가 위탁가공을 위하여 원료를 대가 없이 국외의 수 탁가공 사업자에게 반출하여 가공한 재화를 양도하는 경우 에 그 원료를 반출하는 것은 재화의 공급으로 보지 않는다.","a":"X","e":"사업자가 위탁가공을 위하여 원자재를 국외 수탁가공업 자에게 대가 없이 반출한 경우는 재화의 공급으로 보지 아니하나 해당 재화를 가공한 이후 양도하는 경우, 그 원 료의 반출에 대하여는 재화의 공급으로 보아 영세율을 적 용한다.","pg":161},{"id":856,"ch":14,"n":40,"q":"공급받을 자의 해약으로 인하여 공급할 자가 재화 또는 용 역의 공급없이 위약금 또는 이와 유사한 손해배상금을 받는 경우 부가가치세가 과세되지 않는다.","a":"O","e":"","pg":161},{"id":857,"ch":14,"n":41,"q":"건설업의 경우 건설업자가 건설자재의 전부 또는 일부를 부 담하는 것은 재화의 공급으로 본다.","a":"X","e":"건설업의 경우 건설업자가 건설자재의 전부 또는 일부를 부담하는 것은 용역의 공급으로 본다. 비교 건설업 외의 경우, 자기가 주요자재의 전부 또는 일부를 부담 하고 인도받은 재화를 가공하여 새로운 재화를 만드는 가공계약에 따라 재화를 인도하는 것은 재화의 공급으로 봄","pg":161},{"id":858,"ch":14,"n":42,"q":"산업·상업상 또는 과학상의 지식. 경험 또는 숙련에 관 한 정보를 제공하는 것은 용역의 공급으로 보지 않는다.","a":"X","e":"산업상. 상업상 또는 과학상의 지식. 경험 또는 숙련에 관한 정보를 제공하는 것은 용역의 공급으로 본다.","pg":162},{"id":859,"ch":14,"n":43,"q":"용역의 공급은 계약상 또는 법률상의 모든 원인에 따른 것 으로서 역무를 제공하는 것과 시설물, 권리 등 재화를 사용 하게 하는 것 중 어느 하나에 해당하는 것으로 한다.","a":"O","e":"","pg":162},{"id":860,"ch":14,"n":44,"q":"사업자가 대가를 받지 않지 않더라도 타인에게 건설 용역을 공급하는 것은 용역의 공급으로 본다.","a":"X","e":"사업자가 대가를 받지 않고 타인에게 용역(법령으로 정하 는 부동산임대용역은 제외)을 공급하는 것은 용역의 공급 으로 보지 않는다.","pg":162},{"id":861,"ch":14,"n":45,"q":"사업자가 특수관계자 또는 특수관계자가 아닌 타인에게 사 업용 부동산의 임대용역을 무상으로 제공하는 것은 용역의 공급으로 본다.","a":"X","e":"사업자가 특수관계자에게 사업용 부동산의 임대용역을 무상으로 제공하는 것은 용역의 공급으로 본다.","pg":162},{"id":862,"ch":14,"n":46,"q":"사업자가 자기의 사업과 관련하여 사업장 내에서 그 사용인 에게 음식용역을 무상으로 제공하는 경우 용역의 자가공급 으로 보아 부가가치세를 과세한다.","a":"X","e":"사업자가 자기의 사업과 관련하여 사업장 내에서 그 사용 인에게 음식용역을 무상으로 제공하는 경우 부가가치세 를 과세하지 않는다.","pg":162},{"id":863,"ch":14,"n":47,"q":"고용관계에 따라 근로를 제공하는 것은 용역의 공급으로 보 지 않는다. ○","a":"O","e":"","pg":162},{"id":864,"ch":14,"n":48,"q":"선주와 하역회사 간의 계약에 따라 조기선적으로 인하여 선 주로부터 하역회사가 받는 조출료는 과세대상이 아니나, 지 연선적으로 인하여 하역회사로부터 선주가 받는 체선료는 과세대상이다. 178 제4편 부가가치세법","a":"X","e":"선주와 하역회사 간의 계약에 따라 조기선적으로 인하여 선주로부터 하역회사가 받는 조출료는 하역용역의 제공 에 따른 대가이므로 과세대상이나, 지연선적으로 인하여 하역회사로부터 선주가 받는 체선료는 용역 제공의 대가 가 아니므로 과세대상이 아니다.","pg":162},{"id":865,"ch":14,"n":49,"q":"선주와 화주간의 계약에 따라 화주가 조기선적을 하고 선주 로부터 받는 조출료는 과세대상이다.","a":"X","e":"선주와 화주 간의 계약에 따라 화주가 조기선적을 하고 선주로부터 받는 조출료는 용역제공에 대한 대가가 아니 므로 과세대상이 아니나, 선주가 지연선적으로 인하여 화 주로부터 받은 체선료는 항행용역의 제공에 따른 대가이 므로 항행용역대가(과세대상)에 포함된다.","pg":163},{"id":866,"ch":14,"n":50,"q":"광업권자가 광업권을 대여하고 그 대가로 받는 분철료는 부 가가치세 과세대상이 된다.","a":"O","e":"","pg":163},{"id":867,"ch":14,"n":51,"q":"외국 선박에 의하여 공해에서 채집되거나 잡힌 수산물로서 수입신고가 수리되기 전의 것을 국내에 반입하는 것은 재화 의 수입으로 보지 않는다.","a":"X","e":"외국 선박에 의하여 공해에서 채집되거나 잡힌 수산물로 서 수입신고가 수리되기 전의 것을 국내에 반입하는 것은 재화의 수입으로 본다.","pg":163},{"id":868,"ch":14,"n":52,"q":"수출신고가 수리된 물품으로서 선적되지 않은 물품을 보세 구역에서 반입하는 경우는 재화의 수입으로 본다.","a":"X","e":"수출신고가 수리된 물품으로서 선적되지 않은 물품을 보 세구역에서 반입하는 경우는 재화의 수입으로 보지 않고 국내공급으로 과세한다.","pg":163},{"id":869,"ch":14,"n":53,"q":"동일한 보세구역 내에서 재화를 공급하거나 용역을 제공하 는 것은 재화 또는 용역의 공급으로 보지 아니한다.","a":"X","e":"동일한 보세구역 내에서 재화를 공급하거나 용역을 제공 하는 것은 재화의 공급 또는 용역의 공급에 해당한다.","pg":163},{"id":870,"ch":14,"n":54,"q":"보세구역 외의 국내에서 보세구역으로 재화 또는 용역을 공급하는 것은 재화 또는 용역의 공급으로 보지 아니한다.","a":"X","e":"보세구역 외의 국내에서 보세구역으로 재화 또는 용역을 공급하는 것은 재화의 공급 또는 용역의 공급에 해당한 다.","pg":163},{"id":871,"ch":14,"n":55,"q":"재화의 수입에 대한 부가가치세는 세관장이 「관세법」에 따 라 징수한다.","a":"O","e":"","pg":163},{"id":872,"ch":14,"n":56,"q":"주된 재화 또는 용역의 공급에 부수되어 공급되는 것으로서 해당 대가가 주된 재화 또는 용역의 공급에 대한 대가에 통 상적으로 포함되어 공급되는 재화 또는 용역의 공급은 별도 의 공급으로 본다.","a":"X","e":"주된 재화 또는 용역의 공급에 부수되어 공급되는 것으로 서 해당 대가가 주된 재화 또는 용역의 공급에 대한 대가 에 통상적으로 포함되어 공급되는 재화 또는 용역의 공급 은「된 재화 또는 용역의 공급에 포함되는 것으로 본다.","pg":164},{"id":873,"ch":14,"n":57,"q":"거래의 관행으로 보아 통상적으로 주된 재화 또는 용역의 공급에 부수하여 공급되는 것으로 인정되는 재화 또는 용역 은 주된 거래인 재화 또는 용역의 공급에 흡수되는 것으로 보아 별도의 사업상 증여로 보지 않는다.","a":"O","e":"","pg":164},{"id":874,"ch":14,"n":58,"q":"주된 사업과 관련하여 우연히 또는 일시적으로 공급되는 재 화 또는 용역은 주된 재화 또는 용역의 공급에 포함되는 것 으로 본다.","a":"X","e":"주된 사업과 관련하여 우연히 또는 일시적으로 공급되는 재화 또는 용역은 별도의 공급으로 본다. 참고 해당 재화 또는 용역이 면세대상이라면 주된 사업이 과세사 업이든 면세사업이든 연세되지만, 해당 재화 또는 용역이 과세대상 이라면 주된 사업에 따라 판단함","pg":164},{"id":875,"ch":14,"n":59,"q":"주된 사업과 관련하여 주된 재화의 생산 과정이나 용역의 제공 과정에서 필연적으로 생기는 재화는 주된 재화의 공급 에 포함되는 것으로 본다.","a":"X","e":"주된 사업과 관련하여 주된 재화의 생산 과정이나 용역의 제공 과정에서 필연적으로 생기는 재화는 별도의 공급으 로 보되, 과세 및 면세 여부 등은 주된 사업의 과세 및 면 세 여부 등을 따른다.","pg":164},{"id":876,"ch":15,"n":1,"q":"현금판매, 외상판매의 경우 공급시기는 재화가 인도되거나 이용가능하게 되는 때이다.","a":"O","e":"","pg":165},{"id":877,"ch":15,"n":2,"q":"상품권 등을 현금 또는 외상으로 판매하고 그 후 해당 상품 권 등이 현물과 교환되는 경우 공급시기는 상품권이 판매되 는 때이다.","a":"X","e":"상품권 등을 현금 또는 외상으로 판매하고 그 후 해당 상 품권 등이 현물과 교환되는 경우 공급시기는 재화가 실제 로 인도되는 때이다.","pg":165},{"id":878,"ch":15,"n":3,"q":"재화의 공급으로 보는 가공 재화의 경우 그 공급시기는 가 공이 완료된 때이다.","a":"X","e":"재화의 공급으로 보는 가공 재화의 경우 그 공급시기는 가공된 재화를 인도하는 때이다.","pg":165},{"id":879,"ch":15,"n":4,"q":"할부판매의 경우 공급시기는 대가의 각 부분을 받기로 한 때이다.","a":"X","e":"장기할부판매의 경우 공급시기는 대가의 각 부분을 받기 로 한 때이다. 비교 할부판매의 경우 공급시기는 재화가 인도되거나 이용가능하게 되는 때이다.","pg":165},{"id":880,"ch":15,"n":5,"q":"전력이나 그 밖에 공급단위를 구획할 수 없는 재화를 계속 적으로 공급하는 경우 공급시기는 대가의 각 부분을 받기로 한 때이다.","a":"O","e":"","pg":165},{"id":881,"ch":15,"n":6,"q":"운수업을 영위하는 사업자가 법에서 정한 소형승용자동차를 구입하여 매입세액을 공제받은 후 이를 임직원의 업무용으 로 사용하는 경우 그 공급시기는 매입세액을 공제받은 때이 다.","a":"X","e":"운수업을 영위하는 사업자가 법에서 정한 소형승용자동 차를 구입하여 매입세액을 공제받은 후 이를 임직원의 업 무용으로 사용하는 경우 그 공급시기는 재화를 사용. 소 비하는 때이다.","pg":165},{"id":882,"ch":15,"n":7,"q":"사업자가 자기생산. 취득재화를 사업과 직접 관계없이 자기 의 개인적인 목적을 위하여 사용. 소비하는 경우 그 재화의 공급시기는 재화를 사용. 소비하는 때이다.","a":"O","e":"","pg":166},{"id":883,"ch":15,"n":8,"q":"사업자가 자기생산 · 취득재화를 자기의 고객이나 불특정 다 수에게 증여하는 경우 그 재화의 공급시기는 재화를 증여하 는 때이다.","a":"O","e":"","pg":166},{"id":884,"ch":15,"n":9,"q":"사업자가 폐업할 때 자기생산·취득재학 중 남아 있는 재화 의 공급시기는 해당 재화를 사용. 소비하는 때이다.","a":"X","e":"사업자가 폐업할 때 자기생산 · 취득재화 중 남아 있는 재 화의 공급시기는 폐업일이다.","pg":166},{"id":885,"ch":15,"n":10,"q":"내국물품의 국외반출 및 중계무역 방식의 수출의 경우 그 공급시기는 수출신고 수리일이다.","a":"X","e":"내국물품의 국외반출 및 중계무역 방식의 수출의 경우 그 공급시기는 수출재화의 선(기)적일이다.","pg":166},{"id":886,"ch":15,"n":11,"q":"외국인도수출 및 위탁가공무역방식의 수출의 경우 그 공급 시기는 수출재화의 선(기)적일이다.","a":"X","e":"외국인도수출 및 위탁가공무역방식의 수출의 경우 그 공 급시기는 외국에서 해당 재화가 인도되는 때이다.","pg":166},{"id":887,"ch":15,"n":12,"q":"무인판매기를 이용한 재화의 공급시기는 해당 사업자가 무 인판매기에서 현금을 꺼내는 때이다. ○","a":"O","e":"","pg":166},{"id":888,"ch":15,"n":13,"q":"사업자가 보세구역 안에서 보세구역 밖의 국내에 재화를 공 급하는 경우가 재화의 수입에 해당하는 경우 그 공급시기는 수입신고수리일이다.","a":"O","e":"","pg":166},{"id":889,"ch":15,"n":14,"q":"장기할부조건부 또는 그 밖의 조건부로 용역을 공급하거나 공급단위를 구획할 수 없는 용역(부동산의 임대)을 계속적으 로 공급하는 경우 그 공급시기는 예정신고기간 또는 과세기 간의 종료일이다.","a":"X","e":"장기할부조건부 또는 그 밖의 조건부로 용역을 공급하거 나 공급단위를 구획할 수 없는 용역(부동산의 임대)을 계 속적으로 공급하는 경우 그 공급시기는 대가의 각 부분을 받기로 한 때이다.","pg":167},{"id":890,"ch":15,"n":15,"q":"완성도지급조건부 또는 중간지급조건부로 재화를 공급하는 경우 공급시기는 재화가 인도되는 때이다.","a":"X","e":"완성도지급조건부 또는 중간지급조건부로 재화를 공급하 는 경우 공급시기는 대가의 각 부분을 받기로 한 때이다.","pg":167},{"id":891,"ch":15,"n":16,"q":"완성도기준지급조건부 또는 중간지급조건부로 용역을 공 급하는 경우로서 역무의 제공 완료 이후 받기로 한 대가의 경우 그 공급시기는 대가의 각 부분을 받기로 한 때이다.","a":"X","e":"완성도기준지급조건부 또는 중간지급조건부로 용역을 공 급하는 경우 그 공급시기는 대가의 각 부분을 받기로 한 때이다. 그러나 완성도기준지급조건부 또는 중간지급조 건부로 용역을 공급하는 경우로서 역무의 제공 완료 이후 받기로 한 대가는 역무제공이 완료되는 날을 공급시기로 본다.","pg":167},{"id":892,"ch":15,"n":17,"q":"부동산임대용역을 둘 이상의 과세기간에 걸쳐 공급하고 그 대가를 선불 또는 후불로 받는 경우로서 월수에 따라 안분 계산한 임대료의 공급시기는 대가의 각 부분을 받기로 한 때이다.","a":"X","e":"부동산임대용역을 둘 이상의 과세기간에 걸쳐 공급하고 그 대가를 선불 또는 후불로 받는 경우에 월수에 따라 안 분계산한 임대료는 예정신고기간 또는 과세기간의 종료 일을 공급시기로 본다.","pg":167},{"id":893,"ch":15,"n":18,"q":"부동산임대용역을 공급하는 경우에 전세금 또는 임대보증금 에 대한 간주임대료의 공급시기는 대가의 각 부분을 받기로 한 때이다.","a":"X","e":"부동산임대용역을 공급하는 경우에 전세금 또는 임대보 증금에 대한 간주임대료의 공급시기는 예정신고기간 또 는 과세기간의 종료일이다.","pg":167},{"id":894,"ch":15,"n":19,"q":"스포츠센터(수영장, 헬스클럽 등) 연회비, 노인복지시설 내 유료시설이용 등 그 밖에 이와 유사한 용역을 이용하게 하 는 것을 둘 이상의 과세기간에 걸쳐 계속적으로 제공하고 그 대가를 선불로 받는 경우 그 공급시기는 대가의 각 부분 을 받기로 한 때이다. OiX","a":"X","e":"스포츠센터(수영장, 헬스클럽 등) 연회비, 노인복지시설 내 유료시설이용 등 그 밖에 이와 유사한 용역을 이용하시 게 하는 것을 둘 이상의 과세기간에 걸쳐 계속적으로 제 공하고 그 대가를 선불로 받는 경우 그 공급시기는 예정 신고기간 또는 과세기간의 종료일이다.","pg":167},{"id":895,"ch":15,"n":20,"q":"역무의 제공이 완료된 때 또는 대가를 받기로 한 때를 공급 시기로 볼 수 없는 경우 예정신고기간 또는 과세기간의 종 료일을 공급시기로 본다.","a":"X","e":"역무의 제공이 완료된 때 또는 대가를 받기로 한 때를 공 급시기로 볼 수 없는 경우 의무의 제공이 완료되고 그 공 급가액이 확정되는 때를 공급시기로 한다.","pg":168},{"id":896,"ch":15,"n":21,"q":"폐업 전에 공급한 용역의 공급시기가 폐업일 이후에 도래하 는 경우 그 공급시기는 폐업일이다.","a":"O","e":"","pg":168},{"id":897,"ch":15,"n":22,"q":"거래처별로 달의 1일부터 말일까지의 공급가액을 합하여 해 당 달의 말일을 작성연월일로 하여 세금계산서를 발급하는 경우에는 재화·용역의 공급일이 속하는 달의 말일까지 세 금계산서를 발행할 수 있다.","a":"X","e":"거래처별로 달의 1일부터 말일까지의 공급가액을 합하여 해당 달의 말일을 작성연월일로 하여 세금계산서를 발급 하는 경우에는 재화·용역의 공급일이 속하는 달의 다음 달 10일까지 세금계산서를 발행할 수 있다.","pg":168},{"id":898,"ch":15,"n":23,"q":"관계 증명서류 등에 따라 실제거래사실이 확인되는 경우로 서 해당 거래일을 작성 연월일로 하여 세금계산서를 발급 하는 경우에는 재화·용역의 공급일이 속하는 달의 다음 달 10일까지 세금계산서를 발행할 수 있으며 발행하는 때를 공 급시기로 한다.","a":"X","e":"관계 증명서류 등에 따라 실제거래사실이 확인되는 경우 로서 해당 거래일을 작성 연월일로 하여 세금계산서를 발 급하는 경우에는 재화·용역의 공급일이 속하는 달의 다 음 달 10일까지 세금계산서를 발행할 수 있으나 세금계산 서의 발행일자와 무관하게 원래의 공급시기 그대로를 적 용한다.","pg":168},{"id":899,"ch":15,"n":24,"q":"사업자가 본래의 재화·용역의 공급시기가 되기 전에 재 화·용역에 대한 대가의 전부 또는 일부를 받고, 그 받은 대 가에 대하여 세금계산서 또는 영수증을 발급하면 그 세금계 산서 등을 발급하는 때를 각각 그 재화·용역의 공급시기로 본다. ○","a":"O","e":"","pg":168},{"id":900,"ch":15,"n":25,"q":"사업자가 용역의 공급시기가 되기 전에 세금계산서를 발급 하고 그 세금계산서 발급일부터 7일 이내에 대가를 받으면 그 대가를 받은 때를 용역의 공급시기로 본다.","a":"X","e":"사업자가 재화 또는 용역의 공급시기가 되기 전에 세금계 산서를 발급하고 그 세금계산서 발급일부터 7일 이내에 대가를 받으면 해당 세금계산서를 발급한 메를 재화 또는 용역의 공급시기로 본다.","pg":168},{"id":901,"ch":15,"n":26,"q":"대가를 지급하는 사업자가 거래 당사자 간의 계약서 등에 대금 청구시기와 지급시기를 따로 적고, 대금 청구시기와 지 급시기 사이의 기간이 60일인 경우로서 재화 또는 용역을 공급하는 사업자가 그 재화 또는 용역의 공급시기가 되기 전에 세금계산서를 발급하고 그 세금계산서 발급일부터 7 일이 지난 후에 대가를 받더라도 세금계산서를 발급한 때를 재화 또는 용역의 공급시기로 본다.","a":"X","e":"대가를 지급하는 사업자가 거래 당사자 간의 계약서·약 정서 등에 대금 청구시기(세금계산서 발급일을 말함)와 지급시기를 따로 적고, 대금 청구시기와 지급시기 사이의 기간이 30일 이내인 경우에는 재화 또는 용역을 공급하 는 사업자가 그 재화 또는 용역의 공급시기가 되기 전에 세금계산서를 발급하고 그 세금계산서 발급일부터 7일이 지난 후 대가를 받더라도 해당 세금계산서를 발급한 때를 재화 또는 용역의 공급시기로 본다.","pg":169},{"id":902,"ch":15,"n":27,"q":"재화·용역의 공급시기가 세금계산서 발급일이 속하는 과세 기간(공급받은 자가 조기환급을 받은 경우 포함)에 도래하는 경우에는 재화 또는 용역을 공급하는 사업자가 그 재화 또 는 용역의 공급시기가 되기 전에 세금계산서를 발급하고 그 세금계산서 발급일부터 7일이 지난 후 대가를 받더라도 해 당 세금계산서를 발급한 때를 재화 또는 용역의 공급시기로 본다.","a":"X","e":"재화·용역의 공급시기가 세금계산서 발급일이 속하는 과세기간(공급받은 자가 조기환급을 받은 경우에는 세금 계산서 발급일로부터 30일 이내)에 도래하는 경우에는 재화 또는 용역을 공급하는 사업자가 그 재화 또는 용역 의 공급시기가 되기 전에 세금계산서를 발급하고 그 세금 계산서 발급일부터 7일이 지난 후 대가를 받더라도 해당 세금계산서를 발급한 때를 재화 또는 용역의 공급시기로 본다.","pg":169},{"id":903,"ch":15,"n":28,"q":"장기할부판매로 재화를 공급하거나 장기할부조건부로 용역 을 공급하는 경우로서 공급시기가 되기 전에 세금계산서 또 는 영수증을 발급하는 경우에는 대가의 각 부분을 지급하기 로 한때를 각각 그 재화 또는 용역의 공급시기로 본다.","a":"X","e":"장기할부판매로 재화를 공급하거나 장기할부조건부로 용 역을 공급하는 경우로서 공급시기가 되기 전에 세금계산 서 또는 영수증을 발급하는 경우에는 그 발급한 때를 각 각 그 재화 또는 용역의 공급시기로 본다.","pg":169},{"id":904,"ch":15,"n":29,"q":"전력이나 그 밖에 공급단위를 구획할 수 없는 재화를 계속 적으로 공급하는 경우로서 공급시기가 되기 전에 세금계산 서 또는 영수증을 발급하는 경우에는 그 발급한 때를 각각 그 재화 또는 용역의 공급시기로 본다.","a":"O","e":"","pg":169},{"id":905,"ch":15,"n":30,"q":"재화의 수입시기는 「관세법」에 따라 국내로 반입된 때로 한 다.","a":"X","e":"재화의 수입시기는 「관세법」에 따른 수입신고가 수리된 때로 한다.","pg":169},{"id":906,"ch":15,"n":32,"q":"외 국 자 업 사 터 부 로 리 권 를 급 공 는 받 우 경 는 에 급 공 는 하 자의 내 국 에 있 는 장 업 사 의 소 재지 또는 지 소 주 를 해당 리 권 가 급 공 는 되 소 장 로 다 본 .","a":"X","e":"외 국 자 업 사 터 부 로 리 권 를 급 공 는 받 우 경 는 에 급 공 는 받 자의 내 국 에 있는 장 업 사 의 소재지 또는 지 소 주 를 해 당 리 권 가 급 공 는 되 소 장 로 본다.","pg":170},{"id":907,"ch":15,"n":33,"q":"국내 및 외 국 에 쳐 걸 제 국 송 운 역 용 을 공 제 는 하 자 업 사 가 비 자 주 거 는 또 국 외 인 법 면 이 그 급 공 소 장 는 내 국 장 업 사 재 소 지, 지 소 주 는 또 소 거 다 이 지 .","a":"X","e":"국내 및 외 국 에 걸쳐 제 국 송 운 역 용 을 공 제 는 하 자 업 사 가 비거주자 또는 국 외 인 법 면 이 그 급 공 소 장 는 객 여 이 탑 승 하거나 물 화 이 재 적 는 되 소 장 다 이 .","pg":170},{"id":908,"ch":15,"n":34,"q":"외 국 자 업 사 가 내 국 에 급 공 는 하 전자적 역 용 의 급 공 소 장 는 역 용 을 급 공 는 받 자의 장 업 사 지 재 소 , 지 소 주 는 또 거 이 지 소 다 .","a":"O","e":"偶","pg":170},{"id":909,"ch":16,"n":1,"q":"'면세제도'라 함은 법에 규정된 일정한 재화 또는 용역의 공 급에 대하여 부가가치세 납세의무를 면제하는 제도로 '완전 면세제도'에 해당된다.","a":"X","e":"'면세제도'라 함은 법에 규정된 일정한 재화 또는 용역의 공급에 대하여 부가가치세 납세의무를 면제하는 제도로 '부분면세제도'에 해당된다. 참고 매출세액을 부담하지 않지만, 매입세액 공제의 혜택을 수령 하지 못하기 때문에 일부 세부담을 갖고 있는 것을 '부분면세제도' 라함","pg":171},{"id":910,"ch":16,"n":2,"q":"영세율은 조세부담의 역진성 완화에 목적이 있다.","a":"X","e":"영세율은 소비지국 과세원칙의 구현에 목적이 있다. 비교 연세는 조세부담의 역진성 완화에 목적이 있음","pg":171},{"id":911,"ch":16,"n":3,"q":"영세율 적용대상자와 면세사업자는 모두 「부가가치세법」상 사업자가 아니다.","a":"X","e":"영세율 적용대상자는 「부가가치세법」상 사업자이고, 면세 사업자는 「부가가치세법」상 사업자가 아니다.","pg":171},{"id":912,"ch":16,"n":4,"q":"영세율이 적용되는 법인사업자의 경우에는 '완전면세제도' 가 적용되므로 「부가가치세법」상 부가가치세 예정신고의무 가 없다.","a":"X","e":"영세율이 적용되는 법인사업자의 경우에는 세율이 0% 인 것을 제외하고는 부가가치세 납세의무가 동일하게 부 여되므로 사업자등록, 상부 작성 및 보관, 세금계산서 발 급, 과세표준신고 등 「부가가치세법」이 요구하는 각종의 협력의무를 이행해야 한다.","pg":171},{"id":913,"ch":16,"n":5,"q":"면세사업만을 경영하는 자라 하더라도 「부가가치세법」에 따 른 사업자등록의무를 이행해야 한다.","a":"X","e":"면세가 적용되는 사업자는 원칙적으로는 부가가치세 납 세의무가 없다. 따라서 면세사업만을 경영하는 자는 「부 가가치세법」에 따른 사업자등록의무가 없다. 참고 「부가가치세법」상 협력의무를 부담하지는 않지만 「소득세법」 또는 「법인세법」은 면세사업자에게 사업자등록, 장부의 작성·보관, 계산서의 발급과 제술 등의 의무를 지게 하고 있음 주의","pg":171},{"id":914,"ch":16,"n":6,"q":"영세율은 과세사업자에 한하여 적용이 가능하다.","a":"O","e":"면세사업자는 별도로 면세포기절차를 거치지 않고는 영 세율을 적용받을 수 없다.","pg":171},{"id":915,"ch":16,"n":7,"q":"영세율은 사업자가 비거주자나 외국법인인 경우에는 그 외 국에서 대한민국의 거주자 또는 내국법인에 대하여 동일한 면세를 하는 경우에만 적용한다.","a":"O","e":"","pg":172},{"id":916,"ch":16,"n":8,"q":"내국물품(대한민국 선박에 의하여 채집되거나 포획된 수산 들을 제외)을 외국으로 반출하는 것은 영세율의 적용된다.","a":"X","e":"내국물품(대한민국 선박에 의하여 채집되거나 포획된 수 산물을 포함)을 외국으로 반출하는 것은 영세율의 적용된 다.","pg":172},{"id":917,"ch":16,"n":9,"q":"자기사업을 위하여 대가를 받지 아니하고 내국물품을 견 본품으로 외국으로 반출하는 직수출은 영세율이 적용된다.","a":"X","e":"자기사업을 위하여 대가를 받지 아니하고 국외 사업자에 게 견본품을 반출하는 경우에는 재화의 공급으로 보지 아 니한다.","pg":172},{"id":918,"ch":16,"n":10,"q":"건설업을 영위하는 사업자가 자기의 사업과 관련하여 생산 또는 취득한 재화를 자기의 해외건설공사에서 건설용 자재 르 사용하거나 소비할 목적으로 국외로 반출하는 경우에는 영세율이 적용된다.","a":"X","e":"건설업을 영위하는 사업자가 자기의 사업과 관련하여 생 산 또는 취득한 재화를 자기의 해외건설공사에서 건설용 자재로 사용하거나 소비할 목적으로 국외로 반출하는 경 우에는 재화의 공급으로 보지 아니한다.","pg":172},{"id":919,"ch":16,"n":11,"q":"사업자가 법령으로 정한 중계무역 방식으로 수출하는 경우 로서 국내 사업장에서 계약과 대가 수령 등 거래가 이루어 지는 것은 영세율을 적용받지만 세금계산서 발급의무는 있 다. ○","a":"X","e":"사업자가 법령으로 정한 중계무역 방식으로 수출하는 경 우로서 국내 사업장에서 계약과 대가 수령 등 거래가 이 루어지는 것은 영세율을 적용받으며 세금계산서 발급의 무가 없다.","pg":172},{"id":920,"ch":16,"n":12,"q":"물품 등을 무환으로 수출하여 해당 물품이 판매된 범위에서 대금을 결제하는 위탁판매수출은 영세율을 적용받지만 과세 당국이 반출된 재화를 추적할 수 있도록 세금계산서의 발급 의무를 규정하고 있다.","a":"X","e":"물품 등을 무환으로 수출하여 해당 물품이 판매된 범위에 서 대금을 결제하는 위탁판매수출은 영세율을 적용받으 며 세금계산서 발급의무가 없다. 비교 원료를 대가 없이 국외의 수탁가공 사업자에게 반출하여 가공 한 재화를 양도하는 경우에 그 원료의 반출은 영세율을 적용받지만 과세당국이 반출된 재화를 추적할 수 있도록 세금계산서 발급의무 를 규정하고 있음","pg":172},{"id":921,"ch":16,"n":13,"q":"「관세법」에 따른 수입신고 수리 전의 물품으로서 보세구역 에 보관하고 있는 물품을 외국으로 반출하는 것으로서 국내 사업장에서 계약과 대가수령 등 거래가 이루어지는 것은 영 세율이 적용된다.","a":"O","e":"","pg":173},{"id":922,"ch":16,"n":14,"q":"사업자가 재화의 공급시기 후 25일(그 날이 공휴일 또는 토 요일인 경우에는 바로 다음 영업일) 이내에 개설한 내국신용 장에 의해 공급하는 재화(금지금은 제외)는 국내에서 거래가 이루어지지만 정책상의 목적 등에 의해 수출하는 재화로 간 주하여 영세율을 적용한다.","a":"X","e":"사업자가 재화의 공급시기가 속하는 과세기간이 끝난 후 25일(그 날이 공휴일 또는 토요일인 경우에는 바로 다음 영업일) 이내에 개설한 내국신용장에 의해 공급하는 재화 (금지금은 제외)는 국내에서 거래가 이루어지지만 정책 상의 목적 등에 의해 수출하는 재화로 간주하여 영세율을 적용한다.","pg":173},{"id":923,"ch":16,"n":15,"q":"영세율이 적용되는 재화의 공급이 법령에서 정하는 내국신 용장에 의한 수출인 경우 세금계산서 발급의무가 면제된다.","a":"X","e":"영세율이 적용되는 재화의 공급이 법령에서 정하는 내국 신용장에 의한 수출인 경우 세금계산서 발급의무가 있다.","pg":173},{"id":924,"ch":16,"n":16,"q":"사업자가 대한적십자사에 공급하는 재화(대한적십자사가 그 목적사업을 위하여 당해 재화를 외국으로 유상 반출하는 경 우를 포함)는 영세율을 적용한다.","a":"X","e":"사업자가 대한적십자사에 공급하는 재화(대한적십자사가 그 목적사업을 위하여 당해 재화를 외국으로 무상 반출하 는 경우에 한함)는 영세율을 적용한다.","pg":173},{"id":925,"ch":16,"n":17,"q":"사업자가 외국법인과 직접 계약하고 그 외국법인이 지정하 는 국내의 다른 사업자에게 재화를 인도하고 국내의 다른 사업자가 인도받은 재화를 그대로 반출하거나 제조·가공한 후 반출하는 수탁가공무역의 경우로서 대금을 외국환은행에 서 원화로 받은 경우 영세율을 적용하되 세금계산서 발급의 무는 있다.","a":"X","e":"사업자가 외국법인과 직접 계약하고 그 외국법인이 지정 하는 국내의 다른 사업자에게 재화를 인도하고 국내의 다 른 사업자가 인도받은 재화를 그대로 반출하거나 제조· 가공한 후 반출하는 수탁가공무역의 경우로서 대금을 외 국환은행에서 원화로 받은 경우 영세율을 적용하며 세금 계산서 발급의무도 없다. 그 거래의 실질은 국외로 반출하는 것으로 수출과 다르지 않기 때 문에 세금계산서를 발급하지 않음","pg":173},{"id":926,"ch":16,"n":18,"q":"국외에서 공급하는 용역은 영세율을 적용한다.","a":"O","e":"","pg":173},{"id":927,"ch":16,"n":19,"q":"사업자가 국외에서 건설공사를 도급받은 사업자로부터 해당 건설공사를 재도급받아 국외에서 건설용역을 제공하고 그 대가를 원도급자인 국내사업자로부터 받은 경우에는 10% 과세를 적용한다.","a":"X","e":"사업자가 국외에서 건설공사를 도급받아 국외에서 건설 용역을 제공하는 경우 해당 용역을 제공받는 자, 대금결 제수단에 관계없이 영세율이 적용된다. 따라서 사업자가 국외에서 건설공사를 도급받은 사업자로부터 해당 건설 공사를 도급받아 국외에서 건설용역을 제공하고 그 대 가를 원도급자인 국내사업자로부터 받는 경우에도 영세 율이 적용된다.","pg":174},{"id":928,"ch":16,"n":20,"q":"거래 상대방이 국내사업장이 있는 비거주자. 외국법인이더 라도 국외에서 공급하는 용역은 영세율을 적용하며 세금계 산서를 발급하지 않는다.","a":"X","e":"거래 상대방이 국내사업장이 있는 비거주자. 외국법인이 더라도 국외에서 공급하는 용역은 영세율을 적용하되 세 금계산서를 발급해야 한다. 비교 거래 상대방이 국내사업장이 없는 비거주자외국법인인 경우 세금계산서 발급의무가 없음","pg":174},{"id":929,"ch":16,"n":21,"q":"항공기에 의하여 여객을 국내에서 국외로 수송하는 것에 대 해서는 영세율이 적용되지 않는다.","a":"X","e":"선박 또는 항공기에 의하여 여객이나 화물을 국내에서 국 외로, 국외에서 국내로 또는 국외에서 국외로 수송하는 것에 대하여는 영세율을 적용한다.","pg":174},{"id":930,"ch":16,"n":22,"q":"선박 또는 항공기에 의한 외국항행용역의 공급은 영세율을 적용한다. 이때, 외국항행용역에는 국내에서 국외로 수송하 는 것으로 한하고 국외에서 국외로 수송하는 것은 제외한다.","a":"X","e":"선박 또는 항공기에 의한 외국항행용역의 공급은 영세율 을 적용한다. 이때, 외국항행용역에는 국내에서 국외로 수송하는 것뿐만 아니라 국외에서 국외로 수송하는 것과 국외에서 국내로 수송하는 것도 포함한다.","pg":174},{"id":931,"ch":16,"n":23,"q":"외국항행용역을 공급하는 사업자가 자기의 사업에 부수하여 공급하는 재화 또는 용역으로서 공항버스·지하철 등을 탑 승하게 하는 것과 공항 인근 관광호텔에 투숙하게 하는 것 은 영세율을 적용한다.","a":"X","e":"외국항행용역을 공급하는 사업자가 자기의 사업에 부수 하여 공급하는 재화 또는 용역으로서 자기의 승객만이 전 용하는 버스를 탑승하게 하는 것과 자기의 승객만이 전용 하는 호텔에 투숙하게 하는 것은 영세율을 적용한다.","pg":174},{"id":932,"ch":16,"n":24,"q":"외국항행용역을 공급하는 사업자가 자기의 사업에 부수하여 공급하는 재화 또는 용역으로서 외국을 항행하는 선박 또는 항공기 내에서 승객에게 공급하는 것은 영세율을 적용한다.","a":"O","e":"","pg":175},{"id":933,"ch":16,"n":25,"q":"「항공사업법」에 의한 상업서류 송달용역의 경우 영세율이 적용되며 세금계산서 발급의무가 있다.","a":"X","e":"항공기의 외국항행용역 및 「항공사업법」에 의한 상업서류 송달용역의 경우 영세율이 적용되며 세금계산서 발급의 무가 없다.","pg":175},{"id":934,"ch":16,"n":26,"q":"「관광진흥법」에 따른 종합여행업자가 외국인 관광객에게 공 급하는 관광알선용역은 대가수령방법과 관계없이 영세율을 적용한다.","a":"X","e":"「관광진흥법」에 따른 종합여행업자가 외국인 관광객에게 공급하는 관광알선용역은 다음의 방법으로 대가를 수령 하는 것에 한하여 영세율을 적용한다. ㉠ 외국환은행에서 원화로 받은 것 ㉡ 외화 현금으로 받은 것 중 국세청장이 정하는 관광 알선수수료명세표와 외화 매입증명서에 의하여 외 국인관광객과의 거래임이 확인되는 것","pg":175},{"id":935,"ch":16,"n":27,"q":"「개별소비세법」에 따른 지정을 받아 외국인전용판매장을 경 영하는 자가 국내에서 공급하는 재화 또는 용역에 대해서는 그 대가를 외화로 받고 그 외화를 외국환은행에서 원화로 환전하는 경우로 한정하여 영세율을 적용한다.","a":"O","e":"","pg":175},{"id":936,"ch":16,"n":28,"q":"「조세특례제한법」에 따른 주한외국군인 및 외국인선원 전용 유흥음식점업을 경영하는 자가 국내에서 재화 또는 용역을 공급하면서 그 대가를 외화로 받고 그 외화를 외국환은행에 서 원화로 환전하는 경우 영세율을 적용하며 외국인전용이 므로 세금계산서 발급의무는 없다.","a":"X","e":"「조세특례제한법」에 따른 주한외국군인 및 외국인선원 전 용유흥음식점업을 경영하는 자가 국내에서 재화 또는 용 역을 공급하면서 그 대가를 외화로 받고 그 외화를 외국 환은행에서 원화로 환전하는 경우 영세율을 적용하며 외 국인전용이라 하더라도 세금계산서 발급의무는 부여된 다.","pg":175},{"id":937,"ch":16,"n":29,"q":"국내사업장이 있는 비거주자 또는 외국법인(비거주자의 범 위에는 국내에 거소를 둔 개인, 외교공관 등의 소속 직원, 우 리나라에 상주하는 국제연합군 또는 미합중국군대의 군인 또는 군무원은 포함)과 직접 계약하여 공급되는 법에 열거된 용역은 그 대금을 외국환은행에서 원화로 받거나 재정경제 부령이 정하는 방법으로 받는 것에 대하여 영세율을 적용한 다.","a":"X","e":"국내사업장이 있는 비거주자 또는 외국법인(비거주자의 범위에는 국내에 거소를 둔 개인, 외교공관 등의 소속 직 원, 우리나라에 상주하는 국제연합군 또는 미합중국군대 의 군인 또는 군무원은 제외)과 직접 계약하여 공급되는 법에 열거된 용역은 그 대금을 외국환은행에서 원화로 받 거나 재정경제부령이 정하는 방법으로 받는 것에 대하여 영세율을 적용한다.","pg":176},{"id":938,"ch":16,"n":30,"q":"국내에서 국내사업장이 없는 외국법인에게 상품 중개를 하 였으나 용역대금을 외국환은행에서 원화로 받은 경우에는 영세율을 적용하지 않는다.","a":"X","e":"국내에서 국내사업장이 없는 외국법인에게 상품 중개를 하였으나 용역대금을 외국환은행에서 원화로 받은 경우 에는 영세율을 적용한다.","pg":176},{"id":939,"ch":16,"n":31,"q":"국내에서 국내사업장이 없는 외국법인과 직접계약을 체결하 고 외국환은행에서 원화로 지급받으면서 외국법인이 지정하 는 국내사업자에게 인도되어 해당 사업자의 면세사업에 사 용되는 재화는 영세율을 적용한다.","a":"X","e":"국내에서 국내사업장이 없는 외국법인과 직접계약을 체 결하고 외국환은행에서 원화로 지급받으면서 외국법인이 지정하는 국내사업자에게 인도되어 해당 사업자의 과세 사업에 사용되는 재화는 영세율을 적용한다. 면세사업에 사용되는 재화는 10% 과세가 적용되고, 과세사업에 사용되는 재화는 영세율이 적용됨을 주의한다.","pg":176},{"id":940,"ch":16,"n":32,"q":"수출업자와 직접 도급계약에 따라 수출재화를 임가공하고 부가가치세를 별도로 적은 세금계산서를 발급한 경우 영세 율을 적용한다.","a":"X","e":"수출업자와 직접 도급계약에 따라 수출재화를 임가공하 고 부가가치세를 별도로 적은 세금계산서를 발급한 경우 영세율을 적용하지 않는다.","pg":176},{"id":941,"ch":16,"n":33,"q":"내국신용장에 의하여 수출재화를 수출업자에게 공급하는 사 업자와 직접도급계약에 의하여 수출재화임가공용역을 제공 하는 경우 영세율을 적용한다.","a":"X","e":"내국신용장에 의하여 수출재화를 수출업자에게 공급하는 사업자와 직접도급계약에 의하여 수출재화임가공용역을 제공하는 경우 영세율을 적용하지 않는다. 직접도급계약에 의하여 영세율을 적용하는 경우는 수출 업자와 직접도급만 해당된다. '내국신용장에 의하여 수출재화를 수출업자에게 공급하 는 사업자'와는 내국신용장에 의하여 공급한 경우에는 영 세율이 적용된다.","pg":176},{"id":942,"ch":16,"n":34,"q":"내국신용장 또는 구매확인서에 의하여 공급하는 수출재화임 가공용역 (내국신용장 · 구매확인서가 그 용역의 공급시기가 속하는 과세기간 종료일까지 발급한 경우에 한함)은 영세율 을 적용하고, 영세율 거래이므로 세금계산서를 발급의무는 없다.","a":"X","e":"내국신용장 또는 구매확인서에 의하여 공급하는 수출재 화임가공용역 (내국신용장 • 구매확인서가 그 용역의 공 급시기가 속하는 과세기간이 끝난 후 25일이내 발급한 경우에 한함)은 영세율을 적용하고, 영세율 거래라고 하 더라도 국내에서 공급이 이루어졌으므로 세금계산서를 발급하여야 한다.","pg":177},{"id":943,"ch":16,"n":35,"q":"우리나라에 상주하는 외교공관, 영사기관(명예영사관원을 장으로 하는 영사기관은 제외), 국제연합과 이에 준하는 국 제기구(우리나라가 당사국인 조약과 그 밖의 국내법령에 따 라 특권과 면제를 부여받을 수 있는 경우만 해당) 등에 재화 또는 용역을 공급하는 경우 그 대금을 외국환은행 에서 원 화로 받거나 재정경제부령이 정하는 방법으로 받는 것에 한 하여 영세율을 적용 받는다.","a":"X","e":"우리나라에 상주하는 외교공관, 영사기관(명예영사관원 을 장으로 하는 영사기관은 제외), 국제 연합과 이에 준하 는 국제기구(우리나라가 당사국인 조약과 그 밖의 국내법 령에 따라 특권과 면제를 부여받을 수 있는 경우만 해당) 등에 재화 또는 용역을 공급하는 경우 기타 대금결제방법 에 제한 없이 영세율을 적용 받는다.","pg":177},{"id":944,"ch":16,"n":36,"q":"외교공관 등의 소속 직원으로서 해당 국가로부터 공무원 신 분을 부여받은 자 또는 외교부장관으로부터 이에 준하는 신 분임을 확인받은 자 중 내국인이 아닌 자에게 일정한 방법 에 따라 재화 또는 용역을 공급하는 경우는 해당 외국에서 대한민국의 외교공관 및 영사기관 등의 직원에게 공급하는 재화.용역에 대하여 동일하게 면세하는 경우에만 영세율을 적용 받는다.","a":"O","e":"","pg":177},{"id":945,"ch":16,"n":37,"q":"외국을 항해하는 선박 및 항공기 또는 원양어선에 공급하는 재화 또는 용역은 사업자가 부가가치세를 별도로 적은 세금 계산서를 발급한 경우 영세율을 적용 받는다.","a":"X","e":"외국을 항해하는 선박 및 항공기 또는 원양어선에 공급하 는 재화 또는 용역(사업자가 부가가치세를 별도로 적은 세금계산서를 발급한 경우는 제외)은 기타 대금결제방법 에 제한 없이 영세율을 적용받는다.","pg":177},{"id":946,"ch":16,"n":38,"q":"식용으로 제공되는 농산물•축산물•수산물 또는 임산물, 소금(천일염 및 재제소금을 말함)으로서 가공되지 않거나 원 생산물 본래의 성질이 변하지 않는 정도의 1차 가공(탈곡. 정미· 제분· 정육. 건조. 냉동• 염장. 포장 등)을 거쳐 식 용으로 제공하는 것은 국산 • 외국산 불문하고 면세한다.","a":"O","e":"","pg":178},{"id":947,"ch":16,"n":39,"q":"수돗물(생수 포함)은 면세한다.","a":"X","e":"수돗물(생수 제외)은 면세한다.","pg":178},{"id":948,"ch":16,"n":40,"q":"연탄과 무연탄(유연탄 제외) - 갈탄. 착화탄은 면세한다.","a":"X","e":"연탄과 무연탄(유연탄, 갈탄, 착화탄 제외)은 면세한다.","pg":178},{"id":949,"ch":16,"n":41,"q":"부가가치세가 면세되는 미가공 식품에는 김치, 두부 등 재 정경제부령으로 정하는 단순가공식료품이 포함된다. 이때, 김치 등을 거래단위로 포장하여 판매하는 경우에도 면세가 적용된다.","a":"X","e":"부가가치세가 면세되는 미가공 식료품에는 김치, 두부 등 재정경제부령으로 정하는 단순가공식료품이 포함된다. 다만, 김치 등을 거래단위로 포장하여 판매하는 경우에는 면세가 적용되지 않는다.","pg":178},{"id":950,"ch":16,"n":42,"q":"여객운송용역(지하철, 시내버스, 고속철도 등)은 면세한다.","a":"X","e":"여객운송용역(지하철, 시내버스 등)은 면세하나 항공기. 시외우등고속버스 및 시외고급고속버스, 전세버스, 택시, 특수자동차, 특종선박, 고속철도에 의한 여객운송용역 및 삭도, 유람선 등 관광 또는 유흥 목적의 운송수단에 의한 여객운송용역에 대하여는 과세한다.","pg":178},{"id":951,"ch":16,"n":43,"q":"부동산임대업자가 주택(국민주택규모 초과)을 유상으로 임 대하는 경우 부가가치세가 과세된다.","a":"X","e":"부동산임대업자가 주택을 유상으로 임대하는 경우 주택 의 규모를 불문하고 부가가치세가 면세된다.","pg":178},{"id":952,"ch":16,"n":44,"q":"상시주거용(사업을 위한 주거용 제외)으로 사용하는 건물의 임대용역에 대해서는 부가가치세를 면제한다.","a":"O","e":"","pg":178},{"id":953,"ch":16,"n":45,"q":"임대주택에 부가가치세가 과세되는 사업용 건물이 함께 설 치되어 있는 경우로서 주택 면적이 사업용 건물 면적보 다 크거나 같을 경우 건물 전부를 주택으로 보아 면세한다.","a":"X","e":"임대주택에 부가가치세가 과세되는 사업용 건물이 함께 설치되어 있는 경우로서 주택 면적이 사업용 건물 면적보 다 클 경우 건물 전부를 주택으로 보아 면세한다. 비교 주택 면적이 사업용 건물 면적보다 작거나 같을 경우 주택 부 분 외의 사업용 건물 부분은 주택으로 보지 않고, 주택 부분만 주택 으로 보아 면세함","pg":179},{"id":954,"ch":16,"n":46,"q":"탈모치료술, 모발이식술은 면세한다.","a":"X","e":"탈모치참 료색술고모 소,발 모반·주근깨·흑색점·기미 이식술은 면세하지 치료술, 아니한다. 여드름 치료술, 제모술, 탈모치료술, 모발이식술, 문신술 및 문신제거술, 피어싱, 지방용해술, 피부재생술, 피부미백술, 항노화치료술 및 모공축소술 등과 같은 이용 목적의 피부 관련 시술은 연세하지 아니함","pg":179},{"id":955,"ch":16,"n":47,"q":"가축·수산동물 . 애완동물에 대한 진료용역은 면세하나 수 의사가 공급하는 애완용품 재화 및 애완미용 용역은 면세하 지 아니한다.","a":"X","e":"가축·수산동물·장애인 보조견표지를 발급받은 장애인 보조견 · 수급자가 기르는 동물에 대한 진료용역은 면세 이나 애완동물 진료용역은 법령으로 정한 면세대상을 제 외하고는 원칙적으로 과세한다.","pg":179},{"id":956,"ch":16,"n":48,"q":"약사가 제공하는 의약품은 조제 여부와 상관없이 면세하되 일반 생필품점에서 판매하는 의약품은 면세하지 아니한다.","a":"X","e":"의약품 자체는 재화이므로 조제하지 않고 판매하는 경우 재화의 공급으로 과세하지만 약사가 제공하는 의약품 조 제용역은 면세한다.","pg":179},{"id":957,"ch":16,"n":49,"q":"「협동조합기본법」에 따라 설립인가를 받은 사회적협동조합 이 직접 제공하는 간병 • . 산후조리 · 보육 용역의 공급은 부 가가치세가 면세된다.","a":"O","e":"","pg":179},{"id":958,"ch":16,"n":50,"q":"주무관청의 허가 또는 인가를 받거나 주무관청에 등록되거 나 신고된 학교 학원, 강습소 훈련원, 교습소 또는 그 밖의 비영리단체에서 학생, 수강생, 훈련생, 교습생 또는 청강생 에게 지식, 기술 등을 가르치는 것은 면세하되 그 교육용역 제공에 필요한 교재 · 실습자재 · 기타 교육용구의 대가를 수 강로와 별도로 받는 때에는 해당 대가에 대해서는 면세하지 아니한다.","a":"X","e":"주무관청의 허가 또는 인가를 받거나 주무관청에 등록되 거나 신고된 학교, 학원, 강습소, 훈련원, 교습소 또는 그 밖의 비영리단체에서 학생, 수강생, 훈련생, 교습생 또는 청강생에게 지식, 기술 등을 가르치는 것은 면세하며 그 교육용역 제공에 필요한 교재 · 실습자재 · 기타 교육용구 의 대가를 수강료 등에 포함하여 받거나 별도로 받는 때 에도 주된 용역인 교육용역의 부수제화·용역으로 보아 면세한다.","pg":180},{"id":959,"ch":16,"n":51,"q":"무도학원은 면세하되 자동차운전학원은 과세한다.","a":"X","e":"무도학원과 자동차운전학원은 과세한다.","pg":180},{"id":960,"ch":16,"n":52,"q":"토지의 공급은 면세되나 토지의 임대응역의 공급은 과세된 다.","a":"X","e":"토지의 공급은 면세되나 주택과 이에 부수되는 토지의 임 대용역을 제외한 토지의 임대용역의 공급은 과세된다.","pg":180},{"id":961,"ch":16,"n":53,"q":"은행업에 관련된 전산시스템과 소프트웨어의 판매. 대여용 역에 대해서는 부가가치세를 면제한다.","a":"X","e":"금융·보험용역 외의 사업을 하는 자가 주된 사업에 부수 하여 금융·보험용역과 같거나 유사한 용역을 제공하는 경우에도 면세하는 '금융·보험용역'에 포함되는 것으로 보아 부가가치세를 면세한다. 다만, 다음의 것은 금융. 보험용역으로 보지 않으므로 부가가치세를 과세한다. ㉠ 복권. 입장권 · 상품권 · . 지금형주화 또는 금지금에 관한 대행용역(다만, 수익증권 등 금융업자의 금융 상품 판매대행용역 등은 제외) ㉡ 기업합병 또는 기업매수의 중개. 주선·대리, 신용 정보서비스 및 은행입에 관련된 전산시스템과 소프 트웨어의 판매· 대여용역 ② 부동산 임대용역, 감가상각자산의 대여용역(다만, 「여신전문금융업법」에 따른 시설대여업자가 제공하 는 시설대여용역은 제외) ② 그 밖에 법에 정하는 것","pg":180},{"id":962,"ch":16,"n":54,"q":"기업매수의 중개 및 은행업에 관련된 전산시스템과 소프트 웨어의 판매· 대여 용역은 부가가치세 면세 용역이 아니다.","a":"O","e":"","pg":181},{"id":963,"ch":16,"n":55,"q":"「가사근로자의 고용개선 등에 관한 법률」에 따른 가사서비 스 제공기관이 독립된 자격으로 가사서비스 이용자에게 제 공하는 가사서비스는 면세하지 아니한다.","a":"X","e":"「가사근로자의 고용개선 등에 관한 법률」에 따른 가사서 비스 제공기관이 독립된 자격으로 가사서비스 이용자에 게 제공하는 가사서비스는 면세한다.","pg":181},{"id":964,"ch":16,"n":56,"q":"도서(도서대여용역 포함) • . 신문 • . 관보 및 뉴스통신은 면세 하되, 잡지와 광고는 과세된다.","a":"X","e":"도서(도서대여용역 포함)·신문·잡지·관보 및 뉴스통 신은 면세하되, 광고는 과세된다. 신문이나 잡지는 연세 더라도 신문이나 잡지 내에 실린 광고에 대한 광고료수입은 부가가치 세가 과세된다.","pg":181},{"id":965,"ch":16,"n":57,"q":"면세사업자인 통신사업자가 특정회원을 대상으로 금융정보 등 특정한 정보를 제공하는 것은 면세한다.","a":"X","e":"면세사업자인 통신사업자가 특정회원을 대상으로 금융정 보 등 특정한 정보를 제공하는 경우에는 다른 정보제공사 업자와의 과세형평을 위하여 과세한다.","pg":181},{"id":966,"ch":16,"n":58,"q":"예술창작품 및 제작 후 100년이 초과된 골동품은 면세하되 모방제작한 미술품은 과세한다.","a":"X","e":"면세 대상이 되는 예술창작품에는 골동품(제작 후 100년 이 초과된 것)과 모방제작한 미술품은 제외한다.","pg":181},{"id":967,"ch":16,"n":59,"q":"예술행사 문화행사, 아마추어 운동경기는 영리를 목적으로 하지 않는 것에 대해서만 면세를 적용한다.","a":"O","e":"","pg":181},{"id":968,"ch":16,"n":60,"q":"오락시설과 함께 있는 동물원 및 지식의 보급 및 연구에 그 목적이 있는 해양수족관 등의 입장료는 면세한다.","a":"X","e":"도서관, 과학관, 박물관, 미술관, 동물원, 식물원, 민속문 화자원을 소개하는 장소 및 전쟁기념관에 입장하게 하는 것은 면세하나, 오락 및 유흥시설과 함께 있는 동물원, 식 물원 및 해양수족관에 입장하게 하는 것은 과세한다.","pg":181},{"id":969,"ch":16,"n":61,"q":"우표수집용 우표는 제외), 인지, 증지, 공중전화는 면세하되 복권은 과세한다.","a":"X","e":"우표수집용 우표는 제외), 인지, 중지, 복권과 공중전화 는 민세한다.","pg":182},{"id":970,"ch":16,"n":62,"q":"학술 및 기술 발전을 위하여 학술 및 기술의 연구와 발표를 주된 목적으로 하는 단체가 그 연구와 관련하여 무상으로 공급하는 재화 또는 용역은 면세하되 실비로 공급하는 재화 또는 용역은 과세한다.","a":"X","e":"학술 및 기술 발전을 위하여 학술 및 기술의 연구와 발표 를 주된 목적으로 하는 단체가 그 연구와 관련하여 실비 또는 무상으로 공급하는 재화 또는 용역은 면세한다.","pg":182},{"id":971,"ch":16,"n":63,"q":"「저작권법」에 따라 문화체육관광부장관이 지정한 보상금수 령단체로서 재정경제부령으로 정하는 단체인 사업자가 저작 권자를 위하여 공급하는 보상금 수령 관련 용역은 과세한다.","a":"X","e":"「저작권법」에 따라 문화체육관광부장관이 지정한 보상금 수령단체로서 재정경제부령으로 정하는 단체인 사업자가 저작권자를 위하여 실비 또는 무상으로 공급하는 보상금 수령 관련 용역은 면세한다.","pg":182},{"id":972,"ch":16,"n":64,"q":"국가·지방자치단체·지방자치단체조합이 공급하는 부동산 임대업, 도매 및 소매업, 음식점업 숙박업, 골프장 및 스키 장 운영업, 기타 스포츠 시설 운영업에서 공급하는 재화 또 는 용역은 면세한다.","a":"X","e":"국가·지방자치단체·지방자치단체조합이 공급하는 부 동산임대업, 도매 및 소매업, 음식점업·숙박업, 골프장 및 스키장 운영업, 기타 스포츠 시설 운영업에서 공급하 는 재화 또는 용역은 과세한다.","pg":182},{"id":973,"ch":16,"n":65,"q":"국가·지방자치단체·지방자치단체조합 또는 공익단체에 유상 또는 무상으로 공급하는 재화 또는 용역은 면세한다.","a":"X","e":"국가·지방자치단체·지방자치단체조합 또는 공익단체 에 무상으로 공급하는 재화 또는 용역은 면세한다.","pg":182},{"id":974,"ch":16,"n":66,"q":"우정사업 운영에 관한 특례법」에 따른 우정사업조직이 소 포우편물을 방문접수하여 배달하는 용역의 공급은 부가가치 세가 면세된다.","a":"X","e":"국가·지방자치단체·지방자치단체조합이 공급하는 재 화 또는 용역은 면세되는 것이 원칙이다. 다만 법령으로 정하는 것은 부가가치세가 과세되며, 「우정사업 운영에 관한 특례법」에 따른 우정사업조직이 제공하는 다음의 용 역은 부가가치세가 과세된다. ㉠ 소포우편물을 방문접수하여 배달하는 용역 ㉡우편주문판매를 대행하는 용역","pg":182},{"id":975,"ch":16,"n":67,"q":"외국으로부터 국가, 지방자치단체에 기증되는 재화의 수입 에 대하여는 부가가치세를 면제한다.","a":"O","e":"","pg":183},{"id":976,"ch":16,"n":68,"q":"거주자가 받는 소액물품으로서 관세가 면제되는 재화의 수 입은 부가가치세가 면세된다.","a":"O","e":"","pg":183},{"id":977,"ch":16,"n":69,"q":"면세포기를 신고한 사업자는 신고한 날부터 5년간 부가가치 세를 면제받지 못한다.","a":"X","e":"면세포기를 신고한 사업자는 신고한 날부터 3년간 부가 가치세를 면제받지 못한다.","pg":183},{"id":978,"ch":16,"n":70,"q":"면세를 포기하려는 사업자는 면세포기신고서를 관할 세무서 장에게 제출하고, 관할세무서장이 승인한 경우 과세사업자 로 사업자등록을 해야 한다.","a":"X","e":"면세를 포기하려는 사업자는 면세포기신고서를 관할 세 무서장에게 제출하고, 지체없이 사업자등록을 해야 한다. 면세포기에는 시기의 제한이 없으며, 언제든지 가능하며 이는 승인을 요건으로 하지 아니한다.","pg":183},{"id":979,"ch":16,"n":71,"q":"면세되는 둘 이상의 사업 또는 종목을 영위하는 사업자는 면세포기대상이 되는 재화 또는 용역의 공급 중에서 면세포 기하고자 하는 재화·용역의 공급만을 구분하여 면세포기 할 수 없다.","a":"X","e":"면세되는 둘 이상의 사업 또는 종목을 영위하는 사업자는 면세포기대상이 되는 재화 또는 용역의 공급 중에서 면세 포기하고자 하는 재화·용역의 공급만을 구분하여 면세 포기 할 수 있다.","pg":183},{"id":980,"ch":16,"n":72,"q":"면세를 포기하려는 사업자는 면세포기신고서를 관할 세무서 장에게 제출하면 되지만 영세율 적용 대상이 되는 재화·용 역에 대해서는 면세를 포기할 수 없다.","a":"X","e":"영세율 적용 대상이 되는 재화.용역 또는 공익단체 중 학술 등 연구단체가 그 연구와 관련하여 실비 또는 무상 으로 공급하는 재화·용역에 대해서만 면세를 포기할 수 있으며 그 외의 사업자의 경우 현행 「부가가치세법」상 면 세를 포기할 수 없다.","pg":183},{"id":981,"ch":17,"n":1,"q":"재화나 용역을 공급하는 과세사업자는 공급자용과 공급받는 자용. 관할 세무서 제출용 각 1매로 총 3매를 작성하여 1조로 세금계산서를 발급하되, 그 중 공급받는 자용 1매는 거래 상 대방에게 발급하여야 한다.","a":"X","e":"재화나 용역을 공급하는 과세사업자는 공급자용과 공급 받는 자용 각 1매로 총 2매를 작성하여 1조로 세금계산서 를 발급하되, 그 중 공급받는 자용 1매는 거래 상대방에 게 발급하여야 한다.","pg":184},{"id":982,"ch":17,"n":2,"q":"수입되는 재화에 대하여는 세관장이 수입세금계산서를 수입 하는 자에게 교부한다.","a":"O","e":"","pg":184},{"id":983,"ch":17,"n":3,"q":"공급자는 발급한 세금계산서를 요약한 매출처별 세금계산서 합계표와 함께 각 세금계산서를 제출해야 하며, 공급받는 자 는 발급받은 세금계산서를 요약한 매입처별 세금계산서합계 표를 제출하여야 매입세액공제를 받을 수 있다.","a":"X","e":"각 세금계산서는 제출할 필요 없이 보관만 하되, 공급자 는 발급한 세금계산서를 요약한 매출처별 세금계산서합 계표를 제출하여야 하고 공급받는 자는 발급받은 세금계 산서를 요약한 매입처별 세금계산서합계표를 제출하여야 매입세액공제를 받을 수 있다.","pg":184},{"id":984,"ch":17,"n":4,"q":"세금계산서에는 공급하는 사업자의 등록번호와 성명 또는 명칭, 공급받는 자의 등록번호(또는 고유번호, 공급받는 자 의 주민등록번호), 공급가액과 부가가치세액, 공급연월일이 반드시 기재되어야 하며 일부라도 기재되지 않은 경우 세금 계산서로서 아무런 효력이 없다.","a":"X","e":"세금계산서에는 공급하는 사업자의 등록번호와 성명 또 는 명칭, 공급받는 자의 등록번호(또는 고유번호, 공급받 는 자의 주민등록번호), 공급가액과 부가가치세액, 작성 연월일이 반드시 기재되어야 하며 일부라도 기재되지 않 은 경우 세금계산서로서 아무런 효력이 없다. 비교 공급하는 자의 주소, 공급받는 자의 상호성명·주소, 단가와 수 량, 공급연월일은 임의적으로 기재하면 그 효력이 인정되는 사항으로, 해당 사항이 일부 기재되지 않았더라도 세금계산서는 유효함","pg":184},{"id":985,"ch":17,"n":5,"q":"공급하는 사업자의 등록번호와 성명 또는 명칭 및 주소는 세금계산서의 필요적 기재사항이다. 200 제4권 부가가치세법","a":"X","e":"공급하는 사업자의 등록번호와 성명 또는 명칭은 필요적 기재사항이다. 그러나 공급하는 자의 주소는 임의적 기재 사항이다.","pg":184},{"id":986,"ch":17,"n":6,"q":"개인사업자와 직전 연도의 사업장별 재화 및 용역의 공급가 액의 합계액이 1억원 이상인 법인사업자는 세금계산서를 발 급할 경우 전자적 방법으로 세금계산서를 발급하여야 한다.","a":"X","e":"법인사업자와 직전 연도의 사업장별 재화 및 용역의 공급 가액의 합계액이 8천만원 이상인 개인사업자는 세금계산 서를 발급할 경우 전자적 방법으로 세금계산서를 발급하 여야 한다.","pg":185},{"id":987,"ch":17,"n":7,"q":"전자세금계산서를 발급하여야 하는 사업자가 아닌 사업자는 전자세금계산서를 발급할 수 없다.","a":"X","e":"전자세금계산서를 발급하여야 하는 사업자가 아닌 사업 자도 전자세금계산서를 발급하고 전자세금계산서 발급명 세를 전송할 수 있다.","pg":185},{"id":988,"ch":17,"n":8,"q":"전자세금계산서를 의무적으로 발급해야 하는 개인사업자는 사업장별 재화 및 용역의 공급가액의 합계액이 8천만원 이 상인 해의 다음 해 제1기 과세기간이 시작하는 날부터 전자 세금계산서를 발급해야 한다.","a":"X","e":"전자세금계산서를 의무적으로 발급해야 하는 개인사업자 는 사업장별 재화 및 용역의 공급가액의 합계액이 8천만 원 이상인 해의 다음 해 제2기 과세기간이 시작하는 날부 터 전자세금계산서를 발급해야 한다.","pg":185},{"id":989,"ch":17,"n":9,"q":"전자세금계산서 의무발급 개인사업자는 사업장별 재화와 용 역의 공급가액의 합계액이 수정신고 등으로 8천만원 이상이 된 경우에는 수정신고 등을 한 날이 속하는 과세기간이 시 작하는 날부터 전자세금계산서를 발급해야 한다.","a":"X","e":"전자세금계산서 의무발급 개인사업자는 사업장별 재화와 용역의 공급가액의 합계액이 수정신고 등으로 8천만원 이상이 된 경우에는 수정신고 등을 한 날이 속하는 과세 기간의 다음 과세기간이 시작하는 날부터 전자세금계산 서를 발급해야 한다.","pg":185},{"id":990,"ch":17,"n":10,"q":"관할 세무서장은 개인사업자가 전자세금계산서 의무발급 개 인사업자에 해당하는 경우에는 전자세금계산서를 발급해야 하는 날이 시작되기 10일 전까지 그 사실을 해당 개인사업 자에게 통지하여야 한다.","a":"X","e":"관할 세무서장은 개인사업자가 전자세금계산서 의무발급 개인사업자에 해당하는 경우에는 전자세금계산서를 발 급해야 하는 날이 시작되기 1개월 전까지 그 사실을 해당 개인사업자에게 통지하여야 한다.","pg":185},{"id":991,"ch":17,"n":11,"q":"관할 세무서장은 개인사업자가 전자세금계산서 의무발급 개 인사업자에 해당하는 경우에는 전자세금계산서를 발급해 야 하는 날이 시작되기 1개월 전까지 그 사실을 해당 개인사 업자에게 통지하여야 하며 개인사업자가 1개월 수탁자가 직접 재화를 인도하는 위탁판매(위탁자를 알 수 없는 경우에 해당하지 않음)의 경우 위탁자 본인의 명의 로 세금계산서를 발급해야 하며 이 경우 수탁자 또는 대 리인의 등록번호를 덧붙여 적어야 한다.","pg":187},{"id":999,"ch":17,"n":19,"q":"위탁판매에 있어서 위탁판매자가 직접 재화를 인도하는 때 에는 위탁자가 세금계산서를 발급할 수 있다. 이 경우 수탁 자의 등록번호를 덧붙여 적어야 한다.","a":"O","e":"","pg":187},{"id":1000,"ch":17,"n":20,"q":"위탁매입 또는 대리인에 의한 매입의 경우에는 공급자가 수 탁자 또는 본인(위탁자 또는 본인을 알 수 없는 경우로서 대 통령령으로 정하는 경우는 아님)을 공급받는 자로 하여 세금 계산서를 발급하며, 이 경우 위탁자 또는 대리인의 등록번호 를 덧붙여 적어야 한다.","a":"X","e":"위탁매입 또는 대리인에 의한 매입의 경우에는 공급자가 위탁자 또는 본인(위탁자 또는 본인을 알 수 없는 경우로 서 대통령령으로 정하는 경우는 아님)을 공급받는 자로 하여 세금계산서를 발급하며, 이 경우 수탁자 또는 대리 인의 등록번호를 덧붙여 적어야 한다.","pg":187},{"id":1001,"ch":17,"n":21,"q":"「조달사업에 관한 법률」에 따라 물자가 공급되는 경우에는 공급자 또는 세관장이 조달청장에게 세금계산서를 발급하여 야 한다.","a":"X","e":"「조달사업에 관한 법률」에 따라 물자가 공급되는 경우에 는 공급자 또는 세관장이 해당 실수요자에게 직접 세금계 산서를 발급하여야 한다. 비교 물자를 조달할 때에 그 물자의 실수요자를 알 수 없는 경우에 는 조달청장에게 세금계산서를 발급함","pg":188},{"id":1002,"ch":17,"n":22,"q":"공급한 재화가 환입된 경우에는 그 작성일자는 처음 세금계 산서의 작성일자를 적고 비고란에 재화가 환입된 날을 덧붙 여 적은 후 붉은색 글씨로 쓰거나 음의 표시를 하여 발급한 다.","a":"X","e":"공급한 재화가 환입된 경우에는 재회기 환인된 날을 작성 일자로 적고 비고란에 처음 세금계산시 작성일자를 덧붙 여 적은 후 붉은색 글씨로 쓰거나 음의 표시를 하여 발급 한다.","pg":188},{"id":1003,"ch":17,"n":23,"q":"계약의 해제로 인하여 재화 또는 용역이 공급되지 아니한 경우에는 그 작성일자는 처음 세금계산서의 작성일자를 적 고 비고란에 계약해제일을 덧붙여 적은 후 붉은색 글씨로 쓰거나 음의 표시를 하여 발급한다.","a":"X","e":"계약의 해제로 인하여 재화 또는 용역이 공급되지 아니한 경우에는 그 작성일자는 계약해제일을 적고 비고란에 처 음 세금계산서 작성일자를 덧붙여 적은 후 붉은색 글씨로 쓰거나 음의 표시를 하여 발급한다.","pg":188},{"id":1004,"ch":17,"n":24,"q":"재화 또는 용역을 공급한 후 공급시기가 속하는 과세기간 종료 후 25일 이내에 내국신용장이 개설되었거나 구매확인 서가 발급된 경우에는 내국신용장 등이 개설된 경우 그 작 성일자는 내국신용장 개설일을 적고 비고란에 처음 세금계 산서 작성일자 등을 덧붙여 적어 발급한다.","a":"X","e":"재화 또는 용역을 공급한 후 공급시기가 속하는 과세기간 종료 후 25일 이내에 내국신용장이 개설되었거나 구매확 인서가 발급된 경우에는 내국신용장 등이 개설된 경우 그 작성일자는 처음 세금계산서 작성일자를 적고 비고란에 내국신용장 개설일 등을 덧붙여 적어 발급한다. 信号杯","pg":188},{"id":1005,"ch":17,"n":25,"q":"필요적 기재사항 등이 착오 외의 사유로 잘못 적힌 경우(과 세표준 또는 세액을 경정할 것을 미리 알고 있는 경우는 제 외) 재화나 용역의 공급일이 속하는 과세기간에 대한 확정 신고기한 이내에 세금계산서를 작성하되, 처음에 발급한 세 금계산서의 내용대로 세금계산서를 검은색 글씨로 작성하여 발급하고, 수정하여 발급하는 세금계산서는 붉은색 글씨로 쓰거나 음의 표시를 하여
