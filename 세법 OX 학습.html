하는 경우에는 그 기간은 5년으 로 한다.","pg":61},{"id":319,"ch":6,"n":46,"q":"체납된 국세의 납부고지서별 · 세목별 세액이 100만원 미만 인 경우에는 지정납부기한의 다음 날부터(원천징수 등 납 부지연가산세의 경우, 법정납부기한의 다음 날부터) 1일당 100,000분의 22의 가산세를 적용하지 않는다.","a":"X","e":"체납된 국세의 납부고지서별 · . 세목별 세액이 150만원 미 만인 경우에는 지정납부기한의 다음 날부터(원천징수 등 납부지연가산세의 경우, 법정납부기한의 다음 날부터) 1 일당 100,000분의 22의 가산세를 적용하지 않는다.","pg":61},{"id":320,"ch":6,"n":47,"q":"원천징수 등 납부지연가산세가 적용되는 부분에 대해서는 국세의 납부와 관련하여 납부지연가산세를 적용하지 않는 다.","a":"O","e":"","pg":61},{"id":321,"ch":6,"n":48,"q":"중간예납·예정신고납부 및 중간신고납부와 관련하여 납부 지연가산세가 부과되는 부분은 확정신고납부와 관련하여 납 부지연가산세를 적용한다.","a":"X","e":"중간예납·예정신고납부 및 중간신고납부와 관련하여 납 부지연가산세가 부과되는 부분에는 확정신고납부와 관련 하이 남부지인가산세를 적용하지 아니한다.","pg":62},{"id":322,"ch":6,"n":49,"q":"「부가가치세법」에 따라 납부의무가 면제되는 간이과세자(공 급대가 4,800만원 미만)인 경우에는 무신고가산세 및 과소 신고·초과환급신고가산세를 적용하지 않는다.","a":"X","e":"「부가가치세법」에 따라 납부의무가 면제되는 간이과세자 (공급대가 4,800만원 미만)인 경우에는 무신고가산세를 적용하지 않는다.","pg":62},{"id":323,"ch":6,"n":50,"q":"「부가가치세법」에 따른 사업자가 부가가치세 납부기한까지 어느 사업장에 대한 부가가치세를 다른 사업장에 대한 부가 가치세에 더하여 신고납부한 경우 납부지연가산세 중 미달 납부·초과환급세액의 100분의 3에 상당하는 금액의 가산 세를 적용하지 아니한다.","a":"X","e":"「부가가치세법」에 따른 사업자가 부가가치세 납부기한까 지 어느 사업장에 대한 부가가치세를 다른 사업장에 대한 부가가치세에 더하여 신고납부한 경우 납부지연가산세 중미달납부 • 초과환급세액의 1일당 100,000분의 22에 상당하는 금액의 가산세(법정납부기한의 다음 날부터 납 부고지일의 전날까지의 기간에 한정)를 적용하지 아니한 다.","pg":62},{"id":324,"ch":6,"n":51,"q":"원천징수의무자가 국가·지방자치단체 또는 지방자치단체 조합인 경우에는 원천징수 등 납부지연가산세를 적용하지 아니한다.","a":"O","e":"","pg":62},{"id":325,"ch":6,"n":52,"q":"정부는 국세기본법」또는 세법에 따라 가산세를 부과하는 경우 그 부과의 원인이 되는 사유가 「국세기본법」에 따른 기 한연장 사유에 해당하는 경우에는 해당 가산세의 50%를 감 면한다.","a":"X","e":"정부는 「국세기본법」 또는 세법에 따라 가산세를 부과하 는 경우 그 부과의 원인이 되는 사유가 「국세기본법」에 따 른 기한연장 사유에 해당하는 경우에는 해당 가산세를 부 과하지 않는다. 즉, 50% 감면이 아닌 100% 감면사유에 해당한다.","pg":62},{"id":326,"ch":6,"n":53,"q":"「국세기본법」또는 세법에 따라 가산세를 부과하는 경우로 서 납세자가 의무를 이행하지 아니한 데 대한 정당한 사유 가 있는 경우 해당 가산세를 부과하지 아니한다.","a":"O","e":"","pg":62},{"id":327,"ch":6,"n":54,"q":"정부는 「국세기본법」 또는 세법에 따라 가산세를 부과할 때 세법해석에 관한 질의회신 등에 따라 신고·납부하였으나 이후 다른 과세처분을 하는 경우 해당 가산세의 50%를 감 면한다.","a":"X","e":"정부는 「국세기본법」 또는 세법에 따라 가산세를 부과할 때 세법해석에 관한 질의회신 등에 따라 신고·납부하 였으나 이후 다른 과세처분을 하는 경우 해당 가산세를 부과하지 않는다. 즉, 50% 감면이 아닌 100% 감면사유 에 해당한다.","pg":63},{"id":328,"ch":6,"n":55,"q":"과세표준신고서를 법정신고기한까지 제출한 자가 법정신고 기한이 지난 후 6개월 이내에 수정신고를 한 경우에는 해당 가산세액에서 일정액을 감면한다. 이때, 과세표준과 세액을 경정할 것을 미리 알고 과세표준수정신고서를 제출한 경우 에도 감면대상에 포함한다.","a":"X","e":"과세표준신고서를 법정신고기한까지 제출한 자가 법정신 고기한이 지난 후 2년 이내에 수정신고를 한 경우에는 해 당 가산세액에서 일정액을 감면한다. 단, 과세표준과 세 액을 경정할 것을 미리 알고 과세표준수정신고서를 제출 한 경우에는 감면대상에서 제외한다.","pg":63},{"id":329,"ch":6,"n":56,"q":"과세표준신고액에 상당하는 세액을 자진납부하는 국세에 관 하여 수정신고를 한 자는 과소신고세액 등을 추가로 납부하 여야 하는데 이를 납부하지 않은 경우에는 수정신고에 따른 과소신고가산세를 감면해주지 않는다.","a":"X","e":"과세표준신고액에 상당하는 세액을 자진납부하는 국세에 관하여 수정신고를 한 자는 과소신고세액 등을 추가로 납 부하여야 하는데 수정신고만 하고 납부하지 않은 경우에 도 가산세를 감면한다.","pg":63},{"id":330,"ch":6,"n":57,"q":"법정신고기한이 지난 후 6개월 초과 1년 이내에 「국세기본 법」에 따라 수정신고한 경우에는 과소신고 · 초과환급신고 가산세액의 20%에 상당하는 금액을 감면한다. 다만, 과세표 준과 세액을 경정할 것을 미리 알고 과세표준수정신고서를 제출한 경우는 제외한다.","a":"X","e":"법정신고기한이 지난 후 6개월 초과 1년 이내에 「국세기 본법」에 따라 수정신고한 경우에는 과소신고 · 초과환급 신고 가산세액의 30%에 상당하는 금액을 감면한다. 다 만, 과세표준과 세액을 경정할 것을 미리 알고 과세표준 수정신고서를 제출한 경우는 제외한다.","pg":63},{"id":331,"ch":6,"n":58,"q":"과세표준신고서를 법정신고기한까지 제출한 자가 해당 국세 에 관하여 관할 세무서장으로부터 과세자료 해명 통지를 받 고 법정신고기한이 지난 후 3개월 초과 6개월 이내에 과세 표준수정신고서를 제출한 경우에는 해당 가산세액의 50%에 상당하는 금액을 감면한다.","a":"X","e":"과세표준신고서를 법정신고기한까지 제출한 자가 법정신 고기한이 지난 후 3개월 초과 6개월 이내에 과세표준수 정신고서를 제출한 경우에는 해당 가산세액의 50%에 상 당하는 금액을 감면한다. 그러나 해당 국세에 관하여 관 할 세무서장으로부터 과세자료 해명 통지를 받고 과세표 준수정신고서를 제출한 경우에는 감면하지 아니한다.","pg":63},{"id":332,"ch":6,"n":59,"q":"법정신고기한이 지난 후 「국세기본법」에 따라 기한후신고납 부를 한 경우에 그 신고납부가 법정신고기한이 지난 후 1개 월 이내에 이루어진 경우에는 무신고가산세의 90%에 상당 하는 금액을 감면한다. 다만, 과세표준과 세액을 결정할 것 을 미리 알고 기한후과세표준신고서를 제출한 경우는 제외 한다.","a":"X","e":"법정신고기한이 지난 후 「국세기본법」에 따라 기한후신고 납부를 한 경우에 그 신고납부가 법정신고기한이 지난 후 1개월 이내에 이루어진 경우에는 무신고가산세의 50%에 0 상당하는 금액을 감면한다. 다만, 과세표준과 세액을 결 정할 것을 미리 알고 기한후과세표준신고서를 제출한 경 우는 제외한다. 비교 과세표준신고서를 법정신고기한까지 제출한 자가 법정신고기한 이 지난 후 1개월 이내에 과세표준수정신고서를 제출한 경우에는 해 당 가산세액의 90%에 상당하는 금액을 감면함","pg":64},{"id":333,"ch":6,"n":60,"q":"과세전적부심사 결정 통지기간에 그 결과를 통지하지 않은 경우에는 결정 •통지가 지연됨으로써 해당 기간에 부과되는 신고·납부 관련 가산세의 50%를 감면한다.","a":"X","e":"과세전적부심사 결정 통지기간에 그 결과를 통지하지 않은 경우에는 결정. 통지가 지연됨으로써 해당 기간에 부과되는 납부지연가산세의 50%를 감면한다. ・・・ 444 신고 관련 가산세가 아님 주의","pg":64},{"id":334,"ch":6,"n":61,"q":"세법에 따른 제출 등(제출, 신고, 가입, 등록, 개설)의 기한이 지난 후 6개월 이내에 해당 세법에 따른 제출 등의 의무를 이행하는 경우 제출 등의 의무위반에 대하여 세법에 따라 부과되는 가산세의 50%를 감면한다.","a":"X","e":"세법에 따른 제출 등(제출, 신고, 가입, 등록, 개설)의 기 한이 지난 후 1개월 이내에 해당 세법에 따른 제출 등의 의무를 이행하는 경우 제출 등의 의무위반에 대하여 세법 에 따라 부과되는 가산세의 50%를 감면한다.","pg":64},{"id":335,"ch":6,"n":62,"q":"「소득세법」상 지급명세서 제출의무를 부담하는 자가 이를 고의적으로 위반한 경우에는 가산세의 한도를 두지 아니한 다.","a":"O","e":"지급명세서제출불성실가산세, 계산서불성실가산세 등 단 순위반과 관련된 가산세에 대해서는 그 의무위반의 종류 별로 각각 1억원(중소기업은 5천만원)을 한도로 두지만, 해당 의무를 고의적으로 위반한 경우에는 그러하지 아니 한다.","pg":64},{"id":336,"ch":7,"n":1,"q":"2020년 1월 1일 이후 국세를 환급하는 분부터 과세의 대상 이 되는 소득의 귀속이 명의일 뿐이고 실질귀속자가 따로 있어 명의대여자에 대한 과세를 취소하고 실질귀속자를 납 세의무자로 하여 과세하는 경우 명의대여자 대신 실질귀속 자가 납부한 것으로 확인된 금액은 실질귀속자의 기납부세 액으로 먼저 공제하고 남은 금액이 있는 경우에는 실질귀속 자에게 환급한다.","a":"O","e":"10","pg":65},{"id":337,"ch":7,"n":2,"q":"과세의 대상이 되는 소득, 수익, 재산, 행위 또는 거래의 귀 속이 명의일 뿐이고 사실상 귀속되는 자가 따로 있어 명의 대여자에 대한 과세를 취소하고 실질귀속자를 납세의무자 로 하여 과세하는 경우 명의대여자 대신 실질귀속자가 납부 한 것으로 확인된 금액은 명의대여자의 기납부세액으로 먼 저 공제하고 남은 금액이 있는 경우에는 명의대여자에게 환 급한다.","a":"X","e":"과세의 대상이 되는 소득, 수익, 재산, 행위 또는 거래의 귀속이 명의일 뿐이고 사실상 귀속되는 자가 따로 있어 명의대여자에 대한 과세를 취소하고 실질귀속자를 납세 의무자로 하여 과세하는 경우 명의대여자 대신 실질귀속 자가 납부한 것으로 확인된 금액은 실질귀속자의 기납부 세액으로 먼저 공제하고 남은 금액이 있는 경우에는 실질 귀속자에게 환급한다.","pg":65},{"id":338,"ch":7,"n":3,"q":"납세자는 국세환급금에 관한 권리를 법령에 정하는 바에 따 라 타인에게 양도할 수 있다.","a":"O","e":"","pg":65},{"id":339,"ch":7,"n":4,"q":"납세자는 국세환급금통지서를 받은 후 해당 국세환급금에 관한 권리를 타인에게 양도하고자 하는 경우 문서로 관할 세무서장에게 요구해야 한다.","a":"X","e":"국세환급금에 관한 권리를 타인에게 양도할 수 있으나 이 때 환급금채권자는 세무서장이 국세환급금통지서를 발급 하기 전에 문서로 관할 세무서장에게 요구해야 한다.","pg":65},{"id":340,"ch":7,"n":5,"q":"세무서장은 국세환급금으로 결정한 금액을 납세자의 동의와 관계없이 법령으로 정하는 바에 따라 '세법에 따라 자진납부 하는 국세'에 충당하여야 한다.","a":"X","e":"국세환급금으로 세법에 따라 자진납부하는 국세에 충당 하는 경우에는 납세자가 그 충당에 동의해야 하며 세무서 장이 임의로 충당할 수 없다.","pg":65},{"id":341,"ch":7,"n":6,"q":"국세환급금으로 세법에 따라 자진납부하는 국세에 충당하는 경우에는 납세자가 그 충당에 동의해야 하는 것은 아니다.","a":"X","e":"납부고지에 의하여 납부하는 국세 및 세법에 따라 자진납 부하는 국제는 납세자가 그 충당에 동의하는 경우에만 충 당하며, 세무서장이 임의로 충당할 수 없다. 다만, 납부 고지에 의해 납부하는 국세의 경우 '납부기한 전 징수 사 유'에 해당하면 동의 없이 충당이 가능하다.","pg":66},{"id":342,"ch":7,"n":7,"q":"세무서장은 국세환급금으로 결정한 금액을 납세자의 동의와 관계없이 법령으로 정하는 바에 따라 '체납된 국세 및 강제 징수비'에 충당하여야 한다.","a":"O","e":"","pg":66},{"id":343,"ch":7,"n":8,"q":"세무서장은 국세환급금으로 결정한 금액을 체납된 국세 및 강제징수비에 충당하는 경우 체납된 국세· 강제징수비와 국 세환급금은 체납된 국세의 지정납부기한과 국세환급금 발생 일 중 빠른 때로 소급하여 대등액에 관하여 소멸한 것으로 본다.","a":"X","e":"세무서장은 국세환급금으로 결정한 금액을 체납된 국세 및 강제징수비에 충당하는 경우 체납된 국세· 강제징수 비와 국세환급금은 체납된 국세의 법정납부기한과 국세 환급금 발생일 중 늦은 때로 소급하여 대등액에 관하여 소멸한 것으로 본다.","pg":66},{"id":344,"ch":7,"n":9,"q":"세법에 따라 환급받을 세액이 있는 경우로서 납세자가 그 환급세액을 납부고지에 의하여 납부하는 국세' 및 '세법에 따라 자진납부하는 국세에 충당할 것을 청구할 수 있으며 이 경우 충당된 세액의 충당한 날에 해당 국세를 납부한 것 으로 본다.","a":"X","e":"세법에 따라 환급받을 세액이 있는 경우로서 납세자가 그 환급세액을 납부고지에 의하여 납부하는 국세' 및 '세법 0 에 따라 자진납부하는 국세'에 충당할 것을 청구할 수 있 으며 이 경우 충당된 세액의 충당청구를 한 날에 해당 국 세를 납부한 것으로 본다.","pg":66},{"id":345,"ch":7,"n":10,"q":"원천징수의무자가 원천징수하여 납부한 세액에서 환급받을 세액이 있는 경우 그 환급세액은 그 원천징수의무자에게 즉 시 환급하는 것이 원칙이다.","a":"X","e":"원천징수의무자가 원천징수하여 납부한 세액에서 환급받 을 세액이 있는 경우 그 환급세액은 그 원천징수의무자가 원천징수하여 납부하여야 할 세액에 충당하고, 남은 금액 을 환급하는 것이 원칙이다. ) 원천징수의무자가 원천징수하여 납부한 세액에서 환급받을 환 급세액이 있는 경우로서 원천징수의무자가 그 환급액을 즉시 환급해 줄 것을 요구하는 경우나 원천징수하여 납부하여야 할 세액이 없는 경우에는 그 즉시 환급한다.","pg":66},{"id":346,"ch":7,"n":11,"q":"납세자가 납부고지에 의하여 납부하는 국세에 충당하는 것 을 동의하거나 신청한 경우에는 납부고지에 의하여 납부하 는 국세에 우선 충당한다.","a":"O","e":"","pg":67},{"id":347,"ch":7,"n":12,"q":"충당할 국세환급금이 2건 이상인 경우에는 소멸시효가 나중 에 도래하는 것부터 충당해야 한다.","a":"X","e":"충당할 국세환급금이 2건 이상인 경우에는 소멸시효가 먼저 도래하는 것부터 충당해야 한다.","pg":67},{"id":348,"ch":7,"n":13,"q":"국세환급금 중 충당한 후 남은 금액은 국세환급금의 결정을 한 날의 다음날 즉시 납세자에게 지급해야 한다.","a":"X","e":"국세환급금 중 충당한 후 남은 금액은 국세환급금의 결정 을 한 날부터 30일 내에 납세자에게 지급해야 한다.","pg":67},{"id":349,"ch":7,"n":14,"q":"국세환급금 중 충당한 후 남은 금액이 10만원 이하이고, 지 급을 결정한 날부터 6개월 이내에 환급이 이루어지지 아니 하는 경우에는 납부고지에 의하여 납부하는 국세에 충당할 수 있다. 이 경우 납세자의 충당에 대한 동의가 있는 것으로 본다.","a":"X","e":"국세환급금 중 충당한 후 남은 금액이 20만원 이하이고, 지급을 결정한 날부터 1년 이내에 환급이 이루어지지 아 니하는 경우에는 납부고지에 의하여 납부하는 국세에 충 당할 수 있다. 이 경우 납세자의 충당에 대한 동의가 있는 것으로 본다.","pg":67},{"id":350,"ch":7,"n":15,"q":"세무서장이 국세환급금의 결정이 취소됨에 따라 이미 충당 되거나 지급된 금액의 반환을 청구하는 경우에는 고지와 독 촉의 절차 없이 해당 납세자의 재산에 대하여 압류를 행한 다.","a":"X","e":"세무서장이 국세환급금의 결정이 취소됨에 따라 이미 충 당되거나 지급된 금액의 반환을 청구하는 경우에는 「국세 징수법」의 고지 · 독촉 및 강제징수의 규정을 준용한다.","pg":67},{"id":351,"ch":7,"n":16,"q":"납세자의 국세환급금과 국세환급가산금에 관한 권리는 '행 사할 수 있는 때'부터 10년간 행사하지 않으면 소멸시효가 완성된다.","a":"X","e":"납세자의 국세환급금과 국세환급가산금에 관한 권리는 '행사할 수 있는 때'부터 5년간 행사하지 않으면 소멸시효 가 완성된다.","pg":67},{"id":352,"ch":7,"n":17,"q":"국세환급금과 국세환급가산금을 과세처분의 취소 또는 무효 확인청구의 소 등 행정소송으로 청구한 경우 시효의 중단에 관하여 「민법」상 소멸시효의 중단 사유 중 하나인 '청구'를 한 것으로 본다.","a":"O","e":"","pg":67},{"id":353,"ch":7,"n":18,"q":"세무서장이 납세자의 환급청구를 촉구하기 위하여 납세자에 게 환급청구의 안내 •통지 등을 하는 경우 국세환급금 소멸 시효는 중단된다.","a":"X","e":"국세환급금 소멸시효는 세무서장이 납세자의 환급청구를 촉구하기 위하여 납세자에게 하는 환급청구의 안내 · 통 지 등으로 인하여 중단하지 않는다.","pg":68},{"id":354,"ch":7,"n":19,"q":"납세자가 상속세를 물납한 후 그 부과의 전부 또는 일부를 취소하거나 감액하는 경정 결정에 따라 환급하는 경우에는 해당 물납재산으로 환급해야 하며 국세환급가산금을 지급해 야 한다.","a":"X","e":"납세자가 상속세를 물납한 후 그 부과의 전부 또는 일부 를 취소하거나 감액하는 경정 결정에 따라 환급하는 경우 에는 해당 물납재산으로 환급해야 한다. 이 경우 국세환 급가산금은 지급하지 않는다.","pg":68},{"id":355,"ch":7,"n":20,"q":"납세자가 상속세를 믈납한 후 그 부과의 전부 또는 일부를 취소하거나 감액하는 경정 결정에 따라 환급하는 경우 해당 물납재산이 매각된 경우에만 금전으로 환급해야 한다.","a":"X","e":"납세자가 상속세를 물납한 후 그 부과의 전부 또는 일부 를 취소하거나 감액하는 경정 결정에 따라 환급할 때 다 음에 해당하는 경우에는 금전으로 환급해야 한다. ① 해당 물납재산이 매각된 경우 ② 해당 물납재산의 성질상 분할하여 환급하는 것이 곤란한 경우 ③ 해당 물납재산이 임대 중이거나 다른 행정용도로 사용되고 있는 경우 ④ 사용계획이 수립되어 해당 물납재산으로 환급하는 것이 곤란하다고 인정되는 경우 등 국세청장이 정 하는 경우 따라서 해당 물납재산이 매각된 경우 외에도 금전으로 환 급하는 사유들이 있다.","pg":68},{"id":356,"ch":7,"n":21,"q":"납세자가 상속세를 물납한 후 그 부과의 전부 또는 일부를 취소하거나 감액하는 경정 결정에 따라 환급하는 경우로서 납세자의 신청이 없는 경우에는 「상속세 및 증여세법」 시행 령에 따른 물납충당재산의 허가 순서대로 환급한다.","a":"X","e":"납세자가 상속세를 물납한 후 그 부과의 전부 또는 일부 를 취소하거나 감액하는 경정 결정에 따라 환급하는 경우 로서 납세자의 신청이 없는 경우에는 「상속세 및 증여세 법」시행령에 따른 물납충당재산의 허가 순서의 역순으로 환급한다.","pg":68},{"id":357,"ch":7,"n":22,"q":"물납재산으로 환급하는 경우에 국가가 물납재산에 대하 여 자본적 지출을 한 경우에는 이를 국가의 부담으로 한다.","a":"X","e":"물납재산으로 환급하는 경우에 국가가 물납재산에 대하 여 자본적 지출을 한 경우에는 이를 납세자의 부담으로 한다. 비교 국가가 물납재산을 유지관리하기 위하여 지출한 비용은 국가 의 부담으로 함","pg":69},{"id":358,"ch":7,"n":23,"q":"물납재산이 수납된 이후에 발생한 법정과실은 국가에 귀속되 며 천연과실은 납세자에게 귀속된다.","a":"X","e":"물납재산이 수납된 이후에 발생한 법정과실 및 천연과실 은 납세자에게 환급하지 않고 국가에 귀속된다.","pg":69},{"id":359,"ch":7,"n":24,"q":"「국세기본법」에 따른 경정 등의 청구, 「감사원법」에 따른 심 사청구 또는 「행정소송법」에 따른 소송에 대한 결정이나 판 결 또는 「국세기본법」에 따른 심판청구 등의 사유 없이 법령 으로 정하는 고충민원의 처리에 따라 국세환급금을 충당하 거나 지급하는 경우에는 국세환급가산금을 지급하지 아니한 다.","a":"O","e":"","pg":69},{"id":360,"ch":7,"n":25,"q":"국세환급가산금은 국세환급가산금 기산일부터 지급하는 날 (또는 충당하는 날)의 전날까지의 기간에 대하여 계산한다.","a":"X","e":"국세환급가산금은 국세환급가산금 기산일부터 지급결정 을 하는 날(또는 충당하는 날)까지의 기간에 대하여 계산 한다.","pg":69},{"id":361,"ch":7,"n":26,"q":"착오납부, 이중납부 또는 납부 후 그 납부의 기초가 된 신고 또는 부과를 경정(경정청구 포함)하거나 취소함에 따라 발생 한국세환급금의 발생일은 국세 납부일이다.","a":"O","e":"","pg":69},{"id":362,"ch":7,"n":27,"q":"적법하게 납부된 국세의 감면으로 발생한 국세환급금의 국 세환급가산금 기산일은 감면 결정일이다.","a":"X","e":"적법하게 납부된 국세의 감면으로 발생한 국세환급금의 국세환급가산금 기산일은 감면 결정일의 다음 날이다. \"국세환급가산금의 발생일은 감면 결정일이다.","pg":69},{"id":363,"ch":7,"n":28,"q":"적법하게 납부된 후 법률이 개정되어 발생한 국세환급금의 국세환급가산금 기산일은 국세 납부일의 다음 날이다.","a":"X","e":"적법하게 납부된 후 법률이 개정되어 발생한 국세환급금 의 국세환급가산금 기산일은 개정된 법률의 시행일의 다 음 날이다.","pg":70},{"id":364,"ch":7,"n":29,"q":"「소득세법」 「법인세법」 「부가가치세법」, 「개별소비세법」 또 는 「주세법」에 따른 환급세액의 신고 환급신청, 경정 또는 결정으로 인하여 환급하는 경우의 국세환급가산금 기산일은 신고를 한 날(신고한 날이 법정신고기일 전인 경우에는 해당 법정신고기일) 또는 신청을 한 날의 다음 날이다.","a":"X","e":"「소득세법」, 「법인세법」, 「부가가치세법」, 「개별소비세법」 또는 「주세법」에 따른 환급세액의 신고, 환급신청, 경정 또는 결정으로 인하여 환급하는 경우의 국세환급가산금 기산일은 신고를 한 날(신고한 날이 법정신고기일 전인 경우에는 해당 법정신고기일) 또는 신청을 한 날부터 30 일이 지난 날의 다음 날이다.","pg":70},{"id":365,"ch":7,"n":30,"q":"적법하게 납부된 국세의 감면으로 환급하는 경우의 국세환 급금의 발생일은 그 감면 결정일이다.","a":"O","e":"","pg":70},{"id":366,"ch":7,"n":31,"q":"적법하게 납부된 후 법률이 개정되어 환급하는 경우의 국세 환급금의 발생일은 당초 과세표준 신고일이다.","a":"X","e":"적법하게 납부된 후 법률이 개정되어 환급하는 경우의 국 세환급금의 발생일은 그 개정된 법률의 시행일이다.","pg":70},{"id":367,"ch":7,"n":32,"q":"원천징수의무자가 연말정산 또는 원천징수하여 납부한 세액 을 경정청구에 따라 환급하는 경우의 국세환급금의 발생일 은 그 경정청구일이다.","a":"X","e":"원천징수의무자가 연말정산 또는 원천징수하여 납부한 세액을 경정청구에 따라 환급하는 경우의 국세환급금의 발생일은 연말정산세액 또는 원천징수세액 납부기한의 만료일이다.","pg":70},{"id":368,"ch":7,"n":33,"q":"「조세특례제한법」에 따라 근로장려금을 환급하는 경우의 국 세환급금의 발생일은 근로장려금의 결정일이다.","a":"O","e":"","pg":70},{"id":369,"ch":8,"n":1,"q":"국세에 관한 처분에 대하여는 「국세기본법」의 규정에 따른 불복방법뿐만 아니라 「감사원법」의 규정에 따른 불복방법 도 있기 때문에 두 가지 불복방법을 동시에 이용할 수 있다.","a":"X","e":"불복청구를 하고자 할 때 「국세기본법」에 의한 불복절차 규정과 감사원법」에 의한 불복절차규정을 선택하여 적용 할 수 있다. 다만. 이를 중복하여 적용할 수는 없다.","pg":71},{"id":370,"ch":8,"n":2,"q":"세법상의 처분에 의해 권리나 이익의 침해를 당한 자가 심 사청구 또는 심판청구를 하기 위해서는 「국세기본법」에 따 라 관할 세무서장 또는 관할 지방국세청장에게 이의신청을 거쳐야 한다.","a":"X","e":"불복청구인은 관할 세무서장 또는 관할 지방국세청장에 게 이의신청을 할 수도 있으며, 이의신청 없이 곧바로 심 사청구 또는 심판청구를 할 수 있다. 즉, 이의신청은 불복 청구인의 선택 사항이다.","pg":71},{"id":371,"ch":8,"n":3,"q":"불복의 대상인 처분이 국세청장 또는 관할 지방국세청장이 조사·결정 또는 처리하였거나 하였어야 할 것인 경우에는 이의신청이 배제된다.","a":"X","e":"불복의 대상인 처분이 국세청장이 조사. 결정 또는 처리 하였거나 하였어야 할 것인 경우에는 이의신청이 배제된 다.","pg":71},{"id":372,"ch":8,"n":4,"q":"「국세기본법」은 「국세기본법」또는 세법에 의한 위법·부당 한 처분을 받은 경우에는 우선 「행정심판법」에 의한 심사청 구·심판청구를 하도록 하고 있다.","a":"X","e":"「국세기본법」은 「국세기본법」 또는 세법에 의한 위법·부 당한 처분을 받은 경우에는 우선 「국세기본법」에 의한 심 사청구·심판청구를 하도록 하고 있다.","pg":71},{"id":373,"ch":8,"n":5,"q":"위법한 처분에 대한 행정소송은 「행정소송법」에도 불구하고 「국세기본법」에 따른 심사청구 · 심판청구와 그에 대한 결정 또는 「감사원법」에 따른 심사청구와 그에 대한 결정을 거치 지 아니하면 제기할 수 없다.","a":"O","e":"","pg":71},{"id":374,"ch":8,"n":6,"q":"위법 또는 부당한 처분에 대하여 감사원 심사청구를 거친 경우에는 바로 행정소송을 제기할 수 없다.","a":"X","e":"위법 또는 부당한 처분에 대하여 감사원 심사청구를 거친 경우에는 바로 행정소송을 제기할 수 있다.","pg":71},{"id":375,"ch":8,"n":7,"q":"심사청구 또는 심판청구에 대한 재조사 결정에 따른 처분청 의 처분에 대한 행정소송은 심사청구 또는 심판청구를 거치 지 않고는 제기할 수 없다.","a":"X","e":"심사청구 또는 심판청구에 대한 재조사 결정에 따른 처분 청의 처분에 대한 행정소송은 심사청구 또는 심판청구를 거치지 않고도 제기할 수 있다.","pg":72},{"id":376,"ch":8,"n":8,"q":"국세 처분에 대한 행정소송은 「행정소송법」에도 불구하고 심사청구·심판청구에 대한 결정의 통지를 받은 날부터 90 일 이내에 제기하여야 하는 것이 원칙이나 결정기간 내에 결정의 통지를 받지 못한 경우라면 결정의 통지를 받은 날 부터 행정소송을 제기할 수 있다.","a":"X","e":"국세 처분에 대한 행정소송은 행정소송법」에도 불구하 고 심사청구 · 심판청구에 대한 결정의 통지를 받은 날부 터 90일 이내에 제기하여야 하나 결정기간 내에 결정의 통지를 받지 못한 경우에는 결정의 통지를 받기 전이라도 그 결정기간이 지난 날부터 행정소송을 제기할 수 있다.","pg":72},{"id":377,"ch":8,"n":9,"q":"국세청의 감사결과로서의 시정지시에 따른 처분에 대하여 불복하려는 자는 이의신청을 거친 후에 또는 이의신청을 거 치지 아니하고, 심사청구 또는 심판청구를 제기할 수 있다.","a":"X","e":"국세청의 감사결과로서의 시정지시에 따른 처분에 대해 서는 이의신청 없이 바로 심사청구 또는 심판청구를 하여 야 한다.","pg":72},{"id":378,"ch":8,"n":10,"q":"지방국세청장의 조사에 따라 과세처분을 한 경우 이의신청 없이 바로 심사청구 또는 심판청구를 하여야 한다.","a":"X","e":"이의신청은 해당 처분을 하였거나 하였어야 할 세무서장 에게 하거나 세무서장을 거쳐 관할 지방국세청장에게 하 여야 하지만 지방국세청장의 조사에 따라 과세처분을 한 경우 이의신청은 관할 지방국세청장에게 하여야 하며, 세 무서장에게 한 신청은 관할 지방국세청장에게 한 것으로 보며, 이의신청은 선택적 절차다. 비교 세법에 따라 국세청장이 하여야 할 처분에 대해서는 이의신청 없이 바로 심사청구 또는 심판청구를 해야 함","pg":72},{"id":379,"ch":8,"n":11,"q":"이의신청을 받은 세무서장과 지방국세청장은 국세심사위원 회의 의결에 따라 결정하여야 한다.","a":"X","e":"이의신청을 받은 세무서장과 지방국세청장은 각각 국세 심사위원회의 심의를 거쳐 결정하여야 한다.","pg":72},{"id":380,"ch":8,"n":12,"q":"「국세기본법」상 불복 청구의 대상이 되는 처분은 「국세기본 법」또는 세법의 규정과 다른 처분 또는 외견상 세법의 규정 을 따르고 있지만 과세형평을 침해하는 처분 등을 포함하는 것으로 국세의 부과처분뿐만 아니라 압류·매각· 청산 등의 강제징수도 포함한다.","a":"O","e":"","pg":73},{"id":381,"ch":8,"n":13,"q":"특정 법인의 법인세 과세표준을 결정 또는 경정하는 경우. 「법인세법」에 따라 처분되는 배당과 관련하여 그 법인이 소 득금액변동통지를 받는 경우 당해 소득금액변동통지는 행정 소송의 대상이 되는 처분에 해당한다.","a":"O","e":"비교 소득의 귀속자에 대한 소득금액변동통지는 행정소송의 대상이 되는 처분에 해당되지 않음에 주의","pg":73},{"id":382,"ch":8,"n":14,"q":"「국세기본법」상 불복청구의 대상인 '이 법 또는 세법에 따른 처분'에는 세무조사결정은 포함되지 않는다.","a":"X","e":"「국세기본법」상 불복청구의 대상인'이 법 또는 세법에 따 른 처분'에는 세무조사 결정도 포함된다.","pg":73},{"id":383,"ch":8,"n":15,"q":"「조세범 처벌절차법」에 따른 통고처분에 대해서 불복청구를 할 수 있다.","a":"X","e":"「조세범 처벌절차법」에 따른 통고처분에 대해서는 불복할 수 없다.","pg":73},{"id":384,"ch":8,"n":16,"q":"「국세기본법」 및 세법에 따른 과태료 부과처분 대해서는 국 세기본법」에 따른 불복을 할 수 있다.","a":"X","e":"「국세기본법」 및 세법에 따른 과태료 부과처분 대해서는 「국세기본법」에 따른 불복을 할 수 없다.","pg":73},{"id":385,"ch":8,"n":17,"q":"「감사원법」에 따라 심사청구를 한 처분이나 그 심사청구에 대한 처분에 대해서는 「국세기본법」에 따른 불복을 할 수 없 다.","a":"O","e":"","pg":73},{"id":386,"ch":8,"n":18,"q":"재조사 결정에 따른 처분청의 처분에 대해서는 해당 재조사 결정을 한 재결청에 대하여 심사청구 또는 심판청구를 제기 할 수 없다.","a":"X","e":"재조사 결정에 따른 처분청의 처분에 대해서는 해당 재조 사 결정을 한 재결청에 대하여 심사청구 또는 심판청구를 제기할 수 있다.","pg":73},{"id":387,"ch":8,"n":19,"q":"이의신청에 대한 처분과 재조사 결정에 따른 처분청의 처분 에 대해서는 이의신청을 할 수 없다.","a":"O","e":"","pg":74},{"id":388,"ch":8,"n":20,"q":"세법에 따른 처분에 의하여 권리를 침해당하게 될 제2차 납 세의무자로서 납부고지서를 받은 자나 납세보증인은 위법한 처분을 받은 자의 처분에 대하여 그 처분의 취소 또는 변경 을 청구할 수 있다.","a":"O","e":"","pg":74},{"id":389,"ch":8,"n":21,"q":"이의신청, 심사청구인 또는 심판청구인과 처분청은 변호 사 또는 세무사 또는 「세무사법」에 따른 세무사등록부 또는 공인회계사 세무대리업무등록부에 등록한 공인회계사를 대 리인으로 선임할 수 있다.","a":"O","e":"","pg":74},{"id":390,"ch":8,"n":22,"q":"불복청구금액이 5천만원(지방세는 2천만원) 미만인 경우(소 액심판)에는 그 배우자. 4촌 이내의 혈족 또는 그 배우자의 4촌 이내의 혈족을 대리인으로 선임할 수 있다.","a":"O","e":"","pg":74},{"id":391,"ch":8,"n":23,"q":"대리인은 본인을 위하여 그 신청 또는 청구에 관한 모든 행 위를 할 수 있으며 그 신청 또는 청구의 취하의 경우도 특별 한 위임 없이 할 수 있다.","a":"X","e":"대리인은 본인을 위하여 그 신청 또는 청구에 관한 모든 행위를 할 수 있으나 그 신청 또는 청구의 취하는 특별한 위임을 받은 경우에만 할 수 있다.","pg":74},{"id":392,"ch":8,"n":24,"q":"법인인 심판청구인이 심판청구의 대상 세목이 종합부동산세 이고 그 외 법에 정한 일정 요건을 모두 갖춘 경우 조세심판 원에 세무사를 국선대리인으로 선정하여 줄 것을 신청할 수 있다.","a":"X","e":"심판청구의 대상 세목이 상속세 · 증여세 및 종합부동산 세일 경우에는 심판청구인이 그 외 법에 정한 일정 요건 을 모두 갖춘 경우라 하더라도 조세심판원에 세무사 등을 국선대리인으로 선정하여 줄 것을 신청할 수 없다.","pg":74},{"id":393,"ch":8,"n":25,"q":"5천만원 이하의 법인세에 관련된 불복청구를 하는 법인(수 입금액 및 자산가액이 각각 5억원)인 이의신청인 등은 재결 청에 변호사, 세무사 또는 「세무사법」에 따라 등록한 공인회 계사를 국선대리인으로 선정하여 줄 것을 신청할 수 있다.","a":"X","e":"이의신청인 등이 법인인 경우 수입금액(기업회계기준에 따라 계산한 매출액)이 3억원 이하이고, 기업회계기준에 따라 계산한 자산가액이 5억원 이하이어야 국선대리인으 로 선정하여 줄 것을 신청할 수 있다.","pg":75},{"id":394,"ch":8,"n":26,"q":"대리인은 신청 또는 청구의 취하는 특별한 위임을 받은 경 우에만 할 수 있지만, 국선대리인은 본인을 위하여 그 신청 또는 청구의 취하를 포함한 그 신청 또는 청구에 관한 모든 행위를 할 수 있다.","a":"X","e":"국선대리인 또한 본인을 위하여 그 신청 또는 청구에 관 한 모든 행위를 할 수 있지만 그 신청 또는 청구의 취하는 특별한 위임을 받은 경우에만 할 수 있다.","pg":75},{"id":395,"ch":8,"n":27,"q":"조세조약에 따른 상호합의절차가 개시된 경우 상호합의절차 의 개시일부터 종료일까지의 기간은 청구기간과 결정기간에 산입한다.","a":"X","e":"조세조약에 따른 상호합의절차가 개시된 경우 상호합의 절차의 개시일부터 종료일까지의 기간은 청구기간과 결 정기간에 산입하지 아니한다.","pg":75},{"id":396,"ch":8,"n":28,"q":"청구기한까지 우편으로 제출한 불복청구서가 불복청구기간 을 지나서 도달한 경우 「우편법」에 따른 우편날짜도장이 찍 힌 날(우편날짜도장이 찍히지 않았거나 분명하지 않은 경우 에는 통상 걸리는 배송일수를 기준으로 발송한 날로 인정되 는 날)에 적법한 청구를 한 것으로 본다.","a":"X","e":"청구기한까지 우편으로 제출한 불복청구서가 불복청구기 간을 지나서 도달한 경우에도 그 기간의 만료일에 적법한 청구를 한 것으로 본다. 비교 우편으로 과세표준신고서 등을 제출할 경우 「우편법」에 따른 우편 날짜도장이 찍힌 날(우편 날짜도장이 찍히지 아니한 경우에는 통 상 걸리는 배송일수를 기준으로 발송한 날로 인정되는 날)에 신고되거 나 청구된 것으로 봄","pg":75},{"id":397,"ch":8,"n":29,"q":"불복청구인이 「국세기본법」에 따른 천재 등으로 인한 기한 연장 사유로 인해 법에 정한 청구기간 내에 이의신청 심사 청구 • . 심판청구 또는 행정소송 제기를 할 수 없는 경우에 는 그 사유가 소멸한 날부터 14일 이내에 이의신청 • 심사청 구 • 심판청구 또는 행정소송 제기를 할 수 있다.","a":"X","e":"불복청구인이 기한연장 사유로 인해 법에 정한 청구기간 내에 이의신청, 심사청구 또는 심판청구를 할 수 없는 경 우에는 그 사유가 소멸한 날부터 14일 이내에 이의신청. 심사청구 또는 심판청구를 할 수 있다. 행정소송의 제기 기간은 불변기간이므로 기한연장 사유가 있어도 연장되 지 않는다.","pg":75},{"id":398,"ch":8,"n":30,"q":"심사청구 또는 심판청구를 거친 후 행정소송 제기기간도 기 한연장사유가 있다면 연장된다.","a":"X","e":"심사청구 또는 심판청구를 거친 후 행정소송 제기기간은 불변기간이므로 기한연장사유가 있어도 연장되지 않는 다.","pg":76},{"id":399,"ch":8,"n":31,"q":"심판청구를 하려는 자는 대통령령으로 정하는 바에 따라 불 복의 사유 등이 기재된 심판청구서를 국세청장이나 조세심 판원장에게 제출하여야 한다. 이 경우 심판청구서를 받은 국 세청장은 이를 지체 없이 조세심판원장에게 송부하여야 한 다.","a":"X","e":"심판청구는 해당 처분을 하였거나 하였어야 할 세무서장 이나 조세심판원장에게 해야 한다. 이 경우 심판청구서를 받은 세무서장은 이를 지체 없이 조세심판원장에게 송부 해야 한다.","pg":76},{"id":400,"ch":8,"n":32,"q":"심판청구는 해당 처분을 하였거나 하였어야 할 세무서장이 나 세무서장을 거쳐 국세청장에게 해야 한다.","a":"X","e":"심판청구는 해당 처분을 하였거나 하였어야 할 세무서장 이나 조세심판원장에게 해야 한다. * 이 경우 심판청구서를 받은 세무서장은 이를 지체 없이 조세심판원장에게 송부해야 함","pg":76},{"id":401,"ch":8,"n":33,"q":"「국세기본법」에 따른 심사청구와 「감사원법」에 따른 심사청 구를 중복으로 제기한 경우 「국세기본법」에 따른 심사청구 를 제기한 것으로 본다.","a":"X","e":"「국세기본법」에 따른 심사청구와 「감사원법」에 따른 심사 청구를 중복으로 제기한 경우 「감사원법」에 따른 심사청 구를 제기한 것으로 본다.","pg":76},{"id":402,"ch":8,"n":34,"q":"이의신청, 심사청구 또는 심판청구를 하면 세법에 특별한 규정이 있는 경우를 제외하고는 그 결정이 있기 전까지 해 당 과세처분의 집행을 중지시킨다.","a":"X","e":"이의신청·심사청구 또는 심판청구를 하더라도 세법에 특별한 규정이 있는 경우를 제외하고는 해당 처분의 집행 에 효력을 미치지 아니하는 것이 원칙이다.","pg":76},{"id":403,"ch":8,"n":35,"q":"해당 재결청이 처분의 집행 또는 절차의 속행 때문에 이의 신청인 심사청구인 또는 심판청구인에게 중대한 손해가 생 기는 것을 예방할 필요성이 긴급하다고 인정할 때에는 처분 의 집행 또는 절차 속행의 전부 또는 일부의 정지를 결정할 수 있다.","a":"O","e":"","pg":76},{"id":404,"ch":8,"n":36,"q":"불복을 하더라도 압류 및 공매의 집행에 효력을 미치지 아 니하는 것이 원칙이다.","a":"X","e":"불복을 하더라도 세법에 특별한 규정이 있는 경우를 제외 하고는 해당 처분의 집행에 효력을 미치지 아니한다. 다 만. 재결청이 집행 정지의 필요성을 인정하는 경우 또는 압류한 재산의 공매의 경우에는 집행이 정지된다.","pg":77},{"id":405,"ch":8,"n":37,"q":"행정소송이 계속 중인 국세의 체납으로 압류한 재산(부패· 변질· 감량되기 쉬운 재산이 아님)은 소에 대한 판결이 확정 되기 전에 공매할 수 있다.","a":"X","e":"행정소송이 계속 중인 국세의 체납으로 압류한 재산은 그 소에 대한 판결이 확정되기 전에는 공매할 수 없다. 다 만, 부패·변질 또는 감량되기 쉬운 재산으로서 속히 매 각하지 아니하면 그 재산가액이 줄어들 우려가 있는 경우 에는 이를 공매할 수 있다.","pg":77},{"id":406,"ch":8,"n":38,"q":"심판청구인은 자신의 심판청구와 관련하여 법령이 정하는 바에 따라 해당 재결청에 의견진술을 할 수 있지만, 처분청 은 그러하지 아니하다.","a":"X","e":"심판청구에 있어서 심판청구인뿐만 아니라 해당 처분청 도 의견을 진술할 수 있다.","pg":77},{"id":407,"ch":8,"n":39,"q":"이의신청을 받은 세무서장과 지방국세청장은 그 신청을 받 은 날부터 30일 이내에 각각 국세심사위원회의 의결에 따라 결정해야 한다.","a":"X","e":"이의신청을 받은 세무서장과 지방국세청장은 그 신청을 받은 날부터 30일 이내에 각각 국세심사위원회의 심의를 거쳐 결정해야 한다. 비교 국세청장은 심사청구를 받으면 그 청구를 받은 날부터 90일 이내에 국세심사위원회의 의결에 따라 결정해야 함","pg":77},{"id":408,"ch":8,"n":40,"q":"국세청장은 심사청구의 내용이나 절차가 「국세기본법」또는 세법에 적합하지 아니하나 보정할 수 있다고 인정되면 20일 이내의 기간을 정하여 보정할 것을 요구할 수 있고, 보정할 사항이 경미한 경우에는 직권으로 보정할 수 있다.","a":"O","e":"","pg":77},{"id":409,"ch":8,"n":41,"q":"조세심판원장은 심판청구의 내용이나 절차가 「국세기본법」 또는 세법에 적합하지 않거나 보정할 수 있다고 인정되면 20일 이내의 기간을 정하여 보정할 것을 요구할 수 있다. 다 만, 보정할 사항이 경미한 경우에는 직권으로 보정할 수 있 다.","a":"X","e":"조세심판원장은 심판청구의 내용이나 절차가 「국세기본 법」또는 세법에 적합하지 않거나 보정할 수 있다고 인정 되면 상당한 기간을 정하여 보정할 것을 요구할 수 있다. 다만, 보정할 사항이 경미한 경우에는 직권으로 보정할 수 있다.","pg":77},{"id":410,"ch":8,"n":42,"q":"국세청장이 심사청구의 내용이나 절차가 「국세기본법」 또는 세법에 적합하지 아니하여 20일 이내의 기간을 정하여 보정 을 요구한 경우 그 보정기간은 심사청구기간에 산입하지 아 니하나 심사청구에 대한 결정기간에는 산입한다.","a":"X","e":"국세청장이 심사청구의 내용이나 절차가 「국세기본법」 또 는 세법에 적합하지 아니하여 20일 이내의 기간을 정하 여 보정을 요구한 경우 그 보정기간은 심사청구기간뿐 아 니라 심사청구에 대한 결정기간에도 산입하지 아니한다.","pg":78},{"id":411,"ch":8,"n":43,"q":"대리인이 아닌 자가 대리인으로서 불복을 청구하는 경우 그 청구를 기각하는 결정을 한다.","a":"X","e":"대리인이 아닌 자가 대리인으로서 불복을 청구하는 경우 그 청구를 각하하는 결정을 한다.","pg":78},{"id":412,"ch":8,"n":44,"q":"심판청구를 제기한 후 같은 날 심사청구를 제기한 경우에는 심사청구를 기각하는 결정을 한다.","a":"X","e":"심판청구를 제기한 후 같은 날 심사청구를 제기한 경우에 는 심사청구를 각하하는 결정을 한다.","pg":78},{"id":413,"ch":8,"n":45,"q":"납세의무자가 세법에 따른 과태료 부과처분의 취소를 구하 는 심판청구를 한 경우 조세심판원은 그를 심리하여 인용 또는 기각 결정을 하여야 한다.","a":"X","e":"「국세기본법」 및 세법에 따른 과태료 부과처분 처분에 대 해서는 「국세기본법」에 따른 불복을 할 수 없다. 심판청구 가 적법하지 아니한 경우 그 청구를 각하하는 결정을 한 다.","pg":78},{"id":414,"ch":8,"n":46,"q":"'각하' 결정은 본안심리의 결과 청구가 이유 없다고 판단하 여 청구인의 주장을 거부하는 결정을 말한다. ○","a":"X","e":"'기각' 결정은 본안심리의 결과 청구가 이유 없다고 판단 하여 청구인의 주장을 거부하는 결정을 말한다.","pg":78},{"id":415,"ch":8,"n":47,"q":"재조사 결정은 「국세기본법」에 규정되어 있지 아니하나 실 무상 사용하고 있는 결정의 한 방식이다.","a":"X","e":"재조사 결정은 「국세기본법」에 규정되어 있다. 참고 이의신청·심사청구·심판청구가 이유 있다고 인정될 때에는 그 신청·청구의 대상이 된 처분의 취소·경정 결정을 하거나 필요한 처분 의 결정을 한다. 다만, 취소·경정 또는 필요한 처분을 하기 위하여 사 실관계 확인 등 추가적으로 조사가 필요한 경우에는 처분청으로 하 여금 이를 재조사하여 그 결과에 따라 취소. 경정하거나 필요한 처 분을 하도록 하는 재조사 결정을 할 수 있다(국기법 65 ① (3), 66 6, 81).","pg":78},{"id":416,"ch":8,"n":48,"q":"조세심판원의 재조사결정에 따른 후속 처분에 대하여는 심 사청구나 심판청구를 할 수 없다.","a":"X","e":"재조사 결정에 따른 처분청의 처분에 대해서는 해당 재조 사결정을 한 재결청에 대하여 심사청구 또는 심판청구 를 할 수 있다. 따라서 조세심판원에 심판청구를 할 수 있 다.","pg":79},{"id":417,"ch":8,"n":49,"q":"재조사 결정이 있는 경우 처분청은 재조사 결정일로부터 30 일 이내에 결정서 주문에 기재된 범위에 한정하여 조사하고, 그 결과에 따라 취소. 경정하거나 필요한 처분을 하여야 한 다. 이 경우 처분청은 「국세기본법」에 따라 조사를 연기하거 나 조사기간을 연장하거나 조사를 중지할 수 있다.","a":"X","e":"재조사 결정이 있는 경우 처분청은 재조사 결정일로부터 60일 이내에 결정서 주문에 기재된 범위에 한정하여 조 사하고, 그 결과에 따라 취소. 경정하거나 필요한 처분을 하여야 한다. 이 경우 처분청은 「국세기본법」에 따라 조사 를 연기하거나 조사기간을 연장하거나 조사를 중지할 수 있다.","pg":79},{"id":418,"ch":8,"n":50,"q":"처분청은 재조사 결과 심사청구인의 주장과 재조사 과정에 서 확인한 사실관계가 다른 경우로서 심사청구인의 주장에 대한 사실관계를 확인할 수 없는 경우에는 해당 심사청구의 대상이 된 당초의 처분을 취소. 경정하지 아니할 수 있다.","a":"O","e":"처분청은 재조사 결과 심사청구인의 주장과 재조사 과정 에서 확인한 사실관계가 다른 경우 등 다음의 어느 하나 에 해당하는 경우에는 해당 심사청구의 대상이 된 당초의 처분을 취소. 경정하지 아니할 수 있다. ① 심사청구인의 주장과 재조사 과정에서 확인한 사실 관계가 달라 당초의 처분을 유지할 필요가 있는 경우 ② 심사청구인의 주장에 대한 사실관계를 확인할 수 없는 경우","pg":79},{"id":419,"ch":8,"n":51,"q":"심사청구에 대한 결정에 잘못된 기재, 계산착오, 그 밖에 이 와 비슷한 잘못이 있는 것이 명백한 때에는 국세청장은 심 사청구인의 신청에 의하여만 경정할 수 있다. 이 규정은 이 의신청과 심판청구에도 준용한다.","a":"X","e":"심사청구에 대한 결정에 잘못된 기재, 계산착오, 그 밖에 이와 비슷한 잘못이 있는 것이 명백한 때에는 국세청장은 직권으로 또는 심사청구인의 신청에 의하여 이를 경정할 수 있으며, 이 규정은 이의신청과 심판청구에도 준용한 다.","pg":79},{"id":420,"ch":8,"n":52,"q":"조세심판원장은 심판청구를 받으면 이에 관한 조사와 심리 를 담당할 주심조세심판관 1명과 배석조세심판관 3명 이상 을 지정하여 조세심판관회의를 구성하게 한다.","a":"X","e":"조세심판원장은 심판청구를 받으면 이에 관한 조사와 심 리를 담당할 주심조세심판관 1명과 배석조세심판관 2명 이상을 지정하여 조세심판관회의를 구성하게 한다.","pg":79},{"id":421,"ch":8,"n":53,"q":"상임조세심판관의 임기는 3년으로 하고 한 차례만 연임할 수 있으며, 비상임조세심판관의 임기는 3년으로 하고 한 차 례만 중임할 수 있다.","a":"X","e":"상임조세심판관의 임기는 3년으로 하고 한 차례만 중임 할 수 있으며, 비상임조세심판관의 임기는 3년으로 하고 한 차례만 인임할 수 있다.","pg":80},{"id":422,"ch":8,"n":54,"q":"조세심판관회의는 공개하지 않지만 조세심판관회의 의장이 필요하다고 인정하는 때에는 이를 공개할 수 있다.","a":"O","e":"","pg":80},{"id":423,"ch":8,"n":55,"q":"심판청구금액이 5천만원(지방세의 경우는 2천만원) 미만의 것으로서 각하 결정 사유에 해당하는 경우 조세심판관회의 의 심리를 거쳐 결정해야 한다.","a":"X","e":"심판청구금액이 5천만원(지방세의 경우는 2천만원) 미만 의 것으로서 각하 결정 사유에 해당하는 경우 조세심판관 회의의 심리를 거치지 않고 주심조세심판관이 심리하여 결정할 수 있다. 참고 국세 3천만원(지방세 1천만원)→ 국세 5천만원(지방세 2천만 원)으로 개정되었으니 꼭 챙겨가자","pg":80},{"id":424,"ch":8,"n":56,"q":"청구기간이 지난 후에 심판청구를 받은 경우 조세심판관회 의의 심리를 거치지 않고 주심조세심판관이 심리하여 결정 할 수 있다.","a":"O","e":"","pg":80},{"id":425,"ch":8,"n":57,"q":"납세의무자가 세법에 따른 과태료 부과처분의 취소를 구하 는 심판청구를 한 경우 조세심판원은 그를 심리하여 인용 또는 기각 결정을 하여야 한다.","a":"X","e":"다음의 처분에 대해서는 「국세기본법」에 따른 불복을 할 수 없다. ㉠ 「조세범 처벌절차법」에 따른 통고처분 ㉡ 「국세기본법」 및 세법에 따른 과태료 부과처분 ㉢ 「감사원법」에 따라 심사청구를 한 처분이나 그 심사 청구에 대한 처분 따라서 납세의무자가 세법에 따른 과태료 부과처분의 취 소를 구하는 심판청구를 한 경우 그 청구는 적법하지 않 으므로 조세심판원은 그 청구의 내용에 대해 심리하지 않 고가 결정을 하여야 한다.","pg":80},{"id":426,"ch":8,"n":58,"q":"종전에 조세심판원에서 한 세법의 해석 • 적용을 변경하는 경우 조세심판관회의의 심리를 거쳐 결정한다.","a":"X","e":"종전에 조세심판원에서 한 세법의 해석 • 적용을 변경하 는 경우 조세심판관합동회의가 심리를 거쳐 결정한다.","pg":81},{"id":427,"ch":8,"n":59,"q":"해당 심판청구사건에 대한 결정이 다수의 납세자에게 동일 하게 적용되는 등 국세행정에 중대한 영향을 미칠 것으로 예상되어 국세청장이 조세심판원장에게 조세심판관합동회 의에서 심리하여 줄 것을 요청하는 경우 조세심판관합동회 의의 개최 통지를 받기 전까지 국세청장은 이를 철회할 수 있다.","a":"X","e":"해당 심판청구사건에 대한 결정이 다수의 납세자에게 동 일하게 적용되는 등 국세행정에 중대한 영향을 미칠 것으 로 예상되어 국세청장이 조세심판원장에게 조세심판관합 동회의에서 심리하여 줄 것을 요청하는 경우 국세청장은 이를 철회할 수 없다.","pg":81},{"id":428,"ch":8,"n":60,"q":"조세심판관은 자신에게 제척의 원인이 있을 때에는 주심조 세심판관 또는 배석조세심판관의 지정에서 기피해야 한다.","a":"X","e":"조세심판관은 자신에게 제척의 원인이 있을 때에는 주심 조세심판관 또는 배석조세심판관의 지정에서 회피해야 한다.","pg":81},{"id":429,"ch":8,"n":61,"q":"담당 조세심판관(또는 심판조사관)에게 공정한 심판을 기 대하기 어려운 사정이 있다고 인정될 때에는 심판청구인은 그 조세심판관(또는 심판조사관)의 제척을 신청할 수 있다.","a":"X","e":"담당 조세심판관(또는 심판조사관)에게 공정한 심판을 기 대하기 어려운 사정이 있다고 인정될 때에는 심판청구인 은 그 조세심판관(또는 심판조사관)의 기피를 신청할 수 있다.","pg":81},{"id":430,"ch":8,"n":62,"q":"조세심판관은 필요하다고 인정하면 여러 개의 심판사항을 병합하거나 병합된 심판사항을 여러 개의 심판사항으로 분 리할 수 있다.","a":"O","e":"","pg":81},{"id":431,"ch":8,"n":63,"q":"담당 조세심판관 외의 조세심판원 소속 공무원은 조세심판 원장의 명에 따라 심판청구인 · 처분청 · . 관계인 등의 장부· 서류 그 밖의 물건의 제출 요구할 수 있다.","a":"X","e":"담당 조세심판관 외의 조세심판원 소속 공무원은 조세심 판원장의 명에 따라 심판청구인 · 처분청 · 관계인 등에 대한 질문과 제출된 자료 등에 대한 검사 또는 감정기관 에 대한 감정의뢰를 할 수 있으나 장부·서류 등의 제출 요구는 할 수 없다.","pg":81},{"id":432,"ch":8,"n":64,"q":"담당 조세심판관은 심판청구인이 심판청구인에 대한 질문 요구를 정당한 사유 없이 따르지 아니하여 해당 심판청구 의 전부 또는 일부에 대하여 심판하는 것이 현저히 곤란하 다고 인정한다고 하더라도 그 부분에 관한 심판청구인의 주 장을 기각할 수는 없다.","a":"X","e":"담당 조세심판관은 심판청구인이 심판청구인에 대한 질 문 요구를 정당한 사유 없이 따르지 아니하여 해당 심판 청구의 전부 또는 일부에 대하여 심판하는 것이 현저히 곤란하다고 인정할 때에는 그 부분에 관한 심판청구인의 주장을 인용하지 아니할 수 있다. 즉, 기각할 수 있 다.","pg":82},{"id":433,"ch":8,"n":65,"q":"조세심판관은 심판청구에 관한 조사 및 심리의 결과와 과세 형평을 고려하여 자유심증으로 사실을 판단한다.","a":"O","e":"","pg":82},{"id":434,"ch":8,"n":66,"q":"조세심판관회의(또는 조세심판관합동회의)는 심판청구에 대 한 결정을 할 때 심판청구를 한 처분 외의 처분에 대해서는 그 처분의 전부 또는 일부를 취소 또는 변경하거나 새로운 처분의 결정을 하지 못한다.","a":"O","e":"","pg":82},{"id":435,"ch":8,"n":67,"q":"심판청구에 대한 재조사결정의 취지에 따른 후속 처분이 심 판청구를 한 당초 처분보다 납세자에게 불리하더라도 불이 익변경금지원칙이 적용되지 아니하므로 후속 처분 중 당초 처분의 세액을 초과하는 부분은 위법하지 않다.","a":"X","e":"조세심판관회의 또는 조세심판관합동회의는 심판청구에 대한 결정을 할 때 심판청구를 한 처분보다 청구인에게 불리한 결정을 하지 못한다. 이 결정에는 재조사결정도 포함하므로 재조사결정의 취지에 따른 후속 처분이 심판 청구를 한 당초 처분보다 납세자에게 불리한 경우 불이익 변경금지원칙이 적용되며 후속 처분 중 당초 처분의 세액 을 초과하는 부분은 위법하다.","pg":82},{"id":436,"ch":8,"n":68,"q":"조세심판관회의(또는 조세심판관합동회의)는 심판청구에 대 한 결정을 할 때 심판청구를 한 처분보다 청구인에게 불리 한 결정을 하지 못한다. ○","a":"O","e":"","pg":82},{"id":437,"ch":8,"n":69,"q":"심판청구에 대한 결정이 있으면 해당 행정청은 결정의 취지 에 따라 90일 이내에 필요한 처분을 하여야 한다.","a":"X","e":"심판청구에 대한 결정이 있으면 해당 행정청은 결정의 취 지에 따라 즉시 필요한 처분을 하여야 한다.","pg":82},{"id":438,"ch":8,"n":70,"q":"국세청장, 지방국세청장, 세무서장은 심판청구를 거쳐 「행정 소송법」에 따른 항고소송이 제기된 사건에 대하여 그 내용 이나 결과 등 법령으로 정하는 사항을 분기마다 그 다음 달 15일까지 조세심판원장에게 알려야 한다.","a":"X","e":"국세청장, 지방국세청장, 세무서장은 심판청구를 거쳐 「행정소송법」에 따른 항고소송이 제기된 사건에 대하여 그 내용이나 결과 등 법령으로 정하는 사항을 반기마다 그 다음 달 15일까지 조세심판원장에게 알려야 한다. 50","pg":83},{"id":439,"ch":9,"n":1,"q":"세무공무원은 세무조사를 시작할 때 조사원증을 납세자 또 는 관련인에게 제시한 후 납세자권리헌장을 교부하고 그 요 지를 직접 낭독해 주어야 하며, 조사사유, 조사기간, 납세자 보호위원회에 대한 심의 요청사항 · 절차 및 권리구제절차 등을 설명하여야 한다.","a":"O","e":"","pg":84},{"id":440,"ch":9,"n":2,"q":"사전통지 없이 세무조사를 하는 경우 세무공무원은 납세자 권리헌장을 교부하지 아니한다.","a":"X","e":"사전통지 없이 세무조사를 하는 경우 세무공무원은 납세 자권리헌장을 교부하고 그 요지를 직접 낭독해 주어야 한 다. 참고 세무공무원은 세무조사를 시작할 때 조사원증을 납세자 또 는 관련인에게 제시한 후 납세자권리헌장을 교부하고 그 요지를 직 접 낭독해 주어야 하며, 조사사유, 조사기간, 납세자보호위원회에 대한 심의 요청사항·절차 및 권리구제 절차 등을 설명해야 함","pg":84},{"id":441,"ch":9,"n":3,"q":"사업자등록증을 발급하는 경우 세무공무원은 납세자권리헌 장을 교부하고 그 요지를 직접 낭독해 주어야 한다.","a":"X","e":"사업자등록증을 발급하는 경우 납세자권리헌장의 내용이 수록된 문서를 납세자에게 교부만 하면 된다.","pg":84},{"id":442,"ch":9,"n":4,"q":"세무공무원은 납세자가 성실하며 납세자가 제출한 신고서 등이 진실한 것으로 추정해야 하지만 국세청장이 납세자의 신고 내용에 대한 정기적인 성실도 분석결과 불성실 혐의가 있다고 인정하는 경우 그러하지 아니하다.","a":"X","e":"국세청장이 납세자의 신고 내용에 대한 정기적인 성실도 분석결과 불성실 혐의가 있다고 인정하는 경우는 납세자 의 성실성 추정에서 제외되는 사유가 아니다.","pg":84},{"id":443,"ch":9,"n":5,"q":"납세자가 세법에서 정하는 신고, 성실신고확인서의 제출, 세 금계산서 또는 계산서의 작성·교부·제출, 지급명세서의 작성·제출 등의 납세협력의무를 이행하지 아니한 경우는 세무공무원이 납세자의 성실성을 추정해야 하는 경우에서 제외된다.","a":"O","e":"","pg":84},{"id":444,"ch":9,"n":6,"q":"납세자의 신고 내용에 오류가 의심되는 경우는 세무공무원 이 납세자의 성실성을 추정해야 하는 경우에서 제외된다.","a":"X","e":"납세자의 신고내용에 탈루나 오류의 혐의를 인정할 만한 명백한 자료가 있는 경우는 세무공무원이 납세자의 성실 성을 추정해야 하는 경우에서 제외된다.","pg":85},{"id":445,"ch":9,"n":7,"q":"납세자에 대한 구체적인 탈세제보가 있는 경우는 세무공무 원이 납세자의 성실성을 추정해야 하는 경우에서 제외된다.","a":"O","e":"","pg":85},{"id":446,"ch":9,"n":8,"q":"세무공무원은 적정하고 공평한 과세를 실현하기 위하여 필 요한 최소한의 범위에서 세무조사를 해야 하지만 「조세범 처벌절차법」에 따른 조세범칙조사의 경우 그러하지 아니하 다.","a":"X","e":"세무공무원은 적정하고 공평한 과세를 실현하기 위하여 필요한 최소한의 범위에서 세무 조사(「조세범 처벌절차 법」에 따른 조세범칙조사를 포함)를 해야 하며, 다른 목적 등을 위하여 조사권을 남용해서는 안 된다.","pg":85},{"id":447,"ch":9,"n":9,"q":"세무공무원은 적정하고 공평한 과세를 실현하기 위하여 필 요한 최대한의 범위에서 세무조사를 하여야 하며, 다른 목적 등을 위하여 조사권을 남용해서는 아니 된다.","a":"X","e":"세무공무원은 적정하고 공평한 과세를 실현하기 위하여 필요한 최소한의 범위에서 세무조사를 하여야 하며, 다른 목적 등을 위하여 조사권을 남용해서는 아니 된다.","pg":85},{"id":448,"ch":9,"n":10,"q":"세무공무원은 과세전적부심사 청구가 이유 있다고 인정되어 행한 재조사 결정에 따라 조사를 하는 경우에 결정서 주문 에 기재된 범위의 조사를 넘어 같은 세목 및 같은 과세기간 에 대하여 재조사를 할 수 있다.","a":"X","e":"세무공무원은 과세전적부심사 청구가 이유 있다고 인정 되어 행한 재조사 결정에 따라 조사를 하는 경우에 결정 서 주문에 기재된 범위에 한하여 같은 세목 및 같은 과세 기간에 대하여 재조사를 할 수 있다.","pg":85},{"id":449,"ch":9,"n":11,"q":"과세전적부심사에 따른 재조사 결정에 의한 조사(결정서 주 문에 기재된 범위의 조사에 한정)를 하는 경우 같은 세목 및 같은 과세기간에 대하여 재조사를 할 수 없다.","a":"X","e":"과세전적부심사에 따른 재조사 결정에 의한 조사(결정서 주문에 기재된 범위의 조사에 한정)를 하는 경우 같은 세 목 및 같은 과세기간에 대하여 재조사를 할 수 있다.","pg":85},{"id":450,"ch":9,"n":12,"q":"세무공무원은 납세자 대한씨의 거래상대방에 대한 조사가 필요한 경우에도 대한씨의 같은 세목과 같은 과세기간에 대 하여 재조사를 할 수 없다.","a":"X","e":"세무공무원은 납세자의 거래상대방에 대한 조사가 필요 한 경우에도 납세자의 같은 세목과 같은 과세기간에 대하 여 재조사를 할 수 있다.","pg":85},{"id":451,"ch":9,"n":13,"q":"2개 이상의 과세기간과 관련하여 잘못이 있는 경우 세무공 무원은 세무조사 시 같은 세목 및 같은 과세기간에 대하여 재조사를 할 수 있다.","a":"O","e":"","pg":86},{"id":452,"ch":9,"n":14,"q":"세무공무원은 조세탈루가 의심되는 경우 같은 세목 및 같은 과세기간에 대해서 재조사를 할 수 있다.","a":"X","e":"세무공무원은 조세탈루의 혐의를 인정할 만한 명백한 자 료가 있는 경우 같은 세목 및 같은 과세기간에 대해서 재 조사를 할 수 있다.","pg":86},{"id":453,"ch":9,"n":15,"q":"납세자가 세무공무원에게 직무와 관련없이 금품을 제공하거 나 금품제공을 알선한 경우에는 같은 세목 및 같은 과세기 간에 대해서 재조사를 할 수 있다.","a":"X","e":"납세자가 세무공무원에게 직무와 관련하여 금품을 제공 하거나 금품제공을 알선한 경우에는 같은 세목 및 같은 과세기간에 대해서 재조사를 할 수 있다.","pg":86},{"id":454,"ch":9,"n":16,"q":"세무공무원은 세무조사를 하기 위하여 필요한 최소한의 범 위에서 장부 등의 제출을 요구해야 하며, 조사대상 세목 및 과세기간의 과세표준과 세액의 계산과 관련 없는 장부 등의 제출을 요구해서는 안 된다.","a":"O","e":"","pg":86},{"id":455,"ch":9,"n":17,"q":"납세자는 세무조사(조세범 처벌절차법」에 따른 조세범칙조 사를 제외)를 받는 경우에 변호사, 공인회계사, 세무사로 하 여금 조사에 참여하게 하거나 의견을 진술하게 할 수 있다.","a":"X","e":"납세자는 세무조사(「조세범 처벌절차법」에 따른 조세범칙 조사를 포함)를 받는 경우에 변호사, 공인회계사, 세무사 로 하여금 조사에 참여하게 하거나 의견을 진술하게 할 수 있다.","pg":86},{"id":456,"ch":9,"n":18,"q":"납세자는 세무조사(조세범 처벌절차법」에 따른 조세범칙조 사를 포함한다)를 받는 경우에 변호사로 하여금 조사에 참여 하게 하거나 의견을 진술하게 할 수 없다.","a":"X","e":"변호사도 대리인의 범위에 포함된다. 따라서 납세자는 세무조사(「조세범 처벌절차법」에 따른 조세범칙조사를 포함한다)를 받는 경우에 변호사로 하여 금 조사에 참여하게 하거나 의견을 진술하게 할 수 있다.","pg":86},{"id":457,"ch":9,"n":19,"q":"세무조사 관할을 조정할 때 납세자가 사업을 실질적으로 관 리하는 장소의 소재지와 납세지가 관할을 달리 하지만 같은 지방국세청 소관 세무서 관할 조정의 경우 국세청장이 그 관할을 조정해야 한다.","a":"X","e":"세무조사 관할을 조정할 때 납세자가 사업을 실질적으로 관리하는 장소의 소재지와 납세지가 관할을 달리 하는 경 우 국세청장(같은 지방국세청 소관 세무서 관할 조정의 경우에는 지방국세청장)이 그 관할을 조정할 수 있다.","pg":87},{"id":458,"ch":9,"n":20,"q":"국세청장이 납세자의 신고 내용에 대하여 정기적으로 성실 도를 분석한 결과 불성실 혐의가 있다고 인정하는 경우에 세무공무원은 정기적으로 신고의 적정성을 검증하기 위하여 대상을 선정하여 세무조사를 할 수 있다.","a":"O","e":"","pg":87},{"id":459,"ch":9,"n":21,"q":"신고내용에 탈루나 오류의 혐의를 인정할 만한 명백한 자 료가 있는 경우 세무공무원은 정기적으로 신고의 적정성을 검증하기 위하여 대상을 선정하여 세무조사를 할 수 있다.","a":"X","e":"신고내용에 탈루나 오류의 혐의를 인정할 만한 명백한 자 료가 있는 경우 세무공무원은 정기선정에 의한 조사 외에 세무조사를 실시할 수 있다.","pg":87},{"id":460,"ch":9,"n":22,"q":"무작위추출방식으로 표본조사를 하려는 경우 세무공무원은 정기적으로 신고의 적정성을 검증하기 위하여 대상을 선정 하여 세무조사를 할 수 있다.","a":"O","e":"","pg":87},{"id":461,"ch":9,"n":23,"q":"납세자가 세법이 정하는 신고 등의 납세협력의무를 이행하 지 아니한 경우 세무공무원은 정기적으로 신고의 적정성을 검증하기 위하여 대상을 선정하여 세무조사를 할 수 있다.","a":"X","e":"납세자가 세법이 정하는 신고 등의 납세협력의무를 이행 하지 아니한 경우 정기선정에 의한 조사 외에 세무조사를 실시할 수 있다.","pg":87},{"id":462,"ch":9,"n":24,"q":"세무공무원은 과세관청의 조사결정에 의하여 과세표준과 세 액이 확정되는 세목의 경우 과세표준과 세액을 결정하기 위 한 세무조사를 할 수 없다.","a":"X","e":"세무공무원은 과세관청의 조사결정에 의하여 과세표준과 세액이 확정되는 세목의 경우 과세표준과 세액을 결정하 기 위한 세무조사를 할 수 있다.","pg":87},{"id":463,"ch":9,"n":25,"q":"세무공무원은 세무조사를 하는 경우에는 조사를 받을 납 세자에게 조사를 시작하기 15일 전에 조사대상 세목, 과세 기간, 조사기간 및 조사 사유 등을 문서로 통지해야 한다.","a":"X","e":"세무공무원은 세무조사를 하는 경우에는 조사를 받을 납 세자에게 조사를 시작하기 20일(이의신청, 심사청구. 심판청구 · 과세전적부심사에 대한 재조사 결정으로 재조 시를 하는 경우에는 7일) 전에 조사대상 세목, 과세기간, 조사기간 및 조사 사유 등을 문서로 통지해야 한다.","pg":88},{"id":464,"ch":9,"n":26,"q":"사전통지를 하면 증거인멸 등으로 조사 목적을 달성할 수 없다고 인정되는 경우에는 사전통지를 하지 않을 수 있다.","a":"O","e":"","pg":88},{"id":465,"ch":9,"n":27,"q":"사전통지를 받은 납세자가 천재지변, 화재, 그 밖의 재해로 사업상 심각한 어려움이 있을 때 관할 세무관서의 장에게 조사를 연기해 줄 것을 신청할 수 있으며 해당 연기 신청은 관할 세무서장의 승인을 요하지 아니한다.","a":"X","e":"사전통지를 받은 납세자가 천재지변, 화재, 그 밖의 재해 로 사업상 심각한 어려움이 있을 때 관할 세무관서의 장 에게 조사를 연기해 줄 것을 신청할 수 있으며 이러한 세 무조사의 연기신청을 받은 관할 세무관서의 장은 연기신 청승인 여부를 결정하고 그 결과(연기 결정 시 연기한 기 간을 포함)를 조사 개시전까지 통지해야 한다.","pg":88},{"id":466,"ch":9,"n":28,"q":"세무조사의 사전통지를 받은 납세자가 장기출장을 사유로 조사를 받기 곤란한 경우에는 조사의 연기를 신청할 수 있 다. ○","a":"O","e":"","pg":88},{"id":467,"ch":9,"n":29,"q":"세무조사의 사전통지를 받은 납세자의 장부 작성을 대행하 는 세무사, 세무법인 또는 공인회계사가 화재, 전화, 그 밖의 재해를 입거나 도난을 당한 경우 조사의 연기를 신청할 수 있다.","a":"X","e":"납세자의 장부 작성을 대행하는 세무사, 세무법인 또는 공인회계사가 화재, 전화, 그 밖의 재해를 입거나 도난을 당한 경우 기한 연장 사유, 납부기한 연장 사유, 납부고 지의 유예 사유에 해당되나 세무조사의 연기 신청 사유는 아니다.","pg":88},{"id":468,"ch":9,"n":30,"q":"세무조사의 사전통지를 받은 납세자가 「국세징수법」에 따라 사해행위 취소소송 중이거나 「국세기본법」에 따라 제3자와 짜고 한 거짓계약에 대한 취소소송 중인 경우 조사의 연기 를 신청할 수 있다.","a":"X","e":"납세자가 국세징수법」에 따라 사해행위 취소소송 중이거 나 「국세기본법」에 따라 제3자와 짜고 한 거짓계약에 대 한 취소소송 중인 경우 소멸시효 정지 사유, 출국금지 요 청 대상자에 해당되나 세무조사의 연기 신청 사유는 아니 다.","pg":89},{"id":469,"ch":9,"n":31,"q":"관할 세무관서의 장은 조세채권을 확보하기 위하여 조사를 긴급히 개시할 필요가 있다고 인정되는 경우 연기한 기간이 만료되기 전에 조사를 개시할 수 있으며 이 경우 조사를 개 시하기 5일 전까지 조사를 받을 납세자에게 연기 사유가 소 멸한 사실과 조사기간을 통지하여야 한다.","a":"X","e":"「국세기본법」에 따른 세무조사 연기 사유가 소멸한 경우 로서 조사를 개시하려는 경우에는 조사를 개시하기 5일 전까지 조사를 받을 납세자에게 연기 사유가 소멸한 사실 과 조사기간을 통지하여야 한다. 조세채권을 확보하기 위 하여 조사를 긴급히 개시할 필요가 있는 경우로서 조사를 개시하려는 경우에는 납세자에게 조사를 긴급히 개시해 야 하는 사유와 조사기간을 통지하여야 한다. 즉, 5일 전 까지 규정은 해당되지 않는다.","pg":89},{"id":470,"ch":9,"n":32,"q":"납세자의 거래처 현지확인 및 금융거래 현지확인이 필요한 경우 세무조사의 사전통지를 받은 납세자가 조사의 연기를 신청할 수 있으며 최초로 연기하는 경우에는 관할 세무관서 의장의 승인만으로 세무조사를 연기할 수 있다.","a":"X","e":"거래처 조사 또는 거래처 현지확인 및 금융거래 현지확인 이 필요한 경우 세무공무원은 세무조사 기간을 연장할 수 있다. 최초로 연장하는 경우에는 관할 세무관서의 장의 승인만으로 세무조사 기간을 연장할 수 있다.","pg":89},{"id":471,"ch":9,"n":33,"q":"세금탈루 혐의가 포착되거나 조사 과정에서 「조세범 처벌절 차법」에 따른 조세범칙조사를 개시하는 경우 세무공무원은 세무조사 기간을 연장할 수 있다.","a":"O","e":"","pg":89},{"id":472,"ch":9,"n":34,"q":"국외자료의 수집·제출 또는 상호합의절차 개시에 따라 외 국 과세기관과의 협의가 필요한 경우는 국세기본법령상 세 무조사 기간의 연장 사유에 해당한다.","a":"X","e":"국외자료의 수집·제출 또는 상호합의절차 개시에 따라 외국 과세기관과의 협의가 필요한 경우는 국세기본법령 상세무조사 기간의 연장사유에 해당하지 않는다. 비교 세무조사 중지사유에 해당함","pg":89},{"id":473,"ch":9,"n":35,"q":"납세자가 장부·서류 등을 은닉하거나 제출을 지연하거나 거부하는 등 조사를 기피하는 행위가 명백한 경우 세무공무 원은 세무조사 기간을 연장할 수 있으며 이 경우 세무조사 기간의 제한 및 세무조사 연장기간의 제한을 받지 않는다.","a":"X","e":"납세자가 장부·서류 등을 은닉하거나 제출을 지연하게 나 거부하는 등 조사를 기피하는 행위가 명백한 경우 세 무공무원은 세무조사 기간을 연장할 수 있으며 이 경우 최초로 연장하는 경우에는 관할 세무관서의 장의 승인을 받아야 하고, 2회 이후 연장의 경우에는 관할 상급 세무 괸시의 장의 승인을 받아 각각 20일 이내에서 연장할 수 있다. 즉, 세무조사 조사기간 및 연장기간의 무제한 사유 에 해당하지 않는다.","pg":90},{"id":474,"ch":9,"n":36,"q":"국외자료의 수집·제출 또는 상호합의절차 개시에 따라 외 국 과세기관과의 협의가 필요한 경우 세무공무원은 세무조 사 기간을 연장할 수 있으며 이 경우 최초로 연장하는 경우 에는 관할 세무관서의 장의 승인을 받아야 하고, 2회 이후 연장의 경우에는 관할 상급 세무관서의 장의 승인을 받아 각각 20일 이내에서 연장할 수 있다.","a":"X","e":"국외자료의 수집·제출 또는 상호합의절차 개시에 따라 외국 과세기관과의 협의가 필요한 경우는 세무조사 기간 연장사유에 해당하지 않고 세무조사 중지 사유에 해당한 다.","pg":90},{"id":475,"ch":9,"n":37,"q":"세무공무원은 세무조사 기간을 정할 경우 조사대상 과세기 간 중 연간 수입금액 또는 양도가액이 가장 큰 과세기간의 연간 수입금액 또는 양도가액이 100억원 미만인 납세자에 대한 세무조사 기간은 20일 이내로 하는 것을 원칙으로 한 다.","a":"O","e":"","pg":90},{"id":476,"ch":9,"n":38,"q":"무자로거래, 위장가공거래 등 거래 내용이 사실과 다른 혐 의가 있어 실제 거래 내용에 대한 조사가 필요한 경우 세무 공무원은 세무조사 기간을 연장할 수 있으며 이 경우 최초 로 연장하는 경우에는 관할 세무관서의 장의 승인을 받아야 하고, 2회 이후 연장의 경우에는 관할 상급 세무관서의 장의 승인을 받아 각각 20일 이내에서 연장할 수 있다.","a":"X","e":"무자료거래, 위장가공거래 등 거래 내용이 사실과 다른 혐의가 있어 실제 거래 내용에 대한 조사가 필요한 경우 세무공무원은 세무조사 기간을 연장할 수 있으며 이 경우 세무조사 기간의 제한 및 세무조사 연장기간의 제한을 받 지 않는다.","pg":90},{"id":477,"ch":9,"n":39,"q":"상속세.증여세 조사, 주식변동 조사, 범칙사건 조사 및 출 자. 거래관계에 있는 관련자에 대하여 동시조사를 하는 세 무공무원은 세무조사 기간을 연장할 수 있으며 이 경우 최 초로 연장하는 경우에는 관할 세무관서의 장의 승인을 받 아야 하고, 2회 이후 연장의 경우에는 관할 상급 세무관서 의 장의 승인을 받아 각각 20일 이내에서 연장할 수 있다.","a":"X","e":"상속세.증여세 조사, 주식변동 조사, 범칙사건 조사 및 출자. 거래관계에 있는 관련자에 대하여 동시조사를 하 는 세무공무원은 세무조사 기간을 연장할 수 있으며 이 경우 세무조사 기간의 제한 및 세무조사 연장기간의 제한 을 받지 않는다.","pg":91},{"id":478,"ch":9,"n":40,"q":"세무공무원은 납세자가 자료의 제출을 지연하는 등 대통령 령으로 정하는 사유로 세무조사를 진행하기 어려운 경우에 는 세무조사를 중지할 수 있으며, 세무조사의 중지기간 중 에도 납세자에 대하여 국세의 과세표준과 세액을 결정 또는 경정하기 위한 질문을 하거나 장부 등의 검사·조사 또는 그 제출을 요구할 수 있다.","a":"X","e":"세무공무원은 납세자가 자료의 제출을 지연하는 등 대통 령령으로 정하는 사유로 세무조사를 진행하기 어려운 경 우에는 세무조사를 중지할 수 있으며, 세무조사의 중지기 간 중에는 납세자에 대하여 국세의 과세표준과 세액을 결 정 또는 경정하기 위한 질문을 하거나 장부 등의 검사· 조사 또는 그 제출을 요구할 수 없다.","pg":91},{"id":479,"ch":9,"n":41,"q":"납세자에 대한 구체적인 탈세제보가 있는 경우 세무공무원 은 조사목적에 필요한 최소한의 범위에서 납세자, 소지자 또 는 보관자 등 정당한 권한이 있는 자가 임의로 제출한 장부 등을 납세자의 동의를 얻어 세무관서에 일시 보관할 수 있 다.","a":"X","e":"납세자에 대한 구체적인 탈세 제보가 있는 경우는 수시선 정 세무조사 사유에 해당된다. 수시선정 세무조사 사유에 해당하는 경우에는 조사목적에 필요한 최소한의 범위에 서 납세자 소지자 또는 보관자 등 정당한 권한이 있는 자 가 임의로 제출한 장부 등을 납세자의 동의를 얻어 세무 관서에 일시 보관할 수 있다. 444 수시선정 사유, 납세자의 동의","pg":91},{"id":480,"ch":9,"n":42,"q":"세무공무원은 일시 보관하고 있는 장부 등에 대하여 납세자 가 반환을 요청할 경우에는 세무조사에 지장이 있다 하더라 도 그 즉시 장부 등을 반환하여야 한다.","a":"X","e":"세무공무원은 일시 보관하고 있는 장부 등에 대하여 납세 자가 반환을 요청할 경우에는 그 반환을 요청한 날부터 14일 이내에 장부 등을 반환하여야 하고 세무조사에 지장 이 없다고 판단될 때에는 요청한 장부 등을 즉시 반환해 야 한다.","pg":91},{"id":481,"ch":9,"n":43,"q":"조사 목적을 달성하기 위하여 필요한 경우에는 관할 세무관 서의 장의 승인을 받아 장부 등의 일시보관 기간을 연장할 수 있으며 2회 이후 연장의 경우에는 관할 상급 세무관서의 장의 승인을 받아 각각 14일 이내의 범위에서 연장할 수 있 다.","a":"X","e":"조사 목적을 달성하기 위하여 필요한 경우에는 납세자보 호위원회의 심의를 거쳐 한 차례만 14일 이내의 범위에서 보관 기간을 연장할 수 있다.","pg":92},{"id":482,"ch":9,"n":44,"q":"세무조사는 납세자의 사업과 관련하여 세법에 따라 신고· 납부의무가 있는 세목별로 나누어 실시하는 것이 원칙이다.","a":"X","e":"세무조사는 납세자의 사업과 관련하여 세법에 따라 신 고·납부의무가 있는 세목을 통합하여 실시하는 것을 원 칙으로 한다. ... '통합하지 않고 특정한 세목안을 조사하는 것을 원칙으로 한다.' 함정 주의","pg":92},{"id":483,"ch":9,"n":45,"q":"서독의 특성, 납세자의 신고유형, 사업규모 또는 세금탈루 혐의 등을 고려하여 특정 세목만을 조사할 필요가 있는 경 우라 하더라도 세무조사는 납세자의 사업과 관련하여 세법 에 따라 신고·납부의무가 있는 세목을 통합하여 실시해야 한다.","a":"X","e":"세무조사는 납세자의 사업과 관련하여 세법에 따라 신 고·납부의무가 있는 세목을 통합하여 실시하는 것을 원 칙으로 하되 세목의 특성, 납세자의 신고유형, 사업규모 또는 세금탈루 혐의 등을 고려하여 특정 세목만을 조사할 필요가 있는 경우 특정한 세목만을 조사할 수 있다.","pg":92},{"id":484,"ch":9,"n":46,"q":"조세채권의 확보 등을 위하여 특정 세목만을 긴급히 조사 할 필요가 있는 경우에는 특정한 세목만을 조사할 수 있다. ○","a":"O","e":"","pg":92},{"id":485,"ch":9,"n":47,"q":"세무조사는 통합조사가 원칙이지만 경정 등의 청구에 대한 처리 또는 국세환급금의 결정을 위하여 확인이 필요한 경우 그 확인을 위해 필요한 부분에 한정하여 조사를 실시할 수 도 있는데, 이 경우 같은 세목 및 같은 과세기간에 대하여 2 회까지만 실시할 수 있다. ○","a":"X","e":"세무조사는 통합조사가 원칙이지만 경정 등의 청구에 대 한 처리 또는 국세환급금의 결정을 위하여 확인이 필요한 경우 그 확인을 위해 필요한 부분에 한정하여 조사를 실 시할 수도 있는데, 이 경우 그 부분조사의 횟수에 제한이 없다.","pg":92},{"id":486,"ch":9,"n":48,"q":"거래상대방에 대한 세무조사 중에 거래 일부의 확인이 필요 한 경우 그 확인을 위해 필요한 부분에 한정하여 조사를 실 시할 수도 있는데, 이 경우 그 부분조사의 횟수에 제한이 없 다.","a":"X","e":"거래상대방에 대한 세무조사 중에 거래 일부의 확인이 필 요한 경우 그 확인을 위해 필요한 부분에 한정하여 조사 를 실시할 수도 있는데, 이 경우 같은 세목 및 같은 과세 기간에 대하여 2회까지만 실시할 수 있다.","pg":93},{"id":487,"ch":9,"n":49,"q":"명의위장, 차명계좌의 이용을 통하여 세금을 탈루한 혐의에 대한 확인이 필요한 경우 그 확인을 위해 필요한 부분에 한 정하여 조사를 실시할 수도 있는데, 이 경우 같은 세목 및 같은 과세기간에 대하여 2회까지만 실시할 수 있다.","a":"O","e":"","pg":93},{"id":488,"ch":9,"n":50,"q":"납세자에 대한 구체적인 탈세 제보가 있는 경우로서 해당 탈세혐의에 대한 확인이 필요한 사유로 인한 부분조사는 같 은 세목 및 같은 과세기간에 대하여 횟수 제한 없이 실시할 수 있다.","a":"X","e":"납세자에 대한 구체적인 탈세 제보가 있는 경우로서 해당 탈세혐의에 대한 확인이 필요한 사유로 인한 부분조사는 같은 세목 및 같은 과세기간에 대하여 2회를 초과하여 실 시할 수 없다.","pg":93},{"id":489,"ch":9,"n":51,"q":"불복청구의 인용결정 또는 과세전적부심사 청구의 채택결정 중 재조사 결정에 의한 조사를 마친 경우 그 조사를 마친 날 부터 20일(공시송달 사유에 해당하는 경우에는 40일) 이내 에 조사결과를 납세자에게 설명하고, 이를 서면으로 납세자 에게 통지해야 한다.","a":"X","e":"불복청구의 인용결정 또는 과세전적부심사 청구의 채택 결정 중 재조사 결정에 의한 조사를 마친 경우 세무조사 의 결과를 통지하지 않는다.","pg":93},{"id":490,"ch":9,"n":52,"q":"「조세범 처벌절차법」에 따른 조세범칙조사를 마쳤을 때에는 세무조사의 결과를 통지하지 않는다.","a":"X","e":"「조세범 처벌절차법」에 따른 조세범칙조사를 마쳤을 때에 는 그 조사를 마친 날부터 20일(공시송달 사유에 해당하 는 경우에는 40일) 이내에 조사결과를 납세자에게 설명 하고, 이를 서면으로 납세자에게 통지해야 한다.","pg":93},{"id":491,"ch":9,"n":53,"q":"국가행정기관, 지방자치단체 또는 「공공기관의 운영에 관한 법률」에 따른 공공기관이 급부·지원 등을 위한 자격의 조 사·심사 등에 필요한 과세정보를 문서 또는 구두로 요구하 는 경우 당사자의 동의 여부와 관계없이 세무공무원은 납세 자 과세정보를 제공할 수 있다.","a":"X","e":"국가행정기관, 지방자치단체 또는 「공공기관의 운영에 관 한 법률」에 따른 공공기관이 급부 지원 등을 위한 자격 의 조사·심사 등에 필요한 과세정보를 사사의 동의를 받이 문지로 요구하는 경우에는 그 사용 목적에 맞는 빔 위에서 납세자 과세정보를 제공할 수 있다.","pg":94},{"id":492,"ch":9,"n":54,"q":"납세자 본인의 권리 행사에 필요한 정보를 납세자(세무사 등 납세자로부터 세무업무를 위임받은 자는 포함)가 요구하는 경우 세무공무원은 신속하게 정보를 제공해야 한다. ○","a":"O","e":"","pg":94},{"id":493,"ch":9,"n":55,"q":"세무서장은 세무서에 대한 지방국세청장의 업무감사 결과 (현지에서 시정조치하는 경우는 제외)에 따라 세무서장이 과 세하는 경우에는 미리 납세자에게 그 내용을 서면으로 통지 하여야 한다.","a":"X","e":"세무서장은 세무서에 대한 지방국세청장의 업무감사 결 과(현지에서 시정조치하는 경우를 포함)에 따라 세무서장 이 과세하는 경우에는 미리 납세자에게 그 내용을 서면으 로 통지하여야 한다.","pg":94},{"id":494,"ch":9,"n":56,"q":"세무서장은 세무조사에서 확인된 것으로 조사대상자 외의 자에 대한 과세자료 및 현지 확인조사에 따라 세무서장이 과세하는 경우에는 미리 납세자에게 그 내용을 서면으로 통 지하지 않아도 된다. ○","a":"X","e":"세무서장은 세무조사에서 확인된 것으로 조사대상자 외 의자에 대한 과세자료 및 현지 확인조사에 따라 세무서 장이 과세하는 경우에는 미리 납세자에게 그 내용을 서면 으로 통지하여야 한다.","pg":94},{"id":495,"ch":9,"n":57,"q":"세무서장은 납부고지하려는 세액이 100만원 이하인 경우에 는 미리 납세자에게 그 내용을 서면으로 통지하지 않아도 된다.","a":"X","e":"세무서장은 납부고지하려는 세액이 100만원 미만인 경우 에는 미리 납세자에게 그 내용을 서면으로 통지하지 않아 도 된다. 즉, 납부고지하려는 세액이 100만원 이상인 경 우에는 미리 납세자에게 그 내용을 서면으로 통지하여야 한다.","pg":94},{"id":496,"ch":9,"n":58,"q":"세무조사의 결과에 대한 서면통지를 받은 자는 통지를 받은 날로부터 90일 이내에 과세전적부심사 청구를 할 수 있다.","a":"X","e":"세무조사의 결과에 대한 서면통지를 받은 자는 통지를 받 은 날로부터 30일 이내에 과세전적부심사 청구를 할 수 있다.","pg":94},{"id":497,"ch":9,"n":59,"q":"「감사원법」에 따른 시정요구에 따라 세무서장이 과세처분하 는 경우로서 시정요구 전에 과세처분 대상자가 감사원의 지 적사항에 대한 소명안내를 받은 경우 납부고지하려는 세액 이 100만원 이상이면 미리 납세자에게 그 내용을 서면으로 통지하여야 한다.","a":"X","e":"납부고지하려는 세액이 100만원 이상인 경우에는 과세예 고통지를 하여야 한다. 다만, 다음의 경우는 제외한다. ㉠ 「감사원법」에 따른 시정요구에 따라 세무서장 또는 지방국세청장이 과세처분하는 경우로서 시정요구 전에 과세처분 대상자가 감사원의 지적사항에 대한 소명안내를 받은 경우 ㉡ 기한후과세표준신고서를 제출한 자가 납부하여야 할 세액을 납부하지 아니하거나 과소납부한 경우로 서 세무서장 또는 지방국세청장이 해당 기한후과세 표준신고서에 기재된 과세표준 및 세액과 동일하게 과세표준 및 세액을 결정하는 경우","pg":95},{"id":498,"ch":9,"n":60,"q":"국세청장의 훈령·예규·고시 등과 관련하여 새로운 해석이 필요한 과세예고통지의 경우 해당 통지를 받은 자는 통지를 받은 날부터 30일 이내에 통지를 한 세무서장이나 지방국세 청장에게 통지 내용의 적법성에 관한 과세전적부심사를 청 구할 수 있다.","a":"X","e":"국세청장의 훈령·예규·고시 등과 관련하여 새로운 해 석이 필요한 과세예고통지의 경우 해당 통지를 받은 자는 통지를 받은 날부터 30일 이내에 국세청장에게 통지 내 용의 적법성에 관한 과세전적부심사를 청구할 수 있다.","pg":95},{"id":499,"ch":9,"n":61,"q":"세무서장으로부터 세무조사 결과에 대한 서면통지를 받은 자에게 「국세징수법」에 규정된 납부기한 전 징수의 사유가 있거나 세법에서 규정하는 수시부과 사유가 있는 경우에는 과세전적부심사를 청구할 수 없다.","a":"O","e":"","pg":95},{"id":500,"ch":9,"n":62,"q":"「조세범 처벌법 위반으로 고발 또는 통고처분하는 경우(고 발 또는 통고처분과 관련 없는 세목 또는 세액의 경우는 제 외)에는 국세청장에게 과세전적부심사를 청구할 수 있다.","a":"X","e":"「조세범 처벌법 위반으로 고발 또는 통고처분하는 경우 (고발 또는 통고처분과 관련 없는 세목 또는 세액의 경우 는 제외)에는 과세전적부심사를 청구할 수 없다.","pg":95},{"id":501,"ch":9,"n":63,"q":"세무조사 결과 통지 및 과세예고통지를 하는 날부터 국세부 과제척기간의 만료일까지의 기간이 3개월 이하인 경우, 해 당 통지를 받은 자는 통지를 받은 날부터 30일 이내에 통지 를 한 세무서장이나 지방국세청장에게 통지 내용의 적법성 에 관한 심사를 청구할 수 있다.","a":"X","e":"다음의 하나에 해당하는 경우 과세전적부심사를 청구할 수 없다. ㉠ 납부기한 전 징수의 사유가 있거나 수시부과의 사 유가 있는 경우 ) 「조세범 처벌법」 위반으로 고발 또는 통고처분하는 경우(고발 또는 통고처분과 관련 없는 세목 또는 세 액의 경우는 제외) ㉢ 세무조사 결과통지 및 과세예고통지를 하는 날부터 국세부과제척기간의 만료일까지의 기간이 3개월 이하인 경우 )「국제조세조정에 관한 법률」에 따라 조세조약을 체 결한 상대국이 상호합의절차의 개시를 요청한 경우 ⑥ 불복청구 및 과세전적부심사의 재조사 결정에 의한 세무조사를 하는 경우","pg":96},{"id":502,"ch":9,"n":64,"q":"「국제조세조정에 관한 법률」에 따라 조세조약을 체결한 상 대국이 상호합의절차의 개시를 요청한 경우 원칙적인 청구 기한에도 불구하고 상호합의절차의 종료일의 다음 날부터 30일 이내에 과세전적부심사를 청구할 수 있다.","a":"X","e":"「국제조세조정에 관한 법률」에 따라 조세조약을 체결한 상대국이 상호합의절차의 개시를 요청한 경우 과세전적 부심사를 청구할 수 없다.","pg":96},{"id":503,"ch":9,"n":65,"q":"과세전적부심사 청구에 따른 재조사 결정에 따라 조사를 하 는 경우 과세전적부심사의 청구대상이 된다.","a":"X","e":"과세전적부심사 청구에 따른 재조사 결정에 따라 조사를 하는 경우 과세전적부심사의 청구대상이 되지 않는다.","pg":96},{"id":504,"ch":9,"n":66,"q":"과세전적부심사청구의 배제사유에 해당하는 경우가 아니라 면 과세전적부심사의 청구부분에 대하여는 과세전적부심사 에 대한 결정이 있을 때까지 과세표준 및 세액의 결정이나 경정결정이 유보된다. ○","a":"O","e":"","pg":96},{"id":505,"ch":9,"n":67,"q":"과세전적부심사청구를 받은 세무서장 • 지방국세청장 또는 국세청장은 각각 국세심사위원회의 의결에 따라 결정하고 그 결과를 청구를 받은 날부터 90일 이내에 청구인에게 통 지해야 한다.","a":"X","e":"과세전적부심사청구를 받은 세무서장 • 지방국세청장 또 는 국세청장은 각각 국세심사위원회의 심사를 거쳐 결정 하고 그 결과를 청구를 받은 날부터 30일 이내에 청구인 에게 통지해야 한다.","pg":97},{"id":506,"ch":9,"n":68,"q":"청구기간의 경과 등 요건심리의 요건을 갖추지 못한 과세전 적부심사청구를 받은 세무서장. 지방국세청장 또는 국세청 장은 해당 청구를 불채택하는 결정을 한다.","a":"X","e":"청구기간의 경과 등 요건심리의 요건을 갖추지 못한 과세 전적부심사청구를 받은 세무서장 • . 지방국세청장 또는 국 세청장은 국세심사위원회의 심사를 거쳐 해당 청구를 심 사하지 아니한다는 결정을 한다.","pg":97},{"id":507,"ch":9,"n":69,"q":"과세전적부심사 결정 • 통지기간 내에 그 결과를 통지하지 아니한 경우에는 결정 •통지가 지연됨으로써 해당 기간에 부과되는 납부지연가산세는 부과하지 않는다.","a":"X","e":"과세전적부심사 결정 통지기간 내에 그 결과를 통지하 지 아니한 경우에는 결정 통지가 지연됨으로써 해당 기 간에 부과되는 납부지연가산세의 50%를 감면한다.","pg":97},{"id":508,"ch":9,"n":70,"q":"세무서장으로부터 세무조사 결과에 대한 서면통지를 받은 자는 과세전적부심사를 청구하지 아니한 채, 통지를 한 세무 서장에게 통지받은 내용의 전부 또는 일부에 대하여 과세표 준 및 세액을 조기에 결정하거나 경정결정해 줄 것을 신청 할 수 없다.","a":"X","e":"세무서장으로부터 세무조사 결과에 대한 서면통지를 받 은 자는 과세전적부심사를 청구하지 아니한 채, 통지를 한 세무서장에게 통지받은 내용의 전부 또는 일부에 대하 여 과세표준 및 세액을 조기에 결정하거나 경정결정해 줄 것을 신청할 수 있다.","pg":97},{"id":509,"ch":9,"n":71,"q":"납세자권리보호에 관한 사항을 심의하기 위하여 재정경제 부에 납세자보호위원회를 둔다.","a":"X","e":"납세자권리보호에 관한 사항을 심의하기 위하여 세무서. 지방국세청 및 국세청에 납세자보호위원회를 둔다.","pg":97},{"id":510,"ch":9,"n":72,"q":"납세자가 국내에 주소 또는 거소를 두지 않거나 국외로 주 소 또는 거소를 이전할 때에는 국세에 관한 사항을 처리하 기 위하여 납세관리인을 정할 수 있다.","a":"X","e":"납세자가 국내에 주소 또는 거소를 두지 않거나 국외로 주소 또는 거소를 이전할 때에는 국세에 관한 사항을 처 리하기 위하여 납세관리인을 정하여야 한다.","pg":97},{"id":511,"ch":9,"n":73,"q":"고지할 국세(본세 및 그와 함께 고지하는 교육세·농어촌특 별세 및 인지세를 합한 것을 말한다) 및 강제징수비를 합친 금액이 1만원 미만일 때에는 그 금액은 없는 것으로 본다.","a":"X","e":"고지할 국세(본세 및 그와 함께 고지하는 교육세·농어촌 특별세를 합한 것을 말하며 인지세는 제외한다) 및 강제 징수비를 합친 금액이 1만원 미만일 때에는 그 금액은 없 는 것으로 본다.","pg":98},{"id":512,"ch":9,"n":74,"q":"국세청장은 체납자의 은닉재산을 신고한 자에게 40억원의 범위에서 포상금을 지급할 수 있으며 포상금지급에 관한 안 내 기한의 종료일부터 3개월 이내에 포상금을 지급하여야 한다.","a":"X","e":"국세청장은 체납자의 은닉재산을 신고한 자에게 30억원 의 범위에서 포상금을 지급할 수 있으며 포상금지급에 관 한 안내 기한의 종료일이 속하는 달의 말일부터 2개월 이 내에 포상금을 지급하여야 한다.","pg":98},{"id":513,"ch":9,"n":75,"q":"국세청장은 국제조세조정에 관한 법률」에 따른 해외금융계 좌 신고의무위반행위를 적발하는 데 중요한 자료를 제공한 자에게는 20억원의 범위에서 포상금을 지급할 수 있으나, 해외금융계좌 신고의무 불이행에 따른 과태로 금액이 5천만 원 미만인 경우에는 포상금을 지급하지 아니한다.","a":"X","e":"국세청장은 「국제조세조정에 관한 법률」에 따른 해외금융 계좌 신고의무위반행위를 적발하는 데 중요한 자료를 제 공한 자에게는 20억원의 범위에서 포상금을 지급할 수 있으나, 해외금융계좌 신고의무 불이행에 따른 과태료 금 액이 2천만원 미만인 경우에는 포상금을 지급하지 아니 한다.","pg":98},{"id":514,"ch":9,"n":76,"q":"세무공무원은 납세자로부터 과세표준신고서를 국세정보통 신망에 의하여 제출받은 경우에도 해당 접수사실을 전자적 형태가 아닌 우편으로 통보하여야 한다.","a":"X","e":"세무공무원은 납세자로부터 과세표준신고서를 국세정보 통신망에 의하여 제출받은 경우 해당 접수사실을 전자적 형태로 통보할 수 있다.","pg":98},{"id":515,"ch":9,"n":77,"q":"세무공무원은 납세자로부터 경정청구서를 팩스로 제출받 는 경우에는 납세자에게 접수증을 우편으로 발급해야 한다.","a":"X","e":"세무공무원은 납세자로부터 경정청구서를 팩스로 제출받 는 경우에는 납세자에게 접수증을 교부하지 아니할 수 있 다.","pg":98},{"id":516,"ch":9,"n":78,"q":"세무공무원은 납세자로부터 과세표준수정신고서를 우편으 로 제출받은 경우에는 납세자에게 접수증을 우편으로 발급 해야 한다.","a":"X","e":"세무공무원은 납세자로부터 과세표준수정신고서를 우편 으로 제출받은 경우에는 납세자에게 접수증을 교부하지 아니할 수 있다.","pg":98},{"id":517,"ch":9,"n":79,"q":"세무공무원은 납세자로부터 이의신청서를 직접 제출받는 경 우에는 납세자에게 접수증을 교부하여야 한다.","a":"O","e":"","pg":99},{"id":518,"ch":9,"n":80,"q":"납세자는 각 세법에서 규정하는 바에 따라 모든 거래에 관 한 장부 및 증거서류를 그 거래사실이 속하는 과세기간이 지난 날부터 5년간(역외거래의 경우 7년간) 보존해야 한다.","a":"X","e":"납세자는 각 세법에서 규정하는 바에 따라 모든 거래에 관한 장부 및 증거서류를 그 거래사실이 속하는 과세기간 에 대한 해당 국세의 법정신고기한이 지난 날부터 5년간 (역외거래의 경우 7년간) 보존해야 한다.","pg":99},{"id":519,"ch":9,"n":81,"q":"국세청장은 비밀유지에 관한 규정에도 불구하고 법령이 정 하는 불성실기부금수령단체의 인적사항 • . 국세추징명세 등 은 공개할 수 있다.","a":"O","e":"","pg":99},{"id":520,"ch":9,"n":82,"q":"국세청장은 비밀유지에 관한 규정에도 불구하고 「조세범처 벌법」에 따른 범죄 유죄판결이 확정된 자로서 「조세범처벌 법」에 따른 포탈세액 등이 연간 1억원 이상인 자의 인적사 항 및 포탈세액 등을 공개할 수 있으나 불성실기부금수령단 체에 해당하는지에 대하여 국세기본법에 따른 이의신청, 심 사청구, 심판청구, 「감사원법」에 따른 심사청구 또는 「행정소 송법」에 따른 소송 중에 있는 경우 명단을 공개하지 않는다.","a":"X","e":"국세청장은 비밀유지에 관한 규정에도 불구하고 「조세범 처벌법」에 따른 범죄 유죄판결이 확정된 자로서 「조세범 처벌법」에 따른 포탈세액 등이 연간 2억원 이상인 자의 인적사항 및 포탈세액 등을 공개할 수 있으나 불성실기부 금수령단체에 해당하는지에 대하여 「국세기본법」에 따른 이의신청, 심사청구, 심판청구, 「감사원법」에 따른 심사청 구 또는 행정소송법」에 따른 소송 중에 있는 경우 명단을 공개하지 않는다.","pg":99},{"id":521,"ch":9,"n":83,"q":"국세청장은 비밀유지에 관한 규정에도 불구하고 「국제조세 조정에 관한 법률」에 따른 해외금융계좌정보의 신고의무자 로서 신고기한 내에 신고하지 않거나 과소신고한 금액이 10 억원을 초과하는 자의 인적사항, 신고의무 위반금액 등을 공 개할 수 있으나 국세조세조정에 관한 법률」에 따라 수정신 고 및 기한후신고를 한 경우(조사에 착수한 것을 알았거나 과세자료 해명 통지를 받고 수정신고 및 기한후신고를 한 경우는 제외)에는 명단을 공개하지 않는다.","a":"X","e":"국세청장은 비밀유지에 관한 규정에도 불구하고 「국제조 세조정에 관한 법률」에 따른 해외금융계좌정보의 신고의 무자로서 신고기한 내에 신고하지 않거나 과소신고한 금 액이 50억원을 초과하는 자의 인적사항, 신고의무 위반 금액 등을 공개할 수 있으나 「국세조세조정에 관한 법률」 에 따라 수정신고 및 기한후신고를 한 경우(조사에 착수 한 것을 알았거나 과세자료 해명 통지를 받고 수정신고 및 기한후신고를 한 경우는 제외)에는 명단을 공개하지 않는다.","pg":99},{"id":522,"ch":9,"n":84,"q":"국세청장은 국회의원이 조세정책의 평가 및 연구 등에 활용 하기 위하여 통계자료 작성에 사용된 기초자료를 직접 분석 하기를 원하는 경우 전자매체에 수록하거나 정보통신망을 통해 기초자료를 제공할 수 있다.","a":"X","e":"국세청장은 국회의원이 조세정책의 평가 및 연구 등에 활 용하기 위하여 통계자료 작성에 사용된 기초자료를 직접 분석하기를 원하는 경우 국세청 내에 설치된 국세통계센 터 내에서 기초자료를 제공할 수 있다. 비교 국세청장은 조세정책의 평가 및 연구를 목적으로 기초자료를 이용하려는 자가 소득세 관련 기초자료의 일부의 제공을 요구하는 경우에는 소득세 관련 기초자료의 일부를 검증된 통계작성기법을 적 용하여 표본 형태로 처리한 기초자료(표본자료)를 전자매체에 수록하 거나 정보통신망을 통해 제공하는 방법으로 제공할 수 있다.","pg":100},{"id":523,"ch":9,"n":85,"q":"세무공무원이 그 직무와 관련하여 금품을 수수하였을 때에 는 「국가공무원법」에 따른 징계절차에서 그 금품 수수액의 3 배 이내의 징계부가금 부과 의결을 징계위원회에 요구하여 야 한다.","a":"X","e":"세무공무원이 그 직무와 관련하여 금품을 수수하였을 때 에는 「국가공무원법」에 따른 징계절차에서 그 금품 수수 액의 5배 이내의 징계부가금 부과 의결을 징계위원회에 요구하여야 한다. 비교 관할 세무서장 또는 세관장은 세무공무원에게 금품을 공여한 자에게 그 금품상당액의 2배 이상 5배 이하의 과태료를 부과·징수 한다.","pg":100},{"id":524,"ch":9,"n":86,"q":"관할 세무서장은 세법의 질문. 조사권 규정에 따른 세무공 무원의 질문에 대하여 거짓으로 진술하거나 그 직무집행을 거부 또는 기피한 자에게 5천만원 이하의 과태료를 부과· 징수한다.","a":"O","e":"华","pg":100},{"id":525,"ch":10,"n":1,"q":"원천징수의무자가 납세의무자로부터 국세를 징수하는 경우 「국세징수법」이 적용된다.","a":"X","e":"원천징수의무자가 납세의무자로부터 국세를 징수하는 경 우 각 세법이 정하는 바에 따르며, 「국세징수법이 적용되 지 않는다.","pg":102},{"id":526,"ch":10,"n":2,"q":"국세의 징수에 관하여 「국세기본법」에 특별한 규정이 있는 경우에도 국세징수법」에서 정한 바에 따른다.","a":"X","e":"「국세징수법」에서 규정한 사항 중 「국세기본법이나 다른 세법에 특별한 규정이 있는 것에 관하여는 그 법률에서 정하는 바에 따른다.","pg":102},{"id":527,"ch":10,"n":3,"q":"체납이란 국세를 법정납부기한까지 납부하지 않는 것을 말 한다. 0:X","a":"X","e":"체납이란 국세를 지정납부기한까지 납부하지 않는 것을 말한다.","pg":102},{"id":528,"ch":10,"n":4,"q":"지정납부기한이란 납세의무가 확정된 국세(가산세 포함)를 납부하여야할 기한으로서 관할 세무서장이 납부고지를 하면 서 지정한 기한을 말한다.","a":"O","e":"","pg":102},{"id":529,"ch":10,"n":5,"q":"체납의 징수순위는 강제징수비, 가산세 가산세를 제외한 국 세 순으로 징수하고, 이 중 '국세의 징수순위는 교통·에너 지·환경세, 농어촌특별세, 교육세, 그 밖의 국세의 순으로 징수한다.","a":"X","e":"체납의 징수순위는 강제징수비, 가산세를 제외한 국세. 가산세 순으로 징수하고, 이 중 '국세'의 징수순위는 교육 세, 농어촌특별세, 교통• 에너지·환경세, 그 밖의 국세 의 순으로 징수한다.","pg":102},{"id":530,"ch":10,"n":6,"q":"과세표준 및 세액을 신고하였으나, 납부하지 아니한 종합소 득세 납세의무는 그 미납세액에 대한 납부고지서의 지정납 부기한까지는 납세증명서를 통하여 확인할 수 없다.","a":"O","e":"납세증명서란 발급일 현재 체납액이 없다는 증명서이고 체납액은 지정납부기한까지 해당 국세를 납부하지 않을 때부터 생긴다.","pg":102},{"id":531,"ch":10,"n":7,"q":"납세증명서는 발급일 현재 납부고지의 유예액과 압류·매각 의 유예액을 포함한 체납액이 없다는 사실을 증명하는 것이 다.","a":"X","e":"납세증명서는 발급일 현재 납부고지의 유예액과 압류· 매각의 유예액 등을 제외한 체납액이 없다는 사실을 증명 하는 것이다.","pg":103},{"id":532,"ch":10,"n":8,"q":"납세증명서를 발급받으려는 내국법인의 경우에는 사업장 소 재지를 관할하는 세무서장에게 제출하는 것을 원칙으로 하 고 국세청장이 납세자의 편의를 위하여 발급 세무서를 달리 정하는 경우에는 그 발급 세무서의 장에게 제출해야 한다.","a":"X","e":"납세증명서를 발급받으려는 내국법인의 경우에는 본점 (외국법인인 경우에는 국내 주사업장 소재지를 관할하는 세무서장에게 제출하는 것을 원칙으로 하고 국세청장이 납세자의 편의를 위하여 발급 세무서를 달리 정하는 경우 에는 그 발급 세무서의 장에게 제출해야 한다.","pg":103},{"id":533,"ch":10,"n":9,"q":"납세자는 국가, 지방자치단체 또는 대통령령으로 정하는 정 부관리기관과 계약을 체결하는 때에(체납액이 없다는 사실 의 증명이 필요하지 아니한 경우로서 대통령령으로 정하는 경우는 제외) 납세증명서를 제출하여야 한다.","a":"X","e":"납세자는 국가, 지방자치단체 또는 대통령령으로 정하는 정부 관리기관으로부터 대금을 지급받을 경우(체납액이 없다는 사실의 증명이 필요하지 아니한 경우로서 대통령 령으로 정하는 경우는 제외) 납세증명서를 제출하여야 한 다.","pg":103},{"id":534,"ch":10,"n":10,"q":"출입국관리법」에 따른 외국인등록 또는 「재외동포의 출입 국과 법적 지위에 관한 법률」에 따른 국내거소신고를 한 외 국인이 출국 관련 허가를 법무부장관에게 신청하려는 경우 납세증명서를 제출하여야 한다.","a":"X","e":"「출입국관리법」에 따른 외국인등록 또는 「재외동포의 출 입국과 법적 지위에 관한 법률」에 따른 국내거소신고를 한 외국인이 체류기간 연장허가 등 체류 관련 허가를 법 무부장관에게 신청하는 경우 납세증명서를 제출하여야 한다.","pg":103},{"id":535,"ch":10,"n":11,"q":"「출입국관리법」에 따른 외국인등록 또는 「재외동포의 출입 국과 법적 지위에 관한 법률」에 따른 국내거소신고를 한 외 국인이 해외이주 목적으로 해외이주법」에 따라 재외동포청 장에게 해외이주신고를 하는 경우 납세증명서를 제출하여야 한다.","a":"X","e":"내국인이 해외이주 목적으로 「해외이주법」에 따라 재외동 포청장에게 해외이주신고를 하는 경우 납세증명서를 제 출하여야 한다.","pg":103},{"id":536,"ch":10,"n":12,"q":"법원의 전부명령에 따라 원래의 계약자 외의 자가 지방자치 단체로부터 대금을 지급받는 경우 압류채권자와 채무자의 납세증명서를 제출하여야 한다.","a":"X","e":"법원의 전부명령에 따라 원래의 계약자 외의 자가 지방자 치단체로부터 대금을 지급받는 경우 압류채권자의 납세 증명서를 제출하여야 한다.","pg":103},{"id":537,"ch":10,"n":13,"q":"채권양도로 인하여 원래의 계약자 외의 자가 지방자치단체 로부터 대금을 지급받는 경우 양수인의 납세증명서를 제출 하여야 한다.","a":"X","e":"채권양도로 인하여 원래의 계약자 외의 자가 지방자치단 체로부터 대금을 지급받는 경우 양도인과 양수인의 납세 증명서를 제출하여야 한다.","pg":104},{"id":538,"ch":10,"n":14,"q":"납세증명서를 관계 법령에 따라 의무적으로 제출해야 하는 경우 해당 주무관서는 납세자의 동의 없이 행정정보의 공동 이용을 통하여 그 체납사실 여부를 확인함으로써 납세증명 서의 제출을 갈음할 수 있다.","a":"X","e":"납세증명서를 관계 법령에 따라 의무적으로 제출해야 하 는 경우 해당 주무관서는 납세자의 동의를 받아 행정정보 의 공동이용을 통하여 그 체납사실 여부를 확인하는 경우 에는 납세증명서를 제출받은 것으로 볼 수 있다.","pg":104},{"id":539,"ch":10,"n":15,"q":"납세자는 수의계약(비상재해가 발생한 경우에 국가가 소유 하는 복구용 자재를 재해를 당한 자에게 매각하는 경우는 제외)과 관련하여 국가로부터 대금을 지급받는 경우 납세증 명서를 제출하여야 한다.","a":"X","e":"납세자는 수의계약(비상재해가 발생한 경우에 국가가 소 유하는 복구용 자재를 재해를 당한 자에게 매각하는 경우 는 제외)과 관련하여 국가로부터 대금을 지급받는 경우 납세증명서를 제출하지 아니하여도 된다.","pg":104},{"id":540,"ch":10,"n":16,"q":"국가 또는 지방자치단체가 대금을 지급받아 그 대금이 국고 또는 지방자치단체 금고에 귀속되는 경우 납세증명서를 제 출하여야 한다.","a":"X","e":"국가 또는 지방자치단체가 대금을 지급받아 그 대금이 국 고 또는 지방자치단체 금고에 귀속되는 경우 납세증명서 를 제출하지 아니하여도 된다.","pg":104},{"id":541,"ch":10,"n":17,"q":"납세자가 계약대금 전액을 체납세액으로 납부하거나 계약대 금 중 일부 금액으로 체납세액 전액을 납부하려는 경우 납 세증명서를 제출하지 아니하여도 된다.","a":"O","e":"","pg":104},{"id":542,"ch":10,"n":18,"q":"납세자가 계약대금 일부를 체납세액으로 납부하거나 계약대 금 중 일부 금액으로 체납세액 일부금액을 납부하려는 경우 납세증명서를 제출하지 아니하여도 된다.","a":"X","e":"납세자가 계약대금 전액을 체납세액으로 납부하거나 계 약대금 중 일부 금액으로 체납세액 진액을 납부하려는 경 우 납세증명서를 제출하지 아니하여도 된다.","pg":104},{"id":543,"ch":10,"n":19,"q":"납세증명서의 유효기간은 그 증명서를 발급한 날부터 30일 간으로 한다.","a":"O","e":"","pg":104},{"id":544,"ch":10,"n":20,"q":"납세증명서 발급일 현재 발급신청인에게 납부고지된 국세가 있는 경우의 납세증명서의 유효기간은 해당 국세의 지정납 부기한부터 30일간으로 할 수 있으며 이 경우 해당 납세증 명서에 그 사유와 유효기간을 분명하게 적어야 한다.","a":"X","e":"납세증명서 발급일 현재 발급신청인에게 납부고지된 국 세가 있는 경우에는 해당 국세의 지정납부기한까지로 할 수 있으며 이 경우 해당 납세증명서에 그 사유와 유효기 간을 분명하게 적어야 한다.","pg":105},{"id":545,"ch":10,"n":21,"q":"「주택임대차보호법」에 따른 주거용 건물 또는 「상가건물 임 대차보호법」에 따른 상가건물을 임차하여 사용하려는 자는 해당 건물에 대한 임대차계약을 하기 전까지만 임대인의 동 의를 받아 그 자가 납부하지 아니한 것으로서 법으로 정하 는 국세 또는 체납액의 열람을 임차할 건물 소재지의 관할 세무서장에게 신청할 수 있다.","a":"X","e":"「주택임대차보호법」에 따른 주거용 건물 또는 「상가건물 임대차보호법」에 따른 상가건물을 임차하여 사용하려는 자는 해당 건물에 대한 임대차계약을 하기 전 또는 임대 차계약을 체결하고 임대차 기간이 시작하는 날까지 임대 인의 동의를 받아 그 자가 납부하지 아니한 것으로서 법 으로 정하는 국세 또는 체납액의 열람을 임차할 건물 소 재지의 관할 세무서장에게 신청할 수 있다.","pg":105},{"id":546,"ch":10,"n":22,"q":"「주택임대차보호법」에 따른 주거용 건물 또는 임대차보호 법」에 따른 상가건물을 임차하여 사용하려는 자는 해당 건 물에 대한 임대차계약을 하기 전 또는 임대차 기간 만료 전 까지 임대인의 동의를 받아 임대인이 납부하지 아니한 국세 의 열람을 신청할 수 있다.","a":"X","e":"「주택임대차보호법」에 따른 주거용 건물 또는 임대차보 호법」에 따른 상가건물을 임차하여 사용하려는 자는 임대 차계약을 하기 전 또는 임대차계약을 체결하고 임대차 기 간이 시작하는 날까지 임대인의 동의를 받아 임대인이 납 부하지 아니한 국세의 열람을 신청할 수 있다.","pg":105},{"id":547,"ch":10,"n":23,"q":"미납국세의 열람 신청은 임차할 건물 소재지의 관할 세무서 장에게 신청해야 하며, 관할 세무서장이 아닌 다른 세무서장 에게는 신청할 수 없다.","a":"X","e":"열람 신청은 관할 세무서장이 아닌 다른 세무서장에게도 할 수 있으며, 신청을 받은 세무서장은 그 열람 신청에 따 라야 한다.","pg":105},{"id":548,"ch":10,"n":24,"q":"임대차계약을 체결한 임차인으로서 해당 계약에 따른 보증 금이 1천만원 이상인 자는 임대차 기간이 시작하는 날까지 임대인의 동의 없이도 임대인이 납부하지 아니한 것으로서 법으로 정하는 국세 또는 체납액의 열람을 신청할 수 있다. 이 경우 신청을 받은 세무서장은 열람 내역을 지체 없이 임 대인에게 통지하여야 한다.","a":"X","e":"임대차계약을 체결한 임차인으로서 해당 계약에 따른 보 증금이 1천만원을 초과하는 자는 임대차 기간이 시작하는 날까지 임대인의 동의 없이도 임대인이 납부하지 아니한 것으로서 법으로 정하는 국세 또는 체납액의 열람을 신청 할 수 있다. 이 경우 신청을 받은 세무서장은 열람 내역을 지체 없이 임대인에게 통지하여야 한다.","pg":105},{"id":549,"ch":10,"n":25,"q":"임차인이 미납국세 등을 열람하는 경우, 임대인이 각 세법에 따른 과세표준 및 세액의 신고기한까지 신고한 국세 중 납 부하지 아니한 국세는 열람할 수 없다.","a":"X","e":"임차인은 건물 소유자가 납부하지 아니한 다음의 국세 또 는 체납액의 열람을 신청할 수 있다. ① 체납액 ② 납부고지서를 발급한 후 지정납부기한이 도래하지 않은 국세 ③ 각 세법에 따른 과세표준 및 세액의 신고기한까지 신고한 국제 중 납부하지 않은 국세","pg":106},{"id":550,"ch":10,"n":26,"q":"임차인이 열람할 수 있는 국세는 임대인이 납부고지서를 발 급받은 후 지정납부기한이 도래한 국세와 임대인이 각 세법 에 따른 과세표준 및 세액의 신고기한까지 신고한 국세 중 납부하지 아니한 국세에 한한다.","a":"X","e":"임차인이 열람할 수 있는 국세는 각 세법에 따른 과세표 준 및 세액의 신고기한까지 신고한 국세 중 납부하지 않 은 국세도 포함한다.","pg":106},{"id":551,"ch":10,"n":27,"q":"세무서장은 미납국세 등의 열람신청을 받은 경우 각 세법에 따른 과세표준 및 세액의 신고기한까지 임대인이 신고한 국 세 중 납부하지 않은 국세에 대해서 즉시 열람 신청에 따라 열람할 수 있게 해야 한다.","a":"X","e":"세무서장은 미납국세 등의 열람신청을 받은 경우 각 세법 에 따른 과세표준 및 세액의 신고기한까지 임대인이 신고 한 국세 중 납부하지 않은 국세에 대해서는 신고기한부터 30일(종합소득세의 경우에는 60일)이 지났을 때부터 열 람 신청에 따라 열람할 수 있게 해야 한다","pg":106},{"id":552,"ch":10,"n":28,"q":"관할 세무서장은 허가 등을 받아 사업을 경영하는 자가 해 당 사업과 관련된 소득세, 법인세 및 부가가치세를 2회 이상 체납하고 그 체납액이 3백만원 이상일 때에는 법으로 정하 는 경우를 제외하고 해당 주무관청에 사업의 정지 또는 허 가 등의 취소를 요구할 수 있다.","a":"X","e":"관할 세무서장은 허가 등을 받아 사업을 경영하는 자가 해당 사업과 관련된 소득세, 법인세 및 부가가치세를 3회 이상 체납하고 그 체납액이 5백만원 이상일 때에는 법으 로 정하는 경우를 제외하고 해당 주무관청에 사업의 정지 또는 허가 등의 취소를 요구할 수 있다.","pg":106},{"id":553,"ch":10,"n":29,"q":"세무서장은 허가 등을 받아 사업을 경영하는 자가 국세를 3 회 이상 체납한 경우로서 그 체납액이 5백만 원 이상이면 공 사달의 방법으로 납세가 고지된 경우에도 그 주무관서에 사업의 정지를 요구할 수 있다.","a":"X","e":"공시송달의 방법으로 납부고지된 경우 관할 세무서장이 체납에 정당한 사유가 있다고 보아 사업에 관한 허가 등 을 제한하지 않는다.","pg":106},{"id":554,"ch":10,"n":30,"q":"세금체납이 있었지만 그 원인이 납세자가 재난 또는 도난으 로 재산에 심한 손실을 입은 경우로 체납에 정당한 사유가 있다고 보는 경우에는 관할 세무서장이 그 납세자의 사업에 관한 허가 등을 제한하지 않는다.","a":"O","e":"","pg":107},{"id":555,"ch":10,"n":31,"q":"세금체납이 있었지만 납세자 또는 그 동거가족이 질병이나 중상해로 3개월 이상의 치료가 필요한 경우 또는 사망하여 상중인 경우에 해당될 때에는 체납에 정당한 사유가 있다고 보아 관할 세무서장이 사업에 관한 허가 등을 제한하지 않 는다.","a":"X","e":"세금체납이 있었지만 납세자 또는 그 동거가족이 질병이 나 중상해로 6개월 이상의 치료가 필요한 경우 또는 사망 하여 상중인 경우에 해당될 때에는 체납에 정당한 사유가 있다고 보아 관할 세무서장이 사업에 관한 허가 등을 제 한하지 않는다.","pg":107},{"id":556,"ch":10,"n":32,"q":"세금체납이 있었지만 납세자가 경영하는 사업에 현저한 손 실이 발생하거나 부도 또는 도산의 우려가 있는 경우로서 체납에 정당한 사유가 있다고 보는 경우에도 관할 세무서장 이 그 납세자의 사업에 관한 허가 등을 제한할 수 있다.","a":"X","e":"세금체납이 있었지만 납세자가 경영하는 사업에 현저한 손실이 발생하거나 부도 또는 도산의 우려가 있는 경우로 서 체납에 정당한 사유가 있다고 보는 경우에는 관할 세 무서장이 그 납세자의 사업에 관한 허가 등을 제한하지 않는다.","pg":107},{"id":557,"ch":10,"n":33,"q":"관할 세무서장의 사업에 관한 허가 등 제한 요구가 있을 때 에는 해당 주무관청은 정당한 사유가 없으면 요구에 따라야 하며, 그 조치 결과를 즉시 관할 세무서장에게 알려야 한다.","a":"O","e":"","pg":107},{"id":558,"ch":10,"n":34,"q":"관할 세무서장은 주무관청에 사업에 관한 허가 등의 제한 요구를 한 후 해당 국세를 징수한 경우 그 요구를 철회할 수 있다.","a":"X","e":"관할 세무서장은 주무관청에 사업에 관한 허가 등의 제한 요구를 한 후 해당 국세를 징수한 경우 즉시 그 요구를 철 회해야 한다.","pg":107},{"id":559,"ch":10,"n":35,"q":"관할 세무서장(지방국세청장 포함)은 국세징수 또는 공익 목 적을 위하여 필요한 경우로서 신용정보집중기관 등 일정한 자가 체납 발생일부터 1년이 지나고 체납액이 300만원 이상 인자의 체납자료를 요구하는 경우에는 이를 제공할 수 있 다.","a":"X","e":"관할 세무서장(지방국세청장 포함)은 국세징수 또는 공익 목적을 위하여 필요한 경우로서 신용정보집중기관 등 일 정한 자가 체납 발생일부터 1년이 지나고 체납액이 500 만원 이상인 자의 체납자료를 요구하는 경우에는 이를 제 공할 수 있다.","pg":108},{"id":560,"ch":10,"n":36,"q":"관할 세무서장(지방국세청장 포함)은 국세징수 또는 공익 목적을 위하여 필요한 경우로서 신용정보집중기관 등 일정 한 자가 1년에 2회 이상 체납하고 체납액이 500만원 이상인 자의 체납자료를 요구하는 경우에는 이를 제공할 수 있다.","a":"X","e":"관할 세무서장(지방국세청장 포함)은 국세징수 또는 공 익 목적을 위하여 필요한 경우로서 신용정보집중기관 등 일정한 자가 1년에 3회 이상 체납하고 체납액이 500만원 이상인 자의 체납자료를 요구하는 경우에는 이를 제공할 수 있다.","pg":108},{"id":561,"ch":10,"n":37,"q":"세무서장은 체납된 국세와 관련하여 「국세기본법」에 따른 심사청구가 계류 중인 경우라 하더라도 집행부정지 규정에 따라 신용정보회사가 체납발생일로부터 1년이 지나고 체납 액이 5백만원 이상인 자의 체납자료를 요구한 경우 이를 제 공해야 한다.","a":"X","e":"세무서장은 체납된 국세와 관련하여 「국세기본법」에 따른 심사청구가 계류 중인 경우라면 체납자료를 제공하지 아 니한다.","pg":108},{"id":562,"ch":10,"n":38,"q":"「부가가치세법」 「종합부동산세법」에 따라 물적납세의무를 부담하는 수탁자 및 「국세기본법」에 따라 물적납세의무를 부담하는 양도담보권자가 그 물적납세의무와 관련한 부가가 치세 종합부동산세 및 국세 또는 강제징수비를 체납한 경 우 체납자료를 제공하지 아니한다.","a":"O","e":"","pg":108},{"id":563,"ch":10,"n":39,"q":"국세청장·지방국세청장 또는 관할 세무서장은 「금융실명 거래 및 비밀보장에 관한 법률」에 따라 제출받은 이자소득 또는 배당소득에 대한 지급명세서 등 금융거래에 관한 정보 를 체납자의 재산조회와 강제징수를 위하여 사용할 수 없다. ○","a":"X","e":"국세청장·지방국세청장 또는 관할 세무서장은 「금융실 명거래 및 비밀보장에 관한 법률」에도 불구하고 제출받은 이자소득 또는 배당소득에 대한 지급명세서 등 금융거래 에 관한 정보를 체납자의 재산조회와 강제징수를 위하여 사용할 수 있다.","pg":108},{"id":564,"ch":10,"n":40,"q":"국세청장은 정당한 사유 없이 5천만원 이상의 국세를 체납 한자 중 미화 5천 달러 상당액 이상의 국외자산이 발견된 자에 대하여 법무부장관에게 법령에 따라 출국금지를 요청 하여야 한다.","a":"X","e":"국세청장은 정당한 사유 없이 5천만원 이상의 국세를 체 남한 자 중 미화 5만 달러 상당액 이상의 국외자산이 발 견되었으며, 관할 세무서장이 압류 등으로 조세채권을 확 보할 수 없고, 강제징수를 회피할 우려가 있다고 인정되 는 자에 대하여 법무부장관에게 법령에 따라 출국금지를 요청하여야 한다.","pg":109},{"id":565,"ch":10,"n":41,"q":"대법원판례는 재산을 해외로 도피할 우려가 있는지 여부 등 을 확인하지 않은 채 단순히 일정 금액 이상의 조세를 미납 하였고 그 미납에 정당한 사유가 없다면 바로 출국금지처분 을 하는 것은 헌법상의 기본권 보장 원리 및 과잉금지의 원 칙에 비추어 허용된다고 본다.","a":"X","e":"대법원판례는 재산을 해외로 도피할 우려가 있는지 여부 등을 확인하지 않은 채 단순히 일정 금액 이상의 조세를 미납하였고 그 미납에 정당한 사유가 없다는 사유만으로 바로 출국금지처분을 하는 것은 헌법상의 기본권 보장 원 리 및 과잉금지의 원칙에 비추어 허용되지 않는다고 본 다.","pg":109},{"id":566,"ch":10,"n":42,"q":"국세청장은 체납액 징수, 체납자 재산의 압류, 담보제공 등 으로 출국금지 사유가 해소된 경우에는 법무부장관에게 출 국금지 해제를 요청할 수 있다.","a":"X","e":"국세청장은 체납액 징수, 체납자 재산의 압류, 담보제공 등으로 출국금지 사유가 해소된 경우에는 즉시 법무부장 관에게 출국금지의 해제를 요청하여야 한다.","pg":109},{"id":567,"ch":10,"n":43,"q":"국세청장은 정당한 사유 없이 5천만원 이상의 국세를 체납 한자 중 「국세징수법」에 따라 사해행위 취소소송 중이거나 「국세기본법」에 따라 제3자와 짜고 한 거짓계약에 대한 취소 소송 중인 자에 대하여는 출국금지를 요청할 수 없다. OX 44 출국금지 중인 사람이 국외건설계약 체결, 수출신용장 개설, 외국인과의 합작사업 계약 체결 등 구체적인 사업계획을 가 지고 출국하려는 경우 국세청장은 즉시 법무부장관에게 출 국금지 해제를 요청해야 한다.","a":"X","e":"국세청장은 정당한 사유 없이 5천만원 이상의 국세를 체 남한 자 중 국세징수법」에 따라 사해행위 취소소송 중이 거나 「국세기본법」에 따라 제3자와 짜고 한 거짓계약에 대한 취소소송 중인 사람으로서 관할 세무서장이 압류 등 으로 조세채권을 확보할 수 없고, 강제징수를 회피할 우 려가 있다고 인정되는 자에 대하여 법무부장관에게 법령 에 따라 출국금지를 요청해야 한다. 축제] CD LINK 오진다 p.109 p.203 출국금지 중인 사람이 국외건설계약 체결, 수출신용장 개 설, 외국인과의 합작사업 계약 체결 등 구체적인 사업계획 을 가지고 출국하려는 경우로서 강제징수를 회피할 목적으 로 국외로 도피할 우려가 없다고 인정할 때에는 국세청장 은 법무부장관에게 출국금지 해제를 요청할 수 있다. ・강제적 해제 사유(반드시 해제를 요청 하여야 하는 사유)와 선택 적 해제 사유(해제를 요청할 수 있는 사유)는 꼭 구분하여 챙겨가자","pg":109},{"id":568,"ch":10,"n":45,"q":"국외에 거주하는 직계존비속이 사망하여 출국하려는 경우 국세청장은 즉시 법무부장관에게 출국금지의 해제를 요청해 야 한다.","a":"X","e":"국외에 거주하는 직계존비속이 사망하여 출국하려는 경 우로서 강제 징수를 회피할 목적으로 국외로 도피한 우려 가 없다고 인정한 때에는 국세청장은 법무부장관에게 출 국금지 해제를 요청할 수 있다.","pg":110},{"id":569,"ch":10,"n":46,"q":"재산 압류, 담보제공, 보증인의 납세보증서 등으로 조세채권 이 확보된 경우로서 강제징수를 회피할 목적으로 국외로 도 피할 우려가 없다고 인정할 때에는 국세청장은 법무부장관 에게 출국금지의 해제를 요청할 수 있다.","a":"X","e":"재산 압류, 담보제공, 보증인의 납세보증서 등으로 조세 채권이 확보된 경우 국세청장은 즉시 법무부장관에게 출 국금지 해제를 요청해야 한다.","pg":110},{"id":570,"ch":10,"n":47,"q":"국세청장은 국세기본법」상 비밀유지 규정에도 불구하고 체 납 발생일부터 1년이 지난 국세가 1억 원인 체납자의 인적 사항, 체납액 등을 공개할 수 있으나, 체납된 국세가 이의신 청심사청구 등 불복청구 중에 있는 경우에는 공개할 수 없다.","a":"X","e":"국세청장은 「국세기본법」상 비밀유지 규정에도 불구하고 체납 발생일부터 1년이 지난 국세의 합계액이 2억원 이상 인 경우 체납자의 인적사항 및 체납액 등을 공개할 수 있 으나 체납된 국세와 관련하여 심판청구 등이 계속 중인 경우 명단공개 대상자의 요건에 해당되는 경우에도 그 명 단을 공개할 수 없다.","pg":110},{"id":571,"ch":10,"n":48,"q":"최근 1년간의 체납액의 납부비율이 30% 이상인 경우 명단 공개 대상자의 요건에 해당되는 경우에도 그 명단을 공개할 수 없다.","a":"X","e":"최근 2년간의 체납액의 납부비율이 50% 이상인 경우 명 단공개 대상자의 요건에 해당되더라도 그 명단을 공개할 수 없다.","pg":110},{"id":572,"ch":10,"n":49,"q":"「부가가치세법」· 「종합부동산세법」에 따라 물적납세의무를 부담하는 수탁자 및 「국세기본법」에 따라 물적납세의무를 부담하는 양도담보권자가 그 물적납세의무와 관련한 부가가 치세·종합부동산세 및 국세 또는 강제징수비를 체납한 경 우로서 명단공개 대상자의 요건에 해당되는 경우 그 명단을 공개할 수 있다.","a":"X","e":"「부가가치세법」・「종합부동산세법」에 따라 물적납세의무 를 부담하는 수탁자 및 「국세기본법」에 따라 물적납세의 무를 부담하는 양도담보권자가 그 물적납세의무와 관련 한 부가가치세, 종합부동산세 및 국세 또는 강제징수비 를 체납한 경우에는 명단공개 대상자의 요건에 해당되는 경우에도 그 명단을 공개할 수 없다.","pg":110},{"id":573,"ch":10,"n":50,"q":"국세청장은 체납 발생일부터 1년이 지난 국세의 합계액이 2 억원 이상인 경우에 체납자의 주소 또는 거소를 관할하는 지방검찰청 또는 지청의 검사에게 체납자의 감치를 신청할 수 있다.","a":"X","e":"국세청장은 체납자가 다음의 사유에 모두 해당하는 경우 체납자의 주소 또는 거소를 관할하는 지방검찰청 또는 지 청의 검사에게 체납자의 감치를 신청할 수 있다. 국세를 3회 이상 체납하고 있고, 체납 발생일부터 각 1 년이 경과하였으며, 체납된 국세의 합계액이 2억원 이 상인 경우 ② 체납된 국세의 납부능력이 있음에도 불구하고 정당한 사유 없이 체납한 경우 ③ 「국세기본법」에 따른 국세정보위원회의 의결에 따라 해당 체납자에 대한 감치 필요성이 인정되는 경우 참고 감치 요건은 'OR'가 아닌 'AND'이다. 즉, 요건을 모두 충족해 야 감치에 처할 수 있음에 주의하자.","pg":111},{"id":574,"ch":10,"n":51,"q":"국세를 3회 이상 체납하고 있고, 체납 발생일부터 각 1년이 경과하였으며, 체납된 국세의 합계액이 2억원 이상인 경우 체납된 국세의 납부능력이 있음에도 불구하고 정당한 사유 없이 체납하였다면 국세청장은 체납자를 30일의 범위에서 체납된 국세가 납부될 때까지 감치에 처할 수 있다.","a":"X","e":"국세를 3회 이상 체납하고 있고, 체납 발생일부터 각 1년 이 경과하였으며, 체납된 국세의 합계액이 2억원 이상인 경우 체납된 국세의 납부능력이 있음에도 불구하고 정당 한 사유 없이 체납하였으며 「국세기본법」에 따른 국세정 보위원회의 의결에 따라 해당 체납자에 대한 감치 필요성 이 인정되는 경우 법원은 체납자를 30일의 범위에서 체 납된 국세가 납부될 때까지 감치에 처할 수 있다.","pg":111},{"id":575,"ch":10,"n":52,"q":"법원의 결정으로 30일의 범위에서 체납된 국세가 납부될 때까지 체납자를 감치에 처할 수 있으며 김치의 집행 중에 체납된 국세를 납부한 경우 감치집행을 종료하여야 한다.","a":"O","e":"","pg":111},{"id":576,"ch":10,"n":53,"q":"감치에 처하여진 체납자는 동일한 체납 사실로 인하여 다시 감치되지 아니한다.","a":"O","e":"","pg":111},{"id":577,"ch":11,"n":1,"q":"「국세기본법」에 따른 납부지연가산세 및 원천징수 등 납부 지연가산세 중 지정납부기한이 지난 후의 가산세를 징수하 는 경우에는 가산세에 관계되는 국세의 과세기간, 세목, 가 산세의 금액, 산출 근거, 납부하여야 할 기한 및 납부장소를 적은 납부고지서를 납세자에게 발급하여야 한다.","a":"X","e":"「국세기본법」에 따른 납부지연가산세 및 원천징수 등 납 부지연가산세 중 지정납부기한이 지난 후의 가산세를 징 수하는 경우에는 납부고지서를 발급하지 아니할 수 있다. 비교 관할 세무서장은 납세자가 체납액 중 국세안을 완납하여 강제 징수비를 징수하려는 경우 강제징수비의 징수에 관계되는 국세의 과세기간, 세목, 강제징수비의 금액, 산출 근거, 납부하여야 할 기한 및 납부장소를 적은 강제징수비고지서를 납세자에게 발급하여야 함","pg":112},{"id":578,"ch":11,"n":2,"q":"「국세기본법」에 따른 납부지연가산세 및 원천징수 등 납부 지연가산세 중 지정납부기한이 지난 후의 가산세를 징수하 는 경우에는 납부고지서를 발급하여야 한다.","a":"X","e":"「국세기본법」에 따른 납부지연가산세 및 원천징수 등 납 부지연가산세 중 지정납부기한이 지난 후의 가산세를 징 수하는 경우에는 납부고지서를 발급하지 아니할 수 있다.","pg":112},{"id":579,"ch":11,"n":3,"q":"납부고지서는 징수결정 즉시 발급해야 하고 납부고지를 유 예한 경우 납부고지서는 유예기간이 끝난 날의 다음 날에 발급해야 한다.","a":"O","e":"","pg":112},{"id":580,"ch":11,"n":4,"q":"관할 세무서장은 세법에서 국세(강제징수비 제외)의 납부기 한을 정하는 경우 외에는 국세의 납부기한을 납부고지하는 날부터 20일 내로 지정할 수 있다.","a":"X","e":"관할 세무서장은 세법에서 국세(강제징수비 포함)의 납부 기한을 정하는 경우 외에는 국세의 납부기한을 납부고지 를 하는 날부터 30일 내로 지정할 수 있다.","pg":112},{"id":581,"ch":11,"n":5,"q":"납부기한 전 징수의 고지를 받고 국세를 지정납부기한까지 완납하지 아니한 때에는 납부기한이 지난 후 15일 이내에 독 촉장을 발부하여야 한다.","a":"X","e":"납부기한 전 징수의 고지를 받고 국세를 지정납부기한까 지 완납하지 아니한 때에는 독촉 절차를 거치지 않고 납 세자의 재산을 압류할 수 있다.","pg":112},{"id":582,"ch":11,"n":6,"q":"체납된 국세가 1만원 미만인 경우 독촉장을 발급하지 아니 할 수 있다.","a":"O","e":"","pg":112},{"id":583,"ch":11,"n":7,"q":"납세자가 국세를 지정납부기한까지 완납하지 않은 경우로서 「국세기본법」 및 세법에 따라 물적납세의무를 부담하는 경 우에는 독촉장을 발급하여야 한다.","a":"X","e":"납세자가 국세를 지정납부기한까지 완납하지 아니하였다 하더라도 「국세기본법」 및 세법에 따라 물적납세의무를 부담하는 경우에는 독촉장을 발급하지 아니할 수 있다.","pg":113},{"id":584,"ch":11,"n":8,"q":"「국세기본법」 및 세법에 따라 물적납세의무를 부담하는 자 가 국세를 지정납부기한까지 완납하지 아니한 경우 관할 세 무서장은 독촉을 하는 날부터 20일 이내의 범위에서 납부기 한을 정하여 독촉장을 발급한다.","a":"X","e":"납세자가 국세를 지정납부기한까지 완납하지 아니하였다 하더라도 「국세기본법」 및 세법에 따라 물적납세의무를 부담하는 경우에는 독촉장을 발급하지 아니할 수 있다.","pg":113},{"id":585,"ch":11,"n":9,"q":"독촉은 국세징수권의 소멸시효를 중단시키는 효과가 있으며 독촉에 의한 납부기간이 경과하면 소멸시효는 새로이 시작 된다.","a":"O","e":"","pg":113},{"id":586,"ch":11,"n":10,"q":"강제집행 및 담보권 실행 등을 위한 경매가 시작되거나 파 산선고를 받은 경우로서 납부기한까지 기다려서는 징수할 수 없다고 인정하는 경우 납부기한 전이라도 이미 납세의무 가 성립된 국세를 징수할 수 있다.","a":"X","e":"강제집행 및 담보권 실행 등을 위한 경매가 시작되거나 파산선고를 받은 경우로서 납부기한까지 기다려서는 징 수할 수 없다고 인정하는 경우 납부기한 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있다.","pg":113},{"id":587,"ch":11,"n":11,"q":"국세, 지방세 또는 공과금의 체납으로 강제징수 또는 체납처 분이 시작된 경우로서 납부기한까지 기다려서는 징수할 수 없다고 인정하는 경우 납부기한 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있다.","a":"O","e":"","pg":113},{"id":588,"ch":11,"n":12,"q":"「어음」 또는 「수표법」에 따른 어음교환소에서 거래정지처 분을 받은 경우로서 납부기한까지 기다려서는 징수할 수 없 다고 인정하는 경우 납부기한 전이라도 이미 납세의무가 확 정된 국세를 징수할 수 있다.","a":"O","e":"","pg":113},{"id":589,"ch":11,"n":13,"q":"통고처분을 받은 경우로서 납부기한까지 기다려서는 징수할 수 없다고 인정하는 경우 납부기한 전이라도 이미 납세의무 가 확정된 국세를 징수할 수 있다.","a":"X","e":"통고처분을 받은 경우는 납부기한 전 징수 사유에 해당하 지 아니한다.","pg":114},{"id":590,"ch":11,"n":14,"q":"기업의 구조조정이 시작된 경우로서 납부기한까지 기다려서 는 징수할 수 없다고 인정하는 경우 납부기한 전이라도 이 미 납세의무가 확정된 국세를 징수할 수 있다.","a":"X","e":"기업의 구조조정이 시작된 경우는 납부기한 진 징수 사유 에 해당하지 아니한다.","pg":114},{"id":591,"ch":11,"n":15,"q":"법인이 해산한 경우로서 납부기한까지 기다려서는 징수할 수 없어 납부기한 전에 국세를 징수하려는 경우 당초의 납 부기한보다 단축된 기한을 정하여 납세자에게 납부고지를 하여야 한다.","a":"O","e":"","pg":114},{"id":592,"ch":11,"n":16,"q":"납세자의 사업이 중대한 위기에 처한 경우로서 납부기한까 지 기다려서는 징수할 수 없다고 인정한 경우 납부기한 전 이라도 이미 납세의무가 확정된 국세를 징수할 수 있다.","a":"X","e":"납세자의 사업이 중대한 위기에 처한 경우는 납부기한 전 징수 사유에 해당하지 아니한다. 비교 사업이 중대한 위기에 처한 경우는 납부기한 등 연장 사유에 해 당하며, 그 연장된 납부기한 등까지 해당 국세를 납부할 수 있다고 인 정하는 경우 등 일정 경우엔 납세담보를 요구할 수 없음","pg":114},{"id":593,"ch":11,"n":17,"q":"납부기한 전 징수에 따라 납부고지를 받고 단축된 기한까지 국세를 완납하지 아니한 경우에는 독촉없이 압류한다.","a":"O","e":"","pg":114},{"id":594,"ch":11,"n":18,"q":"관할 세무서장은 납세자가 납세관리인을 정하지 않고 국내 에 주소. 거소를 두지 않게 된 경우로서 납부기한까지 기 다려서는 징수할 수 없어 납부기한 전에 국세를 징수하려는 경우 해당 고지서가 단축된 기한 전에 도달한 때에는 그 도 달한 날을 납부기한으로 한다.","a":"X","e":"납부기한 전 징수를 위한 고지의 경우 해당 고지서가 단 축된 기한 전에 도달한 때에는 그 단축된 기한을 납부하 여야 할 기한으로 한다. 비교 단축된 기한이 지난 후에 도달한 때에는 도달한 날을 납부기한 으로 함","pg":114},{"id":595,"ch":11,"n":19,"q":"「여신전문금융업법」에 따른 신용카드 또는 직불카드 및 「정 보통신망 이용촉진 및 정보보호 등에 관한 법률」에 따른 통 신과금서비스 등으로 국세를 납부하는 경우에는 국세납부대 행기관의 승인일을 납부일로 본다.","a":"O","e":"","pg":115},{"id":596,"ch":11,"n":20,"q":"납세자는 납부고지를 받은 국세 또는 지정납부기한이 지난 국세를 금융회사 등에 개설된 예금계좌로부터 자동이체하는 방법으로 납부할 수 있다.","a":"X","e":"납세자는 납부고지를 받은 국세 중 재정경제부령으로 정 하는 국세를 금융회사 등에 개설된 예금계좌로부터 자동 이체하는 방법으로 납부할 수 있다. 다만, 지정납부기한 이 지난 국세는 자동이체하는 방법으로 납부할 수 없다.","pg":115},{"id":597,"ch":11,"n":21,"q":"납세자가 도난으로 재산에 심한 손실을 입은 경우는 납부기 한의 연장사유에 해당하나 세무사법」에 따라 납세자의 장 부 작성을 대행하는 세무사가 해당 납세자의 장부를 도난당 한 경우는 해당하지 아니한다.","a":"X","e":"납세자가 도난으로 재산에 심한 손실을 입은 경우뿐만 아 니라 「세무사법」에 따라 납세자의 장부 작성을 대행하는 세무사가 재해를 입거나 해당 납세자의 장부를 도난당한 경우도 납부기한의 연장사유에 해당한다.","pg":115},{"id":598,"ch":11,"n":22,"q":"관할 세무서장은 납세자가 경영하는 사업에 현저한 손실이 발생하거나 부도 또는 도산의 우려가 있어 국세를 납부기한 또는 독촉장에서 정하는 기한까지 납부할 수 없다고 인정되 는 경우 납부기한 등을 연장할 수 있다.","a":"O","e":"","pg":115},{"id":599,"ch":11,"n":23,"q":"권한 있는 기관에 장부나 서류 또는 그 밖의 물건이 압수 또 는 영치된 경우는 납부기한의 연장 사유에 해당하지 아니한 다.","a":"X","e":"권한 있는 기관에 장부나 서류 또는 그 밖의 물건이 압수 또는 영치된 경우는 납부기한의 연장 사유에 해당한다.","pg":115},{"id":600,"ch":11,"n":24,"q":"관할 세무서장은 납기가 시작되기 전에 납세자 또는 그 동 거가족의 질병이나 중상해로 6개월 이상의 치료가 필요한 경우 또는 사망하여 상중인 경우로서 납세자가 국세를 납부 할 수 없다고 인정되는 경우 납부고지를 유예(세액을 분할하 여 납부고지하는 것을 포함)할 수 있다.","a":"O","e":"","pg":115},{"id":601,"ch":11,"n":25,"q":"지방세 또는 공과금의 체납으로 강제징수 또는 체납처분이 시작된 사유로 국세를 납부기한 또는 독촉장에서 정하는 기 한까지 납부할 수 없다고 인정되는 경우 납부고지를 유예(세 액을 분할하여 납부고지하는 것을 포함)할 수 있다.","a":"X","e":"지방세 또는 공과금의 체납으로 강제징수 또는 체납처분 이 시작된 경우는 납부기한 등의 연장 등의 사유에 해당 되지 아니한다. 비교 \"지방세 또는 공과금의 체납으로 강제징수 또는 체납처분이 시작된 경우\"는 다음에 해당됨 ① 납부기한 전징수 사유 ② 교부청구의 사유","pg":116},{"id":602,"ch":11,"n":26,"q":"납부기한 등의 연장 또는 납부고지의 유예를 한 경우 그 연 장 또는 유예 기간을 연장 또는 유예한 날의 다음 날부터 1 년 이내로 정하며 연장 또는 유예기간이 9개월을 초과하는 경우에는 가능한 한 연장 또는 유예기간 시작 후 9개월이 지 난 날부터 3개월 이내에 균등액을 분납하도록 정해야 한다.","a":"X","e":"납부기한 등의 연장 또는 납부고지의 유예를 한 경우 그 연장 또는 유예 기간을 연장 또는 유예한 날의 다음 날부 터 9개월 이내로 정하며 연장 또는 유예기간이 6개월을 초과하는 경우에는 가능한 한 연장 또는 유예기간 시작 후 6개월이 지난 날부터 3개월 이내에 균등액을 분납하 도록 정해야 한다.","pg":116},{"id":603,"ch":11,"n":27,"q":"관할 세무서장은 납부기한 등을 연장하거나 납부고지를 유 예한 경우 그 연장 또는 유예기간 동안 납부지연가산세 및 원천징수 등 납부지연가산세를 부과하지 않는다. 납세자가 납부고지 또는 독촉을 받은 후에 「채무자 회생 및 파산에 관 한 법률」에 따른 징수의 유예를 받은 경우에는 그러하지 아 니하다.","a":"X","e":"관할 세무서장은 납부기한 등을 연장하거나 납부고지를 유예한 경우 그 연장 또는 유예기간 동안 납부지연가산세 및 원천징수 등 납부지연가산세를 부과하지 않는다. 납세 자가 납부고지 또는 독촉을 받은 후에 「채무자 회생 및 파 산에 관한 법률」에 따른 징수의 유예를 받은 경우에도 또 한 같다.","pg":116},{"id":604,"ch":11,"n":28,"q":"납세자는 납부기한 등을 연장하려는 경우 납부기한 등의 만 로일 10일 전까지 신청서를 관할 세무서장에게 제출(국세 정보통신망을 통한 제출을 포함)해야 하는 것이 원칙이다.","a":"X","e":"납세자는 납부기한 등의 연장 또는 납부고지의 유예를 신 청하려는 경우 납부기한 등(납부고지의 유예의 경우 납부 고지 예정인 국세를 납부해야 할 기한)의 만료일 3일 전 까지 신청서를 관할 세무서장에게 제출(국세정보통신망 을 통한 제출을 포함)해야 하는 것이 원칙이다. (참고 관할 세무서장이 납세자가 기한 만료일 3일 전까지 신청서를 제출할 수 없다고 인정하는 경우에는 기한 만료일까지 제출할 수 있음","pg":116},{"id":605,"ch":11,"n":29,"q":"관할 세무서장이 납부기한 등의 연장 또는 납부고지의 유예 를 승인하는 경우에는 연장 또는 유예의 승인 내용들을 통 지하고, 기각하는 경우에는 그 사유를 납부기한 등의 만료일 (납부고지 유예의 경우 납부고지 예정인 국세의 납부하여야 할 기한의 만료일)까지 통지해야 한다.","a":"O","e":"","pg":117},{"id":606,"ch":11,"n":30,"q":"납세자가 납부고지 예정인 국세의 납부하여야 할 기한의 만 료일 7일 전까지 한 납세자의 납부고지의 유예 신청에 대하 여 세무서장이 신청일부터 7일 이내에 승인 여부를 통지하 지 아니한 경우에는 신청일부터 7일이 되는 날에 해당 신청 을 승인한 것으로 본다.","a":"X","e":"납세자가 납부고지 예정인 국세의 납부하여야 할 기한의 만료일 10일 전까지 한 납세자의 납부고지의 유예 신청에 대하여 세무서장이 신청일부터 10일 이내에 승인 여부를 통지하지 아니한 경우에는 신청일부터 10일이 되는 날에 해당 신청을 승인한 것으로 본다.","pg":117},{"id":607,"ch":11,"n":31,"q":"관할 세무서장은 부득이한 사유로 납부기한 등의 연장 또는 납부고지의 유예를 하는 경우 납세담보의 제공을 요구해야 한다.","a":"X","e":"관할 세무서장은 부득이한 사유로 납부기한 등의 연장 또 는 납부고지의 유예를 하는 경우 법에서 정한 일정한 경 우를 제외하고는 그 연장 또는 유예와 관계되는 금액에 상당하는 납세담보의 제공을 요구할 수 있다.","pg":117},{"id":608,"ch":11,"n":32,"q":"납세자가 사업에서 심각한 손해를 입거나 그 사업이 중대한 위기에 처한 경우로서 관할 세무서장이 납부 금액, 연장 또 는 유예 기간 및 납세자의 과거 국세 납부명세 등을 고려하 여 납세자가 그 연장 또는 유예 기간 내에 해당 국세를 납부 할 수 있다고 인정하는 경우라 하더라도 납세담보를 요구할 수 있다.","a":"X","e":"납세자가 사업에서 심각한 손해를 입거나 그 사업이 중대 한 위기에 처한 경우로서 관할 세무서장이 납부 금액, 연 장 또는 유예 기간 및 납세자의 과거 국세 납부명세 등을 고려하여 납세자가 그 연장 또는 유예 기간 내에 해당 국 세를 납부할 수 있다고 인정하는 경우 납세담보를 요구할 수 없다.","pg":117},{"id":609,"ch":11,"n":33,"q":"납세자가 재난 또는 도난으로 재산에 심한 손실을 입어 납 부기한 등을 연장하는 경우로서 관할 세무서장이 그 연장된 납부기한 등까지 해당 국세를 납부할 수 있다고 인정하는 경우에는 납세담보를 요구할 수 없다.","a":"O","e":"","pg":117},{"id":610,"ch":11,"n":34,"q":"정전, 프로그램의 오류, 그 밖의 부득이한 사유로 한국은행 및 체신관서의 정보처리장치나 시스템을 정상적으로 가동시 킬 수 없는 경우 납세담보를 요구할 수 있다.","a":"X","e":"정전, 프로그램의 오류, 그 밖의 부득이한 사유로 한국은 행 및 체신관서의 정보처리장치나 시스템을 정상적으로 가동시킬 수 없는 경우로서 관할 세무서장이 그 연장된 납부기한 등까지 해당 국세를 납부할 수 있다고 인정하는 경우 납세담보를 요구할 수 없다.","pg":118},{"id":611,"ch":11,"n":35,"q":"금융회사 등 또는 체신관서의 휴무, 그 밖의 부득이한 사유 로 정상적인 국세 납부가 곤란하다고 국세청장이 인정하는 경우로서 관할 세무서장이 그 연장된 납부기한 등까지 해당 국세를 납부할 수 있다고 인정하는 경우에는 납세담보를 요 구할 수 없다.","a":"O","e":"","pg":118},{"id":612,"ch":11,"n":36,"q":"납부기한 등의 연장 또는 납부고지의 유예를 한 후 해당 납 세자의 재산 상황의 변동되었다는 사유로는 그 납부기한 등 의 연장 또는 납부고지의 유예를 취소할 수 없다.","a":"X","e":"납부기한 등의 연장 또는 납부고지의 유예를 한 후 해당 납세자의 재산 상황의 변동되어 납부기한 등의 연장 또는 납부고지의 유예를 할 필요가 없다고 인정되는 경우에는 그 납부기한 등의 연장 또는 납부고지의 유예를 취소하고 연장 또는 유예와 관계되는 국세를 한꺼번에 징수할 수 있다.","pg":118},{"id":613,"ch":11,"n":37,"q":"관할 세무서장은 「국세징수법」 제13조에 따른 납부기한의 연장을 한 후 해당 납세자가 국세를 분할납부하여야하는 각 기한까지 분할납부하여야 할 금액을 납부하지 아니한 경우 그 납부기한의 연장을 취소하고 연장과 관계되는 국세를 한 꺼번에 징수할 수 있다.","a":"O","e":"","pg":118},{"id":614,"ch":11,"n":38,"q":"관할 세무서장은 납부고지의 유예를 한 후 해당 납세자인 법인의 해산으로 그 유예한 기한까지 유예와 관계되는 국세 의 전액을 징수할 수 없다고 인정되는 경우 그 납부고지의 유예를 취소하고 유예와 관계되는 국세를 한꺼번에 징수할 수 없다.","a":"X","e":"관할 세무서장은 납부고지의 유예를 한 후 '납부기한 전 징수'의 사유 중 어느 하나에 해당되어 그 유예한 기한까 지 유예와 관계되는 국세의 전액을 징수할 수 없다고 인 정되는 경우 그 납부고지의 유예를 취소하고 유예와 관계 되는 국세를 한꺼번에 징수할 수 있다. 법인의 해산은 납부기한 전 징수사유에 해당한다.","pg":118},{"id":615,"ch":11,"n":39,"q":"관할 세무서장의 납세담보물의 추가 제공 또는 보증인의 변 경 요구에 따르지 않아 관할 세무서장이 지정납부기한 또는 독촉장에서 정한 기한의 연장을 취소한 경우 그 국세에 대 하여 지정납부기한 등의 연장을 할 수 없다.","a":"O","e":"비교 재산 상황의 변동 또는 납부기한 등의 연장 또는 납부고지의 유예를 한 당시의 사정이 변화된 경우 등의 사유로 납부기한 등의 연 장 또는 납부고지의 유예를 할 필요가 없다고 인정되어 납부기한 등 의 연장 또는 납부고지의 유예를 취소한 경우 그 국세에 대하여 지정 납부기한 등의 재연장을 할 수 있음","pg":119},{"id":616,"ch":11,"n":40,"q":"납부고지서 또는 독촉장의 송달이 지연되어 도달한 날에 이 미 지정납부기한 등이 지난 경우 도달한 날을 지정납부기한 등으로 한다.","a":"X","e":"납부고지서 또는 독촉장의 송달이 지연되어 도달한 날에 이미 지정납부기한 등이 지난 경우 도달한 날부터 14일이 지난 날을 지정납부기한 등으로 한다.","pg":119},{"id":617,"ch":11,"n":41,"q":"납부기한 전에 납부고지를 하는 경우에 납부고지서가 단축 된 기한이 지난후에 도달한 경우에는 도달한 날의 다음 날 을 납부기한으로 한다.","a":"X","e":"납부기한 전에 납부고지를 하는 경우에 납부고지서가 단 축된 기한이 지난후에 도달한 경우에는 도달한 날부터 14 일이 지난 날을 납부기한으로 한다.","pg":119},{"id":618,"ch":11,"n":42,"q":"납부기한 전 징수사유가 있어 납부고지를 한 경우에는 납부 고지서의 송달이 지연되어 단축된 기한 전에 도달한 경우 도달한 날부터 14일이 지난 날을 납부하여야 할 기한으로 한 다.","a":"X","e":"납부기한 전에 납부고지를 한 경우에는 납부고지서의 송 달이 지연되어 단축된 기한 전에 도달한 경우 단축된 기 한을 납부하여야 할 기한으로 한다.","pg":119},{"id":619,"ch":11,"n":43,"q":"상속세.증여세 납부세액이 2천만원을 초과하여 연부연 납하는 경우 납세의무자에게 납세담보를 요구할 수 있다.","a":"X","e":"상속세 · 증여세 납부세액이 2천만원을 초과하여 연부연 납하는 경우 납세의무자에게 납세담보를 요구하여야 한 다.","pg":119},{"id":620,"ch":11,"n":44,"q":"재산의 압류를 유예하거나 압류를 해제하는 경우 납세의무 자는 납세담보를 제공해야 한다.","a":"X","e":"재산의 압류를 유예하거나 압류를 해제하는 경우 납세의 무자에게 납세담보를 요구할 수 있다.","pg":119},{"id":621,"ch":11,"n":45,"q":"문화재자료 등의 상속세 · 증여세액을 징수유예하는 경우 납 세의무자에게 납세담보를 요구할 수 있다.","a":"X","e":"문화재자료 등의 상속세 · 증여세액을 징수유예하는 경우 납세의무자는 납세담보를 제공해야 한다.","pg":119},{"id":622,"ch":11,"n":46,"q":"수입신고 수리 전에 과세물품을 보세구역으로부터 반출하 고자 할 경우 납세의무자에게 납세담보를 요구할 수 있다.","a":"X","e":"수입신고 수리 전에 과세물품을 보세구역으로부터 반출 하고자 할 경우 납세의무자는 납세담보를 제공해야 한다.","pg":120},{"id":623,"ch":11,"n":47,"q":"금전을 납세담보로 제공하는 경우에는 담보할 확정된 국세 의 100분의 120 이상의 가액에 상당하는 담보를 제공해야 한다.","a":"X","e":"금전을 납세담보로 제공하는 경우에는 담보할 확정된 국 세의 100분의 110 이상의 가액에 상당하는 담보를 제공 해야 한다.","pg":120},{"id":624,"ch":11,"n":48,"q":"금전을 납세담보로 제공하는 경우에는 공탁하고 공탁수령증 을 제출해야 하며 그 금전으로 담보한 국세 및 강제징수비 를 납부할 수 있다.","a":"O","e":"","pg":120},{"id":625,"ch":11,"n":49,"q":"등록된 유가증권을 납세담보로 제공하려는 자는 그 유가증 권을 공탁하고 그 공탁수령증을 세무서장(세법에 따라 국세 에 관한 사무를 세관장이 관장하는 경우에는 세관장을 말함) 에게 제출하여야 한다. ○","a":"X","e":"미등록 유가증권을 납세담보로 제공하려는 자는 그 유가 증권을 공탁하고 그 공탁수령증을 세무서장(세법에 따라 국세에 관한 사무를 세관장이 관장하는 경우에는 세관장 을 말함)에게 제출하여야 한다. 비교 등록된 유가증권을 납세담보로 제공하려는 자는 담보의 뜻을 등록하고 그 등록확인증을 제출해야 함","pg":120},{"id":626,"ch":11,"n":50,"q":"납세보증보험증권의 납세담보의 가액은 보험금액의 100분 의 110 이상으로 한다. ○","a":"X","e":"납세보증보험증권을 납세담보로 제공하는 경우에는 담보 할 확정된 국세의 100분의 110 이상의 가액(국세가 확정 되지 아니한 경우에는 국세청장이 정하는 가액)에 상당하 는 담보를 제공해야 하며 납세보증보험증권의 납세담보 의 가액은 그 보험금액으로 한다.","pg":120},{"id":627,"ch":11,"n":51,"q":"「은행법」에 따른 은행의 납세보증서로 납세담보를 제공하는 경우에는 담보할 국세의 100분의 110 이상의 가액에 상당하 는 담보를 제공하여야 하되, 그 국세가 확정되지 아니한 경 우에는 국세청장이 정하는 가액에 상당하는 담보를 제공하 여야 한다.","a":"O","e":"","pg":120},{"id":628,"ch":11,"n":52,"q":"토지, 건물, 공장재단, 광업재단, 선박, 항공기 또는 건설기 계를 납세담보로 제공하려는 자는 그 등기필증, 등기완료통 지서 또는 등록필증을 관할 세무서장에게 제시하여야 한다.","a":"O","e":"","pg":121},{"id":629,"ch":11,"n":53,"q":"납세담보를 토지로 제공하는 경우에는 담보할 국세의 110% 의 가액에 상당하는 담보를 제공할 수 있다.","a":"X","e":"납세담보를 토지로 제공하는 경우에는 담보할 국세의 120%의 가액에 상당하는 담보를 제공할 수 있다.","pg":121},{"id":630,"ch":11,"n":54,"q":"보석 또는 자동차와 같이 자산적 가치가 있는 것은 법에 열 거되지 않더라도 납세담보로 인정한다.","a":"X","e":"「국세징수법」상 납세담보재산은 열거주의에 의하므로 열 거되지 아니한 재산(보석 또는 자동차 등)은 금전적 가치 가 있는 경우에도 이를 담보로 제공받을 수 없다. • \"보험에 든 자동차 함정 주의","pg":121},{"id":631,"ch":11,"n":55,"q":"증권시장에 상장된 유가증권으로서 매매사실이 있는 것은 납세담보로 인정하고 있으며 그 유가증권으로 담보한 국세 및 강제징수비를 납부할 수 있다.","a":"X","e":"증권시장에 상장된 유가증권으로서 매매사실이 있는 것 은 납세담보로 인정하고 있으며 그 유가증권을 납세담보 로 제공받은 국세 및 강제징수비가 그 담보의 기간에 납 부되지 않으면 공매절차에 따라 매각하여 현금화하거나 징수한 금전으로 해당 국세 및 강제징수비를 징수한다. 비교 납세담보로서 금전을 제공한 자는 그 금전으로 담보한 국세 및 강제징수비를 납부할 수 있음","pg":121},{"id":632,"ch":11,"n":56,"q":"보험에 든 등기된 건물을 납세담보로 제공하려는 자는 납세 담보를 필요로 하는 기간에 30일 이상을 더한 화재보험증 권을 제출하여야 하며 납세담보를 제공한 자는 임의로 건물 납세담보를 금전으로 변경할 수 있다.","a":"X","e":"보험에 든 등기된 건물을 납세담보로 제공하려는 자는 납 세담보를 필요로 하는 기간에 30일 이상을 더한 화재보 험증권을 제출하여야 하며 납세담보를 제공한 자는 관할 세무서장의 승인을 받아 그 담보를 변경할 수 있다.","pg":121},{"id":633,"ch":11,"n":57,"q":"보증인의 납세보증서를 갈음하여 다른 담보재산을 제공하 려는 담보 제공자는 문서로 변경승인을 신청해야 하며, 승 인신청을 받은 관할 세무서장은 그 변경을 승인할 수 있다.","a":"X","e":"보증인의 납세보증서를 갈음하여 다른 담보재산을 제공 하려는 담보제공자는 문서로 변경승인을 신청해야 하며, 승인신청을 받은 관할 세무서장은 그 변경을 승인해야 한 다.","pg":121},{"id":634,"ch":11,"n":58,"q":"관할 세무서장은 납세담보물의 가액 감소로 그 납세담보로 는 국세 및 강제징수비의 납부를 담보할 수 없다고 인정할 때에는 담보를 제공한 자에게 담보물의 추가 제공을 요구할 수 있다.","a":"O","e":"","pg":122},{"id":635,"ch":11,"n":59,"q":"담보로 제공한 유가증권으로 국세 및 강제징수비를 납부하 려는 자는 그 뜻을 적은 문서로 관할 세무서장에게 신청해 야 하며, 신청한 금액에 상당하는 국세 및 강제징수비를 납 부한 것으로 본다.","a":"X","e":"담보로 제공한 금전으로 국세 및 강제징수비를 납부하려 는 자는 그 뜻을 적은 문서로 관할 세무서장에게 신청해 야 하며, 신청한 금액에 상당하는 국세 및 강제징수비를 납부한 것으로 본다. ... 납부는 금전만 가능함을 주의한다.","pg":122},{"id":636,"ch":11,"n":60,"q":"관할 세무서장은 납세보증서를 납세담보로 제공받은 국세 및 강제징수비가 그 담보기간에 납부되지 않는 경우 해당 보증인으로부터 징수절차에 따라 징수한 금전으로 해당 국 세 및 강제징수비를 징수한다. ○","a":"O","e":"","pg":122},{"id":637,"ch":11,"n":61,"q":"납세담보를 현금화한 금전으로 징수해야 할 국세 및 강제징 수비를 충당하고 남은 금전이 있는 경우 남은 금전 전액을 납세자에게 지급한다.","a":"X","e":"납세담보를 현금화한 금전으로 징수해야 할 국세 및 강제 징수비를 충당하고 남은 금전이 있는 경우 공매대금의 배 분방법에 따라 배분한 후 납세자에게 지급한다.","pg":122},{"id":638,"ch":11,"n":62,"q":"관할 세무서장은 납세담보를 제공받은 국세 및 강제징수비 가 납부되면 담보를 해제할 수 있다.","a":"X","e":"관할 세무서장은 납세담보를 제공받은 국세 및 강제징수 비가 납부되면 지체 없이 담보 해제 절차를 밟아야 한다.","pg":122},{"id":639,"ch":11,"n":63,"q":"체납자별 체납액이 1억원 이상인 경우로서 독촉에도 불구하 고 납부되지 않은 경우 관할 세무서장은 한국자산관리공사 에 체납액을 징수하기 위한 업무를 위탁할 수 있으며 이 경 우 한국자산관리공사는 제3자에게 위탁받은 업무를 다시 위 탁할 수 있다.","a":"X","e":"체납자별 체납액이 1억원 이상인 경우로서 독촉에도 불구 하고 납부되지 않은 경우 관할 세무서장은 한국자산관리 공사에 체납액을 징수하기 위한 업무를 위탁할 수 있으며 이 경우 한국자산관리공사는 위탁받은 업무를 제3자에게 다시 위탁할 수 없다.","pg":122},{"id":640,"ch":12,"n":1,"q":"관할 세무서장(체납 발생 후 1개월이 지나고, 체납액이 5천 만원 이상인 자의 경우는 지방국세청장을 포함)은 납세자가 독촉 또는 납부기한 전 징수의 고지를 받고 지정된 기한까 지 국세 또는 체납액을 완납하지 아니한 경우 재산의 압류 (교부청구 ·. 참가압류를 포함), 압류재산의 매각· 추심 및 청 산의 절차에 따라 강제징수를 한다.","a":"O","e":"","pg":123},{"id":641,"ch":12,"n":2,"q":"관할 세무서장은 강제징수를 할 때 납세자가 국세의 징수를 피하기 위하여 한 재산의 처분이나 그 밖에 재산권을 목적 으로 한 법률행위(「신탁법」에 따른 사해신탁을 포함)에 대하 여 「신탁법」 및 「민법」을 준용하여 직권으로 사해행위를 취 소하고 원상회복할 수 있다.","a":"X","e":"관할 세무서장은 강제징수를 할 때 납세자가 국세의 징수 를 피하기 위하여 한 재산의 처분이나 그 밖에 재산권을 목적으로 한 법률행위(「신탁법」에 따른 사해신탁을 포함) 에 대하여 「신탁법」 및 「민법」을 준용하여 사해행위의 취 소 및 원상회복을 법원에 청구할 수 있다.","pg":123},{"id":642,"ch":12,"n":3,"q":"제2차 납세의무자, 보증인 등으로부터 국세의 전액을 징수 할 수 있는 경우에는 납세의무자를 무자력으로 인정하지 아 니한다.","a":"O","e":"","pg":123},{"id":643,"ch":12,"n":4,"q":"납세자의 재산처분행위가 사해행위에 해당하는지 여부는 사 해행위취소권 행사 당시를 기준으로 판단하여야 한다.","a":"X","e":"납세자의 재산처분 행위가 사해행위에 해당하는지 여부 는 납세자가 법률행위를 할 당시를 기준으로 판단하여야 한다.","pg":123},{"id":644,"ch":12,"n":5,"q":"세무공무원이 사해행위의 취소를 청구하고자 할 때에는 체 납자를 상대로 민사소송을 제기하여야 한다.","a":"X","e":"세무공무원이 사해행위의 취소를 청구하고자 할 때에는 수익자 또는 전득자를 상대로 민사소송을 제기하여야 한 다.","pg":123},{"id":645,"ch":12,"n":6,"q":"사해행위취소 소송에서 국가가 승소하여 강제징수를 집행한 사해행위 대상 재산이 분할 가능하더라도 사해행위의 전부 취소와 재산의 반환
