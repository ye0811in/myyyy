:"직전 사업연도 종료일 현재 「독점규제 및 공정거래에 관 한 법률」에 따른 공시대상기업집단에 속하는 기업은 해당 중간예납기간의 법인세액을 기준으로 하는 방법에 따라 중간예납세액을 계산하여야 한다. 다만, 매출액이 업종별로 「중소기업기본법 시행령」에 따 른 중소기업기준 이내인 법인은 제외하므로 직전사업연 도의 산출세액기준과 해당 사업연도의 중간예납기간의 법인세액을 기준으로 계산하는 방법 중 선택하여 신고할 수 있다.","pg":321},{"id":1684,"ch":35,"n":28,"q":"내국법인이 직전 사업연도의 법인세로서 확정된 산출세액을 직전 사업연도의 월수로 나눈 금액에 6을 곱하여 중간예납 세액을 계산하는 경우 해당 직전 사업연도의 산출세액에는 미환류소득에 대한 법인세를 포함하되 가산세는 제외한다.","a":"X","e":"내국법인이 직전 사업연도의 법인세로서 확정된 산출세 액을 직전 사업연도의 월수로 나눈 금액에 6을 곱하여 중 간예납세액을 계산하는 경우 해당 직전 사업연도의 산출 세액에는 미환류소득에 대한 법인세를 제외하되 가산세 는 모임한다.","pg":322},{"id":1685,"ch":35,"n":29,"q":"해당 중간예납기간의 법인세액을 기준으로 중간예납세액을 계산할 경우 중간예납기간의 수시부과세액은 차감하지 않는 다.","a":"X","e":"해당 중간예납기간의 법인세액을 기준으로 중간예납세액 을 계산할 경우 중간예납기간의 수시부과세액은 차감한 다.","pg":322},{"id":1686,"ch":35,"n":30,"q":"직전 사업연도의 산출세액을 기준으로 하는 방법을 적용하 여 중간예납세액을 계산할 경우 직전 사업연도에 대한 법인 세로서 확정된 산출세액에는 토지등 양도소득에 대한 법인 세액은 포함하나 가산세는 포함하지 않는다.","a":"X","e":"직전 사업연도의 산출세액을 기준으로 하는 방법을 적용 하여 중간예납세액을 계산할 경우 직전 사업연도에 대한 법인세로서 확정된 산출세액에는 토지등 양도소득에 대 한 법인세액은 제외하고 가산세는 포함한다.","pg":322},{"id":1687,"ch":35,"n":31,"q":"분할신설법인 또는 분할합병의 상대방 법인이 분할 후 최초 사업연도의 중간예납세액을 산출할 경우 해당 중간예납기간 의 법인세액을 기준으로 하는 방법으로 중간예납세액을 계 산한다.","a":"O","e":"","pg":322},{"id":1688,"ch":35,"n":32,"q":"내국법인은 중간예납기간이 지난 날부터 3개월 이내에 중간 예납세액을 납세지 관할세무서, 한국은행 또는 체신관서에 납부해야 하는데 이때 내국법인이 납부할 중간예납세액이 2 천만원을 초과하는 경우에 한하여 분납규정을 준용하여 분 납할 수 있다.","a":"X","e":"내국법인은 중간예납기간이 지난 날부터 2개월 이내에 중간예납세액을 납세지 관할세무서, 한국은행 또는 체신 관서에 납부해야 하는데 이때 내국법인이 납부할 중간에 납세액이 1천만원을 초과하는 경우에는 분납규정을 준용 하여 분납할 수 있다.","pg":322},{"id":1689,"ch":35,"n":33,"q":"납부할 중간예납세액이 1,500만원인 경우 750만원을 납부 기한이 지난 날부터 1개월(중소기업의 경우 2개월) 이내에 분납할 수 있다.","a":"X","e":"납부할 중간예납세액이 납부세액이 1천만원 초과 2천만 원 이하인 경우 1천만원을 초과하는 금액을 분납할 수 있 으며 따라서 최대 500만원을 납부기한이 지난 날부터 1개월(중소기업의 경우 2개월) 이내에 분납할 수 있다. 비교 납부세액이 2천만원 이상이면 그 세액의 50% 이하의 금액 분납 가능함","pg":323},{"id":1690,"ch":35,"n":34,"q":"납세지 관할 세무서장은 내국법인이 납부해야 할 중간예납 세액의 전부 또는 일부를 납부하지 않으면, 그 미납된 중간 예납세액을 국세징수법」에 따라 징수해야 하며 이 경우 납 부지연가산세 및 신고불성실가산세를 징수한다.","a":"X","e":"납세지 관할 세무서장은 내국법인이 납부해야 할 중간예 납세액의 전부 또는 일부를 납부하지 않으면, 그 미납된 중간예납세액을 국세징수법」에 따라 징수해야 하며 미 납한 중간예납세액에 대해서는 납부지연가산세를 징수한 다. 법인세 중간예납의 경우, 중간예납기간이 끝나는 때 납세의무가 성립과 동시에 확정되므로 신고불성실가산세 는 적용되지 아니한다.","pg":323},{"id":1691,"ch":35,"n":35,"q":"납세지 관할 세무서장 또는 관할 지방국세청장은 내국법인 이 그 사업연도 중에 신고를 하지 않고 본점 등을 이전함으 로 인하여 법인세 포탈의 우려가 있다고 인정되는 경우에는 수시로 그 법인에 대한 법인세를 부과할 수 있다.","a":"O","e":"","pg":323},{"id":1692,"ch":35,"n":36,"q":"법인세를 경정하는 경우로서 감면세액이 최저한세액에 미 달하는 경우에는 조세감면의 법정배제순서는 특별감가상각 비의 손금산입, 준비금의 손금산입, 손금산입 및 익금불산 입, 세액 면제 및 감면, 세액공제, 소득공제 및 비과세 순이 다.","a":"X","e":"법인세를 경정하는 경우로서 감면세액이 최저한세액에 미달하는 경우에는 조세감면의 법정배제순서는 특별감가 상각비의 손금산입, 준비금의 손금산입, 손금산입 및 익 금불산입, 세액공제, 세액 면제 및 감면, 소득공제 및 비 과세 순이다.","pg":323},{"id":1693,"ch":36,"n":1,"q":"각 사업연도의 소득금액이 없거나 결손금이 있는 내국법인 은 해당 사업연도의 소득에 대한 법인세의 과세표준과 세액 을 납세지 관할 세무서장에게 신고하지 아니할 수 있다.","a":"X","e":"각 사업연도의 소득금액이 없거나 결손금이 있는 내국법 인의 경우에도 납세의무가 있는 법인은 각 사업연도 종료 일이 속하는 달의 말일부터 3개월(내국법인이 성실신고 확인서를 제출하는 경우 4개월) 이내에 해당 사업연도의 소득에 대한 법인세의 과세표준과 세액을 납세지 관할 세 무서장에게 신고해야 한다.","pg":324},{"id":1694,"ch":36,"n":2,"q":"「주식회사 등의 외부감사에 관한 법률」에 따라 감사인에 의 한 감사를 받아야 하는 내국법인이 해당 사업연도의 감사가 종결되지 아니하여 결산이 확정되지 아니하였다는 사유로 신고기한의 연장을 신청한 경우에는 신고기한을 연장할 수 없다.","a":"X","e":"「주식회사 등의 외부감사에 관한 법률」에 따라 감사인에 의한 감사를 받아야 하는 내국법인이 해당 사업연도의 감 사가 종결되지 아니하여 결산이 확정되지 아니하였다는 사유로 신고기한의 연장을 신청한 경우에는 그 신고기한 을 1개월의 범위에서 연장할 수 있다.","pg":324},{"id":1695,"ch":36,"n":3,"q":"「주식회사 등의 외부감사에 관한 법률」에 따라 감사인에 의 한 감사를 받아야 하는 내국법인이 해당 사업연도의 감사가 종결되지 아니하여 결산이 확정되지 아니하였다는 사유로 대통령령으로 정하는 바에 따라 신고기한 종료 1개월 전까 지 신고기한의 연장을 신청한 경우에는 그 신고기한을 2개 월의 범위에서 연장할 수 있다.","a":"X","e":"「주식회사 등의 외부감사에 관한 법률」에 따라 감사인에 의한 감사를 받아야 하는 내국법인이 해당 사업연도의 감 사가 종결되지 아니하여 결산이 확정되지 아니하였다는 사유로 대통령령으로 정하는 바에 따라 신고기한 종료 3 일 전까지 신고기한의 연장을 신청한 경우에는 그 신고기 한을 1개월의 범위에서 연장할 수 있다.","pg":324},{"id":1696,"ch":36,"n":4,"q":"법인세 과세표준신고 시, 기업회계기준을 준용하여 작성한 개별 내국법인의 재무상태표, 포괄손익계산서, 이익잉여금 처분계산서(또는 결손금처리계산서), 및 세무조정계산서를 첨부하지 않은 경우에는 무신고로 본다(「법인세법」에 따른 수익사업을 하지 아니하는 비영리내국법인은 제외). 342 제5편 법인세법","a":"O","e":"","pg":324},{"id":1697,"ch":36,"n":5,"q":"내국법인이 합병으로 해산하는 경우에 과세표준과 세액의 신고를 할 때에는 그 신고서에 합병등기일 현재의 피합병법 인의 재무상태표와 합병법인이 그 합병에 따라 승계한 자산 및 부채의 명세서를 첨부하여야 한다.","a":"O","e":"","pg":325},{"id":1698,"ch":36,"n":6,"q":"주식회사의 외부감사에 관한 법률」에 따라 감사인에 의한 감사를 받아야 하는 영리내국법인이 과세표준신고를 할 때 현금흐름표를 첨부하지 않은 경우에는 무신고로 본다.","a":"X","e":"「주식회사의 외부감사에 관한 법률」에 따라 감사인에 의 한 감사를 받아야 하는 영리내국법인이 과세표준신고를 할 때 현금흐름표를 첨부하지 않은 경우에는 무신고로 보 지 않는다. 현금흐름표는 필수첨부서류에 해당하지 않는다. 필수첨부서류는 다음과 같다. 기업회계기준을 준용하여 작성한 개별 내국법인의 재 무상태표, 포괄손익계산서, 이익잉여금처분계산서 ② 세무조정계산서","pg":325},{"id":1699,"ch":36,"n":7,"q":"외부조정대상법인이 외부조정계산서를 첨부하지 아니하는 경우 신고를 하지 않은 것으로 보고 무신고가산세를 적용한 다.","a":"O","e":"","pg":325},{"id":1700,"ch":36,"n":8,"q":"주식회사 등의 외부감사에 관한 법률」에 따라 감사인에 의 한 감사를 받은 내국법인의 성실신고확인서는 과세표준과 세액을 신고할 때 반드시 제출해야 하는 서류에 해당한다.","a":"X","e":"법령으로 정하는 내국법인은 성실한 납세를 위하여 법인 세의 과세표준과 세액을 신고할 때 신고서류에 더하여 성 실확인신고서를 납세지 관할 세무서장에게 제출하여야 한다. 다만 주식회사 등의 외부감사에 관한 법률」에 따라 감사인에 의한 감사를 받은 내국법인은 이를 제출하지 아 니할 수 있다.","pg":325},{"id":1701,"ch":36,"n":9,"q":"「소득세법」에 따른 성실신고확인대상사업자가 사업용자산을 현물출자하여 내국법인으로 전환한 경우 그 내국법인(사업 연도 종료일 현재 법인으로 전환한 후 5년 이내의 내국법인 으로 한정)은 성실신고확인서를 제출해야 한다.","a":"X","e":"「소득세법」에 따른 성실신고확인대상사업자가 사업용자 산을 현물출자하여 내국법인으로 전환한 경우 그 내국법 인(사업연도 종료일 현재 법인으로 전환한 후 3년 이내의 내국법인으로 한정)은 성실신고확인서를 제출해야 한다.","pg":325},{"id":1702,"ch":36,"n":10,"q":"성실신고확인대상 내국법인이 성실신고확인서를 제출하는 경우 사업연도 종료일이 속하는 달의 말일부터 3개월 이내 에 법인세 과세표준과 세액을 신고하여야 한다.","a":"X","e":"성실신고확인대상 내국법인이 성실신고확인서를 제출하 는 경우 사업연도 종료일이 속하는 달의 말일부터 4개인 이내에 법인세 과세표준과 세액을 신고하여야 한다.","pg":326},{"id":1703,"ch":36,"n":11,"q":"납세지 관할 세무서장은 제출된 신고서에 오류가 있을 때에 는 보정할 것을 요구할 수 있다.","a":"O","e":"","pg":326},{"id":1704,"ch":36,"n":12,"q":"중소기업에 해당하는 내국법인이 납부할 각 사업연도의 소 득에 대한 법인세액이 1천만원인 경우에는 그 세액의 50% 이하의 금액을 납부기한이 지난 날부터 2개월 이내에 분납 할 수 있다.","a":"X","e":"중소기업에 해당하는 내국법인이 납부할 각 사업연도의 소득에 대한 법인세액이 2천만원인 경우에는 1천만원을 초과하는 금액을 납부기한이 지난 날부터 2개월 이내에 분납할 수 있다. 납부할 세액이 1천만원인 경우에는 분납 규정을 적용하지 아니한다. 참고 납부세액이 1천만원 초과 2천만원 이하인 경우 분납가능 금 액은 1천만원을 초과하는 금액이며 2천만원 초과인 경우 분납가능 금액은 그 세액의 50% 이하의 금액임","pg":326},{"id":1705,"ch":36,"n":13,"q":"내국법인은 「법인세법」에 따라 납부할 각 사업연도의 소득 에 대한 법인세액이 1천만원을 초과하는 경우에 납부할 세 액의 일부를 분납할 수 있으며, 「법인세법」에 따른 가산세와 「법인세법」 또는 「조세특례제한법」에 따른 감면분 추가 납부 세액 등은 분납대상세액에 포함한다.","a":"X","e":"내국법인은 「법인세법」에 따라 납부할 각 사업연도의 소 득에 대한 법인세액이 1천만원을 초과하는 경우에 납부할 세액의 일부를 분납할 수 있으며, 「법인세법」에 따른 가산 세와 「법인세법」 또는 「조세특례제한법」에 따른 감면분 추 가 납부세액 등은 분납대상세액에 포함하지 아니한다.","pg":326},{"id":1706,"ch":36,"n":14,"q":"세무서장의 승인을 받은 경우에는 법인이 보유하고 있는 부 등산으로 법인세를 납부할 수 있다.","a":"X","e":"법인세의 물납제도는 2016년부터 폐지되었으므로 금전 납부만 가능하다.","pg":326},{"id":1707,"ch":36,"n":15,"q":"납세의무가 있는 내국법인이 각 사업연도의 소득에 대한 법 인세의 과세표준과 세액을 신고하지 않은 경우, 국세청장이 조사기간을 따로 정하지 아니한 때에는 납세지관할세무서장 은 해당 사업연도의 종료일이 속하는 달의 말일부터 1년 이 내에 법인세의 과세표준과 세액에 대한 결정을 완료해야 한 다.","a":"X","e":"납세의무가 있는 내국법인이 각 사업연도의 소득에 대한 법인세의 과세표준과 세액을 신고하지 않은 경우, 국세청 장이 조사기간을 따로 정하지 아니한 때에는 납세지관할 세무서장은 법인세 과세표준신고기한부터 1년 이내에 법 인세의 과세표준과 세액에 대한 결정을 완료해야 한다.","pg":326},{"id":1708,"ch":36,"n":16,"q":"과세표준 등의 신고를 한 내국법인이 지급명세서, 매출·매 입처별 계산서합계표의 전부 또는 일부를 제출하지 아니한 경우 납세지 관할세무서장은 그 법인의 각 사업연도의 소득 에 대한 법인세의 과세표준과 세액을 경정한다.","a":"O","e":"","pg":327},{"id":1709,"ch":36,"n":17,"q":"납세지 관할 세무서장은 법인세의 과세표준과 세액을 결정 한 후 그 결정에 오류가 있는 것을 발견한 경우에는 1개월 이내에 이를 경정한다.","a":"X","e":"납세지 관할 세무서장은 법인세의 과세표준과 세액을 결 정한 후 그 결정에 오류가 있는 것을 발견한 경우에는 즉 시 이를 다시 경정한다.","pg":327},{"id":1710,"ch":36,"n":18,"q":"납세지 관할 세무서장이 행하는 법인의 각 사업연도의 소득 에 대한 법인세의 과세표준과 세액의 경정은 해당 내국법인 이 신고할 때에 첨부한 신고서 및 그 첨부서류에 의하거나 비치기장 된 장부 또는 그 밖의 증명서류에 의한 실지조사 에 의함을 원칙으로 한다.","a":"O","e":"","pg":327},{"id":1711,"ch":36,"n":19,"q":"천재지변으로 장부나 그 밖의 증명서류가 멸실되어 법인세 과세표준을 추계결정하는 경우 그 추계에 의한 과세표준과 결산서상 당기순이익과의 차액(법인세상당액을 공제하지 아 니한 금액)을 대표자 상여로 처분한다.","a":"X","e":"천재지변으로 장부나 그 밖의 증명서류가 멸실되어 법인 세 과세표준을 추계결정하는 경우 그 추계에 의한 과세표 준과 결산서상 당기순이익과의 차액(법인세상당액을 공 제하지 아니한 금액)을 기타사외유출로 처분한다.","pg":327},{"id":1712,"ch":37,"n":1,"q":"「국세기본법」에 의해 법인으로 보는 단체는 정관상의 사업 내용에 따라 비영리법인 또는 영리법인으로 판단한다.","a":"X","e":"「국세기본법」에 따른 법인으로 보는 단체는 비영리법인으 로 본다.","pg":328},{"id":1713,"ch":37,"n":2,"q":"비영리내국법인의 경우에는 국내뿐만 아니라 국외의 수익사 업소득에 대해서도 각 사업연도의 소득으로 법인세가 과세 된다.","a":"O","e":"","pg":328},{"id":1714,"ch":37,"n":3,"q":"비영리내국법인은 주식·신주인수권 또는 출자지분의 양도 로 인한 수입에 대하여 법인세 납세의무가 없다.","a":"X","e":"비영리내국법인은 주식·신주인수권 또는 출자지분의 양 도로 인한 수입에 대하여 법인세 납세의무가 있다.","pg":328},{"id":1715,"ch":37,"n":4,"q":"비영리내국법인의 고유목적사업에 직접 사용되는 것으로서 법령이 정하는 요건을 갖춘 유형 · 무형자산의 처분으로 생 기는 수입은 각 사업연도의 소득에 포함되어 과세된다.","a":"X","e":"비영리내국법인의 고유목적사업에 직접 사용되는 유형. 무형자산으로서 대통령령이 정하는 요건을 갖춘 경우 해 당 자산의 처분으로 생기는 수입은 각 사업연도의 소득에 포함되어 과세되지 않는다.","pg":328},{"id":1716,"ch":37,"n":5,"q":"비영리법인도 영리법인과 마찬가지로 이자소득(비영업대금 이익 제외)과 투자신탁의 이익으로서 원천징수된 이자소득 에 대하여 과세표준 신고를 해야 한다.","a":"X","e":"비영리법인은 이자소득(비영업대금이익 제외)과 투자신 탁의 이익으로서 원천징수된 이자소득에 대하여는 과세 표준신고를 하지 않고 분리과세를 선택할 수 있다.","pg":328},{"id":1717,"ch":37,"n":6,"q":"비영리내국법인은 「소득세법」에 따른 비영업대금의 이익에 대해서는 과세표준신고를 하지 않고 분리과세를 선택할 수 있다. 346 제5편 법인세법","a":"X","e":"비영리내국법인은 「소득세법」에 따른 비영업대금의 이익 에 대해서는 반드시 법인세 과세표준신고를 하여야 한다.","pg":328},{"id":1718,"ch":37,"n":7,"q":"사업소득에 해당하는 수익사업을 영위하는 비영리내국법인 이 토지 등 일정한 자산을 양도한 경우에는 법인세 과세표 준에 포함하지 않고 「소득세법」상 양도소득세의 규정을 준 용하여 계산한 금액을 법인세 신고·납부할 수 있다.","a":"X","e":"비영리내국법인(사업소득에 해당하는 수익사업을 영위하 는 비영리내국법인은 제외)이 토지 등 일정한 자산을 양 도한 경우에는 법인세 과세표준에 포함하지 않고 「소득세 법상 양도소득세의 규정을 준용하여 계산한 금액을 법인 세로 신고·납부할 수 있다.","pg":329},{"id":1719,"ch":37,"n":8,"q":"비영리법인이 수익사업을 하는 경우에는 자산 . 부채 및 손 익을 그 수익사업에 속하는 것과 수익사업이 아닌 그 밖의 사업에 속하는 것을 각각 다른 회계로 구분하여 기록하지 않을 수 있다.","a":"X","e":"비영리법인이 수익사업을 하는 경우에는 자산 부채 및 손익을 그 수익사업에 속하는 것과 수익사업이 아닌 그 밖의 사업에 속하는 것을 각각 다른 회계로 구분하여 기 록하여야 한다.","pg":329},{"id":1720,"ch":37,"n":9,"q":"비영리법인은 수익사업에서 생긴 소득에 대해 각 사업연도 소득에 대한 법인세 납세의무를 지기 때문에 자산 • 부채 및 손익을 해당 수익사업에 속하는 것과 수익사업이 아닌 그 밖의 사업에 속하는 것으로 각각 다른 회계로 구분하여 기 록해야 한다. ○","a":"O","e":"","pg":329},{"id":1721,"ch":37,"n":10,"q":"비영리법인이 구분경리하는 경우 수익사업과 기타 사업에 공통되는 자산과 부채는 이를 기타 사업에 속하는 것으로 한다.","a":"X","e":"비영리법인이 구분경리하는 경우 수익사업과 기타 사업 에 공통되는 자산과 부채는 이를 수익사업에 속하는 것으 로 한다.","pg":329},{"id":1722,"ch":37,"n":11,"q":"비영리법인이 구분경리하는 경우 수익사업과 기타 사업의 공통익금은 수익사업과 기타 사업의 수입금액 또는 매출액 에 비례하여 안분계산한다.","a":"O","e":"","pg":329},{"id":1723,"ch":37,"n":12,"q":"모든 비영리내국법인은 복식부기의 방식으로 장부를 기장하 고 이를 비치할 의무는 있지만, 이를 이행하지 않았을 경우 에 장부의 기록 보관 불성실가산세의 부과 대상은 아니다. .","a":"X","e":"수익사업을 영위하지 않는 비영리내국법인은 기장의무를 지지 않는다. 수익사업을 영위하는 비영리내국법인은 복 식부기의 방식으로 장부를 기장하고 이를 비치할 의무는 있지만, 이를 이행하지 않았을 경우에 장부의 기록. 보관 불성실가산세의 부과 대상은 아니다.","pg":329},{"id":1724,"ch":37,"n":13,"q":"수익사업을 하는 비영리내국법인은 장부의 기록 ㆍ . 보관 불성 실 가산세의 적용을 받지 않는다.","a":"O","e":"","pg":330},{"id":1725,"ch":37,"n":14,"q":"비영리내국법인은 청산소득에 대하여 법인세의 납세의무를 진다.","a":"X","e":"영리내국법인 청산소득에 대하여 법인세의 납세의무를 진다.","pg":330},{"id":1726,"ch":37,"n":15,"q":"외국법인과 비영리내국법인은 청산소득에 대한 법인세 납세 의무가 없다.","a":"O","e":"","pg":330},{"id":1727,"ch":37,"n":16,"q":"「상법」에 따라 조직변경하는 경우에도 청산소득에 대한 법 인세를 과세한다.","a":"X","e":"「상법」에 따라 조직변경하는 경우에는 청산소득에 대한 법인세를 과세하지 아니한다.","pg":330},{"id":1728,"ch":37,"n":17,"q":"내국법인의 해산에 의한 청산소득의 금액을 계산할 때 그 청산 기간에 생기는 각 사업연도의 소득금액이 있는 경우에 는 그 법인의 청산소득금액에 산입한다.","a":"X","e":"내국법인의 해산에 의한 청산소득의 금액을 계산할 때 그 청산 기간에 생기는 각 사업연도의 소득금액이 있는 경 우에는 그 법인의 해당 각 사업연도의 소득금액에 산입한 다.","pg":330},{"id":1729,"ch":37,"n":18,"q":"해산에 의한 청산소득의 금액은 그 법인의 해산에 의한 잔 여재산의 가액에서 해산등기일 현재의 자기자본총액을 공제 한 금액으로 한다. ○","a":"O","e":"","pg":330},{"id":1730,"ch":37,"n":19,"q":"법인이 청산 기간 중에 해산 전의 사업을 계속하여 영위하 는 경우 해당 사업에서 발생한 사업수입이나 임대수입, 공. 사채 및 예금의 이자수입 등은 청산소득에 포함한다.","a":"X","e":"법인이 해산등기일 현재의 자산을 청산기간 중에 처분한 금액(환가를 위한 재고자산의 처분액을 포함)은 청산소득 에 포함하지만, 청산기간 중에 해산 전의 사업을 계속하 여 영위하는 경우 해당 사업에서 발생한 사업수입이나 임 대수입, 공·사채 및 예금의 이자수입 등은 포함하지 않 는다. 이때, 해산 전의 사업을 계속하여 영위하는 경우 해당 사 업에서 발생한 사업수입이나 임대수입. 공 · 사채 및 예금 의 이자수입 등은 청산소득이 아닌 각사업연도 소득금액 에 포함한다.","pg":331},{"id":1731,"ch":37,"n":20,"q":"내국법인의 해산에 의한 청산소득의 금액을 계산할 때 그 청산 기간에 「국세기본법」에 따라 환급되는 법인세액이 있 는 경우 이에 상당하는 금액은 그 법인의 해산등기일 현재 자기자본의 총액에서 차감한다.","a":"X","e":"내국법인의 해산에 의한 청산소득의 금액을 계산할 때 그 청산 기간에 「국세기본법」에 따라 환급되는 법인세액이 있는 경우 이에 상당하는 금액은 그 법인의 해산등기일 현재 자기자본의 총액에 가산한다.","pg":331},{"id":1732,"ch":37,"n":21,"q":"청산소득금액 계산 시 자기자본총액은 해산등기일 현재의 납입자본금과 잉여금의 합계액에서 법령에 따른 이월결손금 과 법인세환급세액을 차감한 금액을 말한다. 이때 유보는 잉 여금에 가산하고 △유보는 잉여금에서 차감한다.","a":"X","e":"청산소득금액 계산 시 자기자본총액은 해산등기일 현재 의 납입자본금과 잉여금의 합계액에서 법령에 따른 이월 결손금은 차감하고 법인세환급세액을 가산한 금액을 말 한다. 즉, 내국법인의 해산에 의한 청산소득의 금액을 계 산할 때 그 청산기간에 「국세기본법」에 따라 환급되는 법 인세액이 있는 경우 이에 상당하는 금액은 그 법인의 해산 등기일 현재의 자기자본의 총액에 가산한다.","pg":331},{"id":1733,"ch":37,"n":22,"q":"청산소득금액 계산 시 세무상 이월결손금(발생기간 불문)은 잉여금의 범위 내에서 자기자본과 상계한다.","a":"O","e":"","pg":331},{"id":1734,"ch":37,"n":23,"q":"청산소득금액을 계산할 때 해산등기일 전 3년 이내에 자본 금 또는 출자금에 전입한 잉여금이 있는 경우에는 해당 금 액을 자본금 또는 출자금에 전입하지 아니한 것으로 보고 계산한다.","a":"X","e":"청산소득금액을 계산할 때 해산등기일 전 2년 이내에 자 본금 또는 출자금에 전입한 잉여금이 있는 경우에는 해당 금액을 자본금 또는 출자금에 전입하지 아니한 것으로 보 고 계산한다.","pg":331},{"id":1735,"ch":37,"n":24,"q":"청산소득에 대한 법인세율은 10%다.","a":"X","e":"청산소득에 대한 법인세는 각 사업인도 소득에 대한 법인 세율과 동일하게 작용한다.","pg":332},{"id":1736,"ch":37,"n":25,"q":"청산소득에 대한 법인세 납세의무가 있는 내국법인(「상법」에 따라 사업을 계속하는 경우 제외)은 잔여재산가액확정일부 터 3개월 이내에 청산소득에 대한 법인세의 과세표준과 세 액을 납세지 관할 세무서장에게 신고하여야 한다.","a":"X","e":"청산소득에 대한 법인세 납세의무가 있는 내국법인(「상 법」에 따라 사업을 계속하는 경우 제외)은 잔이재산가액 확정일이 속하는 달의 말일부터 3개월 이내에 청산소득 에 대한 법인세의 과세표준과 세액을 납세지 관할 세무서 장에게 신고하여야 한다.","pg":332},{"id":1737,"ch":37,"n":26,"q":"청산소득에 대한 법인세의 납세의무가 있는 내국법인은 청 산소득이 없는 경우에는 청산소득에 대한 법인세 과세표준 과 세액의 확정신고를 하지 아니한다.","a":"X","e":"청산소득에 대한 법인세의 납세의무가 있는 내국법인은 청산소득이 없는 경우에도 청산소득에 대한 법인세 과세 표준과 세액의 확정신고를 해야 한다.","pg":332},{"id":1738,"ch":37,"n":27,"q":"내국법인이 해산한 경우에 「법인세법」 제73조 및 제73조의2 에 따라 원천징수하여야 할 법인세를 징수하지 아니하였거 나 징수한 법인세를 납부하지 아니하고 잔여재산을 분배한 때에는 청산인과 잔여재산의 분배를 받은 자가 한도 없이 그 법인세 전액에 대하여 연대하여 납부할 책임을 진다.","a":"X","e":"내국법인이 해산한 경우에 「법인세법」 제73조 및 제73조 의2에 따라 원천징수하여야 할 법인세를 징수하지 아니 하였거나 징수한 법인세를 납부하지 아니하고 잔여재산 을 분배한 때에는 청산인과 잔여재산의 분배를 받은 자가 각각 그 분배한 재산의 가액과 분배받은 재산의 가액을 한도로 그 법인세를 연대하여 납부할 책임을 진다.","pg":332},{"id":1739,"ch":37,"n":28,"q":"청산소득에 대한 법인세를 납부기한까지 완납하지 아니하였 을 때에는 「국세기본법」에 따라 그 납부고지서에 따른 납부 기한이 지난 날부터 체납된 법인세의 100분의 3에 상당하는 납부지연가산세를 징수한다.","a":"X","e":"청산소득에 대한 법인세를 징수할 때에는 「국세기본법」에 따른 납부지연가산세 중 1일 0.022%씩 부과되는 가산세 (납부고지서에 따른 납부기한의 다음 날부터 부과되는 분 에 한정) 및 납부고지서에 따른 납부기한까지 완납하지 않는 경우 부과되는 3% 가산세 규정을 적용하지 않는다.","pg":332},{"id":1740,"ch":37,"n":29,"q":"청산소득에 대한 법인세도 분납이 가능하다. ○ x 350 제5편 법인세법","a":"X","e":"청산소득에 대한 법인세는 분납할 수 없다.","pg":332},{"id":1741,"ch":37,"n":30,"q":"사업의 실질적 관리장소가 국내에 있지 아니하면서 본점 또 는 주사무소가 외국에 있고, 구성원이 유한책임사원으로만 구성된 단체는 내국법인으로 본다.","a":"X","e":"사업의 실질적 관리장소가 국내에 있지 아니하면서 본점 또는 주사무소가 외국에 있고, 구성원이 유한책임사원으 로만 구성된 단체는 외국법인으로 본다.","pg":333},{"id":1742,"ch":37,"n":31,"q":"외국법인의 각 사업연도소득에 대한 법인세는 국내원천소득 에 대해서만 납세의무를 지는데, 이때 국내원천소득의 범위 는 「법인세법」에서 제한적으로 열거하고 있다.","a":"O","e":"","pg":333},{"id":1743,"ch":37,"n":32,"q":"외국법인이 국내에 있는 자산을 증여받아 생기는 소득은 국 내원천소득에 해당하지 않는다.","a":"X","e":"외국법인이 국내에 있는 자산을 증여받아 생기는 소득은 국내원천기타소득에 해당한다.","pg":333},{"id":1744,"ch":37,"n":33,"q":"국내사업장을 가진 외국법인의 국내원천소득으로서 국내사 업장과 실질적으로 관련되고 그 국내사업장에 귀속되는 소 득금액은 과세표준과 세액을 신고해야 하나, 국내사업장이 없는 외국법인의 국내원천 부동산소득은 원천징수로 납세의 무가 종결된다.","a":"X","e":"국내사업장을 가진 외국법인의 국내원천소득으로서 국내 사업장과 실질적으로 관련되고 그 국내사업장에 귀속되 는 소득금액과 국내사업장이 없는 외국법인의 국내원천 부동산소득은 과세표준과 세액을 신고해야 한다.","pg":333},{"id":1745,"ch":37,"n":34,"q":"외국법인이 「법인세법」에 따른 고정된 장소를 가지고 있지 아니한 경우에는 그 자산을 상시 보관하고 관례적으로 이를 배달 또는 인도하는 자를 두고 사업을 영위하는 때에도 국 내에 사업장이 없는 것으로 본다.","a":"X","e":"외국법인이 「법인세법」에 따른 고정된 장소를 가지고 있 지 아니한 경우라도 그 자산을 상시 보관하고 관례적으로 이를 배달 또는 인도하는 자를 두고 사업을 영위하는 때 에는 국내에 사업장이 있는 것으로 본다.","pg":333},{"id":1746,"ch":37,"n":35,"q":"건축 장소는 국내에 2년간 존속하더라도 외국법인의 국내사 업장에 포함되지 아니한다.","a":"X","e":"6개월을 초과하여 존속하는 건축장소는 국내사업장에 해 당한다.","pg":333},{"id":1747,"ch":37,"n":36,"q":"국내사업장이 없는 외국법인의 국내원천 이자소득·배당소 득에 대한 원천징수세율은 14%이다.","a":"X","e":"국내사업장이 없는 외국법인의 국내원천 이자소득·배당 소득에 대한 원천징수세율은 20%이다.","pg":333},{"id":1748,"ch":37,"n":37,"q":"각 사업연도의 소득에 대한 법인세의 과세표준을 신고하여 야 할 외국법인은 법인세 과세표준 신고기한을 연장할 수 없다.","a":"X","e":"각 사업연도의 소득에 대한 법인세의 과세표준을 신고하 여야 할 외국법인으로서 본점 등의 결산이 확정되지 아 니하거나 기타 부득이한 사유로 그 신고기한까지 신고서 를 제출할 수 없는 외국법인은 해당 사업연도 종료일부터 60일 이내에 사유서를 갖추어 납세지 관할 세무서장 또 는 관할 지방국세청장의 승인을 받아 그 신고기한을 연장 할 수 있다.","pg":334},{"id":1749,"ch":38,"n":1,"q":"적격합병에 해당하기 위해서는 합병법인이 합병등기일이 속하는 사업연도의 다음 사업연도 개시일부터 5년이 되는 날까지 피합병법인으로부터 승계받은 사업을 계속해야 하 며 이때 해당 기한 요건을 만족하더라도 승계한 자산가액의 1/2 이상을 처분하거나 사업에 사용하지 않으면 사업의 계 속성 요건을 충족하지 않은 것으로 본다.","a":"X","e":"적격합병에 해당하기 위해서는 합병법인이 합병등기일이 속하는 사업연도의 종료일까지 피합병법인으로부터 승계 받은 사업을 계속해야 하며 이때 해당 기한 요건을 만족 하더라도 승계한 자산가액의 1/2 이상을 처분하거나 사 업에 사용하지 않으면 사업의 계속성 요건을 충족하지 않 은 것으로 본다.","pg":335},{"id":1750,"ch":38,"n":2,"q":"합병법인이 피합병법인의 자산을 시가로 양도받은 것으로 보는 경우로서 피합병법인에 지급한 양도가액이 피합병법인 의 합병등기일 현재의 자산총액에서 부채총액을 뺀 금액(순 자산의 시가보다 적은 경우에는 그 차액을 합병등기일부터 3년간 균등하게 나누어 손금에 산입한다.","a":"X","e":"합병법인이 피합병법인의 자산을 시가로 양도받은 것으 로 보는 경우로서 피합병법인에 지급한 양도가액이 피합 병법인의 합병등기일 현재의 자산총액에서 부채총액을 뺀 금액(순자산의 시가)보다 적은 경우에는 그 차액은 합 병매수차익이다. 합병매수차익은 합병등기일부터 5년간 균등하게 나누어 익금에 산입한다.","pg":335},{"id":1751,"ch":38,"n":3,"q":"적격합병을 한 경우, 양도받은 자산 및 부채의 가액을 합병 등기일 현재의 시가로 계상한다.","a":"O","e":"","pg":335},{"id":1752,"ch":38,"n":4,"q":"「법인세법」상 요건을 모두 갖춘 적격합병에 해당하여 피합 병법인이 합병으로 인한 양도손익이 없는 것으로 한 경우 합병법인은 피합병법인의 자산을 합병등기일 현재의 시가로 양도받은 것으로 한다.","a":"X","e":"「법인세법」상 요건을 모두 갖춘 적격합병에 해당하여 피 합병법인이 합병으로 인한 양도손익이 없는 것으로 한 경 우 합병법인은 피합병법인의 자산을 장부가액으로 양도 받은 것으로 한다.","pg":335},{"id":1753,"ch":38,"n":5,"q":"「법인세법」상 요건을 모두 갖춘 적격합병의 경우에는 합병 법인의 합병등기일 현재 이월결손금은 합병법인의 각 사업 연도의 과세표준을 계산할 때 피합병법인으로부터 승계받은 사업에서 발생한 소득금액의 범위에서 공제할 수 있다.","a":"X","e":"「법인세법」상 요건을 모두 갖춘 적격합병의 경우 합병법 인이 기존에 보유하고 있던 이월결손금은 피합병법인으 로부터 승계받은 사업에서는 공제할 수 없다.","pg":335},{"id":1754,"ch":38,"n":6,"q":"적격합병의 경우 합병법인이 승계한 피합병법인의 결손금은 피합병법인으로부터 승계받은 사업에서 발생한 소득금액의 범위에서 합병법인의 각 사업연도의 과세표준을 계산할 때 공제한다. 0 X 354 제5편 법인세법","a":"O","e":"","pg":336},{"id":1755,"ch":39,"n":1,"q":"연결납세방식이란 둘 이상의 내·외국법인을 하나의 과세표 준과 세액을 계산하는 단위로 하여 법인세를 신고·납부하 는 방식을 말한다.","a":"X","e":"연결납세방식이란 둘 이상의 내국법인을 하나의 과세표 준과 세액을 계산하는 단위로 하여 법인세를 신고·납부 하는 방식을 말한다.","pg":337},{"id":1756,"ch":39,"n":2,"q":"연결지배란 내국법인이 다른 내국법인의 발행주식총수 또는 출자총액의 100분의 80 이상을 보유하고 있는 경우를 말한 다.","a":"X","e":"연결지배란 내국법인이 다른 내국법인의 발행주식총수 또는 출자총액의 100분의 90 이상을 보유하고 있는 경우 를 말한다.","pg":337},{"id":1757,"ch":39,"n":3,"q":"내국법인과 연결가능자법인에 연결납세방식을 적용하는 경 우 연결가능자법인이 2 이상인 때에는 해당 법인 모두에 연 결납세방식을 적용하여야 하는 것은 아니다.","a":"X","e":"내국법인과 연결가능자법인에 연결납세방식을 적용하는 경우 연결가능자법인이 2 이상인 때에는 해당 법인 모두 가 연결납세방식을 적용하여야 한다.","pg":337},{"id":1758,"ch":39,"n":4,"q":"다른 내국법인을 연결지배하는 내국법인이 비영리내국법인 인 경우에도 연결납세제도가 적용된다.","a":"X","e":"비영리내국법인은 연결가능 모법인이 될 수 없다.","pg":337},{"id":1759,"ch":39,"n":5,"q":"연결법인의 납세지는 연결가능 모법인의 납세지로 한다.","a":"O","e":"","pg":337},{"id":1760,"ch":39,"n":6,"q":"연결법인에 수시부과사유가 있는 경우 연결모법인의 납세지 관할지방국세청장은 법령으로 정하는 바에 따라 연결납세방 식의 적용 승인을 취소하여야 한다.","a":"X","e":"연결법인에 수시부과사유가 있는 경우 연결모법인의 납 세지 관할지방국세청장은 법령으로 정하는 바에 따라 연 결납세방식의 적용 승인을 취소할 수 있다.","pg":337},{"id":1761,"ch":39,"n":8,"q":"결 연 세 납 식 방 을 용 적 은 받 결 연 인 법 은 결 연 세 납 식 방 의 적 용 을 포기할 수 있 지만연납방, 결세식을 로 초 최 용 적 은 받 결 연 업 사 도 연 의 일 시 개 터 부 4 년 이 내 에 끝 나 는 결 연 업 사 도 연 까 지는 결 연 세 납 식 방 의 용 적 을 할 기 포 수 다 없 . OIX 09 자 결 연 인 법 이 른 다 결 연 인 법 에 수 흡 병 합 어 되 산 해 는 하 경 우 에는 산 해 일 기 등 이 는 하 속 결 연 업 사 도 연 에 결 연 세 납 식 방 을 용 적 할 수 다 없 .","a":"O","e":"결 연 세 납 식 방 을 용 적 은 받 결 연 인 법 은 결 연 세 납 식 방 의 적 용 을 할 기 포 수 만 지 있 , 로 초 최 용 적 은 받 결 연 업 사 도 연 와 그 음 다 결 연 업 사 도 연 의 일 시 개 터 부 4 년 에 내 이 는 나 끝 결 연 업 사 도 연 는 지 까 결 연 세 납 식 방 의 용 적 을 할 기 포 수 없다. 0 9 × 출 제 ■ - - - 1 C D L I N 오 다 진 p . 5 3 법 세 2 p . 3 6 K 9 4 자 결 연 인 법 이 른 다 결 연 인 법 에 수 흡 병 합 어 되 산 해 는 하 우 경 는 에 산 해 일 기 등 이 는 하 속 결 연 업 사 도 연 에 결 연 세 납 식 방 을 용 적 할 수 다 있 .","pg":338},{"id":1762,"ch":40,"n":1,"q":"결 연 인 법 모 은 각 결 연 업 사 도 연 의 일 료 종 이 속 하는 달 의 말 일 터 부 3 월 개 이 내 해 당 결 연 업 사 도 연 의 득 소 에 한 대 법 에 세 인 의 세 과 준 표 과 액 세 을 납 세 지 관 할 서 무 세 장 게 에 신 고 하여야 다 한 . OX 11 각 결 연 업 사 도 연 의 간 기 이 6 월 개 을 과 초 는 하 결 연 인 법 모 은 해당 업 사 도 연 일 시 개 터 부 6 간 월 개 을 간 중 납 예 간 기 로 으 하 여 결 연 간 중 예 액 세 납 을 간 중 납 예 간 기 이 지 난 날 터 부 3 월 개 이내에 납 세 관 할 서 무 세 에 부 납 야 여 하 다 한 . OX 지","a":"O","e":"결 연 인 법 모 은 각 결 연 업 사 도 연 의 일 료 종 이 는 하 속 달 의 일 말 터 부 4 월 개 에 내 이 당 해 결 연 업 사 도 연 의 득 소 에 대 한 세 인 법 의 세 과 준 표 과 액 세 을 지 세 납 할 관 서 무 세 장 에 게 고 신 야 여 하 다 한 . 1 1 × 제 출 - - - - | K N I L 오 다 진 p.- 법 세 2 9 6 3 . p 각 결 연 업 사 도 연 의 간 기 이 6 월 개 을 과 초 는 하 결 연 인 법 모 은 당 해 업 사 도 연 일 시 개 터 부 6 간 월 개 을 간 중 납 예 간 기 으 로 여 하 결 연 간 중 예 액 세 납 을 간 중 납 예 간 기 이 난 지 부 날 터 2 월 개 에 내 이 지 세 납 할 관 서 무 세 에 부 납 야 여 하 다 한 .","pg":338},{"id":1763,"ch":41,"n":1,"q":"비거주자란 거주자가 아닌 개인을 말한다.","a":"O","e":"","pg":339},{"id":1764,"ch":41,"n":2,"q":"내국법인이란 국내에 본점이나 주사무소 또는 사업의 실질 적 관리장소를 둔 법인을 말한다.","a":"O","e":"","pg":339},{"id":1765,"ch":41,"n":3,"q":"외국법인이란 외국에 본점이나 주사무소를 둔 단체(국내에 사업의 실질적 관리장소가 소재하는 경우 포함)로서 법령으 로 정하는 기준에 해당하는 법인을 말한다.","a":"X","e":"외국법인이란 본점 또는 주사무소가 외국에 있는 단체(사 업의 실질적 관리장소가 국내에 있지 아니하는 경우만 해 당)로서 법령으로 정하는 기준에 해당하는 법인을 말한 다.","pg":339},{"id":1766,"ch":41,"n":4,"q":"이자소득, 배당소득, 사업소득, 근로소득, 연금소득, 기타소 득, 퇴직소득, 양도소득은 「소득세법」 제4조 소득의 구분에 서 종합소득을 구성한다.","a":"X","e":"이자소득. 배당소득, 사업소득, 근로소득, 연금소득, 기 타소득은 「소득세법」 제4조 소득의 구분에서 종합소득을 구성한다.","pg":339},{"id":1767,"ch":41,"n":5,"q":"「소득세법」은 소득원천설과 순자산증가설 중에 순자산증가 설을 열거주의와 포괄주의 과세 중에 포괄주의 과세를 원칙 으로 적용한다.","a":"X","e":"「소득세법」은 소득원천설과 순자산증가설 중에 소득원천 설을, 열거주의와 포괄주의 과세 중에 열거주의 과세를 원칙으로 적용한다. 비교 「법인세법」이 순자산증가설과 포괄주의 과세를 원칙으로 적용 하","pg":339},{"id":1768,"ch":41,"n":6,"q":"「소득세법」상 이자소득·배당소득· 기타소득은 유형별 포괄 주의에 따라 열거된 것과 유사한 소득에 대해서도 과세한다. OX 360 제6편 소득세법","a":"X","e":"「소득세법」상 이자소득·배당소득· 사업소득은 유형별 포괄주의에 따라 열거된 것과 유사한 소득에 대해서도 과 세한다.","pg":339},{"id":1769,"ch":41,"n":7,"q":"퇴직소득은 장기간에 걸쳐 발생한 소득이 일시에 실현되기 때문에 종합소득과 합산하여 과세한다면 그 실현시점에 지 나치게 높은 세율이 적용되는 현상이 발생한다.","a":"O","e":"","pg":340},{"id":1770,"ch":41,"n":8,"q":"거주자는 국내원천소득·국외원천소득을 포함한 모든 소득 에 대한 무제한적 납세의무를 진다.","a":"O","e":"","pg":340},{"id":1771,"ch":41,"n":9,"q":"1과세기간 동안 183일 이상인 경우 또는 전년도부터 계속하 여 183일 이상인 경우에는 거주자로 보고 국내외 원천소득 에 대하여 무제한 납세의무를 진다.","a":"O","e":"","pg":340},{"id":1772,"ch":41,"n":10,"q":"5년 이하 단기외국인 거주자에 대한 특례로 직전 과세기간 종료일 10년 전부터 국내에 주소나 거소를 둔 기간의 합계 가 5년 이하인 외국인 거주자에 대해서는 국외에서 발생한 과세대상 소득 중 국내에서 지급되거나 국내로 송금된 소득 에 대해서만 과세한다.","a":"X","e":"5년 이하 단기외국인 거주자에 대한 특례로 해당 과세기 간 종료일 10년 전부터 국내에 주소나 거소를 둔 기간의 합계가 5년 이하인 외국인 거주자에 대해서는 국외에서 발생한 과세대상 소득 중 국내에서 지급되거나 국내로 송 금된 소득에 대해서만 과세한다.","pg":340},{"id":1773,"ch":41,"n":11,"q":"비거주자는 국내에 거소를 둔 기간이 183일이 되는 날의 다 음날에 거주자가 된다.","a":"X","e":"비거주자는 국내에 거소를 둔 기간이 183일이 되는 날에 거주자가 된다.","pg":340},{"id":1774,"ch":41,"n":12,"q":"「소득세법」에서는 거주기간에 따라 거주자와 비거주자를 구 분하는데 이때 국내에 거소를 둔 기간은 입국하는 날부터 출국하는 날의 전날까지로 한다. OIX 외국법인의 지점 또는 국내영 원천징수한 소득세를 납부할 의무로 한다.","a":"X","e":"「소득세법」에서는 거주기간에 따라 거주자와 비거주자를 구분하는데 이때 국내에 거소를 둔 기간은 입국하는 날의 다음 날부터 출국하는 날까지로 한다.","pg":340},{"id":1775,"ch":41,"n":13,"q":"국내에 거소를 두고 있던 개인이 출국 후 다시 입국한 경우 로서 생계를 같이 하는 가족의 거주지, 자산소재지 등을 고 려하여 출국 목적이 관광, 질병의 치료 등 법령으로 정하는 사유에 해당하여 그 출국한 기간이 명백히 일시적인 경우에 는 그 출국한 기간은 국내에 거소를 둔 기간으로 보지 않는 다.","a":"X","e":"국내에 거소를 두고 있던 개인이 출국 후 다시 입국한 경 우로서 생계를 같이 하는 가족의 거주지, 자산소재지 등 을 고려하여 출국 목적이 관광, 질병의 치료 등 법령으로 정하는 사유에 해당하여 그 출국한 기간이 명백히 일시적 인 경우에는 그 출국한 기간도 국내에 거소를 둔 기간으 로 본다.","pg":341},{"id":1776,"ch":41,"n":14,"q":"재외동포가 입국한 경우 생계를 같이 하는 가족의 거주지나 자산 소재지 등에 비추어 그 입국 목적이 단기 관광, 질병의 치료 병역의무의 이행, 그 밖에 친족 경조사 등 사업의 경영 또는 업무와 무관한 사유에 해당하여 그 입국한 기간이 명 백하게 일시적인 것으로 인정되는 때에는 해당 기간은 국내 에 거소를 둔 기간으로 보지 않는다.","a":"O","e":"","pg":341},{"id":1777,"ch":41,"n":15,"q":"「소득세법」에 따른 주소는 「주민등록법」에 따른 등록 여부에 따라 판정한다.","a":"X","e":"「소득세법」에 따른 주소는 국내에서 생계를 같이 하는 가 족 및 국내에 소재하는 자산의 유무 등 생활관계의 객관 적 사실에 따라 판정한다.","pg":341},{"id":1778,"ch":41,"n":16,"q":"거주자나 내국법인의 국외사업장 또는 해외현지법인(내국법 인이 발행주식총수 또는 출자지분의 100분의 100을 직접 또 는 간접 출자한 경우에 한정) 등에 파견된 임원 또는 직원이 나 국외에서 근무하는 공무원은 거주자로 본다.","a":"O","e":"","pg":341},{"id":1779,"ch":41,"n":17,"q":"주한외교관과 그 외교관의 세대에 속하는 가족은 국내에 주 소를 가진 것으로 본다.","a":"X","e":"주한외교관과 그 외교관의 세대에 속하는 가족은 국내에 주소가 없는 것으로 본다.","pg":341},{"id":1780,"ch":41,"n":18,"q":"국외에 근무하는 자가 외국국적을 가졌거나 그 외국의 영주 권을 얻은 자로서 국내에 생계를 같이하는 가족이 없고 그 직업 및 자산상태에 비추어 다시 입국하여 주로 국내에 거 주하리라고 인정되지 아니하는 때에는 국내에 주소가 없는 것으로 본다.","a":"O","e":"","pg":342},{"id":1781,"ch":41,"n":19,"q":"국내에 거주하는 개인이 계속하여 1년 이상 국내에 거주할 것을 통상 필요로 하는 직업을 가진 때에는 국내에 주소를 가진 것으로 본다.","a":"X","e":"국내에 거주하는 개인이 계속하여 183일 이상 국내에 거 주할 것을 통상 필요로 하는 직업을 가진 때에는 국내에 주소를 가진 것으로 본다.","pg":342},{"id":1782,"ch":41,"n":20,"q":"외국을 항해하는 선박 또는 항공기의 승무원의 경우 그 승 무원과 생계를 같이하는 가족이 거주하는 장소 또는 그 승 무원이 근무기간 외의 기간 중 통상 체재하는 장소가 국내 에 있는 때에는 해당 승무원의 주소는 국내에 있는 것으로 본다.","a":"O","e":"","pg":342},{"id":1783,"ch":41,"n":21,"q":"비거주자가 국내에 거소를 둔 경우에는 국내에 거소를 둔 기간이 183일이 되는 날의 다음 날부터 거주자로 본다.","a":"X","e":"비거주자가 국내에 거소를 둔 경우에는 국내에 거소를 둔 기간이 183일이 되는 날부터 거주자로 본다.","pg":342},{"id":1784,"ch":41,"n":22,"q":"거주자가 주소 또는 거소의 국외 이전을 위하여 출국하는 경우에는 그 출국하는 날부터 비거주자로 본다.","a":"X","e":"거주자가 주소 또는 거소의 국외이전을 위하여 출국하는 경우에는 그 출국하는 날의 다음 달부터 비거주자로 본 다.","pg":342},{"id":1785,"ch":41,"n":23,"q":"외국법인의 국내지점 또는 국내영업소는 「소득세법」에 따라 원천징수한 소득세를 납부할 의무를 진다.","a":"O","e":"","pg":342},{"id":1786,"ch":41,"n":24,"q":"「국세기본법」 규정에 따른 법인 아닌 단체 중 법인으로 보는 단체 외의 법인 아닌 단체의 구성원의 이익분배가 일부만 확인되는 경우로서 그 확인되지 아니한 부분에 대해서는 해 당 단체를 1거주자로 보아 소득세에 대한 납세의무를 부담 한다.","a":"X","e":"「국세기본법」 규정에 따른 법인 아닌 단체 중 법인으로 보 는 단체 외의 법인 아닌 단체의 구성원의 이익분배가 일 부만 확인되는 경우로서 그 확인되지 아니한 부분에 대해 서는 해당 단체가 국내에 주사무소 또는 사업의 실질적 관리장소를 둔 경우에는 해당 단체를 거주자로, 그 밖의 경우에는 비거주자로 보아 소득세에 대한 납세의무를 부 담한다.","pg":343},{"id":1787,"ch":41,"n":25,"q":"「국세기본법」 규정에 따른 법인 아닌 단체 중 법인으로 보는 단체 외의 법인 아닌 단체의 구성원 간 이익분배가 전부 확 인되는 경우 해당 단체를 1거주자 또는 1비거주자로 보아 소 득세에 대한 납세의무를 부담한다.","a":"X","e":"「국세기본법」 규정에 따른 법인 아닌 단체 중 법인으로 보 는 단체 외의 법인 아닌 단체의 구성원 간 이익분배가 전 부 확인되는 경우 해당 단체의 각 구성원별로 「소득세법」 또는 「법인세법」에 따라 소득에 대한 소득세 또는 법인세 를 납부할 의무를 진다.","pg":343},{"id":1788,"ch":41,"n":26,"q":"「소득세법」상 공동사업에 관한 소득금액을 계산하는 경우에 는 공동사업자가 연대하여 납세의무를 지는 것이 원칙이다.","a":"X","e":"「소득세법」상 공동사업에 관한 소득금액을 계산하는 경우 에는 해당 공동사업을 경영하는 각 거주자(출자공동사업 자 포함) 간에 약정된 손익분배비율(약정된 손익분배비율 이 없는 경우 지분비율)에 따라 분배되었거나 분배될 소 득금액에 따라 각 공동사업자별로 납세의무를 지는 것이 원칙이다.","pg":343},{"id":1789,"ch":41,"n":27,"q":"주된 공동사업자에게 합산과세되는 경우 그 합산과세되는 소득금액에 대해서는 주된 공동사업자의 특수관계인은 손익 분배 비율에 해당하는 그의 소득금액을 한도로 주된 공동사 업자와 연대하여 납세의무를 진다.","a":"O","e":"","pg":343},{"id":1790,"ch":41,"n":28,"q":"피상속인의 소득금액에 대해서 과세하는 경우에는 그 상속 인이 납세의무를 지는데 이때 피상속인의 소득금액에 대한 소득세를 상속인의 소득금액에 대한 소득세와 합산하여 소 득세를 계산한다.","a":"X","e":"피상속인의 소득금액에 대해서 과세하는 경우에는 그 상 속인이 납세의무를 지는데 이때 피상속인의 소득금액과 상속인의 소득금액을 구분하여 각각의 소득세를 계산한 다.","pg":343},{"id":1791,"ch":41,"n":29,"q":"원천징수되는 소득(이자소득, 배당소득 등)으로서 종합소득 과세표준을 계산할 때 합산되지 아니하는 소득이 있는 자는 그 원천징수되는 소득세에 대해서 납세의무를 진다.","a":"O","e":"","pg":344},{"id":1792,"ch":41,"n":30,"q":"공동으로 소유한 자산에 대한 양도소득금액을 계산하는 경 우에는 해당 자산을 공동으로 소유하는 거주자가 연대하여 납세의무를 진다.","a":"X","e":"공동으로 소유한 자산에 대한 양도소득금액을 계산하는 경우에는 해당 자산을 공동으로 소유하는 각 거주자가 납 세의무를 진다.","pg":344},{"id":1793,"ch":41,"n":31,"q":"신탁재산에 귀속되는 소득은 그 신탁의 이익을 받을 수익자 (수익자가 사망하는 경우에는 그 상속인)에게 귀속되는 것으 로 보며, 위탁자가 신탁재산을 실질적으로 통제하는 등 법령 으로 정하는 요건을 충족하는 신탁의 경우에는 그 신탁재산 에 귀속되는 소득은 수탁자에게 귀속되는 것으로 본다.","a":"X","e":"신탁재산에 귀속되는 소득은 그 신탁의 이익을 받을 수익 자(수익자가 사망하는 경우에는 그 상속인)에게 귀속되는 것으로 보며, 위탁자가 신탁재산을 실질적으로 통제하는 등 법령으로 정하는 요건을 충족하는 신탁의 경우에는 그 신탁재산에 귀속되는 소득은 위탁자에게 귀속되는 것으 로 본다.","pg":344},{"id":1794,"ch":41,"n":32,"q":"신탁재산에 귀속되는 소득이 그 신탁의 수익자에게 귀속되 는 경우에는 신탁의 위탁자는 그 신탁재산에 귀속되는 소득 에 대한 수익자와 함께 연대납세의무를 진다.","a":"X","e":"신탁재산에 귀속되는 소득이 그 신탁의 수익자에게 귀속 되는 경우에는 신탁의 위탁자는 그 신탁재산에 귀속되는 소득에 대한 납세의무를 지지 않는다.","pg":344},{"id":1795,"ch":41,"n":33,"q":"신탁업을 경영하는 자는 각 과세기간의 소득금액을 계산할 때 신탁재산에 귀속되는 소득과 그 밖의 소득을 구분하여 경리하여야 한다.","a":"O","e":"","pg":344},{"id":1796,"ch":41,"n":34,"q":"거주자가 신규로 사업을 개시한 경우에는 사업개시일로부터 해당 연도 12월 31일까지의 소득금액에 대하여 소득세를 과 세한다.","a":"X","e":"소득세의 과세기간은 원칙적으로 1월 1일부터 12월 31일 까지 일괄적으로 적용하기 때문에 개인은 사업자라도 임 의로 사업연도를 정할 수 없으며, 연중에 신규로 사업을 개시한 경우에도 1월 1일부터 12월 31일까지를 과세기간 으로 한다.","pg":344},{"id":1797,"ch":41,"n":35,"q":"소득세의 과세기간은 신규사업개시자의 경우 사업개시일부 터 12월 31일까지로 하며, 폐업자의 경우 1월 1일부터 폐업일 까지로 한다.","a":"X","e":"소득세의 과세기간은 신규사업개시자의 경우 1월 1일부 더 12월 31일까지로 하며, 매입자의 경우에도 1월 1일부 더 12월 31일까지로 한다.","pg":345},{"id":1798,"ch":41,"n":36,"q":"거주자가 사망한 경우의 소득세 과세기간은 1월 1일부터 12 월 31일까지로 한다.","a":"X","e":"거주자가 사망한 경우의 소득세 과세기간은 1월 1일부터 사망한 날까지로 한다.","pg":345},{"id":1799,"ch":41,"n":37,"q":"거주자가 출국으로 인하여 비거주자가 되는 경우 1월 1일부 터 출국일의 전날까지의 소득에 대해 과세한다.","a":"X","e":"거주자가 출국으로 인하여 비거주자가 되는 경우 1월 1일 부터 출국일까지의 소득에 대해 과세한다.","pg":345},{"id":1800,"ch":41,"n":38,"q":"거주자의 소득세 납세지는 그 주소지로 한다. 다만, 주소지 가 없는 경우에는 사업장의 소재지로 한다.","a":"X","e":"거주자의 소득세 납세지는 그 주소지로 한다. 다만, 주소 지가 없는 경우에는 그 거소지로 한다.","pg":345},{"id":1801,"ch":41,"n":39,"q":"거주자의 소득세 납세지는 그 주소지로 하되 주소지가 둘 이상인 때에는 생활관계가 보다 밀접한 곳을 납세지로 한다.","a":"X","e":"거주자의 소득세 납세지는 그 주소지로 하되 주소지가 둘 이상인 때에는 주민등록법」에 의하여 등록된 곳을 납세 지로 한다. 비교 거소지가 둘 이상인 때에는 생활관계가 보다 밀접한 곳을 납세 지로 함","pg":345},{"id":1802,"ch":41,"n":40,"q":"거주자가 취학 · . 질병의 요양, 근무상 또는 사업상의 형편 등 의 사유로 일시퇴거한 경우에는 본래의 주소지 또는 거소지 를 「소득세법」에 따른 납세지로 본다.","a":"O","e":"","pg":345},{"id":1803,"ch":41,"n":41,"q":"비거주자의 국내사업장이 둘 이상 있는 경우 소득세의 납세 지는 해당 비거주자가 납세지로 신고하는 장소로 한다.","a":"X","e":"비거주자의 국내사업장이 둘 이상 있는 경우 소득세의 세지는 주된 국내사업장의 소재지로 한","pg":345},{"id":1804,"ch":41,"n":42,"q":"비거주자의 소득세 납세지는 국내사업장의 소재지로 하되 국내사업장이 없는 경우에는 거류지 또는 체류지로 한다.","a":"X","e":"비거주자의 소득세 납세지는 국내사업장의 소재지로 하 되 국내사업장이 없는 경우에는 국내원천소득이 발생하 는 장소로 한다.","pg":346},{"id":1805,"ch":41,"n":43,"q":"원천징수하는 자가 거주자인 경우 원천징수하는 소득세의 납세지는 그 거주자의 주된 사업장 소재지로 한다. 다만, 주 된 사업장 외의 사업장에서 원천징수를 하는 경우에는 그 거주자의 주소지 또는 거소지로 한다.","a":"X","e":"원천징수하는 소득세의 납세지는 그 거주자의 주된 사업 장 소재지로 한다. 다만, 주된 사업장 외의 사업장에서 원 천징수를 하는 경우에는 그 사업장의 소재지로 한다. 참고 원천징수하는 자가 거주자인 경우로서 사업장이 없는 경우에 는 그 거주자의 주소지 또는 거소지로 함","pg":346},{"id":1806,"ch":41,"n":44,"q":"비거주자가 원천징수하는 소득세의 납세지는 국내사업장과 관계없이 그 비거주자의 거류지 또는 체류지로 한다.","a":"X","e":"원천징수하는 자가 비거주자인 경우에는 그 비거주자의 주된 국내사업장 소재지를 납세지로 한다. 다만, 주된 국 내사업장 외의 국내사업장에서 원천징수를 하는 경우에 는 그 국내사업장의 소재지, 국내사업장이 없는 경우에는 그 비거주자의 거류지 또는 체류지로 한다.","pg":346},{"id":1807,"ch":41,"n":45,"q":"해외근무 등으로 국내에 주소가 없는 공무원의 소득세 납세 지는 그 가족의 생활근거지 또는 소속기관의 소재지로 한다.","a":"O","e":"","pg":346},{"id":1808,"ch":41,"n":46,"q":"납세조합이 징수하는 소득세의 납세지는 그 조합원의 소재 지로 한다.","a":"X","e":"납세조합이 징수하는 소득세의 납세지는 그 납세조합의 소재지로 한다.","pg":346},{"id":1809,"ch":41,"n":47,"q":"거주자가 사망하였을 경우에는 소득세 납세의무는 면제되고 상속세 납세의무를 진다.","a":"X","e":"자연인으로 생존했던 기간에 대해서만 과세하기 때문에, 1월 1일부터 사망한 날까지를 과세기간으로 하여 해당 기 간에 대한 소득세 납세의무를 해당 거주자의 상속인이 승 계한다.","pg":346},{"id":1810,"ch":41,"n":48,"q":"상속의 경우로서 납세관리인을 둔 경우에는 그 상속인 또는 납세관리인의 주소지나 거소지 중 상속인 또는 납세관리인 이 그 관할 세무서장에게 납세지로서 신고하는 장소로 한다.","a":"X","e":"상속의 경우로서 납세관리인을 둔 경우에는 그 피상속 인·상속인 또는 납세관리인의 주소지나 거소지 중 상속 인 또는 납세관리인이 그 관할 세무서장에게 납세지로서 신고하는 장소로 한다.","pg":347},{"id":1811,"ch":41,"n":49,"q":"비거주자가 납세관리인을 둔 경우 그 비거주자의 소득세 납 세자는 그 납세관리인의 주소지나 거소지로 한다.","a":"X","e":"비거주자가 납세관리인을 둔 경우 그 비거주자의 소득세 납세지는 그 국내사업장 소재지 또는 그 납세관리인의 주소지나 거소지 중 납세관리인이 그 관할 세무서장에게 납세지로서 신고하는 장소로 한다.","pg":347},{"id":1812,"ch":41,"n":50,"q":"사업소득이 있는 거주자가 사업장 소재지를 납세지로 신청 한 경우 납세지의 지정권자인 국세청장 · 관할 지방국세청장 또는 관할 세무서장은 납세지를 따로 지정할 수 있다.","a":"X","e":"사업소득이 있는 거주자가 사업장 소재지를 납세지로 신 청한 경우 납세지의 지정권자인 국세청장 또는 관할 지방 국세청장은 납세지를 따로 지정할 수 있다.","pg":347},{"id":1813,"ch":41,"n":51,"q":"납세지의 지정 사유가 소멸한 경우 국세청장 또는 관할 지 방국세청장은 납세지의 지정을 취소하여야 한다.","a":"O","e":"","pg":347},{"id":1814,"ch":41,"n":52,"q":"납세지 지정사유가 소멸한 경우 국세청장 또는 관할 지방국 세청장은 납세의무자가 요청하는 경우에 한하여 납세지의 지정을 취소할 수 있다.","a":"X","e":"납세지 지정사유가 소멸한 경우 국세청장 또는 관할 지방 국세청장은 납세지의 지정을 취소해야 한다. 즉, 납세자 의 요청한 경우에 한하여 취소하는 것은 아니다.","pg":347},{"id":1815,"ch":41,"n":53,"q":"납세지의 지정이 취소된 경우에도 그 취소 전에 한 소득세 에 관한 신고, 신청, 청구, 납부, 그 밖의 행위의 효력은 소급 적용된다.","a":"X","e":"납세지의 지정이 취소된 경우에도 그 취소 전에 한 소득 세에 관한 신고, 신청, 청구, 납부, 그 밖의 행위의 효력 에는 영향을 미치지 아니한다.","pg":347},{"id":1816,"ch":41,"n":54,"q":"거주자나 비거주자는 납세지가 변경된 경우 납세지변경신고 서를 그 변경 전의 납세지 관할 세무서장에게 납세지가 변 경된 날부터 15일 이내에 이를 신고해야 한다. OX 368 제6편 소득세법","a":"X","e":"거주자나 비거주자는 납세지가 변경된 경우 납세지변경 신고서를 그 변경 후의 납세지 관할 세무서장에게 납세지 가 변경된 날부터 15일 이내에 이를 신고해야 한다.","pg":347},{"id":1817,"ch":41,"n":55,"q":"납세자의 주소지가 변경됨에 따라 「부가가치세법」 규정에 의하여 사업자등록 정정을 한 경우에도 별도로 변경신고를 해야 한다.","a":"X","e":"납세자의 주소지가 변경됨에 따라 「부가가치세법」 규정에 의하여 사업자등록 정정을 한 경우에는 납세지의 변경신 고를 한 것으로 보아 별도로 변경신고를 할 필요가 없다.","pg":348},{"id":1818,"ch":42,"n":1,"q":"국가가 발행한 채권이 원금과 이자가 분리되는 경우에는 원 금에 해당하는 채권 및 이자에 해당하는 채권의 할인액은 소득세법령상 이자소득에 포함된다.","a":"O","e":"","pg":349},{"id":1819,"ch":42,"n":2,"q":"국채를 공개시장에서 통합발행하는 경우 그 매각가액과 액 면가액과의 차액은 소득세법령상 이자소득에 포함된다.","a":"X","e":"다음의 채권을 공개시장에서 통합발행하는 경우 해당 채 권의 매각가액과 액면가액과의 차액은 소득세법령상 이 자소득에 포함되지 않는다. ㉠ 국채 ㉡ 「한국산업은행법」에 따른 산업금융채권 「예금자보호법」에 따른 예금보험기금채권과 예금보 험기금채권상환기금채권 ②「한국은행법」에 따른 한국은행통화안정증권","pg":349},{"id":1820,"ch":42,"n":3,"q":"대금업을 영위하여 사업적으로 금전을 대여하는 자가 금전 대여의 대가로 수령하는 이자나 수수료는 이자소득으로 본 다.","a":"X","e":"대금업을 영위하여 사업적으로 금전을 대여하는 자가 금 전 대여의 대가로 수령하는 이자나 수수료는 사업소득에 포함하여 과세한다.","pg":349},{"id":1821,"ch":42,"n":4,"q":"근로자가 퇴직하거나 탈퇴하여 그 규약에 따라 직장공제회 로부터 받는 초과반환금은 종합과세하는 것이 원칙이나 기 준금액을 초과하는 경우에는 분리과세한다.","a":"X","e":"근로자가 퇴직하거나 탈퇴하여 그 규약에 따라 직장공제 회로부터 받는 초과반환금은 이자소득으로 무조건 분리 과세한다. 즉, 직장공제회 초과반환금은 종합소득 과세표 준에 합산하지 아니한다.","pg":349},{"id":1822,"ch":42,"n":5,"q":"과세 대상이 되는 직장공제회 초과반환금에는 반환금에서 납입공제료를 뺀 금액인 '납입금 초과이익'만이 아니라 반환 금 분할지급 시 발생하는 '반환금 추가이익'도 포함된다. Ox 370 제6편 소득세법","a":"O","e":"","pg":349},{"id":1823,"ch":42,"n":6,"q":"거주자가 일정기간 후에 같은 종류로서 같은 양의 채권을 반환받는 조건으로 채권을 대여하고 해당 채권의 차입자로 부터 지급받는 해당 채권에서 발생하는 이자에 상당하는 금 액은 이자소득에 해당한다.","a":"O","e":"","pg":350},{"id":1824,"ch":42,"n":7,"q":"「소득세법」상 이자소득을 발생시키는 거래 또는 행위와 자 본시장과 금융투자업에 관한 법률」에 따른 파생상품이 법으 로 정하는 바에 따라 결합된 경우 해당 파생상품의 거래 또 는 행위로부터의 이익은 이자소득으로 과세한다.","a":"O","e":"","pg":350},{"id":1825,"ch":42,"n":8,"q":"해당 과세기간에 발생한 비영업대금의 이익에 대하여 과세 표준확정신고 전에 채무자의 파산, 강제집행, 형의 집행, 사 업의 폐지, 사망, 실종 또는 행방불명으로 인하여 회수할 수 없는 비영업대금의 이익은 이자부터 회수한 것으로 보아 회 수한 금액에서 원금에 해당하는 부분을 차감한 금액을 비영 업대금 이익의 총수입금액으로 본다.","a":"X","e":"해당 과세기간에 발생한 비영업대금의 이익에 대하여 과 세표준확정신고 전에 채무자의 파산, 강제집행, 형의 집 행, 사업의 폐지, 사망. 실종 또는 행방불명으로 인하여 회수할 수 없는 비영업대금의 이익은 완급부터 회수한 것 으로 보아 회수한 금액에서 원금을 차감한 금액을 비영업 대금 이익의 총수입금액으로 본다.","pg":350},{"id":1826,"ch":42,"n":9,"q":"내국법인이 발행한 무기명채권의 이자와 할인액은 약정에 의한 지급일을 수입시기로 한다.","a":"X","e":"내국법인이 발행한 무기명채권의 이자와 할인액은 그 지 급을 받은 날을 수입시기로 한다. 비교 내국법인이 발행한 기명식 채권의 이자와 할인액은 약정에 의한 지급일을 수입시기로 함","pg":350},{"id":1827,"ch":42,"n":10,"q":"•통지예금의 이자소득 수입시기는 인출일이다.","a":"O","e":"","pg":350},{"id":1828,"ch":42,"n":11,"q":"직장공제회의 초과반환금의 수입시기는 약정에 따른 납입금 초과이익 및 반환금 추가이익의 지급일이다.","a":"O","e":"","pg":350},{"id":1829,"ch":42,"n":12,"q":"비영업대금의 이익과 예금이자의 수입시기는 원칙적으로 약 정에 의한 이자지급일이다.","a":"X","e":"비영업대금의 이익의 수입시기는 원칙적으로 약정에 의 한 이자지급일이고 예금이자의 수입시기는 실제로 이자 를 지급받는 날이다.","pg":351},{"id":1830,"ch":42,"n":13,"q":"저축성보험의 보험차익(기일전에 해지하는 경우 제외)은 보 험금 또는 환급금의 지급일로 한다.","a":"O","e":"","pg":351},{"id":1831,"ch":42,"n":14,"q":"이자소득이 발생하는 상속재산이 상속되는 경우에는 실제 지급일을 수입시기로 한다.","a":"X","e":"이자소득이 발생하는 상속재산이 상속되는 경우에는 상 속개시일을 수입시기로 한다.","pg":351},{"id":1832,"ch":42,"n":15,"q":"이자소득으로 열거된 소득과 유사한 소득으로서 금전의 사 용에 따른 대가의 성격이 있는 것은 실제로 그 대가를 지급 받는 날을 수입시기로 한다.","a":"X","e":"이자소득으로 열거된 소득과 유사한 소득으로서 금전의 사용에 따른 대가의 성격이 있는 것은 약정에 따른 상환 일과 실제 상환일 중 빠른 날을 수입시기로 한다.","pg":351},{"id":1833,"ch":42,"n":16,"q":"외국법인으로부터 받는 이익이나 잉여금의 배당은 배당소득 에 해당하지 아니한다.","a":"X","e":"외국법인으로부터 받는 이익이나 잉여금의 배당은 배당 소득에 해당한다.","pg":351},{"id":1834,"ch":42,"n":17,"q":"법인으로 보는 단체로부터 받는 분배금은 배당소득에 해당 하지 아니한다.","a":"X","e":"법인으로 보는 단체로부터 받는 분배금은 배당소득에 해 당한다.","pg":351},{"id":1835,"ch":42,"n":18,"q":"법인과세 신탁재산으로부터 받는 배당금·분배금은 배당소 득에 해당하지 아니한다.","a":"X","e":"법인과세 신탁재산으로부터 받는 배당금 · 분배금은 배당 소득에 해당한다.","pg":351},{"id":1836,"ch":42,"n":19,"q":"합병으로 소멸한 법인의 주주가 합병 후 존속하는 법인으로 부터 그 합병으로 취득하는 주식의 가액과 금전의 합계액이 그 합병으로 소멸한 법인의 주식을 취득하기 위하여 사용한 금액을 초과하는 금액은 배당소득에 포함되지 아니한다.","a":"X","e":"합병으로 소멸한 법인의 주주가 합병 후 존속하는 법인으 로부터 그 합병으로 취득하는 주식의 가액과 금전의 합계 액이 그 합병으로 소멸한 법인의 주식을 취득하기 위하여 사용한 금액을 초과하는 금액은 배당으로 의제하므로 배 당소득에 포함된다.","pg":351},{"id":1837,"ch":42,"n":20,"q":"집합투자기구의 투자대상이 채권인 경우 그로부터 수령한 이익은 이자소득으로 과세하며 집합투자기구의 투자대상이 증권인 경우 그로부터 수령한 이익은 배당소득으로 과세한 다.","a":"X","e":"집합투자기구의 투자대상(주식, 채권 등)을 불문하고. 그 로부터 이익을 수령할 경우 배당소득으로 과세한다.","pg":352},{"id":1838,"ch":42,"n":21,"q":"국내 또는 국외에서 받는 법령으로 정하는 파생결합사채의 이익은 이자소득에 해당한다.","a":"X","e":"국내외에서 받는 법령으로 정한 파생결합사채로부터의 이익은 배당소득에 해당한다. 참고 금융투자소득세 도입이 무산되면서 2025년부터 파생결합사 채로부터의 이익을 이자소득으로 과세하려던 개정안도 폐기되었다.","pg":352},{"id":1839,"ch":42,"n":22,"q":"공동사업에서 발생하는 소득금액 중 공동사업에 성명 또는 상호를 사용하게 한 자에 대한 손익분배비율에 상당하는 금 액은 배당소득으로 보고 종합과세한다.","a":"X","e":"공동사업에서 발생하는 소득금액 중 공동사업에 성명 또 는 상호를 사용하게 한 자는 출자공동사업자에 해당하지 않으므로 그에 대한 손익분배비율에 해당하는 금액은 사 업소득에 해당한다.","pg":352},{"id":1840,"ch":42,"n":23,"q":"공동사업에서 발생한 채무에 대하여 무한책임을 부담하기로 약정한 자는 출자공동사업자가 될 수 있다.","a":"X","e":"공동사업에서 발생한 채무에 대하여 무한책임을 부담하 기로 약정한 자는 출자공동사업자가 될 수 없다. 출자공동사업자는 다음에 해당하지 아니한 자로서 공동사 업의 경영에 참여하지 아니하고 출자만하는 자를 말한다. ① 공동사업에 성명 또는 상호를 사용하게 한 자 ② 공동사업에서 발생한 채무에 대하여 무한책임을 부 담하기로 약정한 자","pg":352},{"id":1841,"ch":42,"n":24,"q":"거주자가 일정기간 후에 같은 종류로서 같은 양의 주식을 반환 받는 조건으로 주식을 대여하고 해당 주식의 차입자로 부터 지급받는 해당 주식에서 발생하는 배당에 상당하는 금 액은 이자소득에 포함된다.","a":"X","e":"거주자가 일정기간 후에 같은 종류로서 같은 양의 주식을 반환 받는 조건으로 주식을 대여하고 해당 주식의 차입자 로부터 지급받는 해당 주식에서 발생하는 배당에 상당하 는 금액은 배당소득에 포함된다.","pg":352},{"id":1842,"ch":42,"n":25,"q":"배당소득금액은 해당 과세기간의 총수입금액에서 필요경비 를 공제한 금액으로 한다.","a":"X","e":"배당소득금액은 필요경비를 인정하지 않는다. 따라서 배당소득금액은 배당소득 총수입금액에 귀속법인 세를 가산한 금액으로 계산한다.","pg":353},{"id":1843,"ch":42,"n":26,"q":"이자소득금액 또는 배당소득금액을 계산할 때 필요경비에 산입할 금액은 해당 과세기간의 총수입금액에 대응하는 비 용으로서 일반적으로 용인되는 통상적인 것의 합계액으로 한다.","a":"X","e":"이자소득과 배당소득은 필요경비를 인정하지 않는다.","pg":353},{"id":1844,"ch":42,"n":27,"q":"원천징수세율이 적용되는 배당소득에 대해서만 Gross-up 금액이 가산된다.","a":"X","e":"기본세율이 적용되는 배당소득에 대해서만 Gross-up금 액이 가산된다.","pg":353},{"id":1845,"ch":42,"n":28,"q":"잉여금 처분에 따른 배당소득의 수입시기는 당해 법인의 결 산확정일이 속하는 사업연도이다.","a":"X","e":"잉여금 처분에 따른 배당소득의 수입시기는 당해 법인의 잉여금 처분결의일이다.","pg":353},{"id":1846,"ch":42,"n":29,"q":"「법인세법」에 따라 처분된 배당소득의 수입시기는 당해 법 인의 당해 과세기간 종료일이다.","a":"X","e":"「법인세법」에 따라 처분된 배당소득은 인정배당으로, 인 정배당의 수입시기는 배당하는 법인의 해당 사업연도의 결산확정일이다.","pg":353},{"id":1847,"ch":42,"n":30,"q":"유형별 포괄주의에 해당하는 배당의 수입시기는 법인의 잉 여금처분결의일로 하며, 해산으로 인한 의제배당의 수입시 기는 해산등기일로 한다.","a":"X","e":"유형별 포괄주의에 해당하는 배당은 그 지급을 받은 날을 귀속시기로 하며, 해산으로 인한 의제배당의 수입시기는 잔여재산가액확정일로 한다.","pg":353},{"id":1848,"ch":42,"n":31,"q":"원본에 전입하는 뜻의 특약이 있는 집합투자기구로부터의 이익은 그 이익을 지급받은 날을 수입시기로 한다.","a":"X","e":"원본에 전입하는 뜻의 특약이 있는 집합투자기구로부터 의 이익은 특약에 따라 원본에 전입되는 날을 수입시기로 한다.","pg":353},{"id":1849,"ch":42,"n":32,"q":"집합투자기구로부터의 이익은 이익을 지급받기로 약정한 날 이 수입시기이다.","a":"X","e":"집합투자기구로부터의 이익은 이익을 지급받은 날이다. 다만, 원본에 전입하는 특약이 있는 분배금은 원본에 전 입된 날이다.","pg":354},{"id":1850,"ch":42,"n":33,"q":"출자공동사업자가 받는 손익분배비율 상당액의 수입시기는 그 지급을 받은 날로 한다.","a":"X","e":"출자공동사업자가 받는 손익분배비율 상당액의 수입시기 는 과세기간 종료일로 한다.","pg":354},{"id":1851,"ch":42,"n":34,"q":"국내에서 지급하는 이자소득과 배당소득 모두 소득세법상 원천징수 대상 소득에 해당한다.","a":"O","e":"","pg":354},{"id":1852,"ch":42,"n":35,"q":"국내에서 거주자에게 배당소득을 지급하는 자는 소득세 원 천징수의무를 지지만, 비거주자에게 배당소득을 지급하는 자는 원천징수의무를 지지 않는다.","a":"X","e":"국내에서 거주자에게 지급하든 비거주자에게 지급하든 불문하고 배당소득을 지급하는 자는 소득세 원천징수의 무를 진다.","pg":354},{"id":1853,"ch":42,"n":36,"q":"조건부 종합과세대상 금융소득의 합계액이 2,000만원을 초 과할 경우 그 초과분은 종합과세한다.","a":"X","e":"무조건 종합과세대상 금융소득과 조건부 종합과세대상 금융소득의 합계액이 2,000만원을 초과할 경우에는 무조 건 종합과세대상 금융소득과 조건부 종합과세대상 금융 소득 전액을 종합과세한다. 비고 무조건 종합과세대상 금융소득과 조건부 종합과세대상 금융 소득의 합계액이 2,000만원 이하인 경우 조건부 종합과세대상 금융 소득은 분리과세함","pg":354},{"id":1854,"ch":42,"n":37,"q":"법인으로 보는 단체 외의 단체 중 수익을 구성원에게 배분 하지 아니하는 단체로서 단체명을 표기하여 금융거래를 하 는 단체가 금융회사 등으로부터 받는 배당소득은 조건부 종 합과세 배당소득이며, 원천징수세율은 14%를 적용한다.","a":"X","e":"법인으로 보는 단체 외의 단체 중 수익을 구성원에게 배 분하지 아니하는 단체로서 단체명을 표기하여 금융거래 를 하는 단체가 금융회사 등으로부터 받는 배당소득은 분 리과세 배당소득이며, 원천징수세율은 14%를 적용한다.","pg":354},{"id":1855,"ch":42,"n":38,"q":"대통령령으로 정하는 실지명의가 확인되지 아니하는 배당소 득은 분리과세배당소득이며, 원천징수세율은 30%를 적용한 다.","a":"X","e":"대통령령으로 정하는 실지명의가 확인되지 아니하는 배 당소득은 분리과세배당소득이며, 원천징수세율은 45%를 적용한다.","pg":355},{"id":1856,"ch":42,"n":39,"q":"직장공제회 초과반환금은 분리과세이자소득이며, 원천징수 세율은 기본세율을 적용한다. ○","a":"O","e":"","pg":355},{"id":1857,"ch":42,"n":40,"q":"「민사집행법」에 의한 경매입찰 법원 보증금 및 경락대금에 서 발생하는 이자소득에 대하여는 100분의 14의 세율로 원 천징수하고 종합과세한다.","a":"X","e":"「민사집행법」에 의한 경매입찰 법원 보증금 및 경락대금 에서 발생하는 이자소득에 대하여는 100분의 14의 세율 로 원천징수하고 무조건 분리과세한다.","pg":355},{"id":1858,"ch":42,"n":41,"q":"공동사업에서 발생하는 소득금액 중 출자공동사업자에 대한 손익분배비율에 상당하는 금액은 100분의 14의 세울로 원천 징수하고 분리과세한다.","a":"X","e":"공동사업에서 발생하는 소득금액 중 출자공동사업자에 대한 손익분배비율에 상당하는 금액은 100분의 25의 세 울로 원천징수하고 종합과세한다.","pg":355},{"id":1859,"ch":42,"n":42,"q":"외국의 법인으로부터 받은 배당소득은 Gross-up 대상이 아 니며 종합과세하는 것이 원칙이다.","a":"O","e":"","pg":355},{"id":1860,"ch":42,"n":43,"q":"법인으로 보는 단체 외의 단체 중 수익을 구성원에게 배분 하지 아니하는 단체로서 단체명을 표기하여 금융거래를 하 는 단체가 금융실명거래 및 비밀보장에 관한 법률」에 따른 금융회사 등으로부터 받는 배당소득은 종합소득과세표준을 계산할 때 합산하지 아니한다. ○","a":"O","e":"","pg":355},{"id":1861,"ch":43,"n":1,"q":"「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 따른 공익사업과 관련한 지역권. 지상권의 설정. 대여소득 은 부동산 임대소득이다.","a":"X","e":"일반적인 지역권과 지상권의 대여는 사업소득이다. 그러 나 공익사업과 관련한 지역권. 지상권의 설정. 대여소득 은 기타소득이다.","pg":356},{"id":1862,"ch":43,"n":2,"q":"공장재단의 대여로 인하여 발생하는 소득은 사업소득이다.","a":"O","e":"","pg":356},{"id":1863,"ch":43,"n":3,"q":"광업권자 등이 자본적 지출이나 수익적 지출의 일부 또는 전부를 제공하는 것을 조건으로 광업권. 조광권 또는 채굴 에 관한 권리를 대여하고 덕대 또는 분덕대로부터 받는 분 철료는 기타소득으로 본다.","a":"X","e":"광업권자 등이 자본적 지출이나 수익적 지출의 일부 또는 전부를 제공하는 것을 조건으로 광업권. 조광권 또는 채 굴에 관한 권리를 대여하고 덕대 또는 분덕대로부터 받는 분철료는 일반 사업소득으로 본다.","pg":356},{"id":1864,"ch":43,"n":4,"q":"통신판매중개를 하는 자를 통하여 물품.장소를 대여하고 사용료를 받는 사업을 계속적·반복적으로 영위하는 경우 기타소득으로 과세한다.","a":"X","e":"통신판매중개를 하는 자를 통하여 물품 · 장소를 대여하 고 사용료를 받는 사업을 계속적·반복적으로 영위하는 경우 사업소득으로 과세한다. 비교 통신판매중개를 하는 자를 통하여 물품장소를 대여하고 연간 수입금액이 500만원 이하의 사용료로서 받은 금픔을 기타소득으로 원천징수하거나 과세표준확정신고를 한 경우에는 기타소득으로 과 세","pg":356},{"id":1865,"ch":43,"n":5,"q":"전답을 작물생산에 이용하게 함으로써 발생하는 소득에 대 하여는 부동산임대소득으로 과세한다.","a":"X","e":"전답을 작물생산에 이용하게 함으로써 발생하는 소득에 대하여는 소득세를 과세하지 않는다.","pg":356},{"id":1866,"ch":43,"n":6,"q":"계약에 따라 그 대가를 받고 연구 또는 개발용역을 제공하 는 연구개발업에서 발생하는 소득은 소득세를 과세하지 않 는다.","a":"X","e":"계약에 따라 그 대가를 받고 연구 또는 개발용역을 제공 하는 연구개발업에서 발생하는 소득은 과세한다.","pg":356},{"id":1867,"ch":43,"n":7,"q":"작물재배업 중 곡물 및 기타 식량작물재배업, 「유아교육법」 에 따른 유치원, 「초·중등교육법」 및 「고등교육법」에 의한 학교 연구개발용역(계약 등에 따라 그 대가를 받고 연구 또 는 개발용역을 제공하는 사업 포함)은 과세하지 않는 사업소 득에 해당한다.","a":"X","e":"작물재배업 중 곡물 및 기타 식량작물재배업, 「유아교육 법」에 따른 유치원, 「초·중등교육법」 및 「고등교육법」에 의한 학교, 연구개발용역(계약 등에 따라 그 대가를 받고 연구 또는 개발용역을 제공하는 사업은 제외)은 과세하지 않는 사업소득에 해당한다.","pg":357},{"id":1868,"ch":43,"n":8,"q":"조림기간 3년 이상인 임지의 임목의 벌채 또는 양도로 발생 하는 소득으로서 연 3,000만원 이하의 금액은 비과세 사업 소득에 해당한다.","a":"X","e":"조림기간 5년 이상인 임지의 임목의 벌채 또는 양도로 발 생하는 소득으로서 연 3,000만원 이하의 금액은 비과세 사업소득에 해당한다.","pg":357},{"id":1869,"ch":43,"n":9,"q":"거주자가 수도권 지역에서 전통주를 제조함으로써 발생한 소득금액 연 1천300만원인 경우 소득세를 비과세한다.","a":"X","e":"거주자가 수도권 밖의 읍·면 지역에서 전통주를 제조함 으로써 발생하는 소득으로 소득금액의 합계액이 연 1,200만원 이하의 것에 대해서는 소득세를 과세하지 아 니한다. 다만, 1,200만원을 초과하면 초과분만 과세하는 것이 아니라 전액 과세한다. 따라서 거주자가 수도권 지역에서 전통주를 제조함으로 써 발생한 소득금액 연 1천300만원인 경우 전액 소득세 를 과세한다.","pg":357},{"id":1870,"ch":43,"n":10,"q":"농민이 부업으로 경영하는 고공품 제조 · . 민박 · . 특산물제 조. 전통차 제조 및 그 밖에 이와 유사한 활동에서 발생한 소득금액 연 5천만원 이하인 경우 소득세를 과세하지 않는 다.","a":"X","e":"농민이 부업으로 경영하는 고공품 제조 · 민박 · 특산물제 조. 전통차 제조 및 그 밖에 이와 유사한 활동에서 발생 한 소득금액 연 3천만원 이하인 경우 소득세를 과세하지 않는다.","pg":357},{"id":1871,"ch":43,"n":11,"q":"한국표준산업분류에 따른 연근해어업과 내수면어업 또는 양 식어업에서 발생하는 소득으로서 해당 과세기간의 소득금액 의 합계액이 5천만원 이하의 것에 대해서는 비과세한다.","a":"O","e":"","pg":357},{"id":1872,"ch":43,"n":12,"q":"1개의 주택을 소유하는 자의 주택임대소득은 소득세를 과세 하지 아니하지만 과세기간 종료일 또는 해당 주택의 양도일 현재 실지거래가액이 9억원을 초과하는 주택 및 국외에 소 재하는 주택의 임대소득은 제외한다.","a":"X","e":"1개의 주택을 소유하는 자의 주택임대소득은 소득세를 과 세하지 아니하지만 과세기간 종료일 또는 해당 주택의 양 도일 현재 기준시가가 12억원을 초과하는 주택 및 국외에 소재하는 주택의 임대소득은 제외한다.","pg":358},{"id":1873,"ch":43,"n":13,"q":"「소득세법」상 거주자의 비과세 주택임대소득과 관련하여 기준시가가 12억원을 초과하는 주택은 해당 주택의 취득일 을 기준으로 판단한다.","a":"X","e":"「소득세법」상 거주자의 비과세 주택임대소득과 관련하 여 기준시가가 12억원을 초과하는 주택은 과세기간 종료 일 또는 해당 주택의 양도일 현재를 기준으로 판단한다.","pg":358},{"id":1874,"ch":43,"n":14,"q":"「소득세법」상 거주자의 비과세 주택임대소득과 관련하여 주택 수의 계산 및 주택임대소득의 산정할 때, 다가구주택은 구분 등기된 경우에는 각각을 1개의 주택으로 계산하지 않 는다.","a":"X","e":"「소득세법」상 거주자의 비과세 주택임대소득과 관련하 여 주택 수의 계산 및 주택임대소득의 산정할 때, 다가구 주택은 1개의 주택으로 보되, 구분 등기된 경우에는 각각 을 1개의 주택으로 계산한다.","pg":358},{"id":1875,"ch":43,"n":15,"q":"「소득세법」상 거주자의 비과세 주택임대소득과 관련하여 주택 수의 계산 및 주택임대소득의 산정할 때, 공동소유하는 주택의 기준시가가 12억원을 초과하는 경우로서 그 주택의 지분을 100분의 30 초과 보유하는 사람은 법령에 따라 공동 소유의 주택을 소유하는 것으로 계산되지 않는 경우라도 그 의 소유로 계산한다.","a":"O","e":"","pg":358},{"id":1876,"ch":43,"n":16,"q":"타인으로부터 전세받은 주택을 전전세하는 경우, 전세받은 자가 소유하는 주택의 수를 계산함에 있어서 그 전세받은 주택은 이에 합산하지 아니한다.","a":"X","e":"타인으로부터 전세받은 주택을 전전세하는 경우, 전세받 은 자가 소유하는 주택의 수를 계산함에 있어서 그 전세 받은 주택도 이에 합산한다.","pg":358},{"id":1877,"ch":43,"n":17,"q":"임차 또는 전세받은 주택을 전대하거나 전전세하는 경우에 는 당해 임차 또는 전세받은 주택을 임차인 또는 전세받은 자의 주택으로 계산한다.","a":"O","e":"","pg":358},{"id":1878,"ch":43,"n":18,"q":"해당 과세기간에 주거용 건물 임대업에서 발생한 소득금액 의 합계액이 2천만원 이하인 자의 주택임대소득은 분리과세 와 종합과세 중과세방법을 선택할 수 있다.","a":"X","e":"해당 과세기간에 주거용 건물 임대업에서 발생한 수입금 액의 합계액이 2천만원 이하인 자의 주택임대소득은 분 리과세와 종합과세 중과세방법을 선택할 수 있다.","pg":359},{"id":1879,"ch":43,"n":19,"q":"거주자의사업소득에 대한 총수입금액은 해당 사업과 관련 하여 과세기간에 수입하였거나 수입할 금액의 합계액을 말 한다.","a":"O","e":"","pg":359},{"id":1880,"ch":43,"n":20,"q":"「소득세법」은 자산수증이익과 채무면제이익이 사업과 관련 된 경우에만 총수입금액에 산입하나 「법인세법」은 사업과 관련이 없는 경우에도 익금에 산입한다.","a":"O","e":"","pg":359},{"id":1881,"ch":43,"n":21,"q":"복식부기의무자가 사업용 유형자산(양도소득세 과세대상임) 을 양도하는 경우 그 양도가액을 양도일이 속하는 과세기간 의 사업소득금액을 계산할 때에 층수입금액에 산입한다.","a":"X","e":"복식부기의무자가 사업용 유형자산을 양도하는 경우 그 양도가액을 양도일이 속하는 과세기간의 사업소득금액을 계산할 때에 총수입금액에 산입한다. 다만, 양도소득세 과세대상인 경우에는 양도소득으로 과 세되므로 사업소득 총수입금액에 산입하지 아니한다.","pg":359},{"id":1882,"ch":43,"n":22,"q":"사업과 관련된 자산수증이익과 채무면제이익 중 이월결손금 의 보전에 충당된 금액은 일반사업소득을 계산할 때 총수입 금액에 산입한다.","a":"X","e":"사업과 관련된 자산수증이익과 채무면제이익 중 이월결 손금의 보전에 충당된 금액은 일반사업소득을 계산할 때 총수입금액에 산입하지 아니한다.","pg":359},{"id":1883,"ch":43,"n":23,"q":"거주자의사업소득금액을 계산할 때 이전 과세기간으로부터 이월된 소득금액은 해당 과세기간의 소득금액을 계산할 때 총수입금액에 산입하지 아니한다. 380 제6편 소득세법","a":"O","e":"","pg":359},{"id":1884,"ch":43,"n":24,"q":"건설업을 경영하는 거주자가 자기가 생산한 물품을 자기가 도급받은 건설공사의 자재로 사용한 경우 그 사용된 부분에 상당하는 금액은 해당 과세기간의 소득금액을 계산할 때 총 수입금액에 산입한다.","a":"X","e":"건설업을 경영하는 거주자가 자기가 생산한 물품을 자기 가 도급받은 건설공사의 자재로 사용한 경우 그 사용된 부분에 상당하는 금액은 해당 과세기간의 소득금액을 계 산할 때 총수입금액에 산입하지 아니한다.","pg":360},{"id":1885,"ch":43,"n":25,"q":"부가가치세매출세액은 해당 과세기간의 소득금액을 계산할 때 총수입금액에 산입한다.","a":"X","e":"부가가치세매출세액은 예수금이다. 따라서 해당 과세기 간의 소득금액을 계산할 때 총수입금액에 산입하지 아니 한다.","pg":360},{"id":1886,"ch":43,"n":26,"q":"거주자가 소득세 또는 개인지방소득세를 환급받았거나 환급 받을 금액 중 다른 세액에 충당한 금액은 해당 과세기간의 소득금액을 계산할 때 총수입금액에 산입한다.","a":"X","e":"거주자가 소득세 또는 개인지방소득세를 환급받았거나 환급받을 금액 중 다른 세액에 충당한 금액은 해당 과세 기간의 소득금액을 계산할 때 총수입금액에 산입하지 아 니한다.","pg":360},{"id":1887,"ch":43,"n":27,"q":"사업자가 상품을 판매하면서 그 대가로 제조업자. 생산업자 로부터 그 제조 · 생산하는 물품을 인도받은 때에는 해당 사 업자가 판매하는 상품의 판매가액을 총수입금액에 산입되는 것으로 한다.","a":"X","e":"사업자가 상품을 판매하면서 그 대가로 제조업자·생산 업자로부터 그 제조 생산하는 물품을 인도받은 때에는 그 제조업자. 생산업자의 판매가액을 총수입금액에 산입 되는 것으로 한다.","pg":360},{"id":1888,"ch":43,"n":28,"q":"법인은 추계에 의한 간주임대료 계산에서 건설비상당액을 보증금 등에서 공제하지 않으나, 개인은 추계에 의한 간주임 대료 계산에서 건설비상당액을 보증금 등에서 공제한다.","a":"X","e":"법인과 개인 모두 추계에 의한 간주임대료 계산에서 건설 비상당액을 보증금 등에서 공제하지 아니한다.","pg":360},{"id":1889,"ch":43,"n":29,"q":"「소득세법」상 주택의 간주임대료는 어떠한 경우에도 계산하 지 않는다.","a":"X","e":"주택의 간주임대료를 계산하지 않는 것이 원칙이지만, 3. 주택이상을 소유하고, 해당 주택보증금의 합계액이 3억 원을 초과하는 경우와 해당 과세기간의 기준시가 12억원 초과인 주택을 2주택 이상 소유하고 해당 주택의 보증금 의 합계액이 12억원을 초과하는 경우 간주임대료를 계산 한다.","pg":360},{"id":1890,"ch":43,"n":30,"q":"사업소득금액 계산 시 필요경비에 산입할 금액은 해당 과세 기간의 총수입금액에 대응하는 비용으로서 일반적으로 용인 되는 통상적인 것의 합계액으로 한다.","a":"O","e":"","pg":361},{"id":1891,"ch":43,"n":31,"q":"사업소득금액을 계산할 때, 해당 과세기간 전의 총수입금액 에 대응하는 비용으로서 그 과세기간에 확정된 것에 대해서 는 그 과세기간 전에 필요경비로 계상하지 아니한 것만 그 과세기간의 필요경비로 본다.","a":"O","e":"","pg":361},{"id":1892,"ch":43,"n":32,"q":"「부가가치세법」에 따른 간이과세자가 납부한 부가가치세액 은 필요경비에 산입하지 아니한다.","a":"X","e":"「부가가치세법」에 따른 간이과세자가 납부한 부가가치세 액은 필요경비에 산입한다.","pg":361},{"id":1893,"ch":43,"n":33,"q":"광고·선전을 목적으로 견본품 · 달력 · . 수첩 · 컵 · 부채 기 타 이와 유사한 물품을 불특정다수인에게 기증하기 위하여 지출한 비용[특정인에게 기증한 믈픔(개당 3만원 이하의 물 품은 제외한다)의 경우에는 연간 5만원 이내의 금액으로 한 정한다]은 필요경비에 산입할 수 있다.","a":"O","e":"","pg":361},{"id":1894,"ch":43,"n":34,"q":"「국민건강보험법」 및 「노인장기요양보험법」에 의한 직장가 입자로서 부담하는 사용자 본인의 보험료는 필요경비에 산 입하지 아니한다.","a":"X","e":"「국민건강보험법」 및 「노인장기요양보험법」에 의한 직장 가입자로서 부담하는 사용자 본인의 보험료는 필요경비 에 산입한다.","pg":361},{"id":1895,"ch":43,"n":35,"q":"법령에 따른 의무의 불이행에 대한 제재로서 부과되는 공과 금은 「소득세법」상 거주자가 과세기간에 지급하였거나 지급 할 금액 중 사업소득금액을 계산할 때 필요경비에 산입할 수 있다. 382 제6편 소득세법","a":"X","e":"법령에 따른 의무의 불이행에 대한 제재로서 부과되는 공 과금은 「소득세법」상 거주자가 과세기간에 지급하였거나 지급할 금액 중 사업소득금액을 계산할 때 필요경비에 산 입할 수 없다.","pg":361},{"id":1896,"ch":43,"n":36,"q":"업무와 관련하여 중대한 과실로 타인의 권리를 침해한 경우 에 지급되는 손해배상금은 「소득세법」상 거주자가 과세기간 에 지급하였거나 지급할 금액 중 사업소득금액을 계산할 때 필요경비에 산입한다.","a":"X","e":"업무와 관련하여 중대한 과실로 타인의 권리를 침해한 경 우에 지급되는 손해배상금은 「소득세법」상 거주자가 과세 기간에 지급하였거나 지급할 금액 중 사업소득금액을 계 산할 때 필요경비에 산입하지 않는다.","pg":362},{"id":1897,"ch":43,"n":37,"q":"통고처분에 따른 벌금 또는 과료에 해당하는 금액은 사업소 득금액을 계산할 때 필요경비에 산입하지 아니한다.","a":"O","e":"","pg":362},{"id":1898,"ch":43,"n":38,"q":"반출하였으나 판매하지 않은 제품에 대한 개별소비세의 미 납액(제품가액에 그 세액 상당액을 더하지 않음)은 사업소득 금액을 계산할 때 필요경비에 산입한다.","a":"X","e":"반출하였으나 판매하지 않은 제품에 대한 개별소비세의 미납액(제품가액에 그 세액 상당액을 더하지 않음)은 사 업소득금액을 계산할 때 필요경비에 산입하지 아니한다.","pg":362},{"id":1899,"ch":43,"n":39,"q":"선급비용은 일반사업소득을 계산할 때 필요경비에 산입된 다.","a":"X","e":"선급비용은 일반사업소득을 계산할 때 필요경비에 산입 되지 않는다.","pg":362},{"id":1900,"ch":43,"n":40,"q":"「법인세법」에서 대표자에 대한 인건비는 손금에 산입하고, 「소득세법」에서는 사업자에 대한 급여를 사업소득의 필요경 비에 산입한다.","a":"X","e":"「법인세법」에서 대표자에 대한 인건비는 손금에 산입하는 데 반하여, 「소득세법」에서는 사업자에 대한 급여를 사업 소득의 필요경비에 산입하지 아니한다.","pg":362},{"id":1901,"ch":43,"n":41,"q":"「소득세법」상 사업자 가족의 인건비는 해당 사업에 직접 종 사하더라도 필요경비로 인정되지 않는다.","a":"X","e":"「소득세법」상 사업자 가족의 인건비는 해당 사업에 직접 종사한 경우 필요경비로 인정된다.","pg":362},{"id":1902,"ch":43,"n":42,"q":"법인은 수입이자를 각 사업연도 소득금액 계산에서 익금에 산입하고, 개인(제조업 영위)은 사업소득금액 계산에서 이자 수익을 총수입금액에 산입한다.","a":"X","e":"법인은 수입이자를 각 사업연도 소득금액 계산에서 익금 에 산입하나, 개인(제조업 영위)은 사업소득금액 계산에 서 이자수익을 총수입금액에 산입하지 않는다. 이자수익 은 금융소득 총수입금액에 산입한다.","pg":362},{"id":1903,"ch":43,"n":43,"q":"법인은 유가증권처분손익을 각 사업연도 소득금액 계산에서 익금 또는 손금에 산입하고, 개인(제조업 영위)은 사업소득 금액 계산에서 유가증권처분손익을 총수입금액 또는 필요경 비에 산입한다.","a":"X","e":"법인은 유가증권처분손익을 각 사업연도 소득금액 계산 에서 익금 또는 손금에 산입하나, 개인(제조업 영위)은 사 업소득금액 계산에서 유가증권처분손익을 총수입금액 또 는 필요경비에 산입하지 않는다.","pg":363},{"id":1904,"ch":43,"n":44,"q":"시설개체·기술낙후로 인한 생산설비의 폐기손실(처분하지 않음)은 「법인세법」에서는 결산서에 계상하면 1,000원을 제 외한 금액을 손금으로 인정하지만, 「소득세법」에서는 폐기손 실(처분하지 않음)을 필요경비로 전액 산입한다.","a":"X","e":"시설개체·기술낙후로 인한 생산설비의 폐기손실(처분하 지 않음)은 「법인세법」에서는 결산서에 계상하면 1,000원 을 제외한 금액을 손금으로 인정하지만, 「소득세법」에서 는 폐기손실(치분하지 않음)을 필요경비 불산입한다.","pg":363},{"id":1905,"ch":43,"n":45,"q":"「소득세법」상 지급이자는 채권자가 불분명한 사채이자, 건설 자금이자, 초과인출금에 대한 지급이자, 업무무관자산 등에 대한 지급이자 순서로 부인한다.","a":"O","e":"","pg":363},{"id":1906,"ch":43,"n":46,"q":"지급일 현재 주민등록표등본에 의하여 그 거주사실이 확인 된 채권자가 차입금을 변제받은 후 소재불명이 된 경우 그 차입금의 이자는 사업소득금액을 계산할 때 필요경비에 산 입하지 아니한다.","a":"X","e":"채권자가 불분명한 차입금의 이자는 일반사업소득을 계 산할 때 필요경비에 산입되지 않는 항목이다. 그러나 지 급일 현재 주민등록표등본에 의하여 그 거주사실이 확인 된 채권자가 차입금을 변제받은 후 소재불명이 된 경우는 채권자가 불분명한 경우에 해당되지 아니하므로 필요경 비에 산입한다.","pg":363},{"id":1907,"ch":43,"n":47,"q":"사업용자산의 합계액이 부채의 합계액에 미달하는 경우에 그 미달하는 금액에 상당하는 부채의 지급이자로서 법령에 따라 계산한 금액은 사업소득금액을 계산할 때 필요경비에 산입한다.","a":"X","e":"사업용자산의 합계액이 부채의 합계액에 미달하는 경우 에 그 미달하는 금액에 상당하는 부채의 지급이자로서 법 령에 따라 계산한 금액은 사업소득금액을 계산할 때 필요 경비에 산입하지 아니한다.","pg":363},{"id":1908,"ch":43,"n":48,"q":"복식부기의무자가 업무용승용차를 처분하여 발생하는 손실 은 처분한 과세기간에 전액 필요경비에 산입한다.","a":"X","e":"복식부기의무자가 업무용승용차를 처분하여 발생하는 손 실로서 업무용 승용차별로 800만원을 초과하는 금액은 법 령으로 정하는 이월 등의 방법에 따라 필요경비에 산입한 다.","pg":363},{"id":1909,"ch":43,"n":49,"q":"거주자가 재고자산 또는 임목을 가사용으로 소비하거나 종 업원 또는 타인에게 지급한 경우 이를 소비하거나 지급하였 을 때의 가액에 해당하는 금액은 그 소비하거나 지급한 날 이 속하는 과세기간의 사업소득금액 또는 기타소득금액을 계산할 때 총수입금액에 산입하지 아니한다.","a":"X","e":"거주자가 재고자산 또는 임목을 가사용으로 소비하거나 종업원 또는 타인에게 지급한 경우 이를 소비하거나 지급 하였을 때의 가액에 해당하는 금액은 그 소비하거나 지급 한 날이 속하는 과세기간의 사업소득금액 또는 기타소득 금액을 계산할 때 총수입금액에 산입한다.","pg":364},{"id":1910,"ch":43,"n":50,"q":"거주자가 재고자산을 가사용으로 소비하거나 종업원 또는 타인에게 지급한 경우, 이를 매입하였을 때의 가액에 해당 하는 금액은 그 소비하거나 지급한 날이 속하는 과세기간의 사업소득금액 또는 기타소득금액을 계산할 때 총수입금액에 산입한다.","a":"X","e":"거주자가 재고자산을 가사용으로 소비하거나 종업원 또 는 타인에게 지급한 경우, 이를 소비하거나 지급하였을 때의 가액에 해당하는 금액은 그 소비하거나 지급한 날이 속하는 과세기간의 사업소득금액 또는 기타소득금액을 계산할 때 총수입금액에 산입한다.","pg":364},{"id":1911,"ch":43,"n":51,"q":"일시상각충당금에 대해서 「법인세법」과 「소득세법」 모두 결 산조정사항이 원칙이나 신고조정도 허용한다.","a":"X","e":"일시상각충당금에 대해서 「법인세법」은 신고조정도 허용 하지만 「소득세법」은 결산조정만 인정한다.","pg":364},{"id":1912,"ch":43,"n":52,"q":"사업자가 유형자산의 멸실로 인하여 보험금을 지급받아 그 멸실한 유형자산을 대체하여 같은 종류의 자산을 취득한 경 우 해당 자산의 가액 중 그 자산의 취득에 사용된 보험차익 상당액을 유형자산이 멸실된 날이 속하는 과세기간의 소득 금액을 계산할 때 필요 경비에 산입할 수 있다.","a":"X","e":"사업자가 유형자산의 멸실로 인하여 보험금을 지급받아 그 멸실한 유형자산을 대체하여 같은 종류의 자산을 취득 한 경우 해당 자산의 가액 중 그 자산의 취득에 사용된 보 험차익 상당액을 보험금을 받은 날이 속하는 과세기간의 소득금액을 계산할 때 필요 경비에 산입할 수 있다.","pg":364},{"id":1913,"ch":43,"n":53,"q":"「소득세법」과 「법인세법」 모두 기업업무추진비 한도액 계산 시사업장의 수와 관계없이 일괄하여 계산한다.","a":"X","e":"「법인세법」은 사업장의 수와 관계없이 법인별로 한도를 일괄하여 계산하지만, 「소득세법」에서는 사업장별 거래 내용이 구분될 수 있도록 장부에 기록한 경우 각 사업장 별로 한도를 계산한다.","pg":364},{"id":1914,"ch":43,"n":54,"q":"회사 외부로 유출된 것을 「법인세법」에서는 상여, 배당, 기타 사외유출 또는 기타소득으로 소득처분하나, 「소득세법」에서 는 별도 규정이 없어 소득처분을 하지 않는다.","a":"O","e":"","pg":364},{"id":1915,"ch":43,"n":55,"q":"법인과 개인은 사업과의 관련성과 무관하게 모든 자산수증 이익을 각사업연도 소득금액과 총수입금액에 각각 산입한 다.","a":"X","e":"법인은 자산수증이익을 각 사업연도 소득금액 계산에서 익금에 산입하나, 개인은 사업소득금액 계산에서 사업과 관련이 있는 자산수증이익만 총수입금액에 산입한다.","pg":365},{"id":1916,"ch":43,"n":56,"q":"개인사업자의 사업소득 계산 시 거래상대방으로부터 판매장 려금을 받은 경우와 판매장려금을 거래상대방에 지급한 경 우 모두 총수입금액과 필요경비에 산입되지 않는다.","a":"X","e":"개인사업자의 사업소득 계산 시 거래상대방으로부터 관 매장려금을 받은 경우 총수입금액에 산입되며, 판매장려 금을 거래상대방에 지급한 경우에는 필요경비에 산입된 다.","pg":365},{"id":1917,"ch":43,"n":57,"q":"필요경비의 귀속도는 그 필요경비가 발생된 날이 속하는 과세기간으로 한다.","a":"X","e":"총수입금액과 필요경비의 귀속연도는 권리의무확정주의 에 따라 그 총수입금액과 필요경비가 확정된 날이 속하는 과세기간으로 한다.","pg":365},{"id":1918,"ch":43,"n":58,"q":"제품의 판매의 수입시기는 그 제품을 인도한 날이다.","a":"O","e":"","pg":365},{"id":1919,"ch":43,"n":59,"q":"사업소득으로 과세되는 상품의 위탁판매로 인한 소득의 경 우에는 위탁자가 그 위탁품을 판매하는 날을 수입시기로 한 다.","a":"X","e":"사업소득으로 과세되는 상품의 위탁판매로 인한 소득의 경우에는 수탁자가 그 위탁품을 판매하는 날을 수입시기 로 한다.","pg":365},{"id":1920,"ch":43,"n":60,"q":"무인판매기에 의한 판매의 수입시기는 당해 사업자가 무인 판매기에서 물품을 판매할 때이다.","a":"X","e":"무인판매기에 의한 판매의 수입시기는 당해 사업자가 무 인판매기에서 현금을 인출하는 때이다.","pg":365},{"id":1921,"ch":43,"n":61,"q":"어음의 할인의 수입시기는 그 어음의 양도일로 하되, 만기 전에 그 어음을 양도하는 때에는 그 만기일이다.","a":"X","e":"어음의 할인의 수입시기는 그 어음의 만기일로 하되, 만 기 전에 그 어음을 양도하는 때에는 그 양도일이다.","pg":365},{"id":1922,"ch":43,"n":62,"q":"한국표준산업분류상의 금융보험업에서 발생하는 이자의 수 입시기는 결산을 확정할 때 이자를 수익으로 계상한 날이다. 386 제6편 소득세법","a":"X","e":"금융보험업에서 발생하는 이자 및 할인액의 수입시기는 실제로 수입된 날로 한다. 1","pg":365},{"id":1923,"ch":43,"n":63,"q":"금융보험업에서 발생하는 이자 및 할인액의 수입시기는 실 제로 수입된 날로 한다.","a":"O","e":"","pg":366},{"id":1924,"ch":43,"n":64,"q":"자산을 임대하거나 지역권·지상권을 설정하여 발생하는 소 득의 경우로서 계약에 의하여 지급일이 정하여진 것은 지급 받은 날이 속하는 과세기간을 수입시기로 한다.","a":"X","e":"자산을 임대하거나 지역권. 지상권을 설정하여 발생하는 소득의 경우로서 계약에 의하여 지급일이 정하여진 것은 계약에 따라 정하여진 날이 속하는 과세기간을 수입시기 로 한다.","pg":366},{"id":1925,"ch":43,"n":65,"q":"원천징수 대상 사업소득을 지급하는 자가 국가·지방자치단 체·지방자치단체조합 · 법인·법인으로 보는 단체 · 개인사 업자 또는 사업자가 아닌 개인인 경우에는 원천징수를 해야 한다.","a":"X","e":"원천징수대상 사업소득을 지급하는 자가 국가·지방자치 단체·지방자치단체조합 · 법인·법인으로 보는 단체 또 는 개인사업자인 경우에는 원천징수를 해야 한다. 즉, 사 업자 여부를 구분하지 않고 소득을 지급하는 모든 자가 원천징수의무자인 「법인세법」과는 달리 「소득세법」은 사 업자가 아닌 개인의 경우 원천징수 의무가 없다.","pg":366},{"id":1926,"ch":43,"n":66,"q":"부가가치세법 시행령에 따른 조제용역의 공급으로 발생하는 사업소득 중 재정경제부령으로 정하는 바에 따라 계산한 의 약품가격이 차지하는 비율에 상당하는 소득은 원천징수대상 사업소득이다.","a":"X","e":"부가가치세법 시행령에 따른 조제용역의 공급으로 발생 하는 사업소득 중 재정경제부령으로 정하는 바에 따라 계 산한 의약품가격이 차지하는 비율에 상당하는 소득은 원 천징수대상에서 제외한다.","pg":366},{"id":1927,"ch":43,"n":67,"q":"사업자가 음식・숙박용역이나 서비스용역을 공급하고 그 대 가를 받을 때 소득세법 시행령에 따른 일정한 봉사료를 함 께 받아 해당 소득자에게 지급하는 경우에는 그 사업자가 그 봉사료에 대한 소득세를 원천징수하여야 한다.","a":"O","e":"","pg":366},{"id":1928,"ch":43,"n":68,"q":"외국인 직업운동가가 한국표준산업분류에 따른 스포츠클럽 운영업 중 프로스포츠구단과의 계약(계약기간이 3년 이하인 경우로 한정함)에 따라 용역을 제공하고 받는 소득에 대한 원천징수세율은 100분의 20으로 한다.","a":"X","e":"외국인 직업운동가가 한국표준산업분류에 따른 스포츠 클럽운영업 중 프로스포츠구단과의 계약(계약기간에 관 계 없이)에 따라 용역을 제공하고 받는 소득에 대한 원천 징수세율은 100분의 20으로 한다.","pg":366},{"id":1929,"ch":43,"n":69,"q":"「 문 방 매 판 에 등 한 관 률 법 」 에 여 하 의 원 후 문 방 매 판 직 조 에 원 매 판 로 으 입 가 여 하 원 후 문 방 업 매 판 을 행 수 고 하 원 후 당 수 등 을 는 받 자 업 사 의 업 사 득 소 에 여 하 대 로 초 최 말 연 산 정 을 는 려 하 천 원 수 징 자 무 의 는 당 해 세 과 간 기 의 일 료 종 지 까 업 사 득 소 액 세 말 연 산 정 서 청 신 를 장 업 사 할 관 서 무 세 장 게 에 출 제 하 여야 다 한 . OX 71 말 연 산 정 업 사 득 소 을 급 지 는 하 천 원 수 징 자 무 의 는 말 연 산 정 일 이 는 하 속 달 의 일 말 지 까 천 원 수 징 증 수 영 을 당 해 자 업 사 에 게 급 발 야 여 하 다 한 . OX 72 외 국 로 근 득 소 이 는 있 는 자 세 납 합 조 을 직 조 할 수 나 으 있 농 · 축 · 물 산 수 업 매 판 자 ( 식 복 기 부 자 무 의 가 님 아 ) 에 당 해 하 는 자 주 거 는 세 납 합 조 을 직 조 할 수 다 없 .","a":"X","e":"1 7 X 제 출 D 1 K N I L 오 다 진 1 9 5 . p 법 세 2 3 4 4 . p 말 연 산 정 업 사 득 소 을 급 지 는 하 천 원 수 징 자 무 의 는 말 연 정 일 산 이 는 하 속 달 의 음 다 달 일 말 지 까 천 원 수 징 증 수 영 을 당 해 자 업 사 게 에 급 발 야 여 하 다 한 . 2 7 X 제 출 | D C K N I L 오 다 진 p.- 법 세 2 p . 2 4 4 외 국 로 근 득 소 이 는 있 자 만 뿐 라 니 아 농 · 축 · 물 산 수 판 매 자 업 ( 식 복 기 부 자 무 의 가 님 아 ) 에 당 해 는 하 자 주 거 도 납 세 합 조 을 직 조 할 수 다 있 .","pg":367},{"id":1930,"ch":44,"n":1,"q":"「법인세법」에 따라 상여로 처분된 금액은 「소득세법」상 근로 소득으로 한다.","a":"O","e":"","pg":368},{"id":1931,"ch":44,"n":2,"q":"퇴직함으로써 받는 소득으로서 퇴직소득에 속하지 아니하는 소득은 근로소득으로 한다.","a":"O","e":"","pg":368},{"id":1932,"ch":44,"n":3,"q":"대학에 재직하고 있는 교직원이 지급받는 직무발명보상금은 기타소득에 해당한다.","a":"X","e":"대학에 재직하고 있는 교직원이 지급받는 직무발명보상 금은 근로소득에 해당한다.","pg":368},{"id":1933,"ch":44,"n":4,"q":"사회통념상 타당하다고 인정되는 범위의 경조금은 이를 지 급받은 자의 근로소득으로 한다.","a":"X","e":"사회통념상 타당하다고 인정되는 범위의 경조금은 이를 지급받은 자의 근로소득으로 보지 아니한다.","pg":368},{"id":1934,"ch":44,"n":5,"q":"독립된 지위에서 근로를 제공하였다 하더라도 근로를 제공 하고 받은 대가는 근로소득으로 본다.","a":"X","e":"근로를 제공하고 받은 대가라 하더라도 독립된 지위에서 근로를 제공하였다면 그 대가는 근로소득으로 보지 않는 다","pg":368},{"id":1935,"ch":44,"n":6,"q":"사업자나 법인이 생산 공급하는 재화.용역을 그 사업자 나 법인(계열회사 포함)의 사업장에 종사하는 임원. 종업원 에게 시가보다 낮은 가격으로 제공하거나 구입할 수 있도록 지원함으로써 해당 임원. 종업원이 얻는 이익은 근로소득으 로 본다.","a":"O","e":"","pg":368},{"id":1936,"ch":44,"n":7,"q":"기밀비·판공비 · . 교제비 기타 이와 유사한 명목으로 받는 것으로서 업무를 위하여 사용한 것이 분명하지 아니한 급여 는 근로소득으로 보지 않는다.","a":"X","e":"기밀비·판공비·교제비 기타 이와 유사한 명목으로 받 는 것으로서 업무를 위하여 사용한 것이 분명하지 아니한 급여는 근로소득으로 본다.","pg":368},{"id":1937,"ch":44,"n":8,"q":"종업원이 받는 공로금. 위로금 · 개업축하금·학자금 기타 이와 유사한 성질의 급여는 「소득세법」상 기타소득의 범위 에 포함된다.","a":"X","e":"종업원이 받는 공로금 · 위로금 · 개업축하금·학자금 기 타 이와 유사한 성질의 급여는 「소득세법」상 근로소득의 범위에 포함된다. 근로에 대한 대가로 받은 것이라면 그 명칭 또는 그 지급 방법과 관계없이 근로소득으로 본다.","pg":369},{"id":1938,"ch":44,"n":9,"q":"대기업의 종업원이 주택의 구입에 소요되는 자금을 무상으 로 대여 받음으로써 얻는 이익은 근로소득에 포함된다.","a":"O","e":"","pg":369},{"id":1939,"ch":44,"n":10,"q":"공무원이 국가 또는 지방자치단체로부터 공무 수행과 관 련하여 받는 상금과 부상은 근로소득으로 보지 아니한다.","a":"X","e":"공무원이 국가 또는 지방자치단체로부터 공무 수행과 관 련하여 받는 상금과 부상은 근로소득으로 본다.","pg":369},{"id":1940,"ch":44,"n":11,"q":"비출자임원(상장법인의 소액주주임원 포함)과 종업원이 주 택(주택에 부수된 토지 포함)의 구입 · 임차 소요되는 자금을 저리 또는 무상으로 대여받음으로써 얻은 이익은 비과세한 다.","a":"X","e":"모든 종업원(중소기업에 근무하는 종업원으로서 중소기 업과 친족관계 등에 해당하지 아니하는 자는 제외)이 주 택과 그 부수토지의 구입 · 임차에 소요되는 자금을 저리 또는 무상으로 대여받음으로써 얻는 이익은 근로소득으 로 본다. 비교 중소기업 종업원으로서 중소기업과 친족관계 등에 해당하지 아니하는 자가 주택(주택에 부수된 토지 포함)의 구입·임차 소요되는 자금을 저리 또는 무상으로 대여받음으로써 얻은 이익은 비과세함 20","pg":369},{"id":1941,"ch":44,"n":12,"q":"법인의 임원 또는 종업원이 해당 법인으로부터 부여받은 주 식매수선택권을 해당 법인에서 근무하는 기간 중 행사함으 트써 얻은 이익(주식매수선택권을 부여받을 당시의 시가와 실제 매수가액과의 차액을 말하며, 주식에는 신주인수권을 제외한다)은 근로소득에 해당한다.","a":"X","e":"법인의 임원 또는 종업원이 해당 법인으로부터 부여받은 주식매수선택권을 해당 법인에서 근무하는 기간 중 행사 함으로써 얻은 이익(주식매수선택권 행사 당시의 시가와 실제 매수가액과의 차액을 말하며, 주식에는 신주인수권 을 포함한다)은 근로소득에 해당한다. 야","pg":369},{"id":1942,"ch":44,"n":13,"q":"근로자가 퇴직 전에 부여받은 주식매수선택권을 퇴직 후에 행사함으로써 얻은 이익은 근로소득으로 과세한다.","a":"X","e":"근로자가 퇴직 전에 부여받은 주식매수선택권을 퇴직 후 에 행사하거나 고용관계 없이 주식매수선택권을 부여받 아 이를 행사함으로써 얻은 이익은 기타소득으로 과세한 다. 비교 해당 법인 등에서 근무하는 기간 중에 주식매수선택권을 행사 함으로써 얻은 이익은 근로소득으로 과세함","pg":370},{"id":1943,"ch":44,"n":14,"q":"퇴직급여로 지급되기 위하여 사용자가 적립한 급여 중 근로 자가 적립금액 등을 선택할 수 없는 것으로서 법령으로 정 하는 방법에 따라 적립되는 급여는 근로소득에 포함된다.","a":"X","e":"퇴직급여로 지급되기 위하여 사용자가 적립한 급여 중 근 로자가 적립금액 등을 선택할 수 없는 것으로서 법령으로 정하는 방법에 따라 적립되는 급여는 근로소득에 포함하 지 않는다. ... 444 적립 시 과세되지 않고 수령 시 퇴직급여 또는 연금 소득으로 과세됨","pg":370},{"id":1944,"ch":44,"n":15,"q":"사용자 부담금을 기초로 하여 현실적인 퇴직을 원인으로 지 급받는 소득은 근로소득이다.","a":"X","e":"사용자 부담금을 기초로 하여 현실적인 퇴직을 원인으로 지급받는 소득은 퇴직소득이다.","pg":370},{"id":1945,"ch":44,"n":16,"q":"근로의 제공으로 인한 부상·질병·장애· 사망 등과 관련 하여 근로자 · 선원 및 그 유족이 지급받는 배상. 보상 또는 위자의 성질이 있는 급여는 비과세한다.","a":"O","e":"","pg":370},{"id":1946,"ch":44,"n":17,"q":"기초생활수급자인 휴학생이 대학으로부터 받는 근로장학금 은 「소득세법」상 비과세소득에 해당된다.","a":"X","e":"재학하는 대상생이 지급받는 근로장학금은 비과세소득에 해당하지만 유학생이 지급받는 근로장학금은 비과세소득 에 해당하지 않는다.","pg":370},{"id":1947,"ch":44,"n":18,"q":"「산업재해보상보험법」에 따라 수급권자가 받는 휴업급여는 비과세하지만, 고용보험법」에 따라 받는 육아휴직급여는 과 세 대상 근로소득이다.","a":"X","e":"「산업재해보상보험법」에 따라 수급권자가 받는 휴업급여 와 「고용보험법」에 따라 받는 육아휴직급여는 비과세한 다.","pg":370},{"id":1948,"ch":44,"n":19,"q":"근로자의 자녀에 대한 학자금으로서 법령에 따른 학교(외국 에 있는 이와 유사한 교육기관을 포함)와 직업능력개발훈련 시설의 입학금, 수업료 그 밖의 공납금으로서 법에 정한 요 건을 갖춘 학자금(해당 과세기간에 납입할 금액을 한도로 함)은 비과세한다.","a":"X","e":"근로자에 대한 학자금으로서 학교(외국에 있는 이와 유 사한 교육기관을 포함)와 직업능력개발훈련시설의 입학 금. 수업료, 그 밖의 공납금으로서 법에 정한 요건을 갖 춘 학자금(해당 과세기간에 납입할 금액을 한도로 함)은 비과세한다. 근로자 본인에 대한 학자금이 아닌 것은 과 세하므로 자녀에 대한 학자금은 근로소득으로 과세한다.","pg":371},{"id":1949,"ch":44,"n":20,"q":"일직료·숙직료 또는 여비로서 실비변상정도의 금액(종업 원이 소유하거나 본인 명의로 임차한 차량을 종업원이 직접 운전하여 사용자의 업무수행에 이용하고 시내출장 등에 소 요된 실제여비를 받는 대신에 그 소요경비를 해당 사업체의 규칙 등으로 정하여진 지급기준에 따라 받는 금액 증월 20 만원 이내의 금액을 포함)은 비과세 된다.","a":"O","e":"","pg":371},{"id":1950,"ch":44,"n":21,"q":"출자임원과 직원이 사택을 무상 또는 저가로 제공받음으로 써 얻는 이익은 근로소득으로 본다.","a":"X","e":"출자임원(소액주주 제외)이 사택을 무상 또는 저가로 제 공받음으로써 얻는 이익은 근로소득으로 본다. 비출자임 원(소액주주 포함) 또는 직원이 무상 또는 저가로 제공받 은 사택은 근로소득으로 보지 아니한다.","pg":371},{"id":1951,"ch":44,"n":22,"q":"주주인 임원이 법령으로 정하는 사택을 제공받음으로써 얻 는 이익이지만 근로소득으로 과세하지 않는 경우도 있다.","a":"O","e":"소액주주(1% 미만)임원이 제공받는 사택제공이익은 비과 세소득이다.","pg":371},{"id":1952,"ch":44,"n":23,"q":"임직원의 업무상 과실(고의나 중과실 제외)로 인한 손해배상 청구를 지급사유로 하는 손해배상보험료를 사용자가 부담하 는 금액은 근로소득으로 본다. Ox 392 제6편 소득세법","a":"X","e":"임직원의 업무상 과실(고의나 중과실 제외)로 인한 손해 배상청구를 보험금의 지급사유로 하고 임직원을 피보험 자로 하는 보험의 보험료를 사용자(회사)가 부담한 금액 은 비과세한다.","pg":371},{"id":1953,"ch":44,"n":24,"q":"종업원의 사망. 상해 또는 질병을 보험금의 지급사유로 하 고종업원을 피보험자와 수익자로 하는 단체순수보장성보험 의 보험료 중 연 70만원 이하의 금액으로서 사용자(회사)가 부담한 금액은 비과세한다.","a":"O","e":"","pg":372},{"id":1954,"ch":44,"n":25,"q":"계약기간 만료 전 또는 만기에 종업원에게 귀속되는 단체환 급부보장성보험의 환급금은 「소득세법」상 과세되는 근로소 득에 포함되지 않는다.","a":"X","e":"계약기간 만료 전 또는 만기에 종업원에게 귀속되는 단체 환급부보장성보험의 환급금은 「소득세법상 과세되는 근 로소득에 포함된다.","pg":372},{"id":1955,"ch":44,"n":26,"q":"공무원이 국가 또는 지방자치단체로부터 공무 수행과 관련 하여 받는 상금과 부상은 비과세 기타소득이다.","a":"X","e":"공무원이 국가 또는 지방자치단체로부터 공무 수행과 관 련하여 받는 상금과 부상은 연간 210만원까지 비과세 근 로소득이다.","pg":372},{"id":1956,"ch":44,"n":27,"q":"대학의 교직원 또는 대학과 고용관계가 있는 학생이 소속 대학에 설치된 산학협력단으로부터 받는 직무발명보상금으 로서 연 700만원 이하의 금액은 비과세한다.","a":"O","e":"참고 500만원→700만원으로 개정되었으니 꼭 챙겨가자","pg":372},{"id":1957,"ch":44,"n":28,"q":"근로자가 사내급식의 방법으로 제공받는 식사는 월 10만원 한도로 근로소득에서 비과세한다.","a":"X","e":"근로자가 사내급식 또는 이와 유사한 방법으로 제공받는 식사 기타 음식물은 전액 비과세한다. 444 식사 기타 음식물을 제공받지 아니하는 근로자가 받는 식사대는 월 20만원 한도로 근로 소득에서 비과세함","pg":372},{"id":1958,"ch":44,"n":29,"q":"근로자 또는 그 배우자의 출산으로 받는 급여로서 월 20만 원 이하의 금액은 비과세한다.","a":"X","e":"근로자 또는 그 배우자의 출산과 관련하여 자녀의 출생 일 이후 2년 이내에 사용자로부터 법령으로 정하는 바에 따라 최대 두 차례에 걸쳐 지급받는 급여(2021년 1월 1일 이후 출생한 자녀에 대하여 2024년 1월 1일부터 2024년 12월 31일 사이에 지급받은 급여를 포함)는 전액 비과세 한다.","pg":372},{"id":1959,"ch":44,"n":30,"q":"생산직 및 관련직에 종사하는 법정 근로자로 월정급여액 210만원 이하이면서 직전과세기간의 총급여액이 3천만원 이하인 근로자가 받는 시간외근무수당은 법정금액을 한도로 비과세한다.","a":"X","e":"생산직 및 관련직에 종사하는 법정 근로자로 월정급여액 260만원 이하이면서 직전과세기간의 총급여액이 3천 7 백만원 이하인 근로자가 받는 시간외근무수당은 법정금 액을 한도로 비과세한다.","pg":373},{"id":1960,"ch":44,"n":31,"q":"6세 이하(해당 과세기간 종료일을 기준으로 판단) 자녀의 보 육과 관련하여 받는 금액으로서 자녀수와 무관하게 월 20만 원 이내의 금액은 비과세 근로소득에 해당한다.","a":"X","e":"6세 이하(해당 과세기간 개시일을 기준으로 판단) 자녀의 보육과 관련하여 받는 자녀 1명당 월 20만원 이내의 금액 은 비과세 근로소득에 해당한다. ・26년 개정사항으로 자녀수에 따라 월 20만원씩 보육수당을 비과 세함으로 주의하자.","pg":373},{"id":1961,"ch":44,"n":32,"q":"임원. 종업원에 대한 할인금액 중 법정 요건을 만족하는 할 인액 중 연간 200만원을 한도로 임원·종업원이 해당 과세 기간 동안 시가보다 낮은 가격으로 제공받거나 지원받아 구 입한 재화·용역의 시가를 합한 금액의 10%는 비과세 근로 소득에 해당한다.","a":"X","e":"임원. 종업원에 대한 할인금액 중 법정 요건을 만족하는 할인액 중 연간 240만원을 한도로 임원. 종업원이 해당 과세기간 동안 시가보다 낮은 가격으로 제공받거나 지원 받아 구입한 재화·용역의 시가를 합한 금액의 20%는 비 과세 근로소득에 해당한다.","pg":373},{"id":1962,"ch":44,"n":33,"q":"근로소득이 있는 거주자에 대해서는 총급여액에서 근로소득 공제를 적용하여 근로소득금액을 계산한다.","a":"O","e":"","pg":373},{"id":1963,"ch":44,"n":34,"q":"근로소득의 경우에는 근로소득과 관련되어 실제 지출된 필 요경비와 상관없이 일정한 금액을 총급여액에서 공제하여 근로소득금액을 구한다. 이때 근로기간이 1년 미만인 경우에 는 근로소득공제는 근속월수로 월할계산한다.","a":"X","e":"근로소득의 경우에는 근로소득과 관련되어 실제 지출된 필요경비와 상관없이 일정한 금액을 총급여액에서 공제 하여 근로소득금액을 구한다. 이때 근로기간이 1년 미만 인 경우에도 근로소득 공제는 월할계산하지 않는다.","pg":373},{"id":1964,"ch":44,"n":35,"q":"일용근로자의 경우 총급여액에서 공제하는 근로소득공제는 연간 2천만원을 한도로 한다. OX 394 제6편 소득세법","a":"X","e":"상용근로자의 경우 총급여액에서 공제하는 근로소득공제 는 연간 2천만원을 한도로 한다.","pg":373},{"id":1965,"ch":44,"n":36,"q":"법령으로 정하는 일용근로자의 근로소득은 근로소득을 지급 할 때 원천징수하고 종합소득 과세표준을 계산할 때 합산한 다.","a":"X","e":"법령으로 정하는 일용근로자의 근로소득은 근로소득을 지급할 때 원천징수는 하지만 종합소득 과세표준을 계산 할 때 합산하지는 않는다.","pg":374},{"id":1966,"ch":44,"n":37,"q":"일용근로자에게는 근로소득공제를 적용하지 않는다.","a":"X","e":"일용근로자에게는 1일 15만원의 근로소득공제를 적용한 다. (다만, 총급여액이 공제액에 미달하는 경우에는 그 총 급여액을 공제액으로 한다)","pg":374},{"id":1967,"ch":44,"n":38,"q":"일용근로자의 근로소득에 대해서 원천징수를 하는 경우에는 근로소득세액공제를 적용하지 아니한다.","a":"X","e":"일용근로자의 근로소득에 대해서 원천징수를 하는 경우 에는 해당 근로소득에 대해 산출세액의 100분의 55에 해 당하는 금액을 근로소득세액공제로 적용한다.","pg":374},{"id":1968,"ch":44,"n":39,"q":"근로소득으로 보는 임원퇴직소득 한도초과액의 수입시기는 현실적으로 퇴직한 날이다.","a":"X","e":"근로소득으로 보는 임원퇴직소득 한도초과액의 수입시기 는 지급받거나 지급받기로 한 날이다.","pg":374},{"id":1969,"ch":44,"n":40,"q":"잉여금 처분에 의한 상여의 수입시기는 해당 사업연도 중의 근로를 제공하는 날이다.","a":"X","e":"잉여금 처분에 의한 상여의 수입시기는 해당 법인의 잉여 금처분결의일이다.","pg":374},{"id":1970,"ch":44,"n":41,"q":"「법인세법」에 따라 발생한 인정상여가 임원 등에 대한 근로 소득으로 과세되는 경우에는 해당 법인의 결산확정일을 그 수입시기로 한다.","a":"X","e":"「법인세법」에 따라 발생한 인정상여가 임원 등에 대한 근 로소득으로 과세되는 경우에는 해당 사업연도 중의 근로 를 제공하는 날을 그 수입시기로 한다.","pg":374},{"id":1971,"ch":44,"n":42,"q":"일용근로자의 근로소득은 종합소득과세표준을 계산할 때 합 산하지 않고 분리과세한다.","a":"O","e":"","pg":374},{"id":1972,"ch":44,"n":43,"q":"공적연금 관련법에 따라 받는 각종 연금도 연금소득에 해당 한다.","a":"O","e":"","pg":375},{"id":1973,"ch":44,"n":44,"q":"공적연금소득은 2002년 1월 1일 이후에 납입된 연금 기여금 및 사용자 부담금(국가 또는 지방자치단체의 부담금을 포함 한다)을 기초로 하거나 2002년 1월 1일 이후 근로의 제공을 기초로 하여 받는 연금소득으로 한다.","a":"O","e":"","pg":375},{"id":1974,"ch":44,"n":45,"q":"「산업재해보상보험법」에 따라 받는 각종 연금은 과세소득이 다.","a":"X","e":"「산업재해보상보험법」에 따라 받는 각종 연금은 비과세소 득이다.","pg":375},{"id":1975,"ch":44,"n":46,"q":"연금계좌의 운용실적에 따라 증가된 금액을 연금계좌에서 연금수령한 소득은 성격에 따라 이자 또는 배당소득으로 본다.","a":"X","e":"연금계좌의 운용실적에 따라 증가된 금액을 연금계좌에 서 연금외수령한 소득은 소득의 성격에도 불구하고 연금 소득으로 과세한다.","pg":375},{"id":1976,"ch":44,"n":47,"q":"공적연금소득의 수입시기는 연금수령한 날이다.","a":"X","e":"공적연금소득의 수입시기는 「공적연금 관련법」에 따라 공 적연금을 지급받기로 한 날이다.","pg":375},{"id":1977,"ch":44,"n":48,"q":"사적연금소득의 수입시기는 사적연금을 지급받기로 한 날이 다.","a":"X","e":"사적연금소득의 수입시기는 연금을 수령한 날이다.","pg":375},{"id":1978,"ch":44,"n":49,"q":"연금소득금액은 해당 과세기간의 총연금액에서 법령에 따른 연금소득공제를 적용한 금액으로 한다. OX 396 제6편 소득세법","a":"O","e":"","pg":375},{"id":1979,"ch":44,"n":50,"q":"공적연금소득을 지급하는 자가 연금소득의 일부 또는 전부 를 지연하여 지급하면서 지연지급에 따른 이자를 함께 지 급하는 경우 해당 이자는 공적연금소득으로 보지 아니한다.","a":"X","e":"공적연금소득을 지급하는 자가 연금소득의 일부 또는 전 부를 지연하여 지급하면서 지연지급에 따른 이자를 함께 지급하는 경우 해당 이자는 공적연금소득으로 본다.","pg":376},{"id":1980,"ch":44,"n":51,"q":"공적연금의 경우 2002.1.1.(과세 기준일) 이후부터 과세로 전 환되었으므로 연금수령액 중 과세연금액은 '과세기준일 이 후 기여금 납입월수'가 '총기여금 납입월수'에서 차지하는 비율에 따라서 분할하여 계산한다.","a":"X","e":"공적연금의 경우 2002.1.1. (과세 기준일) 이후부터 과세 로 전환되었으므로 연금수령액 중 과세연금액은 총납입 기간의 환산소득 누계액에서 과세기준일 이후 납입기간 의 환산소득 누계액의 비율에 따라서 안분하여 계산한다.","pg":376},{"id":1981,"ch":44,"n":52,"q":"연금계좌에서 인출된 금액이 연금수령한도를 초과하는 경우 에는 연금외수령분이 먼저 인출되고 그 다음으로 연금수령 분이 인출되는 것으로 본다.","a":"X","e":"연금계좌에서 인출된 금액이 연금수령한도를 초과하는 경우에는 연금수령분이 먼저 인출되고 그 다음으로 연금 외수령분이 인출되는 것으로 본다.","pg":376},{"id":1982,"ch":44,"n":53,"q":"연금계좌에서 일부 금액이 인출되는 경우 인출순서는 이연 퇴직소득 -> 과세제외금액 ― 연금계좌세액공제를 받은 납 입액 및 운용수익 순서로 인출되는 것으로 한다.","a":"X","e":"연금계좌에서 일부 금액이 인출되는 경우 인출순서는 과 세제외금액→ 이연퇴직소득 - 연금계좌세액공제를 받 은 납입액 및 운용수익 순서로 인출되는 것으로 한다.","pg":376},{"id":1983,"ch":44,"n":54,"q":"공적연금소득만 있는 자는 다른 종합소득이 없는 경우라 하 더라도 과세표준확정신고를 하여야 한다.","a":"X","e":"공적연금소득만 있는 경우 연말정산으로 과세가 종결되 0 기 때문에 확정신고를 하지 않아도 된다.","pg":376},{"id":1984,"ch":44,"n":55,"q":"연금소득이 있는 거주자에 대해서는 해당 과세기간에 받은 총연금액(분리과세 연금소득을 포함)에서 실제 지출된 필요 경비와 상관없이 일정한 금액을 총연금액에서 공제한다.","a":"X","e":"연금소득이 있는 거주자에 대해서는 해당 과세기간에 받 은 총연금액(분리과세 연금소득은 제외)에서 실제 지출된 필요경비와 상관없이 일정한 금액을 총연금액에서 공제 한다.","pg":376},{"id":1985,"ch":44,"n":56,"q":"연금계좌에서 인출하는 금액이 연금수령요건을 충족한 경우 퇴직연금계좌 인출액이든 연금저축계좌 인출액이든 연금소 득공제를 적용한다.","a":"X","e":"연금계좌에서 인출하는 금액이 연금수령요건을 충족한 경우 퇴직연금계좌 인출액은 분리과세대상이므로 연금소 득공제를 적용하지 않고, 종합과세되는 연금계좌인출액 만 연금소득공제를 적용한다.","pg":377},{"id":1986,"ch":44,"n":57,"q":"연금소득공제액이 9백만원을 초과하는 경우에는 9백만원을 공제한다.","a":"O","e":"","pg":377},{"id":1987,"ch":44,"n":58,"q":"이연퇴직소득을 연금수령하는 연금소득의 금액은 종합소득 과세표준을 계산할 때 합산하지 아니한다.","a":"O","e":"","pg":377},{"id":1988,"ch":44,"n":59,"q":"납입 시 연금계좌세액공제를 받은 연금계좌납입액과 연금계 좌의 운용실적에 따라 증가된 금액을 의르목적, 천재지변이 나 그 밖의 부득이한 사유 등 법에 정한 요건을 갖추어 인출 하는 경우에는 기타소득으로 과세하며 무조건 종합과세한 다.","a":"X","e":"납입 시 연금계좌세액공제를 받은 연금계좌납입액과 연 금계좌의 운용실적에 따라 증가된 금액을 의료목적, 천재 지변이나 그 밖의 부득이한 사유 등 법에 정한 요건을 갖 추어 인출하는 경우에는 연금소득으로 과세하며 무조건 분리과세한다.","pg":377},{"id":1989,"ch":44,"n":60,"q":"사적연금을 연금수령하는 경우로서 연금소득 연 1,500만원 이하인 경우에는 무조건 분리과세를 하여야 한다. O:X","a":"X","e":"사적연금을 연금수령하는 경우로서 연금소득이 연 1,500 만원 이하인 경우에는 분리과세를 선택할 수 있다. 참고 1,200만원 -> 1,500만원으로 개정되었으니 꼭 챙겨가자","pg":377},{"id":1990,"ch":44,"n":61,"q":"국민연금 등 공적연금은 해당 과세기간의 다음 연도 2월분 연금소득을 지급할 때(해당 과세기간 중에 사망한 경우에는 사망일이 속하는 달의 다음 달 말일까지) 연말정산을 한다. OX 398 제6편 소득세법","a":"X","e":"국민연금 등 공적연금은 해당 과세기간의 다음 연도 1월 분 연금소득을 지급할 때(해당 과세기간 중에 사망한 경 우에는 사망일이 속하는 달의 다음다음 달 말일까지) 연 말정산을 한다. \"사적연금소득은 연말정산을 하지 않음 주의","pg":377},{"id":1991,"ch":44,"n":62,"q":"연금계좌의 운용실적에 따라 증가된 금액을 그 소득의 성격 에도 불구하고 연금저축계좌 또는 퇴직연금계좌에서 법령상 정하는 연금형태로 인출하는 경우의 그 연금은 기타소득에 해당한다.","a":"X","e":"연금계좌의 운용실적에 따라 증가된 금액을 그 소득의 성 격에도 불구하고 연금저축계좌 또는 퇴직연금계좌에서 법령상 정하는 연금형태로 인출하는 경우의 그 연금은 연 금소득에 해당한다. 고 「소득세법」에 따라 세액공제를 받은 연금계좌 납입액 및 연금 계좌의 운용실적에 따라 증가된 금액을 그 소득의 성격에도 불구하 고연금수령한 소득은 기타소득으로 봄","pg":378},{"id":1992,"ch":44,"n":63,"q":"사망할 때까지 연금수령하는 법령으로 정하는 종신계약에 따라 받는 연금소득의 경우 3%의 원천징수세율을 적용한다.","a":"X","e":"사망할 때까지 연금수령하는 법령으로 정하는 종신계약 에 따라 받는 연금소득의 경우 1%의 원천징수세율을 적 용한다.","pg":378},{"id":1993,"ch":44,"n":64,"q":"이연퇴직소득을 연금수령하는 경우로서 실제수령연차가 10 년을 초과하는 경우 원천징수세율은 연금외수령 원천징수세 율의 70%가 된다.","a":"X","e":"이연퇴직소득을 연금수령하는 경우로서 실제수령연차가 10년을 초과하는 경우 원천징수세율은 연금수령 원천 징수세율의 60%가 된다. 1 실제수령연차가 10년 이하인 경우 707","pg":378},{"id":1994,"ch":44,"n":65,"q":"원천징수의무자가 공적연금소득을 지급할 때에는 연금소득 간이세액표에 따라 소득세를 원천징수한다. 0.x","a":"O","e":"","pg":378},{"id":1995,"ch":44,"n":66,"q":"뇌물 등 원천징수 대상이 아닌 기타소득은 기타소득금액이 300만원 이하인 경우에도 분리과세를 선택할 수 있다.","a":"X","e":"기타소득금액(무조건 분리과세, 무조건 종합과세 및 비 과세 제외)의 연간 합계액이 300만원 이하면 분리과세와 종합과세 중 거주자가 선택할 수 있다. 다만, 뇌물·알선수재·배임수재에 의하여 받는 금품은 무조건 종합과세 대상 기타소득이므로 분리과세를 선택 할 수 없다.","pg":378},{"id":1996,"ch":44,"n":67,"q":"기타소득은 열거주의에 따라 과세하기 때문에 법에 열거된 소득에 한하여 과세대상 소득으로 본다.","a":"O","e":"","pg":378},{"id":1997,"ch":44,"n":68,"q":"특정소득이 기타소득으로 법령에 열거된 것 중 어떤 소득에 해당하는지 여부는 기타소득금액에 영향을 미치지 않는다.","a":"X","e":"특정소득이 이자소득, 배당소득, 사업소득, 근로소득, 연 금소득, 퇴직소득, 양도소득에 해당하면 기타소득으로 보 지 않는다. 따라서 특정소득이 기타소득으로 법령에 열거 된 것 중 어떤 소득에 해당하는지 여부는 기타소득금액에 영향을 미친다.","pg":379},{"id":1998,"ch":44,"n":69,"q":"기타소득은 이자소득·배당소득· 사업소득 근로소득·연 금소득·퇴직소득 및 양도소득 외의 소득이어야 한다.","a":"O","e":"","pg":379},{"id":1999,"ch":44,"n":70,"q":"「사행행위 등 규제 및 처벌특례법」에서 규정하는 행위(적법 또는 불법 여부를 고려하여 적법인 경우만 과세함)에 참가하 여 얻은 재산상의 이익은 기타소득에 해당한다.","a":"X","e":"「사행행위 등 규제 및 처벌특례법」에서 규정하는 행위(적 빔 또는 불법 여부는 고려하지 아니함)에 참가하여 얻은 재산상의 이익은 기타소득에 해당한다.","pg":379},{"id":2000,"ch":44,"n":71,"q":"저작자 또는 실연자. 음반제작자 · 방송사업자가 저작권의 양도 또는 사용의 대가로 받는 금품은 기타소득으로 과세한 다.","a":"X","e":"저작자 또는 실연자. 음반제작자. · 방송사업자 외의 자가 저작권의 양도 또는 사용의 대가로 받는 금품은 기타소득 으로 과세한다. 비교 저작자 또는 실연자음반제작자·방송사업자가 본인의 사업과 관련된 저작권의 양도 또는 사용의 대가로 받는 금품은 사업소득으 로 과세함","pg":379},{"id":2001,"ch":44,"n":72,"q":"산업재산권·산업정보, 산업상 비밀, 상표권. 영업권(법령 으로 정하는 점포임차권 포함) 및 그 밖에 이와 유사한 자 산이나 권리를 양도하고 그 대가로 받은 금품은 양도소득에 해당하며 대여하고 그 대가로 받는 금품은 기타소득에 해당 한다.","a":"X","e":"산업재산권·산업정보, 산업상 비밀, 상표권 · 영업권(법 령으로 정하는 점포임차권 포함) 및 그 밖에 이와 유사한 자산이나 권리를 양도하거나 대여하고 그 대가로 받는 금 품은 기타소득에 해당한다.","pg":379},{"id":2002,"ch":44,"n":73,"q":"유가증권을 일시적으로 대여하고 사용료로서 받는 금품은 기타소득에 포함된다. OX 400 제6편 소득세법","a":"O","e":"","pg":379},{"id":2003,"ch":44,"n":74,"q":"지역권. 지상권(지하 또는 공중에 설정된 권리를 포함)을 설 정하거나 대여함으로써 발생하는 소득은 기타소득에 포함된 다.","a":"X","e":"지역권·지상권(지하 또는 공중에 설정된 권리를 포함)을 설정하거나 대여함으로써 발생하는 소득은 사업소득에 포함된다. 비교 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 따른 공익사업과 관련하여 지역관지상권(지하 또는 공중에 설정된 권리를 포함)을 설정하거나 대여함으로써 발생하는 소득은 기타소득에 포함 됨","pg":380},{"id":2004,"ch":44,"n":75,"q":"「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 따른 공익사업과 관련하여 지역권. 지상권(지하 또는 공중 에 설정된 권리를 포함한다)을 설정하거나 대여함으로써 발 생하는 소득은 사업소득에 해당한다.","a":"X","e":"「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 따른 공익사업과 관련하여 지역권. 지상권(지하 또는 공 중에 설정된 권리를 포함한다)을 설정하거나 대여함으로 써 발생하는 소득은 기타소득에 해당한다.","pg":380},{"id":2005,"ch":44,"n":76,"q":"유실물의 습득 또는 매장물의 발견으로 인하여 보상금을 받 거나 새로 소유권을 취득하는 경우 그 보상금 또는 자산은 기타소득에 해당한다.","a":"O","e":"","pg":380},{"id":2006,"ch":44,"n":77,"q":"소유자가 없는 물건의 점유로 소유권을 취득하는 자산은 「소득세법」상 과세대상 소득이 아니다.","a":"X","e":"소유자가 없는 물건의 점유로 소유권을 취득하는 자산은 「소득세법」상 기타소득에 해당한다.","pg":380},{"id":2007,"ch":44,"n":78,"q":"재산·신체·초상 또는 명예 등의 침해로 인하여 받은 손해 배상금이나 위자료는 기타소득에 해당한다.","a":"X","e":"계약의 위약. 해약으로 인하여 받는 위약금, 배상금, 부 당이득반환 시 지급받는 이자는 기타소득으로 보되 그 외 손해배상금(신체적·정신적 피해배상금, 명예훼손배 상금, 교통사고 배상금)이나 위자료 등은 과세대상 소득 으로 보지 않는다.","pg":380},{"id":2008,"ch":44,"n":79,"q":"비거주자의 법령으로 정하는 특수관계인이 그 특수관계로 인하여 그 비거주자로부터 받는 경제적 이익으로서 급여· 배당 또는 증여로 보지 아니하는 금품은 비과세한다.","a":"X","e":"비거주자의 법령으로 정하는 특수관계인이 그 특수관계 로 인하여 그 비거주자로부터 받는 경제적 이익으로서 급 여·배당 또는 증여로 보지 아니하는 금품은 기타소득에 해당한다.","pg":380},{"id":2009,"ch":44,"n":80,"q":"일시적 문예창작소득은 사업소득으로 분류한다.","a":"X","e":"일시적 문예창작소득은 기타소득으로 분류한다.","pg":381},{"id":2010,"ch":44,"n":81,"q":"공무원이 직무와 관련하여 받는 뇌물은 기타소득으로 과세 한다.","a":"O","e":"","pg":381},{"id":2011,"ch":44,"n":82,"q":"종교관련 종사자가 종교의식을 집행하는 등 종교관련 종사 자로서의 활동과 관련하여 대통령령으로 정하는 종교 단체 로부터 받은 소득(근로소득으로 원천징수하거나 과세표준확 정신고를 한 경우는 포함)은 기타소득에 포함된다.","a":"X","e":"종교관련 종사자가 종교의식을 집행하는 등 종교관련 종 사자로서의 활동과 관련하여 대통령령으로 정하는 종교 단체로부터 받은 소득(근로소득으로 원천징수하거나 과 세표준확정신고를 한 경우는 제외)은 기타소득에 포함된 다.","pg":381},{"id":2012,"ch":44,"n":83,"q":"「소득세법」에 따라 세액공제를 받은 연금계좌 납입액 및 연 금계좌의 운용실적에 따라 증가된 금액을 연금외수령한 소 득은 이자소득으로 본다.","a":"X","e":"「소득세법」에 따라 세액공제를 받은 연금계좌 납입액 및 연금계좌의 운용실적에 따라 증가된 금액을 그 소득의 성 격에도 불구하고 연금외수령한 소득은 기타소득으로 본 다.","pg":381},{"id":2013,"ch":44,"n":84,"q":"퇴직 전에 부여받은 주식매수선택권을 퇴직 후에 행사함으 르써 얻는 이익은 근로소득이 되고, 고용관계 없이 주식매수 선택권을 부여받아 이를 행사함으로써 얻는 이익은 기타소 득이 된다.","a":"X","e":"퇴직 전에 부여받은 주식매수선택권을 퇴직 후에 행사함 으로써 얻는 이익도 기타소득이 되고, 고용관계 없이 주 식매수선택권을 부여받아 이를 행사함으로써 얻는 이익 도 기타소득이 된다. 퇴직전에 부여받은 주식매수선택권을 퇴직 전에 행사함 으로써 얻는 이익이 근로소득이다.","pg":381},{"id":2014,"ch":44,"n":85,"q":"알선수재에 의하여 받는 금품은 기타소득이 되고, 재산권에 관한 알선수수료는 사업소득이 된다.","a":"X","e":"알선수재에 의하여 받는 금품 뿐만 아니라 재산권에 관한 알선수수료도 기타소득이다.","pg":381},{"id":2015,"ch":44,"n":86,"q":"「노동조합 및 노동관계조정법」을 위반하여 노동조합 전임 노동조합의 업무에만 종사하는 근로자)가 지급받는 급여 는 기타소득에 해당한다.","a":"O","e":"","pg":381},{"id":2016,"ch":44,"n":87,"q":"박물관이나 미술관에 서화 및 골동품을 양도하면서 발생하 는 소득은 기타소득에 해당한다.","a":"X","e":"박물관이나 미술관에 서화 및 골동품을 양도하면서 발생 하는 소득은 비과세한다.","pg":382},{"id":2017,"ch":44,"n":88,"q":"법령에 따른 위원회의 보수를 받지 아니하는 위원이 받는 수당은 과세되는 기타소득이다.","a":"X","e":"법령에 따른 위원회의 보수를 받지 아니하는 위원이 받는 20 수당은 비과세 기타소득이다.","pg":382},{"id":2018,"ch":44,"n":89,"q":"기타소득으로 과세되는 미술·음악 또는 사진에 속하는 창 작품에 대한 대가로 원작자가 받는 소득의 경우에는 그 지 급을 받은 날을 수입시기로 한다.","a":"O","e":"","pg":382},{"id":2019,"ch":44,"n":90,"q":"「법인세법」에 의하여 기타소득으로 소득처분된 금액은 그 법인의 해당 사업연도 종료일을 수입시기로 한다.","a":"X","e":"「법인세법」에 의하여 기타소득으로 소득처분된 금액은 그 법인의 해당 사업연도 결산확정일을 수입시기로 한다.","pg":382},{"id":2020,"ch":44,"n":91,"q":"광업권 어업권 등을 양도하고 그 대가로 받는 금품은 그 지급받은 날을 수입시기로 한다.","a":"X","e":"광업권 어업권 등을 양도하고 그 대가로 받는 금품은 대 금청산일. 인도일·사용수익일 중 빠른 날을 수입시기로 한다. 광업권 어업권 등을 대여하고 그 대가로 받은 금품은 그 지급을 받은 날을 수입시기로 한다.","pg":382},{"id":2021,"ch":44,"n":92,"q":"「한국마사회법」에 따른 승마투표권의 구매자가 받는 환급금 에 대해서는 그 구매자가 구입한 적중된 투표권의 단위투표 금액을 필요경비로 한다.","a":"O","e":"","pg":382},{"id":2022,"ch":44,"n":93,"q":"계약의 위약 또는 해약으로 인하여 받는 위약금과 배상금의 경우 필요경비를 별도로 입증하지 못하더라도 총수입금액의 100분의 80을 인정한다. OLX","a":"X","e":"계약의 위약 또는 해약으로 인하여 받는 위약금과 배상금 중 주택입주지체상금의 경우만 필요경비를 별도로 입증 하지 못하더라도 총수입금액의 100분의 80을 인정한다.","pg":382},{"id":2023,"ch":44,"n":94,"q":"계약의 위약 또는 해약으로 인하여 받는 소득으로서 위약금 과 배상금 중 주택입주 지체상금에 대해서는 실제 소요된 필요경비가 거주자가 받은 금액의 100분의 80에 상당하는 금액을 초과하면 그 초과하는 금액은 필요경비에 산입하지 아니한다.","a":"X","e":"계약의 위약 또는 해약으로 인하여 받는 소득으로서 위약 금과 배상금 중 주택입주 지체상금에 대해서는 실제 소요 된 필요경비와 거주자가 받은 금액의 100분의 80에 상당 하는 금액 중 큰 금액을 적용한다. 따라서 실제 소요된 필 요경비가 거주자가 받은 금액의 100분의 80에 상당하는 금액을 초과하면 그 초과하는 금액은 필요경비에 산입한 다.","pg":383},{"id":2024,"ch":44,"n":95,"q":"거주자는 「공익법인의 설립·운영에 관한 법률」의 적용을 받는 공익법인이 주무관청의 승인을 받아 시상하는 상금에 대해서 최소 80% 이상의 필요경비를 인정받을 수 있다.","a":"O","e":"","pg":383},{"id":2025,"ch":44,"n":96,"q":"고용관계 없는 자가 다수인에게 강연하고 지급받는 강연료 의 경우 필요경비를 별도로 입증하지 못하더라도 총수입금 액의 100분의 80을 인정한다.","a":"X","e":"고용관계 없는 자가 다수인에게 강연하고 지급받는 강연 료의 경우 필요경비를 별도로 입증하지 못하더라도 총수 입금액의 100분의 6)을 인정한다.","pg":383},{"id":2026,"ch":44,"n":97,"q":"일간지에 기고하고 받은 원고로 등 일시적인 문예창작소득 의 필요경비산입액은 거주자가 받은 금액의 100분의 80에 상당하는 금액과 실제 소요된 필요경비 중 큰 금액으로 한 다.","a":"X","e":"일간지에 기고하고 받은 원고료 등 일시적인 문예창작소 득의 필요경비산입액은 거주자가 받은 금액의 100분의 60에 상당하는 금액과 실제 소요된 필요경비 중 큰 금액 으로 한다.","pg":383},{"id":2027,"ch":44,"n":98,"q":"보유기간이 10년 미만이며 양도가액 1억원 초과분에 대한 기타소득으로 보는 서화. 골동품의 양도소득의 필요경비산 입액은 거주자가 받은 금액의 100분의 90에 상당하는 금액 과 실제 소요된 필요경비 중 큰 금액으로 한다.","a":"X","e":"보유기간이 10년 미만이며 양도가액 1억원 초과분에 대 한 기타소득으로 보는 서화 · 골동품의 양도소득의 필요 경비산입액은 거주자가 1억을 초과하여 받은 금액의 100 분의 80에 상당하는 금액에 9,000만원을 더한 금액과 실 제 소요된 필요경비 중 큰 금액으로 한다.","pg":383},{"id":2028,"ch":44,"n":99,"q":"슬롯머신 등을 이용하는 행위에 참가하여 받는 당첨금품 등 에 대하여는 그 당첨금품 등의 당첨 당시에 슬롯머신 등에 투입한 금액을 필요경비로 한다.","a":"O","e":"","pg":383},{"id":2029,"ch":44,"n":100,"q":"체육진흥투표권의 구매자가 받는 환급금으로서 투표권의 권 면에 표시된 금액의 합계액이 100만원 이하이고 단위투표금 액당 환급금이 단위투표금액의 10배 이하이면서 적중한 개 별투표당 환급금이 200만원 이하인 경우에는 소득세를 과 세하지 아니한다.","a":"X","e":"체육진흥투표권의 구매자가 받는 환급금으로서 투표권의 권면에 표시된 금액의 합계액이 10만원 이하이고 단위투 표금액당 환급금이 단위투표금액의 100배 이하이면서 적 중한 개별투표당 환급금이 200만원 이하인 경우에는 소 득세를 과세하지 아니한다.","pg":384},{"id":2030,"ch":44,"n":101,"q":"필요경비가 적용된 기타소득금액(연금계좌에서 연금외수령 하는 기타소득금액 제외)이 건별로 1만원 이하인 경우 소득 세를 과세하지 않으나 슬롯머신 및 투전기 등에 대한 당첨 금품은 건별로 500만원 이하인 경우 소득세를 과세하지 않 는다.","a":"X","e":"필요경비가 적용된 기타소득금액(연금계좌에서 연금외수 령하는 기타소득금액 제외)이 건별로 5만원 이하인 경우 소득세를 과세하지 않으나 슬롯머신 및 투전기 등에 대한 당첨금품은 건별로 200만원 이하인 경우 소득세를 과세 하지 않는다.","pg":384},{"id":2031,"ch":44,"n":102,"q":"계약금이 위약금 . 배상금으로 대체되는 경우 그 위약금 배 상금은 20% 세율로 소득세를 원천징수한다.","a":"X","e":"계약금이 위약금 배상금으로 대체되는 경우 그 위약 금·배상금은 원천징수 대상에 해당하지 아니한다.","pg":384},{"id":2032,"ch":44,"n":103,"q":"법령으로 정하는 서화 · 골동품의 양도로 발생하는 소득은 원천징수 대상에서 제외되며 무조건 종합과세한다.","a":"X","e":"법령으로 정하는 서화 · 골동품의 양도로 발생하는 소득 은 20% 세율로 원천징수하고 무조건 분리과세 대상으로 원천징수 납세의무가 종결된다.","pg":384},{"id":2033,"ch":44,"n":104,"q":"3억원을 초과하는 복권당첨금은 20%의 세울로 원천징수하 고 무조건 분리과세하므로 종합소득금액에 합산되는 기타소 득이 아니다.","a":"X","e":"복권당첨금은 20%(3억원을 초과분은 30%)의 세율로 원 천징수하고 무조건 분리과세하므로 종합소득금액에 합산 되는 기타소득이 아니다.","pg":384},{"id":2034,"ch":44,"n":105,"q":"종교인소득은 기타소득으로 보되, 근로소득으로 원천징수하 거나 과세표준확정신고를 한 경우에는 해당 소득을 근로소 득으로 본다.","a":"O","e":"","pg":384},{"id":2035,"ch":44,"n":106,"q":"종교 관련 종사자가 현실적인 퇴직을 원인으로 종교단체로 부터 지급받는 소득은 기타소득으로 과세한다. 406 제6편 소득세법","a":"X","e":"종교 관련 종사자가 현실적인 퇴직을 원인으로 종교단체 로부터 지급받는 소득은 퇴직소득으로 과세한다. 비교 종교 관련 종사자가 현실적인 퇴직 이후에 종교단체로부터 정 기적 또는 부정기적으로 지급받은 소득으로서 퇴직소득에 해당하지 않은 것은 기타소득 근로소득으로 보는 종교인소득에 포함함","pg":385},{"id":2036,"ch":45,"n":1,"q":"납세지 관할 세무서장 또는 지방국세청장은 배당소득(공동 사업에서 발생한 소득금액 중 출자공동사업자의 손익분배비 율에 해당하는 배당소득금액만 해당), 사업소득 또는 기타소 득이 있는 거주자의 행위 또는 계산이 그 거주자와 특수관 계인과의 거래로 인하여 그 소득에 대한 조세 부담을 부당 하게 감소시킨 것으로 인정되는 경우에는 그 거주자의 행위 또는 계산과 관계없이 해당 과세기간의 소득금액을 계산할 수 있다.","a":"O","e":"","pg":386},{"id":2037,"ch":45,"n":2,"q":"직계존비속에게 주택을 무상으로 사용하게 하고 직계존비속 이 해당 주택에 실제 거주하는 경우, 부당행위계산부인 규정 을 적용하여 임대료의 시가에 해당하는 금액에 대하여 소득 세를 과세한다.","a":"X","e":"직계존비속에게 주택을 무상으로 사용하게 하고 직계존 비속이 해당 주택에 실제 거주하는 경우, 부당행위계산을 적용하지 않는다.","pg":386},{"id":2038,"ch":45,"n":3,"q":"직계존비속과 형제·자매에게 주택을 무상으로 사용하게 하 고 해당 가족이 그 주택에 실제 거주하는 경우에는 부당행 위계산 부인을 적용하지 않되, 그 주택에 관련된 경비는 가 사 관련 경비로 보아 필요경비 불산입한다.","a":"X","e":"직계존비속에게 주택을 무상으로 사용하게 하고 직계존 비속이 그 주택에 실제 거주하는 경우에는 부당행위계산 부인을 적용하지 않되, 그 주택에 관련된 경비는 가사 관 련 경비로 보아 필요경비 불산입한다. 형제 자매는 이에 해당되지 않는다.","pg":386},{"id":2039,"ch":45,"n":4,"q":"출자공동사업자의 배당소득은 부당행위계산부인 규정이 적용되는 소득이다.","a":"O","e":"","pg":386},{"id":2040,"ch":45,"n":5,"q":"부당행위계산의 부인규정이 적용되는 종합소득은 출자공동 사업자의 손익분배비율에 해당하는 배당소득, 이자소득, 사 업소득 또는 기타소득이 해당된다.","a":"X","e":"부당행위계산의 부인규정이 적용되는 종합소득은 출자공 동사업자의 손익분배비율에 해당하는 배당소득, 사업소 득 또는 기타소득이 해당된다. 따라서 이자소득은 해당되 지 않는다.","pg":386},{"id":2041,"ch":45,"n":6,"q":"배당소득과 이자소득은 필요경비가 인정되지 않는 소득이 다. 따라서 배당소득과 이자소득 전체는 부당행위계산 부인 의 대상이 되는 소득으로 규정되어 있지 않다.","a":"X","e":"이자소득은 부당행위계산 부인의 대상이 되는 소득이 아 니다. 그러나 배당소득 중 출자공동사업자의 배당소득은 부당행위계산부인의 대상이 된다. 그 외의 배당소득은 부 당행위계산부인의 대상이 되는 소득이 아니다.","pg":387},{"id":2042,"ch":45,"n":7,"q":"과세표준의 계산과정이 세법의 규정대로 이루어지는 퇴직소 득은 부당행위계산 부인의 대상이 되는 소득으로 규정되어 있지 않다.","a":"O","e":"","pg":387},{"id":2043,"ch":45,"n":8,"q":"근로소득만 있는 자가 특수관계인의 사업장에서 무상으로 근로를 제공하는 것은 「소득세법」상 부당행위계산부인 대상 에 해당한다.","a":"X","e":"「소득세법」상 부당행위계산의 부인 대상이 되는 소득은 배당소득(출자공동사업자의 배당소득에 한함), 사업소득, 기타소득, 양도소득에 한한다. 따라서 근로소득은 부당행 위계산부인 대상에 해당하지 아니한다.","pg":387},{"id":2044,"ch":45,"n":9,"q":"제조업 영위 개인사업자가 여유 자금을 인출하여 부친에게 무상으로 대여한 경우에는 부당행위계산 부인의 대상이 되 나. 부친으로부터 높은 이자율(시가의 2배)로 사업자금을 차 입하여 그 이자를 필요경비에 산입한 경우에는 부당행위계 산부인의 대상이 되지 않는다.","a":"X","e":"제조업 영위 개인사업자가 여유 자금을 인출하여 부친에 게 무상으로 대여한 경우에는 이자소득에 대하여 부당행 위 계산이 적용되지 않으므로, 해당 이자소득은 부당행위 계산 부인의 대상이 되지 않는다. 그러나 부친으로부터 높은 이자율(시가의 2배)로 사업자금을 차입하여 그 이자 를 필요경비에 산입한 경우에는 사업소득이 부당행위계 산부인의 대상이 되므로, 해당 지급이자는 부당행위계산 부인의 대상이 된다.","pg":387},{"id":2045,"ch":45,"n":10,"q":"대금업자가 아닌 거주자가 특수관계인에게 금전을 무상으로 대여한 경우 부당행위계산의 부인 대상이 아니다.","a":"X","e":"대금업자가 아닌 거주자가 특수관계인에게 금전을 무상 으로 대여한 경우 비영업대금이익으로, 이자소득에 대하 여 부당행위계산의 부인 대상이 아니다.","pg":387},{"id":2046,"ch":45,"n":11,"q":"부동산임대업(주거용 건물 임대업 제외)에서 발생한 이월결 손금은 부동산임대업에서 발생한 소득금액, 근로소득금액, 연금소득금액, 기타소득금액, 이자소득금액, 배당소득금액에 서 순차로 공제한다. OX 408 제6편 소득세법","a":"X","e":"부동산임대업(주거용 건물 임대업 제외)에서 발생한 이월 결손금은 부동산임대업의 소득금액에서만 공제한다.","pg":387},{"id":2047,"ch":45,"n":12,"q":"주거용 건물 임대업에서 발생한 결손금은 해당 과세기간의 종합소득 과세표준을 계산할 때 공제하지 아니한다.","a":"X","e":"주거용 건물 임대업에서 발생한 결손금은 해당 과세기간 의 종합소득 과세표준을 계산할 때 일반 사업소득의 결손 금과 동일하게 공제한다.","pg":388},{"id":2048,"ch":45,"n":13,"q":"해당 과세기간의 사업소득금액을 계산할 때 발생한 결손금 은 그 과세기간의 종합소득 과세표준을 계산할 때 이자소득 금액·배당소득금액·근로소득금액·연금소득금액· 기타 소득금액에서 순서대로 공제한다.","a":"X","e":"해당 과세기간의 사업소득금액을 계산할 때 발생한 결손 금은 그 과세기간의 종합소득 과세표준을 계산할 때 근로 소득금액·연금소득금액· 기타소득금액. 이자소득금 액·배당소득금액에서 순서대로 공제한다.","pg":388},{"id":2049,"ch":45,"n":14,"q":"「국세기본법」
